<!DOCTYPE html>
<html lang="es">
<head>
    <script src="/lamda-cloud-runtime.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Ventas y Presupuestos - LAMDA</title>
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" href="/img/isotipo_L_LAMDA.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="apple-touch-icon" href="/img/isotipo_L_LAMDA.png">
    <meta name="apple-mobile-web-app-title" content="LAMDA">
    <meta name="application-name" content="LAMDA">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/mobile.css?v=15">
    <link rel="stylesheet" href="css/comercial.css?v=15">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/env-config.js?v=2"></script>
    <style>
        .presupuestos-page {
            background-color: #0f172a;
            min-height: 100vh;
            padding-bottom: 2rem;
            color: #f8fafc;
            overflow-x: hidden;
        }
        
        .hero-section {
            padding: 2rem 1.5rem 1.5rem;
            text-align: center;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-crear-presupuesto {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 1.1rem 1.75rem;
            border-radius: 1rem;
            font-size: 1.15rem;
            font-weight: 800;
            text-decoration: none;
            box-shadow: 0 10px 20px -3px rgba(16, 185, 129, 0.35);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 1.25rem;
            width: 100%;
            justify-content: center;
        }

        .btn-crear-presupuesto:active {
            transform: scale(0.97);
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
        }

        /* Tabs Móviles */
        .tabs-container {
            display: flex;
            background: #1e293b;
            padding: 0.4rem;
            margin: 1.25rem 0.85rem 1rem;
            border-radius: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            z-index: 10;
        }

        .tab-btn {
            flex: 1;
            padding: 0.65rem;
            text-align: center;
            font-weight: 700;
            color: #94a3b8;
            border-radius: 0.65rem;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .tab-btn.active {
            background: #059669;
            color: white;
            box-shadow: 0 2px 8px rgba(5, 150, 105, 0.35);
        }

        .recientes-container {
            padding: 0 0.85rem 2rem;
            box-sizing: border-box;
            width: 100%;
            overflow-x: hidden;
        }

        .section-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: #f8fafc;
            margin-bottom: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .placeholder-card {
            background: #1e293b;
            border-radius: 1rem;
            padding: 2rem 1rem;
            text-align: center;
            color: #64748b;
            border: 1px dashed rgba(255, 255, 255, 0.12);
        }
    </style>
</head>
<body class="presupuestos-page">
    
    <!-- CABECERA PRINCIPAL -->
    <header class="mobile-header">
        <div class="header-top">
            <img src="/img/isotipo_L_LAMDA.png" alt="LAMDA" onclick="window.abrirSidebar(event)" title="Abrir Menú Principal" style="width: 36px; height: 36px; object-fit: contain; border-radius: 8px; background: rgba(255,255,255,0.08); padding: 3px; border: 1px solid rgba(255,255,255,0.15); cursor: pointer; box-shadow: 0 2px 8px rgba(16,185,129,0.3);">
            <h1 class="header-title">Ventas y Presupuestos</h1>
            <div style="width: 44px;"></div>
        </div>
    </header>

    <!-- SIDEBAR GLOBAL (Gestionado dinámicamente por mobile.js) -->

    <!-- CONTENIDO COMERCIAL -->
    <div class="hero-section">
        <div style="display:flex; justify-content:center; margin-bottom:0.75rem;">
            <img src="/img/isotipo_L_LAMDA.png" alt="LAMDA" style="width:50px; height:50px; border-radius:12px; background:rgba(255,255,255,0.08); padding:5px; border:1px solid rgba(255,255,255,0.12);">
        </div>
        <h2 style="font-size: 1.4rem; font-weight: 800; margin-bottom: 0.35rem; color:#f8fafc;">Ventas Búnker Móvil</h2>
        <p style="font-size: 0.85rem; color:#94a3b8; max-width:320px; margin:0 auto;">Catálogo de precios Búnker, presupuestos en caliente y envío instantáneo por WhatsApp.</p>
        
        <div style="display: flex; gap: 0.75rem; justify-content: center; margin-top: 1.25rem;">
            <a href="crear-presupuesto-movil.html" class="btn-crear-presupuesto" style="margin-top: 0; padding: 0.95rem; width: 100%; flex: 1;">
                <span style="font-size: 1.25rem;">➕</span> 
                <span style="font-size: 0.95rem;">Nueva Cotización</span>
            </a>
            <a href="crear-retiro-movil.html" class="btn-crear-presupuesto" style="margin-top: 0; padding: 0.95rem; width: 100%; flex: 1; background: linear-gradient(135deg, #d97706 0%, #b45309 100%); box-shadow: 0 10px 20px -3px rgba(217, 119, 6, 0.35);">
                <span style="font-size: 1.25rem;">📦</span> 
                <span style="font-size: 0.95rem;">Retirar</span>
            </a>
        </div>
    </div>

    <div class="tabs-container">
        <div class="tab-btn active" onclick="switchTabComercial('ventas')" id="tab-ventas">Cotizaciones</div>
        <div class="tab-btn" onclick="switchTabComercial('retiros')" id="tab-retiros">Retiros</div>
    </div>

    <div class="recientes-container">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem; margin-bottom: 0.85rem;">
            <h3 class="section-title" style="margin:0"><span>🕒</span> Historial de Operaciones</h3>
            <div style="display:flex; gap:0.5rem">
                <input type="date" id="filtro-fecha" class="wizard-input" style="padding:0.4rem 0.6rem; font-size:0.8rem; border-radius:0.5rem; height:auto; width:135px;" onchange="DashboardComercial.aplicarFiltroFecha()">
            </div>
        </div>
        
        <div id="historial-container">
            <div class="placeholder-card">
                <div style="font-size: 2rem; margin-bottom: 0.5rem;">📊</div>
                <p><strong>Cargando operaciones...</strong></p>
            </div>
        </div>

        <button id="btn-cargar-mas" class="btn-continue" style="display:none; margin-top:1rem; width:100%; padding: 0.8rem; font-size: 0.95rem; border-radius:0.75rem; background:#334155; box-shadow:none" onclick="DashboardComercial.cargarMas()">Cargar Más Antiguos ↓</button>
    </div>

    <!-- Scripts -->
    <script src="js/mobile.js?v=15"></script>
    <script src="js/controllers/PresupuestosDashboard.js?v=15"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!verificarSesion()) {
                window.location.href = 'index.html';
                return;
            }
            DashboardComercial.init();
        });
        
        function switchTabComercial(tab) {
            DashboardComercial.setTab(tab);
        }
    </script>
</body>
</html>
