<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centro de Nodos — Sistema LAMDA</title>
  <script src="/lamda-cloud-runtime.js"></script>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #1e40af;
      --primary-light: #eff6ff;
      --emerald: #15803d;
      --emerald-bg: #f0fdf4;
      --amber: #b45309;
      --amber-bg: #fffbeb;
      --danger: #b91c1c;
      --danger-bg: #fef2f2;
      --violet: #6d28d9;
      --violet-bg: #f5f3ff;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    .topbar {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      padding: 14px 22px;
      border-bottom: 1px solid #334155;
      position: sticky;
      top: 0;
      z-index: 80;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.14);
    }
    .topbar-inner {
      max-width: 1460px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .topbar-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .topbar-title h1 {
      margin: 0;
      font-size: 1.18rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .topbar-sub {
      font-size: 0.78rem;
      color: #94a3b8;
      margin-top: 2px;
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-top {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-top:hover { background: #334155; color: #ffffff; }
    .btn-top.primary { background: #2563eb; border-color: #3b82f6; color: #ffffff; }
    .btn-top.primary:hover { background: #1d4ed8; }

    .container {
      max-width: 1460px;
      margin: 0 auto;
      padding: 18px 20px 44px;
    }

    .main-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      background: #e2e8f0;
      padding: 5px;
      border-radius: 12px;
      width: fit-content;
      max-width: 100%;
      flex-wrap: wrap;
    }
    .main-tab-btn {
      padding: 10px 18px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: #334155;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    .main-tab-btn.active {
      background: #ffffff;
      color: #0f172a;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
    }
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      white-space: nowrap;
    }

    /* Node Selector Cards */
    .nodos-strip {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .nodo-selector-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.16s ease;
      position: relative;
      overflow: hidden;
    }
    .nodo-selector-card:hover {
      border-color: #94a3b8;
      transform: translateY(-1px);
    }
    .nodo-selector-card.selected {
      border-color: #2563eb;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.12);
      background: #fcfdff;
    }
    .nodo-accent-bar {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 5px;
    }

    /* Two-column Ficha layout */
    .ficha-grid {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 18px;
      align-items: start;
    }
    @media (max-width: 1120px) {
      .ficha-grid { grid-template-columns: 1fr; }
    }

    .panel-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    .panel-title {
      margin: 0 0 12px 0;
      font-size: 0.98rem;
      font-weight: 800;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    /* QR Access Boxes */
    .qr-access-box {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      background: #f8fafc;
      margin-bottom: 12px;
    }
    .qr-access-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 10px;
    }
    .qr-img-wrap {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
    }
    .qr-img-wrap img {
      width: 176px;
      height: 176px;
      object-fit: contain;
      cursor: zoom-in;
    }
    .url-mono {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.73rem;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 8px;
      color: #334155;
      word-break: break-all;
      margin-bottom: 8px;
    }
    .btn-row {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 11px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: #ffffff;
      color: #0f172a;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .btn:hover { background: #f1f5f9; }
    .btn.solid-blue { background: #2563eb; border-color: #2563eb; color: #ffffff; }
    .btn.solid-blue:hover { background: #1d4ed8; }
    .btn.solid-green { background: #16a34a; border-color: #16a34a; color: #ffffff; }
    .btn.solid-green:hover { background: #15803d; }
    .btn.solid-dark { background: #0f172a; border-color: #0f172a; color: #ffffff; }
    .btn.solid-dark:hover { background: #1e293b; }

    /* KPIs Commercial & Radar */
    .kpi-grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 11px;
      margin-bottom: 16px;
    }
    .kpi-grid-5 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .kpi-box {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 14px;
    }
    .kpi-label {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
    }
    .kpi-val {
      font-size: 1.48rem;
      font-weight: 900;
      color: var(--text);
      margin: 4px 0 2px;
    }
    .kpi-sub {
      font-size: 0.76rem;
      color: var(--muted);
    }

    /* Subtabs inside Ficha */
    .subtabs {
      display: flex;
      gap: 6px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .subtab-btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: #475569;
      font-family: inherit;
      font-size: 0.79rem;
      font-weight: 800;
      cursor: pointer;
    }
    .subtab-btn.active {
      background: #0f172a;
      border-color: #0f172a;
      color: #ffffff;
    }

    /* Tables */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.81rem;
    }
    th {
      background: #f8fafc;
      text-align: left;
      padding: 9px 11px;
      font-size: 0.72rem;
      text-transform: uppercase;
      color: #475569;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 9px 11px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: top;
    }
    tr:last-child td { border-bottom: none; }

    /* Radar Filter Toolbar */
    .radar-toolbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 16px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .pill-filter-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .pill-btn {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: #ffffff;
      color: #334155;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
    }
    .pill-btn.active {
      background: #1e40af;
      border-color: #1e40af;
      color: #ffffff;
    }

    .insights-grid-3 {
      display: grid;
      grid-template-columns: 1.25fr 1fr 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }
    @media (max-width: 1100px) {
      .insights-grid-3 { grid-template-columns: 1fr; }
    }

    /* Visitor Radar Accordion (B2B Style) */
    .visitor-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #ffffff;
      margin-bottom: 9px;
      overflow: hidden;
      transition: border-color 0.14s ease;
    }
    .visitor-card:hover { border-color: #94a3b8; }
    .visitor-card.bought { border-left: 4px solid #16a34a; }
    .visitor-card.abandoned { border-left: 4px solid #d97706; }
    .visitor-card.admin-dev { border-left: 4px solid #64748b; background: #fafaf9; }
    .visitor-summary {
      padding: 12px 15px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      list-style: none;
    }
    .visitor-summary::-webkit-details-marker { display: none; }
    .visitor-timeline {
      border-top: 1px solid var(--border);
      background: #f8fafc;
      padding: 10px 16px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.73rem;
      font-weight: 700;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: #334155;
    }

    /* Modal Zoom QR */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 300;
      padding: 18px;
    }
    .modal-box {
      background: #ffffff;
      border-radius: 16px;
      max-width: 460px;
      width: 100%;
      padding: 22px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.3);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-title">
        <div style="font-size:1.65rem;">🏘️</div>
        <div>
          <h1>Centro de Nodos</h1>
          <div class="topbar-sub">Fichas Contables Unificadas · Accesos QR Móviles · Radar de Tiendas y Conversión en Vivo</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button type="button" id="btn-top-nueva-tienda" class="btn-top" style="background:#16a34a; border-color:#15803d; color:#fff; font-weight:900;" onclick="abrirModalAbmTiendaCentro(null, null)">➕ Nueva Tienda / 🧬 Clonar</button>
        <a href="http://localhost:3000/" id="btn-top-menu-principal" class="btn-top">← Menú Principal</a>
        <a href="http://localhost:3002/pages/pizarra-simulacion.html?tab=nodos" id="btn-top-pizarra-nodos" class="btn-top">🎛️ Alta de Nodos y Pizarra</a>
        <a href="/deposito-nodos" id="btn-top-mesa-armado" class="btn-top">📦 Mesa de Armado</a>
        <a href="/liquidacion-nodos" id="btn-top-liquidacion-nodos" class="btn-top">💰 Liquidación y Cobros</a>
        <a href="http://localhost:3005/pages/listado-clientes.html" id="btn-top-clientes-bunker" class="btn-top">📒 Clientes Búnker</a>
        <button type="button" class="btn-top primary" onclick="recargarVistaActiva()">🔄 Actualizar</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px;">
      <div class="main-tabs" style="margin-bottom:0;">
        <button type="button" id="tab-btn-fichas" class="main-tab-btn active" onclick="cambiarTabPrincipal('fichas')">
          📋 Fichas de Nodos y Accesos
        </button>
        <button type="button" id="tab-btn-radar" class="main-tab-btn" onclick="cambiarTabPrincipal('radar')">
          📡 Radar en Vivo, Flujo de Nube y Estadísticas
          <span id="badge-radar-live" class="badge-pill" style="background:#dcfce7; color:#166534;">EN VIVO</span>
        </button>
      </div>
      <div id="status-pc-admin-box" style="display:flex; align-items:center; gap:8px; font-size:0.78rem;"></div>
    </div>

    <!-- ===================================================================== -->
    <!-- VISTA A: FICHAS INTEGRALES Y ACCESOS RÁPIDOS / QR POR NODO            -->
    <!-- ===================================================================== -->
    <section id="vista-fichas">
      <div id="nodos-cards-strip" class="nodos-strip">
        <div class="panel-card" style="grid-column:1/-1; text-align:center; color:var(--muted);">⏳ Cargando nodos activos...</div>
      </div>

      <div id="ficha-integral-container"></div>
    </section>

    <!-- ===================================================================== -->
    <!-- VISTA B: RADAR EN VIVO, FLUJO DE NUBE Y ESTADÍSTICAS POR NODO         -->
    <!-- ===================================================================== -->
    <section id="vista-radar" style="display:none;">
      <div class="radar-toolbar">
        <div class="pill-filter-group" id="radar-nodos-pills"></div>

        <div class="pill-filter-group">
          <select id="radar-rango-select" onchange="onCambioRangoRadar()"
            style="padding:6px 10px; border-radius:8px; border:1px solid var(--border-strong); font-family:inherit; font-size:0.8rem; font-weight:700; background:#fff;">
            <option value="hoy">📅 Día específico / Hoy</option>
            <option value="7d">📆 Últimos 7 días</option>
            <option value="30d">🗓️ Últimos 30 días</option>
            <option value="todo">♾️ Histórico completo</option>
          </select>

          <select id="radar-fecha-select" onchange="cargarRadarAnalitica()"
            style="padding:6px 10px; border-radius:8px; border:1px solid var(--border-strong); font-family:inherit; font-size:0.8rem; font-weight:700; background:#fff;">
          </select>

          <select id="radar-audiencia-select" onchange="cargarRadarAnalitica()"
            style="padding:6px 10px; border-radius:8px; border:1px solid var(--border-strong); font-family:inherit; font-size:0.8rem; font-weight:800; background:#eff6ff; color:#1e3a8a;">
            <option value="clientes">👥 Solo Clientes Reales (Conversión Pura)</option>
            <option value="admin_gestor">🛠️ Solo Dispositivos Admin / Gestor</option>
            <option value="todos">🌐 Todos los ingresos (Clientes + Admin + Bots)</option>
          </select>

          <button type="button" id="btn-modo-vista-radar" class="btn" onclick="alternarModoListadoRadar()">
            📋 Ver Flujo Plano
          </button>

          <label style="display:inline-flex; align-items:center; gap:5px; font-size:0.77rem; font-weight:700; color:#475569; cursor:pointer; margin-left:4px;">
            <input type="checkbox" id="chk-autorefresh-radar" checked onchange="configurarAutoRefreshRadar()" />
            Auto 20s
          </label>
        </div>
      </div>

      <div id="radar-kpis-container" class="kpi-grid-5"></div>
      <div id="radar-comparativa-nodos-box" style="margin-bottom:14px;"></div>
      <div id="radar-insights-container" class="insights-grid-3"></div>
      <div id="radar-feed-container" class="panel-card"></div>
    </section>
  </main>

  <!-- Modal Zoom QR para escaneo cómodo desde el celular -->
  <div id="qr-zoom-modal" class="modal-backdrop" onclick="if(event.target===this) cerrarModalQrZoom()">
    <div class="modal-box" id="qr-zoom-content"></div>
  </div>

  <!-- Modal Alta / Edición de Perfil Operativo / Clonación 1 Clic de Tienda -->
  <div id="abm-tienda-centro-modal" class="modal-backdrop" onclick="if(event.target===this) cerrarModalAbmTiendaCentro()">
    <div class="modal-box" id="abm-tienda-centro-content" style="max-width:840px; width:96%; max-height:92vh; overflow-y:auto; text-align:left; padding:22px 24px;"></div>
  </div>

  <script>
    const CSTATE = {
      tabActiva: 'fichas',
      nodos: [],
      nodoSeleccionadoId: null,
      fichaActual: null,
      subtabFicha: 'contable',
      verMovimientosMadreGlobal: false,
      qrCachePorNodo: {},
      modoQrTienda: 'directo', // 'directo' | 'afiche'
      radar: {
        nodoFiltro: 'todos',
        rango: 'hoy',
        fecha: '',
        audiencia: 'clientes',
        vistaPlana: false,
        datos: null,
        timer: null
      }
    };

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function resolverUrlModuloLamda(puertoLocal, rutaRelativa = '/') {
      const ruta = rutaRelativa.startsWith('/') ? rutaRelativa : ('/' + rutaRelativa);
      const baseLocal = `http://localhost:${puertoLocal}${ruta}`;
      if (typeof window.LAMDA_RESOLVE_URL === 'function') {
        const resuelta = window.LAMDA_RESOLVE_URL(baseLocal);
        if (resuelta && resuelta !== baseLocal) return resuelta;
      }
      const host = (window.location && window.location.hostname) ? window.location.hostname : 'localhost';
      const proto = (window.location && window.location.protocol) ? window.location.protocol : 'http:';
      return `${proto}//${host}:${puertoLocal}${ruta}`;
    }

    function inicializarEnlacesNavegacionInterna() {
      const elMenu = document.getElementById('btn-top-menu-principal');
      const elPizarra = document.getElementById('btn-top-pizarra-nodos');
      const elClientes = document.getElementById('btn-top-clientes-bunker');
      if (elMenu) elMenu.setAttribute('href', resolverUrlModuloLamda(3000, '/'));
      if (elPizarra) elPizarra.setAttribute('href', resolverUrlModuloLamda(3002, '/pages/pizarra-simulacion.html?tab=nodos'));
      if (elClientes) elClientes.setAttribute('href', resolverUrlModuloLamda(3005, '/pages/listado-clientes.html'));
    }

    function fmtMoneda(n) {
      const val = Number(n || 0);
      const abs = Math.abs(val).toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
      return (val < 0 ? '-$' : '$') + abs;
    }

    function fmtFechaHora(iso) {
      if (!iso) return '—';
      try {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return String(iso);
        return d.toLocaleString('es-AR', {
          timeZone: 'America/Argentina/Buenos_Aires',
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      } catch (_) {
        return String(iso);
      }
    }

    function copiarTextoPortapapeles(texto, btnEl) {
      if (!texto) return;
      navigator.clipboard?.writeText(texto).then(() => {
        if (btnEl) {
          const prev = btnEl.innerHTML;
          btnEl.innerHTML = '✅ Copiado';
          setTimeout(() => { btnEl.innerHTML = prev; }, 1600);
        }
      }).catch(() => {});
    }

    // =========================================================================
    // CONTROL DE NAVEGADOR LOCAL COMO DISPOSITIVO ADMIN / GESTOR
    // =========================================================================
    function esteNavegadorEsAdminGestor() {
      try {
        const rol = String(localStorage.getItem('lamda_nodo_dispositivo_rol') || '').trim().toUpperCase();
        return rol === 'ADMIN' || rol === 'GESTOR';
      } catch (_) {
        return false;
      }
    }

    function alternarEsteNavegadorAdmin() {
      try {
        if (esteNavegadorEsAdminGestor()) {
          localStorage.setItem('lamda_nodo_dispositivo_rol', 'CLIENTE_FORZADO');
        } else {
          localStorage.setItem('lamda_nodo_dispositivo_rol', 'ADMIN');
          localStorage.setItem('lamda_nodo_dispositivo_etiqueta', 'PC Panel Interno LAMDA');
        }

    function cambiarTabPrincipal(tab) {
      CSTATE.tabActiva = tab === 'radar' ? 'radar' : 'fichas';
      document.getElementById('tab-btn-fichas').classList.toggle('active', CSTATE.tabActiva === 'fichas');
      document.getElementById('tab-btn-radar').classList.toggle('active', CSTATE.tabActiva === 'radar');
      document.getElementById('vista-fichas').style.display = CSTATE.tabActiva === 'fichas' ? 'block' : 'none';
      document.getElementById('vista-radar').style.display = CSTATE.tabActiva === 'radar' ? 'block' : 'none';

      try {
        const u = new URL(window.location.href);
        u.searchParams.set('tab', CSTATE.tabActiva);
        window.history.replaceState({}, '', u.pathname + u.search);
      } catch (_) {}

      if (CSTATE.tabActiva === 'radar') {
        cargarRadarAnalitica();
        configurarAutoRefreshRadar();
      } else {
        detenerAutoRefreshRadar();
      }
    }

    async function recargarVistaActiva() {
      await cargarResumenNodos(false);
      if (CSTATE.tabActiva === 'fichas' && CSTATE.nodoSeleccionadoId) {
        await seleccionarNodoFicha(CSTATE.nodoSeleccionadoId, true);
      } else if (CSTATE.tabActiva === 'radar') {
        await cargarRadarAnalitica();
      }
    }

    // VISTA A: RESUMEN DE NODOS, FICHA INTEGRAL Y QRs
    // =========================================================================
    async function cargarResumenNodos(seleccionarInicial = true) {
      const resp = await fetch('/api/produccion/nodos/centro-analitica/resumen', { cache: 'no-store' });
      const data = await resp.json();
      if (!resp.ok || !data.ok) {
        document.getElementById('nodos-cards-strip').innerHTML = `
          <div class="panel-card" style="grid-column:1/-1; color:var(--danger); font-weight:700;">
            ❌ Error cargando nodos: ${esc(data.error || 'No disponible')}
          </div>`;
        return;
      }

      CSTATE.nodos = Array.isArray(data.nodos) ? data.nodos : [];
      CSTATE.modoLaboratorio = Boolean(data.modo_laboratorio);
      renderizarPillsNodosRadar();

      if (seleccionarInicial && CSTATE.nodos.length > 0 && !CSTATE.nodoSeleccionadoId) {
        const params = new URLSearchParams(window.location.search);
        const qNodo = (params.get('nodo') || '').trim().toLowerCase();
        const match = qNodo
          ? CSTATE.nodos.find(n => n.slug.toLowerCase() === qNodo || String(n.id) === qNodo || n.codigo_nodo.toLowerCase() === qNodo)
          : null;
        CSTATE.nodoSeleccionadoId = match ? match.id : CSTATE.nodos[0].id;
      }

      renderizarTarjetasSelectorNodos();
      if (CSTATE.nodoSeleccionadoId && seleccionarInicial) {
        await seleccionarNodoFicha(CSTATE.nodoSeleccionadoId, false);
      }
    }

    async function seleccionarNodoFicha(nodoId, forzarRecargaQr = false) {
      CSTATE.nodoSeleccionadoId = Number(nodoId);
      renderizarTarjetasSelectorNodos();
      const box = document.getElementById('ficha-integral-container');
      box.innerHTML = `<div class="panel-card" style="text-align:center; padding:32px; color:var(--muted); font-weight:700;">⏳ Cargando ficha integral y códigos QR del nodo...</div>`;

      try {
        const promesas = [
          fetch(`/api/produccion/nodos/centro-analitica/nodo/${Number(nodoId)}/ficha`, { cache: 'no-store' }).then(r => r.json())
        ];
        if (forzarRecargaQr || !CSTATE.qrCachePorNodo[nodoId]) {
          promesas.push(
            fetch(`/api/produccion/nodos/accesos-qr/nodo/${Number(nodoId)}`, { cache: 'no-store' }).then(r => r.json())
          );
        }

        const [fichaData, qrData] = await Promise.all(promesas);
        if (!fichaData?.ok) {
          box.innerHTML = `<div class="panel-card" style="color:var(--danger); font-weight:700;">❌ ${esc(fichaData?.error || 'No se pudo cargar la ficha.')}</div>`;
          return;
        }
        if (qrData?.ok) {
          CSTATE.qrCachePorNodo[nodoId] = qrData;
        }
        CSTATE.fichaActual = fichaData;
        renderizarFichaIntegral();
      } catch (e) {
        box.innerHTML = `<div class="panel-card" style="color:var(--danger); font-weight:700;">❌ Error de red al cargar el nodo.</div>`;
      }
    }

    async function rotarTokenGestorDesdeCentro(nodoId) {
      if (!confirm('¿Rotar la clave secreta del QR de Gestor? El enlace anterior dejará de funcionar y deberás escanear el nuevo QR en el celular del Gestor.')) {
        return;
      }
      const resp = await fetch(`/api/produccion/nodos/accesos-qr/nodo/${Number(nodoId)}/rotar-token`, { method: 'POST' });
      const data = await resp.json();
      if (resp.ok && data.ok) {
        CSTATE.qrCachePorNodo[nodoId] = data;
        renderizarFichaIntegral();
      } else {
        alert(data.error || 'No se pudo rotar el token del Gestor.');
      }
    }

    function renderizarPillsNodosRadar() {
      const box = document.getElementById('radar-nodos-pills');
      if (!box) return;
      const actual = String(CSTATE.radar.nodoFiltro || 'todos');
      const pills = [
        `<button type="button" class="pill-btn ${actual === 'todos' ? 'active' : ''}"
           onclick="CSTATE.radar.nodoFiltro='todos'; renderizarPillsNodosRadar(); cargarRadarAnalitica();">
           🌐 Todos los Nodos
         </button>`
      ];
      for (const n of CSTATE.nodos) {
        const sel = actual === String(n.id) || actual.toLowerCase() === n.slug.toLowerCase();
        pills.push(`
          <button type="button" class="pill-btn ${sel ? 'active' : ''}"
            onclick="CSTATE.radar.nodoFiltro='${Number(n.id)}'; renderizarPillsNodosRadar(); cargarRadarAnalitica();">
            <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:${esc(n.color_primario || '#16a34a')}; margin-right:4px;"></span>
            ${esc(n.nombre_marca.split('·')[0].trim())}
          </button>
        `);
      }
      box.innerHTML = pills.join('');
    }

    function onCambioRangoRadar() {
      const r = document.getElementById('radar-rango-select').value;
      CSTATE.radar.rango = r;
      document.getElementById('radar-fecha-select').style.display = r === 'hoy' ? 'inline-block' : 'none';
      cargarRadarAnalitica();
    }

    function alternarModoListadoRadar() {
      CSTATE.radar.vistaPlana = !CSTATE.radar.vistaPlana;
      const btn = document.getElementById('btn-modo-vista-radar');
      if (btn) {
        btn.innerHTML = CSTATE.radar.vistaPlana ? '👤 Agrupar por Visitante' : '📋 Ver Flujo Plano';
      }
      renderizarFeedRadar();
    }

    function configurarAutoRefreshRadar() {
      detenerAutoRefreshRadar();
      const chk = document.getElementById('chk-autorefresh-radar');
      if (chk && chk.checked && CSTATE.tabActiva === 'radar') {
        CSTATE.radar.timer = setInterval(() => {
          if (CSTATE.tabActiva === 'radar' && !document.hidden) {
            cargarRadarAnalitica(true);
          }
        }, 20000);
      }
    }

    function detenerAutoRefreshRadar() {
      if (CSTATE.radar.timer) {
        clearInterval(CSTATE.radar.timer);
        CSTATE.radar.timer = null;
      }
    }

    function iconoOrigenTrafico(origen) {
      const o = String(origen || 'Directo').toLowerCase();
      if (o.includes('whatsapp')) return '💬 WhatsApp';
      if (o.includes('instagram')) return '📸 Instagram';
      if (o.includes('tiktok')) return '🎵 TikTok';
      if (o.includes('facebook')) return '📘 Facebook';
      if (o.includes('qr')) return '🔳 QR Afiche';
      if (o.includes('google')) return '🔎 Google';
      if (o.includes('panel')) return '🛠️ Panel LAMDA';
      return '🔗 ' + (origen || 'Directo');
    }

    function etiquetaLegibleEvento(ev) {
      switch (ev.tipo_evento) {
        case 'vista_tienda':
          return ev.producto_nombre ? `Ingresó a tienda (foco: ${ev.producto_nombre})` : 'Ingresó a la tienda vecinal';
        case 'vista_seguimiento':
          return `Abrió seguimiento de pedido ${ev.codigo_pedido ? '#' + ev.codigo_pedido : ''}`;
        case 'vista_mi_cuenta':
          return 'Abrió su resumen personal Mi Cuenta';
        case 'categoria_seleccionada':
          return `Exploró rubro: ${ev.categoria_nombre || 'General'}`;
        case 'busqueda_lupa':
          return `Buscó en la lupa: "${ev.termino_busqueda || ''}"`;
        case 'clic_que_contiene':
          return `Consultó "¿Qué contiene?": ${ev.producto_nombre || ev.sku_nodo || ''}`;
        case 'vista_producto':
          return `Visualizó producto: ${ev.producto_nombre || ev.sku_nodo || ''}`;
        case 'carrito_agregar':
          return `Sumó al carrito: ${ev.producto_nombre || ev.sku_nodo || ''} (en carrito: ${ev.carrito_unidades} u. · ${fmtMoneda(ev.carrito_subtotal)})`;
        case 'carrito_quitar':
          return `Quitó del carrito: ${ev.producto_nombre || ev.sku_nodo || ''} (en carrito: ${ev.carrito_unidades} u.)`;
        case 'inicio_checkout':
          return `Inició Checkout de confirmación (${ev.carrito_unidades} u. · ${fmtMoneda(ev.carrito_subtotal)})`;
        case 'pedido_confirmado':
          return `✅ Confirmó Pedido ${ev.codigo_pedido ? '#' + ev.codigo_pedido : ''} (${fmtMoneda(ev.carrito_subtotal)})`;
        case 'marcar_admin_gestor':
          return `Actualizó rol de dispositivo (${ev.detalle || 'Admin/Gestor'})`;
        default:
          return ev.tipo_evento;
      }
    }

    async function cargarRadarAnalitica(silencioso = false) {
      const rango = document.getElementById('radar-rango-select')?.value || CSTATE.radar.rango || 'hoy';
      const fechaSel = document.getElementById('radar-fecha-select')?.value || CSTATE.radar.fecha || '';
      const audiencia = document.getElementById('radar-audiencia-select')?.value || 'clientes';
      CSTATE.radar.rango = rango;
      CSTATE.radar.audiencia = audiencia;

      if (!silencioso && !CSTATE.radar.datos) {
        document.getElementById('radar-feed-container').innerHTML = `<div style="padding:28px; text-align:center; color:var(--muted); font-weight:700;">⏳ Consultando telemetría de tiendas en tiempo real...</div>`;
      }

      const qs = new URLSearchParams({
        nodo_id: String(CSTATE.radar.nodoFiltro || 'todos'),
        rango,
        audiencia
      });
      if (rango === 'hoy' && fechaSel) {
        qs.set('fecha', fechaSel);
      }

      const resp = await fetch(`/api/produccion/nodos/centro-analitica/radar?${qs.toString()}`, { cache: 'no-store' });
      const data = await resp.json();
      if (!resp.ok || !data.ok) return;

      CSTATE.radar.datos = data;
      CSTATE.radar.fecha = data.filtros.fecha;

      // Poblar selector de fechas con actividad
      const selFecha = document.getElementById('radar-fecha-select');
      if (selFecha) {
        const fechasSet = new Map();
        fechasSet.set(data.filtros.hoy_argentina, {
          fecha: data.filtros.hoy_argentina,
          label: `Hoy (${data.filtros.hoy_argentina})`
        });
        for (const fd of (data.fechas_disponibles || [])) {
          const esHoy = fd.fecha === data.filtros.hoy_argentina;
          fechasSet.set(fd.fecha, {
            fecha: fd.fecha,
            label: `${esHoy ? 'Hoy ' : ''}${fd.fecha} (${fd.visitantes_clientes} vec.${fd.visitantes_admin ? ` + ${fd.visitantes_admin} adm.` : ''})`
          });
        }
        selFecha.innerHTML = Array.from(fechasSet.values()).map(f =>
          `<option value="${esc(f.fecha)}" ${f.fecha === data.filtros.fecha ? 'selected' : ''}>${esc(f.label)}</option>`
        ).join('');
        selFecha.style.display = rango === 'hoy' ? 'inline-block' : 'none';
      }

      renderizarKpisRadar();
      renderizarComparativaNodosRadar();
      renderizarInsightsRadar();
      renderizarFeedRadar();
    }

    async function asegurarModalOmnicanalCargado() {
      if (typeof window.abrirModalEnvioOmnicanalNodo === 'function') return;
      await new Promise((resolve, reject) => {
        const sc = document.createElement('script');
        sc.src = '/api/produccion/nodos/comunicaciones-modal.js?v=1.0.0';
        sc.onload = resolve;
        sc.onerror = () => reject(new Error('No se pudo cargar el modal interno de envío omnicanal.'));
        document.head.appendChild(sc);
      });
    }

    async function abrirEnvioInternoCentroNodos(nodoId, plantillaInicial = 'gestor_y_tienda', qrTipoInicial = 'tienda_afiche') {
      try {
        await asegurarModalOmnicanalCargado();
        await window.abrirModalEnvioOmnicanalNodo({
          nodoId: Number(nodoId),
          plantillaInicial,
          qrTipoInicial,
          adjuntarQrInicial: true
        });
      } catch (err) {
        window.alert('Error abriendo envío interno: ' + err.message);
      }
    }

    async function abrirContactoInternoCarritoRadar(idxCart) {
      try {
        const carts = CSTATE.radar?.data?.carritos_sin_cerrar || [];

        await asegurarModalOmnicanalCargado();

    async function asegurarClientesBunkerCargadosCentro() {
      if (Array.isArray(CSTATE.clientesBunker) && CSTATE.clientesBunker.length > 0) return CSTATE.clientesBunker;
      const resp = await fetch('/api/produccion/nodos/inicializar', { cache: 'no-store' });
      const data = await resp.json();
      if (Array.isArray(data?.fuentes?.clientes_bunker) && data.fuentes.clientes_bunker.length > 0) {
        CSTATE.clientesBunker = data.fuentes.clientes_bunker;
        return CSTATE.clientesBunker;
      }
      const respAlt = await fetch('/api/logistica/bunker/clientes', { cache: 'no-store' });
      const dataAlt = await respAlt.json();
      CSTATE.clientesBunker = Array.isArray(dataAlt?.clientes) ? dataAlt.clientes : (Array.isArray(dataAlt) ? dataAlt : []);
      return CSTATE.clientesBunker;
    }

    function sincronizarVisibilidadPanelesAbmCentro() {
      const modRet = Boolean(document.getElementById('abm-mod-retiro_punto')?.checked);
      const modRep = Boolean(document.getElementById('abm-mod-reparto_zonal')?.checked);
      const modPaq = Boolean(document.getElementById('abm-mod-envio_paqueteria')?.checked);
      const barrialBox = document.getElementById('abm-centro-barrial-fields');
      const localBox = document.getElementById('abm-centro-retiro-local-box');
      const paqBox = document.getElementById('abm-centro-paqueteria-box');
      if (barrialBox) barrialBox.style.display = (modRet || modRep) ? 'grid' : 'none';
      if (localBox) localBox.style.display = modRet ? 'block' : 'none';
      if (paqBox) paqBox.style.display = modPaq ? 'block' : 'none';
    }

    function onCambioPerfilOperativoCentro(nuevoPerfil) {
      const p = normalizarPerfilCentro(nuevoPerfil);
      const preset = PRESETS_MODULOS_CENTRO[p];
      Object.keys(preset).forEach(k => {
        const el = document.getElementById(`abm-mod-${k}`);
        if (!el) return;
        if (el.tagName === 'SELECT') el.value = String(preset[k]);
        else el.checked = Boolean(preset[k]);
      });
      const estilosPerfil = {
        VECINOS: { border: '#16a34a', bg: '#f0fdf4' },
        REDES: { border: '#d97706', bg: '#fffbeb' },
        LOCALES: { border: '#1e293b', bg: '#f1f5f9' }
      };
      ['VECINOS', 'REDES', 'LOCALES'].forEach(pk => {
        const card = document.getElementById(`card-perfil-${pk}`);
        if (!card) return;
        card.style.borderColor = p === pk ? estilosPerfil[pk].border : 'var(--border)';
        card.style.background = p === pk ? estilosPerfil[pk].bg : '#fff';
      });
      const subEl = document.getElementById('abm-centro-subtitulo');
      if (subEl && !CSTATE.abmDraft?.editarId) {
        subEl.value = SUBTITULOS_DEFAULT_CENTRO[p];
      }
      sincronizarVisibilidadPanelesAbmCentro();
    }

    function onCambioClonarPlantillaCentro(origenIdVal) {
      if (!origenIdVal) return;
      abrirModalAbmTiendaCentro(null, Number(origenIdVal));
    }

    function filtrarClientesBunkerModalCentro(qRaw) {
      const q = String(qRaw || '').trim().toLowerCase();
      const sel = document.getElementById('abm-centro-cliente-madre');
      if (!sel) return;
      const valActual = sel.value;
      const filtrados = (CSTATE.clientesBunker || []).filter(c => {
        if (!q) return true;
        const bolsa = `${c.codigo_bunker_cliente || ''} ${c.cliente_nombre || ''} ${c.razon_social || ''} ${c.cuit || ''}`.toLowerCase();
        return bolsa.includes(q);
      });
      sel.innerHTML = `<option value="">— Seleccionar Cliente Titular en Búnker (${filtrados.length}) —</option>` +
        filtrados.map(c => `
          <option value="${Number(c.id)}" ${String(valActual) === String(c.id) ? 'selected' : ''}>
            [${esc(c.codigo_bunker_cliente || ('ID-' + c.id))}] ${esc(c.cliente_nombre || c.razon_social || 'Cliente')}
          </option>
        `).join('');
    }

    async function guardarAbmTiendaCentro() {
      const fb = document.getElementById('abm-centro-feedback');
      const btn = document.getElementById('abm-centro-btn-submit');
      const mostrarError = (msg) => {
        if (!fb) return;
        fb.style.display = 'block';
        fb.style.background = '#fef2f2';
        fb.style.color = '#991b1b';
        fb.style.border = '1px solid #fecaca';
        fb.textContent = '❌ ' + msg;
      };

      const editarId = CSTATE.abmDraft?.editarId || null;
      const clonarOrigenId = !editarId ? (document.getElementById('abm-centro-clonar-select')?.value || '') : '';
      const perfil = normalizarPerfilCentro(document.querySelector('input[name="abm-centro-perfil"]:checked')?.value || 'VECINOS');
      const nombreMarca = document.getElementById('abm-centro-marca')?.value?.trim() || '';
      const slug = document.getElementById('abm-centro-slug')?.value?.trim() || '';
      const gestorNombre = document.getElementById('abm-centro-gestor')?.value?.trim() || '';
      const clienteMadreId = Number(document.getElementById('abm-centro-cliente-madre')?.value || 0);

      if (!nombreMarca || !gestorNombre) {
        mostrarError('Completá el Nombre de la Marca y el nombre del Titular / Referente.');
        return;
      }
      if (!clienteMadreId) {
        mostrarError('Seleccioná un Cliente Titular Madre del padrón Búnker.');
        return;
      }

      const modulos = {};
      Object.keys(PRESETS_MODULOS_CENTRO.VECINOS).forEach(k => {
        const el = document.getElementById(`abm-mod-${k}`);
        if (!el) return;
        modulos[k] = el.tagName === 'SELECT' ? el.value : Boolean(el.checked);
      });
      if (!modulos.retiro_punto && !modulos.reparto_zonal && !modulos.envio_paqueteria) {
        mostrarError('Habilitá al menos una modalidad de entrega (Retiro, Reparto Zonal o Paquetería Nacional).');
        return;
      }

      const operadores = [];
      if (document.getElementById('abm-paq-op-ca')?.checked) operadores.push('CORREO_ARGENTINO');
      if (document.getElementById('abm-paq-op-and')?.checked) operadores.push('ANDREANI');
      if (operadores.length === 0) operadores.push('CORREO_ARGENTINO');

      const zonasRows = Array.from(document.querySelectorAll('.abm-zona-row'));
      const tarifarioZonas = zonasRows.map((r, idx) => ({
        codigo: r.getAttribute('data-zona-codigo') || `ZONA_${idx + 1}`,
        nombre: r.querySelector('.z-nombre')?.value?.trim() || `Zona ${idx + 1}`,
        cp_prefijos: String(r.querySelector('.z-prefijos')?.value || '*').split(',').map(s => s.trim()).filter(Boolean),
        domicilio: Math.max(0, Number(r.querySelector('.z-dom')?.value || 0)),
        sucursal: Math.max(0, Number(r.querySelector('.z-suc')?.value || 0)),
        plazo_dias: r.getAttribute('data-zona-plazo') || '3 a 6 días hábiles'
      }));

      const cliObj = (CSTATE.clientesBunker || []).find(c => Number(c.id) === clienteMadreId);
      const nodoPrev = editarId ? (CSTATE.nodos || []).find(n => Number(n.id) === Number(editarId)) : null;
      const payload = {
        nombre_marca: nombreMarca,
        slug,
        subtitulo_marca: document.getElementById('abm-centro-subtitulo')?.value?.trim() || '',
        gestor_nombre: gestorNombre,
        gestor_telefono: document.getElementById('abm-centro-telefono')?.value?.trim() || '',
        barrio_zona: document.getElementById('abm-centro-barrio')?.value?.trim() || '',
        direccion_retiro: document.getElementById('abm-centro-direccion')?.value?.trim() || '',
        cargo_envio_barrial: Number(document.getElementById('abm-centro-cargo-barrial')?.value || 0),
        margen_gestor_default_pct: Number(document.getElementById('abm-centro-margen')?.value || 28),
        alicuota_iva_margen_pct: Number(document.getElementById('abm-centro-iva-margen')?.value ?? 21),
        alicuota_iibb_margen_pct: Number(document.getElementById('abm-centro-iibb-margen')?.value ?? 4),
        color_primario: document.getElementById('abm-centro-color')?.value || '#a2553b',
        cliente_madre_bunker_id: clienteMadreId,
        codigo_bunker_cliente_madre: cliObj?.codigo_bunker_cliente || undefined,
        usar_cuenta_madre_unificada: Boolean(document.getElementById('abm-centro-usar-madre-unificada')?.checked),
        perfil_operativo: perfil,
        modulos_activos: modulos,
        diccionario_textos: {
          ...((nodoPrev?.diccionario_textos && typeof nodoPrev.diccionario_textos === 'object') ? nodoPrev.diccionario_textos : {}),
          subtitulo_catalogo: document.getElementById('abm-centro-subtitulo-catalogo')?.value?.trim() || ''
        },
        cobro_efectivo_entrega: Boolean(modulos.cobro_efectivo_entrega),
        permitir_retiro_nodo: Boolean(modulos.retiro_punto),
        permitir_reparto_propio: Boolean(modulos.reparto_zonal),
        permitir_envio_barrial: Boolean(modulos.reparto_zonal),
        permitir_encomienda: Boolean(modulos.envio_paqueteria),
        config_retiro_local: {
          nombre_punto: document.getElementById('abm-local-nombre-punto')?.value?.trim() || nombreMarca,
          direccion_corta: document.getElementById('abm-local-dir-corta')?.value?.trim() || document.getElementById('abm-centro-direccion')?.value?.trim() || '',
          direccion_completa: document.getElementById('abm-local-dir-completa')?.value?.trim() || document.getElementById('abm-centro-direccion')?.value?.trim() || '',
          dias_atencion: document.getElementById('abm-local-dias')?.value?.trim() || '',
          horario_atencion: document.getElementById('abm-local-horario')?.value?.trim() || '',
          referencias_mostrador: document.getElementById('abm-local-referencias')?.value?.trim() || '',
          abastecimiento_dias_label: document.getElementById('abm-local-abast-dias')?.value?.trim() || '',
          mostrar_mapa_link: true
        },
        clonar_ofertas_margenes: Boolean(document.getElementById('abm-centro-clonar-ofertas')?.checked ?? true),
        config_paqueteria: {
          operadores_habilitados: operadores,
          operador_default: document.getElementById('abm-paq-op-default')?.value || operadores[0],
          permitir_domicilio: Boolean(document.getElementById('abm-paq-domicilio')?.checked ?? true),
          permitir_sucursal_correo: Boolean(document.getElementById('abm-paq-sucursal')?.checked ?? true),
          sla_despacho_label: document.getElementById('abm-paq-sla')?.value?.trim() || 'Despacho en 24 a 48 hs hábiles',
          envio_gratis_activo: Boolean(document.getElementById('abm-paq-gratis-activo')?.checked),
          envio_gratis_desde_monto: Math.max(0, Number(document.getElementById('abm-paq-gratis-monto')?.value || 0)),
          tarifario_zonas: tarifarioZonas
        }
      };

      const url = editarId
        ? `/api/produccion/nodos/maestro/${Number(editarId)}`
        : (clonarOrigenId
            ? `/api/produccion/nodos/maestro/${Number(clonarOrigenId)}/clonar`
            : '/api/produccion/nodos/maestro');
      const method = editarId ? 'PUT' : 'POST';

      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Guardando...';
      }

      try {
        const resp = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await resp.json();
        if (!resp.ok || !data.ok) {
          throw new Error(data.error || 'No se pudo guardar la tienda.');
        }
        cerrarModalAbmTiendaCentro();
        CSTATE.nodoSeleccionadoId = Number(data.nodo.id);
        await cargarResumenNodos(false);
        await seleccionarNodoFicha(Number(data.nodo.id), true);
      } catch (err) {
        mostrarError(err.message || 'Error de comunicación con el servidor.');
        if (btn) {
          btn.disabled = false;
          btn.textContent = editarId ? '💾 Guardar Cambios de Perfil y Módulos' : '🚀 Crear Tienda y Configurar Cuenta';
        }
      }
    }

    async function eliminarTiendaPruebaDesdeCentro(nodoId, nombreMarca) {
      if (!confirm(`¿Eliminar la tienda de prueba "${nombreMarca}" (solo Modo Laboratorio)? Se limpiará su subcuenta hija preservando intacto el Cliente Madre.`)) {
        return;
      }
      const resp = await fetch(`/api/produccion/nodos/maestro/${Number(nodoId)}?motivo=Limpieza_Test_Clonador`, {
        method: 'DELETE'
      });
      const data = await resp.json();
      if (!resp.ok || !data.ok) {
        alert(data.error || 'No se pudo eliminar la tienda de prueba.');
        return;
      }
      CSTATE.nodoSeleccionadoId = CSTATE.nodos.find(x => Number(x.id) !== Number(nodoId))?.id || null;
      await cargarResumenNodos(true);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      inicializarEnlacesNavegacionInterna();
      renderizarEstadoAdminPc();
      const params = new URLSearchParams(window.location.search);
      const tabInicial = (params.get('tab') || 'fichas').trim().toLowerCase();
      const nodoQuery = (params.get('nodo') || '').trim();
      if (nodoQuery) {
        CSTATE.radar.nodoFiltro = nodoQuery;
      }

      await cargarResumenNodos(true);
      if (tabInicial === 'radar') {
        cambiarTabPrincipal('radar');
      }
    });
  </script>
  <script src="/api/produccion/nodos/comunicaciones-modal.js?v=1.0.0"></script>
</body>
</html>
