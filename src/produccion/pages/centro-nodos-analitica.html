<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centro de Nodos y Analítica — Sistema LAMDA</title>
  <script src="/lamda-cloud-runtime.js"></script>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #1e40af;
      --primary-light: #eff6ff;
      --emerald: #15803d;
      --emerald-bg: #f0fdf4;
      --amber: #b45309;
      --amber-bg: #fffbeb;
      --danger: #b91c1c;
      --danger-bg: #fef2f2;
      --violet: #6d28d9;
      --violet-bg: #f5f3ff;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    .topbar {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      padding: 14px 22px;
      border-bottom: 1px solid #334155;
      position: sticky;
      top: 0;
      z-index: 80;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.14);
    }
    .topbar-inner {
      max-width: 1460px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .topbar-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .topbar-title h1 {
      margin: 0;
      font-size: 1.18rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .topbar-sub {
      font-size: 0.78rem;
      color: #94a3b8;
      margin-top: 2px;
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-top {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-top:hover { background: #334155; color: #ffffff; }
    .btn-top.primary { background: #2563eb; border-color: #3b82f6; color: #ffffff; }
    .btn-top.primary:hover { background: #1d4ed8; }

    .container {
      max-width: 1460px;
      margin: 0 auto;
      padding: 18px 20px 44px;
    }

    .main-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      background: #e2e8f0;
      padding: 5px;
      border-radius: 12px;
      width: fit-content;
      max-width: 100%;
      flex-wrap: wrap;
    }
    .main-tab-btn {
      padding: 10px 18px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: #334155;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    .main-tab-btn.active {
      background: #ffffff;
      color: #0f172a;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
    }
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      white-space: nowrap;
    }

    /* Node Selector Cards */
    .nodos-strip {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .nodo-selector-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.16s ease;
      position: relative;
      overflow: hidden;
    }
    .nodo-selector-card:hover {
      border-color: #94a3b8;
      transform: translateY(-1px);
    }
    .nodo-selector-card.selected {
      border-color: #2563eb;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.12);
      background: #fcfdff;
    }
    .nodo-accent-bar {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 5px;
    }

    /* Two-column Ficha layout */
    .ficha-grid {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 18px;
      align-items: start;
    }
    @media (max-width: 1120px) {
      .ficha-grid { grid-template-columns: 1fr; }
    }

    .panel-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    .panel-title {
      margin: 0 0 12px 0;
      font-size: 0.98rem;
      font-weight: 800;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    /* QR Access Boxes */
    .qr-access-box {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      background: #f8fafc;
      margin-bottom: 12px;
    }
    .qr-access-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 10px;
    }
    .qr-img-wrap {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
    }
    .qr-img-wrap img {
      width: 176px;
      height: 176px;
      object-fit: contain;
      cursor: zoom-in;
    }
    .url-mono {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.73rem;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 8px;
      color: #334155;
      word-break: break-all;
      margin-bottom: 8px;
    }
    .btn-row {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 11px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: #ffffff;
      color: #0f172a;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .btn:hover { background: #f1f5f9; }
    .btn.solid-blue { background: #2563eb; border-color: #2563eb; color: #ffffff; }
    .btn.solid-blue:hover { background: #1d4ed8; }
    .btn.solid-green { background: #16a34a; border-color: #16a34a; color: #ffffff; }
    .btn.solid-green:hover { background: #15803d; }
    .btn.solid-dark { background: #0f172a; border-color: #0f172a; color: #ffffff; }
    .btn.solid-dark:hover { background: #1e293b; }

    /* KPIs Commercial & Radar */
    .kpi-grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 11px;
      margin-bottom: 16px;
    }
    .kpi-grid-5 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .kpi-box {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 14px;
    }
    .kpi-label {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
    }
    .kpi-val {
      font-size: 1.48rem;
      font-weight: 900;
      color: var(--text);
      margin: 4px 0 2px;
    }
    .kpi-sub {
      font-size: 0.76rem;
      color: var(--muted);
    }

    /* Subtabs inside Ficha */
    .subtabs {
      display: flex;
      gap: 6px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .subtab-btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: #475569;
      font-family: inherit;
      font-size: 0.79rem;
      font-weight: 800;
      cursor: pointer;
    }
    .subtab-btn.active {
      background: #0f172a;
      border-color: #0f172a;
      color: #ffffff;
    }

    /* Tables */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.81rem;
    }
    th {
      background: #f8fafc;
      text-align: left;
      padding: 9px 11px;
      font-size: 0.72rem;
      text-transform: uppercase;
      color: #475569;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 9px 11px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: top;
    }
    tr:last-child td { border-bottom: none; }

    /* Radar Filter Toolbar */
    .radar-toolbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 16px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .pill-filter-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .pill-btn {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: #ffffff;
      color: #334155;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
    }
    .pill-btn.active {
      background: #1e40af;
      border-color: #1e40af;
      color: #ffffff;
    }

    .insights-grid-3 {
      display: grid;
      grid-template-columns: 1.25fr 1fr 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }
    @media (max-width: 1100px) {
      .insights-grid-3 { grid-template-columns: 1fr; }
    }

    /* Visitor Radar Accordion (B2B Style) */
    .visitor-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #ffffff;
      margin-bottom: 9px;
      overflow: hidden;
      transition: border-color 0.14s ease;
    }
    .visitor-card:hover { border-color: #94a3b8; }
    .visitor-card.bought { border-left: 4px solid #16a34a; }
    .visitor-card.abandoned { border-left: 4px solid #d97706; }
    .visitor-card.admin-dev { border-left: 4px solid #64748b; background: #fafaf9; }
    .visitor-summary {
      padding: 12px 15px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      list-style: none;
    }
    .visitor-summary::-webkit-details-marker { display: none; }
    .visitor-timeline {
      border-top: 1px solid var(--border);
      background: #f8fafc;
      padding: 10px 16px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.73rem;
      font-weight: 700;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: #334155;
    }

    /* Modal Zoom QR */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 300;
      padding: 18px;
    }
    .modal-box {
      background: #ffffff;
      border-radius: 16px;
      max-width: 460px;
      width: 100%;
      padding: 22px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.3);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-title">
        <div style="font-size:1.65rem;">🏘️</div>
        <div>
          <h1>Centro de Nodos y Analítica</h1>
          <div class="topbar-sub">Fichas Contables Unificadas · Accesos QR Móviles · Radar de Tiendas y Conversión en Vivo</div>
        </div>
      </div>
      <div class="topbar-actions">
        <a href="http://localhost:3000/" id="btn-top-menu-principal" class="btn-top">← Menú Principal</a>
        <a href="http://localhost:3002/pages/pizarra-simulacion.html?tab=nodos" id="btn-top-pizarra-nodos" class="btn-top">🎛️ Pizarra y ABM Nodos</a>
        <a href="/deposito-nodos" id="btn-top-mesa-armado" class="btn-top">📦 Mesa de Armado</a>
        <a href="/liquidacion-nodos" id="btn-top-liquidacion-nodos" class="btn-top">💰 Liquidación y Cobros</a>
        <a href="http://localhost:3005/pages/listado-clientes.html" id="btn-top-clientes-bunker" class="btn-top">📒 Clientes Búnker</a>
        <button type="button" class="btn-top primary" onclick="recargarVistaActiva()">🔄 Actualizar</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px;">
      <div class="main-tabs" style="margin-bottom:0;">
        <button type="button" id="tab-btn-fichas" class="main-tab-btn active" onclick="cambiarTabPrincipal('fichas')">
          📋 Fichas de Nodos, Cuentas y Accesos QR
        </button>
        <button type="button" id="tab-btn-radar" class="main-tab-btn" onclick="cambiarTabPrincipal('radar')">
          📡 Radar en Vivo, Flujo de Nube y Estadísticas
          <span id="badge-radar-live" class="badge-pill" style="background:#dcfce7; color:#166534;">EN VIVO</span>
        </button>
      </div>
      <div id="status-pc-admin-box" style="display:flex; align-items:center; gap:8px; font-size:0.78rem;"></div>
    </div>

    <!-- ===================================================================== -->
    <!-- VISTA A: FICHAS INTEGRALES Y ACCESOS RÁPIDOS / QR POR NODO            -->
    <!-- ===================================================================== -->
    <section id="vista-fichas">
      <div id="nodos-cards-strip" class="nodos-strip">
        <div class="panel-card" style="grid-column:1/-1; text-align:center; color:var(--muted);">⏳ Cargando nodos activos...</div>
      </div>

      <div id="ficha-integral-container"></div>
    </section>

    <!-- ===================================================================== -->
    <!-- VISTA B: RADAR EN VIVO, FLUJO DE NUBE Y ESTADÍSTICAS POR NODO         -->
    <!-- ===================================================================== -->
    <section id="vista-radar" style="display:none;">
      <div class="radar-toolbar">
        <div class="pill-filter-group" id="radar-nodos-pills"></div>

        <div class="pill-filter-group">
          <select id="radar-rango-select" onchange="onCambioRangoRadar()"
            style="padding:6px 10px; border-radius:8px; border:1px solid var(--border-strong); font-family:inherit; font-size:0.8rem; font-weight:700; background:#fff;">
            <option value="hoy">📅 Día específico / Hoy</option>
            <option value="7d">📆 Últimos 7 días</option>
            <option value="30d">🗓️ Últimos 30 días</option>
            <option value="todo">♾️ Histórico completo</option>
          </select>

          <select id="radar-fecha-select" onchange="cargarRadarAnalitica()"
            style="padding:6px 10px; border-radius:8px; border:1px solid var(--border-strong); font-family:inherit; font-size:0.8rem; font-weight:700; background:#fff;">
          </select>

          <select id="radar-audiencia-select" onchange="cargarRadarAnalitica()"
            style="padding:6px 10px; border-radius:8px; border:1px solid var(--border-strong); font-family:inherit; font-size:0.8rem; font-weight:800; background:#eff6ff; color:#1e3a8a;">
            <option value="clientes">👥 Solo Clientes Reales (Conversión Pura)</option>
            <option value="admin_gestor">🛠️ Solo Dispositivos Admin / Gestor</option>
            <option value="todos">🌐 Todos los ingresos (Clientes + Admin + Bots)</option>
          </select>

          <button type="button" id="btn-modo-vista-radar" class="btn" onclick="alternarModoListadoRadar()">
            📋 Ver Flujo Plano
          </button>

          <label style="display:inline-flex; align-items:center; gap:5px; font-size:0.77rem; font-weight:700; color:#475569; cursor:pointer; margin-left:4px;">
            <input type="checkbox" id="chk-autorefresh-radar" checked onchange="configurarAutoRefreshRadar()" />
            Auto 20s
          </label>
        </div>
      </div>

      <div id="radar-kpis-container" class="kpi-grid-5"></div>
      <div id="radar-comparativa-nodos-box" style="margin-bottom:14px;"></div>
      <div id="radar-insights-container" class="insights-grid-3"></div>
      <div id="radar-feed-container" class="panel-card"></div>
    </section>
  </main>

  <!-- Modal Zoom QR para escaneo cómodo desde el celular -->
  <div id="qr-zoom-modal" class="modal-backdrop" onclick="if(event.target===this) cerrarModalQrZoom()">
    <div class="modal-box" id="qr-zoom-content"></div>
  </div>

  <script>
    const CSTATE = {
      tabActiva: 'fichas',
      nodos: [],
      nodoSeleccionadoId: null,
      fichaActual: null,
      subtabFicha: 'contable',
      verMovimientosMadreGlobal: false,
      qrCachePorNodo: {},
      modoQrTienda: 'directo', // 'directo' | 'afiche'
      radar: {
        nodoFiltro: 'todos',
        rango: 'hoy',
        fecha: '',
        audiencia: 'clientes',
        vistaPlana: false,
        datos: null,
        timer: null
      }
    };

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function resolverUrlModuloLamda(puertoLocal, rutaRelativa = '/') {
      const ruta = rutaRelativa.startsWith('/') ? rutaRelativa : ('/' + rutaRelativa);
      const baseLocal = `http://localhost:${puertoLocal}${ruta}`;
      if (typeof window.LAMDA_RESOLVE_URL === 'function') {
        const resuelta = window.LAMDA_RESOLVE_URL(baseLocal);
        if (resuelta && resuelta !== baseLocal) return resuelta;
      }
      const host = (window.location && window.location.hostname) ? window.location.hostname : 'localhost';
      const proto = (window.location && window.location.protocol) ? window.location.protocol : 'http:';
      return `${proto}//${host}:${puertoLocal}${ruta}`;
    }

    function inicializarEnlacesNavegacionInterna() {
      const elMenu = document.getElementById('btn-top-menu-principal');
      const elPizarra = document.getElementById('btn-top-pizarra-nodos');
      const elClientes = document.getElementById('btn-top-clientes-bunker');
      if (elMenu) elMenu.setAttribute('href', resolverUrlModuloLamda(3000, '/'));
      if (elPizarra) elPizarra.setAttribute('href', resolverUrlModuloLamda(3002, '/pages/pizarra-simulacion.html?tab=nodos'));
      if (elClientes) elClientes.setAttribute('href', resolverUrlModuloLamda(3005, '/pages/listado-clientes.html'));
    }

    function fmtMoneda(n) {
      const val = Number(n || 0);
      const abs = Math.abs(val).toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
      return (val < 0 ? '-$' : '$') + abs;
    }

    function fmtFechaHora(iso) {
      if (!iso) return '—';
      try {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return String(iso);
        return d.toLocaleString('es-AR', {
          timeZone: 'America/Argentina/Buenos_Aires',
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      } catch (_) {
        return String(iso);
      }
    }

    function copiarTextoPortapapeles(texto, btnEl) {
      if (!texto) return;
      navigator.clipboard?.writeText(texto).then(() => {
        if (btnEl) {
          const prev = btnEl.innerHTML;
          btnEl.innerHTML = '✅ Copiado';
          setTimeout(() => { btnEl.innerHTML = prev; }, 1600);
        }
      }).catch(() => {});
    }

    // =========================================================================
    // CONTROL DE NAVEGADOR LOCAL COMO DISPOSITIVO ADMIN / GESTOR
    // =========================================================================
    function esteNavegadorEsAdminGestor() {
      try {
        const rol = String(localStorage.getItem('lamda_nodo_dispositivo_rol') || '').trim().toUpperCase();
        return rol === 'ADMIN' || rol === 'GESTOR';
      } catch (_) {
        return false;
      }
    }

    function alternarEsteNavegadorAdmin() {
      try {
        if (esteNavegadorEsAdminGestor()) {
          localStorage.setItem('lamda_nodo_dispositivo_rol', 'CLIENTE_FORZADO');
        } else {
          localStorage.setItem('lamda_nodo_dispositivo_rol', 'ADMIN');
          localStorage.setItem('lamda_nodo_dispositivo_etiqueta', 'PC Panel Interno LAMDA');
        }
      } catch (_) {}
      renderizarEstadoAdminPc();
      if (CSTATE.fichaActual) renderizarFichaIntegral();
    }

    function renderizarEstadoAdminPc() {
      const box = document.getElementById('status-pc-admin-box');
      if (!box) return;
      const activo = esteNavegadorEsAdminGestor();
      box.innerHTML = activo
        ? `<span class="badge-pill" style="background:#0f172a; color:#f8fafc; padding:5px 10px;">🛠️ Este navegador está marcado como Admin/Gestor (excluido de conversión)</span>

    // NAVEGACIÓN PRINCIPAL
    // =========================================================================
    function cambiarTabPrincipal(tab) {
      CSTATE.tabActiva = tab === 'radar' ? 'radar' : 'fichas';
      document.getElementById('tab-btn-fichas').classList.toggle('active', CSTATE.tabActiva === 'fichas');
      document.getElementById('tab-btn-radar').classList.toggle('active', CSTATE.tabActiva === 'radar');
      document.getElementById('vista-fichas').style.display = CSTATE.tabActiva === 'fichas' ? 'block' : 'none';
      document.getElementById('vista-radar').style.display = CSTATE.tabActiva === 'radar' ? 'block' : 'none';

      try {
        const u = new URL(window.location.href);
        u.searchParams.set('tab', CSTATE.tabActiva);
        window.history.replaceState({}, '', u.pathname + u.search);
      } catch (_) {}

      if (CSTATE.tabActiva === 'radar') {
        cargarRadarAnalitica();
        configurarAutoRefreshRadar();
      } else {
        detenerAutoRefreshRadar();
      }
    }

    async function recargarVistaActiva() {
      await cargarResumenNodos(false);
      if (CSTATE.tabActiva === 'fichas' && CSTATE.nodoSeleccionadoId) {
        await seleccionarNodoFicha(CSTATE.nodoSeleccionadoId, true);
      } else if (CSTATE.tabActiva === 'radar') {
        await cargarRadarAnalitica();
      }
    }

    // =========================================================================
    // VISTA A: RESUMEN DE NODOS, FICHA INTEGRAL Y QRs
    // =========================================================================
    async function cargarResumenNodos(seleccionarInicial = true) {
      const resp = await fetch('/api/produccion/nodos/centro-analitica/resumen', { cache: 'no-store' });
      const data = await resp.json();
      if (!resp.ok || !data.ok) {
        document.getElementById('nodos-cards-strip').innerHTML = `
          <div class="panel-card" style="grid-column:1/-1; color:var(--danger); font-weight:700;">
            ❌ Error cargando nodos: ${esc(data.error || 'No disponible')}
          </div>`;
        return;
      }

      CSTATE.nodos = Array.isArray(data.nodos) ? data.nodos : [];
      renderizarPillsNodosRadar();

      if (seleccionarInicial && CSTATE.nodos.length > 0 && !CSTATE.nodoSeleccionadoId) {
        const params = new URLSearchParams(window.location.search);
        const qNodo = (params.get('nodo') || '').trim().toLowerCase();
        const match = qNodo
          ? CSTATE.nodos.find(n => n.slug.toLowerCase() === qNodo || String(n.id) === qNodo || n.codigo_nodo.toLowerCase() === qNodo)
          : null;
        CSTATE.nodoSeleccionadoId = match ? match.id : CSTATE.nodos[0].id;
      }

      renderizarTarjetasSelectorNodos();
      if (CSTATE.nodoSeleccionadoId && seleccionarInicial) {
        await seleccionarNodoFicha(CSTATE.nodoSeleccionadoId, false);
      }
    }

        return `

    async function seleccionarNodoFicha(nodoId, forzarRecargaQr = false) {
      CSTATE.nodoSeleccionadoId = Number(nodoId);
      renderizarTarjetasSelectorNodos();
      const box = document.getElementById('ficha-integral-container');
      box.innerHTML = `<div class="panel-card" style="text-align:center; padding:32px; color:var(--muted); font-weight:700;">⏳ Cargando ficha integral y códigos QR del nodo...</div>`;

      try {
        const promesas = [
          fetch(`/api/produccion/nodos/centro-analitica/nodo/${Number(nodoId)}/ficha`, { cache: 'no-store' }).then(r => r.json())
        ];
        if (forzarRecargaQr || !CSTATE.qrCachePorNodo[nodoId]) {
          promesas.push(
            fetch(`/api/produccion/nodos/accesos-qr/nodo/${Number(nodoId)}`, { cache: 'no-store' }).then(r => r.json())
          );
        }

        const [fichaData, qrData] = await Promise.all(promesas);
        if (!fichaData?.ok) {
          box.innerHTML = `<div class="panel-card" style="color:var(--danger); font-weight:700;">❌ ${esc(fichaData?.error || 'No se pudo cargar la ficha.')}</div>`;
          return;
        }
        if (qrData?.ok) {
          CSTATE.qrCachePorNodo[nodoId] = qrData;
        }
        CSTATE.fichaActual = fichaData;
        renderizarFichaIntegral();
      } catch (e) {
        box.innerHTML = `<div class="panel-card" style="color:var(--danger); font-weight:700;">❌ Error de red al cargar el nodo.</div>`;
      }
    }

    async function rotarTokenGestorDesdeCentro(nodoId) {
      if (!confirm('¿Rotar la clave secreta del QR de Gestor? El enlace anterior dejará de funcionar y deberás escanear el nuevo QR en el celular del Gestor.')) {
        return;
      }
      const resp = await fetch(`/api/produccion/nodos/accesos-qr/nodo/${Number(nodoId)}/rotar-token`, { method: 'POST' });
      const data = await resp.json();
      if (resp.ok && data.ok) {
        CSTATE.qrCachePorNodo[nodoId] = data;
        renderizarFichaIntegral();
      } else {
        alert(data.error || 'No se pudo rotar el token del Gestor.');
      }
    }

    function renderizarPillsNodosRadar() {
      const box = document.getElementById('radar-nodos-pills');
      if (!box) return;
      const actual = String(CSTATE.radar.nodoFiltro || 'todos');
      const pills = [
        `<button type="button" class="pill-btn ${actual === 'todos' ? 'active' : ''}"
           onclick="CSTATE.radar.nodoFiltro='todos'; renderizarPillsNodosRadar(); cargarRadarAnalitica();">
           🌐 Todos los Nodos
         </button>`
      ];
      for (const n of CSTATE.nodos) {
        const sel = actual === String(n.id) || actual.toLowerCase() === n.slug.toLowerCase();
        pills.push(`
          <button type="button" class="pill-btn ${sel ? 'active' : ''}"
            onclick="CSTATE.radar.nodoFiltro='${Number(n.id)}'; renderizarPillsNodosRadar(); cargarRadarAnalitica();">
            <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:${esc(n.color_primario || '#16a34a')}; margin-right:4px;"></span>
            ${esc(n.nombre_marca.split('·')[0].trim())}
          </button>
        `);
      }
      box.innerHTML = pills.join('');

    function configurarAutoRefreshRadar() {
      detenerAutoRefreshRadar();
      const chk = document.getElementById('chk-autorefresh-radar');
      if (chk && chk.checked && CSTATE.tabActiva === 'radar') {
        CSTATE.radar.timer = setInterval(() => {
          if (CSTATE.tabActiva === 'radar' && !document.hidden) {
            cargarRadarAnalitica(true);
          }
        }, 20000);
      }

    function detenerAutoRefreshRadar() {
      if (CSTATE.radar.timer) {
        clearInterval(CSTATE.radar.timer);
        CSTATE.radar.timer = null;
      }

    function iconoOrigenTrafico(origen) {
      const o = String(origen || 'Directo').toLowerCase();
      if (o.includes('whatsapp')) return '💬 WhatsApp';
      if (o.includes('instagram')) return '📸 Instagram';
      if (o.includes('tiktok')) return '🎵 TikTok';
      if (o.includes('facebook')) return '📘 Facebook';
      if (o.includes('qr')) return '🔳 QR Afiche';
      if (o.includes('google')) return '🔎 Google';
      if (o.includes('panel')) return '🛠️ Panel LAMDA';
      return '🔗 ' + (origen || 'Directo');
    }

    function etiquetaLegibleEvento(ev) {
      switch (ev.tipo_evento) {
        case 'vista_tienda':
          return ev.producto_nombre ? `Ingresó a tienda (foco: ${ev.producto_nombre})` : 'Ingresó a la tienda vecinal';
        case 'vista_seguimiento':
          return `Abrió seguimiento de pedido ${ev.codigo_pedido ? '#' + ev.codigo_pedido : ''}`;
        case 'vista_mi_cuenta':
          return 'Abrió su resumen personal Mi Cuenta';
        case 'categoria_seleccionada':
          return `Exploró rubro: ${ev.categoria_nombre || 'General'}`;
        case 'busqueda_lupa':
          return `Buscó en la lupa: "${ev.termino_busqueda || ''}"`;
        case 'clic_que_contiene':
          return `Consultó "¿Qué contiene?": ${ev.producto_nombre || ev.sku_nodo || ''}`;
        case 'vista_producto':
          return `Visualizó producto: ${ev.producto_nombre || ev.sku_nodo || ''}`;
        case 'carrito_agregar':
          return `Sumó al carrito: ${ev.producto_nombre || ev.sku_nodo || ''} (en carrito: ${ev.carrito_unidades} u. · ${fmtMoneda(ev.carrito_subtotal)})`;
        case 'carrito_quitar':
          return `Quitó del carrito: ${ev.producto_nombre || ev.sku_nodo || ''} (en carrito: ${ev.carrito_unidades} u.)`;
        case 'inicio_checkout':
          return `Inició Checkout de confirmación (${ev.carrito_unidades} u. · ${fmtMoneda(ev.carrito_subtotal)})`;
        case 'pedido_confirmado':
          return `✅ Confirmó Pedido ${ev.codigo_pedido ? '#' + ev.codigo_pedido : ''} (${fmtMoneda(ev.carrito_subtotal)})`;
        case 'marcar_admin_gestor':
          return `Actualizó rol de dispositivo (${ev.detalle || 'Admin/Gestor'})`;
        default:
          return ev.tipo_evento;
      }
    }

    async function cargarRadarAnalitica(silencioso = false) {
      const rango = document.getElementById('radar-rango-select')?.value || CSTATE.radar.rango || 'hoy';
      const fechaSel = document.getElementById('radar-fecha-select')?.value || CSTATE.radar.fecha || '';
      const audiencia = document.getElementById('radar-audiencia-select')?.value || 'clientes';
      CSTATE.radar.rango = rango;
      CSTATE.radar.audiencia = audiencia;

      if (!silencioso && !CSTATE.radar.datos) {
        document.getElementById('radar-feed-container').innerHTML = `<div style="padding:28px; text-align:center; color:var(--muted); font-weight:700;">⏳ Consultando telemetría de tiendas en tiempo real...</div>`;
      }

      const qs = new URLSearchParams({
        nodo_id: String(CSTATE.radar.nodoFiltro || 'todos'),
        rango,
        audiencia
      });
      if (rango === 'hoy' && fechaSel) {
        qs.set('fecha', fechaSel);
      }

      const resp = await fetch(`/api/produccion/nodos/centro-analitica/radar?${qs.toString()}`, { cache: 'no-store' });
      const data = await resp.json();
      if (!resp.ok || !data.ok) return;

      CSTATE.radar.datos = data;
      CSTATE.radar.fecha = data.filtros.fecha;

      // Poblar selector de fechas con actividad
      const selFecha = document.getElementById('radar-fecha-select');
      if (selFecha) {
        const fechasSet = new Map();
        fechasSet.set(data.filtros.hoy_argentina, {
          fecha: data.filtros.hoy_argentina,
          label: `Hoy (${data.filtros.hoy_argentina})`
        });
        for (const fd of (data.fechas_disponibles || [])) {
          const esHoy = fd.fecha === data.filtros.hoy_argentina;
          fechasSet.set(fd.fecha, {
            fecha: fd.fecha,
            label: `${esHoy ? 'Hoy ' : ''}${fd.fecha} (${fd.visitantes_clientes} vec.${fd.visitantes_admin ? ` + ${fd.visitantes_admin} adm.` : ''})`
          });
        }
        selFecha.innerHTML = Array.from(fechasSet.values()).map(f =>
          `<option value="${esc(f.fecha)}" ${f.fecha === data.filtros.fecha ? 'selected' : ''}>${esc(f.label)}</option>`
        ).join('');
        selFecha.style.display = rango === 'hoy' ? 'inline-block' : 'none';
      }

      renderizarKpisRadar();
      renderizarComparativaNodosRadar();
      renderizarInsightsRadar();
      renderizarFeedRadar();
    }

              : '<span class="kpi-sub">Sin tráfico en este filtro</span>'
            }
          </div>
          <div class="kpi-sub">📱 ${k.dispositivos.celulares} Celulares · 🖥️ ${k.dispositivos.pcs} PC${k.dispositivos.bots ? ` · 🤖 ${k.dispositivos.bots} previews` : ''}</div>
        </div>
      `;
    }

    function renderizarComparativaNodosRadar() {
      const box = document.getElementById('radar-comparativa-nodos-box');
      const data = CSTATE.radar.datos;
      if (!box || !data) return;
      if (String(data.filtros.nodo_id) !== 'todos' || !Array.isArray(data.por_nodo) || data.por_nodo.length <= 1) {
        box.innerHTML = '';
        return;
      }

      box.innerHTML = `
        <div class="panel-card" style="padding:12px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
          <span style="font-size:0.76rem; font-weight:900; text-transform:uppercase; color:var(--muted);">Pulso por Nodo:</span>
          ${data.por_nodo.map(pn => `
            <button type="button" class="btn" onclick="CSTATE.radar.nodoFiltro='${Number(pn.nodo_id)}'; renderizarPillsNodosRadar(); cargarRadarAnalitica();">
              <span style="width:9px; height:9px; border-radius:50%; background:${esc(pn.color_primario || '#16a34a')}; display:inline-block;"></span>
              <strong>${esc(pn.nombre_marca.split('·')[0].trim())}</strong>:
              ${pn.visitantes} vis. · ${pn.agregados_carrito} carr. · <span style="color:#15803d;">${pn.pedidos} ped.</span>
            </button>
          `).join('')}
        </div>
      `;
    }

    function renderizarInsightsRadar() {
      const data = CSTATE.radar.datos;
      if (!data) return;

      const carts = data.carritos_sin_cerrar || [];
      const cats = data.top_categorias || [];
      const busq = data.top_busquedas || [];
      const prods = data.top_productos_interes || [];

      document.getElementById('radar-insights-container').innerHTML = `
        <!-- PANEL 1: CARRITOS EN CURSO / ABANDONADOS -->
        <div class="panel-card">
          <div class="panel-title">
            <span>🛒 Carritos Abiertos / Abandonados (${carts.length})</span>
          </div>
          ${carts.length === 0
            ? `<div style="font-size:0.82rem; color:var(--muted); padding:10px 0;">No hay carritos pendientes sin confirmar en este momento.</div>`
            : `<div style="display:flex; flex-direction:column; gap:9px; max-height:260px; overflow-y:auto;">
                ${carts.map(c => {
                  const telClean = String(c.vecino_telefono || '').replace(/\D+/g, '');
                  const waHref = telClean ? `https://wa.me/${telClean.startsWith('54') ? telClean : '549' + telClean}` : '';
                  return `
                    <div style="border:1px solid ${c.estado_carrito === 'ABANDONADO' ? '#fcd34d' : '#cbd5e1'}; background:${c.estado_carrito === 'ABANDONADO' ? '#fffbeb' : '#f8fafc'}; border-radius:10px; padding:9px 11px; font-size:0.79rem;">
                      <div style="display:flex; justify-content:space-between; align-items:center; gap:6px; flex-wrap:wrap;">
                        <div>
                          <strong>${c.identificado ? '👤 ' + esc(c.vecino_nombre) : '🕵️ Visitante ' + esc(c.alias_corto)}</strong>
                          <span class="badge-pill" style="background:#fff; border:1px solid var(--border); margin-left:4px;">${esc((c.nodo_nombre || '').split('·')[0].trim())}</span>
                        </div>
                        <span class="badge-pill" style="background:${c.estado_carrito === 'ABANDONADO' ? '#fef3c7' : '#dcfce7'}; color:${c.estado_carrito === 'ABANDONADO' ? '#92400e' : '#166534'};">
                          ${c.estado_carrito === 'ABANDONADO' ? `⚠️ Abandonado (hace ${c.minutos_inactivo}m)` : `🟢 En tienda (${c.minutos_inactivo}m)`}
                        </span>
                      </div>
                      <div style="margin-top:5px; color:#334155;">
                        ${c.items.map(it => `${Number(it.cantidad)}x ${esc(it.nombre)}${it.presentacion ? ' (' + esc(it.presentacion) + ')' : ''}`).join(' · ')}
                      </div>
                      <div style="margin-top:5px; display:flex; justify-content:space-between; align-items:center;">
                        <strong style="color:#0f172a;">Subtotal: ${fmtMoneda(c.subtotal)} (${c.unidades} u.)</strong>
                        ${waHref ? `<a href="${esc(waHref)}" target="_blank" rel="noopener" style="color:#15803d; font-weight:800; text-decoration:none;">💬 ${esc(c.vecino_telefono)}</a>` : `<span style="color:var(--muted);">${esc(iconoOrigenTrafico(c.origen_trafico))}</span>`}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>`
          }
        </div>

        <!-- PANEL 2: RUBROS Y BÚSQUEDAS EN LUPA -->
        <div class="panel-card">
          <div class="panel-title"><span>🏷️ Rubros Visitados y Lupa</span></div>
          <div style="font-size:0.74rem; font-weight:800; color:var(--muted); text-transform:uppercase; margin-bottom:6px;">Categorías más elegidas</div>
          <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;">
            ${cats.length > 0
              ? cats.map(c => `<span class="chip">📂 ${esc(c.categoria)} <strong>(${c.clics})</strong></span>`).join('')
              : '<span style="font-size:0.8rem; color:var(--muted);">Sin clics de rubros registrados.</span>'
            }
          </div>
          <div style="font-size:0.74rem; font-weight:800; color:var(--muted); text-transform:uppercase; margin-bottom:6px;">Textos buscados en la lupa</div>
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            ${busq.length > 0
              ? busq.map(b => `<span class="chip" style="background:#eff6ff; border-color:#bfdbfe; color:#1e3a8a;">🔍 "${esc(b.termino)}" <strong>×${b.cantidad}</strong></span>`).join('')
              : '<span style="font-size:0.8rem; color:var(--muted);">Sin búsquedas en este período.</span>'
            }
          </div>
        </div>

        <!-- PANEL 3: PRODUCTOS DE MAYOR INTERÉS -->
        <div class="panel-card">
          <div class="panel-title"><span>🥣 Productos con Mayor Interés</span></div>
          ${prods.length === 0
            ? `<div style="font-size:0.82rem; color:var(--muted);">Sin interacciones sobre productos específicos todavía.</div>`
            : `<div style="display:flex; flex-direction:column; gap:6px; max-height:250px; overflow-y:auto;">
                ${prods.slice(0, 8).map(p => `
                  <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 8px; background:#f8fafc; border-radius:8px; font-size:0.79rem;">
                    <div style="font-weight:700; color:#0f172a;">${esc(p.producto_nombre)}</div>
                    <div style="white-space:nowrap; font-size:0.73rem; color:#475569;">
                      ${p.vistas_detalle ? `🥣 ${p.vistas_detalle} ing.` : ''}
                      ${p.veces_agregado ? ` · 🛒 <strong>+${p.veces_agregado}</strong>` : ''}
                    </div>
                  </div>
                `).join('')}
              </div>`
          }
        </div>
      `;
    }

    function renderizarFeedRadar() {
      const container = document.getElementById('radar-feed-container');
      const data = CSTATE.radar.datos;
      if (!container || !data) return;

      if (CSTATE.radar.vistaPlana) {
        const flujo = data.flujo_cronologico || [];
        container.innerHTML = `
          <div class="panel-title">
            <span>📋 Flujo Cronológico de Nube (${flujo.length} eventos)</span>
          </div>
          ${flujo.length === 0
            ? `<div style="padding:24px; text-align:center; color:var(--muted);">Sin eventos para los filtros seleccionados.</div>`
            : `<div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Hora</th>
                      <th>Nodo</th>
                      <th>Visitante / Vecino</th>
                      <th>Origen / Disp.</th>
                      <th>Acción en Tienda</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${flujo.map(ev => `
                      <tr>
                        <td style="white-space:nowrap; font-family:monospace;">${esc(ev.fecha_arg)} ${esc(ev.hora_arg)}</td>
                        <td><span class="badge-pill" style="background:#f1f5f9;">${esc((ev.nodo_nombre || ev.nodo_slug || '').split('·')[0].trim())}</span></td>
                        <td>
                          ${ev.es_admin_gestor ? '🛠️ ' : (ev.vecino_nombre_resuelto ? '👤 ' : '🕵️ ')}
                          <strong>${esc(ev.vecino_nombre_resuelto || (ev.es_admin_gestor ? (ev.etiqueta_dispositivo || 'Admin / Gestor') : '#' + String(ev.visitor_id).slice(-4).toUpperCase()))}</strong>
                        </td>
                        <td style="font-size:0.75rem;">${esc(iconoOrigenTrafico(ev.origen_trafico))} · ${ev.dispositivo_modo === 'Celular' ? '📱' : '🖥️'} ${esc(ev.sistema_operativo || '')}</td>
                        <td>${esc(etiquetaLegibleEvento(ev))}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>`
          }
        `;
        return;
      }

      const grupos = data.radar_visitantes || [];
      container.innerHTML = `
        <div class="panel-title">
          <span>📡 Radar de Visitantes y Compradores (${grupos.length} sesiones agrupadas)</span>
          <span style="font-size:0.76rem; font-weight:600; color:var(--muted);">Tocá una fila para desplegar el recorrido paso a paso</span>
        </div>
        ${grupos.length === 0
          ? `<div style="padding:28px; text-align:center; color:var(--muted); font-size:0.88rem;">
               No hay visitas registradas para este filtro. Abrí la tienda desde un enlace o cambiá el rango de fechas.
             </div>`
          : grupos.map(g => {
              const claseEstado = g.es_admin_gestor
                ? 'admin-dev'
                : (g.compro_en_visita ? 'bought' : (g.carrito_actual_unidades > 0 ? 'abandoned' : ''));

              const tituloQuien = g.es_admin_gestor
                ? `🛠️ ${esc(g.etiqueta_dispositivo || (g.vecino_nombre ? g.vecino_nombre + ' (Admin/Gestor)' : 'Dispositivo Admin / Gestor'))}`
                : (g.identificado
                    ? `👤 ${esc(g.vecino_nombre)}${g.vecino_telefono ? ` · <span style="font-weight:700; color:#15803d;">${esc(g.vecino_telefono)}</span>` : ''}`
                    : `🕵️ Visitante Anónimo ${esc(g.alias_visitante)}`);

              const badgeConversion = g.compro_en_visita
                ? `<span class="badge-pill" style="background:#dcfce7; color:#166534;">✅ COMPRÓ ${g.codigos_pedido.length ? '#' + esc(g.codigos_pedido.join(', #')) : ''}</span>`
                : (g.carrito_actual_unidades > 0
                    ? `<span class="badge-pill" style="background:#fef3c7; color:#92400e;">🛒 Dejó carrito (${g.carrito_actual_unidades} u. · ${fmtMoneda(g.carrito_actual_subtotal)})</span>`
                    : (g.iniciaron_checkout
                        ? `<span class="badge-pill" style="background:#ffedd5; color:#9a3412;">⏸️ Abrió Checkout sin confirmar</span>`
                        : `<span class="badge-pill" style="background:#f1f5f9; color:#475569;">👀 Exploró (${g.eventos.length} ev.)</span>`));

              return `
                <details class="visitor-card ${claseEstado}">
                  <summary class="visitor-summary">
                    <div style="flex:1; min-width:260px;">
                      <div style="display:flex; align-items:center; gap:7px; flex-wrap:wrap;">
                        <span style="font-size:0.93rem; font-weight:900; color:var(--text);">${tituloQuien}</span>
                        ${!g.es_admin_gestor ? `
                          <span class="badge-pill" style="background:${g.es_recurrente ? '#e0e7ff' : '#f1f5f9'}; color:${g.es_recurrente ? '#3730a3' : '#475569'};">
                            ${g.es_recurrente ? `Recurrente (${g.total_sesiones_historicas} vis.)` : 'Nuevo'}
                          </span>
                        ` : ''}
                        <span class="badge-pill" style="background:#fff; border:1px solid ${esc(g.nodo_color)}; color:#0f172a;">
                          🏘️ ${esc((g.nodo_nombre || g.nodo_slug || '').split('·')[0].trim())}
                        </span>
                      </div>

                      <div style="margin-top:5px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
                        <span class="chip">${esc(iconoOrigenTrafico(g.origen_trafico))}</span>
                        <span class="chip">${g.dispositivo_modo === 'Celular' ? '📱' : '🖥️'} ${esc(g.sistema_operativo)}</span>
                        ${g.categorias_vistas.map(c => `<span class="chip">📂 ${esc(c)}</span>`).join('')}
                        ${g.busquedas.map(b => `<span class="chip" style="background:#eff6ff; color:#1e40af;">🔍 "${esc(b)}"</span>`).join('')}
                        ${g.productos_interes.slice(0, 3).map(p => `<span class="chip" style="background:#f0fdf4; color:#166534;">🥣 ${esc(p)}</span>`).join('')}
                      </div>
                    </div>

                    <div style="text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:5px;">
                      ${badgeConversion}
                      <div style="font-size:0.75rem; font-family:monospace; color:var(--muted);">
                        🕒 ${esc(g.fecha_arg)} · ${esc(g.primera_hora.slice(0, 5))}${g.ultima_hora !== g.primera_hora ? ' → ' + esc(g.ultima_hora.slice(0, 5)) : ''} hs
                      </div>
                    </div>
                  </summary>

                  <div class="visitor-timeline">
                    ${g.carrito_actual_items && g.carrito_actual_items.length > 0 ? `
                      <div style="margin-bottom:8px; padding:7px 10px; background:#fffbeb; border:1px solid #fde68a; border-radius:8px; font-size:0.78rem; color:#92400e;">
                        <strong>🛒 Productos actualmente en su carrito:</strong>
                        ${g.carrito_actual_items.map(it => `${Number(it.cantidad)}x ${esc(it.nombre)} (${fmtMoneda(it.subtotal)})`).join(' · ')}
                      </div>
                    ` : ''}
                    <div style="display:flex; flex-direction:column; gap:5px;">
                      ${g.eventos.slice().reverse().map(ev => `
                        <div style="display:flex; gap:10px; font-size:0.79rem; padding:3px 0; border-bottom:1px dashed #e2e8f0;">
                          <span style="font-family:monospace; color:#64748b; white-space:nowrap;">${esc(ev.hora)}</span>
                          <span style="color:#0f172a; font-weight:${ev.tipo_evento === 'pedido_confirmado' ? '900' : '600'};">${esc(etiquetaLegibleEvento(ev))}</span>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                </details>
              `;
            }).join('')
        }
      `;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      inicializarEnlacesNavegacionInterna();
      renderizarEstadoAdminPc();
      const params = new URLSearchParams(window.location.search);
      const tabInicial = (params.get('tab') || 'fichas').trim().toLowerCase();
      const nodoQuery = (params.get('nodo') || '').trim();
      if (nodoQuery) {
        CSTATE.radar.nodoFiltro = nodoQuery;
      }

      await cargarResumenNodos(true);
      if (tabInicial === 'radar') {
        cambiarTabPrincipal('radar');
      }
    });
  </script>
</body>
</html>
