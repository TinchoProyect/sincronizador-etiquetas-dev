                  <button type="button" class="btn-soft" style="font-size:0.78rem; padding:6px 11px;"
                    onclick="sumarCatalogoBaseAMiOferta(${c.catalogo_id})">

            </p>

            </button>
          </div>

        `;
      }

      const tieneTexto = Boolean(String(GSTATE.ofertasBusquedaTexto || '').trim());
      return `
        <div class="card">
          <p style="margin:0 0 11px 0; font-size:0.83rem; color:var(--muted);">

          <div id="ofertas-tabs-bar" class="ofertas-tabs-row" role="tablist" aria-label="Estado de artículos">

            <input type="text" id="ofertas-search-input" class="ofertas-search-input"

              placeholder="🔍 Buscar por nombre, SKU, presentación o categoría..."
              oninput="filtrarTextoOfertasGestor(this.value)"
              onkeydown="if(event.key==='Escape') limpiarBusquedaOfertasGestor();" />
            <button type="button" id="ofertas-clear-search" class="ofertas-search-clear"
              style="display:${tieneTexto ? 'inline-flex' : 'none'};"
              aria-label="Limpiar búsqueda" title="Limpiar búsqueda"
              onclick="limpiarBusquedaOfertasGestor()">✕</button>
          </div>

          <div id="ofertas-cats-bar" class="ofertas-cats-strip" role="group" aria-label="Filtrar por categoría">
            ${renderizarChipsCategoriasOfertasHtml()}

            ${renderizarListadoTarjetasOfertasHtml()}

        ${disponiblesCatHtml}

    }

    async function sumarCatalogoBaseAMiOferta(catalogoId, abrirOfertasDespues = false) {
      if (!GSTATE.nodo || !catalogoId) return;
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/sumar-catalogo`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ catalogo_id: Number(catalogoId) })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo sumar el producto: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          return;
        }
        await cargarPanelGestor();
        mostrarAvisoPantallaGestor('✓ Producto sumado a Mi Oferta y Márgenes.', 'ok');
        if (abrirOfertasDespues) {
          abrirSeccionGestor('ofertas');
        }
      } catch (err) {
        mostrarAvisoPantallaGestor('Falla de conexión al intentar sumar el producto. Verificá tu señal e intentá de nuevo.', 'error');
      }
    }

    async function guardarCambioOferta(ofertaId, body) {
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/ofertas-gestor/${ofertaId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo guardar el cambio: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          return false;
        }
        await cargarPanelGestor();
        return true;
      } catch (_) {
        mostrarAvisoPantallaGestor('Falla de comunicación al guardar la oferta.', 'error');
        return false;
      }
    }

    async function cambiarEstadoPublicacionOferta(ofertaId, publicar, ctrlEl) {
      if (ctrlEl && ctrlEl.disabled) return;
      const esCheckbox = Boolean(ctrlEl && ctrlEl.tagName === 'INPUT' && ctrlEl.type === 'checkbox');
      const textoOriginal = (!esCheckbox && ctrlEl) ? ctrlEl.textContent : '';
      if (ctrlEl) {
        ctrlEl.disabled = true;
        if (!esCheckbox) {
          ctrlEl.textContent = publicar ? 'Activando...' : 'Actualizando...';
        }
      }
      const ok = await guardarCambioOferta(ofertaId, { publicado_tienda: Boolean(publicar) });
      if (!ok && ctrlEl) {
        ctrlEl.disabled = false;
        if (esCheckbox) {
          ctrlEl.checked = !publicar;
        } else {
          ctrlEl.textContent = textoOriginal;
        }
        return;
      }
      if (ok) {
        mostrarAvisoPantallaGestor(
          publicar
            ? '🟢 Producto activado y visible para tus clientes.'
            : '⏸️ Producto desactivado (sigue guardado en tu catálogo).',
          'ok'
        );
      }
    }

    async function guardarPrecioDirectoOferta(ofertaId, base, nuevoPrecio) {
      const margen = base > 0 ? Number((((nuevoPrecio - base) / base) * 100).toFixed(2)) : 0;
      await guardarCambioOferta(ofertaId, {
        margen_gestor_pct: Math.max(0, margen),
        precio_venta_vecino: nuevoPrecio
      });
    }

    // -------------------------------------------------------------------------
    // 2. PEDIR NUEVA FRACCIÓN (CONECTADO DETERMINÍSTICAMENTE A INGREDIENTES LAMDA)
    // -------------------------------------------------------------------------
    function normalizarTextoGestor(str) {
      return String(str ?? '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase();
    }

    function formatearPesoCortoGestor(kilos) {
      const kg = Number(kilos || 0);
      const gramos = Math.round(kg * 1000);
      if (gramos >= 1000 && gramos % 1000 === 0) return `${gramos / 1000} kg`;
      if (gramos >= 1000) return `${Number(kg.toFixed(2))} kg`;
      return `${gramos}g`;
    }

    function obtenerIngredientesFiltradosGestor(categoria, filtroTexto) {
      const listaCat = (GSTATE.ingredientesDisponibles || []).filter(
        i => String(i.categoria_lamda || i.categoria_gestor || '') === String(categoria || '')
      );
      const terminos = normalizarTextoGestor(filtroTexto).split(/\s+/).filter(Boolean);
      if (terminos.length === 0) return listaCat;
      return listaCat.filter(i => {
        const bolsa = normalizarTextoGestor(
          `${i.id} ${i.codigo || ''} ${i.nombre_oficial || ''} ${i.label_oficial || ''} ${i.nombre_claro || ''} ${i.categoria_lamda || i.categoria_gestor || ''} ${i.articulo_vinculado_numero || ''}`
        );
        return terminos.every(t => bolsa.includes(t));
      });
    }

    function obtenerIngredienteSeleccionadoGestor() {
      if (!GSTATE.propCategoriaSel || !GSTATE.propIngredienteIdSel) return null;
      return (GSTATE.ingredientesDisponibles || []).find(
        i => Number(i.id) === Number(GSTATE.propIngredienteIdSel) &&
             String(i.categoria_lamda || i.categoria_gestor || '') === String(GSTATE.propCategoriaSel || '')
      ) || null;
    }

    function obtenerOpcionesGramajeIngrediente(ingObj) {
      const base = ingObj && ingObj.es_pack_barritas
        ? [
            { label: 'Pack x 3 (150 g)', val: 0.15 },
            { label: 'Pack x 6 (300 g)', val: 0.30 },
            { label: 'Pack x 12 (600 g)', val: 0.60 },
            { label: 'Caja x 20 (1 kg)', val: 1.00 }
          ]
        : [
            { label: '100 g', val: 0.10 },
            { label: '150 g', val: 0.15 },
            { label: '200 g', val: 0.20 },
            { label: '250 g', val: 0.25 },
            { label: '400 g', val: 0.40 },
            { label: '500 g', val: 0.50 },
            { label: '1 kg', val: 1.00 }
          ];

      const presExistentes = Array.isArray(ingObj?.presentaciones_lamda) ? ingObj.presentaciones_lamda : [];
      for (const p of presExistentes) {
        const kv = Number(p.kilos_unidad || 0);
        if (kv > 0 && !base.some(b => Math.abs(b.val - kv) < 0.003)) {
          base.push({
            label: p.etiqueta || formatearPesoCortoGestor(kv),
            val: kv
          });
        }
      }
      base.sort((a, b) => a.val - b.val);
      return base;
    }

    function evaluarEstadoGramajeParaGestor(ingObj, kilos) {
      const idNum = Number(ingObj?.id || 0);
      const kgNum = Number(kilos || 0);
      if (!idNum || !kgNum) {
        return { tipo: 'NUEVA_DISPONIBLE' };
      }

      const enOfertaNodo = (GSTATE.ofertas || []).find(
        o => Number(o.ingrediente_origen_id) === idNum && Math.abs(Number(o.kilos_unidad) - kgNum) < 0.003
      );
      if (enOfertaNodo) {
        return { tipo: 'EN_OFERTA_NODO', oferta: enOfertaNodo };
      }

      const presLamda = (ingObj?.presentaciones_lamda || []).find(
        p => Math.abs(Number(p.kilos_unidad) - kgNum) < 0.003
      );
      if (presLamda && presLamda.en_catalogo_nodos) {
        return { tipo: 'EN_CATALOGO_NODOS', pres: presLamda };
      }

      const yaPendiente = (GSTATE.propuestas || []).find(
        p => p.estado === 'PENDIENTE_COTIZACION' &&
             Number(p.ingrediente_sugerido_id) === idNum &&
             Math.abs(Number(p.kilos_sugeridos) - kgNum) < 0.003
      );

      if (presLamda && presLamda.ya_produce_lamda) {
        return { tipo: 'YA_EXISTE_LAMDA', pres: presLamda, propuestaPendiente: yaPendiente || null };
      }

      if (yaPendiente) {
        return { tipo: 'YA_SOLICITADA', propuesta: yaPendiente };
      }

      return { tipo: 'NUEVA_DISPONIBLE' };
    }

    function elegirPrimerGramajeNuevoDisponible(ingObj) {
      if (!ingObj) return 0.25;
      const opciones = obtenerOpcionesGramajeIngrediente(ingObj);
      const preferidos = ingObj.es_pack_barritas
        ? [0.30, 0.15, 0.60, 1.00]
        : [0.25, 0.15, 0.10, 0.40, 0.20, 0.50, 1.00];

      for (const pref of preferidos) {
        const op = opciones.find(o => Math.abs(o.val - pref) < 0.003);
        if (op && evaluarEstadoGramajeParaGestor(ingObj, op.val).tipo === 'NUEVA_DISPONIBLE') {
          return op.val;
        }
      }
      const cualquieraNueva = opciones.find(o => evaluarEstadoGramajeParaGestor(ingObj, o.val).tipo === 'NUEVA_DISPONIBLE');
      return cualquieraNueva ? cualquieraNueva.val : (opciones[0] ? opciones[0].val : 0.25);
    }

    function renderResumenExistentesLamdaHtml(ingObj) {
      if (!ingObj) {
        return `
          <div style="font-size:0.75rem; color:var(--muted); margin-bottom:7px;">
            Elegí primero familia/rubro y producto oficial LAMDA arriba para consultar las presentaciones existentes y definir una nueva fracción.

          </div>

      }).join(' ');

      return `
        <div style="margin-bottom:8px; padding:8px 10px; border-radius:10px; background:#f8faf8; border:1px solid rgba(31,111,74,0.18); font-size:0.76rem; line-height:1.45;">
          <div style="color:var(--text); font-weight:800; margin-bottom:4px;">Artículos fraccionados existentes en Búnker LAMDA:</div>
          <div style="display:flex; flex-wrap:wrap; gap:5px;">${badges}</div>
          <div style="color:var(--muted); font-size:0.72rem; margin-top:4px;">
            Esas presentaciones ya existen; para pedir una <strong>nueva fracción</strong> elegí abajo otro gramaje distinto.
          </div>
        </div>
      `;
    }

    function renderOpcionesGramajePropuestaHtml(ingObj, kilosActuales, bloqueado = false) {
      if (bloqueado || !ingObj) {
        const vistaPrevia = ['100 g', '250 g', '500 g', '1 kg'];
        return vistaPrevia.map(label => `
          <button type="button" class="btn-soft" disabled style="cursor:not-allowed;">
            ${esc(label)}
          </button>
        `).join('');
      }

      const kg = Number(kilosActuales || 0);
      const opciones = obtenerOpcionesGramajeIngrediente(ingObj);

      return opciones.map(op => {
        const activo = kg > 0 && Math.abs(kg - op.val) < 0.003;
        const est = evaluarEstadoGramajeParaGestor(ingObj, op.val);

        let sufijo = '';
        let estiloExtra = '';

        if (est.tipo === 'EN_OFERTA_NODO' || est.tipo === 'EN_CATALOGO_NODOS') {
          sufijo = ' · ✓ Cotizada';
          estiloExtra = activo
            ? 'background:var(--ok-soft); border-color:var(--ok); color:var(--ok); font-weight:800;'
            : 'background:#f4faf6; border-color:rgba(31,111,74,0.28); color:var(--ok); opacity:0.9;';
        } else if (est.tipo === 'YA_EXISTE_LAMDA') {
          sufijo = est.propuestaPendiente ? ' · ⏳ Pedida' : ' · ✓ Ya existe';
          estiloExtra = activo
            ? 'background:#eef5f0; border-color:var(--ok); color:var(--ok); font-weight:800;'
            : 'background:#f5f6f4; border-color:#d6d3ce; color:#57534e;';
        } else if (est.tipo === 'YA_SOLICITADA') {
          sufijo = ' · ⏳ Solicitada';
          estiloExtra = activo
            ? 'background:var(--warn-soft); border-color:rgba(180,83,9,0.45); color:var(--warn); font-weight:800;'
            : 'background:#fffbeb; border-color:rgba(180,83,9,0.26); color:var(--warn);';
        } else if (activo) {
          estiloExtra = 'background:var(--brand-soft); border-color:var(--brand); color:var(--brand-dark); font-weight:800;';
        }

        return `
          <button type="button" class="btn-soft"
            onclick="fijarGramajePropuestaGestor(${op.val})"
            style="${estiloExtra}">
            ${esc(op.label)}${esc(sufijo)}
          </button>
        `;
      }).join('');
    }

    function renderAvisoEstadoGramajeHtml(ingObj, kilos) {
      if (!ingObj || !kilos) return '';
      const est = evaluarEstadoGramajeParaGestor(ingObj, kilos);
      const etPeso = formatearPesoCortoGestor(kilos);

      if (est.tipo === 'EN_OFERTA_NODO') {
        const of = est.oferta;
        return `
          <div style="padding:11px 12px; border-radius:11px; background:var(--ok-soft); border:1px solid rgba(31,111,74,0.30); color:var(--text); font-size:0.8rem; line-height:1.45;">
            <strong style="color:var(--ok);">✓ Ya tenés ${esc(etPeso)} cotizada en tu tienda</strong> (Costo Base <strong>${fmt(of.precio_base_nodo_final)}</strong>).<br>
            No corresponde volver a pedirla: configurala o publicala desde <strong>Mi Oferta y Márgenes</strong>.
            <div style="margin-top:8px;">
              <button type="button" class="btn-soft" style="font-size:0.76rem; padding:5px 11px;" onclick="abrirSeccionGestor('ofertas')">
                Ir a Mi Oferta y Márgenes →
              </button>
            </div>
          </div>
        `;
      }

      if (est.tipo === 'EN_CATALOGO_NODOS') {
        const pres = est.pres;
        return `
          <div style="padding:11px 12px; border-radius:11px; background:var(--ok-soft); border:1px solid rgba(31,111,74,0.30); color:var(--text); font-size:0.8rem; line-height:1.45;">
            <strong style="color:var(--ok);">✓ Esta medida (${esc(etPeso)}) ya está cotizada por LAMDA</strong> (${esc(pres.label_oficial || pres.sku)} · Costo Base <strong>${fmt(pres.precio_base_nodo_final)}</strong>).<br>
            No necesitás pedir cotización; sumala directo a tu tienda:
            <div style="margin-top:8px;">
              <button type="button" class="btn-primary" style="font-size:0.78rem; padding:6px 12px;"
                onclick="sumarCatalogoBaseAMiOferta(${pres.catalogo_id}, true)">
                + Sumar a Mi Oferta y Márgenes
              </button>
            </div>
          </div>
        `;
      }

      if (est.tipo === 'YA_EXISTE_LAMDA') {
        const refSku = est.pres?.label_oficial || est.pres?.sku || etPeso;
        if (est.propuestaPendiente) {
          return `
            <div style="padding:11px 12px; border-radius:11px; background:var(--warn-soft); border:1px solid rgba(180,83,9,0.28); color:var(--warn); font-size:0.8rem; line-height:1.45;">
              <strong>⏳ Habilitación ya solicitada (${esc(est.propuestaPendiente.codigo_propuesta)})</strong><br>
              Ya pediste habilitar esta presentación oficial existente <strong>${esc(refSku)}</strong> en tu tienda.
              <div style="margin-top:8px; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
                <span style="font-size:0.74rem;">¿La enviaste por error?</span>
                <button type="button" class="btn-soft"
                  style="font-size:0.75rem; padding:5px 10px; border-color:rgba(185,28,28,0.35); color:#b91c1c; background:#fff5f5;"
                  onclick="anularPropuestaGestor(${Number(est.propuestaPendiente.id)})">
                  ✕ Anular solicitud
                </button>
              </div>
            </div>
          `;
        }
        return `
          <div style="padding:11px 12px; border-radius:11px; background:#f4faf6; border:1px solid rgba(31,111,74,0.28); color:var(--text); font-size:0.8rem; line-height:1.45;">
            <strong style="color:var(--ok);">✓ LAMDA ya produce la presentación ${esc(refSku)}</strong><br>
            No debe solicitarse como nueva fracción a crear. Elegí arriba otro gramaje que aún no exista (por ejemplo <strong>100g</strong>, <strong>150g</strong> o <strong>400g</strong>).
            <div style="margin-top:8px; padding-top:7px; border-top:1px dashed rgba(31,111,74,0.22); display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
              <span style="font-size:0.74rem; color:var(--muted);">¿Querés vender esta presentación existente ${esc(etPeso)}?</span>
              <button type="button" class="btn-soft" style="font-size:0.75rem; padding:5px 10px;"
                onclick="enviarNuevaPropuestaGestor({ solicitarHabilitacionExistente: true })">
                Pedir que la habiliten en mi tienda
              </button>
            </div>
          </div>
        `;
      }

      if (est.tipo === 'YA_SOLICITADA') {
        return `
          <div style="padding:10px 12px; border-radius:11px; background:var(--warn-soft); border:1px solid rgba(180,83,9,0.25); color:var(--warn); font-size:0.8rem; line-height:1.45;">
            <strong>⏳ Solicitud en cotización (${esc(est.propuesta.codigo_propuesta)})</strong><br>
            Esta medida de <strong>${esc(etPeso)}</strong> ya fue enviada y está pendiente de cotización.
            <div style="margin-top:8px; padding-top:7px; border-top:1px dashed rgba(180,83,9,0.25); display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
              <span style="font-size:0.74rem;">¿Te equivocaste de gramaje o producto?</span>
              <button type="button" class="btn-soft"
                style="font-size:0.75rem; padding:5px 10px; border-color:rgba(185,28,28,0.35); color:#b91c1c; background:#fff5f5;"
                onclick="anularPropuestaGestor(${Number(est.propuesta.id)})">
                ✕ Anular solicitud
              </button>
            </div>
          </div>
        `;
      }

      return '';
    }

    function formatearValorInputPesoManual(kilos, unidad) {
      const k = Number(kilos || 0);
      if (!Number.isFinite(k) || k <= 0) return '';
      if (unidad === 'kg') {
        return String(Math.round(k * 1000) / 1000);
      }
      return String(Math.round(k * 1000 * 10) / 10);
    }

    function parsearKilosDesdeTextoManual(texto, unidad) {
      const limpio = String(texto ?? '').trim().replace(',', '.').replace(/\s+/g, '');
      if (!limpio || limpio === '.' || !/^\d*(\.\d+)?$/.test(limpio)) return 0;
      const num = Number(limpio);
      if (!Number.isFinite(num) || num <= 0) return 0;
      const kilos = unidad === 'kg' ? num : (num / 1000);
      return Number(kilos.toFixed(4));
    }

    function reiniciarFormularioPropuestaGestor({ conservarConfirmacion = false } = {}) {
      GSTATE.propCategoriaSel = '';
      GSTATE.propFiltroTexto = '';
      GSTATE.propIngredienteIdSel = 0;
      GSTATE.propIngredienteInicializadoId = 0;
      GSTATE.propKilosSel = 0;
      GSTATE.propPesoManualTexto = '';
      GSTATE.propUnidadPesoManual = 'g';
      GSTATE.propPrecioObjetivoTexto = '';
      GSTATE.propAliasVidrieraTexto = '';
      GSTATE.propComentarioTexto = '';
      if (!conservarConfirmacion) {
        GSTATE.propConfirmacionReciente = '';
      }
    }

    function acompanarScrollPasoGestor(elId) {
      setTimeout(() => {
        const el = document.getElementById(elId);
        if (!el) return;
        const rect = el.getBoundingClientRect();
        const vh = window.innerHeight || document.documentElement.clientHeight || 800;
        const headerOffset = 84;
        if (rect.bottom > vh - 16 || rect.top < headerOffset) {
          const targetY = window.scrollY + rect.top - headerOffset;
          window.scrollTo({ top: Math.max(0, targetY), behavior: 'smooth' });
        }
      }, 65);
    }

    function evaluarPasosPropuestaGestor() {
      const paso1Completo = Boolean(String(GSTATE.propCategoriaSel || '').trim());
      const ingSel = paso1Completo ? obtenerIngredienteSeleccionadoGestor() : null;
      const paso2Habilitado = paso1Completo;
      const paso2Completo = Boolean(paso1Completo && ingSel);
      const paso3Habilitado = paso2Completo;
      const kilos = paso3Habilitado ? Number(GSTATE.propKilosSel || 0) : 0;
      const estGramaje = (paso3Habilitado && kilos > 0) ? evaluarEstadoGramajeParaGestor(ingSel, kilos) : null;
      const paso3Valido = Boolean(paso3Habilitado && kilos > 0 && estGramaje && estGramaje.tipo === 'NUEVA_DISPONIBLE');
      const paso4Habilitado = paso3Valido;

      const clasePaso1 = !paso1Completo ? 'is-current' : 'is-done';
      const clasePaso2 = !paso2Habilitado ? 'is-locked' : (!paso2Completo ? 'is-current' : 'is-done');
      const clasePaso3 = !paso3Habilitado ? 'is-locked' : (!paso3Valido ? 'is-current' : 'is-done');
      const clasePaso4 = !paso4Habilitado ? 'is-locked' : 'is-current';

      return {
        paso1Completo,
        ingSel,
        paso2Habilitado,
        paso2Completo,
        paso3Habilitado,
        kilos,
        estGramaje,
        paso3Valido,
        paso4Habilitado,
        clasePaso1,
        clasePaso2,
        clasePaso3,
        clasePaso4
      };
    }

    function renderBadgeEstadoPasoPropuesta(clasePaso, textoCompletado = 'Listo', textoActivo = 'Paso activo') {
      if (clasePaso === 'is-locked') {
        return `<span class="prop-step-lock-hint">Completá el paso anterior</span>`;
      }
      if (clasePaso === 'is-done') {
        return `<span class="prop-step-status done">✓ ${esc(textoCompletado)}</span>`;
      }
      return `<span class="prop-step-status current">${esc(textoActivo)}</span>`;
    }

    function construirNombreFinalPropuestaGestor(ingSel, kilos) {
      if (!ingSel) return '';
      const baseTecnica = String(ingSel.label_oficial || ingSel.nombre_claro || ingSel.nombre_oficial || '').trim();
      if (!kilos || Number(kilos) <= 0) return baseTecnica;
      const etiquetaPeso = formatearPesoCortoGestor(kilos).replace(/\s+/g, '');
      return /\bx\s*\d+/i.test(baseTecnica) ? baseTecnica : `${baseTecnica} x ${etiquetaPeso}`;
    }

    function renderResumenPaso4PropuestaHtml(ev) {
      const catTxt = ev.paso1Completo ? GSTATE.propCategoriaSel : 'Sin elegir aún';
      const prodTxt = ev.ingSel ? (ev.ingSel.label_oficial || ev.ingSel.nombre_claro) : 'Sin elegir aún';
      let fracTxt = 'Sin definir aún';
      if (ev.paso3Valido) {
        fracTxt = `${formatearPesoCortoGestor(ev.kilos)} (${construirNombreFinalPropuestaGestor(ev.ingSel, ev.kilos)})`;
      } else if (ev.paso3Habilitado && ev.kilos > 0) {
        fracTxt = `${formatearPesoCortoGestor(ev.kilos)} — elegí arriba una medida nueva disponible`;
      }
      const notaTxt = ev.paso3Habilitado
        ? String((document.getElementById('prop-comentario')?.value ?? GSTATE.propComentarioTexto) || '').trim()
        : '';
      const aliasVidrieraTxt = ev.paso4Habilitado
        ? String((document.getElementById('prop-alias-vidriera')?.value ?? GSTATE.propAliasVidrieraTexto) || '').trim()
        : '';

      return `
        <div style="padding:10px 12px; border-radius:10px; background:var(--surface-warm); border:1px solid var(--border); font-size:0.8rem; line-height:1.5; margin-bottom:10px;">
          <div><span style="color:var(--muted); font-weight:700;">Familia / Rubro LAMDA:</span> <strong>${esc(catTxt)}</strong></div>
          <div><span style="color:var(--muted); font-weight:700;">Ingrediente Oficial:</span> <strong>${esc(prodTxt)}</strong></div>
          <div><span style="color:var(--muted); font-weight:700;">Fracción Solicitada:</span> <strong>${esc(fracTxt)}</strong></div>
          ${aliasVidrieraTxt ? `<div><span style="color:var(--muted); font-weight:700;">Alias pensado p/ mi vidriera:</span> <strong>"${esc(aliasVidrieraTxt)}"</strong></div>` : ''}
          ${notaTxt ? `<div><span style="color:var(--muted); font-weight:700;">Nota:</span> ${esc(notaTxt)}</div>` : ''}
        </div>
      `;
    }

    function sincronizarBotonEnvioPropuestaDom() {
      const ev = evaluarPasosPropuestaGestor();
      const btn = document.getElementById('btn-enviar-propuesta-gestor');
      if (btn) {
        btn.disabled = !ev.paso4Habilitado;
        btn.style.opacity = ev.paso4Habilitado ? '1' : '0.46';
        btn.textContent = 'Enviar solicitud';
      }
      const aliasEl = document.getElementById('prop-alias-vidriera');
      if (aliasEl) {
        aliasEl.disabled = !ev.paso4Habilitado;
        if (!ev.paso4Habilitado) aliasEl.value = '';
      }
      const resBox = document.getElementById('prop-resumen-seleccion');
      if (resBox) {
        resBox.innerHTML = renderResumenPaso4PropuestaHtml(ev);
      }
      const step1 = document.getElementById('prop-step-1');
      if (step1) step1.className = `prop-step-card ${ev.clasePaso1}`;
      const step2 = document.getElementById('prop-step-2');
      if (step2) step2.className = `prop-step-card ${ev.clasePaso2}`;
      const step3 = document.getElementById('prop-step-3');
      if (step3) step3.className = `prop-step-card ${ev.clasePaso3}`;
      const step4 = document.getElementById('prop-step-4');
      if (step4) step4.className = `prop-step-card ${ev.clasePaso4}`;

      const b1 = document.getElementById('prop-step-1-badge');
      if (b1) b1.innerHTML = renderBadgeEstadoPasoPropuesta(ev.clasePaso1, GSTATE.propCategoriaSel || 'Elegida', 'Paso 1 activo');
      const b2 = document.getElementById('prop-step-2-badge');
      if (b2) b2.innerHTML = renderBadgeEstadoPasoPropuesta(ev.clasePaso2, 'Ingrediente elegido', 'Elegí un ingrediente');
      const b3 = document.getElementById('prop-step-3-badge');
      if (b3) b3.innerHTML = renderBadgeEstadoPasoPropuesta(ev.clasePaso3, ev.kilos > 0 ? formatearPesoCortoGestor(ev.kilos) : 'Definida', 'Definí el gramaje');
      const b4 = document.getElementById('prop-step-4-badge');
      if (b4) b4.innerHTML = renderBadgeEstadoPasoPropuesta(ev.clasePaso4, 'Listo', 'Listo para enviar');
    }

    function actualizarControlesPropuestaEnVivo() {
      const ev = evaluarPasosPropuestaGestor();
      const totalCat = ev.paso1Completo
        ? (GSTATE.ingredientesDisponibles || []).filter(i => String(i.categoria_lamda || i.categoria_gestor || '') === String(GSTATE.propCategoriaSel || ''))
        : [];
      const filtrados = ev.paso1Completo
        ? obtenerIngredientesFiltradosGestor(GSTATE.propCategoriaSel, GSTATE.propFiltroTexto)
        : [];

      if (ev.paso1Completo && GSTATE.propIngredienteIdSel && !filtrados.some(i => Number(i.id) === Number(GSTATE.propIngredienteIdSel))) {
        GSTATE.propIngredienteIdSel = 0;
        GSTATE.propKilosSel = 0;
        GSTATE.propPesoManualTexto = '';
        GSTATE.propAliasVidrieraTexto = '';
      }

      const evSync = evaluarPasosPropuestaGestor();
      const ingSel = evSync.ingSel;

      const wrapFiltro = document.getElementById('prop-filtro-wrap');
      const inputFiltro = document.getElementById('prop-filtro-ingrediente');
      if (wrapFiltro) {
        wrapFiltro.style.display = (evSync.paso2Habilitado && totalCat.length > 8) ? 'block' : 'none';
      }
      if (inputFiltro) {
        inputFiltro.disabled = !evSync.paso2Habilitado;
      }

      const selIng = document.getElementById('prop-ingrediente');
      if (selIng) {
        selIng.disabled = !evSync.paso2Habilitado;
        if (!evSync.paso2Habilitado) {
          selIng.innerHTML = `<option value="">Elegí primero una familia / rubro en el Paso 1...</option>`;
        } else if (filtrados.length === 0) {
          selIng.innerHTML = `<option value="">Sin coincidencias en ${esc(GSTATE.propCategoriaSel)}</option>`;
        } else {
          selIng.innerHTML = `
            <option value="" ${!ingSel ? 'selected' : ''}>— Seleccioná un ingrediente LAMDA (${filtrados.length}) —</option>
            ${filtrados.map(i => `
              <option value="${i.id}" ${Number(i.id) === Number(GSTATE.propIngredienteIdSel) ? 'selected' : ''}>
                ${esc(i.label_oficial || i.nombre_claro)}
              </option>
            `).join('')}
          `;
        }
      }

      const resumenExistBox = document.getElementById('prop-resumen-existentes');
      if (resumenExistBox) {
        resumenExistBox.innerHTML = renderResumenExistentesLamdaHtml(ingSel);
      }

      const gramajesBox = document.getElementById('prop-gramajes-box');
      if (gramajesBox) {
        gramajesBox.innerHTML = renderOpcionesGramajePropuestaHtml(ingSel, GSTATE.propKilosSel, !evSync.paso3Habilitado);
      }

      const selUnidad = document.getElementById('prop-peso-unidad');
      if (selUnidad) {
        selUnidad.disabled = !evSync.paso3Habilitado;
        if (selUnidad.value !== GSTATE.propUnidadPesoManual) {
          selUnidad.value = GSTATE.propUnidadPesoManual;
        }
      }

      const inputPeso = document.getElementById('prop-peso-manual');
      if (inputPeso) {
        inputPeso.disabled = !evSync.paso3Habilitado;
        if (document.activeElement !== inputPeso) {
          inputPeso.value = evSync.paso3Habilitado
            ? formatearValorInputPesoManual(GSTATE.propKilosSel, GSTATE.propUnidadPesoManual)
            : '';
          inputPeso.placeholder = GSTATE.propUnidadPesoManual === 'kg' ? 'Ej: 0.35 o 2' : 'Ej: 350';
        }
      }

      const inputTarget = document.getElementById('prop-target');
      if (inputTarget) {
        inputTarget.disabled = !evSync.paso3Habilitado;
        if (!evSync.paso3Habilitado) inputTarget.value = '';
      }

      const inputComentario = document.getElementById('prop-comentario');
      if (inputComentario) {
        inputComentario.disabled = !evSync.paso3Habilitado;
        if (!evSync.paso3Habilitado) inputComentario.value = '';
      }

      const inputAlias = document.getElementById('prop-alias-vidriera');
      if (inputAlias) {
        inputAlias.disabled = !evSync.paso4Habilitado;
        if (!evSync.paso4Habilitado) inputAlias.value = '';
      }

      const confBox = document.getElementById('prop-confirmacion-reciente');
      if (confBox) {
        confBox.innerHTML = GSTATE.propConfirmacionReciente ? `
          <div style="padding:11px 13px; border-radius:11px; background:var(--ok-soft); border:1px solid rgba(31,111,74,0.35); color:var(--ok); font-size:0.82rem; font-weight:700; line-height:1.4; margin-bottom:12px;">
            ${esc(GSTATE.propConfirmacionReciente)}
          </div>
        ` : '';
      }

      const avisoBox = document.getElementById('prop-aviso-existente');
      if (avisoBox) {
        avisoBox.innerHTML = evSync.paso3Habilitado
          ? renderAvisoEstadoGramajeHtml(ingSel, GSTATE.propKilosSel)
          : '';
      }

      sincronizarBotonEnvioPropuestaDom();
    }

    function alCambiarCategoriaPropuestaGestor(nuevaCat) {
      GSTATE.propCategoriaSel = String(nuevaCat || '').trim();
      GSTATE.propFiltroTexto = '';
      GSTATE.propIngredienteIdSel = 0;
      GSTATE.propIngredienteInicializadoId = 0;
      GSTATE.propKilosSel = 0;
      GSTATE.propPesoManualTexto = '';
      GSTATE.propUnidadPesoManual = 'g';
      GSTATE.propPrecioObjetivoTexto = '';
      GSTATE.propAliasVidrieraTexto = '';
      GSTATE.propComentarioTexto = '';
      GSTATE.propConfirmacionReciente = '';

      const inputFiltro = document.getElementById('prop-filtro-ingrediente');
      if (inputFiltro) inputFiltro.value = '';
      const inputPeso = document.getElementById('prop-peso-manual');
      if (inputPeso) inputPeso.value = '';
      const inputTarget = document.getElementById('prop-target');
      if (inputTarget) inputTarget.value = '';
      const inputAlias = document.getElementById('prop-alias-vidriera');
      if (inputAlias) inputAlias.value = '';
      const inputComentario = document.getElementById('prop-comentario');
      if (inputComentario) inputComentario.value = '';

      actualizarControlesPropuestaEnVivo();
      if (GSTATE.propCategoriaSel) {
        acompanarScrollPasoGestor('prop-step-2');
      }
    }

    function alFiltrarIngredientesPropuestaGestor(texto) {
      GSTATE.propFiltroTexto = texto;
      GSTATE.propConfirmacionReciente = '';
      actualizarControlesPropuestaEnVivo();
    }

    function alCambiarIngredientePropuestaGestor(ingId) {
      GSTATE.propIngredienteIdSel = Number(ingId || 0);
      GSTATE.propKilosSel = 0;
      GSTATE.propPesoManualTexto = '';
      GSTATE.propUnidadPesoManual = 'g';
      GSTATE.propAliasVidrieraTexto = '';
      GSTATE.propConfirmacionReciente = '';

      const ingSel = obtenerIngredienteSeleccionadoGestor();

      const inputPeso = document.getElementById('prop-peso-manual');
      if (inputPeso) inputPeso.value = '';
      const inputAlias = document.getElementById('prop-alias-vidriera');
      if (inputAlias) inputAlias.value = '';

      actualizarControlesPropuestaEnVivo();
      if (ingSel) {
        acompanarScrollPasoGestor('prop-step-3');
      }
    }

    function fijarGramajePropuestaGestor(kilos) {
      const ingSel = obtenerIngredienteSeleccionadoGestor();
      if (!ingSel) return;
      GSTATE.propConfirmacionReciente = '';
      GSTATE.propKilosSel = Number(kilos || 0);
      GSTATE.propUnidadPesoManual = Number(GSTATE.propKilosSel) >= 1 ? 'kg' : 'g';
      GSTATE.propPesoManualTexto = formatearValorInputPesoManual(GSTATE.propKilosSel, GSTATE.propUnidadPesoManual);

      const selUnidad = document.getElementById('prop-peso-unidad');
      if (selUnidad) selUnidad.value = GSTATE.propUnidadPesoManual;
      const inputPeso = document.getElementById('prop-peso-manual');
      if (inputPeso) {
        inputPeso.value = GSTATE.propPesoManualTexto;
        inputPeso.placeholder = GSTATE.propUnidadPesoManual === 'kg' ? 'Ej: 0.35 o 2' : 'Ej: 350';
      }
      actualizarControlesPropuestaEnVivo();

      const ev = evaluarPasosPropuestaGestor();
      if (ev.paso4Habilitado) {
        acompanarScrollPasoGestor('prop-step-4');
      } else if (ev.kilos > 0) {
        acompanarScrollPasoGestor('prop-aviso-existente');
      }
    }

    function alEscribirPesoManualGestor(texto) {
      const ingSel = obtenerIngredienteSeleccionadoGestor();
      if (!ingSel) return;
      GSTATE.propConfirmacionReciente = '';
      GSTATE.propPesoManualTexto = texto;
      const unidad = document.getElementById('prop-peso-unidad')?.value || GSTATE.propUnidadPesoManual || 'g';
      const kilos = parsearKilosDesdeTextoManual(texto, unidad);

      GSTATE.propKilosSel = kilos > 0 ? kilos : 0;
      const gramajesBox = document.getElementById('prop-gramajes-box');
      if (gramajesBox) {
        gramajesBox.innerHTML = renderOpcionesGramajePropuestaHtml(ingSel, GSTATE.propKilosSel, false);
      }
      const avisoBox = document.getElementById('prop-aviso-existente');
      if (avisoBox) {
        avisoBox.innerHTML = GSTATE.propKilosSel > 0
          ? renderAvisoEstadoGramajeHtml(ingSel, GSTATE.propKilosSel)
          : '';
      }
      sincronizarBotonEnvioPropuestaDom();
    }

    function alSalirPesoManualGestor() {
      const inputPeso = document.getElementById('prop-peso-manual');
      if (!inputPeso || inputPeso.disabled) return;
      const unidad = document.getElementById('prop-peso-unidad')?.value || GSTATE.propUnidadPesoManual || 'g';
      const kilos = parsearKilosDesdeTextoManual(inputPeso.value, unidad);
      GSTATE.propKilosSel = kilos > 0 ? kilos : 0;
      inputPeso.value = formatearValorInputPesoManual(GSTATE.propKilosSel, unidad);
      actualizarControlesPropuestaEnVivo();
    }

    function alCambiarUnidadPesoManualGestor(nuevaUnidad) {
      const unidadDestino = nuevaUnidad === 'kg' ? 'kg' : 'g';
      const inputPeso = document.getElementById('prop-peso-manual');
      if (inputPeso && !inputPeso.disabled) {
        const kilosLeidos = parsearKilosDesdeTextoManual(inputPeso.value, GSTATE.propUnidadPesoManual);
        GSTATE.propKilosSel = kilosLeidos > 0 ? kilosLeidos : GSTATE.propKilosSel;
      }
      GSTATE.propUnidadPesoManual = unidadDestino;
      if (inputPeso && !inputPeso.disabled) {
        inputPeso.value = formatearValorInputPesoManual(GSTATE.propKilosSel, unidadDestino);
        inputPeso.placeholder = unidadDestino === 'kg' ? 'Ej: 0.35 o 2' : 'Ej: 350';
      }
      actualizarControlesPropuestaEnVivo();
    }

    function alEditarMetaPropuestaGestor() {
      const inpAlias = document.getElementById('prop-alias-vidriera');
      if (inpAlias) GSTATE.propAliasVidrieraTexto = inpAlias.value;
      const inpCom = document.getElementById('prop-comentario');
      if (inpCom) GSTATE.propComentarioTexto = inpCom.value;
      const inpTar = document.getElementById('prop-target');
      if (inpTar) GSTATE.propPrecioObjetivoTexto = inpTar.value;
      sincronizarBotonEnvioPropuestaDom();
    }

    function renderSeccionPropuestas() {
      const disponibles = GSTATE.ingredientesDisponibles || [];
      const categoriasUnicas = Array.from(new Set(disponibles.map(i => i.categoria_lamda || i.categoria_gestor)));
      if (GSTATE.propCategoriaSel && !categoriasUnicas.includes(GSTATE.propCategoriaSel)) {
        reiniciarFormularioPropuestaGestor({ conservarConfirmacion: true });
      }

      const ev = evaluarPasosPropuestaGestor();
      const totalEnCat = ev.paso1Completo
        ? disponibles.filter(i => (i.categoria_lamda || i.categoria_gestor) === GSTATE.propCategoriaSel)
        : [];
      const filtrados = ev.paso1Completo
        ? obtenerIngredientesFiltradosGestor(GSTATE.propCategoriaSel, GSTATE.propFiltroTexto)
        : [];
      const ingSel = ev.ingSel;

      return `
        <div class="propuestas-grid" style="display:grid; grid-template-columns: 1fr 1fr; gap:14px; align-items:start;">
          <div class="card">
            <h3 style="margin:0 0 6px 0; font-size:1rem;">Solicitar Nueva Fracción</h3>
            <p style="margin:0 0 12px 0; font-size:0.8rem; color:var(--muted);">
              Completá los pasos en orden seleccionando el ingrediente oficial LAMDA. Cuando se cotice su Precio Base aparecerá en <strong>Mi Oferta y Márgenes</strong> con su SKU oficial.
            </p>

            <div id="prop-confirmacion-reciente">
              ${GSTATE.propConfirmacionReciente ? `
                <div style="padding:11px 13px; border-radius:11px; background:var(--ok-soft); border:1px solid rgba(31,111,74,0.35); color:var(--ok); font-size:0.82rem; font-weight:700; line-height:1.4; margin-bottom:12px;">
                  ${esc(GSTATE.propConfirmacionReciente)}
                </div>
              ` : ''}
            </div>

            <div class="prop-steps-stack">
              <!-- PASO 1: FAMILIA / RUBRO OFICIAL LAMDA -->
              <div id="prop-step-1" class="prop-step-card ${ev.clasePaso1}">
                <div class="prop-step-head">
                  <div class="prop-step-title-wrap">
                    <span class="prop-step-num">1</span>
                    <span class="prop-step-title">Seleccionar Familia / Rubro LAMDA</span>
                  </div>
                  <div id="prop-step-1-badge">
                    ${renderBadgeEstadoPasoPropuesta(ev.clasePaso1, GSTATE.propCategoriaSel || 'Elegida', 'Paso 1 activo')}
                  </div>
                </div>
                <select id="prop-categoria" class="input-sm" style="width:100%;" onchange="alCambiarCategoriaPropuestaGestor(this.value)">
                  <option value="" ${!ev.paso1Completo ? 'selected' : ''}>— Seleccioná una familia / rubro —</option>
                  ${categoriasUnicas.map(cat => {
                    const count = disponibles.filter(i => (i.categoria_lamda || i.categoria_gestor) === cat).length;
                    return `<option value="${esc(cat)}" ${cat === GSTATE.propCategoriaSel ? 'selected' : ''}>${esc(cat)} (${count})</option>`;
                  }).join('')}
                </select>
              </div>

              <!-- PASO 2: INGREDIENTE / PRODUCTO OFICIAL LAMDA -->
              <div id="prop-step-2" class="prop-step-card ${ev.clasePaso2}">
                <div class="prop-step-head">
                  <div class="prop-step-title-wrap">
                    <span class="prop-step-num">2</span>
                    <span class="prop-step-title">Seleccionar Ingrediente / Producto LAMDA</span>
                  </div>
                  <div id="prop-step-2-badge">
                    ${renderBadgeEstadoPasoPropuesta(ev.clasePaso2, 'Ingrediente elegido', 'Elegí un ingrediente')}
                  </div>
                </div>
                <div id="prop-filtro-wrap" style="display:${(ev.paso2Habilitado && totalEnCat.length > 8) ? 'block' : 'none'}; margin-bottom:6px;">
                  <input type="text" id="prop-filtro-ingrediente" class="input-sm" style="width:100%; font-size:0.82rem;"
                    ${!ev.paso2Habilitado ? 'disabled' : ''}
                    value="${esc(GSTATE.propFiltroTexto)}"
                    oninput="alFiltrarIngredientesPropuestaGestor(this.value)"
                    placeholder="Filtrar por código o nombre dentro de este rubro..." />
                </div>
                <select id="prop-ingrediente" class="input-sm" style="width:100%;"
                  ${!ev.paso2Habilitado ? 'disabled' : ''}
                  onchange="alCambiarIngredientePropuestaGestor(this.value)">
                  ${!ev.paso2Habilitado
                    ? `<option value="">Elegí primero una familia / rubro en el Paso 1...</option>`
                    : `
                      <option value="" ${!ingSel ? 'selected' : ''}>— Seleccioná un ingrediente LAMDA (${filtrados.length}) —</option>
                      ${filtrados.map(i => `
                        <option value="${i.id}" ${Number(i.id) === Number(GSTATE.propIngredienteIdSel) ? 'selected' : ''}>
                          ${esc(i.label_oficial || i.nombre_claro)}
                        </option>
                      `).join('')}
                    `}
                </select>
              </div>

              <!-- PASO 3: FRACCIÓN / GRAMAJE Y NOTA OPCIONAL -->
              <div id="prop-step-3" class="prop-step-card ${ev.clasePaso3}">
                <div class="prop-step-head">
                  <div class="prop-step-title-wrap">
                    <span class="prop-step-num">3</span>
                    <span class="prop-step-title">Definir Fracción / Gramaje</span>
                  </div>
                  <div id="prop-step-3-badge">
                    ${renderBadgeEstadoPasoPropuesta(ev.clasePaso3, ev.kilos > 0 ? formatearPesoCortoGestor(ev.kilos) : 'Definida', 'Definí el gramaje')}
                  </div>
                </div>

                <div id="prop-resumen-existentes">
                  ${renderResumenExistentesLamdaHtml(ingSel)}
                </div>

                <div id="prop-gramajes-box" style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;">

    async function enviarNuevaPropuestaGestor(opciones = {}) {
      const solicitarHabilitacionExistente = Boolean(opciones && opciones.solicitarHabilitacionExistente === true);
      const ingSel = obtenerIngredienteSeleccionadoGestor();
      if (!GSTATE.propCategoriaSel || !ingSel) {
        mostrarAvisoPantallaGestor('Completá primero la familia/rubro y el ingrediente oficial LAMDA antes de enviar.', 'error');
        return;
      }
      const inputManualEl = document.getElementById('prop-peso-manual');
      const unidadManual = document.getElementById('prop-peso-unidad')?.value || GSTATE.propUnidadPesoManual || 'g';
      const kilos = inputManualEl && String(inputManualEl.value).trim() !== ''
        ? parsearKilosDesdeTextoManual(inputManualEl.value, unidadManual)
        : Number(GSTATE.propKilosSel || 0);
      if (!kilos || kilos <= 0) {
        mostrarAvisoPantallaGestor('Definí primero una fracción válida mayor a 0.', 'error');
        return;
      }
      GSTATE.propKilosSel = kilos;

      const est = evaluarEstadoGramajeParaGestor(ingSel, kilos);
      if (est.tipo === 'EN_OFERTA_NODO' || est.tipo === 'EN_CATALOGO_NODOS') {
        mostrarAvisoPantallaGestor('Esta presentación ya está cotizada; podés verla o sumarla desde Mi Oferta y Márgenes.', 'error');
        return;
      }
      if (est.tipo === 'YA_EXISTE_LAMDA' && !solicitarHabilitacionExistente) {
        mostrarAvisoPantallaGestor('LAMDA ya produce esta presentación. Elegí otro gramaje nuevo o usá la opción para pedir que la habiliten en tu tienda.', 'error');
        return;
      }
      if (est.tipo === 'YA_SOLICITADA' || (est.tipo === 'YA_EXISTE_LAMDA' && est.propuestaPendiente)) {
        mostrarAvisoPantallaGestor('Esta presentación ya fue solicitada y se encuentra en cotización.', 'error');
        return;
      }

      const nombreConPeso = construirNombreFinalPropuestaGestor(ingSel, kilos);
      const aliasVidrieraInput = String((document.getElementById('prop-alias-vidriera')?.value ?? GSTATE.propAliasVidrieraTexto) || '').trim();

      const btn = document.getElementById('btn-enviar-propuesta-gestor');
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Enviando solicitud...';
      }

      const comentarioInput = (document.getElementById('prop-comentario')?.value || '').trim();
      const comentarioFinal = solicitarHabilitacionExistente && !comentarioInput
        ? 'Solicitud para habilitar presentación estándar de LAMDA en mi tienda.'
        : comentarioInput;

      const payload = {
        nodo_solicitante_id: GSTATE.nodo.id,
        ingrediente_sugerido_id: Number(ingSel.id),
        flujo_sugerido: Number(ingSel.flujo || 2),
        categoria_sugerida: ingSel.categoria_lamda || ingSel.categoria_gestor || document.getElementById('prop-categoria')?.value || 'Frutos Secos',
        nombre_sugerido: nombreConPeso,
        alias_vidriera_sugerido: aliasVidrieraInput || null,
        kilos_sugeridos: kilos,
        precio_objetivo_vecino: Number(document.getElementById('prop-target')?.value || 0),
        comentario_gestor: comentarioFinal,
        solicitar_habilitacion_existente: solicitarHabilitacionExistente
      };

      try {
        const resp = await fetchGestor('/api/produccion/nodos/propuestas', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo enviar la solicitud: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          sincronizarBotonEnvioPropuestaDom();
          return;
        }

        const codProp = data.propuesta?.codigo_propuesta || '';
        GSTATE.propConfirmacionReciente = solicitarHabilitacionExistente
          ? `✅ Solicitud registrada (${codProp}): pediste habilitar ${nombreConPeso} en tu tienda.`
          : `✅ ¡Solicitud enviada con éxito! ${nombreConPeso} (${codProp}) ingresó a cotización y ya figura en Mis Solicitudes.`;
        await cargarPanelGestor({ resetPropuesta: true });
      } catch (err) {
        mostrarAvisoPantallaGestor('Error de comunicación al enviar la solicitud. Verificá tu conexión e intentá de nuevo.', 'error');
        sincronizarBotonEnvioPropuestaDom();
      }
    }

    async function ejecutarAnulacionPropuestaGestor(propuestaId, esLimpiezaDescartada = false) {
      const prop = (GSTATE.propuestas || []).find(x => Number(x.id) === Number(propuestaId));
      const etiquetaNombre = prop ? prop.nombre_sugerido : 'esta presentación';
      const btnConfirm = document.getElementById('btn-confirmar-anular-propuesta');
      const errModalBox = document.getElementById('modal-anular-error-box');

      if (btnConfirm) {
        btnConfirm.disabled = true;
        btnConfirm.textContent = 'Anulando...';
      }
      if (errModalBox) errModalBox.style.display = 'none';

      try {
        const resp = await fetchGestor(`/api/produccion/nodos/propuestas/${Number(propuestaId)}/anular`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nodo_id: GSTATE.nodo?.id || null,
            nodo_slug: GSTATE.slug || ''
          })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          const msgErr = data.error || `Error HTTP ${resp.status}`;
          if (errModalBox) {
            errModalBox.textContent = '⚠️ No se pudo anular: ' + msgErr;
            errModalBox.style.display = 'block';
          }
          mostrarAvisoPantallaGestor('No se pudo anular la solicitud: ' + msgErr, 'error');
          if (btnConfirm) {
            btnConfirm.disabled = false;
            btnConfirm.textContent = 'Confirmar anulación';
          }
          return;
        }

        cerrarModalReciboGestor();
        if (!esLimpiezaDescartada) {
          const codTxt = prop?.codigo_propuesta ? ` (${prop.codigo_propuesta})` : '';
          const msgExito = `✓ Solicitud${codTxt} de ${etiquetaNombre} anulada. Esa medida volvió a quedar libre.`;
          GSTATE.propConfirmacionReciente = msgExito;
          mostrarAvisoPantallaGestor(msgExito, 'ok');
        } else {
          GSTATE.propConfirmacionReciente = '';
        }
        await cargarPanelGestor();
      } catch (err) {
        const msgRed = 'Falla de comunicación con el servidor al intentar anular. Verificá tu conexión e intentá nuevamente.';
        if (errModalBox) {
          errModalBox.textContent = '⚠️ ' + msgRed;
          errModalBox.style.display = 'block';
        }
        mostrarAvisoPantallaGestor(msgRed, 'error');
        if (btnConfirm) {
          btnConfirm.disabled = false;
          btnConfirm.textContent = 'Confirmar anulación';
        }
      }
    }

    function anularPropuestaGestor(propuestaId, esLimpiezaDescartada = false) {
      if (!GSTATE.nodo || !propuestaId) return;
      if (esLimpiezaDescartada) {
        ejecutarAnulacionPropuestaGestor(propuestaId, true);
        return;
      }

      const prop = (GSTATE.propuestas || []).find(x => Number(x.id) === Number(propuestaId));
      const etiquetaNombre = prop ? prop.nombre_sugerido : 'esta presentación';
      const codProp = prop?.codigo_propuesta || '';

      const modal = document.getElementById('modal-recibo-gestor');
      const body = document.getElementById('modal-recibo-gestor-body');
      if (!modal || !body) {
        ejecutarAnulacionPropuestaGestor(propuestaId, false);
        return;
      }

      body.innerHTML = `
        <div style="padding:16px 20px; background:var(--brand-soft); border-bottom:1px solid var(--brand-border); color:var(--text);">
          <div style="font-size:0.72rem; font-weight:800; text-transform:uppercase; color:var(--brand-dark);">Confirmar baja de solicitud</div>
          <div style="font-size:1.02rem; font-weight:900; margin-top:2px;">Anular ${esc(etiquetaNombre)}</div>
          ${codProp ? `<div style="font-size:0.76rem; color:var(--muted); margin-top:2px;">Código ${esc(codProp)}</div>` : ''}
        </div>
        <div style="padding:18px 20px; background:#fff; color:var(--text); font-size:0.86rem; line-height:1.45;">
          <p style="margin:0 0 12px 0;">
            Se dará de baja esta solicitud pendiente de cotización y <strong>ese gramaje volverá a quedar libre</strong> por si querés volver a pedirlo.
          </p>
          <div id="modal-anular-error-box" style="display:none; margin-bottom:12px; padding:10px 12px; border-radius:10px; background:#fef2f2; border:1px solid #ef4444; color:#991b1b; font-size:0.8rem; font-weight:700;"></div>
          <div style="display:flex; gap:8px;">
            <button type="button" id="btn-confirmar-anular-propuesta"
              onclick="ejecutarAnulacionPropuestaGestor(${Number(propuestaId)}, false)"
              class="btn-primary" style="flex:1; background:#b91c1c;">
              Confirmar anulación
            </button>
            <button type="button" onclick="cerrarModalReciboGestor()" class="btn-soft" style="padding:11px 16px;">
              Cancelar
            </button>
          </div>
        </div>
      `;
      modal.style.display = 'flex';
    }

                <span>🥗 Mostrar botón "¿Qué contiene?" (ingredientes) en mi tienda</span>
              </label>
            </div>

            <button type="button" class="btn-primary" style="width:100%; max-width:340px;" onclick="guardarConfigLogisticaGestor()">
              Guardar Preferencias de Envíos
            </button>
          </div>
        `;
      }

      const ventanas = Array.isArray(GSTATE.nodo.config_ventanas_corte) && GSTATE.nodo.config_ventanas_corte.length > 0
        ? GSTATE.nodo.config_ventanas_corte
        : [{ dia_entrega: 'Miércoles', cierre_dia: 'Martes', cierre_hora: '14:00', ventana_retiro: '17:00 a 20:00 hs' }];

      const diasSemana = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];

      return `
        <div class="card">
          <p style="margin:0 0 14px 0; font-size:0.84rem; color:var(--muted);">
            Los pedidos que ingresen después del horario de corte pasan automáticamente a la siguiente fecha de entrega.
          </p>

          <div id="ventanas-editor-list" style="display:flex; flex-direction:column; gap:10px; margin-bottom:12px;">
            ${ventanas.map((v, idx) => `
              <div class="ventana-item-row" style="display:grid; grid-template-columns: 1fr 1fr 0.8fr 1.3fr auto; gap:10px; align-items:end; background:#fffdfb; border:1px solid var(--border); padding:12px; border-radius:12px;">
                <div>
                  <label style="display:block; font-size:0.74rem; font-weight:800; color:var(--muted); margin-bottom:3px;">Día de Entrega</label>
                  <select class="input-sm v-dia-entrega" style="width:100%;">
                    ${diasSemana.map(d => `<option value="${d}" ${v.dia_entrega === d ? 'selected' : ''}>${d}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label style="display:block; font-size:0.74rem; font-weight:800; color:var(--muted); margin-bottom:3px;">Día de Corte</label>
                  <select class="input-sm v-cierre-dia" style="width:100%;">
                    ${diasSemana.map(d => `<option value="${d}" ${v.cierre_dia === d ? 'selected' : ''}>${d}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label style="display:block; font-size:0.74rem; font-weight:800; color:var(--muted); margin-bottom:3px;">Hora Corte</label>
                  <input type="time" class="input-sm v-cierre-hora" style="width:100%;" value="${esc(v.cierre_hora || '14:00')}" />
                </div>
                <div>
                  <label style="display:block; font-size:0.74rem; font-weight:800; color:var(--muted); margin-bottom:3px;">Horario Retiro / Reparto</label>
                  <input type="text" class="input-sm v-ventana-retiro" style="width:100%;" value="${esc(v.ventana_retiro || '17:00 a 20:00 hs')}" />
                </div>
                <button type="button" class="btn-soft" onclick="eliminarVentanaRow(${idx})" title="Quitar día">✕</button>
              </div>
            `).join('')}
          </div>

          <button type="button" class="btn-soft" onclick="agregarVentanaRow()" style="margin-bottom:16px;">
            + Agregar otro día de entrega
          </button>

          <hr style="border:none; border-top:1px solid var(--border); margin:14px 0;" />

          <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap:14px; margin-bottom:18px;">
            <div>
              <label style="display:block; font-size:0.94rem; font-weight:800; margin-bottom:6px; color:var(--text);">Domicilio del punto de retiro</label>
              <input type="text" id="cfg-direccion-retiro" class="input-sm" style="width:100%;" value="${esc(GSTATE.nodo.direccion_retiro || '')}" />
            </div>
            <div id="cfg-cargo-envio-wrap" style="${(GSTATE.nodo.permitir_reparto_propio ?? GSTATE.nodo.permitir_envio_barrial) ? '' : 'opacity:0.48; transition:opacity 0.15s;'}">
              <label style="display:block; font-size:0.94rem; font-weight:800; margin-bottom:6px; color:var(--text);">Costo de reparto propio a domicilio ($)</label>
              <input type="number" step="100" id="cfg-cargo-envio" class="input-sm" style="width:100%;" value="${Number(GSTATE.nodo.cargo_envio_barrial || 0)}" ${(GSTATE.nodo.permitir_reparto_propio ?? GSTATE.nodo.permitir_envio_barrial) ? '' : 'disabled'} />
              <div style="font-size:0.86rem; color:var(--ok); font-weight:700; margin-top:5px;">100% acreditado a tu favor cuando activás reparto propio</div>
            </div>
          </div>

          <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:18px;">
            <div style="font-size:0.94rem; font-weight:900; color:var(--text);">Modalidades de entrega habilitadas en tu tienda</div>
            <div class="cfg-switch-card">
              <label class="switch-label">
                <input type="checkbox" id="cfg-permitir-retiro" ${GSTATE.nodo.permitir_retiro_nodo !== false ? 'checked' : ''} />
                <span>🏠 Habilitar punto de retiro</span>
              </label>
            </div>
            <div class="cfg-switch-card">
              <label class="switch-label">
                <input type="checkbox" id="cfg-permitir-reparto" ${(GSTATE.nodo.permitir_reparto_propio ?? GSTATE.nodo.permitir_envio_barrial) ? 'checked' : ''} onchange="actualizarEstadoCargoEnvioGestor()" />
                <span>🚗 Habilitar reparto propio a domicilio</span>
              </label>
            </div>
            <div class="cfg-switch-card">
              <label class="switch-label">
                <input type="checkbox" id="cfg-permitir-encomienda" ${GSTATE.nodo.permitir_encomienda ? 'checked' : ''} />
                <span>📦 Encomienda nacional / correo <span style="font-weight:700; color:var(--muted);">(previsión futura)</span></span>
              </label>
              <div style="font-size:0.86rem; color:var(--muted); font-weight:600; padding-left:35px; margin-top:2px;">
                Deja previsto el perfil postal de tu tienda para la próxima etapa de envíos.
              </div>
            </div>
            <div class="cfg-switch-card">
              <label class="switch-label">
                <input type="checkbox" id="cfg-mostrar-ingredientes" ${GSTATE.nodo.mostrar_ingredientes_tienda !== false ? 'checked' : ''} />
                <span>🥗 Mostrar botón "¿Qué contiene?" (ingredientes) en mi tienda</span>
              </label>
            </div>
          </div>

          <button type="button" class="btn-primary" style="width:100%; max-width:340px;" onclick="guardarConfigLogisticaGestor()">
            Guardar Configuración
          </button>
        </div>
      `;
    }

    function leerVentanasDesdeDom() {
      const rows = Array.from(document.querySelectorAll('.ventana-item-row'));
      return rows.map(r => ({
        dia_entrega: r.querySelector('.v-dia-entrega').value,
        cierre_dia: r.querySelector('.v-cierre-dia').value,
        cierre_hora: r.querySelector('.v-cierre-hora').value || '14:00',
        ventana_retiro: r.querySelector('.v-ventana-retiro').value || '17:00 a 20:00 hs'
      }));
    }

    function agregarVentanaRow() {
      const actual = leerVentanasDesdeDom();
      actual.push({ dia_entrega: 'Sábado', cierre_dia: 'Viernes', cierre_hora: '14:00', ventana_retiro: '10:00 a 13:30 hs' });
      GSTATE.nodo.config_ventanas_corte = actual;
      renderVistaGestor();
    }

    function eliminarVentanaRow(idx) {
      const actual = leerVentanasDesdeDom();
      if (actual.length <= 1) {
        mostrarAvisoPantallaGestor('Debe quedar al menos un día de entrega configurado.', 'error');
        return;
      }
      actual.splice(idx, 1);
      GSTATE.nodo.config_ventanas_corte = actual;
      renderVistaGestor();
    }

    function actualizarEstadoCargoEnvioGestor() {
      const chkReparto = document.getElementById('cfg-permitir-reparto');
      const inputCargo = document.getElementById('cfg-cargo-envio');
      const wrapCargo = document.getElementById('cfg-cargo-envio-wrap');
      const activo = Boolean(chkReparto?.checked);
      if (inputCargo) inputCargo.disabled = !activo;
      if (wrapCargo) wrapCargo.style.opacity = activo ? '1' : '0.48';
    }

    async function guardarConfigLogisticaGestor() {
      if (esPerfilEcommerceGestor()) {
        const cfgPrev = GSTATE.nodo.config_paqueteria || {};
        const payloadEc = {
          permitir_retiro_nodo: false,
          permitir_reparto_propio: false,
          permitir_envio_barrial: false,
          permitir_encomienda: true,
          mostrar_ingredientes_tienda: Boolean(document.getElementById('cfg-mostrar-ingredientes')?.checked ?? true),
          config_paqueteria: {
            ...cfgPrev,
            sla_despacho_label: document.getElementById('cfg-paq-sla')?.value?.trim() || 'Despacho en 24 a 48 hs hábiles',
            envio_gratis_activo: Boolean(document.getElementById('cfg-paq-gratis-activo')?.checked),
            envio_gratis_desde_monto: Math.max(0, Number(document.getElementById('cfg-paq-gratis-monto')?.value || 0))
          }
        };
        try {
          const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/config-logistica`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payloadEc)
          });
          const data = await leerRespuestaJsonSegura(resp);
          if (!resp.ok || !data.ok) {
            mostrarAvisoPantallaGestor('No se pudo guardar: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
            return;
          }
          mostrarAvisoPantallaGestor('✅ Configuración de envíos nacionales actualizada.', 'ok');
          await cargarPanelGestor();
        } catch (_) {
          mostrarAvisoPantallaGestor('Error de comunicación al guardar las preferencias de envío.', 'error');
        }
        return;
      }

      const permitirRetiro = Boolean(document.getElementById('cfg-permitir-retiro')?.checked);
      const permitirReparto = Boolean(document.getElementById('cfg-permitir-reparto')?.checked);
      const permitirEncomienda = Boolean(document.getElementById('cfg-permitir-encomienda')?.checked);
      if (!permitirRetiro && !permitirReparto) {
        alert('Activá al menos Punto de retiro o Reparto propio a domicilio para que tus vecinos puedan completar pedidos.');
        return;
      }
      const payload = {
        config_ventanas_corte: leerVentanasDesdeDom(),
        direccion_retiro: document.getElementById('cfg-direccion-retiro').value.trim(),
        cargo_envio_barrial: Number(document.getElementById('cfg-cargo-envio').value || 0),
        permitir_retiro_nodo: permitirRetiro,
        permitir_reparto_propio: permitirReparto,
        permitir_encomienda: permitirEncomienda,
        permitir_envio_barrial: permitirReparto,
        mostrar_ingredientes_tienda: Boolean(document.getElementById('cfg-mostrar-ingredientes')?.checked ?? true)
      };

      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/config-logistica`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo guardar la configuración: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          return;
        }
        mostrarAvisoPantallaGestor('✅ Días de entrega, corte y envío barrial actualizados.', 'ok');
        await cargarPanelGestor();
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de comunicación al guardar la configuración logística.', 'error');
      }
    }

    // -------------------------------------------------------------------------
    // 4. PEDIDOS DE VECINOS (SEGUIMIENTO EN VIVO + CONTROLES DE 1 TOQUE)
    // -------------------------------------------------------------------------
    function filtrarEstadoPagoPedidosGestor(filtro) {
      GSTATE.filtroPagoPedidos = filtro;
      renderVistaGestor();
    }

    function filtrarEstadoOperativoPedidosGestor(filtro) {
      GSTATE.filtroOperativoPedidos = filtro;
      renderVistaGestor();
    }

    function _obtenerMetaHitoGestor(p) {
      const esAnulado = String(p.estado_operativo || '').toUpperCase() === 'ANULADO';
      if (esAnulado) {
        return { texto: '🚫 Anulado', bg: '#fee2e2', fg: '#991b1b', bd: '#fecaca', pasoTxt: 'Anulado' };
      }
      const modUpper = String(p.modalidad_entrega || '').toUpperCase();
      const esPostal = esPerfilEcommerceGestor() || ['PAQUETERIA_DOMICILIO', 'PAQUETERIA_SUCURSAL', 'ENCOMIENDA'].includes(modUpper);
      const hito = Number(p.hito_tracking_actual || 1);

      if (esPostal) {
        const opLbl = p.postal_operador === 'ANDREANI' ? 'Andreani' : 'Correo Argentino';
        const guia = String(p.postal_numero_tracking || '').trim();
        if (hito <= 1) {
          return p.pago_confirmado
            ? { texto: '💳 Pago confirmado · Cola de armado', bg: '#ecfdf5', fg: '#047857', bd: '#a7f3d0' }
            : { texto: '⏳ Pendiente de verificación', bg: '#fef3c7', fg: '#92400e', bd: '#fde68a' };
        }
        if (hito === 2) {
          return { texto: '💳 Pago confirmado · En preparación', bg: '#fef3c7', fg: '#92400e', bd: '#fde68a' };
        }
        if (hito === 3) {
          return { texto: '📦 Empaquetado · Listo para correo', bg: '#e0f2fe', fg: '#0369a1', bd: '#bae6fd' };
        }
        if (hito === 4) {
          return { texto: guia ? `🚚 Despachado por ${opLbl} · #${guia}` : `🚚 Despachado por ${opLbl}`, bg: '#ede9fe', fg: '#5b21b6', bd: '#c4b5fd' };
        }
        if (hito === 5) {
          return { texto: `🛣️ En tránsito (${opLbl})`, bg: '#ede9fe', fg: '#5b21b6', bd: '#c4b5fd' };
        }
        return { texto: '✅ Entregado', bg: '#dcfce7', fg: '#14532d', bd: '#86efac' };
      }

      const esEnvio = modUpper === 'ENVIO_BARRIAL';
      const totalPasos = esEnvio ? 6 : 5;
      const marca = GSTATE.nodo?.nombre_marca || 'el punto de retiro';

      if (Boolean(p.ausente_pasa_retirar) && hito < 6) {
        return { texto: `🏡 No estaba · Pasa a retirar por ${marca}`, bg: '#fef3c7', fg: '#92400e', bd: '#fcd34d' };
      }

      if (hito <= 1) {
        return { texto: `📝 Confirmado (1/${totalPasos})`, bg: '#f1f5f9', fg: '#334155', bd: '#cbd5e1' };
      }
      if (hito === 2) {
        return { texto: `🥣 En preparación (2/${totalPasos})`, bg: '#fef3c7', fg: '#92400e', bd: '#fde68a' };
      }
      if (hito === 3) {
        return { texto: `📦 Controlado y embolsado (3/${totalPasos})`, bg: '#e0f2fe', fg: '#0369a1', bd: '#bae6fd' };
      }
      if (hito === 4) {
        return esEnvio
          ? { texto: `🏡 Ya en ${marca} · Listo p/ reparto (4/6)`, bg: 'var(--brand-soft)', fg: 'var(--brand-dark)', bd: 'var(--brand-border)' }
          : { texto: `🎉 Listo p/ retirar en ${marca} (4/5)`, bg: '#dcfce7', fg: '#166534', bd: '#86efac' };
      }
      if (hito === 5) {
        return { texto: `🛵 En camino al vecino (5/6)`, bg: '#ede9fe', fg: '#5b21b6', bd: '#c4b5fd' };
      }
      return { texto: `✅ Entregado (${totalPasos}/${totalPasos})`, bg: '#dcfce7', fg: '#14532d', bd: '#86efac' };
    }

    function renderSeccionPedidos() {
      const esEc = esPerfilEcommerceGestor();
      const mod = obtenerModulosActivosGestor();
      const todos = (GSTATE.pedidos || []).filter(p => String(p.estado_operativo || '').toUpperCase() !== 'ANULADO');
      const anulados = (GSTATE.pedidos || []).filter(p => String(p.estado_operativo || '').toUpperCase() === 'ANULADO');

      // Detectar lotes controlados en Verificación (Hito 3) pendientes de recepción de 1 toque (solo perfil vecinal con canasto)
      const mapaLotes = new Map();
      if (!esEc && mod.canasto_consolidado) {
        for (const p of todos) {
          const cid = Number(p.lote_canasto_id || 0);
          if (!cid) continue;
          if (!mapaLotes.has(cid)) {
            mapaLotes.set(cid, {
              canasto_id: cid,
              codigo_canasto: p.lote_codigo_canasto || `Lote #${cid}`,
              debito_registrado: Boolean(p.lote_debito_registrado),
              estado_canasto: p.lote_estado_canasto || '',
              pedidos: []
            });
          }
          mapaLotes.get(cid).pedidos.push(p);
        }
      }

      const lotesListosParaRecibir = [];
      const lotesEnPreparacion = [];
      for (const lote of mapaLotes.values()) {
        if (lote.debito_registrado || lote.estado_canasto === 'ENTREGADO_AL_GESTOR') continue;
        const todosControlados = lote.pedidos.length > 0 && lote.pedidos.every(x => Number(x.hito_tracking_actual || 1) >= 3);
        const algunoSinRecibir = lote.pedidos.some(x => Number(x.hito_tracking_actual || 1) < 4);
        if (todosControlados && algunoSinRecibir) {
          lotesListosParaRecibir.push(lote);
        } else if (algunoSinRecibir) {
          lotesEnPreparacion.push(lote);
        }
      }

      const cantPrep = todos.filter(p => Number(p.hito_tracking_actual || 1) <= 3).length;
      const cantEnNodo = todos.filter(p => Number(p.hito_tracking_actual || 1) === 4).length;
      const cantReparto = todos.filter(p => Number(p.hito_tracking_actual || 1) === 5).length;
      const cantDespachados = todos.filter(p => [4, 5].includes(Number(p.hito_tracking_actual || 1))).length;
      const cantEntregados = todos.filter(p => Number(p.hito_tracking_actual || 1) >= 6).length;

      const pagados = todos.filter(p => Boolean(p.pago_confirmado));
      const pendientes = todos.filter(p => !p.pago_confirmado);

      const basePorCobro = GSTATE.filtroPagoPedidos === 'PAGADOS'
        ? pagados
        : GSTATE.filtroPagoPedidos === 'PENDIENTES'
          ? pendientes
          : (GSTATE.filtroOperativoPedidos === 'ANULADOS' ? anulados : todos);

      const listaFiltrada = basePorCobro.filter(p => {
        const fOp = GSTATE.filtroOperativoPedidos || 'TODOS';
        if (fOp === 'TODOS' || fOp === 'ANULADOS') return true;
        const h = Number(p.hito_tracking_actual || 1);
        if (fOp === 'PREP') return h <= 3;
        if (fOp === 'DESPACHADOS') return h === 4 || h === 5;
        if (fOp === 'EN_NODO') return h === 4;
        if (fOp === 'REPARTO') return h === 5;
        if (fOp === 'ENTREGADOS') return h >= 6;
        return true;
      });

      const bannersRecepcionHtml = lotesListosParaRecibir.map(l => `
        <div class="card" style="background:linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 100%); border:1.5px solid #4ade80; margin-bottom:14px;">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;">
            <div style="flex:1; min-width:220px;">
              <div style="font-size:0.86rem; font-weight:900; color:#15803d; text-transform:uppercase; letter-spacing:0.03em;">
                📦 Lote controlado · Listo para recibir en ${esc(GSTATE.nodo?.nombre_marca || 'tu punto de retiro')}
              </div>
              <div style="font-size:1.15rem; font-weight:900; color:#14532d; margin-top:4px;">
                ${esc(l.codigo_canasto)} (${l.pedidos.length} ${l.pedidos.length === 1 ? 'bolsa de vecino' : 'bolsas de vecinos'})
              </div>
              <div style="font-size:0.94rem; color:#166534; font-weight:600; margin-top:4px; line-height:1.4;">
                Al confirmar la recepción, los vecinos verán en vivo que su pedido ya llegó al barrio y podrás marcar salidas a reparto o entregas en 1 toque.
              </div>
            </div>
            <button type="button" id="btn-recibir-lote-${l.canasto_id}" onclick="confirmarRecepcionLoteGestor(${l.canasto_id})"
              style="min-height:40px; padding:8px 15px; border-radius:10px; border:none; background:#16a34a; color:#ffffff; font-family:inherit; font-weight:900; font-size:0.9rem; cursor:pointer; box-shadow:0 4px 12px rgba(22,163,74,0.2);">
              📥 Confirmar que recibí el lote (${l.pedidos.length})
            </button>
          </div>
        </div>
      `).join('');

      const bannersPrepHtml = lotesEnPreparacion.map(l => {
        const listos = l.pedidos.filter(x => Number(x.hito_tracking_actual || 1) >= 3).length;
        return `
          <div style="background:#fffbeb; border:1px solid #fcd34d; border-radius:11px; padding:10px 12px; margin-bottom:10px; font-size:0.86rem; color:#92400e; font-weight:700; line-height:1.35;">
            🥣 <strong>${esc(l.codigo_canasto)} en preparación:</strong> ${listos} de ${l.pedidos.length} bolsas controladas y embolsadas. Cuando el lote esté completo vas a poder confirmar su recepción acá.
          </div>
        `;
      }).join('');

      return `
        ${bannersRecepcionHtml}
        ${bannersPrepHtml}

        <div class="card">
          <!-- Filtros por etapa operativa -->
          <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;">
            <button type="button" class="btn-soft" onclick="filtrarEstadoOperativoPedidosGestor('TODOS')"
              style="min-height:36px; font-size:0.82rem; padding:6px 10px; ${GSTATE.filtroOperativoPedidos === 'TODOS' ? 'background:var(--brand); color:#fff; border-color:var(--brand);' : ''}">
              Todos (${todos.length})
            </button>
            <button type="button" class="btn-soft" onclick="filtrarEstadoOperativoPedidosGestor('PREP')"
              style="min-height:36px; font-size:0.82rem; padding:6px 10px; ${GSTATE.filtroOperativoPedidos === 'PREP' ? 'background:var(--brand); color:#fff; border-color:var(--brand);' : ''}">
              ${esEc ? `📦 En preparación (${cantPrep})` : `🥣 Prep./Control (${cantPrep})`}
            </button>
            ${esEc ? `
              <button type="button" class="btn-soft" onclick="filtrarEstadoOperativoPedidosGestor('DESPACHADOS')"
                style="min-height:36px; font-size:0.82rem; padding:6px 10px; ${GSTATE.filtroOperativoPedidos === 'DESPACHADOS' ? 'background:var(--brand); color:#fff; border-color:var(--brand);' : ''}">
                🚚 Despachados (${cantDespachados})
              </button>
            ` : `
              <button type="button" class="btn-soft" onclick="filtrarEstadoOperativoPedidosGestor('EN_NODO')"

        btn.textContent = '⏳ Registrando recepción...';

      try {

          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ actor: GSTATE.nodo.gestor_nombre || 'Referente comercial' })
        });
        const data = await leerRespuestaJsonSegura(resp);

          mostrarAvisoPantallaGestor('No se pudo confirmar la recepción del lote: ' + (data.error || `Error HTTP ${resp.status}`), 'error');

        if (btn) {
          btn.disabled = false;
          btn.textContent = '📥 Confirmar que recibí el lote';
        }
      }
    }

    async function avanzarEstadoEntregaGestor(pedidoId, accion, registrarCobroEfectivo = false, opciones = {}) {
      const p = (GSTATE.pedidos || []).find(x => Number(x.id) === Number(pedidoId));
      if (!p || !GSTATE.nodo?.id) return false;

      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/pedidos/${pedidoId}/estado-entrega`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            accion,
            registrar_cobro_efectivo: Boolean(registrarCobroEfectivo),
            motivo: opciones.motivo || '',
            salir_a_reparto: Boolean(opciones.salirAReparto),
            actor: GSTATE.nodo.gestor_nombre || 'Referente comercial'
          })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo actualizar el estado del pedido: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          return false;
        }

        const msgExito = accion === 'SALIO_REPARTO'
          ? `🛵 Pedido #${p.codigo_pedido} marcado "En camino a domicilio". El vecino ya lo ve en vivo.`
          : accion === 'AUSENTE_PASA_RETIRAR'
            ? `🏡 Pedido #${p.codigo_pedido} pasado a "Ausente — Pasa por punto de retiro" (se conserva envío).`
            : accion === 'REINTEGRAR_REPARTO'
              ? `🔄 Pedido #${p.codigo_pedido} reintegrado a la Hoja de Ruta.`
              : (data.cobro_efectivo_registrado
                  ? `✅ Pedido #${p.codigo_pedido} entregado y cobrado en efectivo (${fmt(p.total_vecino)}).`
                  : `✅ Pedido #${p.codigo_pedido} marcado como entregado a ${p.vecino_nombre}.`);
        mostrarAvisoPantallaGestor(msgExito, 'ok');

        await cargarPanelGestor();

        if (GSTATE.nocturnoAbierto) {
          const restantes = obtenerParadasRepartoActivasGestor();
          if (restantes.length === 0) {
            await apagarRadarVivoGestor(false);
            cerrarModoNocturno(true);
            mostrarAvisoPantallaGestor('🏁 ¡Completaste todas las entregas de tu Hoja de Ruta!', 'ok');
          } else {
            if (GSTATE.repartoIndice >= restantes.length) {
              GSTATE.repartoIndice = 0;
            }
            renderOverlayConduccionNocturna();
            if (GSTATE.radarActivo) {
              enviarPingRadarVivoGestor(restantes[GSTATE.repartoIndice]?.id);
            }
          }
          return true;
        }

        if (data.cobro_efectivo_registrado && !opciones.omitirRecibo) {
          abrirModalReciboVecinoGestor(pedidoId);
        }
        return true;
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de comunicación al actualizar el estado de entrega.', 'error');
        return false;
      }
    }

    async function cobrarEnEfectivoYEmitirReciboGestor(pedidoId) {
      const ped = (GSTATE.pedidos || []).find(p => Number(p.id) === Number(pedidoId));
      if (!ped) return;

      try {
        const resp = await fetchGestor(`/api/produccion/nodos/liquidacion/pedidos/${pedidoId}/conciliar-pago`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            medio_pago: 'EFECTIVO',
            comprobante_referencia: `REC-EFVO-${ped.codigo_pedido}`
          })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo registrar el cobro en efectivo: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          return;
        }
        mostrarAvisoPantallaGestor(`✅ Cobro en efectivo registrado para el pedido #${ped.codigo_pedido}.`, 'ok');
        await cargarPanelGestor();
        abrirModalReciboVecinoGestor(pedidoId);
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de comunicación al registrar el cobro en efectivo.', 'error');
      }
    }

      const linkSeg = obtenerUrlSeguimientoPedidoGestor(p);

      const mensaje = [
        `🧾 *RECIBO DE PAGO — ${GSTATE.nodo.nombre_marca}*`,
        `Comprobante: *${nroRecibo}* · Pedido *#${p.codigo_pedido}*`,
        `Hola *${p.vecino_nombre}*, registramos tu pago:`,
