<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel del Gestor Barrial</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #16a34a;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 50px;
    }
    .top-bar {
      background: #0f172a;
      color: #ffffff;
      padding: 14px 20px;
      border-bottom: 1px solid #1e293b;
    }
    .top-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .nodo-selector {
      background: #1e293b;
      color: #ffffff;
      border: 1px solid #334155;
      padding: 7px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
    }
    .btn-top {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-top.green {
      background: #16a34a;
      border-color: #16a34a;
      color: #ffffff;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 18px 16px;
    }

    /* Resumen de Métricas del Gestor */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .kpi-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .kpi-label {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
    }
    .kpi-value {
      font-size: 1.45rem;
      font-weight: 900;
      color: #0f172a;
      margin-top: 4px;
    }
    .kpi-sub {
      font-size: 0.75rem;
      color: #059669;
      font-weight: 600;
      margin-top: 2px;
    }

    /* Pestañas del Panel del Gestor */
    .tabs-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 16px;
      padding-bottom: 4px;
    }
    .tab-btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      font-weight: 800;
      font-size: 0.86rem;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .tab-btn.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    .card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.86rem;
    }
    th {
      text-align: left;
      padding: 10px;
      background: #f8fafc;
      color: #475569;
      border-bottom: 1px solid #e2e8f0;
      font-size: 0.76rem;
      text-transform: uppercase;
    }
    td {
      padding: 11px 10px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
    }

    .input-sm {
      padding: 6px 9px;
      border-radius: 7px;
      border: 1px solid #cbd5e1;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .btn-primary {
      background: #16a34a;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 9px;
      font-weight: 800;
      font-size: 0.86rem;
      cursor: pointer;
    }
    .switch-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.8rem;
    }
    @media (max-width: 720px) {
      .ventana-item-row {
        grid-template-columns: 1fr 1fr !important;
      }
      .propuestas-grid {
        grid-template-columns: 1fr !important;
      }
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="top-inner">
      <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
        <span style="font-size:1.35rem;">🎛️</span>
        <div>
          <div style="font-size:0.74rem; color:#94a3b8; font-weight:700; text-transform:uppercase;">Panel de Autogestión del Nodo</div>
          <select id="gestor-nodo-select" class="nodo-selector" onchange="cambiarNodoGestor(this.value)"></select>
        </div>
      </div>

      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button type="button" class="btn-top green" onclick="enviarLinkTiendaWhatsAppPrueba()" style="background:#15803d; border-color:#16a34a;">
          📲 Enviar Link por WhatsApp (Prueba: 221 661 5746)
        </button>
        <button type="button" class="btn-top" onclick="copiarLinkTiendaVecinos()">
          🔗 Copiar Link Tienda
        </button>
        <a id="btn-abrir-tienda" href="#" target="_blank" class="btn-top green">
          🏪 Ver mi Tienda Vecinal ↗
        </a>
        <a href="/deposito-nodos" target="_blank" class="btn-top">
          📦 Mesa de Armado (Depósito) ↗
        </a>
        <a id="btn-abrir-liquidacion" href="/liquidacion-nodos" target="_blank" class="btn-top" style="background:#0284c7; border-color:#0284c7;">
          💳 Cobros y Liquidación ↗
        </a>
        <a href="/pages/pizarra-simulacion.html?tab=nodos" class="btn-top">
          📊 Pizarra LAMDA
        </a>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Tarjetas de Resumen del Gestor -->
    <div class="kpi-grid" id="gestor-kpis"></div>

    <!-- Navegación del Panel del Gestor -->
    <div class="tabs-bar">
      <button type="button" class="tab-btn active" id="gtab-ofertas" onclick="cambiarTabGestor('ofertas')">
        🛍️ Mi Oferta y Márgenes
      </button>
      <button type="button" class="tab-btn" id="gtab-logistica" onclick="cambiarTabGestor('logistica')">
        ⏰ Días de Entrega, Corte y Envío Barrial
      </button>
      <button type="button" class="tab-btn" id="gtab-propuestas" onclick="cambiarTabGestor('propuestas')">
        ✨ Pedir Nueva Fracción
      </button>
      <button type="button" class="tab-btn" id="gtab-pedidos" onclick="cambiarTabGestor('pedidos')">
        📋 Pedidos de Vecinos
      </button>
      <button type="button" class="tab-btn" id="gtab-liquidacion" onclick="cambiarTabGestor('liquidacion')">
        💰 Cuenta Corriente y Liquidación
      </button>
    </div>

    <div id="gestor-tab-content"></div>
  </main>

  <!-- MODAL DE RECIBO DIGITAL MARCA BLANCA PARA EL VECINO (EMITIDO DESDE EL CELULAR DEL GESTOR) -->
  <div id="modal-recibo-gestor" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.72); z-index:2000; align-items:center; justify-content:center; padding:16px;">
    <div style="background:#ffffff; border-radius:16px; max-width:460px; width:100%; overflow:hidden; box-shadow:0 20px 45px rgba(0,0,0,0.35); border:1px solid #cbd5e1;">
      <div id="modal-recibo-gestor-body"></div>
    </div>
  </div>

  <script>
    const GSTATE = {
      slug: '',
      tab: 'ofertas',
      filtroPagoPedidos: 'TODOS',
      nodo: null,
      nodosDisponibles: [],
      proximaEntrega: null,
      ofertas: [],
      propuestas: [],
      pedidos: [],
      movimientosCtaCte: [],
      ingredientesSugeribles: [],
      liquidacionTablero: null
    };

    function fmt(n) {
      return '$' + Math.round(Number(n) || 0).toLocaleString('es-AR');
    }

    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function detectarSlugInicial() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('nodo')) return params.get('nodo');
      const parts = window.location.pathname.split('/').filter(Boolean);
      const idx = parts.indexOf('gestor');
      if (idx !== -1 && parts[idx + 1]) return parts[idx + 1];
      return 'almacen-verde-city-bell';
    }

    async function cargarPanelGestor() {
      const [resp, respLiq] = await Promise.all([
        fetch(`/api/produccion/nodos/portal/${encodeURIComponent(GSTATE.slug)}`),
        fetch(`/api/produccion/nodos/liquidacion/tablero?nodo_slug=${encodeURIComponent(GSTATE.slug)}`)
      ]);
      const data = await resp.json();
      if (!data.ok) {
        const box = document.getElementById('gestor-tab-content');
        if (box) {
          box.innerHTML = `
            <div class="card" style="text-align:center; padding:32px;">
              <div style="font-size:2.4rem; margin-bottom:10px;">🌱</div>
              <h3 style="margin:0 0 8px 0;">Entorno de Pruebas Puesto a Cero (0 Nodos Creados)</h3>
              <p style="color:#64748b; font-size:0.9rem; max-width:520px; margin:0 auto 16px auto;">
                Todavía no hay ningún Nodo Barrial configurado en la base de pruebas. Creá el primer Nodo desde la Pizarra de LAMDA (Paso 1) para habilitar el Panel del Gestor y la Tienda Vecinal.
              </p>
              <a href="/pages/pizarra-simulacion.html?tab=nodos" class="btn-primary" style="display:inline-block; text-decoration:none;">
                📊 Ir a Pizarra LAMDA para Crear el Primer Nodo
              </a>
            </div>
          `;
        }
        return;
      }
      try {
        const dataLiq = await respLiq.json();
        if (dataLiq && dataLiq.ok) GSTATE.liquidacionTablero = dataLiq;
      } catch (_) {}

      GSTATE.nodo = data.nodo;
      GSTATE.slug = data.nodo.slug;
      GSTATE.nodosDisponibles = data.nodos_disponibles || [];
      GSTATE.proximaEntrega = data.proxima_entrega;
      GSTATE.ofertas = data.todas_ofertas_gestor || [];
      GSTATE.propuestas = data.propuestas_nodo || [];
      GSTATE.pedidos = data.pedidos_nodo || [];
      GSTATE.movimientosCtaCte = data.movimientos_cta_cte || [];
      GSTATE.ingredientesSugeribles = data.ingredientes_sugeribles || [];

      const sel = document.getElementById('gestor-nodo-select');
      if (sel) {
        sel.innerHTML = GSTATE.nodosDisponibles.map(n =>
          `<option value="${esc(n.slug)}" ${n.slug === GSTATE.slug ? 'selected' : ''}>${esc(n.nombre_marca)} (${esc(n.gestor_nombre)})</option>`
        ).join('');
      }

      const btnTienda = document.getElementById('btn-abrir-tienda');
      if (btnTienda) btnTienda.href = `/tienda/${encodeURIComponent(GSTATE.slug)}`;
      const btnLiq = document.getElementById('btn-abrir-liquidacion');
      if (btnLiq) btnLiq.href = `/liquidacion-nodos/${encodeURIComponent(GSTATE.slug)}`;

      renderKpis();
      renderTabActiva();
    }

    function cambiarNodoGestor(nuevoSlug) {
      GSTATE.slug = nuevoSlug;
      window.history.replaceState({}, '', `/gestor/${encodeURIComponent(nuevoSlug)}`);
      cargarPanelGestor();
    }

    function copiarLinkTiendaVecinos() {
      const url = `${window.location.origin}/tienda/${GSTATE.slug}`;
      navigator.clipboard.writeText(url);
      alert(`✅ Link de tu tienda copiado para compartir en WhatsApp:\n${url}`);
    }

    function mostrarConfirmacionWhatsAppGestor(data, titulo, subtitulo) {
      const modal = document.getElementById('modal-recibo-gestor');
      const body = document.getElementById('modal-recibo-gestor-body');
      if (!modal || !body) {
        alert(`✅ ${titulo}\nDespachado por el servicio interno de WhatsApp de LAMDA (redirigido en Laboratorio a ${data?.telefono_destino_display || '221 661 5746'}).`);
        return;
      }
      const links = Array.isArray(data?.links_detectados) ? data.links_detectados : [];
      body.innerHTML = `
        <div style="background:linear-gradient(135deg, #16a34a 0%, #15803d 100%); color:#fff; padding:16px 20px;">
          <div style="font-size:0.72rem; font-weight:800; text-transform:uppercase; opacity:0.9;">Conexión Interna de WhatsApp LAMDA</div>
          <div style="font-size:1.1rem; font-weight:900; margin-top:2px;">✅ ${esc(titulo)}</div>
          <div style="font-size:0.78rem; margin-top:2px; opacity:0.92;">${esc(subtitulo || '')}</div>
        </div>
        <div style="padding:18px 20px; background:#fff; color:#0f172a; font-size:0.84rem;">
          <div style="padding:10px 12px; border-radius:8px; background:#f0fdf4; border:1px solid #86efac; color:#166534; margin-bottom:10px;">
            📲 <strong>Mensaje despachado directamente desde el sistema</strong> (sin abrir pestañas externas).<br>
            🛡️ Destino de prueba en Laboratorio: <strong>${esc(data?.telefono_destino_display || '221 661 5746')}</strong>
          </div>
          <div style="font-size:0.75rem; color:#64748b; margin-bottom:4px; font-weight:700;">Contenido despachado:</div>
          <pre style="white-space:pre-wrap; word-break:break-word; padding:10px; border-radius:8px; background:#f8fafc; border:1px solid #cbd5e1; color:#0f172a; font-size:0.76rem; font-family:inherit; margin:0 0 12px 0; max-height:180px; overflow-y:auto;">${esc(data?.mensaje_enviado || '')}</pre>
          ${links.length > 0 ? `
            <div style="text-align:center; padding:10px; border-radius:10px; background:#f8fafc; border:1px solid #e2e8f0; margin-bottom:12px;">
              <div style="font-size:0.75rem; font-weight:800; color:#0f172a; margin-bottom:6px;">📱 Link listo para abrir desde el celular (${esc(links[0].url)})</div>
              ${links[0].qr_data_url ? `<img src="${links[0].qr_data_url}" alt="QR Tienda" style="width:130px; height:130px; border-radius:8px;">` : ''}
            </div>
          ` : ''}
          <button type="button" onclick="cerrarModalReciboGestor()"
            style="width:100%; padding:10px; border-radius:9px; border:none; background:#16a34a; color:#ffffff; font-weight:800; font-size:0.86rem; cursor:pointer;">
            Listo
          </button>
        </div>
      `;
      modal.style.display = 'flex';
    }

    async function enviarLinkTiendaWhatsAppPrueba() {
      if (!GSTATE.nodo) {
        alert('Primero debe existir un Nodo activo.');
        return;
      }
      const url = `${window.location.origin}/tienda/${GSTATE.slug}`;
      const prox = GSTATE.proximaEntrega?.asignada?.label_completo || 'próxima ventana semanal';
      const corte = GSTATE.proximaEntrega?.asignada?.label_corte || '';
      const mensaje = [
        `🌿 *${GSTATE.nodo.nombre_marca}* (${GSTATE.nodo.subtitulo_marca || 'Comunidad Barrial'})`,
        `¡Hola! Te comparto el link de nuestra tienda barrial para encargar productos frescos:`,
        url,
        `📅 *Próxima entrega:* ${prox}`,
        corte ? `⏰ *Cierre de pedidos:* ${corte}` : '',
        `Podés elegir retirar por el Nodo (${GSTATE.nodo.direccion_retiro || ''}) o pedir envío a domicilio en el barrio.`
      ].filter(Boolean).join('\n');

      const resp = await fetch('/api/produccion/nodos/whatsapp-prueba', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          destinatario_nombre: `Vecinos de ${GSTATE.nodo.nombre_marca}`,
          telefono_original: '5492216615746',
          mensaje
        })
      });
      const data = await resp.json();
      if (!resp.ok || !data.ok) {
        alert('Error al despachar WhatsApp: ' + (data.error || 'Error interno'));
        return;
      }
      mostrarConfirmacionWhatsAppGestor(data, 'Link de Tienda Despachado por WhatsApp', `Tienda de ${GSTATE.nodo.nombre_marca}`);
    }

    async function enviarWhatsAppVecinoPedidoPrueba(pedidoId) {
      const p = (GSTATE.pedidos || []).find(x => Number(x.id) === Number(pedidoId));
      if (!p || !GSTATE.nodo) return;
      const itemsTxt = (p.items || []).map(it => `• ${it.cantidad}x ${it.nombre_publico} (${fmt(it.subtotal_vecino)})`).join('\n');
      const mensaje = [
        `🌿 *${GSTATE.nodo.nombre_marca}* — Pedido #${p.codigo_pedido}`,
        `¡Hola ${p.vecino_nombre}! Te confirmamos el detalle de tu pedido:`,
        itemsTxt,
        Number(p.cargo_envio_barrial) > 0 ? `🛵 Envío barrial: ${fmt(p.cargo_envio_barrial)}` : `🏠 Retiro por el Nodo: ${GSTATE.nodo.direccion_retiro || ''}`,
        `💰 *Total:* ${fmt(p.total_vecino)} (${p.medio_pago === 'EFECTIVO' ? 'Efectivo en entrega' : `Transferencia al alias ${GSTATE.nodo.alias_bancario_display || ''}`})`,
        `📅 *Entrega:* ${p.fecha_entrega_label}`
      ].filter(Boolean).join('\n');

      const resp = await fetch('/api/produccion/nodos/whatsapp-prueba', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          destinatario_nombre: p.vecino_nombre,
          telefono_original: p.vecino_telefono,
          mensaje
        })
      });
      const data = await resp.json();
      if (!resp.ok || !data.ok) {
        alert('Error al despachar WhatsApp: ' + (data.error || 'Error interno'));
        return;
      }
      mostrarConfirmacionWhatsAppGestor(data, `Detalle de Pedido #${p.codigo_pedido} Enviado`, `Vecino/a: ${p.vecino_nombre} (${p.vecino_telefono || 'S/T'})`);
    }

    function cambiarTabGestor(tab) {
      GSTATE.tab = tab;
      ['ofertas', 'logistica', 'propuestas', 'pedidos', 'liquidacion'].forEach(t => {
        const el = document.getElementById(`gtab-${t}`);
        if (el) el.classList.toggle('active', t === tab);
      });
      renderTabActiva();
    }

    function renderKpis() {
      const publicadas = GSTATE.ofertas.filter(o => o.publicado_tienda).length;
      let totalVentasVecinos = 0;
      let gananciaTotalGestor = 0;
      let gananciaPorEnvios = 0;

      GSTATE.pedidos.forEach(p => {
        totalVentasVecinos += Number(p.total_vecino || 0);
        gananciaTotalGestor += Number(p.ganancia_total_gestor || 0);
        gananciaPorEnvios += Number(p.cargo_envio_barrial || 0);
      });

      const proxTxt = GSTATE.proximaEntrega?.asignada?.label_completo || 'Sin configurar';

      document.getElementById('gestor-kpis').innerHTML = `
        <div class="kpi-card">
          <div class="kpi-label">Productos Publicados</div>
          <div class="kpi-value">${publicadas} <span style="font-size:0.85rem; font-weight:600; color:#64748b;">/ ${GSTATE.ofertas.length}</span></div>
          <div class="kpi-sub">En tu tienda marca blanca</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Pedidos de Vecinos</div>
          <div class="kpi-value">${GSTATE.pedidos.length}</div>
          <div class="kpi-sub">Facturación vecinal: ${fmt(totalVentasVecinos)}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Tu Ganancia Acumulada</div>
          <div class="kpi-value" style="color:#16a34a;">${fmt(gananciaTotalGestor)}</div>
          <div class="kpi-sub">Incluye ${fmt(gananciaPorEnvios)} (100% envíos barriales)</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Próxima Entrega Activa</div>
          <div class="kpi-value" style="font-size:1rem; margin-top:8px;">${esc(proxTxt)}</div>
          <div class="kpi-sub">Alias cobros: ${esc(GSTATE.nodo.alias_bancario_display || 'S/A')}</div>
        </div>
      `;
    }

    function renderTabActiva() {
      const box = document.getElementById('gestor-tab-content');
      if (GSTATE.tab === 'ofertas') box.innerHTML = renderTabOfertas();
      else if (GSTATE.tab === 'logistica') box.innerHTML = renderTabLogistica();
      else if (GSTATE.tab === 'propuestas') box.innerHTML = renderTabPropuestas();
      else if (GSTATE.tab === 'liquidacion') box.innerHTML = renderTabLiquidacionGestor();
      else box.innerHTML = renderTabPedidos();
    }

    // -------------------------------------------------------------------------
    // TAB 1: MI OFERTA Y MÁRGENES
    // -------------------------------------------------------------------------
    function renderTabOfertas() {
      return `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px;">
            <div>
              <h3 style="margin:0; font-size:1.05rem;">🛍️ Configurá tus Márgenes y Productos Publicados</h3>
              <p style="margin:4px 0 0 0; font-size:0.82rem; color:#64748b;">
                Ajustá el porcentaje de margen o el precio final al vecino; el sistema calcula tu ganancia neta por unidad al instante.
              </p>
            </div>
          </div>

          <div style="overflow-x:auto;">
            <table>
              <thead>
                <tr>
                  <th>Producto Familiar</th>
                  <th>Presentación</th>
                  <th>Costo Base Nodo</th>
                  <th>Mi Margen (%)</th>
                  <th>Precio al Vecino</th>
                  <th>Mi Ganancia / u.</th>
                  <th>Visible en Tienda</th>
                </tr>
              </thead>
              <tbody>
                ${GSTATE.ofertas.map(of => `
                  <tr>
                    <td>
                      <div style="font-weight:800; color:#0f172a;">${esc(of.nombre_publico)}</div>
                      <div style="font-size:0.75rem; color:#64748b;">${esc(of.categoria_familiar)}</div>
                    </td>
                    <td>
                      <span style="background:#f1f5f9; padding:3px 8px; border-radius:6px; font-weight:700; font-size:0.78rem;">
                        ${esc(of.presentacion_etiqueta || `${Math.round(Number(of.kilos_unidad) * 1000)}g`)}
                      </span>
                    </td>
                    <td style="font-weight:700; color:#475569;">
                      ${fmt(of.precio_base_nodo_final)}
                    </td>
                    <td>
                      <input type="number" step="0.5" class="input-sm" style="width:78px; border-color:#0284c7; color:#0284c7;"
                        value="${Number(of.margen_gestor_pct)}"
                        onchange="guardarCambioOferta(${of.id}, { margen_gestor_pct: Number(this.value) })" /> %
                    </td>
                    <td>
                      <input type="number" step="50" class="input-sm" style="width:105px; border-color:#16a34a; color:#15803d;"
                        value="${Math.round(Number(of.precio_venta_vecino))}"
                        onchange="guardarPrecioDirectoOferta(${of.id}, ${Number(of.precio_base_nodo_final)}, Number(this.value))" />
                    </td>
                    <td>
                      <span style="font-weight:900; color:#16a34a; font-size:0.95rem;">
                        +${fmt(of.ganancia_unitaria_gestor)}
                      </span>
                    </td>
                    <td>
                      <label class="switch-label">
                        <input type="checkbox" ${of.publicado_tienda ? 'checked' : ''}
                          onchange="guardarCambioOferta(${of.id}, { publicado_tienda: this.checked })" />
                        <span style="color:${of.publicado_tienda ? '#16a34a' : '#94a3b8'};">
                          ${of.publicado_tienda ? 'Publicado' : 'Oculto'}
                        </span>
                      </label>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    async function guardarCambioOferta(ofertaId, body) {
      await fetch(`/api/produccion/nodos/ofertas-gestor/${ofertaId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      await cargarPanelGestor();
    }

    async function guardarPrecioDirectoOferta(ofertaId, base, nuevoPrecio) {
      const margen = base > 0 ? Number((((nuevoPrecio - base) / base) * 100).toFixed(2)) : 0;
      await guardarCambioOferta(ofertaId, {
        margen_gestor_pct: Math.max(0, margen),
        precio_venta_vecino: nuevoPrecio
      });
    }

    // -------------------------------------------------------------------------
    // TAB 2: DÍAS DE ENTREGA, HORARIOS DE CORTE Y ENVÍO BARRIAL
    // -------------------------------------------------------------------------
    function renderTabLogistica() {
      const ventanas = Array.isArray(GSTATE.nodo.config_ventanas_corte) && GSTATE.nodo.config_ventanas_corte.length > 0
        ? GSTATE.nodo.config_ventanas_corte
        : [{ dia_entrega: 'Miércoles', cierre_dia: 'Martes', cierre_hora: '14:00', ventana_retiro: '17:00 a 20:00 hs' }];

      const diasSemana = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];

      return `
        <div class="card">
          <h3 style="margin:0 0 6px 0; font-size:1.05rem;">⏰ Días de Entrega, Horarios de Corte y Logística Barrial</h3>

            Si un vecino realiza su pedido después del horario de corte configurado, la tienda le asignará automáticamente la próxima fecha de entrega disponible.
          </p>

                <div>
                  <label style="display:block; font-size:0.75rem; font-weight:700; color:#334155; margin-bottom:4px;">Día de Entrega al Vecino</label>
                  <select class="input-sm v-dia-entrega" style="width:100%;">
                    ${diasSemana.map(d => `<option value="${d}" ${v.dia_entrega === d ? 'selected' : ''}>${d}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label style="display:block; font-size:0.75rem; font-weight:700; color:#334155; margin-bottom:4px;">Día de Cierre (Corte)</label>
                  <select class="input-sm v-cierre-dia" style="width:100%;">
                    ${diasSemana.map(d => `<option value="${d}" ${v.cierre_dia === d ? 'selected' : ''}>${d}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label style="display:block; font-size:0.75rem; font-weight:700; color:#334155; margin-bottom:4px;">Hora de Corte</label>
                  <input type="time" class="input-sm v-cierre-hora" style="width:100%;" value="${esc(v.cierre_hora || '14:00')}" />
                </div>
                <div>
                  <label style="display:block; font-size:0.75rem; font-weight:700; color:#334155; margin-bottom:4px;">Ventana Horaria de Retiro / Reparto</label>
                  <input type="text" class="input-sm v-ventana-retiro" style="width:100%;" value="${esc(v.ventana_retiro || '17:00 a 20:00 hs')}" placeholder="Ej: 17:00 a 20:00 hs" />
                </div>
                <button type="button" onclick="eliminarVentanaRow(${idx})" style="padding:7px 10px; border-radius:7px; border:1px solid #fca5a5; background:#fef2f2; color:#dc2626; cursor:pointer; font-weight:700;">
                  🗑️
                </button>
              </div>
            `).join('')}
          </div>

          <button type="button" onclick="agregarVentanaRow()"
            style="padding:7px 14px; border-radius:8px; border:1px solid #cbd5e1; background:#f8fafc; color:#0f172a; font-weight:700; font-size:0.8rem; cursor:pointer; margin-bottom:18px;">
            ➕ Agregar otro día de entrega semanal
          </button>

          <hr style="border:none; border-top:1px solid #e2e8f0; margin:16px 0;" />

          <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:14px; margin-bottom:18px;">
            <div>
              <label style="display:block; font-size:0.78rem; font-weight:700; color:#334155; margin-bottom:4px;">Domicilio del Nodo (Para retiro de vecinos)</label>
              <input type="text" id="cfg-direccion-retiro" class="input-sm" style="width:100%;" value="${esc(GSTATE.nodo.direccion_retiro || '')}" />
            </div>
            <div>
              <label style="display:block; font-size:0.78rem; font-weight:700; color:#334155; margin-bottom:4px;">Costo de Envío a Domicilio Barrial ($)</label>
              <input type="number" step="100" id="cfg-cargo-envio" class="input-sm" style="width:100%; border-color:#16a34a; color:#15803d;" value="${Number(GSTATE.nodo.cargo_envio_barrial || 0)}" />
              <div style="font-size:0.72rem; color:#059669; font-weight:700; margin-top:3px;">
                ✅ El 100% del envío barrial se acredita a tu favor en la liquidación.
              </div>
            </div>
            <div style="display:flex; align-items:center; padding-top:16px;">
              <label class="switch-label" style="font-size:0.86rem;">
                <input type="checkbox" id="cfg-permitir-envio" ${GSTATE.nodo.permitir_envio_barrial ? 'checked' : ''} />
                Habilitar opción de reparto a domicilio en mi barrio
              </label>
            </div>
          </div>

          <button type="button" class="btn-primary" onclick="guardarConfigLogisticaGestor()">
            💾 Guardar Configuración de Entregas y Envío
          </button>
        </div>
      `;
    }

    function leerVentanasDesdeDom() {
      const rows = Array.from(document.querySelectorAll('.ventana-item-row'));
      return rows.map(r => ({
        dia_entrega: r.querySelector('.v-dia-entrega').value,
        cierre_dia: r.querySelector('.v-cierre-dia').value,
        cierre_hora: r.querySelector('.v-cierre-hora').value || '14:00',
        ventana_retiro: r.querySelector('.v-ventana-retiro').value || '17:00 a 20:00 hs'
      }));
    }

    function agregarVentanaRow() {
      const actual = leerVentanasDesdeDom();
      actual.push({ dia_entrega: 'Sábado', cierre_dia: 'Viernes', cierre_hora: '14:00', ventana_retiro: '10:00 a 13:30 hs' });
      GSTATE.nodo.config_ventanas_corte = actual;
      renderTabActiva();
    }

    function eliminarVentanaRow(idx) {
      const actual = leerVentanasDesdeDom();
      if (actual.length <= 1) {
        alert('Tu Nodo debe tener al menos un día de entrega configurado.');
        return;
      }
      actual.splice(idx, 1);
      GSTATE.nodo.config_ventanas_corte = actual;
      renderTabActiva();
    }

    async function guardarConfigLogisticaGestor() {
      const payload = {
        config_ventanas_corte: leerVentanasDesdeDom(),
        direccion_retiro: document.getElementById('cfg-direccion-retiro').value.trim(),
        cargo_envio_barrial: Number(document.getElementById('cfg-cargo-envio').value || 0),
        permitir_envio_barrial: Boolean(document.getElementById('cfg-permitir-envio').checked)
      };

      const resp = await fetch(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/config-logistica`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await resp.json();
      if (data.ok) {
        alert('✅ Días de entrega, horarios de corte y envío barrial actualizados.');
        await cargarPanelGestor();
      }
    }

    // -------------------------------------------------------------------------
    // TAB 3: SOLICITAR NUEVA FRACCIÓN FAMILIAR
    // -------------------------------------------------------------------------
    function renderTabPropuestas() {
      return `
        <div class="propuestas-grid" style="display:grid; grid-template-columns: 1fr 1.2fr; gap:16px; align-items:start;">
          <div class="card">
            <h3 style="margin:0 0 6px 0; font-size:1.02rem;">✨ Proponer Nueva Fracción o Presentación</h3>
            <p style="margin:0 0 14px 0; font-size:0.8rem; color:#64748b;">
              Solicitá un nuevo producto o gramaje pensado para las familias de tu barrio. Una vez cotizado y aprobado su Precio Base, aparecerá en tu pestaña de Ofertas para que le fijes tu margen.
            </p>

            <div style="display:flex; flex-direction:column; gap:10px;">
              <div>
                <label style="display:block; font-size:0.78rem; font-weight:700; margin-bottom:4px;">Producto o ingrediente de interés</label>
                <select id="prop-ing-id" class="input-sm" style="width:100%;">
                  ${GSTATE.ingredientesSugeribles.map(i => `<option value="${i.id}">${esc(i.nombre)}</option>`).join('')}
                </select>
              </div>
              <div>
                <label style="display:block; font-size:0.78rem; font-weight:700; margin-bottom:4px;">Nombre sugerido de la presentación familiar</label>
                <input type="text" id="prop-nombre" class="input-sm" style="width:100%;" placeholder="Ej: Castaña de Pará Pelada Familiar x 200g" />
              </div>
              <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <div>
                  <label style="display:block; font-size:0.78rem; font-weight:700; margin-bottom:4px;">Peso por unidad (Kg, ej 0.25 = 250g)</label>
                  <input type="number" step="0.05" id="prop-kilos" class="input-sm" style="width:100%;" value="0.25" />
                </div>
                <div>
                  <label style="display:block; font-size:0.78rem; font-weight:700; margin-bottom:4px;">Precio estimado al vecino ($)</label>

                </div>

              <div>
                <label style="display:block; font-size:0.78rem; font-weight:700; margin-bottom:4px;">Comentario o motivo del pedido</label>
                <input type="text" id="prop-comentario" class="input-sm" style="width:100%;" placeholder="Ej: Muy pedido por las familias del barrio para viandas" />
              </div>
              <button type="button" class="btn-primary" onclick="enviarNuevaPropuestaGestor()">
                🚀 Enviar Solicitud de Cotización
              </button>
            </div>
          </div>

          <div class="card">
            <h3 style="margin:0 0 12px 0; font-size:1.02rem;">📋 Estado de mis Solicitudes</h3>
            <div style="display:flex; flex-direction:column; gap:10px;">
              ${GSTATE.propuestas.map(p => `
                <div style="padding:12px; border-radius:10px; border:1px solid #e2e8f0; background:#f8fafc;">
                  <div style="display:flex; justify-content:space-between; align-items:center;">
                    <strong style="font-size:0.9rem;">${esc(p.nombre_sugerido)}</strong>
                    <span style="font-size:0.72rem; font-weight:800; padding:3px 8px; border-radius:999px; background:${p.estado === 'APROBADA' ? '#dcfce7' : '#fef3c7'}; color:${p.estado === 'APROBADA' ? '#15803d' : '#b45309'};">
                      ${p.estado === 'APROBADA' ? '✅ APROBADA' : '⏳ EN COTIZACIÓN'}
                    </span>
                  </div>
                  <div style="font-size:0.78rem; color:#475569; margin-top:4px;">
                    Presentación: <strong>${Math.round(Number(p.kilos_sugeridos || 0.25) * 1000)}g</strong>

                  </div>
                  ${p.respuesta_lamda ? `<div style="margin-top:6px; font-size:0.76rem; color:#15803d; font-weight:700;">💬 ${esc(p.respuesta_lamda)}</div>` : ''}
                </div>
              `).join('')}
            </div>
          </div>
        </div>

    async function enviarNuevaPropuestaGestor() {
      const nombre = document.getElementById('prop-nombre').value.trim();
      if (!nombre) {
        alert('Por favor ingresá el nombre de la presentación sugerida.');
        return;
      }
      const payload = {
        nodo_solicitante_id: GSTATE.nodo.id,
        ingrediente_sugerido_id: Number(document.getElementById('prop-ing-id').value),
        nombre_sugerido: nombre,
        kilos_sugeridos: Number(document.getElementById('prop-kilos').value || 0.25),
        precio_objetivo_vecino: Number(document.getElementById('prop-target').value || 0),
        comentario_gestor: document.getElementById('prop-comentario').value.trim()
      };
      const resp = await fetch('/api/produccion/nodos/propuestas', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await resp.json();
      if (data.ok) {
        alert('✅ Solicitud enviada a la bandeja de cotización.');
        await cargarPanelGestor();
      }
    }

    // -------------------------------------------------------------------------
    // TAB 4: PEDIDOS DE MIS VECINOS, ESTADO DE PAGO Y EMISIÓN DE RECIBO EN EFECTIVO
    // -------------------------------------------------------------------------
    function filtrarEstadoPagoPedidosGestor(filtro) {
      GSTATE.filtroPagoPedidos = filtro;
      renderTabActiva();
    }

    function renderTabPedidos() {
      const todos = GSTATE.pedidos || [];
      const pagados = todos.filter(p => Boolean(p.pago_confirmado));
      const pendientes = todos.filter(p => !p.pago_confirmado);

      const montoPagado = pagados.reduce((acc, p) => acc + Number(p.total_vecino || 0), 0);
      const montoPendiente = pendientes.reduce((acc, p) => acc + Number(p.total_vecino || 0), 0);

      const listaFiltrada = GSTATE.filtroPagoPedidos === 'PAGADOS'
        ? pagados
        : GSTATE.filtroPagoPedidos === 'PENDIENTES'
          ? pendientes
          : todos;

      return `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px;">
            <div>
              <h3 style="margin:0; font-size:1.05rem;">📋 Pedidos de Vecinos, Estado de Cobros y Recibos en Efectivo</h3>
              <p style="margin:4px 0 0 0; font-size:0.8rem; color:#64748b;">
                Verificá qué pedidos ya están pagos y cuáles siguen pendientes. Cuando un vecino te paga en efectivo, registrá el cobro y enviale el recibo digital por WhatsApp.
              </p>
            </div>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              <button type="button" onclick="filtrarEstadoPagoPedidosGestor('TODOS')"
                style="padding:7px 12px; border-radius:8px; font-size:0.78rem; font-weight:800; cursor:pointer; border:1px solid ${GSTATE.filtroPagoPedidos === 'TODOS' ? '#0f172a' : '#cbd5e1'}; background:${GSTATE.filtroPagoPedidos === 'TODOS' ? '#0f172a' : '#fff'}; color:${GSTATE.filtroPagoPedidos === 'TODOS' ? '#fff' : '#334155'};">
                Todos (${todos.length})
              </button>
              <button type="button" onclick="filtrarEstadoPagoPedidosGestor('PENDIENTES')"
                style="padding:7px 12px; border-radius:8px; font-size:0.78rem; font-weight:800; cursor:pointer; border:1px solid ${GSTATE.filtroPagoPedidos === 'PENDIENTES' ? '#d97706' : '#fcd34d'}; background:${GSTATE.filtroPagoPedidos === 'PENDIENTES' ? '#d97706' : '#fffbeb'}; color:${GSTATE.filtroPagoPedidos === 'PENDIENTES' ? '#fff' : '#b45309'};">
                ⏳ Pendientes de Pago (${pendientes.length} · ${fmt(montoPendiente)})
              </button>
              <button type="button" onclick="filtrarEstadoPagoPedidosGestor('PAGADOS')"
                style="padding:7px 12px; border-radius:8px; font-size:0.78rem; font-weight:800; cursor:pointer; border:1px solid ${GSTATE.filtroPagoPedidos === 'PAGADOS' ? '#16a34a' : '#86efac'}; background:${GSTATE.filtroPagoPedidos === 'PAGADOS' ? '#16a34a' : '#f0fdf4'}; color:${GSTATE.filtroPagoPedidos === 'PAGADOS' ? '#fff' : '#15803d'};">
                ✅ Pagados (${pagados.length} · ${fmt(montoPagado)})
              </button>
            </div>
          </div>

          ${listaFiltrada.length === 0 ? `
            <div style="text-align:center; padding:24px; color:#64748b; font-size:0.88rem; background:#f8fafc; border-radius:10px; border:1px dashed #cbd5e1;">
              No hay pedidos en este filtro (${GSTATE.filtroPagoPedidos}).
            </div>
          ` : ''}

          <div style="display:flex; flex-direction:column; gap:12px;">
            ${listaFiltrada.map(p => {
              const pagado = Boolean(p.pago_confirmado);
              const esEfvo = String(p.medio_pago || '').toUpperCase() === 'EFECTIVO' || String(p.estado_pago || '').toUpperCase() === 'COBRADO_EFECTIVO_GESTOR';
              const refRecibo = p.comprobante_referencia || (esEfvo ? `REC-EFVO-${p.codigo_pedido}` : `TRF-${p.codigo_pedido}`);

              <div style="border:2px solid ${pagado ? '#86efac' : '#fde68a'}; border-radius:12px; padding:14px; background:${pagado ? '#fafffe' : '#ffffff'};">
                <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px; border-bottom:1px solid #f1f5f9; padding-bottom:10px; margin-bottom:10px;">
                  <div>
                    <span style="font-family:monospace; font-weight:900; background:#0f172a; color:#fff; padding:3px 8px; border-radius:6px; font-size:0.8rem;">
                      #${esc(p.codigo_pedido)}
                    </span>
                    <strong style="font-size:1rem; margin-left:8px;">👤 ${esc(p.vecino_nombre)}</strong>
                    <span style="font-size:0.8rem; color:#64748b; margin-left:8px;">📱 ${esc(p.vecino_telefono)}</span>
                    <span style="display:inline-block; margin-left:8px; padding:3px 9px; border-radius:999px; font-size:0.72rem; font-weight:800; background:${p.estado_operativo === 'ENTREGADO_VECINO' ? '#dcfce7' : p.estado_operativo === 'EN_PODER_GESTOR' ? '#e0f2fe' : p.estado_operativo === 'ARMADO_EN_CANASTO' ? '#dcfce7' : '#fef3c7'}; color:${p.estado_operativo === 'ENTREGADO_VECINO' ? '#15803d' : p.estado_operativo === 'EN_PODER_GESTOR' ? '#0369a1' : p.estado_operativo === 'ARMADO_EN_CANASTO' ? '#15803d' : '#b45309'};">
                      ${p.estado_operativo === 'ENTREGADO_VECINO' ? '✅ Entregado al Vecino' : p.estado_operativo === 'EN_PODER_GESTOR' ? '🚚 En poder del Gestor' : p.estado_operativo === 'ARMADO_EN_CANASTO' ? '🧺 Lista en Canasto Depósito' : '⏳ En preparación en Taller'}
                    </span>
                    <div style="font-size:0.8rem; color:#334155; margin-top:5px;">
                      📅 <strong>Entrega:</strong> ${esc(p.fecha_entrega_label)} ·
                      ${p.modalidad_entrega === 'ENVIO_BARRIAL'
                        ? `🛵 <strong>Envío a domicilio:</strong> ${esc(p.direccion_entrega)} ${p.entrecalles_referencia ? `(${esc(p.entrecalles_referencia)})` : ''}`
                        : `🏠 <strong>Retira por el Nodo</strong>`
                      }
                    </div>
                  </div>

                  <div style="text-align:right;">
                    ${pagado ? `
                      <span style="display:inline-block; padding:5px 11px; border-radius:999px; font-size:0.76rem; font-weight:900; background:#dcfce7; color:#15803d; border:1px solid #86efac;">
                        ${esEfvo ? `✅ PAGADO EN EFECTIVO (${fmt(p.total_vecino)})` : `✅ PAGADO TRANSFERENCIA (${fmt(p.total_vecino)})`}
                      </span>
                      <div style="font-size:0.72rem; color:#059669; font-weight:700; margin-top:3px;">
                        Comprobante: ${esc(refRecibo)}
                      </div>
                    ` : `
                      <span style="display:inline-block; padding:5px 11px; border-radius:999px; font-size:0.76rem; font-weight:900; background:#fef3c7; color:#b45309; border:1px solid #fde68a;">
                        ⏳ PENDIENTE DE PAGO · ${fmt(p.total_vecino)} (${p.medio_pago === 'EFECTIVO' ? 'Efectivo en entrega' : 'Transferencia / Efectivo'})
                      </span>
                    `}
                    <div style="font-size:0.78rem; color:#16a34a; font-weight:800; margin-top:4px;">
                      Tu ganancia en este pedido: +${fmt(p.ganancia_total_gestor)}
                      ${Number(p.cargo_envio_barrial) > 0 ? ` (incluye ${fmt(p.cargo_envio_barrial)} de envío)` : ''}
                    </div>
                  </div>
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                  <div style="font-size:0.82rem; color:#334155;">
                    ${(p.items || []).map(it => `<span style="display:inline-block; background:#f1f5f9; padding:3px 9px; border-radius:6px; margin:2px 4px 2px 0;"><strong>${it.cantidad}x</strong> ${esc(it.nombre_publico)}</span>`).join('')}
                  </div>
                  <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    ${!pagado ? `
                      <button type="button" onclick="cobrarEnEfectivoYEmitirReciboGestor(${p.id})"
                        style="padding:7px 13px; border-radius:8px; border:none; background:#16a34a; color:#ffffff; font-weight:900; font-size:0.79rem; cursor:pointer; box-shadow:0 2px 6px rgba(22,163,74,0.25);">
                        💵 Cobrar en Efectivo y Emitir Recibo (${fmt(p.total_vecino)})
                      </button>
                    ` : `
                      <button type="button" onclick="abrirModalReciboVecinoGestor(${p.id})"
                        style="padding:7px 13px; border-radius:8px; border:1px solid #16a34a; background:#dcfce7; color:#15803d; font-weight:900; font-size:0.79rem; cursor:pointer;">
                        🧾 Ver / Enviar Recibo Digital (Lab → 221 661 5746)
                      </button>
                    `}
                    <button type="button" onclick="enviarWhatsAppVecinoPedidoPrueba(${p.id})"
                      style="padding:6px 12px; border-radius:8px; border:1px solid #86efac; background:#f0fdf4; color:#15803d; font-weight:800; font-size:0.78rem; cursor:pointer;">
                      📲 Detalle por WhatsApp (221 661 5746)
                    </button>
                    <button type="button" onclick="mostrarEtiquetaPedidoGestor(${p.id})"
                      style="padding:6px 12px; border-radius:8px; border:1px solid #cbd5e1; background:#f8fafc; font-weight:700; font-size:0.78rem; cursor:pointer;">
                      🖨️ Ver Etiqueta Térmica
                    </button>
                  </div>
                </div>
                <div id="preview-etiqueta-ped-${p.id}" style="margin-top:8px;"></div>
              </div>
            `;
            }).join('')}
          </div>
        </div>
      `;
    }

    async function mostrarEtiquetaPedidoGestor(pedidoId) {
      const box = document.getElementById(`preview-etiqueta-ped-${pedidoId}`);
      if (!box) return;
      box.innerHTML = `<div style="font-size:0.78rem; color:#64748b;">Generando vista previa de la etiqueta...</div>`;
      const resp = await fetch(`/api/produccion/nodos/pedidos/${pedidoId}/etiqueta`);
      const data = await resp.json();
      if (data.ok && data.preview_rollo_base64) {
        box.innerHTML = `
          <div style="background:#0f172a; padding:10px; border-radius:10px; text-align:center;">
            <img src="${data.preview_rollo_base64}" style="max-width:100%; border-radius:6px;" alt="Etiqueta del pedido">
          </div>
        `;
      }
    }

    // -------------------------------------------------------------------------
    // COBRO EN EFECTIVO DESDE EL CELULAR DEL GESTOR + RECIBO DIGITAL MARCA BLANCA
    // -------------------------------------------------------------------------
    async function cobrarEnEfectivoYEmitirReciboGestor(pedidoId) {
      const ped = (GSTATE.pedidos || []).find(p => Number(p.id) === Number(pedidoId));
      if (!ped) return;

      const resp = await fetch(`/api/produccion/nodos/liquidacion/pedidos/${pedidoId}/conciliar-pago`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          medio_pago: 'EFECTIVO',
          comprobante_referencia: `REC-EFVO-${ped.codigo_pedido}`
        })
      });
      const data = await resp.json();
      if (!data.ok) {
        alert('⚠️ ' + (data.error || 'No se pudo registrar el cobro en efectivo.'));
        return;
      }
      await cargarPanelGestor();
      abrirModalReciboVecinoGestor(pedidoId);
    }

    function cerrarModalReciboGestor() {
      const modal = document.getElementById('modal-recibo-gestor');
      if (modal) modal.style.display = 'none';
    }

    function abrirModalReciboVecinoGestor(pedidoId) {
      const p = (GSTATE.pedidos || []).find(x => Number(x.id) === Number(pedidoId));
      if (!p || !GSTATE.nodo) return;
      const esEfvo = String(p.medio_pago || '').toUpperCase() === 'EFECTIVO' || String(p.estado_pago || '').toUpperCase() === 'COBRADO_EFECTIVO_GESTOR';
      const nroRecibo = p.comprobante_referencia || (esEfvo ? `REC-EFVO-${p.codigo_pedido}` : `REC-TRF-${p.codigo_pedido}`);
      const fechaHoy = p.fecha_conciliacion_pago
        ? new Date(p.fecha_conciliacion_pago).toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' })
        : new Date().toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' });

      const modal = document.getElementById('modal-recibo-gestor');
      const body = document.getElementById('modal-recibo-gestor-body');
      if (!modal || !body) return;

      body.innerHTML = `
        <div style="background:${esc(GSTATE.nodo.color_primario || '#16a34a')}; color:#ffffff; padding:16px 18px; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-size:0.72rem; text-transform:uppercase; font-weight:800; opacity:0.9;">Comprobante Digital de Pago Vecinal</div>
            <div style="font-size:1.12rem; font-weight:900; margin-top:2px;">🌿 ${esc(GSTATE.nodo.nombre_marca)}</div>
            <div style="font-size:0.76rem; opacity:0.92;">Atendido por ${esc(GSTATE.nodo.gestor_nombre)} · ${esc(GSTATE.nodo.barrio_zona || '')}</div>
          </div>
          <button type="button" onclick="cerrarModalReciboGestor()" style="background:rgba(0,0,0,0.2); border:none; color:#fff; width:32px; height:32px; border-radius:999px; font-weight:900; cursor:pointer;">✕</button>
        </div>

        <div style="padding:18px;">
          <div style="display:flex; justify-content:space-between; align-items:center; background:#f0fdf4; border:1px solid #86efac; border-radius:10px; padding:10px 12px; margin-bottom:14px;">
            <div>
              <div style="font-size:0.72rem; color:#15803d; font-weight:800; text-transform:uppercase;">Estado del Pedido #${esc(p.codigo_pedido)}</div>
              <div style="font-size:0.95rem; font-weight:900; color:#166534;">✅ PAGADO (${esEfvo ? 'Efectivo en Mano' : 'Transferencia Bancaria'})</div>
            </div>
            <div style="text-align:right; font-family:monospace; font-size:0.76rem; color:#15803d; font-weight:800;">
              <div>${esc(nroRecibo)}</div>
              <div>${esc(fechaHoy)}</div>
            </div>
          </div>

          <div style="font-size:0.84rem; color:#334155; margin-bottom:12px; line-height:1.5;">
            <div><strong>Cliente / Vecino:</strong> ${esc(p.vecino_nombre)} (${esc(p.vecino_telefono)})</div>
            <div><strong>Entrega:</strong> ${esc(p.fecha_entrega_label)} (${p.modalidad_entrega === 'ENVIO_BARRIAL' ? `Envío a ${esc(p.direccion_entrega)}` : `Retiro en ${esc(GSTATE.nodo.direccion_retiro || 'Nodo')}`})</div>
          </div>

          <div style="border:1px solid #e2e8f0; border-radius:10px; overflow:hidden; margin-bottom:14px;">
            <div style="background:#f8fafc; padding:8px 12px; font-size:0.74rem; font-weight:800; color:#475569; text-transform:uppercase; border-bottom:1px solid #e2e8f0;">
              Detalle de Productos
            </div>
            <div style="padding:10px 12px; display:flex; flex-direction:column; gap:6px; font-size:0.83rem;">
              ${(p.items || []).map(it => `
                <div style="display:flex; justify-content:space-between;">
                  <span><strong>${it.cantidad}x</strong> ${esc(it.nombre_publico)}</span>
                  <strong>${fmt(it.subtotal_vecino)}</strong>
                </div>
              `).join('')}
              ${Number(p.cargo_envio_barrial) > 0 ? `
                <div style="display:flex; justify-content:space-between; color:#475569; border-top:1px dashed #e2e8f0; padding-top:6px;">
                  <span>🛵 Envío a domicilio barrial</span>
                  <strong>${fmt(p.cargo_envio_barrial)}</strong>
                </div>
              ` : ''}
              <div style="display:flex; justify-content:space-between; font-size:1rem; font-weight:900; color:#0f172a; border-top:2px solid #cbd5e1; padding-top:8px; margin-top:4px;">
                <span>TOTAL ABONADO</span>
                <span style="color:#16a34a;">${fmt(p.total_vecino)}</span>
              </div>
            </div>
          </div>

          <div style="display:flex; flex-direction:column; gap:8px;">
            <button type="button" onclick="enviarReciboWhatsAppVecinoGestor(${p.id})"
              style="width:100%; padding:12px; border-radius:10px; border:none; background:#16a34a; color:#ffffff; font-weight:900; font-size:0.9rem; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;">
              📲 Enviar Recibo por WhatsApp al Vecino (Lab → 221 661 5746)
            </button>
            <button type="button" onclick="cerrarModalReciboGestor()"
              style="width:100%; padding:9px; border-radius:9px; border:1px solid #cbd5e1; background:#f8fafc; color:#475569; font-weight:700; font-size:0.82rem; cursor:pointer;">
              Cerrar
            </button>
          </div>
        </div>
      `;

      modal.style.display = 'flex';
    }

    async function enviarReciboWhatsAppVecinoGestor(pedidoId) {
      const p = (GSTATE.pedidos || []).find(x => Number(x.id) === Number(pedidoId));
      if (!p || !GSTATE.nodo) return;
      const esEfvo = String(p.medio_pago || '').toUpperCase() === 'EFECTIVO' || String(p.estado_pago || '').toUpperCase() === 'COBRADO_EFECTIVO_GESTOR';
      const nroRecibo = p.comprobante_referencia || (esEfvo ? `REC-EFVO-${p.codigo_pedido}` : `REC-TRF-${p.codigo_pedido}`);
      const itemsTxt = (p.items || []).map(it => `• ${it.cantidad}x ${it.nombre_publico}: ${fmt(it.subtotal_vecino)}`).join('\n');

      const mensaje = [
        `🧾 *RECIBO DE PAGO — ${GSTATE.nodo.nombre_marca}*`,
        `Comprobante: *${nroRecibo}* · Pedido *#${p.codigo_pedido}*`,
        `Hola *${p.vecino_nombre}*, registramos tu pago correctamente:`,
        itemsTxt,
        Number(p.cargo_envio_barrial) > 0 ? `• Envío barrial: ${fmt(p.cargo_envio_barrial)}` : '',
        `✅ *TOTAL ABONADO: ${fmt(p.total_vecino)}*`,
        `Medio de pago: *${esEfvo ? 'Efectivo recibido en mano' : 'Transferencia Bancaria'}*`,
        `¡Muchas gracias por tu compra en ${GSTATE.nodo.nombre_marca}! 🌿`
      ].filter(Boolean).join('\n');

      const resp = await fetch('/api/produccion/nodos/whatsapp-prueba', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          destinatario_nombre: p.vecino_nombre,
          telefono_original: p.vecino_telefono,
          mensaje
        })
      });
      const data = await resp.json();
      if (!resp.ok || !data.ok) {
        alert('Error al despachar recibo por WhatsApp: ' + (data.error || 'Error interno'));
        return;
      }
      mostrarConfirmacionWhatsAppGestor(data, `Recibo Digital ${nroRecibo} Despachado`, `Vecino/a: ${p.vecino_nombre} (${p.vecino_telefono || 'S/T'})`);
    }

    // -------------------------------------------------------------------------
    // TAB 5: CUENTA CORRIENTE Y LIQUIDACIÓN DEL LOTE DEL GESTOR
    // -------------------------------------------------------------------------
    function renderTabLiquidacionGestor() {
      const liqData = GSTATE.liquidacionTablero;
      const canastos = (liqData?.lotes || []).filter(c => Number(c.nodo_id) === Number(GSTATE.nodo?.id));
      const nodoResumen = (liqData?.nodos || []).find(n => Number(n.id) === Number(GSTATE.nodo?.id)) || GSTATE.nodo || {};
      const saldoActual = Number(nodoResumen?.saldo_cuenta_corriente ?? canastos[0]?.saldo_cuenta_corriente ?? 0);
      const codMadre = nodoResumen?.codigo_bunker_cliente_madre || GSTATE.nodo?.codigo_bunker_cliente_madre || null;
      const nomMadre = nodoResumen?.cliente_madre_razon_social || nodoResumen?.cliente_madre_nombre || GSTATE.nodo?.cliente_madre_razon_social || '';
      const saldoMadre = Number(nodoResumen?.saldo_cuenta_corriente_madre ?? GSTATE.nodo?.saldo_cuenta_corriente_madre ?? 0);

      return `
        <div class="card" style="background:linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color:#fff; border:none;">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
            <div style="flex:1; min-width:260px;">
              <div style="font-size:0.74rem; color:#94a3b8; font-weight:800; text-transform:uppercase;">
                Subcuenta Operativa del Nodo (${esc(nodoResumen?.codigo_bunker_cliente || GSTATE.nodo?.codigo_bunker_cliente || 'CB-NODO')})
              </div>
              <div style="font-size:1.25rem; font-weight:900; margin-top:4px;">
                Saldo Operativo del Canasto:
                <span style="color:${saldoActual < 0 ? '#f87171' : saldoActual > 0 ? '#4ade80' : '#38bdf8'};">
                  ${saldoActual < 0 ? '-' + fmt(Math.abs(saldoActual)) : fmt(saldoActual)}
                </span>
              </div>
              <div style="font-size:0.8rem; color:#cbd5e1; margin-top:4px;">
                Las transferencias de tus vecinos en la cuenta recaudadora (${esc(GSTATE.nodo?.alias_bancario_display || '')}) se acreditan a tu favor y se compensan con el efectivo que cobrás en mano.
              </div>
              ${codMadre ? `
                <div style="margin-top:10px; padding:9px 12px; border-radius:9px; background:rgba(245,158,11,0.16); border:1px solid rgba(245,158,11,0.45); font-size:0.8rem; color:#fef3c7;">
                  🔗 <strong>Cuenta Madre Vinculada en LAMDA: ${esc(codMadre)} (${esc(nomMadre)})</strong> ·
                  Saldo Cuenta Principal B2B:
                  <strong style="color:#4ade80;">
                    ${saldoMadre < 0 ? `${fmt(Math.abs(saldoMadre))} a tu favor (${fmt(saldoMadre)})` : fmt(saldoMadre)}
                  </strong>
                  <div style="font-size:0.73rem; color:#fde68a; margin-top:2px;">
                    Al cerrar la liquidación del lote, el resultado neto impacta automáticamente como un asiento limpio (<code>LIQUIDACION_NODO</code>) en tu Cuenta Principal <code>${esc(codMadre)}</code> y en tu Portal B2B.
                  </div>
                </div>
              ` : ''}
            </div>
            <a href="/liquidacion-nodos/${encodeURIComponent(GSTATE.slug)}" target="_blank"
              style="padding:10px 16px; border-radius:10px; background:#16a34a; color:#fff; text-decoration:none; font-weight:900; font-size:0.84rem;">
              💳 Abrir Mesa Completa de Liquidación ↗
            </a>
          </div>
        </div>

        ${canastos.length === 0 ? `
          <div class="card" style="text-align:center; padding:24px; color:#64748b;">
            Aún no hay lotes/canastos con pedidos de vecinos para liquidar en este Nodo.
          </div>
        ` : ''}

        ${canastos.map(c => {
          const liq = c.cuadro_liquidacion || {};
          return `
            <div class="card">
              <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; border-bottom:1px solid #e2e8f0; padding-bottom:12px; margin-bottom:14px;">
                <div>
                  <span style="background:#0f172a; color:#fff; padding:3px 9px; border-radius:6px; font-family:monospace; font-size:0.78rem; font-weight:800;">
                    Lote ${esc(c.codigo_canasto)}
                  </span>
                  <strong style="font-size:1.05rem; margin-left:8px;">📅 Entrega: ${esc(c.fecha_entrega_label)}</strong>
                </div>
                <span style="padding:4px 12px; border-radius:999px; font-size:0.76rem; font-weight:800; background:${c.liquidacion_cerrada ? '#dcfce7' : '#fef3c7'}; color:${c.liquidacion_cerrada ? '#15803d' : '#b45309'};">
                  ${c.liquidacion_cerrada ? '🏁 Lote Liquidado (Subcuenta Nodo en $0)' : `⏳ ${liq.pedidos_pagos_confirmados || 0} de ${liq.total_pedidos || 0} cobros vecinales confirmados`}
                </span>
              </div>

              <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:12px; margin-bottom:14px;">
                <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:12px;">
                  <div style="font-size:0.74rem; color:#64748b; font-weight:800; text-transform:uppercase;">Total Vendido a Vecinos</div>
                  <div style="font-size:1.3rem; font-weight:900; color:#0f172a; margin-top:4px;">${fmt(liq.total_venta_vecinos)}</div>
                  <div style="font-size:0.75rem; color:#64748b; margin-top:3px;">Incluye ${fmt(liq.total_envios_barriales_gestor)} de envíos barriales (100% tuyo)</div>
                </div>
                <div style="background:#fef2f2; border:1px solid #fecaca; border-radius:10px; padding:12px;">
                  <div style="font-size:0.74rem; color:#991b1b; font-weight:800; text-transform:uppercase;">Menos Costo Base del Lote</div>
                  <div style="font-size:1.3rem; font-weight:900; color:#dc2626; margin-top:4px;">-${fmt(liq.total_base_lamda)}</div>
                  <div style="font-size:0.75rem; color:#991b1b; margin-top:3px;">Valor mayorista del canasto retirado</div>
                </div>
                <div style="background:#f0fdf4; border:1px solid #86efac; border-radius:10px; padding:12px;">
                  <div style="font-size:0.74rem; color:#166534; font-weight:800; text-transform:uppercase;">Tu Ganancia Neta en este Lote</div>
                  <div style="font-size:1.3rem; font-weight:900; color:#16a34a; margin-top:4px;">+${fmt(liq.ganancia_neta_gestor)}</div>
                  <div style="font-size:0.75rem; color:#15803d; margin-top:3px;">Margen productos + 100% envíos</div>
                </div>
              </div>

              <div style="background:#eff6ff; border:1px solid #bfdbfe; border-radius:10px; padding:14px; margin-bottom:14px;">
                <div style="font-weight:900; font-size:0.95rem; color:#1e3a8a; margin-bottom:6px;">
                  ⚖️ ${esc(liq.titulo_resultado || 'Compensación entre Transferencias y Efectivo en Mano')}
                </div>
                <div style="font-size:0.84rem; color:#1e40af; line-height:1.5;">
                  • Transferencias de vecinos en cuenta recaudadora (a tu favor): <strong>+${fmt(liq.transferencias_esperadas)}</strong> (${liq.cant_transferencias_conciliadas || 0}/${liq.cant_transferencias_totales || 0} conciliadas)<br>
                  • Efectivo cobrado en mano por vos en el reparto: <strong>${fmt(liq.efectivo_esperado)}</strong> (${liq.cant_efectivo_cobrados || 0}/${liq.cant_efectivo_totales || 0} cobrados)<br>
                  👉 <strong>${esc(liq.explicacion_compensacion || '')}</strong>
                </div>
              </div>

              <div style="display:flex; flex-direction:column; gap:8px;">
                ${(c.pedidos_vecinos || []).map(p => {
                  const pagado = Boolean(p.pago_confirmado);
                  const esEfvo = String(p.medio_pago || '').toUpperCase() === 'EFECTIVO' || String(p.estado_pago || '').toUpperCase() === 'COBRADO_EFECTIVO_GESTOR';
                  return `
                    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; padding:10px 12px; border:1px solid ${pagado ? '#86efac' : '#fde68a'}; background:${pagado ? '#f0fdf4' : '#fffbeb'}; border-radius:9px;">
                      <div style="font-size:0.84rem;">
                        <strong>#${esc(p.codigo_pedido)} · ${esc(p.vecino_nombre)}</strong>
                        <span style="margin-left:8px; color:#475569;">(${esEfvo ? '💵 Efectivo' : '🏦 Transferencia'}: <strong>${fmt(p.total_vecino)}</strong>)</span>
                      </div>
                      <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
                        ${pagado
                          ? `
                            <span style="font-size:0.76rem; font-weight:800; color:#15803d;">✅ ${esEfvo ? 'Cobrado en Efectivo' : 'Transferencia Acreditada'} (${fmt(p.total_vecino)})</span>
                            <button type="button" onclick="abrirModalReciboVecinoGestor(${p.id})"
                              style="padding:5px 10px; border-radius:7px; border:1px solid #16a34a; background:#ffffff; color:#15803d; font-weight:800; font-size:0.74rem; cursor:pointer;">
                              🧾 Recibo Digital / WhatsApp
                            </button>
                          `
                          : `
                            <span style="font-size:0.74rem; font-weight:800; color:#b45309;">⏳ Pendiente de pago</span>
                            <button type="button" onclick="cobrarEnEfectivoYEmitirReciboGestor(${p.id})"
                              style="padding:6px 12px; border-radius:7px; border:none; background:#16a34a; color:#fff; font-weight:800; font-size:0.76rem; cursor:pointer;">
                              💵 Cobrar en Efectivo y Emitir Recibo
                            </button>
                          `
                        }
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        }).join('')}
      `;
    }

    async function registrarCobroRapidoGestor(pedidoId, medioPago) {
      const resp = await fetch(`/api/produccion/nodos/liquidacion/pedidos/${pedidoId}/conciliar-pago`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ medio_pago: medioPago })
      });
      const data = await resp.json();
      if (data.ok) {
        await cargarPanelGestor();
      } else {
        alert('⚠️ ' + (data.error || 'No se pudo registrar el cobro'));
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      GSTATE.slug = detectarSlugInicial();
      cargarPanelGestor();
    });
  </script>
