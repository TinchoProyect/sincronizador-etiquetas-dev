          <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap:14px; margin-bottom:18px;">
            <div>
              <label style="display:block; font-size:0.94rem; font-weight:800; margin-bottom:6px; color:var(--text);">Domicilio del punto de retiro</label>
              <input type="text" id="cfg-direccion-retiro" class="input-sm" style="width:100%;" value="${esc(GSTATE.nodo.direccion_retiro || '')}" />
            </div>
            ${mostrarRepartoControles ? `
              <div id="cfg-cargo-envio-wrap" style="${(GSTATE.nodo.permitir_reparto_propio ?? GSTATE.nodo.permitir_envio_barrial) ? '' : 'opacity:0.48; transition:opacity 0.15s;'}">
                <label style="display:block; font-size:0.94rem; font-weight:800; margin-bottom:6px; color:var(--text);">Costo de reparto propio a domicilio ($)</label>
                <input type="number" step="100" id="cfg-cargo-envio" class="input-sm" style="width:100%;" value="${Number(GSTATE.nodo.cargo_envio_barrial || 0)}" ${(GSTATE.nodo.permitir_reparto_propio ?? GSTATE.nodo.permitir_envio_barrial) ? '' : 'disabled'} />
                <div style="font-size:0.86rem; color:var(--ok); font-weight:700; margin-top:5px;">100% acreditado a tu favor cuando activás reparto propio</div>
              </div>
            ` : ''}
          </div>

          <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:18px;">
            <div style="font-size:0.94rem; font-weight:900; color:var(--text);">Modalidades de entrega habilitadas en tu tienda</div>
            <div class="cfg-switch-card">
              <label class="switch-label">
                <input type="checkbox" id="cfg-permitir-retiro" ${GSTATE.nodo.permitir_retiro_nodo !== false ? 'checked' : ''} />
                <span>${mod.mostrar_horarios_comerciales ? '🏪 Habilitar retiro en local sin cargo' : '🏠 Habilitar punto de retiro'}</span>
              </label>

            ${mostrarRepartoControles ? `
              <div class="cfg-switch-card">
                <label class="switch-label">
                  <input type="checkbox" id="cfg-permitir-reparto" ${(GSTATE.nodo.permitir_reparto_propio ?? GSTATE.nodo.permitir_envio_barrial) ? 'checked' : ''} onchange="actualizarEstadoCargoEnvioGestor()" />
                  <span>🚗 Habilitar reparto propio a domicilio</span>
                </label>
              </div>
            ` : ''}
            ${mod.envio_paqueteria ? `
              <div class="cfg-switch-card">
                <label class="switch-label">
                  <input type="checkbox" id="cfg-permitir-encomienda" ${GSTATE.nodo.permitir_encomienda ? 'checked' : ''} />
                  <span>📦 Envíos por Paquetería Nacional</span>
                </label>
              </div>
            ` : ''}
            <div class="cfg-switch-card">
              <label class="switch-label">
                <input type="checkbox" id="cfg-mostrar-ingredientes" ${GSTATE.nodo.mostrar_ingredientes_tienda !== false ? 'checked' : ''} />
                <span>🥗 Mostrar botón "¿Qué contiene?" (ingredientes) en mi tienda</span>
              </label>
            </div>
          </div>

          ${renderizarBloqueVideoBienvenidaGestor()}

          ${renderizarBloqueMediosPagoGestor()}

          <button type="button" class="btn-primary" id="btn-guardar-config-tienda" style="width:100%; max-width:340px;" onclick="guardarConfigLogisticaGestor()">
            Guardar Configuración

    function renderizarBloqueVideoBienvenidaGestor() {
      const vid = obtenerVideoBienvenidaGestor();
      if (!vid.tiene_video || !vid.activo) return '';
      return `
        <div id="cfg-video-bienvenida-card" style="background:var(--surface-warm); border:1.5px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:18px;">
          <div style="font-size:0.94rem; font-weight:900; color:var(--text); margin-bottom:4px;">
            🎬 Video de presentación (100% opcional)
          </div>
          <div style="font-size:0.8rem; color:var(--muted); margin-bottom:12px; line-height:1.4;">
            Elegí con total libertad dónde querés usar el video promocional con sonido de tu tienda. Podés prenderlo o apagarlo cuando quieras.

          <div style="display:flex; flex-direction:column; gap:10px;">

              <label class="switch-label">
                <input type="checkbox" id="cfg-video-difusion" ${vid.habilitar_en_difusion ? 'checked' : ''} />

              </label>
            </div>
            <div class="cfg-switch-card" style="background:#fff;">
              <label class="switch-label">
                <input type="checkbox" id="cfg-video-tienda" ${vid.mostrar_en_tienda ? 'checked' : ''} />

          </div>

      `;

    function leerVentanasDesdeDom() {
      const rows = Array.from(document.querySelectorAll('.ventana-item-row'));
      return rows.map(r => ({
        dia_entrega: r.querySelector('.v-dia-entrega').value,
        cierre_dia: r.querySelector('.v-cierre-dia').value,
        cierre_hora: r.querySelector('.v-cierre-hora').value || '14:00',
        ventana_retiro: r.querySelector('.v-ventana-retiro').value || '17:00 a 20:00 hs'
      }));
    }

    function agregarVentanaRow() {
      const actual = leerVentanasDesdeDom();
      actual.push({ dia_entrega: 'Sábado', cierre_dia: 'Viernes', cierre_hora: '14:00', ventana_retiro: '10:00 a 13:30 hs' });
      GSTATE.nodo.config_ventanas_corte = actual;
      renderVistaGestor();
    }

    function eliminarVentanaRow(idx) {
      const actual = leerVentanasDesdeDom();
      if (actual.length <= 1) {
        mostrarAvisoPantallaGestor('Debe quedar al menos un día de entrega configurado.', 'error');
        return;
      }
      actual.splice(idx, 1);

    function obtenerPerfilPublicoGestor() {
      const raw = (GSTATE.nodo && GSTATE.nodo.config_perfil_publico && typeof GSTATE.nodo.config_perfil_publico === 'object')
        ? GSTATE.nodo.config_perfil_publico
        : ((GSTATE.compartirKit?.nodo?.config_perfil_publico && typeof GSTATE.compartirKit.nodo.config_perfil_publico === 'object')
            ? GSTATE.compartirKit.nodo.config_perfil_publico
            : {});
      const lineasRaw = Array.isArray(raw.whatsapp_lineas) ? raw.whatsapp_lineas : [];
      const lineas = [];
      const vistos = new Set();
      for (const it of lineasRaw) {
        if (!it || typeof it !== 'object') continue;
        const p = parsearWhatsappArPerfil(it.numero || '');
        if (!p.ok || !p.valor || vistos.has(p.valor)) continue;
        vistos.add(p.valor);
        lineas.push({
          id: String(it.id || `wa_${lineas.length + 1}`),
          numero: p.valor,
          display: p.display,
          etiqueta: String(it.etiqueta || '').trim() || `WhatsApp Tienda ${lineas.length + 1}`
        });
      }
      if (lineas.length === 0 && raw.whatsapp_tienda) {
        const pLeg = parsearWhatsappArPerfil(raw.whatsapp_tienda);
        if (pLeg.ok && pLeg.valor) {
          lineas.push({ id: 'wa_1', numero: pLeg.valor, display: pLeg.display, etiqueta: 'WhatsApp Tienda' });
        }
      }
      const modoRaw = String(raw.whatsapp_activo_modo || '').trim().toUpperCase();
      let activoNum = String(raw.whatsapp_activo_numero || raw.whatsapp_tienda || '').trim();
      let modo = 'BASE';
      if ((modoRaw === 'ADICIONAL' || (!modoRaw && raw.whatsapp_tienda)) && lineas.length > 0) {
        const match = lineas.find(l => l.numero === activoNum) || (!activoNum ? lineas[0] : null);
        if (match) {
          modo = 'ADICIONAL';
          activoNum = match.numero;
        } else {
          activoNum = '';
        }
      } else {
        activoNum = '';
      }

      return {
        nombre_contacto_tienda: String(raw.nombre_contacto_tienda || '').trim(),
        whatsapp_lineas: lineas,
        whatsapp_activo_modo: modo,
        whatsapp_activo_numero: activoNum,

        whatsapp_tienda_display: activoNum ? (lineas.find(l => l.numero === activoNum)?.display || '') : '',

        instagram_usuario: String(raw.instagram_usuario || '').trim().toLowerCase(),
        instagram_url: String(raw.instagram_url || '').trim(),
        mostrar_instagram_tienda: Boolean(raw.instagram_usuario && (raw.mostrar_instagram_tienda !== undefined ? raw.mostrar_instagram_tienda : true)),
        incluir_instagram_en_difusion: Boolean(raw.instagram_usuario && raw.incluir_instagram_en_difusion),
        updated_at: raw.updated_at || null
      };
    }

    function parsearWhatsappArPerfil(raw = '') {
      const txt = String(raw ?? '').trim();
      if (!txt) {
        return { vacio: true, ok: true, valor: '', local10: '', display: '', inputFormateado: '', avisoSaneado: '', error: '' };
      }
      let d = txt.replace(/\D+/g, '');
      const notasSaneado = [];
      if (d.startsWith('0054')) d = d.slice(2);
      if (d.startsWith('549') && d.length >= 12) {
        d = d.slice(3);
      } else if (d.startsWith('54') && d.length >= 12) {
        d = d.slice(2);
      }
      if (d.startsWith('0')) {
        d = d.slice(1);
        notasSaneado.push('quitamos el 0 inicial');
      }
      if (d.length === 12) {
        if (d.startsWith('1115')) {
          d = '11' + d.slice(4);
          notasSaneado.push('quitamos el 15');
        } else if (d.slice(3, 5) === '15') {
          d = d.slice(0, 3) + d.slice(5);
          notasSaneado.push('quitamos el 15');
        } else if (d.slice(4, 6) === '15') {
          d = d.slice(0, 4) + d.slice(6);
          notasSaneado.push('quitamos el 15');
        }
      }
      if (d.length === 11 && d.startsWith('9')) {
        d = d.slice(1);
      }
      if (!/^[1-9]\d{9}$/.test(d) || d.startsWith('15')) {
        const faltan = Math.max(0, 10 - d.length);
        const msg = d.length < 10
          ? `Faltan ${faltan} dígito${faltan === 1 ? '' : 's'} (ingresá código de área + número sin 0 ni 15, total 10 dígitos).`
          : 'Número inválido: ingresá solo 10 dígitos de celular argentino (código de área + número, sin 0 ni 15). Ej: 221 670-2981.';
        return { vacio: false, ok: false, valor: '', local10: d, display: '', inputFormateado: '', avisoSaneado: '', error: msg };
      }
      const inputFormateado = d.startsWith('11')
        ? `11 ${d.slice(2, 6)}-${d.slice(6)}`
        : `${d.slice(0, 3)} ${d.slice(3, 6)}-${d.slice(6)}`;
      return {
        vacio: false,
        ok: true,
        valor: `549${d}`,
        local10: d,
        display: `+54 9 ${inputFormateado}`,
        inputFormateado,
        avisoSaneado: notasSaneado.length > 0 ? ` (${notasSaneado.join(' y ')})` : '',
        error: ''
      };
    }

    function parsearEmailPerfil(raw = '') {
      const limpio = String(raw ?? '').trim().toLowerCase();
      if (!limpio) return { vacio: true, ok: true, valor: '', error: '' };
      if (limpio.length > 140 || !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(limpio)) {
        return { vacio: false, ok: false, valor: '', error: 'Ingresá un correo electrónico válido (ej: tu.marca@gmail.com).' };
      }
      return { vacio: false, ok: true, valor: limpio, error: '' };
    }

    function parsearInstagramPerfil(raw = '') {
      let txt = String(raw ?? '').trim();
      if (!txt) return { vacio: true, ok: true, usuario: '', url: '', error: '' };
      txt = txt.replace(/^https?:\/\//i, '').replace(/^(?:www\.|m\.)?instagram\.com\//i, '');
      txt = txt.split(/[?#]/)[0].trim();
      const primerSeg = txt.split('/').filter(Boolean)[0] || '';
      const usuario = primerSeg.replace(/^@+/, '').trim().toLowerCase();
      const reservadas = new Set(['p', 'reel', 'reels', 'stories', 'explore', 'accounts', 'direct', 'tv', 'channel']);
      if (!usuario || reservadas.has(usuario)) {
        return { vacio: false, ok: false, usuario: '', url: '', error: 'Ingresá tu usuario o link de perfil (ej: @manso.ok), no el enlace de una publicación.' };
      }
      if (usuario.length > 30 || !/^[a-z0-9._]+$/.test(usuario) || usuario.startsWith('.') || usuario.endsWith('.') || usuario.includes('..')) {
        return { vacio: false, ok: false, usuario: '', url: '', error: 'El usuario de Instagram solo admite letras, números, puntos y guiones bajos (máx. 30 caracteres).' };
      }
      return { vacio: false, ok: true, usuario, url: `https://www.instagram.com/${usuario}/`, error: '' };
    }

      const waInp = document.getElementById('perfil-wa-input');

      const waRes = parsearWhatsappArPerfil(waInp?.value || '');

        actualizarEstadoFormularioPerfilGestor(false);
        return;
      }
      const waBaseParse = parsearWhatsappArPerfil(GSTATE.nodo?.gestor_telefono || '');
      if (waBaseParse.ok && waBaseParse.valor === waRes.valor) {
        _perfilWaDraft.modo = 'BASE';

            <div style="font-size:0.78rem; color:var(--muted); margin-bottom:10px; line-height:1.4;">
              Podés escribir tu <code>@usuario</code> o pegar directamente el enlace completo de tu perfil.

            <div style="display:flex; gap:8px; align-items:stretch; flex-wrap:wrap;">
              <input type="text" id="perfil-ig-input" data-testid="perfil-ig-input"
                class="input-sm" style="flex:1; min-width:220px; font-size:0.9rem; font-weight:700;"

                placeholder="Ej: @paraiso.saludable ó instagram.com/paraiso.saludable"

              <button type="button" id="btn-perfil-probar-ig" data-testid="btn-perfil-probar-ig" class="btn-soft"

                🔗 Abrir perfil
              </button>

                </label>

                    ${perfil.incluir_instagram_en_difusion ? 'checked' : ''} />

          <button type="button" id="btn-guardar-perfil-gestor" data-testid="btn-guardar-perfil-gestor"

            onclick="guardarPerfilContactoGestor()">
            💾 Guardar Mi Perfil y Contacto
          </button>
        </div>

    function actualizarEstadoFormularioPerfilGestor(formatearAlSalir = false) {
      const nomInp = document.getElementById('perfil-nombre-contacto-input');
      const nomBanner = document.getElementById('perfil-nombre-actual-banner');
      const btnNomBase = document.getElementById('btn-perfil-nombre-base');
      const waInp = document.getElementById('perfil-wa-input');
      const waEst = document.getElementById('perfil-wa-estado');
      const btnAgregarWa = document.getElementById('btn-perfil-agregar-wa');
      const btnProbarWa = document.getElementById('btn-perfil-probar-wa');
      const emInp = document.getElementById('perfil-email-input');
      const emEst = document.getElementById('perfil-email-estado');
      const emWrap = document.getElementById('perfil-email-switches-wrap');
      const emSwTienda = document.getElementById('perfil-email-mostrar-tienda');
      const emSwLamda = document.getElementById('perfil-email-lamda');
      const igInp = document.getElementById('perfil-ig-input');
      const igEst = document.getElementById('perfil-ig-estado');
      const igWrap = document.getElementById('perfil-ig-switches-wrap');
      const igSwTienda = document.getElementById('perfil-ig-mostrar-tienda');
      const igSwDif = document.getElementById('perfil-ig-en-difusion');
      const btnProbarIg = document.getElementById('btn-perfil-probar-ig');
      const btnGuardar = document.getElementById('btn-guardar-perfil-gestor');
      if (!waInp || !emInp || !igInp) return;

      const prevScrollY = window.scrollY;
      if (nomInp && nomBanner) {
        const nomVal = String(nomInp.value || '').trim();
        const nomBase = String(GSTATE.nodo?.gestor_nombre || GSTATE.nodo?.nombre_marca || 'Referente').trim();
        const nextNomHtml = nomVal
          ? `✅ En tu tienda figurarás como: <strong>${esc(nomVal)}</strong> <span style="color:var(--muted); font-size:0.76rem;">(Titular en LAMDA: ${esc(nomBase)})</span>`
          : `👤 Actualmente en tu tienda figurás como: <strong>${esc(nomBase)}</strong> <span style="color:var(--muted); font-size:0.76rem;">(nombre base registrado)</span>`;
        if (nomBanner.dataset.lastHtml !== nextNomHtml) {
          nomBanner.innerHTML = nextNomHtml;
          nomBanner.dataset.lastHtml = nextNomHtml;
        }
        if (btnNomBase) btnNomBase.style.display = nomVal ? 'inline-flex' : 'none';
      }

      const waRes = parsearWhatsappArPerfil(waInp.value);

      if (formatearAlSalir && !waRes.vacio && waRes.ok && waRes.inputFormateado && waInp.value !== waRes.inputFormateado) {
        waInp.value = waRes.inputFormateado;
      }
      if (waEst) {
        if (waRes.vacio) {
          waEst.style.color = 'var(--muted)';
          waEst.textContent = 'Ingresá 10 dígitos de celular argentino (código de área + número, sin 0 ni 15) y tocá "+ Agregar línea".';
        } else if (waRes.ok) {
          waEst.style.color = '#15803d';
          waEst.textContent = `✅ Listo para sumar: ${waRes.display}${waRes.avisoSaneado}`;
        } else {
          waEst.style.color = '#b91c1c';
          waEst.textContent = `⚠️ ${waRes.error}`;
        }
      }
      if (btnAgregarWa) {
        btnAgregarWa.disabled = waRes.vacio || !waRes.ok;
      }
      if (btnProbarWa) {
        btnProbarWa.disabled = waRes.vacio || !waRes.ok;
      }

      const emRes = parsearEmailPerfil(emInp.value);
      if (formatearAlSalir && !emRes.vacio && emRes.ok && emInp.value !== emRes.valor) {
        emInp.value = emRes.valor;
      }
      if (emEst) {
        if (emRes.vacio) {
          emEst.style.color = 'var(--muted)';
          emEst.textContent = 'Opcional: si lo dejás vacío, no se muestra correo en tu tienda.';
        } else if (emRes.ok) {
          emEst.style.color = '#15803d';
          emEst.textContent = `✅ Correo válido: ${emRes.valor}`;
        } else {
          emEst.style.color = '#b91c1c';
          emEst.textContent = `⚠️ ${emRes.error}`;
        }
      }
      const emActivo = !emRes.vacio && emRes.ok;
      if (emWrap) emWrap.style.opacity = emActivo ? '1' : '0.46';
      if (emSwTienda) emSwTienda.disabled = !emActivo;
      if (emSwLamda) emSwLamda.disabled = !emActivo;

      const igRes = parsearInstagramPerfil(igInp.value);
      if (formatearAlSalir && !igRes.vacio && igRes.ok && igInp.value !== `@${igRes.usuario}`) {
        igInp.value = `@${igRes.usuario}`;
      }
      if (igEst) {
        if (igRes.vacio) {
          igEst.style.color = 'var(--muted)';
          igEst.textContent = 'Opcional: si lo dejás vacío, no se muestra Instagram en tu tienda ni en difusión.';
        } else if (igRes.ok) {
          igEst.style.color = '#15803d';
          igEst.textContent = `✅ Perfil listo: @${igRes.usuario} (${igRes.url})`;
        } else {
          igEst.style.color = '#b91c1c';
          igEst.textContent = `⚠️ ${igRes.error}`;
        }
      }
      const igActivo = !igRes.vacio && igRes.ok;
      if (igWrap) igWrap.style.opacity = igActivo ? '1' : '0.46';
      if (igSwTienda) igSwTienda.disabled = !igActivo;
      if (igSwDif) igSwDif.disabled = !igActivo;
      if (btnProbarIg) btnProbarIg.disabled = !igActivo;

      if (btnGuardar) {
        btnGuardar.disabled = !(waRes.ok && emRes.ok && igRes.ok);
      }
      if (formatearAlSalir && Math.abs(window.scrollY - prevScrollY) > 2) {
        window.scrollTo(0, prevScrollY);
      }
    }

    function probarNumeroWhatsappPerfilGestor(numeroRaw) {
      const p = parsearWhatsappArPerfil(numeroRaw);
      const numero = (p.ok && p.valor) ? p.valor : String(numeroRaw || '').replace(/\D+/g, '');
      if (!numero) {
        mostrarAvisoPantallaGestor('Número de WhatsApp inválido para probar.', 'error');
        return;
      }
      const marca = GSTATE.nodo?.nombre_marca || 'mi tienda';
      const txt = `Hola! Prueba de enlace de WhatsApp de atención para ${marca}.`;
      window.open(`https://wa.me/${numero}?text=${encodeURIComponent(txt)}`, '_blank', 'noopener');
    }

    function probarWhatsappPerfilGestor() {
      const waInp = document.getElementById('perfil-wa-input');
      const waRes = parsearWhatsappArPerfil(waInp?.value || '');
      if (!waRes.vacio && waRes.ok) {
        return probarNumeroWhatsappPerfilGestor(waRes.valor);
      }
      if (_perfilWaDraft.modo === 'ADICIONAL' && _perfilWaDraft.activoNumero) {
        return probarNumeroWhatsappPerfilGestor(_perfilWaDraft.activoNumero);
      }
      return probarNumeroWhatsappPerfilGestor(GSTATE.nodo?.gestor_telefono || '');
    }

    function probarInstagramPerfilGestor() {
      const igInp = document.getElementById('perfil-ig-input');
      const igRes = parsearInstagramPerfil(igInp?.value || '');
      if (!igRes.ok || !igRes.url) {
        mostrarAvisoPantallaGestor('Ingresá primero un usuario de Instagram válido.', 'error');
        return;
      }
      window.open(igRes.url, '_blank', 'noopener');
    }

    async function guardarPerfilContactoGestor() {
      actualizarEstadoFormularioPerfilGestor(true);
      const waInp = document.getElementById('perfil-wa-input');
      const etqInp = document.getElementById('perfil-wa-etiqueta-input');
      const waRes = parsearWhatsappArPerfil(waInp?.value || '');
      const emRes = parsearEmailPerfil(document.getElementById('perfil-email-input')?.value || '');
      const igRes = parsearInstagramPerfil(document.getElementById('perfil-ig-input')?.value || '');
      const nombreContactoVal = String(document.getElementById('perfil-nombre-contacto-input')?.value || '').trim().slice(0, 80);
      const fb = document.getElementById('perfil-guardar-feedback');
      const btn = document.getElementById('btn-guardar-perfil-gestor');

      const mostrarFb = (msg, esError = false) => {
        if (!fb) return;
        fb.style.display = 'block';
        fb.style.background = esError ? '#fef2f2' : '#f0fdf4';
        fb.style.border = esError ? '1px solid #fecaca' : '1px solid #86efac';
        fb.style.color = esError ? '#991b1b' : '#166534';
        fb.textContent = msg;
      };

      if (!waRes.ok) return mostrarFb(waRes.error, true);
      if (!emRes.ok) return mostrarFb(emRes.error, true);
      if (!igRes.ok) return mostrarFb(igRes.error, true);

      // Anti-fricción: si el gestor tipeó un número válido y tocó Guardar directo sin tocar "+ Agregar línea", lo sumamos y activamos
      if (!waRes.vacio && waRes.ok && waRes.valor) {
        const waBaseParse = parsearWhatsappArPerfil(GSTATE.nodo?.gestor_telefono || '');
        if (waBaseParse.ok && waBaseParse.valor === waRes.valor) {
          _perfilWaDraft.modo = 'BASE';
          _perfilWaDraft.activoNumero = '';
        } else {
          const ya = (_perfilWaDraft.lineas || []).find(l => l.numero === waRes.valor);
          if (!ya && (_perfilWaDraft.lineas || []).length < 5) {
            const etq = String(etqInp?.value || '').trim().slice(0, 48) || `WhatsApp Oficial ${GSTATE.nodo?.nombre_marca || 'Tienda'}`;
            _perfilWaDraft.lineas.push({
              id: `wa_${Date.now().toString(36)}`,
              numero: waRes.valor,
              display: waRes.display,
              etiqueta: etq
            });
          }
          _perfilWaDraft.modo = 'ADICIONAL';
          _perfilWaDraft.activoNumero = waRes.valor;
        }
        if (waInp) waInp.value = '';
        if (etqInp) etqInp.value = '';
      }

      const payload = {
        config_perfil_publico: {
          nombre_contacto_tienda: nombreContactoVal,
          whatsapp_lineas: (_perfilWaDraft.lineas || []).map(l => ({
            id: l.id,
            numero: l.numero,
            etiqueta: l.etiqueta
          })),
          whatsapp_activo_modo: _perfilWaDraft.modo === 'ADICIONAL' && _perfilWaDraft.activoNumero ? 'ADICIONAL' : 'BASE',
          whatsapp_activo_numero: _perfilWaDraft.modo === 'ADICIONAL' ? _perfilWaDraft.activoNumero : '',
          mostrar_whatsapp_tienda: Boolean(document.getElementById('perfil-wa-mostrar')?.checked ?? true),
          email_tienda: emRes.valor,
          mostrar_email_tienda: Boolean(emRes.valor && document.getElementById('perfil-email-mostrar-tienda')?.checked),
          usar_email_para_lamda: Boolean(emRes.valor && (document.getElementById('perfil-email-lamda')?.checked ?? true)),
          instagram_usuario: igRes.usuario,
          mostrar_instagram_tienda: Boolean(igRes.usuario && (document.getElementById('perfil-ig-mostrar-tienda')?.checked ?? true)),
          incluir_instagram_en_difusion: Boolean(igRes.usuario && document.getElementById('perfil-ig-en-difusion')?.checked)
        }
      };

      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Guardando...';
      }
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/perfil-contacto`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarFb(data.error || `Error HTTP ${resp.status} al guardar tu perfil.`, true);
          return;
        }
        GSTATE.compartirKit = null;
        GSTATE.aficheQrDataUrl = '';
        mostrarAvisoPantallaGestor('✅ Mi Perfil y Contacto actualizado correctamente.', 'ok');
        await cargarPanelGestor();
        mostrarFb('✅ Cambios guardados y aplicados en tu tienda.');
      } catch (_) {
        mostrarFb('Error de comunicación al guardar Mi Perfil y Contacto.', true);
      } finally {
        const btnPost = document.getElementById('btn-guardar-perfil-gestor');
        if (btnPost) {
          btnPost.textContent = '💾 Guardar Mi Perfil y Contacto';
        }
        actualizarEstadoFormularioPerfilGestor(false);
      }
    }

    // -------------------------------------------------------------------------
    // 4. PEDIDOS DE VECINOS (SEGUIMIENTO EN VIVO + CONTROLES DE 1 TOQUE)
    // -------------------------------------------------------------------------
    function filtrarEstadoPagoPedidosGestor(filtro) {
      GSTATE.filtroPagoPedidos = filtro;
      renderVistaGestor();
    }

    function filtrarEstadoOperativoPedidosGestor(filtro) {
      GSTATE.filtroOperativoPedidos = filtro;
      renderVistaGestor();
    }

    function _obtenerMetaHitoGestor(p) {
      const esAnulado = String(p.estado_operativo || '').toUpperCase() === 'ANULADO';
      if (esAnulado) {
        return { texto: '🚫 Anulado', bg: '#fee2e2', fg: '#991b1b', bd: '#fecaca', pasoTxt: 'Anulado' };
      }
      const modUpper = String(p.modalidad_entrega || '').toUpperCase();
      const esPostal = esPerfilEcommerceGestor() || ['PAQUETERIA_DOMICILIO', 'PAQUETERIA_SUCURSAL', 'ENCOMIENDA'].includes(modUpper);
      const hito = Number(p.hito_tracking_actual || 1);

      if (esPostal) {
        const opLbl = p.postal_operador === 'ANDREANI' ? 'Andreani' : 'Correo Argentino';
        const guia = String(p.postal_numero_tracking || '').trim();
        const esEfvoMeta = String(p.medio_pago || '').toUpperCase() === 'EFECTIVO';
        if (hito <= 1) {
          if (p.pago_confirmado) {
            return { texto: '💳 Pago confirmado · Cola de armado', bg: '#ecfdf5', fg: '#047857', bd: '#a7f3d0' };
          }
          if (esEfvoMeta) {
            return { texto: '💵 Efectivo al entregar · En preparación', bg: '#ecfdf5', fg: '#047857', bd: '#a7f3d0' };
          }
          if (Number(p.monto_declarado_cliente || 0) > 0) {
            return { texto: '🔔 Pago informado · En verificación', bg: '#dbeafe', fg: '#1d4ed8', bd: '#93c5fd' };
          }
          return { texto: '⏳ Pedido confirmado · Pendiente de pago', bg: '#fef3c7', fg: '#92400e', bd: '#fde68a' };
        }
        if (hito === 2) {
          return { texto: '💳 Pago confirmado · En preparación', bg: '#fef3c7', fg: '#92400e', bd: '#fde68a' };
        }
        if (hito === 3) {
          return { texto: '📦 Empaquetado · Listo para correo', bg: '#e0f2fe', fg: '#0369a1', bd: '#bae6fd' };
        }
        if (hito === 4) {
          return { texto: guia ? `🚚 Despachado por ${opLbl} · #${guia}` : `🚚 Despachado por ${opLbl}`, bg: '#ede9fe', fg: '#5b21b6', bd: '#c4b5fd' };
        }
        if (hito === 5) {
          return { texto: `🛣️ En tránsito (${opLbl})`, bg: '#ede9fe', fg: '#5b21b6', bd: '#c4b5fd' };
        }
        return { texto: '✅ Entregado', bg: '#dcfce7', fg: '#14532d', bd: '#86efac' };
      }

      const esEnvio = modUpper === 'ENVIO_BARRIAL';
      const totalPasos = esEnvio ? 6 : 5;
      const marca = GSTATE.nodo?.nombre_marca || 'el punto de retiro';

      if (Boolean(p.ausente_pasa_retirar) && hito < 6) {
        return { texto: `🏡 No estaba · Pasa a retirar por ${marca}`, bg: '#fef3c7', fg: '#92400e', bd: '#fcd34d' };
      }

      if (hito <= 1) {
        return { texto: `📝 Confirmado (1/${totalPasos})`, bg: '#f1f5f9', fg: '#334155', bd: '#cbd5e1' };
      }
      if (hito === 2) {
        return { texto: `🥣 En preparación (2/${totalPasos})`, bg: '#fef3c7', fg: '#92400e', bd: '#fde68a' };
      }
      if (hito === 3) {
        return { texto: `📦 Controlado y embolsado (3/${totalPasos})`, bg: '#e0f2fe', fg: '#0369a1', bd: '#bae6fd' };
      }
      const modHito = obtenerModulosActivosGestor();
      const esMostradorHito = Boolean(modHito.mostrador_entrega_rapida);
      if (hito === 4) {
        return esEnvio
          ? { texto: `🏡 Ya en ${marca} · Listo p/ reparto (4/6)`, bg: 'var(--brand-soft)', fg: 'var(--brand-dark)', bd: 'var(--brand-border)' }
          : (esMostradorHito
              ? { texto: `🏪 Listo en mostrador (4/5)`, bg: '#dcfce7', fg: '#166534', bd: '#86efac' }
              : { texto: `🎉 Listo p/ retirar en ${marca} (4/5)`, bg: '#dcfce7', fg: '#166534', bd: '#86efac' });
      }
      if (hito === 5) {
        return { texto: `🛵 En camino al vecino (5/6)`, bg: '#ede9fe', fg: '#5b21b6', bd: '#c4b5fd' };
      }
      return {
        texto: (!esEnvio && esMostradorHito) ? `✅ Retirado en mostrador (${totalPasos}/${totalPasos})` : `✅ Entregado (${totalPasos}/${totalPasos})`,
        bg: '#dcfce7', fg: '#14532d', bd: '#86efac'
      };
    }

    function filtrarBusquedaMostradorGestor(valor) {
      GSTATE.busquedaPedidosMostrador = String(valor || '');
      const q = GSTATE.busquedaPedidosMostrador.trim().toLowerCase();
      document.querySelectorAll('[data-pedido-mostrador-card]').forEach(el => {
        const bolsa = String(el.getAttribute('data-pedido-mostrador-search') || '').toLowerCase();
        el.style.display = (!q || bolsa.includes(q)) ? '' : 'none';
      });
    }

    function renderSeccionPedidos() {
      const esEc = esPerfilEcommerceGestor();
      const mod = obtenerModulosActivosGestor();
      const esMostrador = Boolean(mod.mostrador_entrega_rapida);
      const tieneRepartoZonal = Boolean(mod.reparto_zonal || mod.hoja_de_ruta);
      const esCamionetaLamda = mod.abastecimiento_modo === 'camioneta_lamda';
      const todos = (GSTATE.pedidos || []).filter(p => String(p.estado_operativo || '').toUpperCase() !== 'ANULADO');
      const anulados = (GSTATE.pedidos || []).filter(p => String(p.estado_operativo || '').toUpperCase() === 'ANULADO');

      // Detectar lotes controlados en Verificación (Hito 3) pendientes de recepción de 1 toque (nodos con canasto consolidado)
      const mapaLotes = new Map();
      if (!esEc && mod.canasto_consolidado) {
        for (const p of todos) {
          const cid = Number(p.lote_canasto_id || 0);
          if (!cid) continue;
          if (!mapaLotes.has(cid)) {
            mapaLotes.set(cid, {
              canasto_id: cid,
              codigo_canasto: p.lote_codigo_canasto || `Lote #${cid}`,
              debito_registrado: Boolean(p.lote_debito_registrado),
              estado_canasto: p.lote_estado_canasto || '',
              pedidos: []
            });
          }
          mapaLotes.get(cid).pedidos.push(p);
        }
      }

      const lotesListosParaRecibir = [];
      const lotesEnPreparacion = [];
      for (const lote of mapaLotes.values()) {
        if (lote.debito_registrado || lote.estado_canasto === 'ENTREGADO_AL_GESTOR') continue;
        const todosControlados = lote.pedidos.length > 0 && lote.pedidos.every(x => Number(x.hito_tracking_actual || 1) >= 3);
        const algunoSinRecibir = lote.pedidos.some(x => Number(x.hito_tracking_actual || 1) < 4);
        if (todosControlados && algunoSinRecibir) {
          lotesListosParaRecibir.push(lote);
        } else if (algunoSinRecibir) {
          lotesEnPreparacion.push(lote);
        }
      }

      const cantPrep = todos.filter(p => Number(p.hito_tracking_actual || 1) <= 3).length;
      const cantEnNodo = todos.filter(p => Number(p.hito_tracking_actual || 1) === 4).length;
      const cantReparto = todos.filter(p => Number(p.hito_tracking_actual || 1) === 5).length;
      const cantDespachados = todos.filter(p => [4, 5].includes(Number(p.hito_tracking_actual || 1))).length;
      const cantEntregados = todos.filter(p => Number(p.hito_tracking_actual || 1) >= 6).length;

      const pagados = todos.filter(p => Boolean(p.pago_confirmado));
      const pendientes = todos.filter(p => !p.pago_confirmado);
      const reclamadosSec = todos.filter(p => !p.pago_confirmado && Boolean(p.reclamo_pago_no_recibido));
      const informadosSec = todos.filter(p => !p.pago_confirmado && !p.reclamo_pago_no_recibido && Number(p.monto_declarado_cliente || 0) > 0);
      const pendientesSinAvisoSec = todos.filter(p =>
        !p.pago_confirmado &&
        !p.reclamo_pago_no_recibido &&
        Number(p.monto_declarado_cliente || 0) <= 0 &&
        String(p.medio_pago || 'TRANSFERENCIA').toUpperCase() !== 'EFECTIVO'
      );

      const basePorCobro = GSTATE.filtroPagoPedidos === 'PAGADOS'
        ? pagados
        : GSTATE.filtroPagoPedidos === 'PENDIENTES'
          ? pendientes
          : (GSTATE.filtroOperativoPedidos === 'ANULADOS' ? anulados : todos);

      const listaFiltrada = basePorCobro.filter(p => {
        const fOp = GSTATE.filtroOperativoPedidos || 'TODOS';
        if (fOp === 'TODOS' || fOp === 'ANULADOS') return true;
        const h = Number(p.hito_tracking_actual || 1);
        if (fOp === 'PREP') return h <= 3;
        if (fOp === 'DESPACHADOS') return h === 4 || h === 5;
        if (fOp === 'EN_NODO') return h === 4;
        if (fOp === 'REPARTO') return h === 5;
        if (fOp === 'ENTREGADOS') return h >= 6;
        return true;
      });

      const bannersRecepcionHtml = lotesListosParaRecibir.map(l => `
        <div class="card" style="background:linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 100%); border:1.5px solid #4ade80; margin-bottom:14px;">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;">
            <div style="flex:1; min-width:220px;">
              <div style="font-size:0.86rem; font-weight:900; color:#15803d; text-transform:uppercase; letter-spacing:0.03em;">
                ${esCamionetaLamda ? `🚐 Lote listo / en camino al local · ${esc(GSTATE.nodo?.nombre_marca || 'Local')}` : `📦 Lote controlado · Listo para recibir en ${esc(GSTATE.nodo?.nombre_marca || 'tu punto de retiro')}`}
              </div>
              <div style="font-size:1.15rem; font-weight:900; color:#14532d; margin-top:4px;">
                ${esc(l.codigo_canasto)} (${l.pedidos.length} ${l.pedidos.length === 1 ? (esMostrador ? 'paquete de cliente' : 'bolsa de vecino') : (esMostrador ? 'paquetes de clientes' : 'bolsas de vecinos')})
              </div>
              <div style="font-size:0.94rem; color:#166534; font-weight:600; margin-top:4px; line-height:1.4;">
                ${esMostrador
                  ? 'Al confirmar la recepción (o cuando el reparto entrega el lote), cada cliente verá en vivo que su pedido está listo para retirar en mostrador.'
                  : 'Al confirmar la recepción, los vecinos verán en vivo que su pedido ya llegó al barrio y podrás marcar salidas a reparto o entregas en 1 toque.'}
              </div>
            </div>
            <button type="button" id="btn-recibir-lote-${l.canasto_id}" onclick="confirmarRecepcionLoteGestor(${l.canasto_id})"
              style="min-height:40px; padding:8px 15px; border-radius:10px; border:none; background:#16a34a; color:#ffffff; font-family:inherit; font-weight:900; font-size:0.9rem; cursor:pointer; box-shadow:0 4px 12px rgba(22,163,74,0.2);">
              📥 Confirmar que recibí el lote (${l.pedidos.length})
            </button>
          </div>
        </div>
      `).join('');

      const bannersPrepHtml = lotesEnPreparacion.map(l => {
        const listos = l.pedidos.filter(x => Number(x.hito_tracking_actual || 1) >= 3).length;
        return `
          <div style="background:#fffbeb; border:1px solid #fcd34d; border-radius:11px; padding:10px 12px; margin-bottom:10px; font-size:0.86rem; color:#92400e; font-weight:700; line-height:1.35;">
            🥣 <strong>${esc(l.codigo_canasto)} en preparación:</strong> ${listos} de ${l.pedidos.length} bolsas controladas y embolsadas. Cuando el lote esté completo vas a poder confirmar su recepción acá.
          </div>
        `;
      }).join('');

      const alertaReclamoSecHtml = reclamadosSec.length === 0 ? '' : `
        <div style="background:#fef2f2; border:2px solid #ef4444; border-radius:13px; padding:12px 14px; margin-bottom:12px;">
          <div style="font-size:0.82rem; font-weight:900; color:#b91c1c; text-transform:uppercase; margin-bottom:6px;">
            🚨 Transferencias no recibidas en Banco Galicia · Solicitar comprobante (${reclamadosSec.length})
          </div>
          <div style="display:flex; flex-direction:column; gap:7px;">
            ${reclamadosSec.map(rp => `
              <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; background:#ffffff; border:1px solid #fecaca; border-radius:10px; padding:8px 11px; font-size:0.83rem;">
                <div>
                  <strong>#${esc(rp.codigo_pedido)} · ${esc(rp.vecino_nombre)}</strong> (${fmt(rp.total_vecino)})
                  ${Number(rp.monto_declarado_cliente || 0) > 0 ? `<span style="color:#991b1b;"> · Informó ${fmt(rp.monto_declarado_cliente)}</span>` : ''}
                </div>
                <button type="button" onclick="pedirComprobantePagoWhatsAppGestor(${rp.id})"
                  style="padding:7px 12px; border-radius:9px; border:none; background:#dc2626; color:#ffffff; font-family:inherit; font-weight:900; font-size:0.8rem; cursor:pointer;">
                  💬 Pedir comprobante por WhatsApp
                </button>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      const alertaInformadosSecHtml = informadosSec.length === 0 ? '' : `
        <div style="background:#fffbeb; border:1.5px solid #fcd34d; border-radius:11px; padding:9px 12px; margin-bottom:10px; font-size:0.84rem; color:#92400e; font-weight:800;">
          🔔 <strong>${informadosSec.length} ${informadosSec.length === 1 ? 'pedido con pago informado' : 'pedidos con pago informado'}:</strong> pasan automáticamente a preparación apenas se acredite el pago en Banco Galicia.
        </div>
      `;

      const alertaConfirmadosPendientesHtml = pendientesSinAvisoSec.length === 0 ? '' : `
        <div data-testid="banner-pedidos-pendientes-pago-gestor" style="background:#f8fafc; border:1.5px solid #93c5fd; border-radius:11px; padding:9px 12px; margin-bottom:10px; font-size:0.84rem; color:#1e3a8a; font-weight:800;">
          ⏳ <strong>${pendientesSinAvisoSec.length} ${pendientesSinAvisoSec.length === 1 ? 'pedido confirmado · Pendiente de pago' : 'pedidos confirmados · Pendientes de pago'}:</strong> ya figuran registrados en tu tienda y pasarán a armado al acreditarse la transferencia.
        </div>
      `;

      const accesoRapidoRepartoHtml = (!esEc && mod.hoja_de_ruta) ? `
        <div style="display:flex; justify-content:flex-end; margin-bottom:10px;">
          <button type="button" class="btn-soft" onclick="abrirSeccionGestor('reparto')" style="border-color:var(--brand-border); color:var(--brand-dark);">
            🚗 Modo Reparto / Hoja de ruta →
          </button>
        </div>
      ` : '';

      return `
        ${accesoRapidoRepartoHtml}
        ${alertaReclamoSecHtml}
        ${alertaInformadosSecHtml}
        ${alertaConfirmadosPendientesHtml}
        ${bannersRecepcionHtml}
        ${bannersPrepHtml}

        <div class="card">
          ${esMostrador ? `
            <div style="margin-bottom:12px;">
              <input type="search" id="input-busqueda-mostrador" data-testid="input-busqueda-mostrador"
                class="input-sm"
                style="width:100%; font-size:0.95rem; font-weight:700; padding:10px 14px; border:1.5px solid var(--brand-border); background:#ffffff;"
                placeholder="🔎 Buscar cliente por apellido, nombre o #NB-..."
                value="${esc(GSTATE.busquedaPedidosMostrador || '')}"
                oninput="filtrarBusquedaMostradorGestor(this.value)" />
            </div>
          ` : ''}

          <!-- Filtros por etapa operativa -->
          <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;">
            <button type="button" class="btn-soft" onclick="filtrarEstadoOperativoPedidosGestor('TODOS')"
              style="min-height:36px; font-size:0.82rem; padding:6px 10px; ${GSTATE.filtroOperativoPedidos === 'TODOS' ? 'background:var(--brand); color:#fff; border-color:var(--brand);' : ''}">
              Todos (${todos.length})
            </button>
            <button type="button" class="btn-soft" onclick="filtrarEstadoOperativoPedidosGestor('PREP')"
              style="min-height:36px; font-size:0.82rem; padding:6px 10px; ${GSTATE.filtroOperativoPedidos === 'PREP' ? 'background:var(--brand); color:#fff; border-color:var(--brand);' : ''}">
              ${esEc ? `📦 En preparación (${cantPrep})` : `🥣 Prep./Control (${cantPrep})`}
            </button>
            ${esEc ? `
              <button type="button" class="btn-soft" onclick="filtrarEstadoOperativoPedidosGestor('DESPACHADOS')"
                style="min-height:36px; font-size:0.82rem; padding:6px 10px; ${GSTATE.filtroOperativoPedidos === 'DESPACHADOS' ? 'background:var(--brand); color:#fff; border-color:var(--brand);' : ''}">
                🚚 Despachados (${cantDespachados})
              </button>
            ` : `
              <button type="button" class="btn-soft" onclick="filtrarEstadoOperativoPedidosGestor('EN_NODO')"
                style="min-height:36px; font-size:0.82rem; padding:6px 10px; ${GSTATE.filtroOperativoPedidos === 'EN_NODO' ? 'background:var(--brand); color:#fff; border-color:var(--brand);' : ''}">
                ${esMostrador ? `🏪 En mostrador / Listos para retirar (${cantEnNodo})` : `🏡 En punto de retiro (${cantEnNodo})`}
              </button>
              ${tieneRepartoZonal ? `
                <button type="button" class="btn-soft" onclick="filtrarEstadoOperativoPedidosGestor('REPARTO')"
                  style="min-height:36px; font-size:0.82rem; padding:6px 10px; ${GSTATE.filtroOperativoPedidos === 'REPARTO' ? 'background:var(--brand); color:#fff; border-color:var(--brand);' : ''}">
                  🛵 En camino (${cantReparto})
                </button>
              ` : ''}
            `}
            <button type="button" class="btn-soft" onclick="filtrarEstadoOperativoPedidosGestor('ENTREGADOS')"
              style="min-height:36px; font-size:0.82rem; padding:6px 10px; ${GSTATE.filtroOperativoPedidos === 'ENTREGADOS' ? 'background:var(--brand); color:#fff; border-color:var(--brand);' : ''}">
              ✅ ${esMostrador ? 'Retirados' : 'Entregados'} (${cantEntregados})
            </button>
          </div>

          <!-- Filtros rápidos de cobro -->
          <div style="display:flex; gap:6px; flex-wrap:wrap; padding-bottom:10px; margin-bottom:12px; border-bottom:1px solid var(--border);">
            <button type="button" class="btn-soft" onclick="filtrarEstadoPagoPedidosGestor('TODOS')"
              style="min-height:36px; font-size:0.82rem; padding:5px 10px; ${GSTATE.filtroPagoPedidos === 'TODOS' ? 'background:#25130b; color:#fff; border-color:#25130b;' : ''}">
              Pagos: Todos
            </button>
            <button type="button" class="btn-soft" onclick="filtrarEstadoPagoPedidosGestor('PENDIENTES')"
              style="min-height:36px; font-size:0.82rem; padding:5px 10px; ${GSTATE.filtroPagoPedidos === 'PENDIENTES' ? 'background:#25130b; color:#fff; border-color:#25130b;' : ''}">
              ⏳ ${esEc ? 'Pendientes de verificación' : 'Pendientes de cobro'} (${pendientes.length})
            </button>
            <button type="button" class="btn-soft" onclick="filtrarEstadoPagoPedidosGestor('PAGADOS')"
              style="min-height:36px; font-size:0.82rem; padding:5px 10px; ${GSTATE.filtroPagoPedidos === 'PAGADOS' ? 'background:#25130b; color:#fff; border-color:#25130b;' : ''}">
              ✅ Pagados (${pagados.length})
            </button>
          </div>

          ${listaFiltrada.length === 0 ? `
            <div style="text-align:center; padding:18px; color:var(--muted); font-size:0.9rem; font-weight:700; background:#fffdfb; border-radius:10px; border:1px dashed var(--border);">
              ${esEc ? 'No hay ventas registradas en este filtro.' : 'No hay pedidos registrados en este filtro.'}
            </div>
          ` : ''}

          <div style="display:flex; flex-direction:column; gap:10px;">
            ${listaFiltrada.map(p => {
              const pagado = Boolean(p.pago_confirmado);

    async function confirmarRecepcionLoteGestor(canastoId) {
      if (!GSTATE.nodo?.id || !canastoId) return;
      const btn = document.getElementById(`btn-recibir-lote-${canastoId}`);
      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Registrando recepción...';
      }
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/lotes/${canastoId}/confirmar-recepcion`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ actor: GSTATE.nodo.gestor_nombre || 'Referente comercial' })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo confirmar la recepción del lote: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          if (btn) {
            btn.disabled = false;
            btn.textContent = '📥 Confirmar que recibí el lote';
          }
          return;
        }
        mostrarAvisoPantallaGestor(`✅ ¡Lote ${data.codigo_canasto || ''} recibido en ${GSTATE.nodo.nombre_marca}! Tus vecinos ya ven sus bolsas disponibles en vivo.`, 'ok');
        await cargarPanelGestor();
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de comunicación al confirmar la recepción del lote.', 'error');
        if (btn) {
          btn.disabled = false;
          btn.textContent = '📥 Confirmar que recibí el lote';
        }
      }
    }

    async function avanzarEstadoEntregaGestor(pedidoId, accion, registrarCobroEfectivo = false, opciones = {}) {
      const p = (GSTATE.pedidos || []).find(x => Number(x.id) === Number(pedidoId));
      if (!p || !GSTATE.nodo?.id) return false;

      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/pedidos/${pedidoId}/estado-entrega`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            accion,
            registrar_cobro_efectivo: Boolean(registrarCobroEfectivo),
            motivo: opciones.motivo || '',
            salir_a_reparto: Boolean(opciones.salirAReparto),
            actor: GSTATE.nodo.gestor_nombre || 'Referente comercial'
          })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo actualizar el estado del pedido: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          return false;
        }

        const waInfo = data.envio_whatsapp_recibo || null;
        const msgWaAuto = waInfo?.ok
          ? ` Recibo enviado automáticamente al celular de ${p.vecino_nombre}.`
          : '';

        const msgExito = accion === 'SALIO_REPARTO'
          ? `🛵 Pedido #${p.codigo_pedido} marcado "En camino a domicilio". El comprador ya lo ve en vivo.`
          : accion === 'AUSENTE_PASA_RETIRAR'
            ? `🏡 Pedido #${p.codigo_pedido} pasado a "Ausente — Pasa por punto de retiro" (se conserva envío).`
            : accion === 'REINTEGRAR_REPARTO'
              ? `🔄 Pedido #${p.codigo_pedido} reintegrado a la Hoja de Ruta.`
              : (data.cobro_efectivo_registrado
                  ? `✅ Pedido #${p.codigo_pedido} entregado y cobrado en efectivo (${fmt(p.total_vecino)}).${msgWaAuto}`
                  : `✅ Pedido #${p.codigo_pedido} marcado como entregado a ${p.vecino_nombre}.`);
        mostrarAvisoPantallaGestor(msgExito, 'ok');

        await cargarPanelGestor();

        if (GSTATE.nocturnoAbierto) {
          const restantes = obtenerParadasRepartoActivasGestor();
          if (restantes.length === 0) {
            await apagarRadarVivoGestor(false);
            cerrarModoNocturno(true);
            mostrarAvisoPantallaGestor('🏁 ¡Completaste todas las entregas de tu Hoja de Ruta!', 'ok');
          } else {
            if (GSTATE.repartoIndice >= restantes.length) {
              GSTATE.repartoIndice = 0;
            }
            renderOverlayConduccionNocturna();
            if (GSTATE.radarActivo) {
              enviarPingRadarVivoGestor(restantes[GSTATE.repartoIndice]?.id);
            }
          }
          return true;
        }

        if (data.cobro_efectivo_registrado && !opciones.omitirRecibo) {
          abrirModalReciboVecinoGestor(pedidoId);
        }
        return true;
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de comunicación al actualizar el estado de entrega.', 'error');
        return false;
      }
    }

    async function cobrarEnEfectivoYEmitirReciboGestor(pedidoId) {
      const ped = (GSTATE.pedidos || []).find(p => Number(p.id) === Number(pedidoId));
      if (!ped) return;

      try {
        const resp = await fetchGestor(`/api/produccion/nodos/liquidacion/pedidos/${pedidoId}/conciliar-pago`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            medio_pago: 'EFECTIVO',
            comprobante_referencia: `REC-EFVO-${ped.codigo_pedido}`
          })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo registrar el cobro en efectivo: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          return;
        }
        const waInfo = data.envio_whatsapp_recibo || null;
        mostrarAvisoPantallaGestor(
          `✅ Cobro en efectivo registrado para el pedido #${ped.codigo_pedido}.${waInfo?.ok ? ' Recibo enviado al celular del cliente.' : ''}`,
          'ok'
        );
        await cargarPanelGestor();
        abrirModalReciboVecinoGestor(pedidoId);
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de comunicación al registrar el cobro en efectivo.', 'error');
      }
    }

    async function reenviarReciboWhatsAppDirectoGestor(pedidoId) {
      const p = (GSTATE.pedidos || []).find(x => Number(x.id) === Number(pedidoId));
      if (!p || !GSTATE.nodo?.id) return;
      const btn = document.getElementById(`btn-reenviar-recibo-celular-${p.id}`);
      const txtOrig = btn ? btn.textContent : '';
      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Enviando recibo con membrete...';
      }
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/pedidos/${p.id}/reenviar-recibo-whatsapp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({})
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo reenviar el recibo: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          return;
        }
        const env = data.envio_whatsapp_recibo || {};
        if (env.ok) {
          mostrarAvisoPantallaGestor(`✅ Recibo oficial de ${GSTATE.nodo.nombre_marca} enviado al celular de ${p.vecino_nombre}.`, 'ok');
          await cargarPanelGestor();
          abrirModalReciboVecinoGestor(pedidoId);
        } else {
          mostrarAvisoPantallaGestor(`⚠️ Estado de envío: ${env.error || 'Verificá el número de WhatsApp del cliente.'}`, 'error');
        }
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de comunicación al reenviar el recibo.', 'error');
      } finally {
        if (btn && btn.isConnected) {
          btn.disabled = false;
          btn.textContent = txtOrig;
        }
      }
    }

    async function enviarReciboWhatsAppVecinoGestor(pedidoId) {
      return reenviarReciboWhatsAppDirectoGestor(pedidoId);
    }

    function normalizarTextoBusquedaComprador(txt) {
      return String(txt || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .trim();
    }

    function obtenerCompradoresFiltradosGestor() {
      const lista = Array.isArray(GSTATE.compradores) ? GSTATE.compradores : [];
      const filtro = String(GSTATE.filtroCompradores || 'TODOS').toUpperCase();
      const q = normalizarTextoBusquedaComprador(GSTATE.busquedaCompradores);
      const terminos = q ? q.split(/\s+/).filter(Boolean) : [];

      return lista.filter(c => {
        if (filtro === 'ACTIVOS' && !c.tiene_pedido_en_curso) return false;
        if (filtro === 'RECURRENTES' && !c.es_recurrente) return false;
        if (terminos.length > 0) {
          const bolsa = normalizarTextoBusquedaComprador([
            c.nombre_completo,
            c.codigo_vecino,
            c.telefono_whatsapp,
            c.direccion_calle,
            c.entrecalles_referencia,
            c.localidad_habitual,
            c.provincia_habitual,

            c.notas_entrega,
            c.ultimo_pedido?.codigo_pedido,
            c.ultimo_pedido?.fecha_entrega_label
          ].filter(Boolean).join(' '));
          for (const t of terminos) {
            if (!bolsa.includes(t)) return false;
          }
        }
        return true;
      });
    }

      if (!iso) return '';

        return d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' });
      } catch (_) {
        return '';

    }

      const comp = (GSTATE.compradores || []).find(c => Number(c.vecino_id) === Number(vecinoId));
      if (!comp) return;
      let telDigits = String(comp.telefono_whatsapp || comp.telefono_normalizado || '').replace(/\D/g, '');
      if (!telDigits) {
        mostrarAvisoPantallaGestor('Este comprador no tiene número de WhatsApp registrado.', 'error');
        return;
      }
      if (!telDigits.startsWith('54')) {
        telDigits = telDigits.replace(/^0+/, '');
        if (telDigits.length > 10 && telDigits.startsWith('15')) {
          telDigits = telDigits.slice(2);
        }
        telDigits = `549${telDigits}`;

      const nombreMarca = GSTATE.nodo?.nombre_marca || 'nuestra tienda';
      const primerNombre = String(comp.nombre_completo || '').trim().split(/\s+/)[0] || '';

      const texto = `${saludo} Te escribo de *${nombreMarca}* 😊`;
      window.open(`https://wa.me/${telDigits}?text=${encodeURIComponent(texto)}`, '_blank', 'noopener');

    // =========================================================================
    // ETAPAS B4 + B5: HOJA DE RUTA, PIN DE CASA, AUSENTES Y CONDUCCIÓN NOCTURNA
    // =========================================================================
    let _nocturnoWakeLock = null;
    let _radarWatchId = null;
    let _radarHeartbeatTimer = null;
    let _radarUltPos = null;
    let _radarUltimoEnvioMs = 0;
    let _pinCasaLeafletMap = null;
    let _pinCasaLeafletMarker = null;
    let _pinCasaCoordsDraft = null;

    function _normalizarDirPuertaGestor(txt = '') {
      return String(txt || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function _resolverCoordsEfectivasPedidoGestor(p) {
      const pLat = Number(p?.latitud);
      const pLng = Number(p?.longitud);
      if (Number.isFinite(pLat) && Number.isFinite(pLng) && pLat !== 0 && pLng !== 0) {
        return { lat: pLat, lng: pLng, origen: p.gps_origen || 'PEDIDO' };
      }
      return null;
    }

    function _clavePuertaParadaGestor(p) {
      const coords = _resolverCoordsEfectivasPedidoGestor(p);
      if (coords) {
        return `${coords.lat.toFixed(4)},${coords.lng.toFixed(4)}`;
      }
      const norm = _normalizarDirPuertaGestor(p?.direccion_entrega || '');
      return norm || `ped-${p.id}`;
    }

    function _distanciaMetrosGestor(lat1, lng1, lat2, lng2) {
      const toRad = (deg) => (deg * Math.PI) / 180;
      const R = 6371000;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function agruparParadasFisicasRepartoGestor(paradas) {
      const lista = Array.isArray(paradas) ? paradas : [];
      const grupos = [];

      for (const p of lista) {
        const coords = _resolverCoordsEfectivasPedidoGestor(p);
        const normDir = _normalizarDirPuertaGestor(p?.direccion_entrega || '');
        const claveFallback = _clavePuertaParadaGestor(p);

        let grupo = grupos.find(g => {
          if (coords && g.coords) {
            return _distanciaMetrosGestor(g.coords.lat, g.coords.lng, coords.lat, coords.lng) <= 25;
          }
          if (!coords && !g.coords) {
            return (normDir && g.normDir === normDir) || g.key === claveFallback;
          }
          return false;
        });

        if (!grupo) {
          grupo = {
            key: `grp-${p.id}`,
            doorKey: claveFallback,
            normDir,
            coords: coords ? { ...coords } : null,
            pedidos: []
          };
          grupos.push(grupo);
        }
        grupo.pedidos.push(p);
      }

      return grupos.map(g => {
        const principal = g.pedidos[0];
        const nombres = [];
        for (const ped of g.pedidos) {
          const nom = String(ped.vecino_nombre || 'Vecino').trim();
          if (nom && !nombres.includes(nom)) nombres.push(nom);
        }
        const codigosLabel = g.pedidos.map(x => `#${x.codigo_pedido}`).join(' · ');
        const totalPendiente = g.pedidos
          .filter(x => !x.pago_confirmado)
          .reduce((acc, x) => acc + Number(x.total_vecino || 0), 0);
        const totalPedidos = g.pedidos.reduce((acc, x) => acc + Number(x.total_vecino || 0), 0);
        const todosPagados = g.pedidos.every(x => Boolean(x.pago_confirmado));
        const tieneManual = g.pedidos.some(x => Boolean(x.incluido_reparto_manual) && String(x.modalidad_entrega || '').toUpperCase() === 'RETIRO_NODO');
        const tieneHito3 = g.pedidos.some(x => Number(x.hito_tracking_actual || 1) === 3);
        return {
          ...g,
          direccion: principal?.direccion_entrega || 'Sin dirección especificada',
          entrecalles: principal?.entrecalles_referencia || '',
          vecinosLabel: nombres.join(' + ') || 'Vecino',
          codigosLabel,
          totalPendiente,
          totalPedidos,
          todosPagados,
          tieneManual,
          tieneHito3
        };
      });
    }

    function calcularDistanciaTotalParadasGestor(grupos) {
      const conGps = (Array.isArray(grupos) ? grupos : []).filter(g => g.coords);
      if (conGps.length === 0) return 0;
      const nLat = Number(GSTATE.nodo?.latitud);
      const nLng = Number(GSTATE.nodo?.longitud);
      const pts = (Number.isFinite(nLat) && Number.isFinite(nLng) && nLat !== 0 && nLng !== 0)
        ? [{ lat: nLat, lng: nLng }, ...conGps.map(g => g.coords)]
        : conGps.map(g => g.coords);
      let total = 0;
      for (let i = 0; i < pts.length - 1; i++) {
        total += _distanciaMetrosGestor(pts[i].lat, pts[i].lng, pts[i + 1].lat, pts[i + 1].lng);
      }
      return Math.round(total);
    }

    function esPedidoEnHojaRutaActiva(p) {
      if (!p) return false;
      const est = String(p.estado_operativo || '').toUpperCase();
      if (est === 'ANULADO') return false;
      if (Boolean(p.ausente_pasa_retirar)) return false;
      if (p.en_hoja_ruta === false) return false;
      const hito = Number(p.hito_tracking_actual || 1);
      const mod = String(p.modalidad_entrega || '').toUpperCase();
      if (mod === 'ENVIO_BARRIAL' && [4, 5].includes(hito)) return true;
      if (Boolean(p.incluido_reparto_manual) && [3, 4, 5].includes(hito)) return true;
      return false;
    }

    function obtenerParadasRepartoActivasGestor() {
      const lista = (GSTATE.pedidos || []).filter(p => esPedidoEnHojaRutaActiva(p));
      lista.sort((a, b) => {
        const oa = a.orden_reparto != null ? Number(a.orden_reparto) : 999999;
        const ob = b.orden_reparto != null ? Number(b.orden_reparto) : 999999;
        if (oa !== ob) return oa - ob;
        return Number(a.id) - Number(b.id);
      });
      return lista;
    }

    function obtenerPedidosAusentesGestor() {
      return (GSTATE.pedidos || []).filter(p =>
        String(p.estado_operativo || '').toUpperCase() !== 'ANULADO' &&
        Boolean(p.ausente_pasa_retirar) &&
        Number(p.hito_tracking_actual || 1) < 6
      );
    }

    function obtenerPedidosDisponiblesAgregarRepartoGestor() {
      return (GSTATE.pedidos || []).filter(p => {
        const est = String(p.estado_operativo || '').toUpperCase();
        if (est === 'ANULADO') return false;
        const hito = Number(p.hito_tracking_actual || 1);
        if (![3, 4, 5].includes(hito)) return false;
        if (esPedidoEnHojaRutaActiva(p)) return false;
        return true;
      }).map(p => {
        const mod = String(p.modalidad_entrega || '').toUpperCase();
        let categoria = 'ENVIO_FUERA';
        if (Boolean(p.ausente_pasa_retirar)) categoria = 'AUSENTE';
        else if (mod === 'RETIRO_NODO') categoria = 'RETIRO';
        return { ...p, _categoriaAgregar: categoria };
      });
    }

    function _sincronizarEstadoRepartoEnMemoria(data) {
      const mods = Array.isArray(data?.pedidos_modificados) ? data.pedidos_modificados : [];
      const ordenAct = Array.isArray(data?.orden_reparto_actual) ? data.orden_reparto_actual : [];
      const modMap = new Map(mods.map(m => [Number(m.id), m]));
      const ordenMap = new Map(ordenAct.map(o => [Number(o.id), o]));
      (GSTATE.pedidos || []).forEach(p => {
        const pid = Number(p.id);
        const m = modMap.get(pid);
        if (m) {
          if (m.en_hoja_ruta !== undefined) p.en_hoja_ruta = Boolean(m.en_hoja_ruta);
          if (m.incluido_reparto_manual !== undefined) p.incluido_reparto_manual = Boolean(m.incluido_reparto_manual);
          if (m.ausente_pasa_retirar !== undefined) p.ausente_pasa_retirar = Boolean(m.ausente_pasa_retirar);
          if (m.hito_tracking_actual !== undefined) p.hito_tracking_actual = Number(m.hito_tracking_actual);
          if (m.estado_operativo !== undefined) p.estado_operativo = m.estado_operativo;
          if (m.direccion_entrega !== undefined) p.direccion_entrega = m.direccion_entrega;
          if (m.entrecalles_referencia !== undefined) p.entrecalles_referencia = m.entrecalles_referencia;
          if (m.latitud != null) p.latitud = Number(m.latitud);
          if (m.longitud != null) p.longitud = Number(m.longitud);
          p.orden_reparto = m.orden_reparto != null ? Number(m.orden_reparto) : null;
        }
        const o = ordenMap.get(pid);
        if (o) {
          p.orden_reparto = o.orden_reparto != null ? Number(o.orden_reparto) : p.orden_reparto;
          if (o.en_hoja_ruta !== undefined) p.en_hoja_ruta = Boolean(o.en_hoja_ruta);
          if (o.incluido_reparto_manual !== undefined) p.incluido_reparto_manual = Boolean(o.incluido_reparto_manual);
        }
      });
      GSTATE.repartoDistanciaMetros = 0;
    }

    function renderSeccionReparto() {
      const paradas = obtenerParadasRepartoActivasGestor();

        String(p.estado_operativo || '').toUpperCase() !== 'ANULADO' &&

      // Lotes únicos en Hito 3 para atajo directo de recepción

    async function quitarPedidosDeHojaRutaGestor(pedidoIds = [], opciones = {}) {
      if (!GSTATE.nodo?.id) return;
      const ids = Array.from(new Set((Array.isArray(pedidoIds) ? pedidoIds : []).map(x => Number(x)).filter(x => x > 0)));
      if (ids.length === 0) return;

      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/reparto/seleccion`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            accion: 'QUITAR',
            pedido_ids: ids
          })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo quitar de la ruta: ' + (data.error || `HTTP ${resp.status}`), 'error');
          return;
        }

        _sincronizarEstadoRepartoEnMemoria(data);

        if (_acomodarAbierto) {
          const dropSet = new Set(ids);
          const restantesOrdenados = [];
          for (const grp of _acomodarParadasDraft) {
            for (const ped of grp.pedidos) {
              if (!dropSet.has(Number(ped.id))) {
                restantesOrdenados.push(ped);
              }
            }
          }
          _acomodarParadasDraft = agruparParadasFisicasRepartoGestor(restantesOrdenados);
          if (_acomodarParadasDraft.length === 0) {
            cerrarModalAcomodarRutaGestor();
          } else {
            if (!(_acomodarParadasDraft.some(g => g.key === _acomodarHighlightKey))) {
              _acomodarHighlightKey = _acomodarParadasDraft[0]?.key || null;
            }
            actualizarSubtituloAcomodarRuta();
            _refrescarBotonAgregarAcomodar();
            renderListaAcomodarRuta();
            dibujarMapaAcomodarRuta(true);
          }
        }

        renderVistaGestor();
        mostrarAvisoPantallaGestor(
          ids.length === 1
            ? 'Pedido bajado de esta vuelta (queda disponible en ➕ Agregar Pedidos).'
            : `${ids.length} pedidos bajados de esta vuelta (quedan en ➕ Agregar Pedidos).`,
          'ok'
        );
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de red al quitar pedido de la hoja de ruta.', 'error');
      }
    }

    async function confirmarAgregarSeleccionadosRepartoGestor(desdeAcomodar = false) {
      if (!GSTATE.nodo?.id || _agregarSeleccionIds.size === 0) return;
      const btn = document.getElementById('btn-confirmar-agregar-reparto');
      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Sumando...';
      }

      const pedidoIds = Array.from(_agregarSeleccionIds);
      const detalles = pedidoIds
        .filter(pid => _agregarDirsDraft.has(pid) && String(_agregarDirsDraft.get(pid) || '').trim() !== '')
        .map(pid => ({
          pedido_id: pid,
          direccion_entrega: String(_agregarDirsDraft.get(pid) || '').trim()
        }));

      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/reparto/seleccion`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            accion: 'AGREGAR',
            pedido_ids: pedidoIds,
            detalles
          })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudieron sumar pedidos: ' + (data.error || `HTTP ${resp.status}`), 'error');
          if (btn) { btn.disabled = false; btn.textContent = '✅ Sumar seleccionados a la ruta'; }
          return;
        }

        _sincronizarEstadoRepartoEnMemoria(data);
        cerrarModalAgregarRepartoGestor();

        if (desdeAcomodar && _acomodarAbierto) {
          // Conservar orden previo en borrador y anexar los recién sumados al final (agrupando puerta si coincide)
          const prevOrderIds = _acomodarParadasDraft.flatMap(g => g.pedidos.map(x => Number(x.id)));
          const addedSet = new Set(pedidoIds);
          const allActivas = obtenerParadasRepartoActivasGestor();
          const mapById = new Map(allActivas.map(p => [Number(p.id), p]));
          const ordenFinalLista = [];
          for (const pid of prevOrderIds) {
            if (mapById.has(pid)) {
              ordenFinalLista.push(mapById.get(pid));
              mapById.delete(pid);
            }
          }
          for (const p of allActivas) {
            if (mapById.has(Number(p.id))) {
              ordenFinalLista.push(p);
              if (addedSet.has(Number(p.id))) _acomodarHighlightKey = null;
            }
          }
          _acomodarParadasDraft = agruparParadasFisicasRepartoGestor(ordenFinalLista);
          if (!_acomodarHighlightKey) _acomodarHighlightKey = _acomodarParadasDraft[_acomodarParadasDraft.length - 1]?.key || null;
          actualizarSubtituloAcomodarRuta();
          _refrescarBotonAgregarAcomodar();
          renderListaAcomodarRuta();
          dibujarMapaAcomodarRuta(true);
        }

        renderVistaGestor();
        mostrarAvisoPantallaGestor(`✅ ${data.actualizados || pedidoIds.length} pedido(s) sumados a esta Hoja de Ruta.`, 'ok');
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de red al sumar pedidos a la ruta.', 'error');
        if (btn) { btn.disabled = false; btn.textContent = '✅ Sumar seleccionados a la ruta'; }
      }
    }

    async function sugerirOrdenOptimoRepartoGestor() {
      if (!GSTATE.nodo?.id) return;
      const paradas = obtenerParadasRepartoActivasGestor();
      if (paradas.length === 0) return;

      let origenLat = null;
      let origenLng = null;
      if (navigator.geolocation) {
        try {
          const pos = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: false, timeout: 2500, maximumAge: 60000 });
          });
          origenLat = pos.coords.latitude;
          origenLng = pos.coords.longitude;
        } catch (_) {}
      }

      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/reparto/sugerir-orden`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            origen_lat: origenLat,
            origen_lng: origenLng,
            guardar: true
          })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo calcular la ruta óptima: ' + (data.error || `HTTP ${resp.status}`), 'error');
          return;
        }
        GSTATE.repartoDistanciaMetros = Number(data.distancia_total_metros || 0);
        mostrarAvisoPantallaGestor(
          `🧭 Ruta ordenada (${data.cantidad_con_gps} con GPS${data.cantidad_sin_gps > 0 ? `, ${data.cantidad_sin_gps} sin pin al final` : ''}).`,
          'ok'
        );
        await cargarPanelGestor();
      } catch (_) {
        mostrarAvisoPantallaGestor('Error al calcular la ruta óptima.', 'error');
      }
    }

    async function moverParadaRepartoGestor(pedidoId, delta) {
      if (!GSTATE.nodo?.id) return;
      const paradas = obtenerParadasRepartoActivasGestor();
      const idx = paradas.findIndex(p => Number(p.id) === Number(pedidoId));
      const nuevoIdx = idx + Number(delta);
      if (idx < 0 || nuevoIdx < 0 || nuevoIdx >= paradas.length) return;

      const copia = paradas.slice();
      const [movido] = copia.splice(idx, 1);
      copia.splice(nuevoIdx, 0, movido);
      const ordenIds = copia.map(p => Number(p.id));

      // Actualización optimista en pantalla + guardado backend
      copia.forEach((p, i) => { p.orden_reparto = i + 1; });
      renderVistaGestor();

      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/reparto/orden`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orden_ids: ordenIds })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo guardar el orden: ' + (data.error || `HTTP ${resp.status}`), 'error');
          await cargarPanelGestor();
        }
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de red al guardar el nuevo orden.', 'error');
      }
    }

      if (!_acomodarDragCtx) return;
      try {
        window.removeEventListener('pointermove', _acomodarDragCtx.onMove);
        window.removeEventListener('pointerup', _acomodarDragCtx.onEnd);
        window.removeEventListener('pointercancel', _acomodarDragCtx.onEnd);
      } catch (_) {}
      try {
        if (_acomodarDragCtx.ghost && _acomodarDragCtx.ghost.parentNode) {
          _acomodarDragCtx.ghost.parentNode.removeChild(_acomodarDragCtx.ghost);
        }
        if (_acomodarDragCtx.rowEl) {
          _acomodarDragCtx.rowEl.classList.remove('is-drag-placeholder');
        }
      } catch (_) {}
      _acomodarDragCtx = null;

              style="min-height:30px; width:30px; border-radius:8px; border:1px solid #475569; background:#1e293b; color:#ffffff; font-weight:900; font-size:0.92rem; cursor:pointer;">
              ✕
            </button>
          </div>
        </div>

        <div id="acomodar-map-wrap" class="acomodar-map-wrap">
          <div id="acomodar-leaflet-map" class="acomodar-map-canvas"></div>
        </div>

        <div id="acomodar-tocar-banner" class="acomodar-map-banner" style="display:none;"></div>

        <div class="acomodar-toolbar">
          <button type="button" id="btn-acomodar-vuelta-corta" class="acomodar-tool-chip" onclick="sugerirVueltaCortaEnAcomodarGestor()"
            style="border-color:#0284c7; background:#e0f2fe; color:#0369a1;">
            ⚡ Vuelta corta
          </button>
          <button type="button" id="btn-acomodar-tocar-orden" class="acomodar-tool-chip" onclick="toggleModoTocarOrdenAcomodar()">
            👆 Tocar pines
          </button>
          <button type="button" id="btn-acomodar-agregar" class="acomodar-tool-chip" onclick="abrirModalAgregarRepartoGestor(true)">
            ➕ Agregar
          </button>

        <div id="acomodar-pin-inline-bar" class="acomodar-pin-inline-bar" style="display:none;"></div>

        <div class="acomodar-footer">
          <button type="button" id="btn-confirmar-acomodar-ruta" onclick="confirmarOrdenDesdeAcomodarGestor()"
            style="width:100%; min-height:42px; border-radius:10px; border:none; background:#16a34a; color:#ffffff; font-family:inherit; font-weight:900; font-size:0.94rem; cursor:pointer; box-shadow:0 4px 12px rgba(22,163,74,0.24);">
            ✅ Confirmar Orden
