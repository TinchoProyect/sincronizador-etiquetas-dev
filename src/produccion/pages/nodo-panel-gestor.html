            <div style="display:flex; flex-direction:column; gap:10px; justify-content:center; padding-top:6px;">
              <label class="switch-label">
                <input type="checkbox" id="cfg-permitir-envio" ${GSTATE.nodo.permitir_envio_barrial ? 'checked' : ''} />
                Habilitar envío a domicilio en el barrio
              </label>
              <label class="switch-label">
                <input type="checkbox" id="cfg-mostrar-ingredientes" ${GSTATE.nodo.mostrar_ingredientes_tienda !== false ? 'checked' : ''} />
                Mostrar botón "¿Qué contiene?" (ingredientes) en mi tienda
              </label>
            </div>
          </div>

          <button type="button" class="btn-primary" onclick="guardarConfigLogisticaGestor()">
            Guardar Configuración
          </button>
        </div>
      `;
    }

    function leerVentanasDesdeDom() {
      const rows = Array.from(document.querySelectorAll('.ventana-item-row'));
      return rows.map(r => ({
        dia_entrega: r.querySelector('.v-dia-entrega').value,
        cierre_dia: r.querySelector('.v-cierre-dia').value,
        cierre_hora: r.querySelector('.v-cierre-hora').value || '14:00',
        ventana_retiro: r.querySelector('.v-ventana-retiro').value || '17:00 a 20:00 hs'
      }));
    }

    function agregarVentanaRow() {
      const actual = leerVentanasDesdeDom();
      actual.push({ dia_entrega: 'Sábado', cierre_dia: 'Viernes', cierre_hora: '14:00', ventana_retiro: '10:00 a 13:30 hs' });
      GSTATE.nodo.config_ventanas_corte = actual;
      renderVistaGestor();
    }

    function eliminarVentanaRow(idx) {
      const actual = leerVentanasDesdeDom();
      if (actual.length <= 1) {
        mostrarAvisoPantallaGestor('Debe quedar al menos un día de entrega configurado.', 'error');
        return;
      }
      actual.splice(idx, 1);
      GSTATE.nodo.config_ventanas_corte = actual;
      renderVistaGestor();
    }

    async function guardarConfigLogisticaGestor() {
      const payload = {
        config_ventanas_corte: leerVentanasDesdeDom(),
        direccion_retiro: document.getElementById('cfg-direccion-retiro').value.trim(),
        cargo_envio_barrial: Number(document.getElementById('cfg-cargo-envio').value || 0),
        permitir_envio_barrial: Boolean(document.getElementById('cfg-permitir-envio').checked),
        mostrar_ingredientes_tienda: Boolean(document.getElementById('cfg-mostrar-ingredientes')?.checked ?? true)
      };

      try {
        const resp = await fetch(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/config-logistica`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo guardar la configuración: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          return;
        }
        mostrarAvisoPantallaGestor('✅ Días de entrega, corte y envío barrial actualizados.', 'ok');
        await cargarPanelGestor();
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de comunicación al guardar la configuración logística.', 'error');
      }
    }

    // -------------------------------------------------------------------------
    // 4. PEDIDOS DE VECINOS (SEGUIMIENTO EN VIVO + CONTROLES DE 1 TOQUE)
    // -------------------------------------------------------------------------
    function filtrarEstadoPagoPedidosGestor(filtro) {
      GSTATE.filtroPagoPedidos = filtro;
      renderVistaGestor();
    }

    function filtrarEstadoOperativoPedidosGestor(filtro) {
      GSTATE.filtroOperativoPedidos = filtro;
      renderVistaGestor();
    }

    function _obtenerMetaHitoGestor(p) {
      const esAnulado = String(p.estado_operativo || '').toUpperCase() === 'ANULADO';
      if (esAnulado) {
        return { texto: '🚫 Anulado', bg: '#fee2e2', fg: '#991b1b', bd: '#fecaca', pasoTxt: 'Anulado' };
      }
      const esEnvio = String(p.modalidad_entrega || '').toUpperCase() === 'ENVIO_BARRIAL';
      const totalPasos = esEnvio ? 6 : 5;
      const hito = Number(p.hito_tracking_actual || 1);
      const marca = GSTATE.nodo?.nombre_marca || 'el Nodo';

      if (hito <= 1) {
        return { texto: `📝 Confirmado (1/${totalPasos})`, bg: '#f1f5f9', fg: '#334155', bd: '#cbd5e1' };
      }
      if (hito === 2) {
        return { texto: `🥣 En preparación (2/${totalPasos})`, bg: '#fef3c7', fg: '#92400e', bd: '#fde68a' };
      }
      if (hito === 3) {
        return { texto: `📦 Controlado y embolsado (3/${totalPasos})`, bg: '#e0f2fe', fg: '#0369a1', bd: '#bae6fd' };
      }
      if (hito === 4) {
        return esEnvio
          ? { texto: `🏡 Ya en ${marca} · Listo p/ reparto (4/6)`, bg: 'var(--brand-soft)', fg: 'var(--brand-dark)', bd: 'var(--brand-border)' }
          : { texto: `🎉 Listo p/ retirar en ${marca} (4/5)`, bg: '#dcfce7', fg: '#166534', bd: '#86efac' };
      }
      if (hito === 5) {
        return { texto: `🛵 En camino al vecino (5/6)`, bg: '#ede9fe', fg: '#5b21b6', bd: '#c4b5fd' };
      }
      return { texto: `✅ Entregado (${totalPasos}/${totalPasos})`, bg: '#dcfce7', fg: '#14532d', bd: '#86efac' };
    }

    function renderSeccionPedidos() {
      const todos = (GSTATE.pedidos || []).filter(p => String(p.estado_operativo || '').toUpperCase() !== 'ANULADO');
      const anulados = (GSTATE.pedidos || []).filter(p => String(p.estado_operativo || '').toUpperCase() === 'ANULADO');

      // Detectar lotes controlados en Verificación (Hito 3) pendientes de recepción de 1 toque en el Nodo
      const mapaLotes = new Map();
      for (const p of todos) {
        const cid = Number(p.lote_canasto_id || 0);
        if (!cid) continue;
        if (!mapaLotes.has(cid)) {
          mapaLotes.set(cid, {
            canasto_id: cid,
            codigo_canasto: p.lote_codigo_canasto || `Lote #${cid}`,
            debito_registrado: Boolean(p.lote_debito_registrado),
            estado_canasto: p.lote_estado_canasto || '',
            pedidos: []
          });
        }
        mapaLotes.get(cid).pedidos.push(p);
      }

      const lotesListosParaRecibir = [];
      const lotesEnPreparacion = [];
      for (const lote of mapaLotes.values()) {
        if (lote.debito_registrado || lote.estado_canasto === 'ENTREGADO_AL_GESTOR') continue;
        const todosControlados = lote.pedidos.length > 0 && lote.pedidos.every(x => Number(x.hito_tracking_actual || 1) >= 3);
        const algunoSinRecibir = lote.pedidos.some(x => Number(x.hito_tracking_actual || 1) < 4);
        if (todosControlados && algunoSinRecibir) {
          lotesListosParaRecibir.push(lote);
        } else if (algunoSinRecibir) {
          lotesEnPreparacion.push(lote);
        }
      }

      const cantPrep = todos.filter(p => Number(p.hito_tracking_actual || 1) <= 3).length;
      const cantEnNodo = todos.filter(p => Number(p.hito_tracking_actual || 1) === 4).length;
      const cantReparto = todos.filter(p => Number(p.hito_tracking_actual || 1) === 5).length;
      const cantEntregados = todos.filter(p => Number(p.hito_tracking_actual || 1) >= 6).length;

      const pagados = todos.filter(p => Boolean(p.pago_confirmado));
      const pendientes = todos.filter(p => !p.pago_confirmado);

      const basePorCobro = GSTATE.filtroPagoPedidos === 'PAGADOS'
        ? pagados
        : GSTATE.filtroPagoPedidos === 'PENDIENTES'
          ? pendientes
          : (GSTATE.filtroOperativoPedidos === 'ANULADOS' ? anulados : todos);

      const listaFiltrada = basePorCobro.filter(p => {
        const fOp = GSTATE.filtroOperativoPedidos || 'TODOS';
        if (fOp === 'TODOS' || fOp === 'ANULADOS') return true;
        const h = Number(p.hito_tracking_actual || 1);
        if (fOp === 'PREP') return h <= 3;
        if (fOp === 'EN_NODO') return h === 4;
        if (fOp === 'REPARTO') return h === 5;
        if (fOp === 'ENTREGADOS') return h >= 6;
        return true;
      });

      const bannersRecepcionHtml = lotesListosParaRecibir.map(l => `
        <div class="card" style="background:linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 100%); border:1.5px solid #4ade80; margin-bottom:14px;">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
            <div style="flex:1; min-width:220px;">
              <div style="font-size:0.74rem; font-weight:900; color:#15803d; text-transform:uppercase; letter-spacing:0.03em;">
                📦 Lote controlado · Listo para recibir en ${esc(GSTATE.nodo?.nombre_marca || 'tu Nodo')}
              </div>
              <div style="font-size:1.05rem; font-weight:900; color:#14532d; margin-top:3px;">
                ${esc(l.codigo_canasto)} (${l.pedidos.length} ${l.pedidos.length === 1 ? 'bolsa de vecino' : 'bolsas de vecinos'})
              </div>
              <div style="font-size:0.8rem; color:#166534; margin-top:3px;">
                Al confirmar la recepción, los vecinos verán en vivo que su pedido ya llegó al barrio y podrás marcar salidas a reparto o entregas en 1 toque.
              </div>
            </div>
            <button type="button" id="btn-recibir-lote-${l.canasto_id}" onclick="confirmarRecepcionLoteGestor(${l.canasto_id})"
              style="padding:12px 18px; border-radius:12px; border:none; background:#16a34a; color:#ffffff; font-family:inherit; font-weight:900; font-size:0.9rem; cursor:pointer; box-shadow:0 6px 16px rgba(22,163,74,0.24);">
              📥 Confirmar que recibí el lote (${l.pedidos.length})
            </button>
          </div>
        </div>
      `).join('');

      const bannersPrepHtml = lotesEnPreparacion.map(l => {
        const listos = l.pedidos.filter(x => Number(x.hito_tracking_actual || 1) >= 3).length;
        return `
          <div style="background:#fffbeb; border:1px solid #fde68a; border-radius:12px; padding:10px 14px; margin-bottom:12px; font-size:0.8rem; color:#92400e; font-weight:700;">
            🥣 <strong>${esc(l.codigo_canasto)} en preparación:</strong> ${listos} de ${l.pedidos.length} bolsas controladas y embolsadas. Cuando el lote esté completo vas a poder confirmar su recepción acá.
          </div>
        `;
      }).join('');

      return `
        ${bannersRecepcionHtml}
        ${bannersPrepHtml}

        <div class="card">
          <!-- Filtros por etapa operativa -->
          <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;">
            <button type="button" class="btn-soft" onclick="filtrarEstadoOperativoPedidosGestor('TODOS')"
              style="font-size:0.76rem; padding:6px 11px; ${GSTATE.filtroOperativoPedidos === 'TODOS' ? 'background:var(--brand); color:#fff; border-color:var(--brand);' : ''}">
              Todos (${todos.length})
            </button>
            <button type="button" class="btn-soft" onclick="filtrarEstadoOperativoPedidosGestor('PREP')"
              style="font-size:0.76rem; padding:6px 11px; ${GSTATE.filtroOperativoPedidos === 'PREP' ? 'background:var(--brand); color:#fff; border-color:var(--brand);' : ''}">
              🥣 Prep./Control (${cantPrep})
            </button>
            <button type="button" class="btn-soft" onclick="filtrarEstadoOperativoPedidosGestor('EN_NODO')"
              style="font-size:0.76rem; padding:6px 11px; ${GSTATE.filtroOperativoPedidos === 'EN_NODO' ? 'background:var(--brand); color:#fff; border-color:var(--brand);' : ''}">
              🏡 En el Nodo (${cantEnNodo})
            </button>
            <button type="button" class="btn-soft" onclick="filtrarEstadoOperativoPedidosGestor('REPARTO')"
              style="font-size:0.76rem; padding:6px 11px; ${GSTATE.filtroOperativoPedidos === 'REPARTO' ? 'background:var(--brand); color:#fff; border-color:var(--brand);' : ''}">
              🛵 En camino (${cantReparto})
            </button>
            <button type="button" class="btn-soft" onclick="filtrarEstadoOperativoPedidosGestor('ENTREGADOS')"
              style="font-size:0.76rem; padding:6px 11px; ${GSTATE.filtroOperativoPedidos === 'ENTREGADOS' ? 'background:var(--brand); color:#fff; border-color:var(--brand);' : ''}">
              ✅ Entregados (${cantEntregados})
            </button>
          </div>

          <!-- Filtros rápidos de cobro -->
          <div style="display:flex; gap:6px; flex-wrap:wrap; padding-bottom:12px; margin-bottom:14px; border-bottom:1px solid var(--border);">
            <button type="button" class="btn-soft" onclick="filtrarEstadoPagoPedidosGestor('TODOS')"
              style="font-size:0.74rem; padding:5px 10px; ${GSTATE.filtroPagoPedidos === 'TODOS' ? 'background:#3e2519; color:#fff; border-color:#3e2519;' : ''}">
              Cobros: Todos
            </button>
            <button type="button" class="btn-soft" onclick="filtrarEstadoPagoPedidosGestor('PENDIENTES')"
              style="font-size:0.74rem; padding:5px 10px; ${GSTATE.filtroPagoPedidos === 'PENDIENTES' ? 'background:#3e2519; color:#fff; border-color:#3e2519;' : ''}">
              💵 Pendientes de cobro (${pendientes.length})
            </button>
            <button type="button" class="btn-soft" onclick="filtrarEstadoPagoPedidosGestor('PAGADOS')"
              style="font-size:0.74rem; padding:5px 10px; ${GSTATE.filtroPagoPedidos === 'PAGADOS' ? 'background:#3e2519; color:#fff; border-color:#3e2519;' : ''}">
              ✅ Pagados (${pagados.length})
            </button>
          </div>

          ${listaFiltrada.length === 0 ? `
            <div style="text-align:center; padding:24px; color:var(--muted); font-size:0.88rem; background:#fffdfb; border-radius:12px; border:1px dashed var(--border);">
              No hay pedidos registrados en este filtro.
            </div>
          ` : ''}

          <div style="display:flex; flex-direction:column; gap:12px;">
            ${listaFiltrada.map(p => {
              const pagado = Boolean(p.pago_confirmado);
              const esEfvo = String(p.medio_pago || '').toUpperCase() === 'EFECTIVO' || String(p.estado_pago || '').toUpperCase() === 'COBRADO_EFECTIVO_GESTOR';
              const esEnvio = String(p.modalidad_entrega || '').toUpperCase() === 'ENVIO_BARRIAL';
              const hito = Number(p.hito_tracking_actual || 1);
              const metaHito = _obtenerMetaHitoGestor(p);
              const urlSeg = obtenerUrlSeguimientoPedidoGestor(p);
              const puedeSalirReparto = esEnvio && hito === 4;
              const puedeMarcarEntregado = hito === 4 || hito === 5;

              return `
                <div style="border:1.5px solid ${hito >= 6 ? 'rgba(22,163,74,0.4)' : (pagado ? 'rgba(47,111,78,0.35)' : 'var(--border)')}; border-radius:14px; padding:14px; background:#fffdfb;">
                  <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px; margin-bottom:8px;">
                    <div>
                      <div style="display:flex; align-items:center; gap:7px; flex-wrap:wrap;">
                        <span style="font-weight:900; font-size:0.96rem;">#${esc(p.codigo_pedido)} · ${esc(p.vecino_nombre)}</span>
                        <span style="display:inline-block; padding:3px 9px; border-radius:999px; font-size:0.72rem; font-weight:800; background:${metaHito.bg}; color:${metaHito.fg}; border:1px solid ${metaHito.bd};">
                          ${esc(metaHito.texto)}
                        </span>
                      </div>
                      <div style="font-size:0.78rem; color:var(--muted); margin-top:4px;">
                        ${esc(p.fecha_entrega_label)} · ${esEnvio ? `🛵 Envío: ${esc(p.direccion_entrega)}${p.entrecalles_referencia ? ` (${esc(p.entrecalles_referencia)})` : ''}` : '🏠 Retira en Nodo'}
                      </div>
                    </div>
                    <div style="text-align:right;">
                      <div style="font-weight:900; font-size:1.02rem;">${fmt(p.total_vecino)}</div>
                      <span style="font-size:0.72rem; font-weight:800; color:${pagado ? 'var(--ok)' : 'var(--warn)'};">
                        ${pagado ? (esEfvo ? '✅ Pagado en efectivo' : '✅ Transferencia acreditada') : (esEfvo ? '💵 Cobra efectivo en entrega' : '🏦 Pendiente transferencia')}
                      </span>
                    </div>
                  </div>

                  <div style="font-size:0.82rem; color:var(--text); margin-bottom:10px;">
                    ${(p.items || []).map(it => `<span style="display:inline-block; background:var(--surface-warm); padding:3px 9px; border-radius:8px; margin:2px 4px 2px 0;"><strong>${it.cantidad}x</strong> ${esc(it.nombre_publico)}</span>`).join('')}
                  </div>

                  <!-- Botonera contextual de 1 toque (Reparto / Entrega / Cobro / Seguimiento) -->
                  ${(puedeSalirReparto || puedeMarcarEntregado) ? `
                    <div style="display:flex; gap:8px; flex-wrap:wrap; padding:9px 10px; margin-bottom:10px; border-radius:11px; background:var(--surface-warm); border:1px solid var(--border);">
                      ${puedeSalirReparto ? `
                        <button type="button" onclick="avanzarEstadoEntregaGestor(${p.id}, 'SALIO_REPARTO', false)"
                          style="flex:1; min-width:165px; padding:9px 13px; border-radius:10px; border:1.5px solid #6d28d9; background:#7c3aed; color:#ffffff; font-family:inherit; font-weight:900; font-size:0.82rem; cursor:pointer;">
                          🛵 Salió a reparto
                        </button>
                      ` : ''}
                      ${puedeMarcarEntregado ? `
                        <button type="button" onclick="tocarBotonEntregadoGestor(${p.id})"
                          style="flex:1; min-width:165px; padding:9px 13px; border-radius:10px; border:none; background:#16a34a; color:#ffffff; font-family:inherit; font-weight:900; font-size:0.82rem; cursor:pointer;">
                          ${pagado ? '✅ Marcar Entregado' : `✅ Entregado${esEfvo ? ' / Cobrar' : ''}`}
                        </button>
                      ` : ''}
                    </div>
                  ` : ''}

                  <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; border-top:1px solid var(--border); padding-top:10px;">
                    <span style="font-size:0.78rem; font-weight:800; color:var(--ok);">Tu ganancia: +${fmt(p.ganancia_total_gestor)}</span>
                    <div style="display:flex; gap:6px; flex-wrap:wrap;">
                      ${!pagado ? `
                        <button type="button" class="btn-primary" style="padding:7px 11px; font-size:0.76rem;" onclick="cobrarEnEfectivoYEmitirReciboGestor(${p.id})">
                          💵 Cobrar Efectivo
                        </button>
                      ` : `
                        <button type="button" class="btn-soft" style="font-size:0.76rem; padding:6px 10px;" onclick="abrirModalReciboVecinoGestor(${p.id})">
                          🧾 Recibo Digital
                        </button>
                      `}
                      ${urlSeg ? `
                        <a href="${esc(urlSeg)}" target="_blank" rel="noopener" class="btn-soft" style="font-size:0.76rem; padding:6px 10px; text-decoration:none;">
                          📍 Seguimiento
                        </a>
                      ` : ''}
                      <button type="button" class="btn-soft" style="font-size:0.76rem; padding:6px 10px;" onclick="enviarWhatsAppVecinoPedidoPrueba(${p.id})">
                        📲 Detalle WA
                      </button>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    async function confirmarRecepcionLoteGestor(canastoId) {
      if (!GSTATE.nodo?.id || !canastoId) return;
      const btn = document.getElementById(`btn-recibir-lote-${canastoId}`);
      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Registrando recepción...';
      }
      try {
        const resp = await fetch(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/lotes/${canastoId}/confirmar-recepcion`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ actor: GSTATE.nodo.gestor_nombre || 'Gestor del Nodo' })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo confirmar la recepción del lote: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          if (btn) {
            btn.disabled = false;
            btn.textContent = '📥 Confirmar que recibí el lote';
          }
          return;
        }
        mostrarAvisoPantallaGestor(`✅ ¡Lote ${data.codigo_canasto || ''} recibido en ${GSTATE.nodo.nombre_marca}! Tus vecinos ya ven sus bolsas disponibles en vivo.`, 'ok');
        await cargarPanelGestor();
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de comunicación al confirmar la recepción del lote.', 'error');
        if (btn) {
          btn.disabled = false;
          btn.textContent = '📥 Confirmar que recibí el lote';
        }
      }
    }

    function tocarBotonEntregadoGestor(pedidoId) {
      const p = (GSTATE.pedidos || []).find(x => Number(x.id) === Number(pedidoId));
      if (!p || !GSTATE.nodo) return;
      if (p.pago_confirmado) {
        avanzarEstadoEntregaGestor(p.id, 'ENTREGADO', false);
        return;
      }

      // Modal ágil de 1 toque que unifica Entrega + Cobro en Efectivo + Recibo Digital
      const modal = document.getElementById('modal-recibo-gestor');
      const body = document.getElementById('modal-recibo-gestor-body');
      if (!modal || !body) return;

      body.innerHTML = `
        <div style="background:var(--brand); color:#ffffff; padding:16px 18px; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-size:0.72rem; text-transform:uppercase; font-weight:800; opacity:0.9;">Confirmar Entrega en 1 Toque</div>
            <div style="font-size:1.1rem; font-weight:900; margin-top:2px;">Pedido #${esc(p.codigo_pedido)} · ${esc(p.vecino_nombre)}</div>
          </div>
          <button type="button" onclick="cerrarModalReciboGestor()" style="background:rgba(0,0,0,0.18); border:none; color:#fff; width:32px; height:32px; border-radius:999px; font-weight:900; cursor:pointer;">✕</button>
        </div>
        <div style="padding:18px; color:var(--text);">
          <div style="background:var(--surface-warm); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:14px; font-size:0.86rem;">
            <div><strong>Importe del pedido:</strong> <span style="font-size:1.05rem; font-weight:900; color:var(--brand-dark);">${fmt(p.total_vecino)}</span></div>
            <div style="font-size:0.79rem; color:var(--muted); margin-top:3px;">
              Medio elegido al pedir: <strong>${p.medio_pago === 'EFECTIVO' ? '💵 Efectivo al recibir' : '🏦 Transferencia bancaria'}</strong> (aún pendiente de acreditar)
            </div>
          </div>
          <div style="display:flex; flex-direction:column; gap:10px;">
            <button type="button" onclick="cerrarModalReciboGestor(); avanzarEstadoEntregaGestor(${p.id}, 'ENTREGADO', true);"
              style="width:100%; padding:13px 14px; border-radius:12px; border:none; background:#16a34a; color:#ffffff; font-family:inherit; font-weight:900; font-size:0.9rem; cursor:pointer; text-align:center;">
              💵 Entregado + Cobré ${fmt(p.total_vecino)} en Efectivo
            </button>
            <button type="button" onclick="cerrarModalReciboGestor(); avanzarEstadoEntregaGestor(${p.id}, 'ENTREGADO', false);"
              style="width:100%; padding:11px 14px; border-radius:12px; border:1px solid var(--border); background:#fffdfb; color:var(--text); font-family:inherit; font-weight:800; font-size:0.84rem; cursor:pointer; text-align:center;">
              📦 Solo marcar Entregado (cobro por transferencia / luego)
            </button>
            <button type="button" class="btn-soft" onclick="cerrarModalReciboGestor()">Cancelar</button>
          </div>
        </div>
      `;
      modal.style.display = 'flex';
    }

    async function avanzarEstadoEntregaGestor(pedidoId, accion, registrarCobroEfectivo = false) {
      const p = (GSTATE.pedidos || []).find(x => Number(x.id) === Number(pedidoId));
      if (!p || !GSTATE.nodo?.id) return;

      try {
        const resp = await fetch(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/pedidos/${pedidoId}/estado-entrega`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            accion,
            registrar_cobro_efectivo: Boolean(registrarCobroEfectivo),
            actor: GSTATE.nodo.gestor_nombre || 'Gestor del Nodo'
          })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo actualizar el estado del pedido: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          return;
        }

        const msgExito = accion === 'SALIO_REPARTO'
          ? `🛵 Pedido #${p.codigo_pedido} marcado "En camino a domicilio". El vecino ya lo ve en vivo.`
          : (data.cobro_efectivo_registrado
              ? `✅ Pedido #${p.codigo_pedido} entregado y cobrado en efectivo (${fmt(p.total_vecino)}).`
              : `✅ Pedido #${p.codigo_pedido} marcado como entregado a ${p.vecino_nombre}.`);
        mostrarAvisoPantallaGestor(msgExito, 'ok');

        await cargarPanelGestor();

        if (data.cobro_efectivo_registrado) {
          abrirModalReciboVecinoGestor(pedidoId);
        }
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de comunicación al actualizar el estado de entrega.', 'error');
      }
    }

    async function cobrarEnEfectivoYEmitirReciboGestor(pedidoId) {
      const ped = (GSTATE.pedidos || []).find(p => Number(p.id) === Number(pedidoId));
      if (!ped) return;

      try {
        const resp = await fetch(`/api/produccion/nodos/liquidacion/pedidos/${pedidoId}/conciliar-pago`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            medio_pago: 'EFECTIVO',
            comprobante_referencia: `REC-EFVO-${ped.codigo_pedido}`
          })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo registrar el cobro en efectivo: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          return;
        }
        mostrarAvisoPantallaGestor(`✅ Cobro en efectivo registrado para el pedido #${ped.codigo_pedido}.`, 'ok');
        await cargarPanelGestor();
        abrirModalReciboVecinoGestor(pedidoId);
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de comunicación al registrar el cobro en efectivo.', 'error');
      }
    }

    function cerrarModalReciboGestor() {
      const modal = document.getElementById('modal-recibo-gestor');
      if (modal) modal.style.display = 'none';
    }

    function abrirModalReciboVecinoGestor(pedidoId) {
      const p = (GSTATE.pedidos || []).find(x => Number(x.id) === Number(pedidoId));
      if (!p || !GSTATE.nodo) return;
      const esEfvo = String(p.medio_pago || '').toUpperCase() === 'EFECTIVO' || String(p.estado_pago || '').toUpperCase() === 'COBRADO_EFECTIVO_GESTOR';
      const nroRecibo = p.comprobante_referencia || (esEfvo ? `REC-EFVO-${p.codigo_pedido}` : `REC-TRF-${p.codigo_pedido}`);

      const modal = document.getElementById('modal-recibo-gestor');
      const body = document.getElementById('modal-recibo-gestor-body');
      if (!modal || !body) return;

      body.innerHTML = `
        <div style="background:var(--brand); color:#ffffff; padding:16px 18px; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-size:0.72rem; text-transform:uppercase; font-weight:800; opacity:0.9;">Comprobante de Pago</div>
            <div style="font-size:1.12rem; font-weight:900; margin-top:2px;">${esc(GSTATE.nodo.nombre_marca)}</div>
          </div>
          <button type="button" onclick="cerrarModalReciboGestor()" style="background:rgba(0,0,0,0.18); border:none; color:#fff; width:32px; height:32px; border-radius:999px; font-weight:900; cursor:pointer;">✕</button>
        </div>
        <div style="padding:18px; color:var(--text);">
          <div style="font-size:0.85rem; margin-bottom:12px;">
            <div><strong>Vecino/a:</strong> ${esc(p.vecino_nombre)} · <strong>Pedido #${esc(p.codigo_pedido)}</strong></div>
            <div style="color:var(--muted); font-size:0.78rem; margin-top:2px;">Recibo ${esc(nroRecibo)} · ${esEfvo ? 'Efectivo' : 'Transferencia'}</div>
          </div>
          <div style="border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:14px; background:#fffdfb; font-size:0.84rem;">
            ${(p.items || []).map(it => `
              <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                <span><strong>${it.cantidad}x</strong> ${esc(it.nombre_publico)}</span>
                <strong>${fmt(it.subtotal_vecino)}</strong>
              </div>
            `).join('')}
            ${Number(p.cargo_envio_barrial) > 0 ? `
              <div style="display:flex; justify-content:space-between; color:var(--muted); border-top:1px dashed var(--border); padding-top:6px;">
                <span>Envío barrial</span>
                <strong>${fmt(p.cargo_envio_barrial)}</strong>
              </div>
            ` : ''}
            <div style="display:flex; justify-content:space-between; font-size:1rem; font-weight:900; border-top:1px solid var(--border); padding-top:8px; margin-top:6px;">
              <span>TOTAL PAGADO</span>
              <span style="color:var(--ok);">${fmt(p.total_vecino)}</span>
            </div>
          </div>
          <div style="display:flex; flex-direction:column; gap:8px;">
            <button type="button" class="btn-primary" onclick="enviarReciboWhatsAppVecinoGestor(${p.id})">
              📲 Enviar Recibo por WhatsApp
            </button>
            <button type="button" class="btn-soft" onclick="cerrarModalReciboGestor()">Cerrar</button>
          </div>
        </div>
      `;
      modal.style.display = 'flex';
    }

    async function enviarReciboWhatsAppVecinoGestor(pedidoId) {
      const p = (GSTATE.pedidos || []).find(x => Number(x.id) === Number(pedidoId));
      if (!p || !GSTATE.nodo) return;
      const esEfvo = String(p.medio_pago || '').toUpperCase() === 'EFECTIVO' || String(p.estado_pago || '').toUpperCase() === 'COBRADO_EFECTIVO_GESTOR';
      const nroRecibo = p.comprobante_referencia || (esEfvo ? `REC-EFVO-${p.codigo_pedido}` : `REC-TRF-${p.codigo_pedido}`);
      const itemsTxt = (p.items || []).map(it => `• ${it.cantidad}x ${it.nombre_publico}: ${fmt(it.subtotal_vecino)}`).join('\n');
      const linkSeg = obtenerUrlSeguimientoPedidoGestor(p);

      const mensaje = [
        `🧾 *RECIBO DE PAGO — ${GSTATE.nodo.nombre_marca}*`,
        `Comprobante: *${nroRecibo}* · Pedido *#${p.codigo_pedido}*`,
        `Hola *${p.vecino_nombre}*, registramos tu pago:`,
        itemsTxt,
        Number(p.cargo_envio_barrial) > 0 ? `• Envío barrial: ${fmt(p.cargo_envio_barrial)}` : '',
        `✅ *TOTAL ABONADO: ${fmt(p.total_vecino)}* (${esEfvo ? 'Efectivo' : 'Transferencia'})`,
        linkSeg ? `📍 Seguimiento de tu pedido: ${linkSeg}` : '',
        `¡Muchas gracias!`
      ].filter(Boolean).join('\n');

      await abrirModalDespachoWhatsAppGestor({
        destinatario_nombre: p.vecino_nombre,
        telefono_original: p.vecino_telefono,
        mensaje,
        titulo: `Recibo ${nroRecibo}`,
        subtitulo: `Vecino/a: ${p.vecino_nombre}`
      });
    }

    // -------------------------------------------------------------------------
    // 5. CUENTAS CORRIENTES
    // -------------------------------------------------------------------------
    function renderSeccionCuentasCorrientes() {
      const liqData = GSTATE.liquidacionTablero;
      const nodoResumen = (liqData?.nodos || []).find(n => Number(n.id) === Number(GSTATE.nodo?.id)) || GSTATE.nodo || {};
      const saldoActual = Number(nodoResumen?.saldo_cuenta_corriente ?? GSTATE.nodo?.saldo_cuenta_corriente ?? 0);
      const esDeudor = saldoActual > 0.01;
      const esAcreedor = saldoActual < -0.01;
      const codMadre = nodoResumen?.codigo_bunker_cliente_madre || GSTATE.nodo?.codigo_bunker_cliente_madre || null;
      const nomMadre = nodoResumen?.cliente_madre_razon_social || nodoResumen?.cliente_madre_nombre || GSTATE.nodo?.cliente_madre_razon_social || '';
      const saldoMadre = Number(nodoResumen?.saldo_cuenta_corriente_madre ?? GSTATE.nodo?.saldo_cuenta_corriente_madre ?? 0);

      return `
        <div class="card">
          <div style="font-size:0.74rem; color:var(--muted); font-weight:800; text-transform:uppercase;">
            Subcuenta Operativa del Nodo (${esc(nodoResumen?.codigo_bunker_cliente || GSTATE.nodo?.codigo_bunker_cliente || 'CB-NODO')})
          </div>
          <div style="font-size:1.45rem; font-weight:900; margin-top:4px; color:${esDeudor ? 'var(--warn)' : 'var(--ok)'};">
            ${esAcreedor ? `${fmt(Math.abs(saldoActual))} a tu favor` : (esDeudor ? `${fmt(saldoActual)} a rendir a LAMDA` : `${fmt(0)} (Al día)`)}
          </div>
          <p style="margin:6px 0 0 0; font-size:0.82rem; color:var(--muted);">
            Alias de recaudación para transferencias de vecinos: <strong>${esc(GSTATE.nodo?.alias_bancario_display || 'pago.canasto')}</strong>
          </p>

          ${codMadre ? `
            <div style="margin-top:14px; padding:12px 14px; border-radius:12px; background:var(--surface-warm); border:1px solid var(--border); font-size:0.83rem;">
              <div><strong>Cuenta Personal Vinculada (${esc(codMadre)}):</strong> ${esc(nomMadre)} <span style="font-size:0.74rem; color:var(--muted);">(Aislada de la operatoria diaria)</span></div>
              <div style="margin-top:3px; color:var(--muted);">
                Saldo actual Cuenta Personal:
                <strong style="color:var(--text);">
                  ${saldoMadre < -0.01 ? `${fmt(Math.abs(saldoMadre))} a favor` : fmt(saldoMadre)}
                </strong>
              </div>
            </div>
          ` : ''}
        </div>

        <div class="card">
          <h3 style="margin:0 0 10px 0; font-size:0.98rem;">Movimientos de la Subcuenta del Nodo</h3>
          ${GSTATE.movimientosCtaCte.length === 0 ? `
            <div style="text-align:center; padding:20px; color:var(--muted); font-size:0.85rem;">
              Aún no hay movimientos registrados en la subcuenta de este Nodo.
            </div>
          ` : `
            <div style="display:flex; flex-direction:column; gap:8px;">
              ${GSTATE.movimientosCtaCte.map(m => {
                const monto = Math.abs(Number(m.monto || 0));
                const signo = Number(m.signo ?? 0);
                const esDebito = signo > 0;
                const esNeutro = signo === 0;
                const colorMov = esNeutro ? 'var(--muted)' : (esDebito ? 'var(--warn)' : 'var(--ok)');
                const textoMov = esNeutro
                  ? `Efvo. en mano: ${fmt(monto)}`
                  : (esDebito ? `+${fmt(monto)} (Cargo LAMDA)` : `-${fmt(monto)} (A favor Nodo)`);
                return `
                  <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:#fffdfb;">
                    <div>
                      <div style="font-weight:800; font-size:0.86rem;">${esc(m.concepto || m.tipo_movimiento || 'Movimiento')}</div>
                      <div style="font-size:0.75rem; color:var(--muted);">
                        ${m.codigo_canasto ? `Lote ${esc(m.codigo_canasto)} · ` : ''}${m.created_at ? new Date(m.created_at).toLocaleDateString('es-AR') : ''}
                      </div>
                    </div>
                    <strong style="font-size:0.92rem; color:${colorMov};">
                      ${textoMov}
                    </strong>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    // -------------------------------------------------------------------------
    // 6. LIQUIDACIÓN
    // -------------------------------------------------------------------------
    function renderSeccionLiquidacion() {
      const canastos = (GSTATE.liquidacionTablero?.lotes || []).filter(c => Number(c.nodo_id) === Number(GSTATE.nodo?.id));

      if (canastos.length === 0) {
        return `
          <div class="card" style="text-align:center; padding:28px 20px; color:var(--muted);">
            Aún no hay lotes de pedidos cerrados para liquidar en este Nodo.
          </div>
        `;
      }

      return canastos.map(c => {
        const liq = c.cuadro_liquidacion || {};
        return `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:12px;">
              <div>
                <strong>Lote ${esc(c.codigo_canasto)}</strong>
                <div style="font-size:0.8rem; color:var(--muted);">Entrega: ${esc(c.fecha_entrega_label)}</div>
              </div>
              <span style="padding:4px 10px; border-radius:999px; font-size:0.74rem; font-weight:800; background:${c.liquidacion_cerrada ? 'var(--ok-soft)' : 'var(--warn-soft)'}; color:${c.liquidacion_cerrada ? 'var(--ok)' : 'var(--warn)'};">
                ${c.liquidacion_cerrada ? 'Liquidado' : `${liq.pedidos_pagos_confirmados || 0}/${liq.total_pedidos || 0} cobros confirmados`}
              </span>
            </div>

            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap:10px; margin-bottom:12px;">
              <div style="background:#fffdfb; border:1px solid var(--border); border-radius:12px; padding:12px;">
                <div style="font-size:0.72rem; color:var(--muted); font-weight:800; text-transform:uppercase;">Ventas a Vecinos</div>
                <div style="font-size:1.18rem; font-weight:900; margin-top:3px;">${fmt(liq.total_venta_vecinos)}</div>
              </div>
              <div style="background:#fffdfb; border:1px solid var(--border); border-radius:12px; padding:12px;">
                <div style="font-size:0.72rem; color:var(--muted); font-weight:800; text-transform:uppercase;">Costo Base Canasto</div>
                <div style="font-size:1.18rem; font-weight:900; margin-top:3px;">-${fmt(liq.total_base_lamda)}</div>
              </div>
              <div style="background:var(--ok-soft); border:1px solid rgba(47,111,78,0.25); border-radius:12px; padding:12px;">
                <div style="font-size:0.72rem; color:var(--ok); font-weight:800; text-transform:uppercase;">Tu Ganancia Neta</div>
                <div style="font-size:1.18rem; font-weight:900; color:var(--ok); margin-top:3px;">+${fmt(liq.ganancia_neta_gestor)}</div>
              </div>
            </div>

            <div style="background:var(--surface-warm); border:1px solid var(--border); border-radius:12px; padding:12px; font-size:0.83rem; line-height:1.5;">
              <div><strong>${esc(liq.titulo_resultado || 'Compensación del Lote')}</strong></div>
              <div style="color:var(--muted); margin-top:4px;">
                Transferencias acreditadas: <strong>${fmt(liq.transferencias_esperadas)}</strong> ·
                Efectivo cobrado en mano: <strong>${fmt(liq.efectivo_esperado)}</strong>
              </div>
              ${liq.explicacion_compensacion ? `<div style="margin-top:4px; font-weight:800;">${esc(liq.explicacion_compensacion)}</div>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      GSTATE.slug = detectarSlugInicial();
      const hash = (window.location.hash || '').replace(/^#/, '');
      if (['ofertas', 'propuestas', 'logistica', 'pedidos', 'ctacte', 'liquidacion'].includes(hash)) {
        GSTATE.vista = hash;
      }
      cargarPanelGestor();
    });
  </script>
</body>
</html>
