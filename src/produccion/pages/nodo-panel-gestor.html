  <script>
    window.__nodoGestorDeferredPrompt = null;
    window.__nodoGestorInstaladoRuntime = false;
    window.__nodoGestorBipWaiters = [];
    window.limpiarBanderasObsoletasPwaGestor = function() {
      try {
        var keys = [];
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && (/^(lamda_nodo_pwa_|lamda_pwa_installed|pwa_installed|pwa_dismissed|dismissed_forever)/i.test(k))) {
            keys.push(k);
          }
        }
        for (var j = 0; j < keys.length; j++) {
          localStorage.removeItem(keys[j]);
        }
      } catch (_) {}
    };
    try {
      window.limpiarBanderasObsoletasPwaGestor();
      window.addEventListener('beforeinstallprompt', function(ev) {
        ev.preventDefault();
        window.__nodoGestorDeferredPrompt = ev;
        window.__nodoGestorInstaladoRuntime = false;
        window.limpiarBanderasObsoletasPwaGestor();
        while (window.__nodoGestorBipWaiters && window.__nodoGestorBipWaiters.length) {
          var fn = window.__nodoGestorBipWaiters.shift();
          try { fn(ev); } catch (_) {}
        }
        if (typeof window.actualizarVisibilidadBotonPwaGestor === 'function') {
          window.actualizarVisibilidadBotonPwaGestor();
        }
      });
      window.addEventListener('appinstalled', function() {
        window.__nodoGestorDeferredPrompt = null;
        window.__nodoGestorInstaladoRuntime = true;
        if (typeof window.cerrarModalPwaGestor === 'function') {
          window.cerrarModalPwaGestor();
        }
        if (typeof window.actualizarVisibilidadBotonPwaGestor === 'function') {
          window.actualizarVisibilidadBotonPwaGestor();
        }
      });
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) {
            var sUrl = (r.active && r.active.scriptURL) || (r.installing && r.installing.scriptURL) || (r.waiting && r.waiting.scriptURL) || '';
            if (sUrl.indexOf('/sw-nodo-pwa.js') === -1) {
              r.unregister();
            }
          });
        }).catch(function(){});
        navigator.serviceWorker.register('/sw-nodo-pwa.js', { scope: '/' }).catch(function(){});
      }
      localStorage.removeItem('lamda_prefer_mobile_home');
    } catch (_) {}
  </script>
  <title>Gestión comercial</title>

  <style>
    :root {
      --brand: #a2553b;
      --brand-dark: #6b311d;
      --brand-soft: rgba(162, 85, 59, 0.12);
      --brand-border: rgba(162, 85, 59, 0.34);
      --accent: #a2553b;
      --sun: #fef3c7;
      --bg: #faf7f3;
      --surface: #ffffff;
      --surface-warm: #f3ebe2;
      --surface-header: #fffdfb;
      --text: #25130b;
      --muted: #57453b;
      --border: #d9cbbd;
      --ok: #1f5c3d;
      --ok-soft: #e6f4ec;
      --ok-border: #b7e4c7;
      --warn: #92400e;
      --warn-soft: #fef3c7;
      --font-brand: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-brand);
      background: var(--bg);
      color: var(--text);
      padding-bottom: 48px;
      -webkit-font-smoothing: antialiased;
    }

    /* Encabezado claro, cálido y austero */
    .top-bar {
      background: var(--surface-header, #fffdfb);
      border-bottom: 1px solid var(--border);
      padding: 9px 12px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .top-inner {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .brand-identity {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }
    .brand-identity.logo-includes-text {
      gap: 6px 12px;
      flex-wrap: wrap;
    }
    .brand-identity.logo-includes-text .brand-title {
      display: none;
    }
    .brand-identity.logo-includes-text .brand-subtitle {
      margin-top: 0;
      font-size: 0.82rem;
      font-weight: 800;
      line-height: 1.25;
      color: var(--muted);
    }
    .brand-emblem {
      width: 40px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .brand-emblem.has-horizontal-logo {
      width: auto;
      height: 44px;
      max-width: 192px;
    }
    .brand-emblem img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .brand-emblem.has-horizontal-logo img {
      height: 44px;
      width: auto;
      max-width: 192px;
      object-fit: contain;
      display: block;
    }
    @media (max-width: 480px) {
      .brand-emblem.has-horizontal-logo,
      .brand-emblem.has-horizontal-logo img {
        height: 40px;
        max-width: 170px;
      }
    }
    .brand-monogram {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--brand-soft);
      border: 1px solid var(--brand-border);
      color: var(--brand-dark);
      font-weight: 900;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-title {
      font-size: 1.08rem;
      font-weight: 900;
      color: var(--text);
      line-height: 1.15;
      letter-spacing: -0.01em;
    }
    .brand-subtitle {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 700;
      margin-top: 2px;
    }

    .top-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn-top {
      min-height: 38px;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      gap: 4px;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-top:hover {
      background: var(--surface-warm);
    }
    .btn-top.brand {
      background: var(--brand);
      border-color: var(--brand);
      color: #ffffff;
    }
    .btn-top.brand:hover {
      background: var(--brand-dark);
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 13px 12px 26px;
    }

    /* Tablero Principal Austero */
    .board-intro {
      font-size: 0.92rem;
      color: var(--text);
      font-weight: 800;
      margin: 0 0 10px 2px;
    }
    .blocks-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .block-btn {
      width: 100%;
      min-height: 54px;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 10px 12px;
      cursor: pointer;
      font-family: inherit;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 2px 6px rgba(62, 37, 25, 0.03);
      transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .block-btn:hover, .block-btn:active {
      border-color: var(--brand-border);
      box-shadow: 0 3px 10px rgba(62, 37, 25, 0.06);
      transform: translateY(-1px);
    }
    .block-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .block-num {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: var(--brand-soft);
      color: var(--brand-dark);
      font-weight: 900;
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .block-title {
      font-size: 0.98rem;
      font-weight: 900;
      color: var(--text);
      line-height: 1.22;
    }
    .block-meta {
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 700;
      margin-top: 2px;
      line-height: 1.3;
    }
    .block-arrow {
      font-size: 1.25rem;
      color: var(--muted);
      font-weight: 800;
      flex-shrink: 0;
      line-height: 1;
    }

    /* Cabecera de Navegación Interna al abrir un Bloque */
    .section-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 38px;
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-back:hover {
      background: var(--surface-warm);
    }
    .section-heading {
      margin: 0 0 10px 0;
      font-size: 1.12rem;
      font-weight: 900;
      color: var(--text);
      line-height: 1.24;
    }

    /* Tarjetas y Controles Internos */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(62, 37, 25, 0.025);
    }
    .input-sm {
      min-height: 38px;
      padding: 7px 10px;
      border-radius: 9px;
      border: 1.5px solid var(--border);
      background: #fffdfb;
      color: var(--text);
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      outline: none;
    }
    .input-sm:disabled {
      background: #eee7df;
      color: var(--muted);
      cursor: not-allowed;
    }
    .input-sm:focus {
      border-color: var(--brand);
    }
    .btn-primary {
      background: var(--brand);
      color: #ffffff;
      border: none;
      min-height: 40px;
      padding: 8px 14px;
      border-radius: 10px;
      font-family: inherit;
      font-weight: 900;
      font-size: 0.92rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary:hover {
      background: var(--brand-dark);
    }
    .btn-soft {
      background: var(--surface-warm);
      color: var(--text);
      border: 1px solid var(--border);
      min-height: 38px;
      padding: 6px 11px;
      border-radius: 9px;
      font-family: inherit;
      font-weight: 800;
      font-size: 0.84rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
    }
    .switch-label {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 38px;
      cursor: pointer;
      font-weight: 800;
      font-size: 0.9rem;
      line-height: 1.28;
      color: var(--text);
    }
    .switch-label input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--brand);
      flex-shrink: 0;
      cursor: pointer;
    }

    /* === Pestañas de Estado, Categorías y Claridad Visual en Mi Oferta y Márgenes === */
    .ofertas-tabs-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      background: var(--surface-warm);
      padding: 5px;
      border-radius: 13px;
      border: 1px solid var(--border);
      margin-bottom: 11px;
    }
    .oferta-tab-btn {
      min-height: 40px;
      border-radius: 9px;
      border: 1.5px solid transparent;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 6px 5px;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s;
    }
    .oferta-tab-btn:hover {
      color: var(--text);
    }
    .oferta-tab-btn.is-active[data-tab="ACTIVOS"] {
      background: #ffffff;
      color: #166534;
      border-color: #86efac;
      box-shadow: 0 2px 6px rgba(22, 101, 52, 0.1);
      font-weight: 900;
    }
    .oferta-tab-btn.is-active[data-tab="DESACTIVADOS"] {
      background: #ffffff;
      color: #475569;
      border-color: #cbd5e1;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
      font-weight: 900;
    }
    .oferta-tab-btn.is-active[data-tab="TODOS"] {
      background: #ffffff;
      color: var(--brand-dark);
      border-color: var(--brand-border);
      box-shadow: 0 2px 6px rgba(62, 37, 25, 0.08);
      font-weight: 900;
    }
    .ofertas-search-wrap {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 9px;
    }
    .ofertas-search-input {
      width: 100%;
      min-height: 40px;
      padding: 8px 38px 8px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: #fffdfb;
      color: var(--text);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      outline: none;
    }
    .ofertas-search-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-soft);
    }
    .ofertas-search-clear {
      position: absolute;
      right: 8px;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: none;
      background: var(--surface-warm);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 900;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .ofertas-cats-strip {
      display: flex;
      align-items: center;
      gap: 7px;
      overflow-x: auto;
      padding: 2px 1px 6px 1px;
      margin-bottom: 10px;
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch;
    }
    .ofertas-cats-strip::-webkit-scrollbar {
      display: none;
    }
    .oferta-cat-chip {
      flex-shrink: 0;
      min-height: 33px;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .oferta-cat-chip.is-active {
      background: var(--brand);
      border-color: var(--brand);
      color: #ffffff;
    }
    .oferta-item.is-published {
      background: #ffffff;
      border: 1.5px solid #86efac;
      border-left: 5px solid #16a34a;
      box-shadow: 0 3px 10px rgba(22, 163, 74, 0.05);
    }
    .oferta-item.is-unpublished {
      background: #f8f5f0;
      border: 1.5px dashed #d6c9ba;
      border-left: 5px solid #94a3b8;
      opacity: 0.93;
    }
    .oferta-pub-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin: 8px 0 8px 0;
      padding: 8px 11px;
      border-radius: 10px;
    }
    .oferta-pub-banner.is-published {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
    }
    .oferta-pub-banner.is-unpublished {
      background: #f1ede7;
      border: 1px solid #dfd7cc;
    }
    .oferta-toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      user-select: none;
      font-weight: 800;
      font-size: 0.8rem;
      color: var(--text);
    }
    .oferta-toggle-switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 25px;
      flex-shrink: 0;
    }
    .oferta-toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }
    .oferta-toggle-slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background-color: #94a3b8;
      border-radius: 999px;
      transition: background-color 0.18s ease;
    }
    .oferta-toggle-slider::before {
      content: "";
      position: absolute;
      height: 19px;
      width: 19px;
      left: 3px;
      top: 3px;
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.24);
      transition: transform 0.18s ease;
    }
    .oferta-toggle-switch input:checked + .oferta-toggle-slider {
      background-color: #16a34a;
    }
    .oferta-toggle-switch input:checked + .oferta-toggle-slider::before {
      transform: translateX(19px);
    }
    .oferta-toggle-switch input:disabled + .oferta-toggle-slider {
      opacity: 0.55;
      cursor: wait;
    }
    .oferta-pub-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .oferta-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 999px;
      line-height: 1.2;
      white-space: nowrap;
    }
    .oferta-status-pill.is-unpublished {
      background: #e2e8f0;
      color: #334155;
      border: 1px solid #cbd5e1;
    }
    .oferta-status-pill.is-published {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }
    .btn-oferta-activar {
      background: var(--brand);
      color: #ffffff;
      border: 1px solid var(--brand-dark);
      min-height: 36px;
      padding: 6px 14px;
      border-radius: 9px;
      font-family: inherit;
      font-weight: 900;
      font-size: 0.82rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      box-shadow: 0 2px 7px var(--brand-soft);
      transition: background 0.15s, opacity 0.15s, transform 0.1s;
    }
    .btn-oferta-activar:hover:not(:disabled) {
      background: var(--brand-dark);
    }
    .btn-oferta-activar:active:not(:disabled) {
      transform: scale(0.98);
    }
    .btn-oferta-despublicar {
      background: #ffffff;
      color: #475569;
      border: 1px solid #cbd5e1;
      min-height: 36px;
      padding: 6px 12px;
      border-radius: 9px;
      font-family: inherit;
      font-weight: 800;
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    }
    .btn-oferta-despublicar:hover:not(:disabled) {
      background: #f8fafc;
      border-color: #94a3b8;
      color: #1e293b;
    }
    .btn-oferta-activar:disabled,
    .btn-oferta-despublicar:disabled {
      opacity: 0.68;
      cursor: wait;
    }

    /* === Álbum de Fotos por Oferta (Panel Gestor) === */
    .oferta-album-box {
      margin: 0 0 10px 0;
      padding: 9px 10px;
      border-radius: 10px;
      background: var(--surface-warm);
      border: 1px solid var(--border);
    }
    .oferta-album-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 7px;
    }
    .oferta-album-title {
      font-size: 0.75rem;
      font-weight: 900;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .oferta-album-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 1px 6px 1px;
      scrollbar-width: thin;
    }
    .album-thumb-btn {
      position: relative;
      width: 66px;
      height: 66px;
      flex-shrink: 0;
      padding: 0;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: #18181b;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.15s;
    }
    .album-thumb-btn.is-portada {
      border-color: var(--brand);
      box-shadow: 0 2px 8px var(--brand-soft);
    }
    .album-thumb-btn:hover {
      border-color: var(--brand);
      transform: translateY(-1px);
    }
    .album-thumb-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    <div style="background:#ffffff; border-radius:18px; max-width:540px; width:100%; max-height:94vh; overflow-y:auto; box-shadow:0 24px 48px rgba(15,23,42,0.34); border:1px solid var(--border);">

  <!-- MODAL BREVE DE 2 PASOS PARA INSTALAR ACCESO DIRECTO EN IPHONE / NAVEGADOR -->
  <div id="modal-pwa-gestor" onclick="if(event.target===this) cerrarModalPwaGestor()" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.62); z-index:4300; align-items:center; justify-content:center; padding:14px;">
    <div style="background:#ffffff; border-radius:18px; max-width:390px; width:100%; padding:20px 18px; box-shadow:0 22px 45px rgba(15,23,42,0.3); border:1px solid var(--border);">
      <div id="modal-pwa-gestor-body"></div>

  <script>
    const GSTATE = {
      slug: '',
      vista: 'inicio', // 'inicio' | 'reparto' | 'ofertas' | 'propuestas' | 'logistica' | 'pedidos' | 'ctacte' | 'liquidacion' | 'compradores'
      filtroPagoPedidos: 'TODOS',
      filtroOperativoPedidos: 'TODOS',
      filtroCompradores: 'TODOS',
      busquedaCompradores: '',
      ofertasEstadoTab: '', // 'ACTIVOS' | 'DESACTIVADOS' | 'TODOS'
      ofertasCategoriaSel: 'TODAS',
      ofertasBusquedaTexto: '',
      nodo: null,
      modoLaboratorio: false,
      telefonoPruebas: '5492216615746',
      proximaEntrega: null,
      ofertas: [],
      catalogoBaseDisponible: [],
      propuestas: [],
      pedidos: [],
      compradores: [],
      compradoresResumen: { total_compradores: 0, con_pedido_activo: 0, recurrentes: 0 },
      compradoresCargados: false,
      compartirKit: null,
      aficheQrDataUrl: '',
      difusionModo: 'tienda',
      difusionOfertaId: 0,
      movimientosCtaCte: [],
      ingredientesDisponibles: [],
      propCategoriaSel: '',
      propFiltroTexto: '',
      propIngredienteIdSel: 0,
      propIngredienteInicializadoId: 0,
      propKilosSel: 0,
      propPesoManualTexto: '',
      propUnidadPesoManual: 'g',
      propPrecioObjetivoTexto: '',
      propNombreTexto: '',
      propNombreEditadoManual: false,
      propComentarioTexto: '',
      propConfirmacionReciente: '',
      liquidacionTablero: null,
      repartoOrdenManual: [],
      repartoIndice: 0,
      repartoDistanciaMetros: 0,
      repartoPinPedidoId: null,
      nocturnoAbierto: false,
      radarActivo: false
    };

    function fmt(n) {
      return '$' + Math.round(Number(n) || 0).toLocaleString('es-AR');
    }

    function esPerfilEcommerceGestor(nodoRef = GSTATE.nodo) {
      const p = String(nodoRef?.perfil_operativo || '').trim().toLowerCase();
      return p === 'ecommerce_fulfillment';
    }

    function obtenerModulosActivosGestor(nodoRef = GSTATE.nodo) {
      const esEc = esPerfilEcommerceGestor(nodoRef);
      const preset = esEc
        ? { retiro_punto: false, reparto_zonal: false, hoja_de_ruta: false, envio_paqueteria: true, venta_continua_24_7: true, despacho_desde_lamda: true, canasto_consolidado: false, cobro_efectivo_entrega: false }
        : { retiro_punto: true, reparto_zonal: true, hoja_de_ruta: true, envio_paqueteria: false, venta_continua_24_7: false, despacho_desde_lamda: false, canasto_consolidado: true, cobro_efectivo_entrega: true };
      const raw = (nodoRef?.modulos_activos && typeof nodoRef.modulos_activos === 'object') ? nodoRef.modulos_activos : {};
      return { ...preset, ...raw };
    }

    function tMarca(nodoRef, clave) {
      const n = nodoRef || GSTATE.nodo || {};
      const dic = (n.diccionario_textos && typeof n.diccionario_textos === 'object') ? n.diccionario_textos : {};
      if (dic[clave] !== undefined && dic[clave] !== null && String(dic[clave]).trim() !== '') {
        return String(dic[clave]);
      }
      const esEc = esPerfilEcommerceGestor(n);
      const mod = obtenerModulosActivosGestor(n);
      const mapa = esEc ? {
        subtitulo_cabecera: '🚚 Envíos a todo el país · Despacho directo',
        btn_copiar_link: '🔗 Compartir link de mi tienda',
        bloque_3_titulo: 'Envíos Nacionales y Despacho',
        bloque_3_heading: '3. Envíos Nacionales y Despacho',
        bloque_4_titulo: 'Ventas y Envíos',
        bloque_4_heading: '4. Ventas y Envíos',
        bloque_5_titulo: 'Estado de Cuenta Operativo',
        bloque_5_heading: '5. Estado de Cuenta Operativo',
        bloque_6_titulo: 'Liquidaciones y Ganancias',
        bloque_6_heading: '6. Liquidaciones y Ganancias',
        bloque_7_titulo: 'Clientes de mi Tienda',
        bloque_7_heading: '7. Clientes de mi Tienda',
        comprador_singular: 'cliente',
        comprador_plural: 'clientes'
      } : {
        subtitulo_cabecera: '',
        btn_copiar_link: '🔗 Copiar Link',
        bloque_3_titulo: 'Días de Entrega, Corte y Modalidades',
        bloque_3_heading: '3. Días de Entrega, Corte y Envío Barrial',
        bloque_4_titulo: mod.hoja_de_ruta ? 'Pedidos de Vecinos' : 'Pedidos de Clientes',
        bloque_4_heading: mod.hoja_de_ruta ? '4. Pedidos de Vecinos' : '4. Pedidos de Clientes',
        bloque_5_titulo: 'Cuentas Corrientes',
        bloque_5_heading: '5. Cuentas Corrientes',
        bloque_6_titulo: 'Liquidación',
        bloque_6_heading: '6. Liquidación',
        bloque_7_titulo: 'Compradores registrados',
        bloque_7_heading: '7. Compradores registrados',
        comprador_singular: 'vecino',
        comprador_plural: 'vecinos'
      };
      return mapa[clave] ?? clave;
    }

    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    let _timerAvisoFlotante = null;
    function mostrarAvisoPantallaGestor(mensaje, tipo = 'ok') {
      const box = document.getElementById('gestor-aviso-flotante');
      if (!box) return;
      if (_timerAvisoFlotante) clearTimeout(_timerAvisoFlotante);

      const esError = tipo === 'error';
      box.style.background = esError ? '#fef2f2' : '#ecfdf3';
      box.style.border = esError ? '1px solid #ef4444' : '1px solid rgba(31,111,74,0.45)';
      box.style.color = esError ? '#991b1b' : '#14532d';
      box.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
          <div>${esError ? '⚠️ ' : ''}${esc(mensaje)}</div>
          <button type="button" onclick="document.getElementById('gestor-aviso-flotante').style.display='none'"
            style="border:none; background:transparent; color:inherit; font-weight:900; font-size:0.95rem; cursor:pointer; padding:0 2px; line-height:1;">
            ✕
          </button>
        </div>
      `;
      box.style.display = 'block';
      _timerAvisoFlotante = setTimeout(() => {
        box.style.display = 'none';
      }, esError ? 9000 : 5000);
    }

    async function leerRespuestaJsonSegura(resp) {
      const raw = await resp.text();
      try {
        return raw ? JSON.parse(raw) : {};
      } catch (_) {
        return { ok: false, error: `Respuesta inesperada del servidor (HTTP ${resp.status})` };
      }
    }

    function sincronizarTituloYMetaPwaGestor(nombreMarcaRaw) {
      const marca = String(nombreMarcaRaw || '').trim();
      const tituloGestion = marca ? `Gestión ${marca}` : 'Gestión comercial';
      document.title = tituloGestion;
      let metaAppleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
      if (!metaAppleTitle) {
        metaAppleTitle = document.createElement('meta');
        metaAppleTitle.setAttribute('name', 'apple-mobile-web-app-title');
        document.head.appendChild(metaAppleTitle);
      }
      metaAppleTitle.setAttribute('content', tituloGestion);
    }

    function obtenerVersionPwaGestor() {
      const vBoot = window.__NODOS_BOOTSTRAP__ && window.__NODOS_BOOTSTRAP__.pwa_v;
      return String(vBoot || '5').trim() || '5';
    }

    function esNavegadorEmbebidoWebViewGestor() {
      const ua = String(navigator.userAgent || '');
      return /(FBAN|FBAV|Instagram|Line\/|TikTok|BytedanceWebview|WhatsApp|; wv\)|\bwv\b)/i.test(ua);
    }

    function esperarDeferredPromptGestor(timeoutMs = 1500) {
      if (window.__nodoGestorDeferredPrompt) {
        return Promise.resolve(window.__nodoGestorDeferredPrompt);
      }
      return new Promise((resolve) => {
        let resuelto = false;
        const fn = (ev) => {
          if (resuelto) return;
          resuelto = true;
          clearTimeout(tm);
          resolve(ev || window.__nodoGestorDeferredPrompt || null);
        };
        window.__nodoGestorBipWaiters = window.__nodoGestorBipWaiters || [];
        window.__nodoGestorBipWaiters.push(fn);
        const tm = setTimeout(() => {
          if (resuelto) return;
          resuelto = true;
          const idx = window.__nodoGestorBipWaiters.indexOf(fn);
          if (idx !== -1) window.__nodoGestorBipWaiters.splice(idx, 1);
          resolve(window.__nodoGestorDeferredPrompt || null);
        }, timeoutMs);
      });
    }

    function aplicarFaviconGestor(urlImg) {
      const slugAct = String(GSTATE.slug || detectarSlugInicial() || '').trim();
      const vPwa = encodeURIComponent(obtenerVersionPwaGestor());
      const iconPwa192 = slugAct ? `/api/produccion/nodos/pwa/${encodeURIComponent(slugAct)}/icon-gestor-192.png?v=${vPwa}` : String(urlImg || '').trim();
      const iconPwa180 = slugAct ? `/api/produccion/nodos/pwa/${encodeURIComponent(slugAct)}/icon-gestor-180.png?v=${vPwa}` : String(urlImg || '').trim();
      if (iconPwa192) {
        let linkIcon = document.querySelector('link[rel="icon"]');
        if (!linkIcon) {
          linkIcon = document.createElement('link');
          linkIcon.rel = 'icon';
          linkIcon.type = 'image/png';
          document.head.appendChild(linkIcon);
        }
        linkIcon.href = iconPwa192;
      }
      if (iconPwa180) {
        let linkApple = document.getElementById('nodo-apple-touch-icon') || document.querySelector('link[rel="apple-touch-icon"]');
        if (!linkApple) {
          linkApple = document.createElement('link');
          linkApple.id = 'nodo-apple-touch-icon';
          linkApple.rel = 'apple-touch-icon';
          linkApple.sizes = '180x180';
          document.head.appendChild(linkApple);
        }
        linkApple.href = iconPwa180;
      }
    }

    function sincronizarManifestPwaGestor(slug, tok) {
      const cleanSlug = String(slug || '').trim();
      if (!cleanSlug) return;
      const slugEnc = encodeURIComponent(cleanSlug);
      const tokClean = String(tok || '').trim();
      const vPwa = encodeURIComponent(obtenerVersionPwaGestor());
      const href = `/api/produccion/nodos/pwa/${slugEnc}/gestor.webmanifest?${tokClean ? `t=${encodeURIComponent(tokClean)}&` : ''}v=${vPwa}`;
      let link = document.getElementById('nodo-pwa-manifest') || document.querySelector('link[rel="manifest"]');
      if (!link) {
        link = document.createElement('link');
        link.id = 'nodo-pwa-manifest';
        link.rel = 'manifest';
        document.head.appendChild(link);
      }
      if (link.getAttribute('href') !== href) {
        link.setAttribute('href', href);
      }
    }

    function esModoStandaloneActivoGestor() {
      try {
        if (window.navigator.standalone === true) return true;
        if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
        if (window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches) return true;
        if (typeof document !== 'undefined' && String(document.referrer || '').indexOf('android-app://') === 0) return true;
      } catch (_) {}
      return false;
    }

    function esModoPwaInstaladaGestor() {
      if (esModoStandaloneActivoGestor()) return true;
      if (window.__nodoGestorDeferredPrompt) return false;
      return Boolean(window.__nodoGestorInstaladoRuntime);
    }

    function actualizarVisibilidadBotonPwaGestor() {
      const ocultar = esModoPwaInstaladaGestor();
      const btnBoard = document.getElementById('btn-instalar-pwa-gestor');
      if (btnBoard) {
        btnBoard.style.display = ocultar ? 'none' : 'flex';
      }
      const btnTop = document.getElementById('btn-top-pwa-gestor');
      if (btnTop) {
        btnTop.style.display = (ocultar || !GSTATE.nodo) ? 'none' : 'inline-flex';
      }
    }
    window.actualizarVisibilidadBotonPwaGestor = actualizarVisibilidadBotonPwaGestor;

    async function verificarEstadoRealAccesoDirectoGestor() {
      try {
        if (esModoStandaloneActivoGestor()) {
          actualizarVisibilidadBotonPwaGestor();
          return true;
        }
        if (window.__nodoGestorDeferredPrompt) {
          window.__nodoGestorInstaladoRuntime = false;
          if (typeof window.limpiarBanderasObsoletasPwaGestor === 'function') {
            window.limpiarBanderasObsoletasPwaGestor();
          }
          actualizarVisibilidadBotonPwaGestor();
          return false;
        }
        if (typeof navigator !== 'undefined' && typeof navigator.getInstalledRelatedApps === 'function') {
          const slugAct = String(GSTATE.slug || detectarSlugInicial() || '').trim();
          const slugEnc = encodeURIComponent(slugAct);
          const apps = await navigator.getInstalledRelatedApps();
          const instalada = Array.isArray(apps) && apps.some(a => {
            if (!a) return false;
            const u = String(a.url || '');
            if (!u) return a.platform === 'webapp';
            if (!slugEnc) return u.includes('/gestor.webmanifest');
            return u.includes(`/pwa/${slugEnc}/gestor.webmanifest`) || u.includes(`/gestor/${slugEnc}`);
          });
          window.__nodoGestorInstaladoRuntime = instalada;
          if (!instalada && typeof window.limpiarBanderasObsoletasPwaGestor === 'function') {
            window.limpiarBanderasObsoletasPwaGestor();
          }
          actualizarVisibilidadBotonPwaGestor();
          return instalada;
        }
      } catch (_) {}
      actualizarVisibilidadBotonPwaGestor();
      return esModoPwaInstaladaGestor();
    }
    window.verificarEstadoRealAccesoDirectoGestor = verificarEstadoRealAccesoDirectoGestor;

    try {
      if (window.matchMedia) {
        const mqStandaloneGestor = window.matchMedia('(display-mode: standalone)');
        if (typeof mqStandaloneGestor.addEventListener === 'function') {
          mqStandaloneGestor.addEventListener('change', () => actualizarVisibilidadBotonPwaGestor());
        } else if (typeof mqStandaloneGestor.addListener === 'function') {
          mqStandaloneGestor.addListener(() => actualizarVisibilidadBotonPwaGestor());
        }
      }
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          verificarEstadoRealAccesoDirectoGestor();
        }
      });
      window.addEventListener('focus', () => {
        verificarEstadoRealAccesoDirectoGestor();
      });
    } catch (_) {}

    function cerrarModalPwaGestor() {
      const m = document.getElementById('modal-pwa-gestor');
      if (m) m.style.display = 'none';
    }
    window.cerrarModalPwaGestor = cerrarModalPwaGestor;

    async function instalarAccesoDirectoGestor() {
      const ua = String(navigator.userAgent || '');
      const esIos = /iphone|ipad|ipod/i.test(ua);
      const esWebView = esNavegadorEmbebidoWebViewGestor();

      if (!esWebView) {
        let promptEv = window.__nodoGestorDeferredPrompt;
        if (!promptEv && !esIos) {
          promptEv = await esperarDeferredPromptGestor(900);
        }
        if (promptEv && typeof promptEv.prompt === 'function') {
          window.__nodoGestorDeferredPrompt = null;
          let lanzadoOk = false;
          try {
            const pRes = promptEv.prompt();
            lanzadoOk = true;
            Promise.resolve(pRes).catch(() => {});
            if (promptEv.userChoice && typeof promptEv.userChoice.then === 'function') {
              promptEv.userChoice.then((choice) => {
                if (choice && choice.outcome === 'accepted') {
                  window.__nodoGestorInstaladoRuntime = true;
                  const marcaToast = String(GSTATE.nodo?.nombre_marca || 'tu tienda').trim();
                  mostrarAvisoPantallaGestor(`✓ Acceso directo "Gestión ${marcaToast}" creado en tu pantalla de inicio.`, 'ok');
                }
                actualizarVisibilidadBotonPwaGestor();
              }).catch(() => {});
            }
          } catch (_) {
            lanzadoOk = false;
          }
          if (lanzadoOk) {
            actualizarVisibilidadBotonPwaGestor();
            return;
          }
        }
      }

      const slugAct = String(GSTATE.slug || detectarSlugInicial() || '').trim();
      const nombreMarca = String(GSTATE.nodo?.nombre_marca || 'tu tienda').trim();
      const vPwa = encodeURIComponent(obtenerVersionPwaGestor());
      const iconUrl = slugAct ? `/api/produccion/nodos/pwa/${encodeURIComponent(slugAct)}/icon-gestor-180.png?v=${vPwa}` : '';

      const bodyEl = document.getElementById('modal-pwa-gestor-body');
      const modalEl = document.getElementById('modal-pwa-gestor');
      if (!bodyEl || !modalEl) return;

      const esAndroid = /android/i.test(ua);
      const chromeIntentHref = esAndroid
        ? `intent://${window.location.host}${window.location.pathname}${window.location.search}#Intent;scheme=https;package=com.android.chrome;end`
        : '';

      const cuerpoInstruccionHtml = esWebView
        ? `
          <div style="background:var(--surface-warm); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:14px; font-size:0.88rem; color:var(--text); line-height:1.42; font-weight:700;">
            Abrí este enlace en <strong>Chrome</strong> (menú <strong>⋮ → Abrir en Chrome</strong>) para agregar el acceso directo en 1 toque.
          </div>
          ${chromeIntentHref ? `
            <a href="${esc(chromeIntentHref)}" onclick="cerrarModalPwaGestor()"
              style="display:flex; align-items:center; justify-content:center; width:100%; min-height:42px; margin-bottom:8px; border-radius:11px; background:var(--brand); color:#fff; text-decoration:none; font-weight:900; font-size:0.9rem;">
              🌐 Abrir en Chrome ahora
            </a>
          ` : ''}
        `
        : (esIos
          ? `
            <div style="background:var(--surface-warm); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:14px; font-size:0.88rem; color:var(--text); line-height:1.42;">
              Tocá <strong>Compartir (ícono ⬆️ abajo en Safari)</strong> y elegí <strong>"Agregar a inicio"</strong>.
            </div>
          `
          : `
            <div style="background:var(--surface-warm); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:14px; font-size:0.87rem; color:var(--text); line-height:1.42;">
              Tocá el menú <strong>⋮</strong> de Chrome y elegí <strong>"Agregar a la pantalla principal"</strong> (si tenías un acceso directo anterior de gestión en el teléfono, quitalo primero para actualizar su ícono).
            </div>
          `);

      bodyEl.innerHTML = `
        <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;">
          <div style="display:flex; align-items:center; gap:10px;">
            ${iconUrl ? `<img src="${esc(iconUrl)}" alt="Gestión ${esc(nombreMarca)}" style="width:44px; height:44px; border-radius:11px; box-shadow:0 3px 8px rgba(0,0,0,0.16);" />` : ''}
            <div>
              <div style="font-weight:900; font-size:1rem; color:var(--text);">Gestión ${esc(nombreMarca)}</div>
              <div style="font-size:0.78rem; color:var(--brand-dark); font-weight:800;">📲 Agregar acceso directo</div>
            </div>
          </div>
          <button type="button" onclick="cerrarModalPwaGestor()" aria-label="Cerrar"
            style="border:none; background:var(--surface-warm); color:var(--text); width:32px; height:32px; border-radius:999px; font-weight:900; cursor:pointer;">✕</button>
        </div>
        ${cuerpoInstruccionHtml}
        <button type="button" class="btn-primary" style="width:100%;" onclick="cerrarModalPwaGestor()">Entendido</button>
      `;
      modalEl.style.display = 'flex';
    }

    function obtenerLogoHorizontalGestor(nodo) {
      const logos = (nodo?.tema_visual && typeof nodo.tema_visual === 'object') ? (nodo.tema_visual.logos || {}) : {};
      return logos.horizontal || '';
    }

    function obtenerLogoVerticalGestor(nodo) {
      const logos = (nodo?.tema_visual && typeof nodo.tema_visual === 'object') ? (nodo.tema_visual.logos || {}) : {};
      return logos.principal || logos.vertical || logos.horizontal || nodo?.logo_original_base64 || nodo?.logo_mono_preview_base64 || '';
    }

    function obtenerLogoIconoGestor(nodo) {
      const logos = (nodo?.tema_visual && typeof nodo.tema_visual === 'object') ? (nodo.tema_visual.logos || {}) : {};
      return logos.isotipo || logos.horizontal || nodo?.logo_original_base64 || nodo?.logo_mono_preview_base64 || '';
    }

    function aplicarPaletaNodo(hexONodo) {
      const esObj = Boolean(hexONodo && typeof hexONodo === 'object');
      const nodo = esObj ? hexONodo : null;
      const tv = (nodo?.tema_visual && typeof nodo.tema_visual === 'object') ? nodo.tema_visual : {};
      const pal = (tv.paleta && typeof tv.paleta === 'object') ? tv.paleta : {};
      const tip = (tv.tipografia && typeof tv.tipografia === 'object') ? tv.tipografia : {};
      const hexRaw = esObj ? (pal.terracota || nodo.color_primario || '#a2553b') : hexONodo;
      const clean = /^#[0-9a-fA-F]{6}$/.test(String(hexRaw || '').trim()) ? String(hexRaw).trim() : '#a2553b';
      const r = parseInt(clean.slice(1, 3), 16);
      const g = parseInt(clean.slice(3, 5), 16);
      const b = parseInt(clean.slice(5, 7), 16);
      const darkR = Math.max(0, Math.round(r * 0.78));
      const darkG = Math.max(0, Math.round(g * 0.78));
      const darkB = Math.max(0, Math.round(b * 0.78));
      const darkFallback = '#' + [darkR, darkG, darkB].map(v => v.toString(16).padStart(2, '0')).join('');

      const root = document.documentElement;
      root.style.setProperty('--brand', clean);
      root.style.setProperty('--brand-dark', /^#[0-9a-fA-F]{6}$/.test(pal.terracota_oscuro || '') ? pal.terracota_oscuro : darkFallback);
      root.style.setProperty('--brand-soft', `rgba(${r}, ${g}, ${b}, 0.11)`);
      root.style.setProperty('--brand-border', `rgba(${r}, ${g}, ${b}, 0.30)`);

      if (pal.fondo) root.style.setProperty('--bg', pal.fondo);
      if (pal.superficie_calida) root.style.setProperty('--surface-warm', pal.superficie_calida);
      if (pal.tarjeta) {
        root.style.setProperty('--surface', pal.tarjeta);
        root.style.setProperty('--surface-header', pal.tarjeta);
      }
      if (pal.texto) root.style.setProperty('--text', pal.texto);
      if (pal.texto_secundario) root.style.setProperty('--muted', pal.texto_secundario);
      if (pal.borde) root.style.setProperty('--border', pal.borde);
      if (pal.ocre) root.style.setProperty('--accent', pal.ocre);
      if (pal.amarillo_sol) root.style.setProperty('--sun', pal.amarillo_sol);
      if (pal.pistacho_texto) root.style.setProperty('--ok', pal.pistacho_texto);
      if (pal.pistacho_suave) root.style.setProperty('--ok-soft', pal.pistacho_suave);
      if (pal.pistacho) root.style.setProperty('--ok-border', pal.pistacho);
      if (tip.familia) root.style.setProperty('--font-brand', tip.familia);
    }

    function detectarSlugInicial() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('nodo')) return params.get('nodo').trim();
      const parts = window.location.pathname.split('/').filter(Boolean);
      const idx = parts.findIndex(p => p === 'gestor' || p === 'gestor-nodo');
      if (idx !== -1 && parts[idx + 1]) return decodeURIComponent(parts[idx + 1]).trim();
      return '';
    }

    function obtenerKeyStorageTokenGestor(slug) {
      return 'lamda_nodo_gestor_token_' + String(slug || '').trim().toLowerCase();
    }

    function resolverYPersistirTokenGestor(slug) {
      const cleanSlug = String(slug || '').trim();
      const params = new URLSearchParams(window.location.search);
      const tokQuery = String(params.get('t') || params.get('gestor_token') || '').trim();
      const key = obtenerKeyStorageTokenGestor(cleanSlug);

      if (tokQuery && tokQuery.length >= 16) {
        try {
          localStorage.setItem(key, tokQuery);
        } catch (_) {}
        params.delete('t');
        params.delete('gestor_token');
        const nuevaQs = params.toString();
        const nuevaUrl = window.location.pathname + (nuevaQs ? '?' + nuevaQs : '') + (window.location.hash || '');
        try {
          window.history.replaceState({}, document.title, nuevaUrl);
        } catch (_) {}
        sincronizarManifestPwaGestor(cleanSlug, tokQuery);
        return tokQuery;
      }

      try {
        const guardado = String(localStorage.getItem(key) || '').trim();
        sincronizarManifestPwaGestor(cleanSlug, guardado);
        return guardado;
      } catch (_) {
        return '';
      }
    }

    function fetchGestor(url, options = {}) {
      const tok = resolverYPersistirTokenGestor(GSTATE.slug || detectarSlugInicial());
      const headers = { ...(options.headers || {}) };
      if (typeof FormData !== 'undefined' && options.body instanceof FormData) {
        delete headers['Content-Type'];
        delete headers['content-type'];
      }
      if (tok) {
        headers['X-Nodo-Gestor-Token'] = tok;
      }
      return fetch(url, { ...options, headers });
    }

    function activarTokenManualDesdeAcceso() {
      const inp = document.getElementById('gestor-token-manual-input');
      const raw = String(inp?.value || '').trim();
      if (!raw) return;
      let tok = raw;
      try {
        if (/^https?:\/\//i.test(raw) || raw.includes('t=')) {
          const u = new URL(raw.startsWith('http') ? raw : (window.location.origin + (raw.startsWith('/') ? raw : '/?' + raw)));
          tok = String(u.searchParams.get('t') || u.searchParams.get('gestor_token') || '').trim();
        }
      } catch (_) {}
      if (!tok || tok.length < 16) {
        alert('Pegá el enlace completo del QR de Gestor o una clave válida.');
        return;
      }
      const slug = GSTATE.slug || detectarSlugInicial();
      try {
        localStorage.setItem(obtenerKeyStorageTokenGestor(slug), tok);
      } catch (_) {}
      cargarPanelGestor();
    }

    function renderizarPantallaReescanearQrGestor(esInvalido = false) {
      const box = document.getElementById('gestor-main-view');
      if (!box) return;
      box.innerHTML = `

          <h3 style="margin:0 0 10px 0; font-size:1.18rem; color:var(--text);">
            ${esInvalido ? 'Tu código QR de Gestor fue renovado' : 'Escaneá nuevamente tu QR de Gestor'}
          </h3>
          <p style="color:var(--muted); font-size:0.9rem; line-height:1.55; margin:0 0 14px 0;">
            ${esInvalido
              ? 'El acceso anterior ya no está vigente por rotación de seguridad. Pedí el código QR actualizado y escanealo con la cámara de tu celular.'
              : 'Por seguridad de tu tienda, este espacio de gestión requiere abrirse desde tu código QR personal.'}
          </p>
          <div style="background:var(--surface-warm); border:1px solid var(--border); border-radius:12px; padding:12px 14px; font-size:0.82rem; color:var(--text); line-height:1.45; text-align:left; margin-bottom:16px;">
            <strong>💡 ¿Usás iPhone o iPad ("Agregar a inicio")?</strong><br>
            Al guardar un ícono en la pantalla de inicio, iOS abre un espacio separado sin la clave previa de Safari. Escaneá tu QR de Gestor desde la cámara y volvé a guardar el ícono si lo necesitás, o pegá tu enlace de acceso acá abajo:
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <input id="gestor-token-manual-input" type="text" placeholder="Pegá acá el link completo del QR de Gestor..."
              style="flex:1; min-width:210px; padding:10px 12px; border:1px solid var(--border); border-radius:10px; font-family:inherit; font-size:0.85rem;">
            <button type="button" onclick="activarTokenManualDesdeAcceso()" class="btn-primary" style="padding:10px 16px;">
              Ingresar
            </button>
          </div>
        </div>
      `;
    }

    async function cargarPanelGestor(opciones = {}) {
      if (!GSTATE.slug) {
        renderizarPantallaReescanearQrGestor(false);
        return;
      }
      resolverYPersistirTokenGestor(GSTATE.slug);
      const [resp, respLiq] = await Promise.all([
        fetchGestor(`/api/produccion/nodos/portal/${encodeURIComponent(GSTATE.slug)}?vista=gestor`, { cache: 'no-store' }),
        fetchGestor(`/api/produccion/nodos/liquidacion/tablero?nodo_slug=${encodeURIComponent(GSTATE.slug)}`, { cache: 'no-store' })
      ]);
      const data = await leerRespuestaJsonSegura(resp);
      if (resp.status === 401 || resp.status === 403 || data.code === 'GESTOR_TOKEN_REQUIRED' || data.code === 'GESTOR_TOKEN_INVALID' || data.code === 'GESTOR_WRONG_NODE') {
        const esInvalido = data.code === 'GESTOR_TOKEN_INVALID' || data.code === 'GESTOR_WRONG_NODE';
        if (esInvalido) {
          try { localStorage.removeItem(obtenerKeyStorageTokenGestor(GSTATE.slug)); } catch (_) {}
        }
        renderizarPantallaReescanearQrGestor(esInvalido);
        return;
      }
      if (!data.ok) {
        const box = document.getElementById('gestor-main-view');
        if (box) {
          box.innerHTML = `
            <div class="card" style="text-align:center; padding:32px;">
              <h3 style="margin:0 0 8px 0;">Gestión comercial no disponible</h3>
              <p style="color:var(--muted); font-size:0.9rem; max-width:480px; margin:0 auto;">
                Verificá que tu enlace de gestión esté actualizado o escaneá nuevamente tu código QR personal.
              </p>
            </div>
          `;
        }
        return;
      }
      try {
        const dataLiq = await respLiq.json();
        if (dataLiq && dataLiq.ok) GSTATE.liquidacionTablero = dataLiq;
      } catch (_) {}

      GSTATE.nodo = data.nodo;
      GSTATE.slug = data.nodo.slug;
      try {
        localStorage.setItem('lamda_nodo_dispositivo_rol', 'GESTOR');
        localStorage.setItem('lamda_nodo_dispositivo_etiqueta', `Gestor ${data.nodo.nombre_marca || data.nodo.slug}`);
      } catch (_) {}
      GSTATE.modoLaboratorio = Boolean(data.modo_laboratorio);
      GSTATE.telefonoPruebas = String(data.telefono_whatsapp_pruebas || '5492216615746');
      GSTATE.proximaEntrega = data.proxima_entrega;
      GSTATE.ofertas = data.todas_ofertas_gestor || [];
      GSTATE.catalogoBaseDisponible = Array.isArray(data.catalogo_base_disponible) ? data.catalogo_base_disponible : [];
      GSTATE.propuestas = data.propuestas_nodo || [];
      GSTATE.pedidos = data.pedidos_nodo || [];
      GSTATE.movimientosCtaCte = data.movimientos_cta_cte || [];
      GSTATE.liquidacionesNodo = Array.isArray(data.liquidaciones_nodo) ? data.liquidaciones_nodo : [];
      GSTATE.ingredientesDisponibles = Array.isArray(data.ingredientes_sugeribles) ? data.ingredientes_sugeribles : [];
      GSTATE.compartirKit = null;

      try {
        const respComp = await fetchGestor(`/api/produccion/nodos/gestor/${Number(GSTATE.nodo.id)}/compradores`, { cache: 'no-store' });
        const dataComp = await leerRespuestaJsonSegura(respComp);
        if (respComp.ok && dataComp.ok) {
          GSTATE.compradores = Array.isArray(dataComp.compradores) ? dataComp.compradores : [];
          GSTATE.compradoresResumen = dataComp.resumen || {
            total_compradores: GSTATE.compradores.length,
            con_pedido_activo: GSTATE.compradores.filter(c => c.tiene_pedido_en_curso).length,
            recurrentes: GSTATE.compradores.filter(c => c.es_recurrente).length
          };
          GSTATE.compradoresCargados = true;
        }
      } catch (_) {}

      // Precargar kit de difusión público en segundo plano (sin bloquear UI)
      cargarKitCompartirGestor(false).catch(() => {});

      if (opciones.resetPropuesta) {
        reiniciarFormularioPropuestaGestor({ conservarConfirmacion: true });
      } else if (GSTATE.ingredientesDisponibles.length > 0 && GSTATE.propCategoriaSel) {
        const cats = Array.from(new Set(GSTATE.ingredientesDisponibles.map(i => i.categoria_gestor)));
        if (!cats.includes(GSTATE.propCategoriaSel)) {
          reiniciarFormularioPropuestaGestor();
        }
      }

      aplicarPaletaNodo(GSTATE.nodo);
      aplicarFaviconGestor(obtenerLogoIconoGestor(GSTATE.nodo));

      const nombreMarcaHdr = GSTATE.nodo.nombre_marca || 'Mi Tienda';
      const bajadaMarcaHdr = String(GSTATE.nodo.bajada_marca || '').trim();
      const tituloCompletoHdr = bajadaMarcaHdr ? `${nombreMarcaHdr} · ${bajadaMarcaHdr}` : nombreMarcaHdr;
      const logoHorizHdr = obtenerLogoHorizontalGestor(GSTATE.nodo);
      const logoIncluyeTextoHdr = Boolean(logoHorizHdr && GSTATE.nodo.tema_visual?.logo_incluye_texto);

      const titleEl = document.getElementById('gestor-nodo-title');
      if (titleEl) titleEl.textContent = `Gestión ${nombreMarcaHdr}`;

      const subEl = document.getElementById('gestor-nodo-subtitle');
      if (subEl) {
        if (esPerfilEcommerceGestor(GSTATE.nodo)) {
          const partesEc = [];
          if (logoIncluyeTextoHdr) partesEc.push(`Gestión ${nombreMarcaHdr}`);
          partesEc.push(tMarca(GSTATE.nodo, 'subtitulo_cabecera'));
          subEl.textContent = partesEc.join(' · ');
        } else {
          const partes = [logoIncluyeTextoHdr ? `Gestión ${nombreMarcaHdr}` : 'Gestión comercial'];
          if (GSTATE.nodo.barrio_zona || GSTATE.nodo.direccion_retiro) {
            partes.push(`📍 ${GSTATE.nodo.barrio_zona || GSTATE.nodo.direccion_retiro}`);
          }
          subEl.textContent = partes.join(' · ');
        }
      }

      const btnCopyTop = document.getElementById('btn-top-copiar-link-tienda');
      if (btnCopyTop) {
        btnCopyTop.textContent = tMarca(GSTATE.nodo, 'btn_copiar_link');
      }

      const logoBox = document.getElementById('gestor-logo-box');
      if (logoBox) {
        const logoFallback = GSTATE.nodo.logo_original_base64 || GSTATE.nodo.logo_mono_preview_base64 || obtenerLogoIconoGestor(GSTATE.nodo) || '';
        const logoSrc = logoHorizHdr || logoFallback;
        logoBox.classList.toggle('has-horizontal-logo', Boolean(logoHorizHdr));
        logoBox.closest('.brand-identity')?.classList.toggle('logo-includes-text', logoIncluyeTextoHdr);
        if (logoSrc) {
          logoBox.innerHTML = `<img src="${esc(logoSrc)}" alt="${esc(tituloCompletoHdr)}">`;
        } else {
          const siglas = String(nombreMarcaHdr || 'GT').split(/\s+/).map(w => w[0] || '').join('').substring(0, 2).toUpperCase();
          logoBox.innerHTML = `<div class="brand-monogram">${esc(siglas)}</div>`;
        }
      }

      sincronizarTituloYMetaPwaGestor(nombreMarcaHdr);

      const btnTienda = document.getElementById('btn-abrir-tienda');
      if (btnTienda) btnTienda.href = `/tienda/${encodeURIComponent(GSTATE.slug)}`;

      renderVistaGestor();
      actualizarVisibilidadBotonPwaGestor();
      verificarEstadoRealAccesoDirectoGestor();
    }

    function abrirSeccionGestor(seccion) {
      const mod = obtenerModulosActivosGestor();
      if (seccion === 'reparto' && (!mod.hoja_de_ruta || esPerfilEcommerceGestor())) {
        seccion = 'inicio';
      }
      if (seccion === 'propuestas' && GSTATE.vista !== 'propuestas') {
        reiniciarFormularioPropuestaGestor();
      }
      GSTATE.vista = seccion;
      try {
        window.history.pushState({ vista: seccion }, '', `#${seccion}`);
      } catch (_) {}
      renderVistaGestor();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function volverAlTableroGestor() {
      GSTATE.vista = 'inicio';
      try {
        window.history.replaceState({ vista: 'inicio' }, '', window.location.pathname + window.location.search);
      } catch (_) {}
      renderVistaGestor();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('popstate', () => {
      const hash = (window.location.hash || '').replace(/^#/, '');
      const mod = obtenerModulosActivosGestor();
      if (hash === 'reparto' && (!mod.hoja_de_ruta || esPerfilEcommerceGestor())) {
        GSTATE.vista = 'inicio';
      } else if (['reparto', 'ofertas', 'propuestas', 'logistica', 'pedidos', 'ctacte', 'liquidacion', 'compradores'].includes(hash)) {
        GSTATE.vista = hash;
      } else {
        GSTATE.vista = 'inicio';
      }
      renderVistaGestor();
    });

          <button type="button" class="btn-back" onclick="volverAlTableroGestor()">

      const mod = obtenerModulosActivosGestor();
      const esEc = esPerfilEcommerceGestor();

        : 0;

        },

          id: 'propuestas',

            ? `${propPendientes} solicitud${propPendientes === 1 ? '' : 'es'} en cotización`
            : 'Solicitar nuevos productos o presentaciones'
        },

          num: '3',
          id: 'logistica',

          meta: metaLogistica
        },
        {

    async function cargarKitCompartirGestor(forzar = false) {
      if (!GSTATE.nodo?.id) return null;
      if (GSTATE.compartirKit && !forzar) return GSTATE.compartirKit;
      GSTATE.aficheQrDataUrl = '';
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${Number(GSTATE.nodo.id)}/compartir-kit`, { cache: 'no-store' });
        const data = await leerRespuestaJsonSegura(resp);
        if (resp.ok && data.ok) {
          GSTATE.compartirKit = data;
          construirAficheQrMarcaBlancaDataUrl().catch(() => {});
          return data;
        }
      } catch (_) {}
      return null;
    }

    function obtenerOfertasPublicadasDifusion() {
      const kitOfertas = Array.isArray(GSTATE.compartirKit?.ofertas_publicadas)
        ? GSTATE.compartirKit.ofertas_publicadas
        : [];
      if (kitOfertas.length > 0) return kitOfertas;

      const base = obtenerUrlBaseTiendaFallback();
      return (GSTATE.ofertas || [])
        .filter(o => o.publicado_tienda)
        .map(o => ({
          oferta_id: Number(o.id),
          sku_nodo: o.sku_nodo || '',
          nombre_publico: String(o.nombre_vidriera_efectivo || o.nombre_vidriera_personalizado || o.nombre_oficial_lamda || o.nombre_publico || 'Producto').trim(),
          categoria_familiar: String(o.categoria_vidriera_efectiva || o.categoria_vidriera_personalizada || o.categoria_oficial_lamda || o.categoria_familiar || 'Almacén').trim(),
          presentacion_etiqueta: o.presentacion_etiqueta || '',
          kilos_unidad: Number(o.kilos_unidad || 0),
          precio_venta_vecino: Number(o.precio_venta_vecino || 0),
          destacado_tienda: Boolean(o.destacado_tienda),
          url_directa: `${base}?oferta=${Number(o.id)}`
        }));
    }

    function obtenerUrlBaseTiendaFallback() {
      if (GSTATE.compartirKit?.url_tienda_publica) {
        return GSTATE.compartirKit.url_tienda_publica;
      }
      return `${window.location.origin}/tienda/${encodeURIComponent(GSTATE.slug || '')}`;
    }

    function obtenerUrlDifusionActual() {
      const base = obtenerUrlBaseTiendaFallback();
      if (GSTATE.difusionModo === 'oferta') {
        const ofertas = obtenerOfertasPublicadasDifusion();
        const of = ofertas.find(o => Number(o.oferta_id) === Number(GSTATE.difusionOfertaId)) || ofertas[0];
        if (of) {
          return of.url_directa || `${base}?oferta=${Number(of.oferta_id)}`;
        }
      }
      return base;
    }

    function generarTextoSugeridoDifusion() {
      const nodoKit = GSTATE.compartirKit?.nodo || GSTATE.nodo || {};
      const nombreMarca = nodoKit.nombre_marca || 'Nuestra tienda';
      const bajadaMarca = String(nodoKit.bajada_marca || '').trim();
      const encabezadoMarca = bajadaMarca ? `${nombreMarca} · ${bajadaMarca}` : nombreMarca;
      const url = obtenerUrlDifusionActual();
      const prox = GSTATE.compartirKit?.proxima_entrega?.asignada?.label_completo
        || GSTATE.proximaEntrega?.asignada?.label_completo
        || '';
      const corte = GSTATE.compartirKit?.proxima_entrega?.asignada?.label_corte
        || GSTATE.proximaEntrega?.asignada?.label_corte
        || '';

      if (esPerfilEcommerceGestor(nodoKit)) {
        const slaTxt = nodoKit.config_paqueteria?.sla_despacho_label || 'Despacho en 24 a 48 hs hábiles';
        const gratisTxt = (nodoKit.config_paqueteria?.envio_gratis_activo && Number(nodoKit.config_paqueteria?.envio_gratis_desde_monto) > 0)
          ? `🎁 Envío bonificado desde ${fmt(nodoKit.config_paqueteria.envio_gratis_desde_monto)}`
          : '';
        if (GSTATE.difusionModo === 'oferta') {
          const ofertas = obtenerOfertasPublicadasDifusion();
          const of = ofertas.find(o => Number(o.oferta_id) === Number(GSTATE.difusionOfertaId)) || ofertas[0];
          if (of) {
            const pres = String(of.presentacion_etiqueta || '').trim();
            const descPres = pres && !String(of.nombre_publico || '').toLowerCase().includes(pres.toLowerCase()) ? ` (${pres})` : '';
            return [
              `✨ *${encabezadoMarca}*`,
              `¡Hola! Mirá esta opción disponible en nuestra tienda online: *${of.nombre_publico}${descPres}* a *${fmt(of.precio_venta_vecino)}* 🛒`,
              url,
              `🚚 Envíos a todo el país (${slaTxt})`,
              gratisTxt
            ].filter(Boolean).join('\n');
          }
        }
        return [
          `✨ *${encabezadoMarca}*`,
          `¡Hola! Te comparto nuestra tienda online con envíos a todo el país:`,
          url,
          `🚚 ${slaTxt}`,
          gratisTxt
        ].filter(Boolean).join('\n');
      }

      if (GSTATE.difusionModo === 'oferta') {
        const ofertas = obtenerOfertasPublicadasDifusion();
        const of = ofertas.find(o => Number(o.oferta_id) === Number(GSTATE.difusionOfertaId)) || ofertas[0];
        if (of) {
          const pres = String(of.presentacion_etiqueta || '').trim();
          const descPres = pres && !String(of.nombre_publico || '').toLowerCase().includes(pres.toLowerCase())
            ? ` (${pres})`
            : '';
          return [
            `✨ *${encabezadoMarca}*`,
            `¡Hola! Te comparto esta opción disponible hoy: *${of.nombre_publico}${descPres}* a *${fmt(of.precio_venta_vecino)}* 🛒`,
            `Podés ver detalles y pedirlo directo acá:`,
            url,
            prox ? `📅 Próxima entrega: ${prox}${corte ? ` · Cierre: ${corte}` : ''}` : ''
          ].filter(Boolean).join('\n');
        }
      }

      return [
        `✨ *${encabezadoMarca}*`,
        `¡Hola! Te comparto el link de nuestra tienda para ver los productos disponibles y hacer tu pedido online:`,
        url,
        prox ? `📅 *Próxima entrega:* ${prox}` : '',
        corte ? `⏰ *Cierre de pedidos:* ${corte}` : '',
        `💬 Si querés consultar o sumar algo, respondeme por acá.`
      ].filter(Boolean).join('\n');
    }

    function copiarLinkTiendaVecinos() {
      const url = obtenerUrlBaseTiendaFallback();
      navigator.clipboard?.writeText(url)
        .then(() => mostrarAvisoPantallaGestor(`✅ Link de tu tienda copiado: ${url}`, 'ok'))
        .catch(() => abrirModalDifusionTienda(0));

        actionsBox.innerHTML = `
          <button type="button" onclick="cerrarModalReciboGestor()" class="btn-primary" style="width:100%;">
            Cerrar
          </button>
        `;

    function abrirModalDifusionTienda(ofertaIdInicial = 0) {
      if (!GSTATE.nodo) return;
      const modal = document.getElementById('modal-recibo-gestor');
      const body = document.getElementById('modal-recibo-gestor-body');
      if (!modal || !body) return;

      const ofertasPub = obtenerOfertasPublicadasDifusion();
      if (Number(ofertaIdInicial) > 0) {
        GSTATE.difusionModo = 'oferta';
        GSTATE.difusionOfertaId = Number(ofertaIdInicial);
      } else {
        GSTATE.difusionModo = 'tienda';
        if (!GSTATE.difusionOfertaId && ofertasPub[0]) {
          GSTATE.difusionOfertaId = Number(ofertasPub[0].oferta_id);
        }
      }

      renderizarCuerpoModalDifusion(false);
      modal.style.display = 'flex';

      if (!GSTATE.compartirKit) {
        cargarKitCompartirGestor(false).then(() => {
          const modalActual = document.getElementById('modal-recibo-gestor');
          if (modalActual && modalActual.style.display !== 'none') {
            renderizarCuerpoModalDifusion(false);
          }
        });
      }
    }

    function renderizarCuerpoModalDifusion(mostrarQrGrande = false) {
      const body = document.getElementById('modal-recibo-gestor-body');
      if (!body || !GSTATE.nodo) return;

      const nodoModal = GSTATE.compartirKit?.nodo || GSTATE.nodo || {};
      const nombreMarca = nodoModal.nombre_marca || 'Tu Tienda';
      const bajadaMarca = String(nodoModal.bajada_marca || '').trim();
      const tituloMarcaModal = bajadaMarca ? `${nombreMarca} · ${bajadaMarca}` : nombreMarca;
      const qrDataUrl = GSTATE.compartirKit?.qr_tienda_data_url || '';
      const logoVerticalPreview = obtenerLogoVerticalGestor(nodoModal);
      const aficheSrc = GSTATE.aficheQrDataUrl || '';
      const ofertasPub = obtenerOfertasPublicadasDifusion();
      if (GSTATE.difusionModo === 'oferta' && ofertasPub.length > 0) {
        const existeSel = ofertasPub.some(o => Number(o.oferta_id) === Number(GSTATE.difusionOfertaId));
        if (!existeSel) {
          GSTATE.difusionOfertaId = Number(ofertasPub[0].oferta_id);

    function _cargarImagenCanvasGestor(src) {
      return new Promise(resolve => {
        if (!src) return resolve(null);
        const img = new Image();
        img.crossOrigin = 'anonymous';
        const timer = setTimeout(() => resolve(null), 3500);
        img.onload = () => {
          clearTimeout(timer);
          resolve(img.naturalWidth > 0 ? img : null);
        };
        img.onerror = () => {
          clearTimeout(timer);
          resolve(null);
        };
        img.src = src;
      });
    }

    function _trazarRoundRectGestor(ctx, x, y, w, h, r) {
      const rad = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rad, y);
      ctx.arcTo(x + w, y, x + w, y + h, rad);
      ctx.arcTo(x + w, y + h, x, y + h, rad);
      ctx.arcTo(x, y + h, x, y, rad);
      ctx.arcTo(x, y, x + w, y, rad);
      ctx.closePath();
    }

    async function construirAficheQrMarcaBlancaDataUrl() {
      const qrDataUrl = GSTATE.compartirKit?.qr_tienda_data_url || '';
      if (!qrDataUrl) return '';
      if (GSTATE.aficheQrDataUrl) return GSTATE.aficheQrDataUrl;

      const nodoInfo = GSTATE.compartirKit?.nodo || GSTATE.nodo || {};
      const tv = (nodoInfo.tema_visual && typeof nodoInfo.tema_visual === 'object') ? nodoInfo.tema_visual : {};
      const pal = (tv.paleta && typeof tv.paleta === 'object') ? tv.paleta : {};
      const bgOuter = pal.superficie_calida || '#F5EFE6';
      const cardBg = pal.tarjeta || '#FFFFFF';
      const accent = pal.terracota || nodoInfo.color_primario || '#a2553b';
      const ocre = pal.ocre || accent;
      const pistachoBg = pal.pistacho_suave || '#EFF4DF';
      const pistachoTxt = pal.pistacho_texto || '#43521D';
      const txtPrimary = pal.texto || '#25130b';
      const txtMuted = pal.texto_secundario || '#57453b';
      const borderCol = pal.borde || '#E7DCCB';
      const fontStack = "'Nunito', 'Segoe UI', Roboto, Arial, sans-serif";

      const verticalSrc = obtenerLogoVerticalGestor(nodoInfo);
      const [qrImg, logoImg] = await Promise.all([
        _cargarImagenCanvasGestor(qrDataUrl),
        _cargarImagenCanvasGestor(verticalSrc)
      ]);
      if (!qrImg) return qrDataUrl;

      const W = 900;
      const H = 1220;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');
      if (!ctx) return qrDataUrl;

      ctx.fillStyle = bgOuter;
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      _trazarRoundRectGestor(ctx, 44, 44, W - 88, H - 88, 38);
      ctx.fillStyle = cardBg;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = borderCol;
      ctx.stroke();
      ctx.clip();

      const grad = ctx.createLinearGradient(44, 44, W - 44, 44);
      grad.addColorStop(0, accent);
      grad.addColorStop(1, ocre);
      ctx.fillStyle = grad;
      ctx.fillRect(44, 44, W - 88, 18);
      ctx.restore();

      const nombreMarca = String(nodoInfo.nombre_marca || 'Tu Tienda').trim();
      const bajadaMarca = String(nodoInfo.bajada_marca || '').trim();
      const barrio = String(nodoInfo.barrio_zona || '').trim();
      let cursorY = 96;

      if (logoImg) {
        const maxW = 480;
        const maxH = 270;
        const scale = Math.min(maxW / logoImg.naturalWidth, maxH / logoImg.naturalHeight);
        const dw = Math.round(logoImg.naturalWidth * scale);
        const dh = Math.round(logoImg.naturalHeight * scale);
        ctx.drawImage(logoImg, Math.round((W - dw) / 2), cursorY, dw, dh);
        cursorY += dh + 22;
      } else {
        ctx.fillStyle = txtPrimary;
        ctx.textAlign = 'center';
        ctx.font = `900 54px ${fontStack}`;
        ctx.fillText(nombreMarca, W / 2, cursorY + 72, W - 160);
        cursorY += 106;
        if (bajadaMarca) {
          ctx.fillStyle = txtMuted;
          ctx.font = `700 28px ${fontStack}`;
          ctx.fillText(bajadaMarca, W / 2, cursorY + 12, W - 160);
          cursorY += 46;
        }
      }

      const esEcAfiche = esPerfilEcommerceGestor(nodoInfo);
      const subPill = esEcAfiche
        ? (bajadaMarca && logoImg ? `${nombreMarca} · ${bajadaMarca}` : '🚚 Tienda Oficial · Envíos a Todo el País')
        : (bajadaMarca && logoImg
            ? (barrio ? `${nombreMarca} · ${bajadaMarca} · 📍 ${barrio}` : `${nombreMarca} · ${bajadaMarca}`)
            : (barrio ? `📍 ${barrio} · Tienda Barrial Online` : '🛒 Tienda Barrial Online'));
      ctx.font = `800 24px ${fontStack}`;
      const pillW = Math.min(W - 140, Math.round(ctx.measureText(subPill).width) + 56);
      const pillX = Math.round((W - pillW) / 2);
      _trazarRoundRectGestor(ctx, pillX, cursorY, pillW, 48, 24);
      ctx.fillStyle = pistachoBg;
      ctx.fill();
      ctx.fillStyle = pistachoTxt;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(subPill, W / 2, cursorY + 25, pillW - 32);
      cursorY += 76;

      const qrFrameSize = 540;
      const qrFrameX = Math.round((W - qrFrameSize) / 2);
      _trazarRoundRectGestor(ctx, qrFrameX, cursorY, qrFrameSize, qrFrameSize, 28);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = borderCol;
      ctx.stroke();

      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(qrImg, qrFrameX + 24, cursorY + 24, qrFrameSize - 48, qrFrameSize - 48);
      ctx.imageSmoothingEnabled = true;
      cursorY += qrFrameSize + 34;

      const ctaW = 660;
      const ctaX = Math.round((W - ctaW) / 2);
      _trazarRoundRectGestor(ctx, ctaX, cursorY, ctaW, 68, 18);
      ctx.fillStyle = accent;
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = `900 28px ${fontStack}`;
      ctx.textBaseline = 'middle';
      ctx.fillText('Escaneá el QR para hacer tu pedido', W / 2, cursorY + 35, ctaW - 36);
      cursorY += 102;

      const urlPublica = obtenerUrlBaseTiendaFallback();
      ctx.fillStyle = txtMuted;
      ctx.font = `700 22px ${fontStack}`;
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(urlPublica, W / 2, cursorY, W - 130);

      try {
        const out = canvas.toDataURL('image/png');
        GSTATE.aficheQrDataUrl = out;
        return out;
      } catch (_) {
        return qrDataUrl;
      }
    }

    function formatearItemVecinoGestor(it) {
      const nom = String(it?.nombre_vidriera_vecino || it?.nombre_publico || '').trim() || 'Producto';
      const pres = String(it?.presentacion_etiqueta || '').trim();
      if (!pres) return nom;
      return nom.toLowerCase().includes(pres.toLowerCase()) ? nom : `${nom} (${pres})`;
    }

    function formatearItemGestor(it) {
      const sku = String(it?.sku_nodo || '').trim();
      const nomOficial = String(it?.nombre_oficial_lamda || it?.nombre_publico || '').trim() || 'Producto';
      const baseTecnica = sku && !nomOficial.startsWith(`[${sku}]`)
        ? `[${sku}] ${nomOficial}`
        : nomOficial;
      const nomVidriera = String(it?.nombre_vidriera_vecino || '').trim();
      if (nomVidriera && nomVidriera.toLowerCase() !== nomOficial.toLowerCase()) {
        return `${baseTecnica} (Vidriera: "${nomVidriera}")`;
      }
      return baseTecnica;
    }

    async function enviarWhatsAppVecinoPedidoPrueba(pedidoId) {
      const p = (GSTATE.pedidos || []).find(x => Number(x.id) === Number(pedidoId));
      if (!p || !GSTATE.nodo) return;
      const esEcWa = esPerfilEcommerceGestor(GSTATE.nodo);
      const itemsTxt = (p.items || []).map(it => `• ${it.cantidad}x ${formatearItemVecinoGestor(it)} (${fmt(it.subtotal_vecino)})`).join('\n');
      const linkSeg = obtenerUrlSeguimientoPedidoGestor(p);
      const lineaEnvioWa = esEcWa
        ? `🚚 Envío postal: ${Number(p.cargo_envio_barrial) > 0 ? fmt(p.cargo_envio_barrial) : 'Bonificado'} (${p.direccion_entrega || ''})`
        : (Number(p.cargo_envio_barrial) > 0 ? `🛵 Envío barrial: ${fmt(p.cargo_envio_barrial)}` : `🏠 Retiro: ${GSTATE.nodo.direccion_retiro || ''}`);
      const mensaje = [
        `🌿 *${GSTATE.nodo.nombre_marca}* — Pedido #${p.codigo_pedido}`,
        `¡Hola ${p.vecino_nombre}! Te compartimos el detalle y estado de tu compra:`,
        itemsTxt,
        lineaEnvioWa,
        `💰 *Total:* ${fmt(p.total_vecino)} (${p.medio_pago === 'EFECTIVO' ? 'Efectivo en entrega' : `Transferencia al alias ${GSTATE.nodo.alias_bancario_display || ''}`})`,
        `📅 *Despacho / Entrega:* ${p.fecha_entrega_label}`,
        linkSeg ? `📍 *Seguí tu pedido acá:* ${linkSeg}` : ''
      ].filter(Boolean).join('\n');

      await abrirModalDespachoWhatsAppGestor({
        destinatario_nombre: p.vecino_nombre,
        telefono_original: p.vecino_telefono,
        mensaje,
        titulo: `Detalle Pedido #${p.codigo_pedido}`,

    // -------------------------------------------------------------------------
    // 1. MI OFERTA Y MÁRGENES (PESTAÑAS ACTIVOS / DESACTIVADOS / TODOS + CATEGORÍAS)
    // -------------------------------------------------------------------------
    function obtenerCategoriaEfectivaOfertaGestor(of) {
      return String(
        of?.categoria_vidriera_personalizada ||
        of?.categoria_vidriera_efectiva ||
        of?.categoria_oficial_lamda ||
        of?.categoria_familiar ||
        'Almacén'
      ).trim() || 'Almacén';
    }

    function claveCategoriaOfertaGestor(catTxt) {
      return normalizarTextoGestor(String(catTxt || '').trim()).replace(/\s+/g, ' ').trim();
    }

    function obtenerCategoriasDisponiblesOfertasGestor() {
      const mapa = new Map();
      for (const itemOf of (GSTATE.ofertas || [])) {
        const label = obtenerCategoriaEfectivaOfertaGestor(itemOf);
        const key = claveCategoriaOfertaGestor(label);
        if (!key) continue;
        if (!mapa.has(key)) {
          mapa.set(key, { key, label, count: 0 });
        }
        mapa.get(key).count += 1;
      }
      return Array.from(mapa.values()).sort((a, b) => a.label.localeCompare(b.label, 'es-AR'));
    }

    function asegurarEstadoFiltrosOfertasGestor() {
      if (!['ACTIVOS', 'DESACTIVADOS', 'TODOS'].includes(GSTATE.ofertasEstadoTab)) {
        GSTATE.ofertasEstadoTab = 'TODOS';
      }
      if (GSTATE.ofertasCategoriaSel && GSTATE.ofertasCategoriaSel !== 'TODAS') {
        const cats = obtenerCategoriasDisponiblesOfertasGestor();
        if (!cats.some(c => c.key === GSTATE.ofertasCategoriaSel)) {
          GSTATE.ofertasCategoriaSel = 'TODAS';
        }
      } else {
        GSTATE.ofertasCategoriaSel = 'TODAS';
      }
    }

    function obtenerOfertasFiltradasGestor() {
      asegurarEstadoFiltrosOfertasGestor();
      const tab = GSTATE.ofertasEstadoTab || 'TODOS';
      const catKeySel = GSTATE.ofertasCategoriaSel || 'TODAS';
      const terminos = normalizarTextoGestor(GSTATE.ofertasBusquedaTexto || '')
        .split(/\s+/)
        .filter(Boolean);

      return (GSTATE.ofertas || [])
        .filter(of => {
          if (tab === 'ACTIVOS' && !of.publicado_tienda) return false;
          if (tab === 'DESACTIVADOS' && Boolean(of.publicado_tienda)) return false;
          if (catKeySel !== 'TODAS') {
            if (claveCategoriaOfertaGestor(obtenerCategoriaEfectivaOfertaGestor(of)) !== catKeySel) {
              return false;
            }
          }
          if (terminos.length > 0) {
            const bolsa = normalizarTextoGestor([
              of.sku_nodo,
              of.nombre_oficial_lamda,
              of.nombre_publico,
              of.nombre_vidriera_personalizado,
              of.nombre_vidriera_efectivo,
              of.categoria_oficial_lamda,
              of.categoria_familiar,
              of.categoria_vidriera_personalizada,
              of.categoria_vidriera_efectiva,
              of.bunker_rubro,
              of.bunker_subrubro,
              of.presentacion_etiqueta,
              ...(Array.isArray(of.ingredientes_comerciales) ? of.ingredientes_comerciales : [])
            ].filter(Boolean).join(' '));
            for (const t of terminos) {
              if (!bolsa.includes(t)) return false;
            }
          }
          return true;
        })
        .slice()
        .sort((a, b) => {
          if (tab === 'TODOS' && Boolean(a.publicado_tienda) !== Boolean(b.publicado_tienda)) {
            return a.publicado_tienda ? -1 : 1;
          }
          return 0;
        });
    }

      return `

        <button type="button" id="tab-ofertas-desactivados" data-tab="DESACTIVADOS"

      }

    function seleccionarTabEstadoOfertasGestor(nuevoTab) {
      GSTATE.ofertasEstadoTab = ['ACTIVOS', 'DESACTIVADOS', 'TODOS'].includes(nuevoTab) ? nuevoTab : 'TODOS';
      refrescarControlesOfertasEnDom();

    function seleccionarCategoriaOfertasGestor(catKey) {
      GSTATE.ofertasCategoriaSel = catKey || 'TODAS';
      refrescarControlesOfertasEnDom();
    }

    function filtrarTextoOfertasGestor(valor) {
      GSTATE.ofertasBusquedaTexto = String(valor || '');

      if (listEl) listEl.innerHTML = renderizarListadoTarjetasOfertasHtml();
      const clearBtn = document.getElementById('ofertas-clear-search');
      if (clearBtn) {
        clearBtn.style.display = GSTATE.ofertasBusquedaTexto.trim() ? 'inline-flex' : 'none';
      }

      GSTATE.ofertasBusquedaTexto = '';

      if (inp) {
        inp.value = '';
        inp.focus();
      }
      filtrarTextoOfertasGestor('');

    function limpiarFiltrosOfertasGestor() {
      GSTATE.ofertasCategoriaSel = 'TODAS';
      GSTATE.ofertasBusquedaTexto = '';
      if (GSTATE.ofertasEstadoTab === 'ACTIVOS' && !(GSTATE.ofertas || []).some(o => Boolean(o.publicado_tienda))) {
        GSTATE.ofertasEstadoTab = 'TODOS';
      } else if (GSTATE.ofertasEstadoTab === 'DESACTIVADOS' && !(GSTATE.ofertas || []).some(o => !o.publicado_tienda)) {

      refrescarControlesOfertasEnDom();

                    </div>
