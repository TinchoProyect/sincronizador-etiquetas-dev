<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel del Gestor</title>
  <!-- /lamda-cloud-runtime.js omitido en apps externas de Nodos (Marca Blanca) -->
  <script>
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        }).catch(function(){});
      }
      localStorage.removeItem('lamda_prefer_mobile_home');
    } catch (_) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #a2553b;
      --brand-dark: #7d3e28;
      --brand-soft: rgba(162, 85, 59, 0.10);
      --brand-border: rgba(162, 85, 59, 0.28);
      --bg: #faf7f3;
      --surface: #ffffff;
      --surface-warm: #f5efe8;
      --text: #3e2519;
      --muted: #7d6a5f;
      --border: #eae1d7;
      --ok: #2f6f4e;
      --ok-soft: #eaf4ee;
      --warn: #a16207;
      --warn-soft: #fef6e4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 48px;
      -webkit-font-smoothing: antialiased;
    }

    /* Encabezado claro, cálido y austero */
    .top-bar {
      background: #fffdfb;
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .top-inner {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand-identity {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }
    .brand-emblem {
      width: 52px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .brand-emblem img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .brand-monogram {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--brand-soft);
      border: 1px solid var(--brand-border);
      color: var(--brand-dark);
      font-weight: 900;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-title {
      font-size: 1.24rem;
      font-weight: 900;
      color: var(--text);
      line-height: 1.15;
      letter-spacing: -0.01em;
    }
    .brand-subtitle {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 700;
      margin-top: 2px;
    }

    .top-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn-top {
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 800;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-top:hover {
      background: var(--surface-warm);
    }
    .btn-top.brand {
      background: var(--brand);
      border-color: var(--brand);
      color: #ffffff;
    }
    .btn-top.brand:hover {
      background: var(--brand-dark);
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    /* Tablero Principal Austero de 6 Bloques */
    .board-intro {
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 700;
      margin: 0 0 14px 2px;
    }
    .blocks-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }
    .block-btn {
      width: 100%;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
      cursor: pointer;
      font-family: inherit;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: 0 2px 8px rgba(62, 37, 25, 0.03);
      transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .block-btn:hover, .block-btn:active {
      border-color: var(--brand-border);
      box-shadow: 0 4px 14px rgba(62, 37, 25, 0.07);
      transform: translateY(-1px);
    }
    .block-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .block-num {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--brand-soft);
      color: var(--brand-dark);
      font-weight: 900;
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .block-title {
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.25;
    }
    .block-meta {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
      margin-top: 2px;
    }
    .block-arrow {
      font-size: 1.35rem;
      color: var(--brand);
      font-weight: 800;
      flex-shrink: 0;
      line-height: 1;
    }

    /* Cabecera de Navegación Interna al abrir un Bloque */
    .section-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-back:hover {
      background: var(--surface-warm);
    }
    .section-heading {
      margin: 0 0 14px 0;
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--text);
    }

    /* Tarjetas y Controles Internos */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(62, 37, 25, 0.025);
    }
    .input-sm {
      padding: 8px 11px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fffdfb;
      color: var(--text);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      outline: none;
    }
    .input-sm:focus {
      border-color: var(--brand);
    }
    .btn-primary {
      background: var(--brand);
      color: #ffffff;
      border: none;
      padding: 11px 18px;
      border-radius: 11px;
      font-family: inherit;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary:hover {
      background: var(--brand-dark);
    }
    .btn-soft {
      background: var(--surface-warm);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 9px;
      font-family: inherit;
      font-weight: 800;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .switch-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-weight: 800;
      font-size: 0.82rem;
    }

    /* Tarjeta de Producto en Mi Oferta (apta celular sin scroll lateral) */
    .oferta-item {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      background: #fffdfb;
      margin-bottom: 10px;
    }
    .oferta-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 10px;
      align-items: end;
    }

    @media (max-width: 640px) {
      .top-inner {
        flex-direction: column;
        align-items: flex-start;
      }
      .top-actions {
        width: 100%;
      }
      .btn-top {
        flex: 1;
        justify-content: center;
      }
      .oferta-grid {
        grid-template-columns: 1fr 1fr;
      }
      .ventana-item-row {
        grid-template-columns: 1fr 1fr !important;
      }
      .propuestas-grid {
        grid-template-columns: 1fr !important;
      }
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="top-inner">
      <div class="brand-identity" onclick="volverAlTableroGestor()" title="Volver al tablero principal">
        <div class="brand-emblem" id="gestor-logo-box"></div>
        <div>
          <div class="brand-title" id="gestor-nodo-title">Cargando...</div>
          <div class="brand-subtitle" id="gestor-nodo-subtitle">Panel del Gestor</div>
        </div>
      </div>

      <div class="top-actions">
        <a id="btn-abrir-tienda" href="#" target="_blank" class="btn-top">
          🏪 Ver Tienda
        </a>
        <button type="button" class="btn-top brand" onclick="enviarLinkTiendaWhatsAppPrueba()">
          📲 Compartir Tienda
        </button>
        <button type="button" class="btn-top" onclick="copiarLinkTiendaVecinos()">
          🔗 Copiar Link
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="gestor-main-view"></div>
  </main>

  <!-- AVISO VISIBLE EN PANTALLA ANTE ÉXITO O FALLA DE COMUNICACIÓN -->
  <div id="gestor-aviso-flotante" style="display:none; position:fixed; top:14px; left:14px; right:14px; max-width:520px; margin:0 auto; z-index:2500; padding:12px 14px; border-radius:12px; box-shadow:0 12px 28px rgba(62,37,25,0.18); font-size:0.84rem; font-weight:700; line-height:1.4;"></div>

  <!-- MODAL DE WHATSAPP / RECIBO DIGITAL MARCA BLANCA -->
  <div id="modal-recibo-gestor" style="display:none; position:fixed; inset:0; background:rgba(62,37,25,0.52); z-index:2000; align-items:center; justify-content:center; padding:16px;">
    <div style="background:#ffffff; border-radius:18px; max-width:460px; width:100%; overflow:hidden; box-shadow:0 20px 45px rgba(62,37,25,0.22); border:1px solid var(--border);">
      <div id="modal-recibo-gestor-body"></div>
    </div>
  </div>

  <script>
    const GSTATE = {
      slug: '',
      vista: 'inicio', // 'inicio' | 'ofertas' | 'propuestas' | 'logistica' | 'pedidos' | 'ctacte' | 'liquidacion'
      filtroPagoPedidos: 'TODOS',
      filtroOperativoPedidos: 'TODOS',
      nodo: null,
      proximaEntrega: null,
      ofertas: [],
      catalogoBaseDisponible: [],
      propuestas: [],
      pedidos: [],
      movimientosCtaCte: [],
      ingredientesDisponibles: [],
      propCategoriaSel: '',
      propFiltroTexto: '',
      propIngredienteIdSel: 0,
      propIngredienteInicializadoId: 0,
      propKilosSel: 0.25,
      propUnidadPesoManual: 'g',
      propNombreEditadoManual: false,
      propConfirmacionReciente: '',
      liquidacionTablero: null
    };

    function fmt(n) {
      return '$' + Math.round(Number(n) || 0).toLocaleString('es-AR');
    }

    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    let _timerAvisoFlotante = null;
    function mostrarAvisoPantallaGestor(mensaje, tipo = 'ok') {
      const box = document.getElementById('gestor-aviso-flotante');
      if (!box) return;
      if (_timerAvisoFlotante) clearTimeout(_timerAvisoFlotante);

      const esError = tipo === 'error';
      box.style.background = esError ? '#fef2f2' : '#ecfdf3';
      box.style.border = esError ? '1px solid #ef4444' : '1px solid rgba(31,111,74,0.45)';
      box.style.color = esError ? '#991b1b' : '#14532d';
      box.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
          <div>${esError ? '⚠️ ' : ''}${esc(mensaje)}</div>
          <button type="button" onclick="document.getElementById('gestor-aviso-flotante').style.display='none'"
            style="border:none; background:transparent; color:inherit; font-weight:900; font-size:0.95rem; cursor:pointer; padding:0 2px; line-height:1;">
            ✕
          </button>
        </div>
      `;
      box.style.display = 'block';
      _timerAvisoFlotante = setTimeout(() => {
        box.style.display = 'none';
      }, esError ? 9000 : 5000);
    }

    async function leerRespuestaJsonSegura(resp) {
      const raw = await resp.text();
      try {
        return raw ? JSON.parse(raw) : {};
      } catch (_) {
        return { ok: false, error: `Respuesta inesperada del servidor (HTTP ${resp.status})` };
      }
    }

    function aplicarPaletaNodo(hexColor) {
      const clean = /^#[0-9a-fA-F]{6}$/.test(String(hexColor || '').trim()) ? String(hexColor).trim() : '#a2553b';
      const r = parseInt(clean.slice(1, 3), 16);
      const g = parseInt(clean.slice(3, 5), 16);
      const b = parseInt(clean.slice(5, 7), 16);
      const darkR = Math.max(0, Math.round(r * 0.78));
      const darkG = Math.max(0, Math.round(g * 0.78));
      const darkB = Math.max(0, Math.round(b * 0.78));
      const darkHex = '#' + [darkR, darkG, darkB].map(v => v.toString(16).padStart(2, '0')).join('');

      const root = document.documentElement;
      root.style.setProperty('--brand', clean);
      root.style.setProperty('--brand-dark', darkHex);
      root.style.setProperty('--brand-soft', `rgba(${r}, ${g}, ${b}, 0.11)`);
      root.style.setProperty('--brand-border', `rgba(${r}, ${g}, ${b}, 0.30)`);
    }

    function detectarSlugInicial() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('nodo')) return params.get('nodo');
      const parts = window.location.pathname.split('/').filter(Boolean);
      const idx = parts.indexOf('gestor');
      if (idx !== -1 && parts[idx + 1]) return decodeURIComponent(parts[idx + 1]);
      return 'lo-de-mati';
    }

    async function cargarPanelGestor(opciones = {}) {
      const [resp, respLiq] = await Promise.all([
        fetch(`/api/produccion/nodos/portal/${encodeURIComponent(GSTATE.slug)}?vista=gestor`, { cache: 'no-store' }),
        fetch(`/api/produccion/nodos/liquidacion/tablero?nodo_slug=${encodeURIComponent(GSTATE.slug)}`, { cache: 'no-store' })
      ]);
      const data = await resp.json();
      if (!data.ok) {
        const box = document.getElementById('gestor-main-view');
        if (box) {
          box.innerHTML = `
            <div class="card" style="text-align:center; padding:32px;">
              <h3 style="margin:0 0 8px 0;">Panel de Gestión no disponible</h3>
              <p style="color:var(--muted); font-size:0.9rem; max-width:480px; margin:0 auto;">
                Verificá que el enlace de tu Nodo esté actualizado o pedí el acceso vigente a Administración.
              </p>
            </div>
          `;
        }
        return;
      }
      try {
        const dataLiq = await respLiq.json();
        if (dataLiq && dataLiq.ok) GSTATE.liquidacionTablero = dataLiq;
      } catch (_) {}

      GSTATE.nodo = data.nodo;
      GSTATE.slug = data.nodo.slug;
      GSTATE.proximaEntrega = data.proxima_entrega;
      GSTATE.ofertas = data.todas_ofertas_gestor || [];
      GSTATE.catalogoBaseDisponible = Array.isArray(data.catalogo_base_disponible) ? data.catalogo_base_disponible : [];
      GSTATE.propuestas = data.propuestas_nodo || [];
      GSTATE.pedidos = data.pedidos_nodo || [];
      GSTATE.movimientosCtaCte = data.movimientos_cta_cte || [];
      GSTATE.ingredientesDisponibles = Array.isArray(data.ingredientes_sugeribles) ? data.ingredientes_sugeribles : [];

      if (GSTATE.ingredientesDisponibles.length > 0) {
        const cats = Array.from(new Set(GSTATE.ingredientesDisponibles.map(i => i.categoria_gestor)));
        if (!GSTATE.propCategoriaSel || !cats.includes(GSTATE.propCategoriaSel)) {
          GSTATE.propCategoriaSel = cats.includes('Granolas') ? 'Granolas' : cats[0];
        }
        const itemsCat = GSTATE.ingredientesDisponibles.filter(i => i.categoria_gestor === GSTATE.propCategoriaSel);
        if (!itemsCat.some(i => Number(i.id) === Number(GSTATE.propIngredienteIdSel)) && itemsCat[0]) {
          GSTATE.propIngredienteIdSel = Number(itemsCat[0].id);
        }
        const ingActual = GSTATE.ingredientesDisponibles.find(i => Number(i.id) === Number(GSTATE.propIngredienteIdSel));
        if (ingActual && (opciones.avanzarGramajeTrasEnvio || GSTATE.propIngredienteInicializadoId !== Number(ingActual.id))) {
          GSTATE.propKilosSel = elegirPrimerGramajeNuevoDisponible(ingActual);
          GSTATE.propUnidadPesoManual = Number(GSTATE.propKilosSel) >= 1 ? 'kg' : 'g';
          GSTATE.propIngredienteInicializadoId = Number(ingActual.id);
        }
      }

      aplicarPaletaNodo(GSTATE.nodo.color_primario || '#a2553b');

      const titleEl = document.getElementById('gestor-nodo-title');
      if (titleEl) titleEl.textContent = GSTATE.nodo.nombre_marca || 'Mi Nodo';

      const subEl = document.getElementById('gestor-nodo-subtitle');
      if (subEl) {
        const partes = ['Panel del Gestor'];
        if (GSTATE.nodo.barrio_zona || GSTATE.nodo.direccion_retiro) {
          partes.push(`📍 ${GSTATE.nodo.barrio_zona || GSTATE.nodo.direccion_retiro}`);
        }
        subEl.textContent = partes.join(' · ');
      }

      const logoBox = document.getElementById('gestor-logo-box');
      if (logoBox) {
        const logoSrc = GSTATE.nodo.logo_original_base64 || GSTATE.nodo.logo_mono_preview_base64 || '';
        if (logoSrc) {
          logoBox.innerHTML = `<img src="${logoSrc}" alt="${esc(GSTATE.nodo.nombre_marca)}">`;
        } else {
          const siglas = String(GSTATE.nodo.nombre_marca || 'ND').split(/\s+/).map(w => w[0] || '').join('').substring(0, 2).toUpperCase();
          logoBox.innerHTML = `<div class="brand-monogram">${esc(siglas)}</div>`;
        }
      }

      document.title = `${GSTATE.nodo.nombre_marca || 'Nodo'} — Panel del Gestor`;

      const btnTienda = document.getElementById('btn-abrir-tienda');
      if (btnTienda) btnTienda.href = `/tienda/${encodeURIComponent(GSTATE.slug)}`;

      renderVistaGestor();
    }

    function abrirSeccionGestor(seccion) {
      GSTATE.vista = seccion;
      try {
        window.history.pushState({ vista: seccion }, '', `#${seccion}`);
      } catch (_) {}
      renderVistaGestor();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function volverAlTableroGestor() {
      GSTATE.vista = 'inicio';
      try {
        window.history.replaceState({ vista: 'inicio' }, '', window.location.pathname + window.location.search);
      } catch (_) {}
      renderVistaGestor();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('popstate', () => {
      const hash = (window.location.hash || '').replace(/^#/, '');
      if (['ofertas', 'propuestas', 'logistica', 'pedidos', 'ctacte', 'liquidacion'].includes(hash)) {
        GSTATE.vista = hash;
      } else {
        GSTATE.vista = 'inicio';
      }
      renderVistaGestor();
    });

    function envolverSeccionInterna(tituloSeccion, contenidoHtml) {
      return `
        <div class="section-nav">
          <button type="button" class="btn-back" onclick="volverAlTableroGestor()">
            ← Volver al tablero
          </button>
        </div>
        <h2 class="section-heading">${esc(tituloSeccion)}</h2>
        ${contenidoHtml}
      `;
    }

    function renderVistaGestor() {
      const box = document.getElementById('gestor-main-view');
      if (!box || !GSTATE.nodo) return;

      if (GSTATE.vista === 'ofertas') {
        box.innerHTML = envolverSeccionInterna('1. Mi Oferta y Márgenes', renderSeccionOfertas());
      } else if (GSTATE.vista === 'propuestas') {
        box.innerHTML = envolverSeccionInterna('2. Pedir Nueva Fracción', renderSeccionPropuestas());
      } else if (GSTATE.vista === 'logistica') {
        box.innerHTML = envolverSeccionInterna('3. Días de Entrega, Corte y Envío Barrial', renderSeccionLogistica());
      } else if (GSTATE.vista === 'pedidos') {
        box.innerHTML = envolverSeccionInterna('4. Pedidos de Vecinos', renderSeccionPedidos());
      } else if (GSTATE.vista === 'ctacte') {
        box.innerHTML = envolverSeccionInterna('5. Cuentas Corrientes', renderSeccionCuentasCorrientes());
      } else if (GSTATE.vista === 'liquidacion') {
        box.innerHTML = envolverSeccionInterna('6. Liquidación', renderSeccionLiquidacion());
      } else {
        box.innerHTML = renderTableroPrincipal();
      }
    }

    // -------------------------------------------------------------------------
    // PANTALLA PRINCIPAL AUSTERA: TABLERO DE 6 BLOQUES
    // -------------------------------------------------------------------------
    function renderTableroPrincipal() {
      const publicadas = GSTATE.ofertas.filter(o => o.publicado_tienda).length;
      const totalOfertas = GSTATE.ofertas.length;
      const propPendientes = GSTATE.propuestas.filter(p => p.estado !== 'APROBADA').length;
      const proxTxt = GSTATE.proximaEntrega?.asignada?.label_completo || 'Configurar día y horario';
      const envioTxt = GSTATE.nodo.permitir_envio_barrial
        ? `Envío barrial ${fmt(GSTATE.nodo.cargo_envio_barrial)}`
        : 'Solo retiro en Nodo';

      const pedidosActivos = (GSTATE.pedidos || []).filter(p => String(p.estado_operativo || '').toUpperCase() !== 'ANULADO');
      const totalPedidos = pedidosActivos.length;

      try {
        const resp = await fetch(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/sumar-catalogo`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ catalogo_id: Number(catalogoId) })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo sumar el producto: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          return;
        }
        await cargarPanelGestor();

        if (abrirOfertasDespues) {
          abrirSeccionGestor('ofertas');

    async function guardarPrecioDirectoOferta(ofertaId, base, nuevoPrecio) {
      const margen = base > 0 ? Number((((nuevoPrecio - base) / base) * 100).toFixed(2)) : 0;
      await guardarCambioOferta(ofertaId, {
        margen_gestor_pct: Math.max(0, margen),
        precio_venta_vecino: nuevoPrecio
      });
    }

    // -------------------------------------------------------------------------
    // 2. PEDIR NUEVA FRACCIÓN (CONECTADO DETERMINÍSTICAMENTE A INGREDIENTES LAMDA)
    // -------------------------------------------------------------------------
    function normalizarTextoGestor(str) {
      return String(str ?? '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase();
    }

    function formatearPesoCortoGestor(kilos) {
      const kg = Number(kilos || 0);
      const gramos = Math.round(kg * 1000);
      if (gramos >= 1000 && gramos % 1000 === 0) return `${gramos / 1000} kg`;
      if (gramos >= 1000) return `${Number(kg.toFixed(2))} kg`;
      return `${gramos}g`;
    }

    function obtenerIngredientesFiltradosGestor(categoria, filtroTexto) {
      const listaCat = (GSTATE.ingredientesDisponibles || []).filter(
        i => String(i.categoria_gestor || '') === String(categoria || '')
      );
      const terminos = normalizarTextoGestor(filtroTexto).split(/\s+/).filter(Boolean);
      if (terminos.length === 0) return listaCat;
      return listaCat.filter(i => {
        const bolsa = normalizarTextoGestor(`${i.nombre_claro} ${i.alias_vecino_sugerido} ${i.categoria_gestor}`);
        return terminos.every(t => bolsa.includes(t));
      });
    }

    function obtenerIngredienteSeleccionadoGestor() {
      return (GSTATE.ingredientesDisponibles || []).find(
        i => Number(i.id) === Number(GSTATE.propIngredienteIdSel)
      ) || null;
    }

    function obtenerOpcionesGramajeIngrediente(ingObj) {
      const base = ingObj && ingObj.es_pack_barritas
        ? [
            { label: 'Pack x 3 (150g)', val: 0.15 },
            { label: 'Pack x 6 (300g)', val: 0.30 },
            { label: 'Pack x 12 (600g)', val: 0.60 },
            { label: 'Caja x 20 (1 kg)', val: 1.00 }
          ]
        : [
            { label: '100g', val: 0.10 },
            { label: '150g', val: 0.15 },
            { label: '200g', val: 0.20 },
            { label: '250g', val: 0.25 },
            { label: '400g', val: 0.40 },
            { label: '500g', val: 0.50 },
            { label: '1 kg', val: 1.00 }
          ];

      const presExistentes = Array.isArray(ingObj?.presentaciones_lamda) ? ingObj.presentaciones_lamda : [];
      for (const p of presExistentes) {
        const kv = Number(p.kilos_unidad || 0);
        if (kv > 0 && !base.some(b => Math.abs(b.val - kv) < 0.003)) {
          base.push({
            label: p.etiqueta || formatearPesoCortoGestor(kv),
            val: kv
          });
        }
      }
      base.sort((a, b) => a.val - b.val);
      return base;
    }

    function evaluarEstadoGramajeParaGestor(ingObj, kilos) {
      const idNum = Number(ingObj?.id || 0);
      const kgNum = Number(kilos || 0);
      if (!idNum || !kgNum) {
        return { tipo: 'NUEVA_DISPONIBLE' };
      }

      const enOfertaNodo = (GSTATE.ofertas || []).find(
        o => Number(o.ingrediente_origen_id) === idNum && Math.abs(Number(o.kilos_unidad) - kgNum) < 0.003
      );
      if (enOfertaNodo) {
        return { tipo: 'EN_OFERTA_NODO', oferta: enOfertaNodo };
      }

      const presLamda = (ingObj?.presentaciones_lamda || []).find(
        p => Math.abs(Number(p.kilos_unidad) - kgNum) < 0.003
      );
      if (presLamda && presLamda.en_catalogo_nodos) {
        return { tipo: 'EN_CATALOGO_NODOS', pres: presLamda };
      }

      const yaPendiente = (GSTATE.propuestas || []).find(
        p => p.estado === 'PENDIENTE_COTIZACION' &&
             Number(p.ingrediente_sugerido_id) === idNum &&
             Math.abs(Number(p.kilos_sugeridos) - kgNum) < 0.003
      );

      if (presLamda && presLamda.ya_produce_lamda) {
        return { tipo: 'YA_EXISTE_LAMDA', pres: presLamda, propuestaPendiente: yaPendiente || null };
      }

      if (yaPendiente) {
        return { tipo: 'YA_SOLICITADA', propuesta: yaPendiente };
      }

      return { tipo: 'NUEVA_DISPONIBLE' };
    }

    function elegirPrimerGramajeNuevoDisponible(ingObj) {
      if (!ingObj) return 0.25;
      const opciones = obtenerOpcionesGramajeIngrediente(ingObj);
      const preferidos = ingObj.es_pack_barritas
        ? [0.30, 0.15, 0.60, 1.00]
        : [0.25, 0.15, 0.10, 0.40, 0.20, 0.50, 1.00];

      for (const pref of preferidos) {
        const op = opciones.find(o => Math.abs(o.val - pref) < 0.003);
        if (op && evaluarEstadoGramajeParaGestor(ingObj, op.val).tipo === 'NUEVA_DISPONIBLE') {
          return op.val;
        }
      }
      const cualquieraNueva = opciones.find(o => evaluarEstadoGramajeParaGestor(ingObj, o.val).tipo === 'NUEVA_DISPONIBLE');
      return cualquieraNueva ? cualquieraNueva.val : (opciones[0] ? opciones[0].val : 0.25);
    }

    function renderResumenExistentesLamdaHtml(ingObj) {
      const pres = Array.isArray(ingObj?.presentaciones_lamda) ? ingObj.presentaciones_lamda : [];
      if (pres.length === 0) {
        return `
          <div style="font-size:0.75rem; color:var(--muted); margin-bottom:7px;">
            Este artículo aún no tiene bolsitas fraccionadas estándar; podés pedir el gramaje que necesites.
          </div>
        `;
      }
      const badges = pres.map(p => {
        const enMiOferta = (GSTATE.ofertas || []).some(
          o => Number(o.ingrediente_origen_id) === Number(ingObj.id) && Math.abs(Number(o.kilos_unidad) - Number(p.kilos_unidad)) < 0.003
        );
        const sub = enMiOferta
          ? ' (en tu oferta)'
          : p.en_catalogo_nodos
            ? ' (cotizada)'
            : '';
        return `<span style="display:inline-flex; align-items:center; gap:3px; padding:2px 8px; border-radius:999px; background:#edf7f1; border:1px solid rgba(31,111,74,0.28); color:var(--ok); font-weight:800; font-size:0.72rem;">✓ ${esc(p.etiqueta)}${esc(sub)}</span>`;
      }).join(' ');

      return `
        <div style="margin-bottom:8px; padding:8px 10px; border-radius:10px; background:#f8faf8; border:1px solid rgba(31,111,74,0.18); font-size:0.76rem; line-height:1.45;">

          <div style="color:var(--muted); font-size:0.72rem; margin-top:4px;">
            Esas medidas ya existen; para pedir una <strong>nueva fracción</strong> elegí abajo otro gramaje distinto.
          </div>
        </div>
      `;
    }

    function renderOpcionesGramajePropuestaHtml(ingObj, kilosActuales) {
      const kg = Number(kilosActuales || 0);
      const opciones = obtenerOpcionesGramajeIngrediente(ingObj);

      return opciones.map(op => {
        const activo = Math.abs(kg - op.val) < 0.003;
        const est = evaluarEstadoGramajeParaGestor(ingObj, op.val);

        let sufijo = '';
        let estiloExtra = '';

        if (est.tipo === 'EN_OFERTA_NODO' || est.tipo === 'EN_CATALOGO_NODOS') {
          sufijo = ' · ✓ Cotizada';
          estiloExtra = activo
            ? 'background:var(--ok-soft); border-color:var(--ok); color:var(--ok); font-weight:800;'
            : 'background:#f4faf6; border-color:rgba(31,111,74,0.28); color:var(--ok); opacity:0.9;';
        } else if (est.tipo === 'YA_EXISTE_LAMDA') {
          sufijo = est.propuestaPendiente ? ' · ⏳ Pedida' : ' · ✓ Ya existe';
          estiloExtra = activo
            ? 'background:#eef5f0; border-color:var(--ok); color:var(--ok); font-weight:800;'
            : 'background:#f5f6f4; border-color:#d6d3ce; color:#57534e;';
        } else if (est.tipo === 'YA_SOLICITADA') {
          sufijo = ' · ⏳ Solicitada';
          estiloExtra = activo
            ? 'background:var(--warn-soft); border-color:rgba(180,83,9,0.45); color:var(--warn); font-weight:800;'
            : 'background:#fffbeb; border-color:rgba(180,83,9,0.26); color:var(--warn);';
        } else if (activo) {
          estiloExtra = 'background:var(--brand-soft); border-color:var(--brand); color:var(--brand-dark); font-weight:800;';
        }

        return `
          <button type="button" class="btn-soft"
            onclick="fijarGramajePropuestaGestor(${op.val})"
            style="${estiloExtra}">
            ${esc(op.label)}${esc(sufijo)}
          </button>
        `;
      }).join('');
    }

    function renderAvisoEstadoGramajeHtml(ingObj, kilos) {

            <strong style="color:var(--ok);">✓ Ya tenés ${esc(etPeso)} cotizada en tu Nodo</strong> (Costo Base <strong>${fmt(of.precio_base_nodo_final)}</strong>).<br>

            <strong style="color:var(--ok);">✓ Esta medida (${esc(etPeso)}) ya está cotizada por LAMDA</strong> (Costo Base <strong>${fmt(pres.precio_base_nodo_final)}</strong>).<br>
            No necesitás pedir cotización; sumala directo a tu Nodo:

                <span style="font-size:0.74rem;">¿La enviaste por error?</span>

                  onclick="anularPropuestaGestor(${Number(est.propuestaPendiente.id)})">
                  ✕ Anular solicitud
                </button>
              </div>
            </div>
          `;
        }
        return `
          <div style="padding:11px 12px; border-radius:11px; background:#f4faf6; border:1px solid rgba(31,111,74,0.28); color:var(--text); font-size:0.8rem; line-height:1.45;">
            <strong style="color:var(--ok);">✓ LAMDA ya produce la presentación de ${esc(etPeso)}</strong><br>
            No debe solicitarse como nueva fracción a crear. Elegí arriba otro gramaje que aún no exista (por ejemplo <strong>100g</strong>, <strong>150g</strong> o <strong>400g</strong>).
            <div style="margin-top:8px; padding-top:7px; border-top:1px dashed rgba(31,111,74,0.22); display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
              <span style="font-size:0.74rem; color:var(--muted);">¿Querés vender esta medida existente de ${esc(etPeso)}?</span>
              <button type="button" class="btn-soft" style="font-size:0.75rem; padding:5px 10px;"
                onclick="enviarNuevaPropuestaGestor({ solicitarHabilitacionExistente: true })">
                Pedir que la habiliten en mi Nodo
              </button>

      if (est.tipo === 'YA_SOLICITADA') {

          <div style="padding:10px 12px; border-radius:11px; background:var(--warn-soft); border:1px solid rgba(180,83,9,0.25); color:var(--warn); font-size:0.8rem; line-height:1.45;">

            Esta medida de <strong>${esc(etPeso)}</strong> ya fue enviada y está pendiente de cotización.
            <div style="margin-top:8px; padding-top:7px; border-top:1px dashed rgba(180,83,9,0.25); display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
              <span style="font-size:0.74rem;">¿Te equivocaste de gramaje o producto?</span>
              <button type="button" class="btn-soft"
                style="font-size:0.75rem; padding:5px 10px; border-color:rgba(185,28,28,0.35); color:#b91c1c; background:#fff5f5;"
                onclick="anularPropuestaGestor(${Number(est.propuesta.id)})">
                ✕ Anular solicitud
              </button>

    function formatearValorInputPesoManual(kilos, unidad) {
      const k = Number(kilos || 0);
      if (!Number.isFinite(k) || k <= 0) return '';
      if (unidad === 'kg') {
        return String(Math.round(k * 1000) / 1000);
      }
      return String(Math.round(k * 1000 * 10) / 10);
    }

    function parsearKilosDesdeTextoManual(texto, unidad) {
      const limpio = String(texto ?? '').trim().replace(',', '.').replace(/\s+/g, '');
      if (!limpio || limpio === '.' || !/^\d*(\.\d+)?$/.test(limpio)) return 0;
      const num = Number(limpio);
      if (!Number.isFinite(num) || num <= 0) return 0;
      const kilos = unidad === 'kg' ? num : (num / 1000);
      return Number(kilos.toFixed(4));
    }

    function sincronizarBotonEnvioPropuestaDom(ingObj, kilos) {
      const btn = document.getElementById('btn-enviar-propuesta-gestor');
      if (!btn) return;
      if (!kilos || Number(kilos) <= 0) {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        btn.textContent = 'Ingresá un peso válido mayor a 0';
        return;
      }
      const est = evaluarEstadoGramajeParaGestor(ingObj, kilos);
      const etPeso = formatearPesoCortoGestor(kilos);

      if (est.tipo === 'NUEVA_DISPONIBLE') {
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.textContent = `Enviar Solicitud de Nueva Fracción (${etPeso})`;
      } else if (est.tipo === 'EN_OFERTA_NODO' || est.tipo === 'EN_CATALOGO_NODOS') {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        btn.textContent = `Medida ${etPeso} ya cotizada`;
      } else if (est.tipo === 'YA_EXISTE_LAMDA') {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        btn.textContent = `Medida ${etPeso} ya existe en LAMDA`;
      } else if (est.tipo === 'YA_SOLICITADA') {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        btn.textContent = `Medida ${etPeso} ya solicitada`;
      }
    }

    function actualizarControlesPropuestaEnVivo() {
      const totalCat = (GSTATE.ingredientesDisponibles || []).filter(
        i => String(i.categoria_gestor || '') === String(GSTATE.propCategoriaSel || '')
      );
      const filtrados = obtenerIngredientesFiltradosGestor(GSTATE.propCategoriaSel, GSTATE.propFiltroTexto);

      if (!filtrados.some(i => Number(i.id) === Number(GSTATE.propIngredienteIdSel))) {
        GSTATE.propIngredienteIdSel = filtrados[0] ? Number(filtrados[0].id) : 0;
      }
      const ingSel = obtenerIngredienteSeleccionadoGestor();

      const wrapFiltro = document.getElementById('prop-filtro-wrap');
      if (wrapFiltro) {
        wrapFiltro.style.display = totalCat.length > 8 ? 'block' : 'none';
      }

      const selIng = document.getElementById('prop-ingrediente');
      if (selIng) {
        selIng.innerHTML = filtrados.length === 0
          ? `<option value="">Sin coincidencias en ${esc(GSTATE.propCategoriaSel)}</option>`
          : filtrados.map(i => `
              <option value="${i.id}" ${Number(i.id) === Number(GSTATE.propIngredienteIdSel) ? 'selected' : ''}>
                ${esc(i.nombre_claro)}
              </option>
            `).join('');
      }

      const inputNombre = document.getElementById('prop-nombre');
      if (inputNombre && ingSel && !GSTATE.propNombreEditadoManual) {
        inputNombre.value = ingSel.alias_vecino_sugerido || ingSel.nombre_claro;
      }

      const resumenExistBox = document.getElementById('prop-resumen-existentes');
      if (resumenExistBox) {
        resumenExistBox.innerHTML = renderResumenExistentesLamdaHtml(ingSel);
      }

      const gramajesBox = document.getElementById('prop-gramajes-box');
      if (gramajesBox) {
        gramajesBox.innerHTML = renderOpcionesGramajePropuestaHtml(ingSel, GSTATE.propKilosSel);
      }

      const selUnidad = document.getElementById('prop-peso-unidad');
      if (selUnidad && selUnidad.value !== GSTATE.propUnidadPesoManual) {
        selUnidad.value = GSTATE.propUnidadPesoManual;
      }

      const inputPeso = document.getElementById('prop-peso-manual');
      if (inputPeso && document.activeElement !== inputPeso) {
        inputPeso.value = formatearValorInputPesoManual(GSTATE.propKilosSel, GSTATE.propUnidadPesoManual);
        inputPeso.placeholder = GSTATE.propUnidadPesoManual === 'kg' ? 'Ej: 0.35 o 2' : 'Ej: 350';
      }

      const confBox = document.getElementById('prop-confirmacion-reciente');
      if (confBox) {
        confBox.innerHTML = GSTATE.propConfirmacionReciente ? `
          <div style="padding:11px 13px; border-radius:11px; background:var(--ok-soft); border:1px solid rgba(31,111,74,0.35); color:var(--ok); font-size:0.82rem; font-weight:700; line-height:1.4;">
            ${esc(GSTATE.propConfirmacionReciente)}
          </div>
        ` : '';
      }

      const avisoBox = document.getElementById('prop-aviso-existente');
      if (avisoBox) {
        avisoBox.innerHTML = renderAvisoEstadoGramajeHtml(ingSel, GSTATE.propKilosSel);
      }

      sincronizarBotonEnvioPropuestaDom(ingSel, GSTATE.propKilosSel);
    }

    function alCambiarCategoriaPropuestaGestor(nuevaCat) {
      GSTATE.propCategoriaSel = nuevaCat;
      GSTATE.propFiltroTexto = '';
      GSTATE.propNombreEditadoManual = false;
      GSTATE.propConfirmacionReciente = '';
      const inputFiltro = document.getElementById('prop-filtro-ingrediente');
      if (inputFiltro) inputFiltro.value = '';

      const listaCat = obtenerIngredientesFiltradosGestor(nuevaCat, '');
      GSTATE.propIngredienteIdSel = listaCat[0] ? Number(listaCat[0].id) : 0;
      const ingSel = obtenerIngredienteSeleccionadoGestor();
      if (ingSel) {
        GSTATE.propKilosSel = elegirPrimerGramajeNuevoDisponible(ingSel);
        GSTATE.propUnidadPesoManual = Number(GSTATE.propKilosSel) >= 1 ? 'kg' : 'g';
        GSTATE.propIngredienteInicializadoId = Number(ingSel.id);
      }
      actualizarControlesPropuestaEnVivo();
    }

    function alFiltrarIngredientesPropuestaGestor(texto) {
      GSTATE.propFiltroTexto = texto;
      GSTATE.propNombreEditadoManual = false;
      GSTATE.propConfirmacionReciente = '';
      actualizarControlesPropuestaEnVivo();
    }

    function alCambiarIngredientePropuestaGestor(ingId) {
      GSTATE.propIngredienteIdSel = Number(ingId || 0);
      GSTATE.propNombreEditadoManual = false;
      GSTATE.propConfirmacionReciente = '';
      const ingSel = obtenerIngredienteSeleccionadoGestor();
      if (ingSel) {
        GSTATE.propKilosSel = elegirPrimerGramajeNuevoDisponible(ingSel);
        GSTATE.propUnidadPesoManual = Number(GSTATE.propKilosSel) >= 1 ? 'kg' : 'g';
        GSTATE.propIngredienteInicializadoId = Number(ingSel.id);

    function fijarGramajePropuestaGestor(kilos) {
      GSTATE.propConfirmacionReciente = '';
      GSTATE.propKilosSel = Number(kilos || 0.25);
      GSTATE.propUnidadPesoManual = Number(GSTATE.propKilosSel) >= 1 ? 'kg' : 'g';
      const selUnidad = document.getElementById('prop-peso-unidad');
      if (selUnidad) selUnidad.value = GSTATE.propUnidadPesoManual;
      const inputPeso = document.getElementById('prop-peso-manual');
      if (inputPeso) {
        inputPeso.value = formatearValorInputPesoManual(GSTATE.propKilosSel, GSTATE.propUnidadPesoManual);

      actualizarControlesPropuestaEnVivo();

    function alEscribirPesoManualGestor(texto) {
      GSTATE.propConfirmacionReciente = '';
      const unidad = document.getElementById('prop-peso-unidad')?.value || GSTATE.propUnidadPesoManual || 'g';
      const kilos = parsearKilosDesdeTextoManual(texto, unidad);

        if (avisoBox) avisoBox.innerHTML = '';

    function alSalirPesoManualGestor() {
      const inputPeso = document.getElementById('prop-peso-manual');
      if (!inputPeso) return;
      const unidad = document.getElementById('prop-peso-unidad')?.value || GSTATE.propUnidadPesoManual || 'g';
      const kilos = parsearKilosDesdeTextoManual(inputPeso.value, unidad);
      if (kilos > 0) {
        GSTATE.propKilosSel = kilos;
      }
      inputPeso.value = formatearValorInputPesoManual(GSTATE.propKilosSel, unidad);
      actualizarControlesPropuestaEnVivo();

      const unidadDestino = nuevaUnidad === 'kg' ? 'kg' : 'g';
      const inputPeso = document.getElementById('prop-peso-manual');
      if (inputPeso) {
        const kilosLeidos = parsearKilosDesdeTextoManual(inputPeso.value, GSTATE.propUnidadPesoManual);
        if (kilosLeidos > 0) {
          GSTATE.propKilosSel = kilosLeidos;
        }
      }
      GSTATE.propUnidadPesoManual = unidadDestino;
      if (inputPeso) {
        inputPeso.value = formatearValorInputPesoManual(GSTATE.propKilosSel, unidadDestino);
        inputPeso.placeholder = unidadDestino === 'kg' ? 'Ej: 0.35 o 2' : 'Ej: 350';
      }
      actualizarControlesPropuestaEnVivo();
    }

    function renderSeccionPropuestas() {
      const disponibles = GSTATE.ingredientesDisponibles || [];
      const categoriasUnicas = Array.from(new Set(disponibles.map(i => i.categoria_gestor)));
      if (categoriasUnicas.length > 0 && (!GSTATE.propCategoriaSel || !categoriasUnicas.includes(GSTATE.propCategoriaSel))) {
        GSTATE.propCategoriaSel = categoriasUnicas.includes('Granolas') ? 'Granolas' : categoriasUnicas[0];
      }
      const totalEnCat = disponibles.filter(i => i.categoria_gestor === GSTATE.propCategoriaSel);
      const filtrados = obtenerIngredientesFiltradosGestor(GSTATE.propCategoriaSel, GSTATE.propFiltroTexto);
      if (!filtrados.some(i => Number(i.id) === Number(GSTATE.propIngredienteIdSel))) {
        GSTATE.propIngredienteIdSel = filtrados[0] ? Number(filtrados[0].id) : 0;
      }
      const ingSel = obtenerIngredienteSeleccionadoGestor();
      if (ingSel && GSTATE.propIngredienteInicializadoId !== Number(ingSel.id)) {
        GSTATE.propKilosSel = elegirPrimerGramajeNuevoDisponible(ingSel);
        GSTATE.propUnidadPesoManual = Number(GSTATE.propKilosSel) >= 1 ? 'kg' : 'g';
        GSTATE.propIngredienteInicializadoId = Number(ingSel.id);
      }
      const nombreInicial = ingSel ? (ingSel.alias_vecino_sugerido || ingSel.nombre_claro) : '';
      const estInicial = evaluarEstadoGramajeParaGestor(ingSel, GSTATE.propKilosSel);
      const etPesoInicial = formatearPesoCortoGestor(GSTATE.propKilosSel);
      const btnHabilitado = estInicial.tipo === 'NUEVA_DISPONIBLE';
      const btnLabelInicial = btnHabilitado

                <label style="display:block; font-size:0.78rem; font-weight:800; margin-bottom:4px;">1. Categoría</label>

                    return `<option value="${esc(cat)}" ${cat === GSTATE.propCategoriaSel ? 'selected' : ''}>${esc(cat)} (${count})</option>`;

              <div>
                <label style="display:block; font-size:0.78rem; font-weight:800; margin-bottom:4px;">2. Producto / Variedad disponible</label>
                <div id="prop-filtro-wrap" style="display:${totalEnCat.length > 8 ? 'block' : 'none'}; margin-bottom:6px;">
                  <input type="text" id="prop-filtro-ingrediente" class="input-sm" style="width:100%; font-size:0.82rem;"
                    value="${esc(GSTATE.propFiltroTexto)}"
                    oninput="alFiltrarIngredientesPropuestaGestor(this.value)"
                    placeholder="Filtrar dentro de esta categoría..." />
                </div>
                <select id="prop-ingrediente" class="input-sm" style="width:100%;" onchange="alCambiarIngredientePropuestaGestor(this.value)">
                  ${filtrados.map(i => `
                    <option value="${i.id}" ${Number(i.id) === Number(GSTATE.propIngredienteIdSel) ? 'selected' : ''}>
                      ${esc(i.nombre_claro)}
                    </option>
                  `).join('')}
                </select>
              </div>

              <div>
                <label style="display:block; font-size:0.78rem; font-weight:800; margin-bottom:4px;">3. Presentación / Gramaje</label>
                <div id="prop-resumen-existentes">
                  ${renderResumenExistentesLamdaHtml(ingSel)}
                </div>
                <div id="prop-gramajes-box" style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:7px;">
                  ${renderOpcionesGramajePropuestaHtml(ingSel, GSTATE.propKilosSel)}
                </div>
                <div style="display:grid; grid-template-columns: 1.25fr 0.95fr; gap:10px;">
                  <div>
                    <label style="display:block; font-size:0.72rem; color:var(--muted); font-weight:700; margin-bottom:2px;">Otro peso manual</label>
                    <div style="display:flex; gap:5px; align-items:stretch;">
                      <input type="text" inputmode="decimal" autocomplete="off" id="prop-peso-manual" class="input-sm"
                        style="flex:1; min-width:0;"
                        value="${esc(formatearValorInputPesoManual(GSTATE.propKilosSel || 0.25, GSTATE.propUnidadPesoManual))}"
                        placeholder="${GSTATE.propUnidadPesoManual === 'kg' ? 'Ej: 0.35 o 2' : 'Ej: 350'}"
                        oninput="alEscribirPesoManualGestor(this.value)"
                        onblur="alSalirPesoManualGestor()" />
                      <select id="prop-peso-unidad" class="input-sm"
                        style="width:74px; padding-left:7px; padding-right:4px; font-weight:800; background:var(--surface-warm);"
                        onchange="alCambiarUnidadPesoManualGestor(this.value)">
                        <option value="g" ${GSTATE.propUnidadPesoManual === 'g' ? 'selected' : ''}>g</option>
                        <option value="kg" ${GSTATE.propUnidadPesoManual === 'kg' ? 'selected' : ''}>kg</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label style="display:block; font-size:0.72rem; color:var(--muted); font-weight:700; margin-bottom:2px;">Precio estimado ($ opc.)</label>

              <div>

                <input type="text" id="prop-nombre" class="input-sm" style="width:100%;"

              <div>
                <label style="display:block; font-size:0.78rem; font-weight:800; margin-bottom:4px;">Comentario (opcional)</label>
                <input type="text" id="prop-comentario" class="input-sm" style="width:100%;" placeholder="Ej: Bolsita individual para merienda" />
              </div>

              <div id="prop-confirmacion-reciente">
                ${GSTATE.propConfirmacionReciente ? `
                  <div style="padding:11px 13px; border-radius:11px; background:var(--ok-soft); border:1px solid rgba(31,111,74,0.35); color:var(--ok); font-size:0.82rem; font-weight:700; line-height:1.4;">

                ${renderAvisoEstadoGramajeHtml(ingSel, GSTATE.propKilosSel)}

              <button type="button" id="btn-enviar-propuesta-gestor" class="btn-primary"
                ${btnHabilitado ? '' : 'disabled'}
                style="opacity:${btnHabilitado ? '1' : '0.5'};"
                onclick="enviarNuevaPropuestaGestor()">
                ${esc(btnLabelInicial)}
              </button>

          <div class="card">
            <h3 style="margin:0 0 12px 0; font-size:1rem;">Mis Solicitudes (${GSTATE.propuestas.length})</h3>

              ${GSTATE.propuestas.length === 0 ? `
                <div style="padding:18px; border-radius:12px; border:1px dashed var(--border); color:var(--muted); font-size:0.84rem; text-align:center;">

                const esHabilitacion = Boolean(p.articulo_bunker_sugerido_codigo);
                const esAprobada = p.estado === 'APROBADA';
                const esDescartada = p.estado === 'DESCARTADA';
                const badgeBg = esAprobada ? 'var(--ok-soft)' : esDescartada ? '#f3f4f6' : 'var(--warn-soft)';

                return `
                  <div style="padding:12px; border-radius:12px; border:1px solid var(--border); background:#fffdfb;">
                    <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
                      <strong style="font-size:0.9rem;">${esc(p.nombre_sugerido)}</strong>
                      <span style="font-size:0.72rem; font-weight:800; padding:3px 9px; border-radius:999px; background:${badgeBg}; color:${badgeColor};">
                        ${badgeLabel}
                      </span>
                    </div>
                    <div style="font-size:0.78rem; color:var(--muted); margin-top:4px;">
                      ${esc(p.categoria_sugerida || 'Frutos Secos')} · <strong>${esc(gramosTxt)}</strong>
                      · ${esHabilitacion ? 'Presentación existente LAMDA' : 'Nueva fracción'}
                      ${p.precio_objetivo_vecino ? ` · Est: ${fmt(p.precio_objetivo_vecino)}` : ''}
                    </div>
                    ${p.comentario_gestor ? `<div style="margin-top:4px; font-size:0.76rem; color:var(--muted);">${esc(p.comentario_gestor)}</div>` : ''}
                    ${esDescartada && p.respuesta_lamda ? `<div style="margin-top:5px; padding:6px 8px; border-radius:8px; background:#f8f7f5; font-size:0.75rem; color:var(--muted);">${esc(p.respuesta_lamda)}</div>` : ''}
                    <div style="margin-top:8px; display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap;">

                        <button type="button" class="btn-soft" style="font-size:0.75rem; padding:5px 10px;" onclick="abrirSeccionGestor('ofertas')">
                          Ver en Mi Oferta y Márgenes →
                        </button>
                      ` : esDescartada ? `
                        <button type="button" class="btn-soft" style="font-size:0.74rem; padding:4px 10px;" onclick="anularPropuestaGestor(${Number(p.id)}, true)">
                          Quitar del listado
                        </button>
                      ` : `
                        <button type="button" class="btn-soft"
                          style="font-size:0.75rem; padding:5px 10px; border-color:rgba(185,28,28,0.35); color:#b91c1c; background:#fff5f5;"
                          onclick="anularPropuestaGestor(${Number(p.id)})">
                          ✕ Anular solicitud
                        </button>
                      `}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    async function enviarNuevaPropuestaGestor(opciones = {}) {
      const solicitarHabilitacionExistente = Boolean(opciones && opciones.solicitarHabilitacionExistente === true);
      const ingSel = obtenerIngredienteSeleccionadoGestor();
      if (!ingSel) {
        mostrarAvisoPantallaGestor('Seleccioná primero un producto disponible de la lista.', 'error');
        return;
      }
      const inputManualEl = document.getElementById('prop-peso-manual');
      const unidadManual = document.getElementById('prop-peso-unidad')?.value || GSTATE.propUnidadPesoManual || 'g';
      const kilos = inputManualEl && String(inputManualEl.value).trim() !== ''
        ? parsearKilosDesdeTextoManual(inputManualEl.value, unidadManual)
        : Number(GSTATE.propKilosSel || 0);
      if (!kilos || kilos <= 0) {
        mostrarAvisoPantallaGestor('Ingresá un peso válido mayor a 0 (por ejemplo 350 en g o 0.5 en kg).', 'error');
        return;
      }
      GSTATE.propKilosSel = kilos;

      const est = evaluarEstadoGramajeParaGestor(ingSel, kilos);
      if (est.tipo === 'EN_OFERTA_NODO' || est.tipo === 'EN_CATALOGO_NODOS') {
        mostrarAvisoPantallaGestor('Esta presentación ya está cotizada; podés verla o sumarla desde Mi Oferta y Márgenes.', 'error');
        return;
      }
      if (est.tipo === 'YA_EXISTE_LAMDA' && !solicitarHabilitacionExistente) {
        mostrarAvisoPantallaGestor('LAMDA ya produce esta presentación. Elegí otro gramaje nuevo o usá la opción para pedir que la habiliten en tu Nodo.', 'error');
        return;
      }
      if (est.tipo === 'YA_SOLICITADA' || (est.tipo === 'YA_EXISTE_LAMDA' && est.propuestaPendiente)) {
        mostrarAvisoPantallaGestor('Esta presentación ya fue solicitada y se encuentra en cotización.', 'error');
        return;
      }

      const nombreBase = (document.getElementById('prop-nombre')?.value || ingSel.alias_vecino_sugerido || ingSel.nombre_claro).trim();
      const etiquetaPeso = formatearPesoCortoGestor(kilos).replace(/\s+/g, '');
      const nombreConPeso = /\bx\s*\d+/i.test(nombreBase) ? nombreBase : `${nombreBase} x ${etiquetaPeso}`;

      const btn = document.getElementById('btn-enviar-propuesta-gestor');
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Enviando solicitud...';
      }

      const comentarioInput = (document.getElementById('prop-comentario')?.value || '').trim();
      const comentarioFinal = solicitarHabilitacionExistente && !comentarioInput
        ? 'Solicitud para habilitar presentación estándar de LAMDA en mi Nodo.'
        : comentarioInput;

      const payload = {
        nodo_solicitante_id: GSTATE.nodo.id,
        ingrediente_sugerido_id: Number(ingSel.id),
        flujo_sugerido: Number(ingSel.flujo || 2),
        categoria_sugerida: ingSel.categoria_gestor || document.getElementById('prop-categoria')?.value || 'Frutos Secos',
        nombre_sugerido: nombreConPeso,
        kilos_sugeridos: kilos,
        precio_objetivo_vecino: Number(document.getElementById('prop-target')?.value || 0),
        comentario_gestor: comentarioFinal,
        solicitar_habilitacion_existente: solicitarHabilitacionExistente
      };

      try {
        const resp = await fetch('/api/produccion/nodos/propuestas', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo enviar la solicitud: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          sincronizarBotonEnvioPropuestaDom(ingSel, kilos);
          return;
        }

        const codProp = data.propuesta?.codigo_propuesta || '';
        GSTATE.propNombreEditadoManual = false;
        GSTATE.propConfirmacionReciente = solicitarHabilitacionExistente
          ? `✅ Solicitud registrada (${codProp}): pediste habilitar ${nombreConPeso} en tu Nodo.`
          : `✅ ¡Solicitud enviada con éxito! ${nombreConPeso} (${codProp}) ingresó a cotización y ya figura en Mis Solicitudes.`;
        await cargarPanelGestor({ avanzarGramajeTrasEnvio: true });
      } catch (err) {
        mostrarAvisoPantallaGestor('Error de comunicación al enviar la solicitud. Verificá tu conexión e intentá de nuevo.', 'error');
        sincronizarBotonEnvioPropuestaDom(ingSel, kilos);
      }
    }

    async function ejecutarAnulacionPropuestaGestor(propuestaId, esLimpiezaDescartada = false) {
      const prop = (GSTATE.propuestas || []).find(x => Number(x.id) === Number(propuestaId));
      const etiquetaNombre = prop ? prop.nombre_sugerido : 'esta presentación';
      const btnConfirm = document.getElementById('btn-confirmar-anular-propuesta');
      const errModalBox = document.getElementById('modal-anular-error-box');

      if (btnConfirm) {
        btnConfirm.disabled = true;
        btnConfirm.textContent = 'Anulando...';
      }
      if (errModalBox) errModalBox.style.display = 'none';

      try {
        const resp = await fetch(`/api/produccion/nodos/propuestas/${Number(propuestaId)}/anular`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nodo_id: GSTATE.nodo?.id || null,
            nodo_slug: GSTATE.slug || ''
          })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          const msgErr = data.error || `Error HTTP ${resp.status}`;
          if (errModalBox) {
            errModalBox.textContent = '⚠️ No se pudo anular: ' + msgErr;
            errModalBox.style.display = 'block';
          }
          mostrarAvisoPantallaGestor('No se pudo anular la solicitud: ' + msgErr, 'error');
          if (btnConfirm) {
            btnConfirm.disabled = false;
            btnConfirm.textContent = 'Confirmar anulación';
          }
          return;
        }

        cerrarModalReciboGestor();
        if (!esLimpiezaDescartada) {
          const codTxt = prop?.codigo_propuesta ? ` (${prop.codigo_propuesta})` : '';
          const msgExito = `✓ Solicitud${codTxt} de ${etiquetaNombre} anulada. Esa medida volvió a quedar libre.`;
          GSTATE.propConfirmacionReciente = msgExito;
          mostrarAvisoPantallaGestor(msgExito, 'ok');
        } else {
          GSTATE.propConfirmacionReciente = '';
        }
        await cargarPanelGestor();
      } catch (err) {
        const msgRed = 'Falla de comunicación con el servidor al intentar anular. Verificá tu conexión e intentá nuevamente.';
        if (errModalBox) {
          errModalBox.textContent = '⚠️ ' + msgRed;
          errModalBox.style.display = 'block';
        }
        mostrarAvisoPantallaGestor(msgRed, 'error');
        if (btnConfirm) {
          btnConfirm.disabled = false;
          btnConfirm.textContent = 'Confirmar anulación';
        }
      }
    }

    function anularPropuestaGestor(propuestaId, esLimpiezaDescartada = false) {
      if (!GSTATE.nodo || !propuestaId) return;
      if (esLimpiezaDescartada) {
        ejecutarAnulacionPropuestaGestor(propuestaId, true);
        return;
      }

      const prop = (GSTATE.propuestas || []).find(x => Number(x.id) === Number(propuestaId));
      const etiquetaNombre = prop ? prop.nombre_sugerido : 'esta presentación';
      const codProp = prop?.codigo_propuesta || '';

      const modal = document.getElementById('modal-recibo-gestor');
      const body = document.getElementById('modal-recibo-gestor-body');
      if (!modal || !body) {
        ejecutarAnulacionPropuestaGestor(propuestaId, false);
        return;
      }

      body.innerHTML = `
        <div style="padding:16px 20px; background:var(--brand-soft); border-bottom:1px solid var(--brand-border); color:var(--text);">
          <div style="font-size:0.72rem; font-weight:800; text-transform:uppercase; color:var(--brand-dark);">Confirmar baja de solicitud</div>
          <div style="font-size:1.02rem; font-weight:900; margin-top:2px;">Anular ${esc(etiquetaNombre)}</div>
          ${codProp ? `<div style="font-size:0.76rem; color:var(--muted); margin-top:2px;">Código ${esc(codProp)}</div>` : ''}
        </div>
        <div style="padding:18px 20px; background:#fff; color:var(--text); font-size:0.86rem; line-height:1.45;">
          <p style="margin:0 0 12px 0;">
            Se dará de baja esta solicitud pendiente de cotización y <strong>ese gramaje volverá a quedar libre</strong> por si querés volver a pedirlo.
          </p>
          <div id="modal-anular-error-box" style="display:none; margin-bottom:12px; padding:10px 12px; border-radius:10px; background:#fef2f2; border:1px solid #ef4444; color:#991b1b; font-size:0.8rem; font-weight:700;"></div>
          <div style="display:flex; gap:8px;">
            <button type="button" id="btn-confirmar-anular-propuesta"
              onclick="ejecutarAnulacionPropuestaGestor(${Number(propuestaId)}, false)"
              class="btn-primary" style="flex:1; background:#b91c1c;">
              Confirmar anulación
            </button>
            <button type="button" onclick="cerrarModalReciboGestor()" class="btn-soft" style="padding:11px 16px;">
              Cancelar
            </button>
          </div>
        </div>
      `;
      modal.style.display = 'flex';
    }

            Los pedidos que ingresen después del horario de corte pasan automáticamente a la siguiente fecha de entrega.

          <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:12px; margin-bottom:16px;">

              <label style="display:block; font-size:0.78rem; font-weight:800; margin-bottom:4px;">Domicilio de retiro</label>
