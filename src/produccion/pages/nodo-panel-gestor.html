        Number(p.cargo_envio_barrial) > 0 ? `• ${esPerfilEcommerceGestor() ? 'Envío postal' : 'Envío barrial'}: ${fmt(p.cargo_envio_barrial)}` : '',
        `✅ *TOTAL ABONADO: ${fmt(p.total_vecino)}* (${esEfvo ? 'Efectivo' : 'Transferencia'})`,

      ].filter(Boolean).join('\n');

      await abrirModalDespachoWhatsAppGestor({
        destinatario_nombre: p.vecino_nombre,

    // -------------------------------------------------------------------------
    // 7. COMPRADORES REGISTRADOS (Etapa A4)
    // -------------------------------------------------------------------------
    function normalizarTextoBusquedaComprador(txt) {
      return String(txt || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .trim();
    }

    function obtenerCompradoresFiltradosGestor() {
      const lista = Array.isArray(GSTATE.compradores) ? GSTATE.compradores : [];
      const filtro = String(GSTATE.filtroCompradores || 'TODOS').toUpperCase();
      const q = normalizarTextoBusquedaComprador(GSTATE.busquedaCompradores);
      const terminos = q ? q.split(/\s+/).filter(Boolean) : [];

      return lista.filter(c => {
        if (filtro === 'ACTIVOS' && !c.tiene_pedido_en_curso) return false;
        if (filtro === 'RECURRENTES' && !c.es_recurrente) return false;
        if (terminos.length > 0) {
          const bolsa = normalizarTextoBusquedaComprador([
            c.nombre_completo,
            c.codigo_vecino,
            c.telefono_whatsapp,
            c.direccion_calle,
            c.entrecalles_referencia,
            c.localidad_habitual,
            c.provincia_habitual,
            c.cp_habitual,
            c.notas_entrega,
            c.ultimo_pedido?.codigo_pedido,
            c.ultimo_pedido?.fecha_entrega_label
          ].filter(Boolean).join(' '));
          for (const t of terminos) {
            if (!bolsa.includes(t)) return false;
          }
        }
        return true;
      });
    }

    function filtrarEstadoCompradoresGestor(filtro) {
      GSTATE.filtroCompradores = filtro || 'TODOS';
      renderVistaGestor();
    }

    function filtrarTextoCompradoresGestor(valor) {
      GSTATE.busquedaCompradores = String(valor || '');
      const listEl = document.getElementById('compradores-lista-container');
      const countEl = document.getElementById('compradores-resultado-count');
      const clearBtn = document.getElementById('compradores-clear-search');
      if (listEl) {
        listEl.innerHTML = renderizarListaCompradoresHtml();
      }
      if (countEl) {
        const filtrados = obtenerCompradoresFiltradosGestor();
        countEl.textContent = `${filtrados.length} de ${(GSTATE.compradores || []).length} compradores`;
      }
      if (clearBtn) {
        clearBtn.style.display = GSTATE.busquedaCompradores.trim() ? 'inline-flex' : 'none';
      }
    }

    function limpiarBusquedaCompradoresGestor() {
      GSTATE.busquedaCompradores = '';
      const inp = document.getElementById('compradores-search-input');
      if (inp) {
        inp.value = '';
        inp.focus();
      }
      filtrarTextoCompradoresGestor('');
    }

    async function refrescarCompradoresGestor() {
      if (!GSTATE.nodo?.id) return;
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${Number(GSTATE.nodo.id)}/compradores`, { cache: 'no-store' });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor(data.error || 'No se pudo actualizar la lista de compradores.', 'error');
          return;
        }
        GSTATE.compradores = Array.isArray(data.compradores) ? data.compradores : [];
        GSTATE.compradoresResumen = data.resumen || {
          total_compradores: GSTATE.compradores.length,
          con_pedido_activo: GSTATE.compradores.filter(c => c.tiene_pedido_en_curso).length,
          recurrentes: GSTATE.compradores.filter(c => c.es_recurrente).length
        };
        GSTATE.compradoresCargados = true;
        renderVistaGestor();
        mostrarAvisoPantallaGestor('✅ Lista de compradores actualizada.', 'ok');
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de comunicación al actualizar compradores.', 'error');
      }
    }

    function formatearFechaCortaComprador(iso) {
      if (!iso) return '';
      try {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return '';
        return d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' });
      } catch (_) {
        return '';
      }
    }

    function abrirWhatsAppCompradorGestor(vecinoId) {
      const comp = (GSTATE.compradores || []).find(c => Number(c.vecino_id) === Number(vecinoId));
      if (!comp) return;
      let telDigits = String(comp.telefono_whatsapp || comp.telefono_normalizado || '').replace(/\D/g, '');
      if (!telDigits) {
        mostrarAvisoPantallaGestor('Este comprador no tiene número de WhatsApp registrado.', 'error');
        return;
      }
      if (!telDigits.startsWith('54')) {
        telDigits = telDigits.replace(/^0+/, '');
        if (telDigits.length > 10 && telDigits.startsWith('15')) {
          telDigits = telDigits.slice(2);
        }
        telDigits = `549${telDigits}`;
      }
      const nombreMarca = GSTATE.nodo?.nombre_marca || 'nuestra tienda';
      const primerNombre = String(comp.nombre_completo || '').trim().split(/\s+/)[0] || '';
      const saludo = primerNombre ? `¡Hola ${primerNombre}!` : '¡Hola!';
      const texto = `${saludo} Te escribo de *${nombreMarca}* 😊`;
      window.open(`https://wa.me/${telDigits}?text=${encodeURIComponent(texto)}`, '_blank', 'noopener');
    }

      const filtrados = obtenerCompradoresFiltradosGestor();
      if ((GSTATE.compradores || []).length === 0) {
        return `

            Todavía no hay compradores registrados en tu tienda.<br>
            <span style="font-size:0.84rem;">Cuando alguien haga su primer pedido o se registre en tu tienda, aparecerá acá automáticamente.</span>
          </div>
        `;
      }
      if (filtrados.length === 0) {
        return `
          <div class="card" style="text-align:center; padding:24px 18px; color:var(--muted);">
            No se encontraron compradores que coincidan con ese filtro o búsqueda.
          </div>
        `;
      }

      return filtrados.map(c => {
        const up = c.ultimo_pedido || null;
        const metaHito = up ? _obtenerMetaHitoGestor(up) : null;
        const saldo = Number(c.saldo_actual || 0);
        const esRecurrente = Boolean(c.es_recurrente);
        const tieneActivo = Boolean(c.tiene_pedido_en_curso);
        const fechaAlta = formatearFechaCortaComprador(c.created_at);
        const cantTotales = Number(c.cantidad_pedidos_activos || 0) + Number(c.cantidad_pedidos_entregados || 0);
        const telDisplay = String(c.telefono_whatsapp || '').trim();

        return `
          <div class="card" style="padding:14px 16px;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;">
              <div style="min-width:0; flex:1;">
                <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                  <strong style="font-size:1rem; color:var(--text);">${esc(c.nombre_completo || 'Comprador')}</strong>
                  ${c.codigo_vecino ? `<span style="font-size:0.72rem; font-weight:800; padding:2px 7px; border-radius:999px; background:var(--bg); border:1px solid var(--border); color:var(--muted);">${esc(c.codigo_vecino)}</span>` : ''}
                  ${tieneActivo ? `<span style="font-size:0.72rem; font-weight:800; padding:2px 8px; border-radius:999px; background:var(--brand-soft); border:1px solid var(--brand-border); color:var(--brand-dark);">🚚 Pedido activo</span>` : ''}

    // =========================================================================
    // ETAPAS B4 + B5: HOJA DE RUTA, PIN DE CASA, AUSENTES Y CONDUCCIÓN NOCTURNA
    // =========================================================================
    let _nocturnoWakeLock = null;
    let _radarWatchId = null;
    let _radarHeartbeatTimer = null;
    let _radarUltPos = null;
    let _radarUltimoEnvioMs = 0;
    let _pinCasaLeafletMap = null;
    let _pinCasaLeafletMarker = null;
    let _pinCasaCoordsDraft = null;

    function _normalizarDirPuertaGestor(txt = '') {
      return String(txt || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function _resolverCoordsEfectivasPedidoGestor(p) {
      const pLat = Number(p?.latitud);
      const pLng = Number(p?.longitud);
      if (Number.isFinite(pLat) && Number.isFinite(pLng) && pLat !== 0 && pLng !== 0) {
        return { lat: pLat, lng: pLng, origen: p.gps_origen || 'PEDIDO' };
      }
      return null;
    }

    function _clavePuertaParadaGestor(p) {
      const coords = _resolverCoordsEfectivasPedidoGestor(p);
      if (coords) {
        return `${coords.lat.toFixed(4)},${coords.lng.toFixed(4)}`;
      }
      const norm = _normalizarDirPuertaGestor(p?.direccion_entrega || '');
      return norm || `ped-${p.id}`;
    }

    function _distanciaMetrosGestor(lat1, lng1, lat2, lng2) {
      const toRad = (deg) => (deg * Math.PI) / 180;
      const R = 6371000;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function agruparParadasFisicasRepartoGestor(paradas) {
      const lista = Array.isArray(paradas) ? paradas : [];
      const grupos = [];

      for (const p of lista) {
        const coords = _resolverCoordsEfectivasPedidoGestor(p);
        const normDir = _normalizarDirPuertaGestor(p?.direccion_entrega || '');
        const claveFallback = _clavePuertaParadaGestor(p);

        let grupo = grupos.find(g => {
          if (coords && g.coords) {
            return _distanciaMetrosGestor(g.coords.lat, g.coords.lng, coords.lat, coords.lng) <= 25;
          }
          if (!coords && !g.coords) {
            return (normDir && g.normDir === normDir) || g.key === claveFallback;
          }
          return false;
        });

        if (!grupo) {
          grupo = {
            key: `grp-${p.id}`,
            doorKey: claveFallback,
            normDir,
            coords: coords ? { ...coords } : null,
            pedidos: []
          };
          grupos.push(grupo);
        }
        grupo.pedidos.push(p);
      }

      return grupos.map(g => {
        const principal = g.pedidos[0];
        const nombres = [];
        for (const ped of g.pedidos) {
          const nom = String(ped.vecino_nombre || 'Vecino').trim();
          if (nom && !nombres.includes(nom)) nombres.push(nom);
        }
        const codigosLabel = g.pedidos.map(x => `#${x.codigo_pedido}`).join(' · ');
        const totalPendiente = g.pedidos
          .filter(x => !x.pago_confirmado)
          .reduce((acc, x) => acc + Number(x.total_vecino || 0), 0);
        const totalPedidos = g.pedidos.reduce((acc, x) => acc + Number(x.total_vecino || 0), 0);
        const todosPagados = g.pedidos.every(x => Boolean(x.pago_confirmado));
        const tieneManual = g.pedidos.some(x => Boolean(x.incluido_reparto_manual) && String(x.modalidad_entrega || '').toUpperCase() === 'RETIRO_NODO');
        const tieneHito3 = g.pedidos.some(x => Number(x.hito_tracking_actual || 1) === 3);
        return {
          ...g,
          direccion: principal?.direccion_entrega || 'Sin dirección especificada',
          entrecalles: principal?.entrecalles_referencia || '',
          vecinosLabel: nombres.join(' + ') || 'Vecino',
          codigosLabel,
          totalPendiente,
          totalPedidos,
          todosPagados,
          tieneManual,
          tieneHito3
        };
      });
    }

    function calcularDistanciaTotalParadasGestor(grupos) {
      const conGps = (Array.isArray(grupos) ? grupos : []).filter(g => g.coords);
      if (conGps.length === 0) return 0;
      const nLat = Number(GSTATE.nodo?.latitud);
      const nLng = Number(GSTATE.nodo?.longitud);
      const pts = (Number.isFinite(nLat) && Number.isFinite(nLng) && nLat !== 0 && nLng !== 0)
        ? [{ lat: nLat, lng: nLng }, ...conGps.map(g => g.coords)]
        : conGps.map(g => g.coords);
      let total = 0;
      for (let i = 0; i < pts.length - 1; i++) {
        total += _distanciaMetrosGestor(pts[i].lat, pts[i].lng, pts[i + 1].lat, pts[i + 1].lng);
      }
      return Math.round(total);
    }

    function esPedidoEnHojaRutaActiva(p) {
      if (!p) return false;
      const est = String(p.estado_operativo || '').toUpperCase();
      if (est === 'ANULADO') return false;
      if (Boolean(p.ausente_pasa_retirar)) return false;
      if (p.en_hoja_ruta === false) return false;
      const hito = Number(p.hito_tracking_actual || 1);
      const mod = String(p.modalidad_entrega || '').toUpperCase();
      if (mod === 'ENVIO_BARRIAL' && [4, 5].includes(hito)) return true;
      if (Boolean(p.incluido_reparto_manual) && [3, 4, 5].includes(hito)) return true;
      return false;
    }

    function obtenerParadasRepartoActivasGestor() {
      const lista = (GSTATE.pedidos || []).filter(p => esPedidoEnHojaRutaActiva(p));
      lista.sort((a, b) => {
        const oa = a.orden_reparto != null ? Number(a.orden_reparto) : 999999;
        const ob = b.orden_reparto != null ? Number(b.orden_reparto) : 999999;
        if (oa !== ob) return oa - ob;
        return Number(a.id) - Number(b.id);
      });
      return lista;
    }

    function obtenerPedidosAusentesGestor() {
      return (GSTATE.pedidos || []).filter(p =>
        String(p.estado_operativo || '').toUpperCase() !== 'ANULADO' &&
        Boolean(p.ausente_pasa_retirar) &&
        Number(p.hito_tracking_actual || 1) < 6
      );
    }

    function obtenerPedidosDisponiblesAgregarRepartoGestor() {
      return (GSTATE.pedidos || []).filter(p => {
        const est = String(p.estado_operativo || '').toUpperCase();
        if (est === 'ANULADO') return false;
        const hito = Number(p.hito_tracking_actual || 1);
        if (![3, 4, 5].includes(hito)) return false;
        if (esPedidoEnHojaRutaActiva(p)) return false;
        return true;
      }).map(p => {
        const mod = String(p.modalidad_entrega || '').toUpperCase();
        let categoria = 'ENVIO_FUERA';
        if (Boolean(p.ausente_pasa_retirar)) categoria = 'AUSENTE';
        else if (mod === 'RETIRO_NODO') categoria = 'RETIRO';
        return { ...p, _categoriaAgregar: categoria };
      });
    }

    function _sincronizarEstadoRepartoEnMemoria(data) {
      const mods = Array.isArray(data?.pedidos_modificados) ? data.pedidos_modificados : [];
      const ordenAct = Array.isArray(data?.orden_reparto_actual) ? data.orden_reparto_actual : [];
      const modMap = new Map(mods.map(m => [Number(m.id), m]));
      const ordenMap = new Map(ordenAct.map(o => [Number(o.id), o]));
      (GSTATE.pedidos || []).forEach(p => {
        const pid = Number(p.id);
        const m = modMap.get(pid);
        if (m) {
          if (m.en_hoja_ruta !== undefined) p.en_hoja_ruta = Boolean(m.en_hoja_ruta);
          if (m.incluido_reparto_manual !== undefined) p.incluido_reparto_manual = Boolean(m.incluido_reparto_manual);
          if (m.ausente_pasa_retirar !== undefined) p.ausente_pasa_retirar = Boolean(m.ausente_pasa_retirar);
          if (m.hito_tracking_actual !== undefined) p.hito_tracking_actual = Number(m.hito_tracking_actual);
          if (m.estado_operativo !== undefined) p.estado_operativo = m.estado_operativo;
          if (m.direccion_entrega !== undefined) p.direccion_entrega = m.direccion_entrega;
          if (m.entrecalles_referencia !== undefined) p.entrecalles_referencia = m.entrecalles_referencia;
          if (m.latitud != null) p.latitud = Number(m.latitud);
          if (m.longitud != null) p.longitud = Number(m.longitud);
          p.orden_reparto = m.orden_reparto != null ? Number(m.orden_reparto) : null;
        }
        const o = ordenMap.get(pid);
        if (o) {
          p.orden_reparto = o.orden_reparto != null ? Number(o.orden_reparto) : p.orden_reparto;
          if (o.en_hoja_ruta !== undefined) p.en_hoja_ruta = Boolean(o.en_hoja_ruta);
          if (o.incluido_reparto_manual !== undefined) p.incluido_reparto_manual = Boolean(o.incluido_reparto_manual);
        }
      });
      GSTATE.repartoDistanciaMetros = 0;
    }

    function renderSeccionReparto() {
      const paradas = obtenerParadasRepartoActivasGestor();
      const gruposPuerta = agruparParadasFisicasRepartoGestor(paradas);
      const disponiblesAgregar = obtenerPedidosDisponiblesAgregarRepartoGestor();
      const ausentes = obtenerPedidosAusentesGestor();
      const hito3Envios = (GSTATE.pedidos || []).filter(p =>
        String(p.estado_operativo || '').toUpperCase() !== 'ANULADO' &&
        String(p.modalidad_entrega || '').toUpperCase() === 'ENVIO_BARRIAL' &&

        p.lote_canasto_id
      );

      // Lotes únicos en Hito 3 para atajo directo de recepción
      const lotesHito3 = [];
      const vistoLote = new Set();
      for (const p of hito3Envios) {
        const lid = Number(p.lote_canasto_id);
        if (!vistoLote.has(lid)) {
          vistoLote.add(lid);
          lotesHito3.push({
            id: lid,
            codigo: p.lote_codigo_canasto || `CAN-${lid}`,
            cantidad: hito3Envios.filter(x => Number(x.lote_canasto_id) === lid).length
          });
        }
      }

      // Mapeo por puerta física para mostrar badges coherentes en la secuencia
      const conteoPorPuerta = new Map();
      const numeroPuertaPorClave = new Map();
      gruposPuerta.forEach((g, idxPuerta) => {
        for (const ped of g.pedidos) {
          conteoPorPuerta.set(Number(ped.id), g.pedidos.length);
          numeroPuertaPorClave.set(Number(ped.id), idxPuerta + 1);
        }
      });

      const sinGpsCount = paradas.filter(p => !_resolverCoordsEfectivasPedidoGestor(p)).length;
      const totalACobrarEfectivo = paradas
        .filter(p => !p.pago_confirmado)
        .reduce((acc, p) => acc + Number(p.total_vecino || 0), 0);
      const hayEnCamino = paradas.some(p => Number(p.hito_tracking_actual || 1) === 5);
      const distEstimadaMetros = GSTATE.repartoDistanciaMetros > 0
        ? GSTATE.repartoDistanciaMetros
        : calcularDistanciaTotalParadasGestor(gruposPuerta);

      const primeraParada = paradas[0] || null;
      const primerGrupo = gruposPuerta[0] || null;
      const coordsPrimera = primeraParada ? _resolverCoordsEfectivasPedidoGestor(primeraParada) : null;
      const urlMapsPrimera = primeraParada ? armarUrlGoogleMapsNocturno(primeraParada) : '#';

      return `
        ${lotesHito3.map(l => `
          <div class="card" style="background:#eff6ff; border:1.5px solid #93c5fd;">
            <div style="font-size:0.78rem; font-weight:900; color:#1e3a8a; text-transform:uppercase;">

            </div>
            <button type="button" id="btn-recibir-lote-${l.id}" onclick="confirmarRecepcionLoteGestor(${l.id})"
              style="width:100%; min-height:38px; border-radius:10px; border:none; background:#1d4ed8; color:#ffffff; font-family:inherit; font-weight:900; font-size:0.88rem; cursor:pointer;">
              📥 Confirmar recepción del lote ${esc(l.codigo)}
            </button>
          </div>
        `).join('')}

        <!-- CABECERA OPERATIVA PRINCIPAL (ESTILO LOGÍSTICA LAMDA) -->
        <div class="card" style="background:linear-gradient(135deg, #0f172a, #1e293b); color:#f8fafc; border-color:#334155;">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
            <div style="min-width:0;">
              <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                <span style="font-size:0.75rem; font-weight:800; color:#38bdf8; text-transform:uppercase;">

    async function quitarPedidosDeHojaRutaGestor(pedidoIds = [], opciones = {}) {
      if (!GSTATE.nodo?.id) return;
      const ids = Array.from(new Set((Array.isArray(pedidoIds) ? pedidoIds : []).map(x => Number(x)).filter(x => x > 0)));
      if (ids.length === 0) return;

      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/reparto/seleccion`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            accion: 'QUITAR',
            pedido_ids: ids
          })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo quitar de la ruta: ' + (data.error || `HTTP ${resp.status}`), 'error');
          return;
        }

        _sincronizarEstadoRepartoEnMemoria(data);

        if (_acomodarAbierto) {
          const dropSet = new Set(ids);
          const restantesOrdenados = [];
          for (const grp of _acomodarParadasDraft) {
            for (const ped of grp.pedidos) {
              if (!dropSet.has(Number(ped.id))) {
                restantesOrdenados.push(ped);
              }
            }
          }
          _acomodarParadasDraft = agruparParadasFisicasRepartoGestor(restantesOrdenados);
          if (_acomodarParadasDraft.length === 0) {
            cerrarModalAcomodarRutaGestor();
          } else {
            if (!(_acomodarParadasDraft.some(g => g.key === _acomodarHighlightKey))) {
              _acomodarHighlightKey = _acomodarParadasDraft[0]?.key || null;
            }
            actualizarSubtituloAcomodarRuta();
            _refrescarBotonAgregarAcomodar();
            renderListaAcomodarRuta();
            dibujarMapaAcomodarRuta(true);
          }
        }

        renderVistaGestor();
        mostrarAvisoPantallaGestor(
          ids.length === 1
            ? 'Pedido bajado de esta vuelta (queda disponible en ➕ Agregar Pedidos).'
            : `${ids.length} pedidos bajados de esta vuelta (quedan en ➕ Agregar Pedidos).`,
          'ok'
        );
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de red al quitar pedido de la hoja de ruta.', 'error');
      }
    }

    function toggleCheckAgregarReparto(pedidoId, checked) {

        btn.style.opacity = cant > 0 ? '1' : '0.5';
        btn.textContent = cant > 0
          ? `✅ Sumar seleccionados a la ruta (${cant})`

    async function confirmarAgregarSeleccionadosRepartoGestor(desdeAcomodar = false) {
      if (!GSTATE.nodo?.id || _agregarSeleccionIds.size === 0) return;
      const btn = document.getElementById('btn-confirmar-agregar-reparto');
      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Sumando...';
      }

      const pedidoIds = Array.from(_agregarSeleccionIds);
      const detalles = pedidoIds
        .filter(pid => _agregarDirsDraft.has(pid) && String(_agregarDirsDraft.get(pid) || '').trim() !== '')
        .map(pid => ({
          pedido_id: pid,
          direccion_entrega: String(_agregarDirsDraft.get(pid) || '').trim()
        }));

      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/reparto/seleccion`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            accion: 'AGREGAR',
            pedido_ids: pedidoIds,
            detalles
          })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudieron sumar pedidos: ' + (data.error || `HTTP ${resp.status}`), 'error');
          if (btn) { btn.disabled = false; btn.textContent = '✅ Sumar seleccionados a la ruta'; }
          return;
        }

        _sincronizarEstadoRepartoEnMemoria(data);
        cerrarModalAgregarRepartoGestor();

        if (desdeAcomodar && _acomodarAbierto) {
          // Conservar orden previo en borrador y anexar los recién sumados al final (agrupando puerta si coincide)
          const prevOrderIds = _acomodarParadasDraft.flatMap(g => g.pedidos.map(x => Number(x.id)));
          const addedSet = new Set(pedidoIds);
          const allActivas = obtenerParadasRepartoActivasGestor();
          const mapById = new Map(allActivas.map(p => [Number(p.id), p]));
          const ordenFinalLista = [];
          for (const pid of prevOrderIds) {
            if (mapById.has(pid)) {
              ordenFinalLista.push(mapById.get(pid));
              mapById.delete(pid);
            }
          }
          for (const p of allActivas) {
            if (mapById.has(Number(p.id))) {
              ordenFinalLista.push(p);
              if (addedSet.has(Number(p.id))) _acomodarHighlightKey = null;
            }
          }
          _acomodarParadasDraft = agruparParadasFisicasRepartoGestor(ordenFinalLista);
          if (!_acomodarHighlightKey) _acomodarHighlightKey = _acomodarParadasDraft[_acomodarParadasDraft.length - 1]?.key || null;
          actualizarSubtituloAcomodarRuta();
          _refrescarBotonAgregarAcomodar();
          renderListaAcomodarRuta();
          dibujarMapaAcomodarRuta(true);
        }

        renderVistaGestor();
        mostrarAvisoPantallaGestor(`✅ ${data.actualizados || pedidoIds.length} pedido(s) sumados a esta Hoja de Ruta.`, 'ok');
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de red al sumar pedidos a la ruta.', 'error');
        if (btn) { btn.disabled = false; btn.textContent = '✅ Sumar seleccionados a la ruta'; }
      }
    }

    async function sugerirOrdenOptimoRepartoGestor() {
      if (!GSTATE.nodo?.id) return;
      const paradas = obtenerParadasRepartoActivasGestor();
      if (paradas.length === 0) return;

      let origenLat = null;
      let origenLng = null;
      if (navigator.geolocation) {
        try {
          const pos = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: false, timeout: 2500, maximumAge: 60000 });
          });
          origenLat = pos.coords.latitude;
          origenLng = pos.coords.longitude;
        } catch (_) {}
      }

      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/reparto/sugerir-orden`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            origen_lat: origenLat,
            origen_lng: origenLng,
            guardar: true
          })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo calcular la ruta óptima: ' + (data.error || `HTTP ${resp.status}`), 'error');
          return;
        }
        GSTATE.repartoDistanciaMetros = Number(data.distancia_total_metros || 0);
        mostrarAvisoPantallaGestor(
          `🧭 Ruta ordenada (${data.cantidad_con_gps} con GPS${data.cantidad_sin_gps > 0 ? `, ${data.cantidad_sin_gps} sin pin al final` : ''}).`,
          'ok'
        );
        await cargarPanelGestor();
      } catch (_) {
        mostrarAvisoPantallaGestor('Error al calcular la ruta óptima.', 'error');
      }
    }

    async function moverParadaRepartoGestor(pedidoId, delta) {
      if (!GSTATE.nodo?.id) return;
      const paradas = obtenerParadasRepartoActivasGestor();
      const idx = paradas.findIndex(p => Number(p.id) === Number(pedidoId));
      const nuevoIdx = idx + Number(delta);
      if (idx < 0 || nuevoIdx < 0 || nuevoIdx >= paradas.length) return;

      const copia = paradas.slice();
      const [movido] = copia.splice(idx, 1);
      copia.splice(nuevoIdx, 0, movido);
      const ordenIds = copia.map(p => Number(p.id));

      // Actualización optimista en pantalla + guardado backend
      copia.forEach((p, i) => { p.orden_reparto = i + 1; });
      renderVistaGestor();

      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/reparto/orden`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orden_ids: ordenIds })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo guardar el orden: ' + (data.error || `HTTP ${resp.status}`), 'error');
          await cargarPanelGestor();
        }
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de red al guardar el nuevo orden.', 'error');
      }
    }

        window.removeEventListener('pointerup', _acomodarDragCtx.onEnd);
        window.removeEventListener('pointercancel', _acomodarDragCtx.onEnd);
      } catch (_) {}
      try {
        if (_acomodarDragCtx.ghost && _acomodarDragCtx.ghost.parentNode) {
          _acomodarDragCtx.ghost.parentNode.removeChild(_acomodarDragCtx.ghost);
        }
        if (_acomodarDragCtx.rowEl) {
          _acomodarDragCtx.rowEl.classList.remove('is-drag-placeholder');

      } catch (_) {}
      _acomodarDragCtx = null;

    function actualizarSubtituloAcomodarRuta() {
      _acomodarDistanciaMetros = calcularDistanciaTotalParadasGestor(_acomodarParadasDraft);
      const sub = document.getElementById('acomodar-subtitulo-stats');
      if (!sub) return;
      const conGps = _acomodarParadasDraft.filter(g => g.coords).length;
      const sinGps = _acomodarParadasDraft.length - conGps;
      const totPedidos = _acomodarParadasDraft.reduce((acc, g) => acc + g.pedidos.length, 0);
      const distTxt = _acomodarDistanciaMetros > 0 ? ` · ~${(_acomodarDistanciaMetros / 1000).toFixed(1)} km` : '';
      sub.textContent = `${_acomodarParadasDraft.length} parada${_acomodarParadasDraft.length === 1 ? '' : 's'} (${totPedidos} ped.)${sinGps > 0 ? ` · ${sinGps} sin GPS` : ''}${distTxt}`;
    }

    function inicializarMapaAcomodarRuta() {
      const el = document.getElementById('acomodar-leaflet-map');
      if (!el || !window.L) return;

      const conGps = _acomodarParadasDraft.find(g => g.coords);
      const latIni = Number(GSTATE.nodo?.latitud) || conGps?.coords?.lat || -34.92145;
      const lngIni = Number(GSTATE.nodo?.longitud) || conGps?.coords?.lng || -57.95453;

      if (_acomodarMap) {
        try { _acomodarMap.remove(); } catch (_) {}
      }

      const map = window.L.map(el, { zoomControl: true, tap: true }).setView([latIni, lngIni], 14);
      window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 19
      }).addTo(map);

      _acomodarLayerGroup = window.L.layerGroup().addTo(map);
      _acomodarPinDraftLayer = window.L.layerGroup().addTo(map);
      _acomodarMap = map;

      map.on('click', (ev) => {
        if (!_acomodarPinTargetKey || !ev?.latlng) return;
        fijarBorradorPinInlineEnMapa(ev.latlng.lat, ev.latlng.lng);
      });

      dibujarMapaAcomodarRuta(true);
      setTimeout(() => { try { map.invalidateSize(); } catch (_) {} }, 150);
    }

    function centrarMapaAcomodarRutaGestor() {
      dibujarMapaAcomodarRuta(true);
    }

    function _obtenerNumeroVisibleGrupoAcomodar(g, idx) {
      if (_acomodarTocarOrdenActivo) {
        const posTap = _acomodarTocarKeys.indexOf(g.key);
        return posTap >= 0 ? String(posTap + 1) : '?';
      }
      return String(idx + 1);
    }

    function dibujarMapaAcomodarRuta(fit = false) {
      if (!_acomodarMap || !_acomodarLayerGroup || !window.L) return;
      _acomodarLayerGroup.clearLayers();

      const boundsPts = [];
      const nLat = Number(GSTATE.nodo?.latitud);
      const nLng = Number(GSTATE.nodo?.longitud);
      const tieneNodo = Number.isFinite(nLat) && Number.isFinite(nLng) && nLat !== 0 && nLng !== 0;

      if (tieneNodo) {
        boundsPts.push([nLat, nLng]);
        const nodoIcon = window.L.divIcon({
          className: '',
          html: `<div class="acomodar-pin-nodo">🏠 ${esc((GSTATE.nodo?.nombre_marca || 'Punto').slice(0, 14))}</div>`,
          iconSize: [96, 28],
          iconAnchor: [48, 14]
        });
        window.L.marker([nLat, nLng], { icon: nodoIcon, zIndexOffset: 200 }).addTo(_acomodarLayerGroup);
      }

      // Puntos ordenados para la polilínea
      let gruposRutaLine = [];
      if (_acomodarTocarOrdenActivo) {
        gruposRutaLine = _acomodarTocarKeys
          .map(k => _acomodarParadasDraft.find(g => g.key === k))
          .filter(g => g && g.coords);
      } else {
        gruposRutaLine = _acomodarParadasDraft.filter(g => g.coords);
      }

      const stopLatLngs = gruposRutaLine.map(g => [g.coords.lat, g.coords.lng]);

      if (tieneNodo && stopLatLngs.length > 0) {
        window.L.polyline([[nLat, nLng], stopLatLngs[0]], {
          color: '#64748b',
          weight: 3,
          dashArray: '6, 8',
          opacity: 0.8
        }).addTo(_acomodarLayerGroup);
      }

      if (stopLatLngs.length > 1) {
        const lineColor = _acomodarTocarOrdenActivo ? '#16a34a' : '#2563eb';
        window.L.polyline(stopLatLngs, {
          color: lineColor,
          weight: 4.5,
          opacity: 0.9
        }).addTo(_acomodarLayerGroup);

        // Flechas de dirección discretas en el punto medio de cada tramo
        for (let i = 0; i < stopLatLngs.length - 1; i++) {
          const p1 = stopLatLngs[i];
          const p2 = stopLatLngs[i + 1];
          const distSeg = _distanciaMetrosGestor(p1[0], p1[1], p2[0], p2[1]);
          if (distSeg < 45) continue;
          const midLat = (p1[0] + p2[0]) / 2;
          const midLng = (p1[1] + p2[1]) / 2;
          const angDeg = Math.atan2(p2[1] - p1[1], p2[0] - p1[0]) * (180 / Math.PI) - 90;
          const arrowIcon = window.L.divIcon({
            className: '',
            html: `<div style="transform:rotate(${angDeg.toFixed(1)}deg); color:${lineColor}; font-size:13px; font-weight:900; text-shadow:0 0 3px #fff, 0 0 3px #fff; line-height:1;">➤</div>`,
            iconSize: [16, 16],
            iconAnchor: [8, 8]
          });
          window.L.marker([midLat, midLng], { icon: arrowIcon, interactive: false }).addTo(_acomodarLayerGroup);
        }
      }

      // Marcadores de paradas físicas
      _acomodarParadasDraft.forEach((g, idx) => {
        if (!g.coords) return;
        boundsPts.push([g.coords.lat, g.coords.lng]);

        const numTxt = _obtenerNumeroVisibleGrupoAcomodar(g, idx);
        const esTapped = _acomodarTocarOrdenActivo && _acomodarTocarKeys.includes(g.key);
        const esPendienteTap = _acomodarTocarOrdenActivo && !esTapped;
        const esHighlight = _acomodarHighlightKey === g.key;
        const cantPeds = g.pedidos.length;

        const clases = [
          'acomodar-pin-badge',
          esTapped ? 'tapped' : '',
          esPendienteTap ? 'pending' : '',
          esHighlight ? 'highlighted' : ''
        ].filter(Boolean).join(' ');

        const multiBadge = cantPeds > 1 ? `<span class="acomodar-pin-multi">×${cantPeds}</span>` : '';
        const icon = window.L.divIcon({
          className: '',
          html: `<div class="${clases}">${esc(numTxt)}${multiBadge}</div>`,
          iconSize: [36, 36],
          iconAnchor: [18, 18]
        });

        const marker = window.L.marker([g.coords.lat, g.coords.lng], {
          icon,
          zIndexOffset: esHighlight ? 900 : (500 - idx)
        }).addTo(_acomodarLayerGroup);

        marker.on('click', () => {
          if (_acomodarPinTargetKey) {
            // Si estaba ubicando otro pin en el mapa, no interrumpir con highlight
            return;
          }
          if (_acomodarTocarOrdenActivo) {
            tocarPinEnModoOrdenAcomodar(g.key);
          } else {
            seleccionarParadaEnAcomodarRuta(g.key, false);
          }
        });
      });

      if (fit && boundsPts.length > 0) {
        try {
          if (boundsPts.length === 1) {
            _acomodarMap.setView(boundsPts[0], 15);
          } else {
            _acomodarMap.fitBounds(window.L.latLngBounds(boundsPts), { padding: [38, 38], maxZoom: 16 });
          }
        } catch (_) {}
      }
    }

    function seleccionarParadaEnAcomodarRuta(key, panMap = true) {
      _acomodarHighlightKey = key;
      const g = _acomodarParadasDraft.find(x => x.key === key);
      dibujarMapaAcomodarRuta(false);
      renderListaAcomodarRuta();

      if (panMap && g?.coords && _acomodarMap) {
        try {
          _acomodarMap.panTo([g.coords.lat, g.coords.lng], { animate: true });
        } catch (_) {}
      }
      if (!panMap) {
        const rowEl = document.querySelector(`#acomodar-lista-items .acomodar-row[data-key="${CSS.escape(key)}"]`);
        if (rowEl) {
          try { rowEl.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (_) {}
        }
      }
    }

    function renderBarraTocarOrdenAcomodar() {
      const btn = document.getElementById('btn-acomodar-tocar-orden');
      const banner = document.getElementById('acomodar-tocar-banner');
      if (btn) {
        if (_acomodarTocarOrdenActivo) {
          btn.textContent = '✓ Salir pines';
          btn.style.background = '#16a34a';
          btn.style.borderColor = '#15803d';
          btn.style.color = '#ffffff';
        } else {
          btn.textContent = '👆 Tocar pines';
          btn.style.background = '#f8fafc';
          btn.style.borderColor = '#cbd5e1';
          btn.style.color = '#0f172a';
        }
      }
      if (banner) {
        if (_acomodarTocarOrdenActivo) {
          const totalConGps = _acomodarParadasDraft.filter(g => g.coords).length;
          banner.style.display = 'flex';
          banner.innerHTML = `
            <span style="flex:1; min-width:0;">
              👆 Tocá los pines en orden (${_acomodarTocarKeys.length}/${totalConGps})
            </span>
            <div style="display:flex; gap:6px; flex-shrink:0;">
              <button type="button" onclick="deshacerUltimoTapOrdenAcomodar()" ${_acomodarTocarKeys.length === 0 ? 'disabled' : ''}
                style="min-height:32px; padding:0 9px; border-radius:8px; border:1px solid #64748b; background:#1e293b; color:#ffffff; font-family:inherit; font-weight:800; font-size:0.78rem; cursor:pointer;">
                ↺ Deshacer
              </button>
              <button type="button" onclick="toggleModoTocarOrdenAcomodar()"
                style="min-height:32px; padding:0 9px; border-radius:8px; border:none; background:#22c55e; color:#052e16; font-family:inherit; font-weight:900; font-size:0.78rem; cursor:pointer;">
                ✓ Listo
              </button>
            </div>
          `;
        } else {
          banner.style.display = 'none';
          banner.innerHTML = '';
        }
      }
    }

    function toggleModoTocarOrdenAcomodar() {
      if (_acomodarPinTargetKey) cancelarPinInlineAcomodar();
      const conGps = _acomodarParadasDraft.filter(g => g.coords);
      if (conGps.length === 0) {
        mostrarAvisoPantallaGestor('Primero ubicá al menos un pin en el mapa para ordenarlo tocando pines.', 'error');
        return;
      }
      _acomodarTocarOrdenActivo = !_acomodarTocarOrdenActivo;
      if (_acomodarTocarOrdenActivo) {
        _acomodarTocarKeys = [];
      }
      renderBarraTocarOrdenAcomodar();
      renderListaAcomodarRuta();
      dibujarMapaAcomodarRuta(false);
    }

    function _aplicarSecuenciaTapSobreDraftAcomodar() {
      const elegidos = _acomodarTocarKeys
        .map(k => _acomodarParadasDraft.find(g => g.key === k))
        .filter(Boolean);
      const setElegidos = new Set(_acomodarTocarKeys);
      const restantesConGps = _acomodarParadasDraft.filter(g => g.coords && !setElegidos.has(g.key));
      const sinGps = _acomodarParadasDraft.filter(g => !g.coords && !setElegidos.has(g.key));
      _acomodarParadasDraft = [...elegidos, ...restantesConGps, ...sinGps];
    }

    function tocarPinEnModoOrdenAcomodar(key) {
      if (!_acomodarTocarOrdenActivo) return;
      const idxExistente = _acomodarTocarKeys.indexOf(key);
      if (idxExistente !== -1) {
        if (idxExistente === _acomodarTocarKeys.length - 1) {
          _acomodarTocarKeys.pop();
        } else {
          return;
        }
      } else {
        _acomodarTocarKeys.push(key);
      }
      _acomodarHighlightKey = key;
      _aplicarSecuenciaTapSobreDraftAcomodar();
      actualizarSubtituloAcomodarRuta();
      renderBarraTocarOrdenAcomodar();
      renderListaAcomodarRuta();
      dibujarMapaAcomodarRuta(false);

      const totalConGps = _acomodarParadasDraft.filter(g => g.coords).length;
      if (_acomodarTocarKeys.length >= totalConGps && totalConGps > 0) {
        _acomodarTocarOrdenActivo = false;
        _acomodarTocarKeys = [];
        renderBarraTocarOrdenAcomodar();
        renderListaAcomodarRuta();
        dibujarMapaAcomodarRuta(false);
        mostrarAvisoPantallaGestor('✅ Secuencia completa armada desde el mapa. Revisala o tocá Confirmar Orden.', 'ok');
      }
    }

    function deshacerUltimoTapOrdenAcomodar() {
      if (!_acomodarTocarOrdenActivo || _acomodarTocarKeys.length === 0) return;
      _acomodarTocarKeys.pop();
      _aplicarSecuenciaTapSobreDraftAcomodar();
      actualizarSubtituloAcomodarRuta();
      renderBarraTocarOrdenAcomodar();
      renderListaAcomodarRuta();
      dibujarMapaAcomodarRuta(false);
    }

    async function sugerirVueltaCortaEnAcomodarGestor() {
      if (!GSTATE.nodo?.id || _acomodarParadasDraft.length === 0) return;
      if (_acomodarTocarOrdenActivo) {
        _acomodarTocarOrdenActivo = false;
        _acomodarTocarKeys = [];
        renderBarraTocarOrdenAcomodar();
      }
      const btn = document.getElementById('btn-acomodar-vuelta-corta');
      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Calculando...';
      }

      let origenLat = null;
      let origenLng = null;
      if (navigator.geolocation) {
        try {
          const pos = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: false, timeout: 2200, maximumAge: 60000 });
          });
          origenLat = pos.coords.latitude;
          origenLng = pos.coords.longitude;
        } catch (_) {}
      }

      try {
        const pedidoIds = _acomodarParadasDraft.flatMap(g => g.pedidos.map(p => Number(p.id)));
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/reparto/sugerir-orden`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            pedido_ids: pedidoIds,
            origen_lat: origenLat,
            origen_lng: origenLng,
            guardar: false
          })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok || !Array.isArray(data.orden_ids)) {
          mostrarAvisoPantallaGestor('No se pudo calcular la vuelta corta: ' + (data.error || `HTTP ${resp.status}`), 'error');
          return;
        }

        const posPorPedido = new Map();
        data.orden_ids.forEach((pid, i) => posPorPedido.set(Number(pid), i));
        _acomodarParadasDraft.sort((a, b) => {
          const minA = Math.min(...a.pedidos.map(p => posPorPedido.has(Number(p.id)) ? posPorPedido.get(Number(p.id)) : 999999));
          const minB = Math.min(...b.pedidos.map(p => posPorPedido.has(Number(p.id)) ? posPorPedido.get(Number(p.id)) : 999999));
          return minA - minB;
        });
        _acomodarHighlightKey = _acomodarParadasDraft[0]?.key || null;
        actualizarSubtituloAcomodarRuta();
        renderListaAcomodarRuta();
        dibujarMapaAcomodarRuta(true);
        mostrarAvisoPantallaGestor('⚡ Vuelta corta aplicada. Deslizá o retocá si querés antes de confirmar.', 'ok');
      } catch (_) {
        mostrarAvisoPantallaGestor('Error al calcular la vuelta corta.', 'error');
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = '⚡ Vuelta corta';
        }
      }
    }

    function iniciarUbicacionPinEnAcomodar(key, ev) {
      if (ev) ev.stopPropagation();
      if (_acomodarTocarOrdenActivo) {
        _acomodarTocarOrdenActivo = false;
        _acomodarTocarKeys = [];
        renderBarraTocarOrdenAcomodar();
      }
      const g = _acomodarParadasDraft.find(x => x.key === key);
      if (!g) return;
      _acomodarPinTargetKey = key;
      _acomodarHighlightKey = key;
      _acomodarPinDraftCoords = g.coords ? { lat: g.coords.lat, lng: g.coords.lng } : null;

      if (_acomodarPinDraftLayer) _acomodarPinDraftLayer.clearLayers();
      if (_acomodarPinDraftCoords) {
        fijarBorradorPinInlineEnMapa(_acomodarPinDraftCoords.lat, _acomodarPinDraftCoords.lng);
      }

      const bar = document.getElementById('acomodar-pin-inline-bar');
      if (bar) {
        const queryDef = [g.direccion, GSTATE.nodo?.barrio_zona].filter(Boolean).join(', ');
        bar.style.display = 'block';
        bar.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px;">
            <div style="font-size:0.86rem; font-weight:900; color:#92400e;">
              📍 Ubicando a ${esc(g.vecinosLabel)} (${esc(g.codigosLabel)})
            </div>
            <button type="button" onclick="cancelarPinInlineAcomodar()"
              style="border:none; background:rgba(146,64,14,0.12); color:#78350f; border-radius:8px; padding:3px 9px; font-weight:900; cursor:pointer;">
              ✕ Cancelar
            </button>
          </div>
          <div style="display:flex; gap:6px; margin-bottom:6px;">
            <input type="text" id="acomodar-pin-search-input" value="${esc(queryDef)}"
              placeholder="Buscar calle y altura..."
              style="flex:1; min-width:0; min-height:42px; padding:6px 10px; border-radius:10px; border:1px solid #f59e0b; background:#fff; font-family:inherit; font-size:0.95rem;" />
            <button type="button" onclick="buscarGeoPinInlineAcomodar()"
              style="min-height:42px; padding:0 12px; border-radius:10px; border:none; background:#0f172a; color:#ffffff; font-family:inherit; font-weight:900; font-size:0.88rem; cursor:pointer;">
              🔎
            </button>
          </div>
          <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
            <div id="acomodar-pin-inline-estado" style="font-size:0.8rem; font-weight:800; color:#78350f; flex:1; min-width:160px;">
              👆 Tocá la calle en el mapa o buscá arriba con 🔎
            </div>
            <button type="button" id="btn-guardar-pin-inline-acomodar" onclick="confirmarPinInlineAcomodar()" disabled
              style="min-height:42px; padding:0 14px; border-radius:10px; border:none; background:#16a34a; color:#ffffff; font-family:inherit; font-weight:900; font-size:0.88rem; cursor:pointer; opacity:0.5;">
              💾 Fijar pin aquí
            </button>
          </div>
        `;
      }
      renderListaAcomodarRuta();
    }

    function fijarBorradorPinInlineEnMapa(lat, lng) {
      _acomodarPinDraftCoords = { lat: Number(Number(lat).toFixed(7)), lng: Number(Number(lng).toFixed(7)) };
      if (_acomodarPinDraftLayer && window.L) {
        _acomodarPinDraftLayer.clearLayers();
        const mk = window.L.marker([_acomodarPinDraftCoords.lat, _acomodarPinDraftCoords.lng], {
          draggable: true,
          zIndexOffset: 1200
        }).addTo(_acomodarPinDraftLayer);
        mk.on('dragend', () => {
          const p = mk.getLatLng();
          if (p) {
            _acomodarPinDraftCoords = { lat: Number(p.lat.toFixed(7)), lng: Number(p.lng.toFixed(7)) };
            const est = document.getElementById('acomodar-pin-inline-estado');
            if (est) est.textContent = `📌 Pin listo (${_acomodarPinDraftCoords.lat.toFixed(5)}, ${_acomodarPinDraftCoords.lng.toFixed(5)}) · Podés arrastrarlo`;
          }
        });
      }
      const est = document.getElementById('acomodar-pin-inline-estado');
      if (est) est.textContent = `📌 Pin listo (${_acomodarPinDraftCoords.lat.toFixed(5)}, ${_acomodarPinDraftCoords.lng.toFixed(5)}) · Arrastrá o guardá`;
      const btn = document.getElementById('btn-guardar-pin-inline-acomodar');
      if (btn) {
        btn.disabled = false;
        btn.style.opacity = '1';
      }
    }

    async function buscarGeoPinInlineAcomodar() {
      const q = (document.getElementById('acomodar-pin-search-input')?.value || '').trim();
      if (!q || !GSTATE.nodo?.id) return;
      const est = document.getElementById('acomodar-pin-inline-estado');
      if (est) est.textContent = '🔎 Buscando dirección...';
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/geocodificar?q=${encodeURIComponent(q)}`);
        const data = await leerRespuestaJsonSegura(resp);
        const item = Array.isArray(data?.resultados) ? data.resultados[0] : null;
        if (!item) {
          if (est) est.textContent = '⚠️ Sin coincidencia exacta. Tocá la cuadra directo en el mapa.';
          return;
        }
        fijarBorradorPinInlineEnMapa(item.lat, item.lng);
        if (_acomodarMap) {
          _acomodarMap.setView([Number(item.lat), Number(item.lng)], 16);
        }
        if (est) est.textContent = `✅ ${item.display_name} · Confirmá con "💾 Fijar pin aquí"`;
      } catch (_) {
        if (est) est.textContent = '❌ Error al buscar. Tocá directamente la calle en el mapa.';
      }
    }

    function cancelarPinInlineAcomodar() {
      _acomodarPinTargetKey = null;
      _acomodarPinDraftCoords = null;
      if (_acomodarPinDraftLayer) _acomodarPinDraftLayer.clearLayers();
      const bar = document.getElementById('acomodar-pin-inline-bar');
      if (bar) {
        bar.style.display = 'none';
        bar.innerHTML = '';
      }
      renderListaAcomodarRuta();
    }

    async function confirmarPinInlineAcomodar() {
      if (!GSTATE.nodo?.id || !_acomodarPinTargetKey || !_acomodarPinDraftCoords) return;
      const g = _acomodarParadasDraft.find(x => x.key === _acomodarPinTargetKey);
      if (!g || g.pedidos.length === 0) return;

      const btn = document.getElementById('btn-guardar-pin-inline-acomodar');
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Guardando...';
      }

      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/reparto/pedidos/${g.pedidos[0].id}/coordenadas`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            latitud: _acomodarPinDraftCoords.lat,
            longitud: _acomodarPinDraftCoords.lng
          })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo guardar el pin: ' + (data.error || `HTTP ${resp.status}`), 'error');
          if (btn) { btn.disabled = false; btn.textContent = '💾 Fijar pin aquí'; }
          return;
        }

        // Actualizar en memoria tanto GSTATE.pedidos como el draft actual
        const idsActualizados = new Set(g.pedidos.map(x => Number(x.id)));
        (GSTATE.pedidos || []).forEach(ped => {
          if (idsActualizados.has(Number(ped.id))) {
            ped.latitud = _acomodarPinDraftCoords.lat;
            ped.longitud = _acomodarPinDraftCoords.lng;
            ped.gps_origen = 'GESTOR_PIN';
          }
        });
        g.coords = { lat: _acomodarPinDraftCoords.lat, lng: _acomodarPinDraftCoords.lng, origen: 'GESTOR_PIN' };

        cancelarPinInlineAcomodar();
        actualizarSubtituloAcomodarRuta();
        renderListaAcomodarRuta();
        dibujarMapaAcomodarRuta(true);
        mostrarAvisoPantallaGestor(`📌 Ubicación fijada para ${g.vecinosLabel}. Ya participa en el mapa numerado.`, 'ok');
      } catch (_) {
        mostrarAvisoPantallaGestor('Error al guardar el pin en el servidor.', 'error');
        if (btn) { btn.disabled = false; btn.textContent = '💾 Fijar pin aquí'; }
      }
    }

    function moverGrupoAcomodarGestor(idx, delta, ev) {
      if (ev) ev.stopPropagation();
      const targetIdx = idx + Number(delta);
      if (idx < 0 || targetIdx < 0 || targetIdx >= _acomodarParadasDraft.length) return;
      const [movido] = _acomodarParadasDraft.splice(idx, 1);
      _acomodarParadasDraft.splice(targetIdx, 0, movido);
      _acomodarHighlightKey = movido.key;
      actualizarSubtituloAcomodarRuta();
      renderListaAcomodarRuta();
      dibujarMapaAcomodarRuta(false);
    }

    function quitarParadaDesdeAcomodarGestor(key, ev) {
      if (ev) ev.stopPropagation();
      const g = _acomodarParadasDraft.find(x => x.key === key);
      if (!g || g.pedidos.length === 0) return;

      if (g.pedidos.length === 1) {
        quitarPedidosDeHojaRutaGestor([Number(g.pedidos[0].id)], { desdeAcomodar: true });
        return;
      }

      const modal = document.getElementById('modal-recibo-gestor');
      const body = document.getElementById('modal-recibo-gestor-body');
      if (!modal || !body) {
        quitarPedidosDeHojaRutaGestor(g.pedidos.map(x => Number(x.id)), { desdeAcomodar: true });
        return;
      }

      const todosIdsJson = JSON.stringify(g.pedidos.map(x => Number(x.id)));
      body.innerHTML = `
        <div style="background:#0f172a; color:#ffffff; padding:12px 14px; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-size:0.74rem; font-weight:800; text-transform:uppercase; color:#93c5fd;">Parada Agrupada (×${g.pedidos.length})</div>
            <div style="font-size:0.98rem; font-weight:900;">📍 ${esc(g.direccion)}</div>
          </div>
          <button type="button" onclick="cerrarModalReciboGestor()" style="background:rgba(255,255,255,0.14); border:none; color:#fff; width:30px; height:30px; border-radius:999px; font-weight:900; cursor:pointer;">✕</button>
        </div>
        <div style="padding:12px 14px; color:var(--text);">
          <div style="font-size:0.84rem; font-weight:700; color:var(--muted); margin-bottom:9px;">
            Esta puerta tiene ${g.pedidos.length} pedidos juntos. Elegí si querés bajar toda la parada o solo uno:
          </div>
          <div style="display:flex; flex-direction:column; gap:7px;">
            <button type="button" onclick='cerrarModalReciboGestor(); quitarPedidosDeHojaRutaGestor(${todosIdsJson}, { desdeAcomodar: true })'
              style="min-height:38px; padding:6px 12px; border-radius:9px; border:1px solid #fecaca; background:#dc2626; color:#ffffff; font-family:inherit; font-weight:900; font-size:0.86rem; cursor:pointer;">
              ✕ Quitar toda la parada (${g.pedidos.length} pedidos)
            </button>
            ${g.pedidos.map(ped => `
              <button type="button" onclick="cerrarModalReciboGestor(); quitarPedidosDeHojaRutaGestor([${Number(ped.id)}], { desdeAcomodar: true })"
                class="btn-soft" style="justify-content:space-between; border-color:#fecaca; background:#fef2f2; color:#991b1b;">
                <span>✕ Bajar solo #${esc(ped.codigo_pedido)} · ${esc(ped.vecino_nombre)}</span>
                <span style="font-size:0.78rem;">${ped.pago_confirmado ? 'Pagado' : fmt(ped.total_vecino)}</span>
              </button>
            `).join('')}
            <button type="button" class="btn-soft" onclick="cerrarModalReciboGestor()">Cancelar</button>
          </div>
        </div>
      `;
      modal.style.display = 'flex';

    function vincularTouchDragListaAcomodar() {
      const container = document.getElementById('acomodar-lista-items');
      const scrollWrap = document.getElementById('acomodar-lista-wrap');
      if (!container || !scrollWrap) return;

      container.addEventListener('pointerdown', (ev) => {
        const handle = ev.target.closest('.acomodar-drag-handle');
        if (!handle || _acomodarDragCtx) return;
        const rowEl = handle.closest('.acomodar-row');
        if (!rowEl) return;

        ev.preventDefault();
        try { handle.setPointerCapture(ev.pointerId); } catch (_) {}

        if (_acomodarTocarOrdenActivo) {
          _acomodarTocarOrdenActivo = false;
          _acomodarTocarKeys = [];
          renderBarraTocarOrdenAcomodar();
        }

        const rect = rowEl.getBoundingClientRect();
        const ghost = rowEl.cloneNode(true);
        ghost.classList.add('acomodar-drag-ghost');
        ghost.style.width = `${rect.width}px`;
        ghost.style.left = `${rect.left}px`;
        ghost.style.top = `${rect.top}px`;
        document.body.appendChild(ghost);

        rowEl.classList.add('is-drag-placeholder');

        const ctx = {
          pointerId: ev.pointerId,
          startY: ev.clientY,
          currentIdx: Number(rowEl.getAttribute('data-index') || 0),
          rowEl,
          ghost,
          autoScrollSpeed: 0
        };

        const refrescarBadgesEnDom = () => {
          const rows = Array.from(container.children);
          rows.forEach((r, i) => {
            r.setAttribute('data-index', String(i));
            const numEl = r.querySelector('.acomodar-row-num');
            if (numEl) numEl.textContent = String(i + 1);
          });
        };

        const onMove = (moveEv) => {
          if (moveEv.pointerId !== ctx.pointerId) return;
          const dy = moveEv.clientY - ctx.startY;
          ctx.ghost.style.transform = `translate3d(0, ${dy}px, 0) scale(1.02)`;

          // Auto-scroll suave en los bordes de la lista deslizable
          const wrapRect = scrollWrap.getBoundingClientRect();
          if (moveEv.clientY < wrapRect.top + 48) {
            scrollWrap.scrollTop = Math.max(0, scrollWrap.scrollTop - 10);
          } else if (moveEv.clientY > wrapRect.bottom - 48) {
            scrollWrap.scrollTop += 10;
          }

          const siblings = Array.from(container.children);
          for (let i = 0; i < siblings.length; i++) {
            const sib = siblings[i];
            if (sib === ctx.rowEl) continue;
            const sRect = sib.getBoundingClientRect();
            const midY = sRect.top + (sRect.height / 2);
            if (i < ctx.currentIdx && moveEv.clientY < midY) {
              container.insertBefore(ctx.rowEl, sib);
              const [movido] = _acomodarParadasDraft.splice(ctx.currentIdx, 1);
              _acomodarParadasDraft.splice(i, 0, movido);
              ctx.currentIdx = i;
              _acomodarHighlightKey = movido.key;
              refrescarBadgesEnDom();
              actualizarSubtituloAcomodarRuta();
              dibujarMapaAcomodarRuta(false);
              break;
            } else if (i > ctx.currentIdx && moveEv.clientY > midY) {
              container.insertBefore(ctx.rowEl, sib.nextSibling);
              const [movido] = _acomodarParadasDraft.splice(ctx.currentIdx, 1);
              _acomodarParadasDraft.splice(i, 0, movido);
              ctx.currentIdx = i;
              _acomodarHighlightKey = movido.key;
              refrescarBadgesEnDom();
              actualizarSubtituloAcomodarRuta();
              dibujarMapaAcomodarRuta(false);
              break;
            }
          }
        };

        const onEnd = (endEv) => {
          if (endEv && endEv.pointerId !== undefined && endEv.pointerId !== ctx.pointerId) return;
          try { handle.releasePointerCapture(ctx.pointerId); } catch (_) {}
          _limpiarDragCtxAcomodar();
          actualizarSubtituloAcomodarRuta();
          renderListaAcomodarRuta();
          dibujarMapaAcomodarRuta(false);
        };

        ctx.onMove = onMove;
        ctx.onEnd = onEnd;
        _acomodarDragCtx = ctx;
        window.addEventListener('pointermove', onMove, { passive: true });
        window.addEventListener('pointerup', onEnd);
        window.addEventListener('pointercancel', onEnd);
      });
    }

    async function confirmarOrdenDesdeAcomodarGestor() {
      if (!GSTATE.nodo?.id || _acomodarParadasDraft.length === 0) return;
      const btn = document.getElementById('btn-confirmar-acomodar-ruta');
      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Guardando orden...';
      }

      const ordenIds = _acomodarParadasDraft.flatMap(g => g.pedidos.map(p => Number(p.id)));
      const nuevaDist = calcularDistanciaTotalParadasGestor(_acomodarParadasDraft);

      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/reparto/orden`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orden_ids: ordenIds })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo confirmar el orden: ' + (data.error || `HTTP ${resp.status}`), 'error');
          if (btn) { btn.disabled = false; btn.textContent = '✅ Confirmar Orden'; }
          return;
        }

        const ordenMap = new Map();
        ordenIds.forEach((pid, i) => ordenMap.set(Number(pid), i + 1));
        (GSTATE.pedidos || []).forEach(p => {
          if (ordenMap.has(Number(p.id))) {
            p.orden_reparto = ordenMap.get(Number(p.id));
          }
        });
        GSTATE.repartoDistanciaMetros = nuevaDist;
        const cantPuertas = _acomodarParadasDraft.length;
        cerrarModalAcomodarRutaGestor();
        renderVistaGestor();
        mostrarAvisoPantallaGestor(`✅ Orden guardado (${cantPuertas} parada${cantPuertas === 1 ? '' : 's'} física${cantPuertas === 1 ? '' : 's'}).`, 'ok');
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de red al confirmar el orden.', 'error');
        if (btn) { btn.disabled = false; btn.textContent = '✅ Confirmar Orden'; }
      }

    async function buscarDireccionPinCasaGestor() {
      const q = (document.getElementById('pin-casa-search-input')?.value || '').trim();
      if (!q || !GSTATE.nodo?.id) return;
      const lbl = document.getElementById('pin-casa-coords-label');
      if (lbl) lbl.textContent = '🔎 Buscando en GeoRef AR / OSM...';
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/geocodificar?q=${encodeURIComponent(q)}`);
        const data = await leerRespuestaJsonSegura(resp);
        const item = Array.isArray(data?.resultados) ? data.resultados[0] : null;
        if (!item) {
          if (lbl) lbl.textContent = '⚠️ No encontramos coincidencia exacta. Mové el pin manualmente en el mapa.';
          return;
        }
        _pinCasaCoordsDraft = { lat: Number(item.lat), lng: Number(item.lng) };
        if (_pinCasaLeafletMap && _pinCasaLeafletMarker) {
          _pinCasaLeafletMarker.setLatLng([_pinCasaCoordsDraft.lat, _pinCasaCoordsDraft.lng]);
          _pinCasaLeafletMap.setView([_pinCasaCoordsDraft.lat, _pinCasaCoordsDraft.lng], 16);
        }
        if (lbl) lbl.textContent = `✅ Encontrado (${item.display_name}) · ${_pinCasaCoordsDraft.lat.toFixed(5)}, ${_pinCasaCoordsDraft.lng.toFixed(5)}`;
      } catch (_) {
        if (lbl) lbl.textContent = '❌ Error al consultar el geocodificador. Arrastrá el pin en el mapa.';
      }
    }

        _nocturnoWakeLock.addEventListener('release', () => {
          _nocturnoWakeLock = null;
          actualizarIndicadorWakeLockNocturno();

      const paradas = obtenerParadasRepartoActivasGestor();
      if (paradas.length === 0) {
        mostrarAvisoPantallaGestor('No tenés pedidos listos para salir a repartir.', 'error');
        return;
      }

      const necesitaHito5 = paradas.some(p => Number(p.hito_tracking_actual || 1) === 4);
      if (necesitaHito5) {
        try {
          const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/reparto/iniciar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              pedido_ids: paradas.map(p => Number(p.id)),
              actor: GSTATE.nodo.gestor_nombre || 'Referente comercial'
            })
          });
          const data = await leerRespuestaJsonSegura(resp);
          if (!resp.ok || !data.ok) {
            mostrarAvisoPantallaGestor('No se pudo iniciar la tanda de reparto: ' + (data.error || `HTTP ${resp.status}`), 'error');
            return;
          }
          await cargarPanelGestor();
        } catch (_) {
          mostrarAvisoPantallaGestor('Error al iniciar la salida de reparto.', 'error');
          return;
        }
      }

      GSTATE.nocturnoAbierto = true;
      GSTATE.repartoIndice = 0;
      renderOverlayConduccionNocturna();
      await solicitarWakeLockNocturno();
    }

    function cerrarModoNocturno(omitirRed = false) {
      GSTATE.nocturnoAbierto = false;
      const ov = document.getElementById('gestor-nocturno-overlay');
      if (ov) ov.style.display = 'none';
      liberarWakeLockNocturno();
      apagarRadarVivoGestor(omitirRed);

    function moverIndiceNocturno(delta) {
      const paradas = obtenerParadasRepartoActivasGestor();
      if (paradas.length === 0) return;
      GSTATE.repartoIndice = Math.max(0, Math.min(paradas.length - 1, Number(GSTATE.repartoIndice || 0) + delta));
      renderOverlayConduccionNocturna();
      if (GSTATE.radarActivo) {
        enviarPingRadarVivoGestor(paradas[GSTATE.repartoIndice]?.id, true);
      }
    }

    function armarUrlWhatsAppNocturno(p, tipo) {
      const marca = GSTATE.nodo?.nombre_marca || 'nuestra tienda';
      const gestor = GSTATE.nodo?.gestor_nombre || marca;
      const primerNom = String(p.vecino_nombre || '').trim().split(/\s+/)[0] || 'vecino/a';
      const dir = p.direccion_entrega || 'tu domicilio';

      const textoReal = tipo === 'puerta'
        ? `Hola ${primerNom}! Ya estoy en la puerta de ${dir} con tu pedido #${p.codigo_pedido} de ${marca}.`
        : `Hola ${primerNom}! Soy ${gestor} de ${marca}. En unos 5 minutos llego a ${dir} con tu pedido #${p.codigo_pedido}.`;

      if (GSTATE.modoLaboratorio) {
        const telLab = String(GSTATE.telefonoPruebas || '5492216615746').replace(/\D+/g, '') || '5492216615746';
        const textoLab = `[PRUEBA LAB · Vecino: ${p.vecino_nombre || '-'} ${p.vecino_telefono || '-'}]\n\n${textoReal}`;
        return `https://wa.me/${telLab}?text=${encodeURIComponent(textoLab)}`;
      }

      const digs = String(p.vecino_telefono || '').replace(/\D+/g, '');
      const waNum = digs ? (digs.startsWith('54') ? digs : `549${digs}`) : '';
      return `https://wa.me/${waNum}?text=${encodeURIComponent(textoReal)}`;
    }

    function armarUrlGoogleMapsNocturno(p) {
      const coords = _resolverCoordsEfectivasPedidoGestor(p);
      if (coords) {
        return `https://www.google.com/maps/dir/?api=1&destination=${coords.lat},${coords.lng}&travelmode=driving`;
      }
      const destino = [p.direccion_entrega, GSTATE.nodo?.barrio_zona, 'Argentina'].filter(Boolean).join(', ');
      return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destino)}&travelmode=driving`;
    }

    async function enviarPingRadarVivoGestor(pedidoActualId = null, forzar = false, useKeepalive = false) {
      if (!GSTATE.nodo?.id || !GSTATE.radarActivo) return;
      const ahora = Date.now();
      if (!forzar && _radarUltimoEnvioMs && (ahora - _radarUltimoEnvioMs) < 18000) return;
      _radarUltimoEnvioMs = ahora;

      try {
        await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/reparto/radar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          keepalive: Boolean(useKeepalive),
          body: JSON.stringify({
            activo: true,
            latitud: _radarUltPos?.lat ?? null,
            longitud: _radarUltPos?.lng ?? null,
            precision_metros: _radarUltPos?.acc ?? null,
            pedido_actual_id: pedidoActualId || null
          })
        });
      } catch (_) {}
    }

    async function apagarRadarVivoGestor(useKeepalive = false) {
      if (_radarWatchId != null && navigator.geolocation) {
        try { navigator.geolocation.clearWatch(_radarWatchId); } catch (_) {}
      }
      _radarWatchId = null;
      if (_radarHeartbeatTimer) {
        clearInterval(_radarHeartbeatTimer);
        _radarHeartbeatTimer = null;
      }
      const estabaActivo = GSTATE.radarActivo;
      GSTATE.radarActivo = false;
      renderOverlayRadarPillNocturno();

      if (estabaActivo && GSTATE.nodo?.id) {
        try {
          await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/reparto/radar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            keepalive: Boolean(useKeepalive),
            body: JSON.stringify({ activo: false })
          });
        } catch (_) {}
      }
    }

    async function toggleRadarVivoNocturno() {
      if (GSTATE.radarActivo) {
        await apagarRadarVivoGestor(false);
        return;
      }
      GSTATE.radarActivo = true;
      renderOverlayRadarPillNocturno();

      const paradas = obtenerParadasRepartoActivasGestor();
      const actualId = paradas[GSTATE.repartoIndice]?.id || null;

      if (navigator.geolocation) {
        _radarWatchId = navigator.geolocation.watchPosition(
          (pos) => {
            _radarUltPos = {
              lat: Number(pos.coords.latitude.toFixed(7)),
              lng: Number(pos.coords.longitude.toFixed(7)),
              acc: Math.round(pos.coords.accuracy || 0)
            };
            const cur = obtenerParadasRepartoActivasGestor()[GSTATE.repartoIndice]?.id || actualId;
            enviarPingRadarVivoGestor(cur, false);
          },
          () => {
            // Si el navegador niega GPS igual enviamos parada actual para estimación por paradas restantes
            enviarPingRadarVivoGestor(actualId, true);
          },
          { enableHighAccuracy: true, maximumAge: 15000, timeout: 10000 }
        );
      }

      await enviarPingRadarVivoGestor(actualId, true);
      if (_radarHeartbeatTimer) clearInterval(_radarHeartbeatTimer);
      _radarHeartbeatTimer = setInterval(() => {
        if (GSTATE.radarActivo && GSTATE.nocturnoAbierto) {
          const cur = obtenerParadasRepartoActivasGestor()[GSTATE.repartoIndice]?.id || null;
          enviarPingRadarVivoGestor(cur, true);
        }
      }, 45000);
    }

            <div style="background:var(--surface-warm); border:1px solid var(--border); border-radius:11px; padding:9px 10px; margin-bottom:12px; display:flex; flex-direction:column; gap:8px;">
              <div style="display:flex; justify-content:space-between; align-items:center; gap:6px; flex-wrap:wrap;">

                  <button type="button" class="foto-mini-chip" onclick="girarFotoEditor(90)">↻ +90°</button>

                  <button type="button" class="foto-mini-chip" data-preset-crop="4:5" onclick="cambiarPresetEncuadreEditor('4:5')">4:5 Vertical</button>
                </div>
              </div>
              <div style="display:flex; align-items:center; gap:8px;">
                <span style="font-size:0.72rem; font-weight:800; color:var(--muted); min-width:58px;">🔍 Recorte</span>
                <input type="range" id="input-zoom-encuadre" min="1" max="2.4" step="0.05" value="1"
                  style="flex:1; accent-color:var(--brand);"
                  oninput="cambiarZoomEncuadreEditor(this.value)" />
                <span id="label-zoom-encuadre" style="font-size:0.72rem; font-weight:800; color:var(--text); min-width:34px; text-align:right;">1.0x</span>
              </div>

            <div style="display:flex; gap:8px;">
              <button type="button" class="btn-soft" style="flex:1; min-height:42px; font-weight:800;"
                onclick="cerrarEditorFotoOferta()">Cancelar</button>
              <button type="button" id="btn-guardar-foto-editor" class="btn-primary" style="flex:2; min-height:42px; font-weight:900;"
                onclick="confirmarGuardarFotoEditor()">💾 Guardar foto</button>
            </div>
          </div>
        </div>
      `;
      document.body.appendChild(wrap);

      const inpCam = document.getElementById('input-foto-camara-gestor');
      const inpGal = document.getElementById('input-foto-galeria-gestor');
      const inpRep = document.getElementById('input-foto-reemplazar-gestor');

      inpCam.addEventListener('change', (ev) => manejarSeleccionArchivosFoto(ev.target.files, 'nueva'));
      inpGal.addEventListener('change', (ev) => manejarSeleccionArchivosFoto(ev.target.files, 'nueva'));
      inpRep.addEventListener('change', (ev) => manejarSeleccionArchivosFoto(ev.target.files, 'reemplazar'));

      // Soporte de arrastre táctil / mouse sobre el visor para ajustar el encuadre cuando hay recorte activo
      const stage = document.getElementById('foto-editor-stage');
      const iniciarDrag = (clientX, clientY) => {
        if (FOTO_EDITOR_STATE.presetEncuadre === 'original' && FOTO_EDITOR_STATE.zoomEncuadre <= 1.01) return;
        FOTO_EDITOR_STATE.dragActivo = true;
        FOTO_EDITOR_STATE.dragStartX = clientX;
        FOTO_EDITOR_STATE.dragStartY = clientY;
        FOTO_EDITOR_STATE.dragPanX0 = FOTO_EDITOR_STATE.panX;
        FOTO_EDITOR_STATE.dragPanY0 = FOTO_EDITOR_STATE.panY;
      };
      const moverDrag = (clientX, clientY) => {
        if (!FOTO_EDITOR_STATE.dragActivo) return;
        const rect = stage.getBoundingClientRect();
        const dx = (clientX - FOTO_EDITOR_STATE.dragStartX) / Math.max(120, rect.width);
        const dy = (clientY - FOTO_EDITOR_STATE.dragStartY) / Math.max(120, rect.height);
        FOTO_EDITOR_STATE.panX = Math.max(0, Math.min(1, FOTO_EDITOR_STATE.dragPanX0 - dx));
        FOTO_EDITOR_STATE.panY = Math.max(0, Math.min(1, FOTO_EDITOR_STATE.dragPanY0 - dy));
        programarRefrescoPreviewServidor();
      };
      const finDrag = () => { FOTO_EDITOR_STATE.dragActivo = false; };

      stage.addEventListener('pointerdown', (e) => { iniciarDrag(e.clientX, e.clientY); });
      window.addEventListener('pointermove', (e) => { moverDrag(e.clientX, e.clientY); });
      window.addEventListener('pointerup', finDrag);
      window.addEventListener('pointercancel', finDrag);
    }

    function dispararCapturaFotoOferta(ofertaId, origen = 'gallery') {
      asegurarNodosDomModalesFotosGestor();

      const fotos = obtenerFotosDeOfertaLocal(of);

        mostrarAvisoPantallaGestor(`Ya alcanzaste el máximo de ${MAX_FOTOS_OFERTA_UI} fotos para este artículo.`, 'error');
        return;
      }
      FOTO_EDITOR_STATE.ofertaId = Number(ofertaId);
      FOTO_EDITOR_STATE.fotoId = null;

    function dispararReemplazoFotoExistente(ofertaId, fotoId) {

      cerrarMenuAccionesFotoOferta();
      FOTO_EDITOR_STATE.ofertaId = Number(ofertaId);
