      `;

      modal.style.display = 'flex';
      actualizarSubtituloAcomodarRuta();
      _refrescarBotonAgregarAcomodar();
      renderBarraTocarOrdenAcomodar();
      renderListaAcomodarRuta();
      vincularTouchDragListaAcomodar();

      setTimeout(() => {
        inicializarMapaAcomodarRuta();
      }, 60);
    }

    function actualizarSubtituloAcomodarRuta() {
      _acomodarDistanciaMetros = calcularDistanciaTotalParadasGestor(_acomodarParadasDraft);
      const sub = document.getElementById('acomodar-subtitulo-stats');
      if (!sub) return;
      const conGps = _acomodarParadasDraft.filter(g => g.coords).length;
      const sinGps = _acomodarParadasDraft.length - conGps;
      const totPedidos = _acomodarParadasDraft.reduce((acc, g) => acc + g.pedidos.length, 0);
      const distTxt = _acomodarDistanciaMetros > 0 ? ` · ~${(_acomodarDistanciaMetros / 1000).toFixed(1)} km` : '';
      sub.textContent = `${_acomodarParadasDraft.length} parada${_acomodarParadasDraft.length === 1 ? '' : 's'} (${totPedidos} ped.)${sinGps > 0 ? ` · ${sinGps} sin GPS` : ''}${distTxt}`;
    }

    function inicializarMapaAcomodarRuta() {
      const el = document.getElementById('acomodar-leaflet-map');
      if (!el || !window.L) return;

      const conGps = _acomodarParadasDraft.find(g => g.coords);
      const latIni = Number(GSTATE.nodo?.latitud) || conGps?.coords?.lat || -34.92145;
      const lngIni = Number(GSTATE.nodo?.longitud) || conGps?.coords?.lng || -57.95453;

      if (_acomodarMap) {
        try { _acomodarMap.remove(); } catch (_) {}
      }

      const map = window.L.map(el, { zoomControl: true, tap: true }).setView([latIni, lngIni], 14);
      window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 19
      }).addTo(map);

      _acomodarLayerGroup = window.L.layerGroup().addTo(map);
      _acomodarPinDraftLayer = window.L.layerGroup().addTo(map);
      _acomodarMap = map;

      map.on('click', (ev) => {
        if (!_acomodarPinTargetKey || !ev?.latlng) return;
        fijarBorradorPinInlineEnMapa(ev.latlng.lat, ev.latlng.lng);
      });

      dibujarMapaAcomodarRuta(true);
      setTimeout(() => { try { map.invalidateSize(); } catch (_) {} }, 150);
    }

    function centrarMapaAcomodarRutaGestor() {
      dibujarMapaAcomodarRuta(true);
    }

    function _obtenerNumeroVisibleGrupoAcomodar(g, idx) {
      if (_acomodarTocarOrdenActivo) {
        const posTap = _acomodarTocarKeys.indexOf(g.key);
        return posTap >= 0 ? String(posTap + 1) : '?';
      }
      return String(idx + 1);
    }

    function dibujarMapaAcomodarRuta(fit = false) {
      if (!_acomodarMap || !_acomodarLayerGroup || !window.L) return;
      _acomodarLayerGroup.clearLayers();

      const boundsPts = [];
      const nLat = Number(GSTATE.nodo?.latitud);
      const nLng = Number(GSTATE.nodo?.longitud);
      const tieneNodo = Number.isFinite(nLat) && Number.isFinite(nLng) && nLat !== 0 && nLng !== 0;

      if (tieneNodo) {
        boundsPts.push([nLat, nLng]);
        const nodoIcon = window.L.divIcon({
          className: '',
          html: `<div class="acomodar-pin-nodo">🏠 ${esc((GSTATE.nodo?.nombre_marca || 'Punto').slice(0, 14))}</div>`,
          iconSize: [96, 28],
          iconAnchor: [48, 14]
        });
        window.L.marker([nLat, nLng], { icon: nodoIcon, zIndexOffset: 200 }).addTo(_acomodarLayerGroup);
      }

      // Puntos ordenados para la polilínea
      let gruposRutaLine = [];
      if (_acomodarTocarOrdenActivo) {
        gruposRutaLine = _acomodarTocarKeys
          .map(k => _acomodarParadasDraft.find(g => g.key === k))
          .filter(g => g && g.coords);
      } else {
        gruposRutaLine = _acomodarParadasDraft.filter(g => g.coords);
      }

      const stopLatLngs = gruposRutaLine.map(g => [g.coords.lat, g.coords.lng]);

      if (tieneNodo && stopLatLngs.length > 0) {
        window.L.polyline([[nLat, nLng], stopLatLngs[0]], {
          color: '#64748b',
          weight: 3,
          dashArray: '6, 8',
          opacity: 0.8
        }).addTo(_acomodarLayerGroup);
      }

      if (stopLatLngs.length > 1) {
        const lineColor = _acomodarTocarOrdenActivo ? '#16a34a' : '#2563eb';
        window.L.polyline(stopLatLngs, {
          color: lineColor,
          weight: 4.5,
          opacity: 0.9
        }).addTo(_acomodarLayerGroup);

        // Flechas de dirección discretas en el punto medio de cada tramo
        for (let i = 0; i < stopLatLngs.length - 1; i++) {
          const p1 = stopLatLngs[i];
          const p2 = stopLatLngs[i + 1];
          const distSeg = _distanciaMetrosGestor(p1[0], p1[1], p2[0], p2[1]);
          if (distSeg < 45) continue;
          const midLat = (p1[0] + p2[0]) / 2;
          const midLng = (p1[1] + p2[1]) / 2;
          const angDeg = Math.atan2(p2[1] - p1[1], p2[0] - p1[0]) * (180 / Math.PI) - 90;
          const arrowIcon = window.L.divIcon({
            className: '',
            html: `<div style="transform:rotate(${angDeg.toFixed(1)}deg); color:${lineColor}; font-size:13px; font-weight:900; text-shadow:0 0 3px #fff, 0 0 3px #fff; line-height:1;">➤</div>`,
            iconSize: [16, 16],
            iconAnchor: [8, 8]
          });
          window.L.marker([midLat, midLng], { icon: arrowIcon, interactive: false }).addTo(_acomodarLayerGroup);
        }
      }

      // Marcadores de paradas físicas
      _acomodarParadasDraft.forEach((g, idx) => {
        if (!g.coords) return;
        boundsPts.push([g.coords.lat, g.coords.lng]);

        const numTxt = _obtenerNumeroVisibleGrupoAcomodar(g, idx);
        const esTapped = _acomodarTocarOrdenActivo && _acomodarTocarKeys.includes(g.key);
        const esPendienteTap = _acomodarTocarOrdenActivo && !esTapped;
        const esHighlight = _acomodarHighlightKey === g.key;
        const cantPeds = g.pedidos.length;

        const clases = [
          'acomodar-pin-badge',
          esTapped ? 'tapped' : '',
          esPendienteTap ? 'pending' : '',
          esHighlight ? 'highlighted' : ''
        ].filter(Boolean).join(' ');

        const multiBadge = cantPeds > 1 ? `<span class="acomodar-pin-multi">×${cantPeds}</span>` : '';
        const icon = window.L.divIcon({
          className: '',
          html: `<div class="${clases}">${esc(numTxt)}${multiBadge}</div>`,
          iconSize: [36, 36],
          iconAnchor: [18, 18]
        });

        const marker = window.L.marker([g.coords.lat, g.coords.lng], {
          icon,
          zIndexOffset: esHighlight ? 900 : (500 - idx)
        }).addTo(_acomodarLayerGroup);

        marker.on('click', () => {
          if (_acomodarPinTargetKey) {
            // Si estaba ubicando otro pin en el mapa, no interrumpir con highlight
            return;
          }
          if (_acomodarTocarOrdenActivo) {
            tocarPinEnModoOrdenAcomodar(g.key);
          } else {
            seleccionarParadaEnAcomodarRuta(g.key, false);
          }
        });
      });

      if (fit && boundsPts.length > 0) {
        try {
          if (boundsPts.length === 1) {
            _acomodarMap.setView(boundsPts[0], 15);
          } else {
            _acomodarMap.fitBounds(window.L.latLngBounds(boundsPts), { padding: [38, 38], maxZoom: 16 });
          }
        } catch (_) {}
      }
    }

    function seleccionarParadaEnAcomodarRuta(key, panMap = true) {
      _acomodarHighlightKey = key;
      const g = _acomodarParadasDraft.find(x => x.key === key);
      dibujarMapaAcomodarRuta(false);
      renderListaAcomodarRuta();

      if (panMap && g?.coords && _acomodarMap) {
        try {
          _acomodarMap.panTo([g.coords.lat, g.coords.lng], { animate: true });
        } catch (_) {}
      }
      if (!panMap) {
        const rowEl = document.querySelector(`#acomodar-lista-items .acomodar-row[data-key="${CSS.escape(key)}"]`);
        if (rowEl) {
          try { rowEl.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (_) {}
        }
      }
    }

    function renderBarraTocarOrdenAcomodar() {
      const btn = document.getElementById('btn-acomodar-tocar-orden');
      const banner = document.getElementById('acomodar-tocar-banner');
      if (btn) {
        if (_acomodarTocarOrdenActivo) {
          btn.textContent = '✓ Salir pines';
          btn.style.background = '#16a34a';
          btn.style.borderColor = '#15803d';
          btn.style.color = '#ffffff';
        } else {
          btn.textContent = '👆 Tocar pines';
          btn.style.background = '#f8fafc';
          btn.style.borderColor = '#cbd5e1';
          btn.style.color = '#0f172a';
        }
      }
      if (banner) {
        if (_acomodarTocarOrdenActivo) {
          const totalConGps = _acomodarParadasDraft.filter(g => g.coords).length;
          banner.style.display = 'flex';
          banner.innerHTML = `
            <span style="flex:1; min-width:0;">
              👆 Tocá los pines en orden (${_acomodarTocarKeys.length}/${totalConGps})
            </span>
            <div style="display:flex; gap:6px; flex-shrink:0;">
              <button type="button" onclick="deshacerUltimoTapOrdenAcomodar()" ${_acomodarTocarKeys.length === 0 ? 'disabled' : ''}
                style="min-height:32px; padding:0 9px; border-radius:8px; border:1px solid #64748b; background:#1e293b; color:#ffffff; font-family:inherit; font-weight:800; font-size:0.78rem; cursor:pointer;">
                ↺ Deshacer
              </button>
              <button type="button" onclick="toggleModoTocarOrdenAcomodar()"
                style="min-height:32px; padding:0 9px; border-radius:8px; border:none; background:#22c55e; color:#052e16; font-family:inherit; font-weight:900; font-size:0.78rem; cursor:pointer;">
                ✓ Listo
              </button>
            </div>
          `;
        } else {
          banner.style.display = 'none';
          banner.innerHTML = '';
        }
      }
    }

    function toggleModoTocarOrdenAcomodar() {
      if (_acomodarPinTargetKey) cancelarPinInlineAcomodar();
      const conGps = _acomodarParadasDraft.filter(g => g.coords);
      if (conGps.length === 0) {
        mostrarAvisoPantallaGestor('Primero ubicá al menos un pin en el mapa para ordenarlo tocando pines.', 'error');
        return;
      }
      _acomodarTocarOrdenActivo = !_acomodarTocarOrdenActivo;
      if (_acomodarTocarOrdenActivo) {
        _acomodarTocarKeys = [];
      }
      renderBarraTocarOrdenAcomodar();
      renderListaAcomodarRuta();
      dibujarMapaAcomodarRuta(false);
    }

    function _aplicarSecuenciaTapSobreDraftAcomodar() {
      const elegidos = _acomodarTocarKeys
        .map(k => _acomodarParadasDraft.find(g => g.key === k))
        .filter(Boolean);
      const setElegidos = new Set(_acomodarTocarKeys);
      const restantesConGps = _acomodarParadasDraft.filter(g => g.coords && !setElegidos.has(g.key));
      const sinGps = _acomodarParadasDraft.filter(g => !g.coords && !setElegidos.has(g.key));
      _acomodarParadasDraft = [...elegidos, ...restantesConGps, ...sinGps];
    }

    function tocarPinEnModoOrdenAcomodar(key) {
      if (!_acomodarTocarOrdenActivo) return;
      const idxExistente = _acomodarTocarKeys.indexOf(key);
      if (idxExistente !== -1) {
        if (idxExistente === _acomodarTocarKeys.length - 1) {
          _acomodarTocarKeys.pop();
        } else {
          return;
        }
      } else {
        _acomodarTocarKeys.push(key);
      }
      _acomodarHighlightKey = key;
      _aplicarSecuenciaTapSobreDraftAcomodar();
      actualizarSubtituloAcomodarRuta();
      renderBarraTocarOrdenAcomodar();
      renderListaAcomodarRuta();
      dibujarMapaAcomodarRuta(false);

      const totalConGps = _acomodarParadasDraft.filter(g => g.coords).length;
      if (_acomodarTocarKeys.length >= totalConGps && totalConGps > 0) {
        _acomodarTocarOrdenActivo = false;
        _acomodarTocarKeys = [];
        renderBarraTocarOrdenAcomodar();
        renderListaAcomodarRuta();
        dibujarMapaAcomodarRuta(false);
        mostrarAvisoPantallaGestor('✅ Secuencia completa armada desde el mapa. Revisala o tocá Confirmar Orden.', 'ok');
      }
    }

    function deshacerUltimoTapOrdenAcomodar() {
      if (!_acomodarTocarOrdenActivo || _acomodarTocarKeys.length === 0) return;
      _acomodarTocarKeys.pop();
      _aplicarSecuenciaTapSobreDraftAcomodar();
      actualizarSubtituloAcomodarRuta();
      renderBarraTocarOrdenAcomodar();
      renderListaAcomodarRuta();
      dibujarMapaAcomodarRuta(false);
    }

    async function sugerirVueltaCortaEnAcomodarGestor() {
      if (!GSTATE.nodo?.id || _acomodarParadasDraft.length === 0) return;
      if (_acomodarTocarOrdenActivo) {
        _acomodarTocarOrdenActivo = false;
        _acomodarTocarKeys = [];
        renderBarraTocarOrdenAcomodar();
      }
      const btn = document.getElementById('btn-acomodar-vuelta-corta');
      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Calculando...';
      }

      let origenLat = null;
      let origenLng = null;
      if (navigator.geolocation) {
        try {
          const pos = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: false, timeout: 2200, maximumAge: 60000 });
          });
          origenLat = pos.coords.latitude;
          origenLng = pos.coords.longitude;
        } catch (_) {}
      }

      try {
        const pedidoIds = _acomodarParadasDraft.flatMap(g => g.pedidos.map(p => Number(p.id)));
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/reparto/sugerir-orden`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            pedido_ids: pedidoIds,
            origen_lat: origenLat,
            origen_lng: origenLng,
            guardar: false
          })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok || !Array.isArray(data.orden_ids)) {
          mostrarAvisoPantallaGestor('No se pudo calcular la vuelta corta: ' + (data.error || `HTTP ${resp.status}`), 'error');
          return;
        }

        const posPorPedido = new Map();
        data.orden_ids.forEach((pid, i) => posPorPedido.set(Number(pid), i));
        _acomodarParadasDraft.sort((a, b) => {
          const minA = Math.min(...a.pedidos.map(p => posPorPedido.has(Number(p.id)) ? posPorPedido.get(Number(p.id)) : 999999));
          const minB = Math.min(...b.pedidos.map(p => posPorPedido.has(Number(p.id)) ? posPorPedido.get(Number(p.id)) : 999999));
          return minA - minB;
        });
        _acomodarHighlightKey = _acomodarParadasDraft[0]?.key || null;
        actualizarSubtituloAcomodarRuta();
        renderListaAcomodarRuta();
        dibujarMapaAcomodarRuta(true);
        mostrarAvisoPantallaGestor('⚡ Vuelta corta aplicada. Deslizá o retocá si querés antes de confirmar.', 'ok');
      } catch (_) {
        mostrarAvisoPantallaGestor('Error al calcular la vuelta corta.', 'error');
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = '⚡ Vuelta corta';
        }
      }
    }

    function iniciarUbicacionPinEnAcomodar(key, ev) {
      if (ev) ev.stopPropagation();
      if (_acomodarTocarOrdenActivo) {
        _acomodarTocarOrdenActivo = false;
        _acomodarTocarKeys = [];
        renderBarraTocarOrdenAcomodar();
      }
      const g = _acomodarParadasDraft.find(x => x.key === key);
      if (!g) return;
      _acomodarPinTargetKey = key;
      _acomodarHighlightKey = key;
      _acomodarPinDraftCoords = g.coords ? { lat: g.coords.lat, lng: g.coords.lng } : null;

      if (_acomodarPinDraftLayer) _acomodarPinDraftLayer.clearLayers();
      if (_acomodarPinDraftCoords) {
        fijarBorradorPinInlineEnMapa(_acomodarPinDraftCoords.lat, _acomodarPinDraftCoords.lng);
      }

      const bar = document.getElementById('acomodar-pin-inline-bar');
      if (bar) {
        const queryDef = [g.direccion, GSTATE.nodo?.barrio_zona].filter(Boolean).join(', ');
        bar.style.display = 'block';
        bar.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px;">
            <div style="font-size:0.86rem; font-weight:900; color:#92400e;">
              📍 Ubicando a ${esc(g.vecinosLabel)} (${esc(g.codigosLabel)})
            </div>
            <button type="button" onclick="cancelarPinInlineAcomodar()"
              style="border:none; background:rgba(146,64,14,0.12); color:#78350f; border-radius:8px; padding:3px 9px; font-weight:900; cursor:pointer;">
              ✕ Cancelar
            </button>
          </div>
          <div style="display:flex; gap:6px; margin-bottom:6px;">
            <input type="text" id="acomodar-pin-search-input" value="${esc(queryDef)}"
              placeholder="Buscar calle y altura..."
              style="flex:1; min-width:0; min-height:42px; padding:6px 10px; border-radius:10px; border:1px solid #f59e0b; background:#fff; font-family:inherit; font-size:0.95rem;" />
            <button type="button" onclick="buscarGeoPinInlineAcomodar()"
              style="min-height:42px; padding:0 12px; border-radius:10px; border:none; background:#0f172a; color:#ffffff; font-family:inherit; font-weight:900; font-size:0.88rem; cursor:pointer;">
              🔎
            </button>
          </div>
          <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
            <div id="acomodar-pin-inline-estado" style="font-size:0.8rem; font-weight:800; color:#78350f; flex:1; min-width:160px;">
              👆 Tocá la calle en el mapa o buscá arriba con 🔎
            </div>
            <button type="button" id="btn-guardar-pin-inline-acomodar" onclick="confirmarPinInlineAcomodar()" disabled
              style="min-height:42px; padding:0 14px; border-radius:10px; border:none; background:#16a34a; color:#ffffff; font-family:inherit; font-weight:900; font-size:0.88rem; cursor:pointer; opacity:0.5;">
              💾 Fijar pin aquí
            </button>
          </div>
        `;
      }
      renderListaAcomodarRuta();
    }

    function fijarBorradorPinInlineEnMapa(lat, lng) {
      _acomodarPinDraftCoords = { lat: Number(Number(lat).toFixed(7)), lng: Number(Number(lng).toFixed(7)) };
      if (_acomodarPinDraftLayer && window.L) {
        _acomodarPinDraftLayer.clearLayers();
        const mk = window.L.marker([_acomodarPinDraftCoords.lat, _acomodarPinDraftCoords.lng], {
          draggable: true,
          zIndexOffset: 1200
        }).addTo(_acomodarPinDraftLayer);
        mk.on('dragend', () => {
          const p = mk.getLatLng();
          if (p) {
            _acomodarPinDraftCoords = { lat: Number(p.lat.toFixed(7)), lng: Number(p.lng.toFixed(7)) };
            const est = document.getElementById('acomodar-pin-inline-estado');
            if (est) est.textContent = `📌 Pin listo (${_acomodarPinDraftCoords.lat.toFixed(5)}, ${_acomodarPinDraftCoords.lng.toFixed(5)}) · Podés arrastrarlo`;
          }
        });
      }
      const est = document.getElementById('acomodar-pin-inline-estado');
      if (est) est.textContent = `📌 Pin listo (${_acomodarPinDraftCoords.lat.toFixed(5)}, ${_acomodarPinDraftCoords.lng.toFixed(5)}) · Arrastrá o guardá`;
      const btn = document.getElementById('btn-guardar-pin-inline-acomodar');
      if (btn) {
        btn.disabled = false;
        btn.style.opacity = '1';
      }
    }

    async function buscarGeoPinInlineAcomodar() {
      const q = (document.getElementById('acomodar-pin-search-input')?.value || '').trim();
      if (!q || !GSTATE.nodo?.id) return;
      const est = document.getElementById('acomodar-pin-inline-estado');
      if (est) est.textContent = '🔎 Buscando dirección...';
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/geocodificar?q=${encodeURIComponent(q)}`);
        const data = await leerRespuestaJsonSegura(resp);
        const item = Array.isArray(data?.resultados) ? data.resultados[0] : null;
        if (!item) {

    function vincularTouchDragListaAcomodar() {
      const container = document.getElementById('acomodar-lista-items');
      const scrollWrap = document.getElementById('acomodar-lista-wrap');
      if (!container || !scrollWrap) return;

      container.addEventListener('pointerdown', (ev) => {
        const handle = ev.target.closest('.acomodar-drag-handle');
        if (!handle || _acomodarDragCtx) return;
        const rowEl = handle.closest('.acomodar-row');
        if (!rowEl) return;

        ev.preventDefault();
        try { handle.setPointerCapture(ev.pointerId); } catch (_) {}

        if (_acomodarTocarOrdenActivo) {
          _acomodarTocarOrdenActivo = false;
          _acomodarTocarKeys = [];
          renderBarraTocarOrdenAcomodar();
        }

        const rect = rowEl.getBoundingClientRect();
        const ghost = rowEl.cloneNode(true);
        ghost.classList.add('acomodar-drag-ghost');
        ghost.style.width = `${rect.width}px`;
        ghost.style.left = `${rect.left}px`;
        ghost.style.top = `${rect.top}px`;
        document.body.appendChild(ghost);

        rowEl.classList.add('is-drag-placeholder');

        const ctx = {
          pointerId: ev.pointerId,
          startY: ev.clientY,
          currentIdx: Number(rowEl.getAttribute('data-index') || 0),
          rowEl,
          ghost,
          autoScrollSpeed: 0
        };

        const refrescarBadgesEnDom = () => {
          const rows = Array.from(container.children);
          rows.forEach((r, i) => {
            r.setAttribute('data-index', String(i));
            const numEl = r.querySelector('.acomodar-row-num');
            if (numEl) numEl.textContent = String(i + 1);
          });
        };

        const onMove = (moveEv) => {
          if (moveEv.pointerId !== ctx.pointerId) return;
          const dy = moveEv.clientY - ctx.startY;
          ctx.ghost.style.transform = `translate3d(0, ${dy}px, 0) scale(1.02)`;

          // Auto-scroll suave en los bordes de la lista deslizable
          const wrapRect = scrollWrap.getBoundingClientRect();
          if (moveEv.clientY < wrapRect.top + 48) {
            scrollWrap.scrollTop = Math.max(0, scrollWrap.scrollTop - 10);
          } else if (moveEv.clientY > wrapRect.bottom - 48) {
            scrollWrap.scrollTop += 10;
          }

          const siblings = Array.from(container.children);
          for (let i = 0; i < siblings.length; i++) {
            const sib = siblings[i];
            if (sib === ctx.rowEl) continue;
            const sRect = sib.getBoundingClientRect();
            const midY = sRect.top + (sRect.height / 2);
            if (i < ctx.currentIdx && moveEv.clientY < midY) {
              container.insertBefore(ctx.rowEl, sib);
              const [movido] = _acomodarParadasDraft.splice(ctx.currentIdx, 1);
              _acomodarParadasDraft.splice(i, 0, movido);
              ctx.currentIdx = i;
              _acomodarHighlightKey = movido.key;
              refrescarBadgesEnDom();
              actualizarSubtituloAcomodarRuta();
              dibujarMapaAcomodarRuta(false);
              break;
            } else if (i > ctx.currentIdx && moveEv.clientY > midY) {
              container.insertBefore(ctx.rowEl, sib.nextSibling);
              const [movido] = _acomodarParadasDraft.splice(ctx.currentIdx, 1);
              _acomodarParadasDraft.splice(i, 0, movido);
              ctx.currentIdx = i;
              _acomodarHighlightKey = movido.key;
              refrescarBadgesEnDom();
              actualizarSubtituloAcomodarRuta();
              dibujarMapaAcomodarRuta(false);
              break;
            }
          }
        };

        const onEnd = (endEv) => {
          if (endEv && endEv.pointerId !== undefined && endEv.pointerId !== ctx.pointerId) return;
          try { handle.releasePointerCapture(ctx.pointerId); } catch (_) {}
          _limpiarDragCtxAcomodar();
          actualizarSubtituloAcomodarRuta();
          renderListaAcomodarRuta();
          dibujarMapaAcomodarRuta(false);
        };

        ctx.onMove = onMove;
        ctx.onEnd = onEnd;
        _acomodarDragCtx = ctx;
        window.addEventListener('pointermove', onMove, { passive: true });
        window.addEventListener('pointerup', onEnd);
        window.addEventListener('pointercancel', onEnd);
      });
    }

    async function confirmarOrdenDesdeAcomodarGestor() {
      if (!GSTATE.nodo?.id || _acomodarParadasDraft.length === 0) return;
      const btn = document.getElementById('btn-confirmar-acomodar-ruta');
      if (btn) {

      }

      const ordenIds = _acomodarParadasDraft.flatMap(g => g.pedidos.map(p => Number(p.id)));
      const nuevaDist = calcularDistanciaTotalParadasGestor(_acomodarParadasDraft);

      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/reparto/orden`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orden_ids: ordenIds })

        if (!resp.ok || !data.ok) {

        }

        const ordenMap = new Map();
        ordenIds.forEach((pid, i) => ordenMap.set(Number(pid), i + 1));

        cerrarModalAcomodarRutaGestor();
        renderVistaGestor();
        mostrarAvisoPantallaGestor(`✅ Orden guardado (${cantPuertas} parada${cantPuertas === 1 ? '' : 's'} física${cantPuertas === 1 ? '' : 's'}).`, 'ok');

        mostrarAvisoPantallaGestor('Error de red al confirmar el orden.', 'error');
        if (btn) { btn.disabled = false; btn.textContent = '✅ Confirmar Orden'; }
      }

      if (lbl) lbl.textContent = '🔎 Buscando en GeoRef AR / OSM...';
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/geocodificar?q=${encodeURIComponent(q)}`);
        const data = await leerRespuestaJsonSegura(resp);
        const item = Array.isArray(data?.resultados) ? data.resultados[0] : null;
        if (!item) {
          if (lbl) lbl.textContent = '⚠️ No encontramos coincidencia exacta. Mové el pin manualmente en el mapa.';
          return;
        }
        _pinCasaCoordsDraft = { lat: Number(item.lat), lng: Number(item.lng) };
        if (_pinCasaLeafletMap && _pinCasaLeafletMarker) {
          _pinCasaLeafletMarker.setLatLng([_pinCasaCoordsDraft.lat, _pinCasaCoordsDraft.lng]);
          _pinCasaLeafletMap.setView([_pinCasaCoordsDraft.lat, _pinCasaCoordsDraft.lng], 16);
        }
        if (lbl) lbl.textContent = `✅ Encontrado (${item.display_name}) · ${_pinCasaCoordsDraft.lat.toFixed(5)}, ${_pinCasaCoordsDraft.lng.toFixed(5)}`;
      } catch (_) {
        if (lbl) lbl.textContent = '❌ Error al consultar el geocodificador. Arrastrá el pin en el mapa.';
      }
    }

    async function guardarPinCasaGestor(pedidoId) {
      if (!GSTATE.nodo?.id) return;
      let coords = _pinCasaCoordsDraft;
      if (!coords && _pinCasaLeafletMarker) {
        const pos = _pinCasaLeafletMarker.getLatLng();
        if (pos) coords = { lat: Number(pos.lat.toFixed(7)), lng: Number(pos.lng.toFixed(7)) };
      }
      if (!coords) {
        alert('Tocá el mapa o arrastrá el pin hasta la casa del vecino.');
        return;
      }
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/reparto/pedidos/${pedidoId}/coordenadas`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            latitud: coords.lat,
            longitud: coords.lng
          })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo guardar el pin: ' + (data.error || `HTTP ${resp.status}`), 'error');
          return;
        }
        cerrarModalPinCasaGestor();
        mostrarAvisoPantallaGestor(`📌 Ubicación verificada y guardada para este vecino.`, 'ok');
        await cargarPanelGestor();
      } catch (_) {
        mostrarAvisoPantallaGestor('Error al guardar la ubicación en la base de datos.', 'error');
      }
    }

    async function solicitarWakeLockNocturno() {
      if (!('wakeLock' in navigator) || !GSTATE.nocturnoAbierto) return false;
      try {
        _nocturnoWakeLock = await navigator.wakeLock.request('screen');
        _nocturnoWakeLock.addEventListener('release', () => {
          _nocturnoWakeLock = null;
          actualizarIndicadorWakeLockNocturno();
        });
        actualizarIndicadorWakeLockNocturno();
        return true;
      } catch (_) {
        actualizarIndicadorWakeLockNocturno();
        return false;
      }
    }

    function liberarWakeLockNocturno() {
      if (_nocturnoWakeLock) {
        try { _nocturnoWakeLock.release(); } catch (_) {}
        _nocturnoWakeLock = null;
      }
      actualizarIndicadorWakeLockNocturno();
    }

    function actualizarIndicadorWakeLockNocturno() {
      const el = document.getElementById('nocturno-wakelock-pill');
      if (!el) return;
      if (_nocturnoWakeLock) {
        el.textContent = '🔆 Pantalla activa';
        el.style.color = '#86efac';
      } else {
        el.textContent = '💤 WakeLock standby';
        el.style.color = '#94a3b8';
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && GSTATE.nocturnoAbierto) {
        solicitarWakeLockNocturno();
      }
    });

    async function iniciarYEntrarModoNocturnoGestor() {
      if (!GSTATE.nodo?.id) return;
      const paradas = obtenerParadasRepartoActivasGestor();
      if (paradas.length === 0) {
        mostrarAvisoPantallaGestor('No tenés pedidos listos para salir a repartir.', 'error');
        return;
      }

      const necesitaHito5 = paradas.some(p => Number(p.hito_tracking_actual || 1) === 4);
      if (necesitaHito5) {
        try {
          const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/reparto/iniciar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              pedido_ids: paradas.map(p => Number(p.id)),
              actor: GSTATE.nodo.gestor_nombre || 'Referente comercial'
            })
          });
          const data = await leerRespuestaJsonSegura(resp);
          if (!resp.ok || !data.ok) {
            mostrarAvisoPantallaGestor('No se pudo iniciar la tanda de reparto: ' + (data.error || `HTTP ${resp.status}`), 'error');
            return;
          }
          await cargarPanelGestor();
        } catch (_) {
          mostrarAvisoPantallaGestor('Error al iniciar la salida de reparto.', 'error');
          return;
        }
      }

      GSTATE.nocturnoAbierto = true;
      GSTATE.repartoIndice = 0;
      renderOverlayConduccionNocturna();
      await solicitarWakeLockNocturno();
    }

    function cerrarModoNocturno(omitirRed = false) {
      GSTATE.nocturnoAbierto = false;
      const ov = document.getElementById('gestor-nocturno-overlay');
      if (ov) ov.style.display = 'none';
      liberarWakeLockNocturno();
      apagarRadarVivoGestor(omitirRed);
    }

    function moverIndiceNocturno(delta) {
      const paradas = obtenerParadasRepartoActivasGestor();
      if (paradas.length === 0) return;
      GSTATE.repartoIndice = Math.max(0, Math.min(paradas.length - 1, Number(GSTATE.repartoIndice || 0) + delta));
      renderOverlayConduccionNocturna();
      if (GSTATE.radarActivo) {
        enviarPingRadarVivoGestor(paradas[GSTATE.repartoIndice]?.id, true);
      }
    }

    function armarUrlWhatsAppNocturno(p, tipo) {
      const marca = GSTATE.nodo?.nombre_marca || 'nuestra tienda';
      const gestor = GSTATE.nodo?.gestor_nombre || marca;
      const primerNom = String(p.vecino_nombre || '').trim().split(/\s+/)[0] || 'vecino/a';
      const dir = p.direccion_entrega || 'tu domicilio';

      const textoReal = tipo === 'puerta'
        ? `Hola ${primerNom}! Ya estoy en la puerta de ${dir} con tu pedido #${p.codigo_pedido} de ${marca}.`
        : `Hola ${primerNom}! Soy ${gestor} de ${marca}. En unos 5 minutos llego a ${dir} con tu pedido #${p.codigo_pedido}.`;

      if (GSTATE.modoLaboratorio) {
        const telLab = String(GSTATE.telefonoPruebas || '5492216615746').replace(/\D+/g, '') || '5492216615746';
        const textoLab = `[PRUEBA LAB · Vecino: ${p.vecino_nombre || '-'} ${p.vecino_telefono || '-'}]\n\n${textoReal}`;
        return `https://wa.me/${telLab}?text=${encodeURIComponent(textoLab)}`;
      }

      const digs = String(p.vecino_telefono || '').replace(/\D+/g, '');
      const waNum = digs ? (digs.startsWith('54') ? digs : `549${digs}`) : '';
      return `https://wa.me/${waNum}?text=${encodeURIComponent(textoReal)}`;
    }

    function armarUrlGoogleMapsNocturno(p) {
      const coords = _resolverCoordsEfectivasPedidoGestor(p);
      if (coords) {
        return `https://www.google.com/maps/dir/?api=1&destination=${coords.lat},${coords.lng}&travelmode=driving`;
      }
      const destino = [p.direccion_entrega, GSTATE.nodo?.barrio_zona, 'Argentina'].filter(Boolean).join(', ');
      return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destino)}&travelmode=driving`;
    }

    async function enviarPingRadarVivoGestor(pedidoActualId = null, forzar = false, useKeepalive = false) {
      if (!GSTATE.nodo?.id || !GSTATE.radarActivo) return;
      const ahora = Date.now();
      if (!forzar && _radarUltimoEnvioMs && (ahora - _radarUltimoEnvioMs) < 18000) return;
      _radarUltimoEnvioMs = ahora;

      try {
        await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/reparto/radar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          keepalive: Boolean(useKeepalive),
          body: JSON.stringify({
            activo: true,
            latitud: _radarUltPos?.lat ?? null,
            longitud: _radarUltPos?.lng ?? null,
            precision_metros: _radarUltPos?.acc ?? null,
            pedido_actual_id: pedidoActualId || null
          })
        });
      } catch (_) {}
    }

    async function apagarRadarVivoGestor(useKeepalive = false) {
      if (_radarWatchId != null && navigator.geolocation) {
        try { navigator.geolocation.clearWatch(_radarWatchId); } catch (_) {}
      }
      _radarWatchId = null;
      if (_radarHeartbeatTimer) {
        clearInterval(_radarHeartbeatTimer);
        _radarHeartbeatTimer = null;
      }
      const estabaActivo = GSTATE.radarActivo;
      GSTATE.radarActivo = false;
      renderOverlayRadarPillNocturno();

      if (estabaActivo && GSTATE.nodo?.id) {
        try {
          await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/reparto/radar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            keepalive: Boolean(useKeepalive),
            body: JSON.stringify({ activo: false })
          });
        } catch (_) {}
      }
    }

    async function toggleRadarVivoNocturno() {
      if (GSTATE.radarActivo) {
        await apagarRadarVivoGestor(false);
        return;
      }
      GSTATE.radarActivo = true;
      renderOverlayRadarPillNocturno();

      const paradas = obtenerParadasRepartoActivasGestor();
      const actualId = paradas[GSTATE.repartoIndice]?.id || null;

      if (navigator.geolocation) {
        _radarWatchId = navigator.geolocation.watchPosition(
          (pos) => {
            _radarUltPos = {
              lat: Number(pos.coords.latitude.toFixed(7)),
              lng: Number(pos.coords.longitude.toFixed(7)),
              acc: Math.round(pos.coords.accuracy || 0)
            };
            const cur = obtenerParadasRepartoActivasGestor()[GSTATE.repartoIndice]?.id || actualId;
            enviarPingRadarVivoGestor(cur, false);
          },
          () => {
            // Si el navegador niega GPS igual enviamos parada actual para estimación por paradas restantes
            enviarPingRadarVivoGestor(actualId, true);
          },
          { enableHighAccuracy: true, maximumAge: 15000, timeout: 10000 }
        );
      }

      await enviarPingRadarVivoGestor(actualId, true);
      if (_radarHeartbeatTimer) clearInterval(_radarHeartbeatTimer);
      _radarHeartbeatTimer = setInterval(() => {
        if (GSTATE.radarActivo && GSTATE.nocturnoAbierto) {
          const cur = obtenerParadasRepartoActivasGestor()[GSTATE.repartoIndice]?.id || null;
          enviarPingRadarVivoGestor(cur, true);
        }
      }, 45000);
    }

    async function cambiarModoVidrieraTiendaGestor(nuevoModo, btnEl) {
      if (!GSTATE.nodo || !GSTATE.nodo.id) return;
      const modoNorm = ['CUADRICULA', 'PORTADAS', 'LISTA_COMPACTA'].includes(String(nuevoModo || '').toUpperCase())
        ? String(nuevoModo).toUpperCase()
        : 'PORTADAS';
      if (obtenerModoVidrieraActualGestor() === modoNorm) return;

      if (btnEl) btnEl.disabled = true;
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/config-logistica`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ modo_vidriera_tienda: modoNorm })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo cambiar el diseño de la tienda: ' + (data.error || `HTTP ${resp.status}`), 'error');
          return;
        }
        GSTATE.nodo.modo_vidriera_tienda = modoNorm;
        document.querySelectorAll('[data-modo-vidriera]').forEach(el => {
          const esActivo = el.getAttribute('data-modo-vidriera') === modoNorm;
          el.classList.toggle('is-active', esActivo);
          el.setAttribute('aria-pressed', esActivo ? 'true' : 'false');
        });
        const etiquetaHumana = modoNorm === 'CUADRICULA'
          ? 'Cuadrícula visual'
          : (modoNorm === 'LISTA_COMPACTA' ? 'Lista compacta sin miniaturas' : 'Tarjetas con foto lateral');
        mostrarAvisoPantallaGestor(`✓ Diseño de tienda actualizado a "${etiquetaHumana}".`, 'ok');
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de red al actualizar el diseño de la tienda.', 'error');
      } finally {
        if (btnEl) btnEl.disabled = false;
      }
    }

    async function guardarNarrativaOfertaGestor(ofertaId, limpiar = false) {
      const id = Number(ofertaId);
      const txtEl = document.querySelector(`[data-oferta-narrativa="${id}"]`);
      const valor = limpiar ? '' : String(txtEl ? txtEl.value : '').trim().slice(0, 600);
      const btn = document.querySelector(`[data-btn-guardar-narrativa="${id}"]`);
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Guardando...';
      }
      const ok = await guardarCambioOferta(id, { narrativa_tienda: valor });
      if (ok) {
        mostrarAvisoPantallaGestor(
          valor ? '✓ Historia del producto guardada en tu tienda.' : '✓ Historia del producto quitada.',
          'ok'
        );

        btn.disabled = false;
        btn.textContent = '💾 Guardar historia';

    function asegurarNodosDomModalesFotosGestor() {

        <input type="file" id="input-foto-galeria-gestor" accept="image/*" multiple style="display:none;" />

      const inpCam = document.getElementById('input-foto-camara-gestor');
      const inpGal = document.getElementById('input-foto-galeria-gestor');
      const inpRep = document.getElementById('input-foto-reemplazar-gestor');
      const inpVid = document.getElementById('input-video-galeria-gestor');

      inpCam.addEventListener('change', (ev) => manejarSeleccionArchivosFoto(ev.target.files, 'nueva'));
      inpGal.addEventListener('change', (ev) => manejarSeleccionArchivosFoto(ev.target.files, 'nueva'));
      inpRep.addEventListener('change', (ev) => manejarSeleccionArchivosFoto(ev.target.files, 'reemplazar'));
      inpVid.addEventListener('change', (ev) => manejarSeleccionArchivoVideo(ev.target.files));

      // Soporte de arrastre táctil / mouse sobre el visor para ajustar el encuadre cuando hay recorte activo
      const stage = document.getElementById('foto-editor-stage');
      const iniciarDrag = (clientX, clientY) => {
        if (FOTO_EDITOR_STATE.presetEncuadre === 'original' && FOTO_EDITOR_STATE.zoomEncuadre <= 1.01) return;
        FOTO_EDITOR_STATE.dragActivo = true;
        FOTO_EDITOR_STATE.dragStartX = clientX;
        FOTO_EDITOR_STATE.dragStartY = clientY;
        FOTO_EDITOR_STATE.dragPanX0 = FOTO_EDITOR_STATE.panX;
        FOTO_EDITOR_STATE.dragPanY0 = FOTO_EDITOR_STATE.panY;
      };
      const moverDrag = (clientX, clientY) => {
        if (!FOTO_EDITOR_STATE.dragActivo) return;
        const rect = stage.getBoundingClientRect();
        const dx = (clientX - FOTO_EDITOR_STATE.dragStartX) / Math.max(120, rect.width);
        const dy = (clientY - FOTO_EDITOR_STATE.dragStartY) / Math.max(120, rect.height);
        FOTO_EDITOR_STATE.panX = Math.max(0, Math.min(1, FOTO_EDITOR_STATE.dragPanX0 - dx));
        FOTO_EDITOR_STATE.panY = Math.max(0, Math.min(1, FOTO_EDITOR_STATE.dragPanY0 - dy));
        programarRefrescoPreviewServidor();
      };
      const finDrag = () => { FOTO_EDITOR_STATE.dragActivo = false; };

      stage.addEventListener('pointerdown', (e) => { iniciarDrag(e.clientX, e.clientY); });
      window.addEventListener('pointermove', (e) => { moverDrag(e.clientX, e.clientY); });
      window.addEventListener('pointerup', finDrag);
      window.addEventListener('pointercancel', finDrag);
    }

    async function comprimirArchivoImagenCliente(file) {
      const MAX_SIDE = 1600;
      let bitmap = null;
      try {
        if (typeof createImageBitmap === 'function') {
          bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
        }
      } catch (_) {
        bitmap = null;
      }

      if (bitmap) {
        const w0 = bitmap.width;
        const h0 = bitmap.height;
        const scale = Math.min(1, MAX_SIDE / Math.max(w0, h0, 1));
        const w = Math.max(1, Math.round(w0 * scale));
        const h = Math.max(1, Math.round(h0 * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(bitmap, 0, 0, w, h);
        if (bitmap.close) bitmap.close();
        const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.88));
        return { blob: blob || file, width: w, height: h };
      }

      return new Promise((resolve) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          const w0 = img.naturalWidth || 1000;
          const h0 = img.naturalHeight || 1000;
          const scale = Math.min(1, MAX_SIDE / Math.max(w0, h0, 1));
          const w = Math.max(1, Math.round(w0 * scale));
          const h = Math.max(1, Math.round(h0 * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          canvas.toBlob((blob) => resolve({ blob: blob || file, width: w, height: h }), 'image/jpeg', 0.88);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          resolve({ blob: file, width: 1000, height: 1000 });
        };
        img.src = url;
      });
    }

    async function manejarSeleccionArchivosFoto(fileList, modo = 'nueva') {
      const files = Array.from(fileList || []).filter(f => f && f.size > 0);
      if (files.length === 0) return;

      const of = obtenerOfertaLocalPorId(FOTO_EDITOR_STATE.ofertaId);
      const actuales = obtenerFotosDeOfertaLocal(of).length;
      const cupo = modo === 'reemplazar' ? 1 : Math.max(0, MAX_FOTOS_OFERTA_UI - actuales);
      if (cupo <= 0) {
        mostrarAvisoPantallaGestor(`El álbum ya tiene el máximo de ${MAX_FOTOS_OFERTA_UI} fotos.`, 'error');
        return;
      }

      FOTO_EDITOR_STATE.modo = modo;
      FOTO_EDITOR_STATE.colaArchivos = files.slice(0, cupo);
      FOTO_EDITOR_STATE.indiceCola = 0;
      await cargarArchivoActualEnEditor();
    }

    async function cargarArchivoActualEnEditor() {
      const file = FOTO_EDITOR_STATE.colaArchivos[FOTO_EDITOR_STATE.indiceCola];
      if (!file) {
        cerrarEditorFotoOferta();
        return;
      }

      FOTO_EDITOR_STATE.rotacion = 0;
      FOTO_EDITOR_STATE.presetEncuadre = 'original';
      FOTO_EDITOR_STATE.zoomEncuadre = 1.0;
      FOTO_EDITOR_STATE.panX = 0.5;
      FOTO_EDITOR_STATE.panY = 0.5;
      FOTO_EDITOR_STATE.cropInicial = null;
      FOTO_EDITOR_STATE.aplicarFiltro = true;
      FOTO_EDITOR_STATE.mejoradaDataUrl = '';
      FOTO_EDITOR_STATE.originalDataUrl = '';

      abrirOverlayEditorFotoUI();
      sincronizarControlesEditorUI();

      const comp = await comprimirArchivoImagenCliente(file);
      FOTO_EDITOR_STATE.blobComprimido = comp.blob;
      FOTO_EDITOR_STATE.imgWidthOrig = comp.width || 1000;
      FOTO_EDITOR_STATE.imgHeightOrig = comp.height || 1000;

      await solicitarPreviewServidorFoto(false);
    }

    async function abrirEditorFotoExistente(ofertaId, fotoId) {
      asegurarNodosDomModalesFotosGestor();
      cerrarMenuAccionesFotoOferta();
      const of = obtenerOfertaLocalPorId(ofertaId);
      const foto = obtenerFotosDeOfertaLocal(of).find(f => String(f.id) === String(fotoId));
      if (!foto) return;

      FOTO_EDITOR_STATE.modo = 'reeditar';
      FOTO_EDITOR_STATE.ofertaId = Number(ofertaId);
      FOTO_EDITOR_STATE.fotoId = String(foto.id);
      FOTO_EDITOR_STATE.colaArchivos = [];
      FOTO_EDITOR_STATE.indiceCola = 0;
      FOTO_EDITOR_STATE.blobComprimido = null;
      FOTO_EDITOR_STATE.rotacion = Number(foto.rotacion || 0) || 0;
      FOTO_EDITOR_STATE.aplicarFiltro = foto.filtro_aplicado !== false;
      FOTO_EDITOR_STATE.imgWidthOrig = Number(foto.width || 1000);
      FOTO_EDITOR_STATE.imgHeightOrig = Number(foto.height || 1000);

      if (foto.crop && typeof foto.crop === 'object') {
        FOTO_EDITOR_STATE.presetEncuadre = foto.crop.preset || 'original';
        const minSide = Math.max(0.2, Math.min(Number(foto.crop.w || 1), Number(foto.crop.h || 1)));
        FOTO_EDITOR_STATE.zoomEncuadre = Math.min(2.4, Math.max(1.0, Number((1 / minSide).toFixed(2))));
        const libreX = Math.max(0.0001, 1 - Number(foto.crop.w || 1));
        const libreY = Math.max(0.0001, 1 - Number(foto.crop.h || 1));
        FOTO_EDITOR_STATE.panX = Number(foto.crop.w || 1) < 0.995 ? Math.max(0, Math.min(1, Number(foto.crop.x || 0) / libreX)) : 0.5;
        FOTO_EDITOR_STATE.panY = Number(foto.crop.h || 1) < 0.995 ? Math.max(0, Math.min(1, Number(foto.crop.y || 0) / libreY)) : 0.5;
      } else {
        FOTO_EDITOR_STATE.presetEncuadre = 'original';
        FOTO_EDITOR_STATE.zoomEncuadre = 1.0;
        FOTO_EDITOR_STATE.panX = 0.5;
        FOTO_EDITOR_STATE.panY = 0.5;
      }

      abrirOverlayEditorFotoUI();
      sincronizarControlesEditorUI();
      await solicitarPreviewServidorFoto(true);
    }

    function abrirOverlayEditorFotoUI() {
      FOTO_EDITOR_STATE.abierto = true;
      const modal = document.getElementById('modal-editor-foto-gestor');
      if (modal) modal.style.display = 'flex';
    }

    function cerrarEditorFotoOferta() {
      FOTO_EDITOR_STATE.abierto = false;
      FOTO_EDITOR_STATE.guardando = false;
      if (FOTO_EDITOR_STATE.debounceTimer) {
        clearTimeout(FOTO_EDITOR_STATE.debounceTimer);
        FOTO_EDITOR_STATE.debounceTimer = null;
      }
      const modal = document.getElementById('modal-editor-foto-gestor');
      if (modal) modal.style.display = 'none';
    }

    function calcularCropNormalizadoActual() {
      const rot = ((FOTO_EDITOR_STATE.rotacion % 360) + 360) % 360;
      const swap = rot === 90 || rot === 270;
      const wImg = Math.max(1, swap ? FOTO_EDITOR_STATE.imgHeightOrig : FOTO_EDITOR_STATE.imgWidthOrig);
      const hImg = Math.max(1, swap ? FOTO_EDITOR_STATE.imgWidthOrig : FOTO_EDITOR_STATE.imgHeightOrig);
      const ratioImg = wImg / hImg;

      let baseW = 1.0;
      let baseH = 1.0;
      const preset = FOTO_EDITOR_STATE.presetEncuadre;
      let targetRatio = ratioImg;
      if (preset === '1:1') targetRatio = 1.0;
      else if (preset === '4:5') targetRatio = 0.8;

      if (Math.abs(targetRatio - ratioImg) > 0.01) {
        if (ratioImg > targetRatio) {
          baseW = targetRatio / ratioImg;
          baseH = 1.0;
        } else {
          baseW = 1.0;
          baseH = ratioImg / targetRatio;
        }
      }

      const zoom = Math.max(1.0, Math.min(2.4, Number(FOTO_EDITOR_STATE.zoomEncuadre || 1.0)));
      const w = Math.max(0.1, Math.min(1.0, baseW / zoom));
      const h = Math.max(0.1, Math.min(1.0, baseH / zoom));

      if (preset === 'original' && zoom <= 1.005) {
        return null;
      }

      const x = Math.max(0, Math.min(1 - w, (1 - w) * FOTO_EDITOR_STATE.panX));
      const y = Math.max(0, Math.min(1 - h, (1 - h) * FOTO_EDITOR_STATE.panY));
      return {
        x: Number(x.toFixed(4)),
        y: Number(y.toFixed(4)),
        w: Number(w.toFixed(4)),
        h: Number(h.toFixed(4)),
        preset
      };
    }

    function sincronizarControlesEditorUI() {
      const totalCola = FOTO_EDITOR_STATE.colaArchivos.length;
      const tit = document.getElementById('foto-editor-titulo');
      const sub = document.getElementById('foto-editor-subtitulo');
      if (tit) {
        if (FOTO_EDITOR_STATE.modo === 'reeditar') {
          tit.textContent = '✏️ Editar foto del álbum';
        } else if (FOTO_EDITOR_STATE.modo === 'reemplazar') {
          tit.textContent = '🔄 Reemplazar foto del álbum';
        } else if (totalCola > 1) {
          tit.textContent = `📷 Preparar foto (${FOTO_EDITOR_STATE.indiceCola + 1} de ${totalCola})`;
        } else {
          tit.textContent = '📷 Preparar foto del producto';
        }
      }
      if (sub) {
        sub.textContent = (FOTO_EDITOR_STATE.presetEncuadre !== 'original' || FOTO_EDITOR_STATE.zoomEncuadre > 1.01)
          ? 'Arrastrá la imagen con el dedo para centrar el recorte'
          : 'Compará la mejora automática vs. la foto original';
      }

      document.getElementById('btn-filtro-mejorada')?.classList.toggle('is-active', Boolean(FOTO_EDITOR_STATE.aplicarFiltro));
      document.getElementById('btn-filtro-original')?.classList.toggle('is-active', !FOTO_EDITOR_STATE.aplicarFiltro);

      document.querySelectorAll('#modal-editor-foto-gestor [data-preset-crop]').forEach(btn => {
        btn.classList.toggle('is-active', btn.getAttribute('data-preset-crop') === FOTO_EDITOR_STATE.presetEncuadre);
      });

      const rng = document.getElementById('input-zoom-encuadre');
      const lbl = document.getElementById('label-zoom-encuadre');
      if (rng) rng.value = String(FOTO_EDITOR_STATE.zoomEncuadre);
      if (lbl) lbl.textContent = Number(FOTO_EDITOR_STATE.zoomEncuadre).toFixed(1) + 'x';

      const btnSave = document.getElementById('btn-guardar-foto-editor');
      if (btnSave && !FOTO_EDITOR_STATE.guardando) {
        btnSave.textContent = (FOTO_EDITOR_STATE.modo === 'nueva' && totalCola > 1 && FOTO_EDITOR_STATE.indiceCola < totalCola - 1)
          ? `💾 Guardar y siguiente (${FOTO_EDITOR_STATE.indiceCola + 1}/${totalCola})`
          : '💾 Guardar foto';
      }

      actualizarImagenVisibleEditor();
    }

    function actualizarImagenVisibleEditor() {
      const imgEl = document.getElementById('foto-editor-img');
      const loaderEl = document.getElementById('foto-editor-loader');
      if (!imgEl || !loaderEl) return;

      const src = FOTO_EDITOR_STATE.aplicarFiltro
        ? (FOTO_EDITOR_STATE.mejoradaDataUrl || FOTO_EDITOR_STATE.originalDataUrl)
        : (FOTO_EDITOR_STATE.originalDataUrl || FOTO_EDITOR_STATE.mejoradaDataUrl);

      if (src) {
        imgEl.src = src;
        imgEl.style.display = 'block';
        imgEl.style.opacity = FOTO_EDITOR_STATE.cargandoPreview ? '0.55' : '1';
        loaderEl.style.display = FOTO_EDITOR_STATE.cargandoPreview ? 'block' : 'none';
        loaderEl.style.position = 'absolute';
        loaderEl.style.background = 'rgba(15,23,42,0.68)';
        loaderEl.style.borderRadius = '999px';
        loaderEl.textContent = 'Ajustando...';
      } else {
        imgEl.style.display = 'none';
        loaderEl.style.display = 'block';
        loaderEl.style.position = 'static';
        loaderEl.style.background = 'transparent';
        loaderEl.textContent = 'Procesando vista previa...';
      }
    }

    function seleccionarVarianteFiltroEditor(usarFiltro) {
      FOTO_EDITOR_STATE.aplicarFiltro = Boolean(usarFiltro);
      sincronizarControlesEditorUI();
    }

    function girarFotoEditor(deltaGrados) {
      FOTO_EDITOR_STATE.rotacion = (((FOTO_EDITOR_STATE.rotacion + deltaGrados) % 360) + 360) % 360;
      FOTO_EDITOR_STATE.panX = 0.5;
      FOTO_EDITOR_STATE.panY = 0.5;
      sincronizarControlesEditorUI();
      programarRefrescoPreviewServidor();
    }

    function cambiarPresetEncuadreEditor(preset) {
      FOTO_EDITOR_STATE.presetEncuadre = preset;
      sincronizarControlesEditorUI();
      programarRefrescoPreviewServidor();
    }

    function cambiarZoomEncuadreEditor(val) {
      FOTO_EDITOR_STATE.zoomEncuadre = Math.max(1.0, Math.min(2.4, Number(val) || 1.0));
      sincronizarControlesEditorUI();
      programarRefrescoPreviewServidor();
    }

    function programarRefrescoPreviewServidor() {
      if (FOTO_EDITOR_STATE.debounceTimer) {
        clearTimeout(FOTO_EDITOR_STATE.debounceTimer);
      }
      FOTO_EDITOR_STATE.debounceTimer = setTimeout(() => {
        solicitarPreviewServidorFoto(false);
      }, 170);
    }

    async function solicitarPreviewServidorFoto(incluirBase = false) {
      if (!FOTO_EDITOR_STATE.ofertaId) return;
      FOTO_EDITOR_STATE.cargandoPreview = true;
      actualizarImagenVisibleEditor();

      try {
        const crop = calcularCropNormalizadoActual();
        let resp;
        if (FOTO_EDITOR_STATE.blobComprimido) {
          const fd = new FormData();
          fd.append('foto', FOTO_EDITOR_STATE.blobComprimido, 'captura.jpg');
          fd.append('rotacion', String(FOTO_EDITOR_STATE.rotacion));
          if (crop) fd.append('crop', JSON.stringify(crop));
          fd.append('preview_ambas', 'true');
          resp = await fetchGestor(`/api/produccion/nodos/ofertas-gestor/${FOTO_EDITOR_STATE.ofertaId}/fotos/preview`, {
            method: 'POST',
            body: fd
          });
        } else if (FOTO_EDITOR_STATE.fotoId) {
          resp = await fetchGestor(`/api/produccion/nodos/ofertas-gestor/${FOTO_EDITOR_STATE.ofertaId}/fotos/preview`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              foto_id: FOTO_EDITOR_STATE.fotoId,
              rotacion: FOTO_EDITOR_STATE.rotacion,
              crop,
              preview_ambas: true,
              incluir_base_encuadre: Boolean(incluirBase)
            })
          });
        } else {
          return;
        }

        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo previsualizar la imagen: ' + (data.error || `HTTP ${resp.status}`), 'error');
          return;
        }

        if (incluirBase && data.base_encuadre_data_url) {
          await new Promise((resolve) => {
            const im = new Image();
            im.onload = () => {
              FOTO_EDITOR_STATE.imgWidthOrig = im.naturalWidth || FOTO_EDITOR_STATE.imgWidthOrig;
              FOTO_EDITOR_STATE.imgHeightOrig = im.naturalHeight || FOTO_EDITOR_STATE.imgHeightOrig;
              resolve();
            };
            im.onerror = () => resolve();
            im.src = data.base_encuadre_data_url;
          });
        }

        FOTO_EDITOR_STATE.mejoradaDataUrl = data.mejorada_data_url || '';
        FOTO_EDITOR_STATE.originalDataUrl = data.original_data_url || data.mejorada_data_url || '';
      } catch (_) {
        mostrarAvisoPantallaGestor('Falla de conexión al generar la vista previa.', 'error');
      } finally {
        FOTO_EDITOR_STATE.cargandoPreview = false;
        actualizarImagenVisibleEditor();
      }
    }

    async function confirmarGuardarFotoEditor() {
      if (FOTO_EDITOR_STATE.guardando || !FOTO_EDITOR_STATE.ofertaId) return;
      FOTO_EDITOR_STATE.guardando = true;
      const btnSave = document.getElementById('btn-guardar-foto-editor');
      if (btnSave) {
        btnSave.disabled = true;
        btnSave.textContent = 'Guardando...';
      }

      try {
        const crop = calcularCropNormalizadoActual();
        let resp;

        if (FOTO_EDITOR_STATE.modo === 'nueva') {
          const fd = new FormData();
          fd.append('foto', FOTO_EDITOR_STATE.blobComprimido, 'foto.jpg');
          fd.append('rotacion', String(FOTO_EDITOR_STATE.rotacion));
          if (crop) fd.append('crop', JSON.stringify(crop));
          fd.append('aplicar_filtro', String(Boolean(FOTO_EDITOR_STATE.aplicarFiltro)));
          resp = await fetchGestor(`/api/produccion/nodos/ofertas-gestor/${FOTO_EDITOR_STATE.ofertaId}/fotos`, {
            method: 'POST',
            body: fd
          });
        } else if (FOTO_EDITOR_STATE.modo === 'reemplazar') {
          const fd = new FormData();
          fd.append('foto', FOTO_EDITOR_STATE.blobComprimido, 'reemplazo.jpg');
          fd.append('rotacion', String(FOTO_EDITOR_STATE.rotacion));
          if (crop) fd.append('crop', JSON.stringify(crop));
          fd.append('aplicar_filtro', String(Boolean(FOTO_EDITOR_STATE.aplicarFiltro)));
          resp = await fetchGestor(`/api/produccion/nodos/ofertas-gestor/${FOTO_EDITOR_STATE.ofertaId}/fotos/${encodeURIComponent(FOTO_EDITOR_STATE.fotoId)}`, {
            method: 'PUT',
            body: fd
          });
        } else {
          resp = await fetchGestor(`/api/produccion/nodos/ofertas-gestor/${FOTO_EDITOR_STATE.ofertaId}/fotos/${encodeURIComponent(FOTO_EDITOR_STATE.fotoId)}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              rotacion: FOTO_EDITOR_STATE.rotacion,
              crop: crop || null,
              aplicar_filtro: Boolean(FOTO_EDITOR_STATE.aplicarFiltro)
            })
          });
        }

        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo guardar la foto: ' + (data.error || `HTTP ${resp.status}`), 'error');
          return;
        }

        // Si quedan más archivos en cola de galería, pasar al siguiente antes de cerrar
        if (FOTO_EDITOR_STATE.modo === 'nueva' && FOTO_EDITOR_STATE.indiceCola < FOTO_EDITOR_STATE.colaArchivos.length - 1) {
          FOTO_EDITOR_STATE.guardando = false;
          if (btnSave) btnSave.disabled = false;
          FOTO_EDITOR_STATE.indiceCola += 1;
          await cargarPanelGestor();
          await cargarArchivoActualEnEditor();
          return;
        }

        cerrarEditorFotoOferta();
        await cargarPanelGestor();
        mostrarAvisoPantallaGestor('✓ Foto guardada en el álbum del producto.', 'ok');
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de red al guardar la foto.', 'error');
      } finally {
        FOTO_EDITOR_STATE.guardando = false;
        if (btnSave) btnSave.disabled = false;
        sincronizarControlesEditorUI();
      }
    }

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
              <button type="button" class="btn-album-act" style="justify-content:center; min-height:38px;"
                ${idx === 0 ? 'disabled' : ''}
                onclick="moverOrdenFotoOferta(${Number(ofertaId)}, '${esc(f.id)}', -1)">
                ◀ Mover antes
              </button>
              <button type="button" class="btn-album-act" style="justify-content:center; min-height:38px;"
                ${idx === fotos.length - 1 ? 'disabled' : ''}
                onclick="moverOrdenFotoOferta(${Number(ofertaId)}, '${esc(f.id)}', 1)">
                Mover después ▶
              </button>
            </div>
          ` : ''}
          <button type="button" class="btn-album-act btn-album-danger" style="width:100%; justify-content:center; min-height:40px; font-size:0.8rem;"
            onclick="confirmarEliminarFotoOferta(${Number(ofertaId)}, '${esc(f.id)}')">
            🗑️ Eliminar esta foto
          </button>
        </div>
      `;
      modal.style.display = 'flex';
    }

    function abrirMenuAccionesVideoOferta(ofertaId, videoId) {
      asegurarNodosDomModalesFotosGestor();
      const of = obtenerOfertaLocalPorId(ofertaId);
      const videos = obtenerVideosDeOfertaLocal(of);
      const idx = videos.findIndex(v => String(v.id) === String(videoId));
      if (idx === -1) return;
      const v = videos[idx];
      const portadaModo = String(of?.portada_modo || 'AUTO').toUpperCase();
      const esPortadaActual = portadaModo !== 'OCULTA' && String(of?.portada_activa?.id || '') === String(v.id);
      const durTxt = Math.max(1, Math.round(Number(v.duration_sec || 1))) + 's';

      const box = document.getElementById('modal-acciones-foto-content');
      const modal = document.getElementById('modal-acciones-foto-gestor');
      if (!box || !modal) return;

      box.innerHTML = `
        <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;">
          <div style="font-weight:900; font-size:0.96rem; color:var(--text);">
            ${esPortadaActual ? `⭐ Video de Portada (${durTxt})` : `🎬 Video #${idx + 1} (${durTxt})`}
          </div>
          <button type="button" onclick="cerrarMenuAccionesFotoOferta()" aria-label="Cerrar"
            style="border:none; background:var(--surface-warm); color:var(--text); width:32px; height:32px; border-radius:999px; font-weight:900; cursor:pointer;">✕</button>
        </div>
        <div style="background:#0f172a; border-radius:12px; height:220px; display:flex; align-items:center; justify-content:center; overflow:hidden; margin-bottom:12px;">
          <video src="${esc(v.url)}" ${v.poster_url ? `poster="${esc(v.poster_url)}"` : ''}
            controls playsinline preload="metadata"
            style="max-width:100%; max-height:100%; object-fit:contain;"></video>
        </div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          ${!esPortadaActual ? `
            <button type="button" class="btn-album-act" style="width:100%; justify-content:center; min-height:40px; border-color:var(--brand); color:var(--brand-dark); font-weight:900;"
              data-btn-elegir-portada="${esc(v.id)}"
              onclick="configurarPortadaOfertaGestor(${Number(ofertaId)}, 'CUSTOM', '${esc(v.id)}')">
              ⭐ Usar este video como portada
            </button>
          ` : `
            <div style="font-size:0.76rem; color:#166534; background:#f0fdf4; border:1px solid #bbf7d0; border-radius:9px; padding:7px 10px; text-align:center; font-weight:800;">
              ✓ Este video se muestra como portada en silencio en tu tienda
            </div>
          `}
          <button type="button" class="btn-album-act btn-album-danger" style="width:100%; justify-content:center; min-height:40px; font-size:0.8rem;"
            data-btn-eliminar-video="${esc(v.id)}"
            onclick="confirmarEliminarVideoOferta(${Number(ofertaId)}, '${esc(v.id)}')">
            🗑️ Eliminar este video
          </button>
        </div>
      `;
      modal.style.display = 'flex';
    }

    function cerrarMenuAccionesFotoOferta() {
      const box = document.getElementById('modal-acciones-foto-content');
      if (box) {
        box.querySelectorAll('video').forEach(v => {
          try { v.pause(); } catch (_) {}
        });
      }
      const modal = document.getElementById('modal-acciones-foto-gestor');
      if (modal) modal.style.display = 'none';
    }

    async function configurarPortadaOfertaGestor(ofertaId, portadaModo = 'AUTO', portadaMediaId = null) {
      cerrarMenuAccionesFotoOferta();
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/ofertas-gestor/${Number(ofertaId)}/portada`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            portada_modo: portadaModo,
            portada_media_id: portadaMediaId
          })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo actualizar la portada: ' + (data.error || `HTTP ${resp.status}`), 'error');
          return;
        }
        await cargarPanelGestor();
        if (String(portadaModo).toUpperCase() === 'OCULTA') {
          mostrarAvisoPantallaGestor('🙈 Portada oculta en la lista principal (la galería sigue disponible al abrir el producto).', 'ok');
        } else {
          mostrarAvisoPantallaGestor('⭐ Portada del producto actualizada.', 'ok');
        }
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de red al actualizar la portada.', 'error');
      }
    }

    let _ofertaPendienteSubidaVideoId = null;

    function dispararSubidaVideoOferta(ofertaId) {
      asegurarNodosDomModalesFotosGestor();
      if (VIDEO_UPLOAD_STATE.subiendoOfertaId) {
        mostrarAvisoPantallaGestor('Esperá unos segundos a que termine de optimizarse el video en curso.', 'error');
        return;
      }
      const of = obtenerOfertaLocalPorId(ofertaId);
      const videos = obtenerVideosDeOfertaLocal(of);
      if (videos.length >= MAX_VIDEOS_OFERTA_UI) {
        mostrarAvisoPantallaGestor(`Ya alcanzaste el máximo de ${MAX_VIDEOS_OFERTA_UI} videos cortos para este artículo.`, 'error');
        return;
      }
      _ofertaPendienteSubidaVideoId = Number(ofertaId);
      const inpVid = document.getElementById('input-video-galeria-gestor');
      if (inpVid) {
        inpVid.value = '';
        inpVid.click();
      }
    }

    async function manejarSeleccionArchivoVideo(fileList) {
      const file = Array.from(fileList || [])[0];
      const ofertaId = Number(_ofertaPendienteSubidaVideoId || 0);
      _ofertaPendienteSubidaVideoId = null;
      if (!file || !ofertaId) return;

      if (file.size > 45 * 1024 * 1024) {
        mostrarAvisoPantallaGestor('El video supera los 45 MB permitidos. Elegí un clip más corto.', 'error');
        return;
      }

      VIDEO_UPLOAD_STATE.subiendoOfertaId = ofertaId;
      refrescarControlesOfertasEnDom();

      try {
        const fd = new FormData();
        fd.append('video', file, file.name || 'video.mp4');
        const resp = await fetchGestor(`/api/produccion/nodos/ofertas-gestor/${ofertaId}/videos`, {
          method: 'POST',
          body: fd
        });
        const data = await leerRespuestaJsonSegura(resp);
        VIDEO_UPLOAD_STATE.subiendoOfertaId = null;
        if (!resp.ok || !data.ok) {
          refrescarControlesOfertasEnDom();
          mostrarAvisoPantallaGestor('No se pudo subir el video: ' + (data.error || `HTTP ${resp.status}`), 'error');
          return;
        }
        await cargarPanelGestor();
        if (data.recortado_25s) {
          mostrarAvisoPantallaGestor('🎬 Video optimizado y recortado automáticamente a los primeros 25 segundos.', 'ok');
        } else {
          mostrarAvisoPantallaGestor('🎬 Video corto optimizado y sumado a la galería.', 'ok');
        }
      } catch (_) {
        VIDEO_UPLOAD_STATE.subiendoOfertaId = null;
        refrescarControlesOfertasEnDom();
        mostrarAvisoPantallaGestor('Error de red al subir el video.', 'error');
      }
    }

    async function confirmarEliminarVideoOferta(ofertaId, videoId) {
      if (!window.confirm('¿Querés eliminar este video de la galería del producto?')) return;
      cerrarMenuAccionesFotoOferta();
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/ofertas-gestor/${Number(ofertaId)}/videos/${encodeURIComponent(videoId)}`, {
          method: 'DELETE'
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo eliminar el video: ' + (data.error || `HTTP ${resp.status}`), 'error');
          return;
        }
        await cargarPanelGestor();
        mostrarAvisoPantallaGestor('🗑️ Video eliminado de la galería.', 'ok');
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de red al eliminar el video.', 'error');
      }
    }

    function abrirSelectorFotosSugeridasOferta(ofertaId) {
      asegurarNodosDomModalesFotosGestor();
      const of = obtenerOfertaLocalPorId(ofertaId);
      const sugeridas = obtenerSugeridasBaseOfertaLocal(of);
      if (sugeridas.length === 0) return;

      const box = document.getElementById('modal-acciones-foto-content');
      const modal = document.getElementById('modal-acciones-foto-gestor');
      if (!box || !modal) return;

      box.innerHTML = `
        <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px;">
          <div style="font-weight:900; font-size:0.95rem; color:var(--text);">📦 Fotos sugeridas de catálogo</div>
          <button type="button" onclick="cerrarMenuAccionesFotoOferta()" aria-label="Cerrar"
            style="border:none; background:var(--surface-warm); color:var(--text); width:32px; height:32px; border-radius:999px; font-weight:900; cursor:pointer;">✕</button>
        </div>
        <p style="margin:0 0 10px 0; font-size:0.76rem; color:var(--muted);">
          Tocá cualquier foto sugerida para sumarla en 1 toque a la galería de tu tienda y poder combinarla o editarla:
        </p>
        <div style="display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:9px;">
          ${sugeridas.map((s, i) => `
            <div style="border:1px solid var(--border); border-radius:10px; padding:7px; background:#fffdfb; display:flex; flex-direction:column; gap:6px;">
              <div style="height:110px; border-radius:8px; overflow:hidden; background:#18181b;">
                <img src="${esc(s.url)}" alt="Sugerida ${i + 1}" style="width:100%; height:100%; object-fit:cover;" />
              </div>
              <button type="button" class="btn-album-act" style="width:100%; justify-content:center;"
                onclick="importarFotoSugeridaOfertaGestor(${Number(ofertaId)}, decodeURIComponent('${encodeURIComponent(s.id || s.url)}'))">
                + Sumar a mi galería
              </button>
            </div>
          `).join('')}
        </div>
      `;
      modal.style.display = 'flex';
    }

    async function importarFotoSugeridaOfertaGestor(ofertaId, sugeridaIdOUrl) {
      cerrarMenuAccionesFotoOferta();
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/ofertas-gestor/${Number(ofertaId)}/fotos/importar-sugerida`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ foto_sugerida_id: sugeridaIdOUrl })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo importar la foto sugerida: ' + (data.error || `HTTP ${resp.status}`), 'error');
          return;
        }
        await cargarPanelGestor();
        mostrarAvisoPantallaGestor('📦 Foto sugerida sumada a la galería de tu tienda.', 'ok');
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de red al importar la foto sugerida.', 'error');
      }
    }

    async function moverOrdenFotoOferta(ofertaId, fotoId, delta) {
      const of = obtenerOfertaLocalPorId(ofertaId);
      const fotos = obtenerFotosDeOfertaLocal(of);
      const idx = fotos.findIndex(f => String(f.id) === String(fotoId));
      const dest = idx + Number(delta);
      if (idx < 0 || dest < 0 || dest >= fotos.length) return;

      const ids = fotos.map(f => f.id);
      const [mov] = ids.splice(idx, 1);
      ids.splice(dest, 0, mov);
      cerrarMenuAccionesFotoOferta();

      try {
        const resp = await fetchGestor(`/api/produccion/nodos/ofertas-gestor/${Number(ofertaId)}/fotos-orden`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orden_ids: ids })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo reordenar el álbum: ' + (data.error || `HTTP ${resp.status}`), 'error');
          return;
        }
        await cargarPanelGestor();
        mostrarAvisoPantallaGestor('✓ Orden de fotos actualizado.', 'ok');
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de red al reordenar las fotos.', 'error');
      }
    }

    async function confirmarEliminarFotoOferta(ofertaId, fotoId) {
      if (!window.confirm('¿Querés eliminar esta foto de la galería del producto?')) return;
      cerrarMenuAccionesFotoOferta();
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/ofertas-gestor/${Number(ofertaId)}/fotos/${encodeURIComponent(fotoId)}`, {
          method: 'DELETE'
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo eliminar la foto: ' + (data.error || `HTTP ${resp.status}`), 'error');
          return;
        }
        await cargarPanelGestor();
        mostrarAvisoPantallaGestor('🗑️ Foto eliminada de la galería.', 'ok');
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de red al eliminar la foto.', 'error');
      }
    }

    async function confirmarVaciarAlbumOferta(ofertaId) {
      if (!window.confirm('¿Querés vaciar todas las fotos y videos de este producto?')) return;
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/ofertas-gestor/${Number(ofertaId)}/fotos`, {
          method: 'DELETE'
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo vaciar la galería: ' + (data.error || `HTTP ${resp.status}`), 'error');
          return;
        }
        await cargarPanelGestor();
        mostrarAvisoPantallaGestor('🧹 Galería multimedia vaciada por completo.', 'ok');
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de red al vaciar la galería.', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      GSTATE.slug = detectarSlugInicial();
      const hash = (window.location.hash || '').replace(/^#/, '');
      if (['reparto', 'ofertas', 'propuestas', 'logistica', 'pedidos', 'ctacte', 'liquidacion', 'compradores'].includes(hash)) {
        GSTATE.vista = hash;
      }
      cargarPanelGestor();
    });
  </script>
</body>
</html>
