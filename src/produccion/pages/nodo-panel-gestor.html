    async function sumarCatalogoBaseAMiOferta(catalogoId, abrirOfertasDespues = false) {
      if (!GSTATE.nodo || !catalogoId) return;
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/sumar-catalogo`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ catalogo_id: Number(catalogoId) })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo sumar el producto: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          return;
        }
        await cargarPanelGestor();
        mostrarAvisoPantallaGestor('✓ Producto sumado a Mi Oferta y Márgenes.', 'ok');
        if (abrirOfertasDespues) {
          abrirSeccionGestor('ofertas');
        }
      } catch (err) {
        mostrarAvisoPantallaGestor('Falla de conexión al intentar sumar el producto. Verificá tu señal e intentá de nuevo.', 'error');
      }
    }

    async function guardarCambioOferta(ofertaId, body) {
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/ofertas-gestor/${ofertaId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo guardar el cambio: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          return;
        }
        await cargarPanelGestor();
      } catch (_) {
        mostrarAvisoPantallaGestor('Falla de comunicación al guardar la oferta.', 'error');
      }
    }

    async function guardarPrecioDirectoOferta(ofertaId, base, nuevoPrecio) {
      const margen = base > 0 ? Number((((nuevoPrecio - base) / base) * 100).toFixed(2)) : 0;
      await guardarCambioOferta(ofertaId, {
        margen_gestor_pct: Math.max(0, margen),
        precio_venta_vecino: nuevoPrecio
      });
    }

    // -------------------------------------------------------------------------
    // 2. PEDIR NUEVA FRACCIÓN (CONECTADO DETERMINÍSTICAMENTE A INGREDIENTES LAMDA)
    // -------------------------------------------------------------------------
    function normalizarTextoGestor(str) {
      return String(str ?? '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase();
    }

    function formatearPesoCortoGestor(kilos) {
      const kg = Number(kilos || 0);
      const gramos = Math.round(kg * 1000);
      if (gramos >= 1000 && gramos % 1000 === 0) return `${gramos / 1000} kg`;
      if (gramos >= 1000) return `${Number(kg.toFixed(2))} kg`;
      return `${gramos}g`;
    }

    function obtenerIngredientesFiltradosGestor(categoria, filtroTexto) {
      const listaCat = (GSTATE.ingredientesDisponibles || []).filter(
        i => String(i.categoria_gestor || '') === String(categoria || '')
      );
      const terminos = normalizarTextoGestor(filtroTexto).split(/\s+/).filter(Boolean);
      if (terminos.length === 0) return listaCat;
      return listaCat.filter(i => {
        const bolsa = normalizarTextoGestor(`${i.nombre_claro} ${i.alias_vecino_sugerido} ${i.categoria_gestor}`);
        return terminos.every(t => bolsa.includes(t));
      });
    }

    function obtenerIngredienteSeleccionadoGestor() {
      return (GSTATE.ingredientesDisponibles || []).find(
        i => Number(i.id) === Number(GSTATE.propIngredienteIdSel)
      ) || null;
    }

    function obtenerOpcionesGramajeIngrediente(ingObj) {
      const base = ingObj && ingObj.es_pack_barritas
        ? [
            { label: 'Pack x 3 (150g)', val: 0.15 },
            { label: 'Pack x 6 (300g)', val: 0.30 },
            { label: 'Pack x 12 (600g)', val: 0.60 },
            { label: 'Caja x 20 (1 kg)', val: 1.00 }
          ]
        : [
            { label: '100g', val: 0.10 },
            { label: '150g', val: 0.15 },
            { label: '200g', val: 0.20 },
            { label: '250g', val: 0.25 },
            { label: '400g', val: 0.40 },
            { label: '500g', val: 0.50 },
            { label: '1 kg', val: 1.00 }
          ];

      const presExistentes = Array.isArray(ingObj?.presentaciones_lamda) ? ingObj.presentaciones_lamda : [];
      for (const p of presExistentes) {
        const kv = Number(p.kilos_unidad || 0);
        if (kv > 0 && !base.some(b => Math.abs(b.val - kv) < 0.003)) {
          base.push({
            label: p.etiqueta || formatearPesoCortoGestor(kv),
            val: kv
          });
        }
      }
      base.sort((a, b) => a.val - b.val);
      return base;
    }

    function evaluarEstadoGramajeParaGestor(ingObj, kilos) {
      const idNum = Number(ingObj?.id || 0);
      const kgNum = Number(kilos || 0);
      if (!idNum || !kgNum) {
        return { tipo: 'NUEVA_DISPONIBLE' };
      }

      const enOfertaNodo = (GSTATE.ofertas || []).find(
        o => Number(o.ingrediente_origen_id) === idNum && Math.abs(Number(o.kilos_unidad) - kgNum) < 0.003
      );
      if (enOfertaNodo) {
        return { tipo: 'EN_OFERTA_NODO', oferta: enOfertaNodo };
      }

      const presLamda = (ingObj?.presentaciones_lamda || []).find(
        p => Math.abs(Number(p.kilos_unidad) - kgNum) < 0.003
      );
      if (presLamda && presLamda.en_catalogo_nodos) {
        return { tipo: 'EN_CATALOGO_NODOS', pres: presLamda };
      }

      const yaPendiente = (GSTATE.propuestas || []).find(
        p => p.estado === 'PENDIENTE_COTIZACION' &&
             Number(p.ingrediente_sugerido_id) === idNum &&
             Math.abs(Number(p.kilos_sugeridos) - kgNum) < 0.003
      );

      if (presLamda && presLamda.ya_produce_lamda) {
        return { tipo: 'YA_EXISTE_LAMDA', pres: presLamda, propuestaPendiente: yaPendiente || null };
      }

      if (yaPendiente) {
        return { tipo: 'YA_SOLICITADA', propuesta: yaPendiente };
      }

      return { tipo: 'NUEVA_DISPONIBLE' };
    }

    function elegirPrimerGramajeNuevoDisponible(ingObj) {
      if (!ingObj) return 0.25;
      const opciones = obtenerOpcionesGramajeIngrediente(ingObj);
      const preferidos = ingObj.es_pack_barritas
        ? [0.30, 0.15, 0.60, 1.00]
        : [0.25, 0.15, 0.10, 0.40, 0.20, 0.50, 1.00];

      for (const pref of preferidos) {
        const op = opciones.find(o => Math.abs(o.val - pref) < 0.003);
        if (op && evaluarEstadoGramajeParaGestor(ingObj, op.val).tipo === 'NUEVA_DISPONIBLE') {
          return op.val;
        }
      }
      const cualquieraNueva = opciones.find(o => evaluarEstadoGramajeParaGestor(ingObj, o.val).tipo === 'NUEVA_DISPONIBLE');
      return cualquieraNueva ? cualquieraNueva.val : (opciones[0] ? opciones[0].val : 0.25);
    }

    function renderResumenExistentesLamdaHtml(ingObj) {
      const pres = Array.isArray(ingObj?.presentaciones_lamda) ? ingObj.presentaciones_lamda : [];
      if (pres.length === 0) {
        return `
          <div style="font-size:0.75rem; color:var(--muted); margin-bottom:7px;">
            Este artículo aún no tiene bolsitas fraccionadas estándar; podés pedir el gramaje que necesites.
          </div>
        `;
      }
      const badges = pres.map(p => {
        const enMiOferta = (GSTATE.ofertas || []).some(
          o => Number(o.ingrediente_origen_id) === Number(ingObj.id) && Math.abs(Number(o.kilos_unidad) - Number(p.kilos_unidad)) < 0.003
        );
        const sub = enMiOferta
          ? ' (en tu oferta)'
          : p.en_catalogo_nodos
            ? ' (cotizada)'
            : '';
        return `<span style="display:inline-flex; align-items:center; gap:3px; padding:2px 8px; border-radius:999px; background:#edf7f1; border:1px solid rgba(31,111,74,0.28); color:var(--ok); font-weight:800; font-size:0.72rem;">✓ ${esc(p.etiqueta)}${esc(sub)}</span>`;
      }).join(' ');

      return `
        <div style="margin-bottom:8px; padding:8px 10px; border-radius:10px; background:#f8faf8; border:1px solid rgba(31,111,74,0.18); font-size:0.76rem; line-height:1.45;">
          <div style="color:var(--text); font-weight:800; margin-bottom:4px;">Presentaciones que LAMDA ya produce:</div>
          <div style="display:flex; flex-wrap:wrap; gap:5px;">${badges}</div>
          <div style="color:var(--muted); font-size:0.72rem; margin-top:4px;">
            Esas medidas ya existen; para pedir una <strong>nueva fracción</strong> elegí abajo otro gramaje distinto.
          </div>
        </div>
      `;
    }

    function renderOpcionesGramajePropuestaHtml(ingObj, kilosActuales) {
      const kg = Number(kilosActuales || 0);
      const opciones = obtenerOpcionesGramajeIngrediente(ingObj);

      return opciones.map(op => {
        const activo = Math.abs(kg - op.val) < 0.003;
        const est = evaluarEstadoGramajeParaGestor(ingObj, op.val);

        let sufijo = '';
        let estiloExtra = '';

        if (est.tipo === 'EN_OFERTA_NODO' || est.tipo === 'EN_CATALOGO_NODOS') {
          sufijo = ' · ✓ Cotizada';
          estiloExtra = activo
            ? 'background:var(--ok-soft); border-color:var(--ok); color:var(--ok); font-weight:800;'
            : 'background:#f4faf6; border-color:rgba(31,111,74,0.28); color:var(--ok); opacity:0.9;';
        } else if (est.tipo === 'YA_EXISTE_LAMDA') {
          sufijo = est.propuestaPendiente ? ' · ⏳ Pedida' : ' · ✓ Ya existe';
          estiloExtra = activo
            ? 'background:#eef5f0; border-color:var(--ok); color:var(--ok); font-weight:800;'
            : 'background:#f5f6f4; border-color:#d6d3ce; color:#57534e;';
        } else if (est.tipo === 'YA_SOLICITADA') {
          sufijo = ' · ⏳ Solicitada';
          estiloExtra = activo
            ? 'background:var(--warn-soft); border-color:rgba(180,83,9,0.45); color:var(--warn); font-weight:800;'
            : 'background:#fffbeb; border-color:rgba(180,83,9,0.26); color:var(--warn);';
        } else if (activo) {
          estiloExtra = 'background:var(--brand-soft); border-color:var(--brand); color:var(--brand-dark); font-weight:800;';
        }

        return `
          <button type="button" class="btn-soft"
            onclick="fijarGramajePropuestaGestor(${op.val})"
            style="${estiloExtra}">
            ${esc(op.label)}${esc(sufijo)}
          </button>
        `;
      }).join('');
    }

    function renderAvisoEstadoGramajeHtml(ingObj, kilos) {
      if (!ingObj || !kilos) return '';
      const est = evaluarEstadoGramajeParaGestor(ingObj, kilos);
      const etPeso = formatearPesoCortoGestor(kilos);

      if (est.tipo === 'EN_OFERTA_NODO') {
        const of = est.oferta;
        return `
          <div style="padding:11px 12px; border-radius:11px; background:var(--ok-soft); border:1px solid rgba(31,111,74,0.30); color:var(--text); font-size:0.8rem; line-height:1.45;">
            <strong style="color:var(--ok);">✓ Ya tenés ${esc(etPeso)} cotizada en tu Nodo</strong> (Costo Base <strong>${fmt(of.precio_base_nodo_final)}</strong>).<br>
            No corresponde volver a pedirla: configurala o publicala desde <strong>Mi Oferta y Márgenes</strong>.
            <div style="margin-top:8px;">
              <button type="button" class="btn-soft" style="font-size:0.76rem; padding:5px 11px;" onclick="abrirSeccionGestor('ofertas')">
                Ir a Mi Oferta y Márgenes →
              </button>
            </div>
          </div>
        `;
      }

      if (est.tipo === 'EN_CATALOGO_NODOS') {
        const pres = est.pres;
        return `
          <div style="padding:11px 12px; border-radius:11px; background:var(--ok-soft); border:1px solid rgba(31,111,74,0.30); color:var(--text); font-size:0.8rem; line-height:1.45;">
            <strong style="color:var(--ok);">✓ Esta medida (${esc(etPeso)}) ya está cotizada por LAMDA</strong> (Costo Base <strong>${fmt(pres.precio_base_nodo_final)}</strong>).<br>
            No necesitás pedir cotización; sumala directo a tu Nodo:
            <div style="margin-top:8px;">
              <button type="button" class="btn-primary" style="font-size:0.78rem; padding:6px 12px;"
                onclick="sumarCatalogoBaseAMiOferta(${pres.catalogo_id}, true)">
                + Sumar a Mi Oferta y Márgenes
              </button>
            </div>
          </div>
        `;
      }

      if (est.tipo === 'YA_EXISTE_LAMDA') {
        if (est.propuestaPendiente) {
          return `
            <div style="padding:11px 12px; border-radius:11px; background:var(--warn-soft); border:1px solid rgba(180,83,9,0.28); color:var(--warn); font-size:0.8rem; line-height:1.45;">
              <strong>⏳ Habilitación ya solicitada (${esc(est.propuestaPendiente.codigo_propuesta)})</strong><br>
              Ya pediste habilitar esta presentación existente de <strong>${esc(etPeso)}</strong> en tu Nodo.
              <div style="margin-top:8px; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
                <span style="font-size:0.74rem;">¿La enviaste por error?</span>
                <button type="button" class="btn-soft"
                  style="font-size:0.75rem; padding:5px 10px; border-color:rgba(185,28,28,0.35); color:#b91c1c; background:#fff5f5;"
                  onclick="anularPropuestaGestor(${Number(est.propuestaPendiente.id)})">
                  ✕ Anular solicitud
                </button>
              </div>
            </div>
          `;
        }
        return `
          <div style="padding:11px 12px; border-radius:11px; background:#f4faf6; border:1px solid rgba(31,111,74,0.28); color:var(--text); font-size:0.8rem; line-height:1.45;">
            <strong style="color:var(--ok);">✓ LAMDA ya produce la presentación de ${esc(etPeso)}</strong><br>
            No debe solicitarse como nueva fracción a crear. Elegí arriba otro gramaje que aún no exista (por ejemplo <strong>100g</strong>, <strong>150g</strong> o <strong>400g</strong>).
            <div style="margin-top:8px; padding-top:7px; border-top:1px dashed rgba(31,111,74,0.22); display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
              <span style="font-size:0.74rem; color:var(--muted);">¿Querés vender esta medida existente de ${esc(etPeso)}?</span>
              <button type="button" class="btn-soft" style="font-size:0.75rem; padding:5px 10px;"
                onclick="enviarNuevaPropuestaGestor({ solicitarHabilitacionExistente: true })">
                Pedir que la habiliten en mi Nodo
              </button>
            </div>
          </div>
        `;
      }

      if (est.tipo === 'YA_SOLICITADA') {
        return `
          <div style="padding:10px 12px; border-radius:11px; background:var(--warn-soft); border:1px solid rgba(180,83,9,0.25); color:var(--warn); font-size:0.8rem; line-height:1.45;">
            <strong>⏳ Solicitud en cotización (${esc(est.propuesta.codigo_propuesta)})</strong><br>
            Esta medida de <strong>${esc(etPeso)}</strong> ya fue enviada y está pendiente de cotización.
            <div style="margin-top:8px; padding-top:7px; border-top:1px dashed rgba(180,83,9,0.25); display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
              <span style="font-size:0.74rem;">¿Te equivocaste de gramaje o producto?</span>
              <button type="button" class="btn-soft"
                style="font-size:0.75rem; padding:5px 10px; border-color:rgba(185,28,28,0.35); color:#b91c1c; background:#fff5f5;"
                onclick="anularPropuestaGestor(${Number(est.propuesta.id)})">
                ✕ Anular solicitud
              </button>
            </div>
          </div>
        `;
      }

      return '';
    }

    function formatearValorInputPesoManual(kilos, unidad) {
      const k = Number(kilos || 0);
      if (!Number.isFinite(k) || k <= 0) return '';
      if (unidad === 'kg') {
        return String(Math.round(k * 1000) / 1000);
      }
      return String(Math.round(k * 1000 * 10) / 10);
    }

    function parsearKilosDesdeTextoManual(texto, unidad) {
      const limpio = String(texto ?? '').trim().replace(',', '.').replace(/\s+/g, '');
      if (!limpio || limpio === '.' || !/^\d*(\.\d+)?$/.test(limpio)) return 0;
      const num = Number(limpio);
      if (!Number.isFinite(num) || num <= 0) return 0;
      const kilos = unidad === 'kg' ? num : (num / 1000);
      return Number(kilos.toFixed(4));
    }

    function sincronizarBotonEnvioPropuestaDom(ingObj, kilos) {
      const btn = document.getElementById('btn-enviar-propuesta-gestor');
      if (!btn) return;
      if (!kilos || Number(kilos) <= 0) {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        btn.textContent = 'Ingresá un peso válido mayor a 0';
        return;
      }
      const est = evaluarEstadoGramajeParaGestor(ingObj, kilos);
      const etPeso = formatearPesoCortoGestor(kilos);

      if (est.tipo === 'NUEVA_DISPONIBLE') {
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.textContent = `Enviar Solicitud de Nueva Fracción (${etPeso})`;
      } else if (est.tipo === 'EN_OFERTA_NODO' || est.tipo === 'EN_CATALOGO_NODOS') {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        btn.textContent = `Medida ${etPeso} ya cotizada`;
      } else if (est.tipo === 'YA_EXISTE_LAMDA') {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        btn.textContent = `Medida ${etPeso} ya existe en LAMDA`;
      } else if (est.tipo === 'YA_SOLICITADA') {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        btn.textContent = `Medida ${etPeso} ya solicitada`;
      }
    }

    function actualizarControlesPropuestaEnVivo() {
      const totalCat = (GSTATE.ingredientesDisponibles || []).filter(
        i => String(i.categoria_gestor || '') === String(GSTATE.propCategoriaSel || '')
      );
      const filtrados = obtenerIngredientesFiltradosGestor(GSTATE.propCategoriaSel, GSTATE.propFiltroTexto);

      if (!filtrados.some(i => Number(i.id) === Number(GSTATE.propIngredienteIdSel))) {
        GSTATE.propIngredienteIdSel = filtrados[0] ? Number(filtrados[0].id) : 0;
      }
      const ingSel = obtenerIngredienteSeleccionadoGestor();

      const wrapFiltro = document.getElementById('prop-filtro-wrap');
      if (wrapFiltro) {
        wrapFiltro.style.display = totalCat.length > 8 ? 'block' : 'none';
      }

      const selIng = document.getElementById('prop-ingrediente');
      if (selIng) {
        selIng.innerHTML = filtrados.length === 0
          ? `<option value="">Sin coincidencias en ${esc(GSTATE.propCategoriaSel)}</option>`
          : filtrados.map(i => `
              <option value="${i.id}" ${Number(i.id) === Number(GSTATE.propIngredienteIdSel) ? 'selected' : ''}>
                ${esc(i.nombre_claro)}
              </option>
            `).join('');
      }

      const inputNombre = document.getElementById('prop-nombre');
      if (inputNombre && ingSel && !GSTATE.propNombreEditadoManual) {
        inputNombre.value = ingSel.alias_vecino_sugerido || ingSel.nombre_claro;
      }

      const resumenExistBox = document.getElementById('prop-resumen-existentes');
      if (resumenExistBox) {
        resumenExistBox.innerHTML = renderResumenExistentesLamdaHtml(ingSel);
      }

      const gramajesBox = document.getElementById('prop-gramajes-box');
      if (gramajesBox) {
        gramajesBox.innerHTML = renderOpcionesGramajePropuestaHtml(ingSel, GSTATE.propKilosSel);
      }

      const selUnidad = document.getElementById('prop-peso-unidad');
      if (selUnidad && selUnidad.value !== GSTATE.propUnidadPesoManual) {
        selUnidad.value = GSTATE.propUnidadPesoManual;
      }

      const inputPeso = document.getElementById('prop-peso-manual');
      if (inputPeso && document.activeElement !== inputPeso) {
        inputPeso.value = formatearValorInputPesoManual(GSTATE.propKilosSel, GSTATE.propUnidadPesoManual);
        inputPeso.placeholder = GSTATE.propUnidadPesoManual === 'kg' ? 'Ej: 0.35 o 2' : 'Ej: 350';
      }

      const confBox = document.getElementById('prop-confirmacion-reciente');
      if (confBox) {
        confBox.innerHTML = GSTATE.propConfirmacionReciente ? `
          <div style="padding:11px 13px; border-radius:11px; background:var(--ok-soft); border:1px solid rgba(31,111,74,0.35); color:var(--ok); font-size:0.82rem; font-weight:700; line-height:1.4;">
            ${esc(GSTATE.propConfirmacionReciente)}
          </div>
        ` : '';
      }

      const avisoBox = document.getElementById('prop-aviso-existente');
      if (avisoBox) {
        avisoBox.innerHTML = renderAvisoEstadoGramajeHtml(ingSel, GSTATE.propKilosSel);
      }

      sincronizarBotonEnvioPropuestaDom(ingSel, GSTATE.propKilosSel);
    }

    function alCambiarCategoriaPropuestaGestor(nuevaCat) {
      GSTATE.propCategoriaSel = nuevaCat;
      GSTATE.propFiltroTexto = '';
      GSTATE.propNombreEditadoManual = false;
      GSTATE.propConfirmacionReciente = '';
      const inputFiltro = document.getElementById('prop-filtro-ingrediente');
      if (inputFiltro) inputFiltro.value = '';

      const listaCat = obtenerIngredientesFiltradosGestor(nuevaCat, '');
      GSTATE.propIngredienteIdSel = listaCat[0] ? Number(listaCat[0].id) : 0;
      const ingSel = obtenerIngredienteSeleccionadoGestor();
      if (ingSel) {
        GSTATE.propKilosSel = elegirPrimerGramajeNuevoDisponible(ingSel);
        GSTATE.propUnidadPesoManual = Number(GSTATE.propKilosSel) >= 1 ? 'kg' : 'g';
        GSTATE.propIngredienteInicializadoId = Number(ingSel.id);
      }
      actualizarControlesPropuestaEnVivo();
    }

    function alFiltrarIngredientesPropuestaGestor(texto) {
      GSTATE.propFiltroTexto = texto;
      GSTATE.propNombreEditadoManual = false;
      GSTATE.propConfirmacionReciente = '';
      actualizarControlesPropuestaEnVivo();
    }

    function alCambiarIngredientePropuestaGestor(ingId) {
      GSTATE.propIngredienteIdSel = Number(ingId || 0);
      GSTATE.propNombreEditadoManual = false;
      GSTATE.propConfirmacionReciente = '';
      const ingSel = obtenerIngredienteSeleccionadoGestor();
      if (ingSel) {
        GSTATE.propKilosSel = elegirPrimerGramajeNuevoDisponible(ingSel);
        GSTATE.propUnidadPesoManual = Number(GSTATE.propKilosSel) >= 1 ? 'kg' : 'g';
        GSTATE.propIngredienteInicializadoId = Number(ingSel.id);
      }
      actualizarControlesPropuestaEnVivo();
    }

    function fijarGramajePropuestaGestor(kilos) {
      GSTATE.propConfirmacionReciente = '';
      GSTATE.propKilosSel = Number(kilos || 0.25);
      GSTATE.propUnidadPesoManual = Number(GSTATE.propKilosSel) >= 1 ? 'kg' : 'g';
      const selUnidad = document.getElementById('prop-peso-unidad');
      if (selUnidad) selUnidad.value = GSTATE.propUnidadPesoManual;
      const inputPeso = document.getElementById('prop-peso-manual');
      if (inputPeso) {
        inputPeso.value = formatearValorInputPesoManual(GSTATE.propKilosSel, GSTATE.propUnidadPesoManual);
        inputPeso.placeholder = GSTATE.propUnidadPesoManual === 'kg' ? 'Ej: 0.35 o 2' : 'Ej: 350';
      }
      actualizarControlesPropuestaEnVivo();
    }

    function alEscribirPesoManualGestor(texto) {
      GSTATE.propConfirmacionReciente = '';
      const unidad = document.getElementById('prop-peso-unidad')?.value || GSTATE.propUnidadPesoManual || 'g';
      const kilos = parsearKilosDesdeTextoManual(texto, unidad);
      const ingSel = obtenerIngredienteSeleccionadoGestor();

      if (kilos > 0) {
        GSTATE.propKilosSel = kilos;
        const gramajesBox = document.getElementById('prop-gramajes-box');
        if (gramajesBox) {
          gramajesBox.innerHTML = renderOpcionesGramajePropuestaHtml(ingSel, GSTATE.propKilosSel);
        }
        const avisoBox = document.getElementById('prop-aviso-existente');
        if (avisoBox) {
          avisoBox.innerHTML = renderAvisoEstadoGramajeHtml(ingSel, GSTATE.propKilosSel);
        }
        sincronizarBotonEnvioPropuestaDom(ingSel, GSTATE.propKilosSel);
      } else {
        const avisoBox = document.getElementById('prop-aviso-existente');
        if (avisoBox) avisoBox.innerHTML = '';
        sincronizarBotonEnvioPropuestaDom(ingSel, 0);
      }
    }

    function alSalirPesoManualGestor() {
      const inputPeso = document.getElementById('prop-peso-manual');
      if (!inputPeso) return;
      const unidad = document.getElementById('prop-peso-unidad')?.value || GSTATE.propUnidadPesoManual || 'g';
      const kilos = parsearKilosDesdeTextoManual(inputPeso.value, unidad);
      if (kilos > 0) {
        GSTATE.propKilosSel = kilos;
      }
      inputPeso.value = formatearValorInputPesoManual(GSTATE.propKilosSel, unidad);
      actualizarControlesPropuestaEnVivo();
    }

    function alCambiarUnidadPesoManualGestor(nuevaUnidad) {
      const unidadDestino = nuevaUnidad === 'kg' ? 'kg' : 'g';
      const inputPeso = document.getElementById('prop-peso-manual');
      if (inputPeso) {
        const kilosLeidos = parsearKilosDesdeTextoManual(inputPeso.value, GSTATE.propUnidadPesoManual);
        if (kilosLeidos > 0) {
          GSTATE.propKilosSel = kilosLeidos;
        }
      }
      GSTATE.propUnidadPesoManual = unidadDestino;
      if (inputPeso) {
        inputPeso.value = formatearValorInputPesoManual(GSTATE.propKilosSel, unidadDestino);
        inputPeso.placeholder = unidadDestino === 'kg' ? 'Ej: 0.35 o 2' : 'Ej: 350';
      }
      actualizarControlesPropuestaEnVivo();
    }

    function renderSeccionPropuestas() {
      const disponibles = GSTATE.ingredientesDisponibles || [];
      const categoriasUnicas = Array.from(new Set(disponibles.map(i => i.categoria_gestor)));
      if (categoriasUnicas.length > 0 && (!GSTATE.propCategoriaSel || !categoriasUnicas.includes(GSTATE.propCategoriaSel))) {
        GSTATE.propCategoriaSel = categoriasUnicas.includes('Granolas') ? 'Granolas' : categoriasUnicas[0];
      }
      const totalEnCat = disponibles.filter(i => i.categoria_gestor === GSTATE.propCategoriaSel);
      const filtrados = obtenerIngredientesFiltradosGestor(GSTATE.propCategoriaSel, GSTATE.propFiltroTexto);
      if (!filtrados.some(i => Number(i.id) === Number(GSTATE.propIngredienteIdSel))) {
        GSTATE.propIngredienteIdSel = filtrados[0] ? Number(filtrados[0].id) : 0;
      }
      const ingSel = obtenerIngredienteSeleccionadoGestor();
      if (ingSel && GSTATE.propIngredienteInicializadoId !== Number(ingSel.id)) {
        GSTATE.propKilosSel = elegirPrimerGramajeNuevoDisponible(ingSel);
        GSTATE.propUnidadPesoManual = Number(GSTATE.propKilosSel) >= 1 ? 'kg' : 'g';
        GSTATE.propIngredienteInicializadoId = Number(ingSel.id);
      }
      const nombreInicial = ingSel ? (ingSel.alias_vecino_sugerido || ingSel.nombre_claro) : '';
      const estInicial = evaluarEstadoGramajeParaGestor(ingSel, GSTATE.propKilosSel);
      const etPesoInicial = formatearPesoCortoGestor(GSTATE.propKilosSel);
      const btnHabilitado = estInicial.tipo === 'NUEVA_DISPONIBLE';
      const btnLabelInicial = btnHabilitado
        ? `Enviar Solicitud de Nueva Fracción (${etPesoInicial})`
        : estInicial.tipo === 'YA_EXISTE_LAMDA'
          ? `Medida ${etPesoInicial} ya existe en LAMDA`
          : estInicial.tipo === 'YA_SOLICITADA'
            ? `Medida ${etPesoInicial} ya solicitada`
            : `Medida ${etPesoInicial} ya cotizada`;

      return `
        <div class="propuestas-grid" style="display:grid; grid-template-columns: 1fr 1fr; gap:14px; align-items:start;">
          <div class="card">
            <h3 style="margin:0 0 6px 0; font-size:1rem;">Solicitar Nueva Fracción</h3>
            <p style="margin:0 0 14px 0; font-size:0.8rem; color:var(--muted);">
              Elegí el producto y una medida nueva que aún no exista. Cuando se cotice su Precio Base aparecerá en <strong>Mi Oferta y Márgenes</strong> para que definas tu ganancia y la publiques.
            </p>

            <div style="display:flex; flex-direction:column; gap:11px;">
              <div>
                <label style="display:block; font-size:0.78rem; font-weight:800; margin-bottom:4px;">1. Categoría</label>
                <select id="prop-categoria" class="input-sm" style="width:100%;" onchange="alCambiarCategoriaPropuestaGestor(this.value)">
                  ${categoriasUnicas.map(cat => {
                    const count = disponibles.filter(i => i.categoria_gestor === cat).length;
                    return `<option value="${esc(cat)}" ${cat === GSTATE.propCategoriaSel ? 'selected' : ''}>${esc(cat)} (${count})</option>`;
                  }).join('')}
                </select>
              </div>

              <div>
                <label style="display:block; font-size:0.78rem; font-weight:800; margin-bottom:4px;">2. Producto / Variedad disponible</label>
                <div id="prop-filtro-wrap" style="display:${totalEnCat.length > 8 ? 'block' : 'none'}; margin-bottom:6px;">
                  <input type="text" id="prop-filtro-ingrediente" class="input-sm" style="width:100%; font-size:0.82rem;"
                    value="${esc(GSTATE.propFiltroTexto)}"
                    oninput="alFiltrarIngredientesPropuestaGestor(this.value)"
                    placeholder="Filtrar dentro de esta categoría..." />
                </div>
                <select id="prop-ingrediente" class="input-sm" style="width:100%;" onchange="alCambiarIngredientePropuestaGestor(this.value)">
                  ${filtrados.map(i => `
                    <option value="${i.id}" ${Number(i.id) === Number(GSTATE.propIngredienteIdSel) ? 'selected' : ''}>
                      ${esc(i.nombre_claro)}
                    </option>
                  `).join('')}
                </select>
              </div>

              <div>
                <label style="display:block; font-size:0.78rem; font-weight:800; margin-bottom:4px;">3. Presentación / Gramaje</label>
                <div id="prop-resumen-existentes">
                  ${renderResumenExistentesLamdaHtml(ingSel)}
                </div>
                <div id="prop-gramajes-box" style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:7px;">
                  ${renderOpcionesGramajePropuestaHtml(ingSel, GSTATE.propKilosSel)}
                </div>
                <div style="display:grid; grid-template-columns: 1.25fr 0.95fr; gap:10px;">
                  <div>
                    <label style="display:block; font-size:0.72rem; color:var(--muted); font-weight:700; margin-bottom:2px;">Otro peso manual</label>
                    <div style="display:flex; gap:5px; align-items:stretch;">
                      <input type="text" inputmode="decimal" autocomplete="off" id="prop-peso-manual" class="input-sm"
                        style="flex:1; min-width:0;"
                        value="${esc(formatearValorInputPesoManual(GSTATE.propKilosSel || 0.25, GSTATE.propUnidadPesoManual))}"
                        placeholder="${GSTATE.propUnidadPesoManual === 'kg' ? 'Ej: 0.35 o 2' : 'Ej: 350'}"
                        oninput="alEscribirPesoManualGestor(this.value)"
                        onblur="alSalirPesoManualGestor()" />
                      <select id="prop-peso-unidad" class="input-sm"
                        style="width:74px; padding-left:7px; padding-right:4px; font-weight:800; background:var(--surface-warm);"
                        onchange="alCambiarUnidadPesoManualGestor(this.value)">
                        <option value="g" ${GSTATE.propUnidadPesoManual === 'g' ? 'selected' : ''}>g</option>
                        <option value="kg" ${GSTATE.propUnidadPesoManual === 'kg' ? 'selected' : ''}>kg</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label style="display:block; font-size:0.72rem; color:var(--muted); font-weight:700; margin-bottom:2px;">Precio estimado ($ opc.)</label>
                    <input type="text" inputmode="numeric" id="prop-target" class="input-sm" style="width:100%;" placeholder="Opcional" />
                  </div>
                </div>
              </div>

              <div>
                <label style="display:block; font-size:0.78rem; font-weight:800; margin-bottom:3px;">4. Nombre sugerido para tu tienda</label>
                <input type="text" id="prop-nombre" class="input-sm" style="width:100%;"
                  value="${esc(nombreInicial)}"
                  oninput="GSTATE.propNombreEditadoManual = true"
                  placeholder="Ej: Granola de Sol" />
                <div style="font-size:0.71rem; color:var(--muted); margin-top:3px;">
                  Se completa solo al elegir el producto; podés retocar cómo te gustaría mostrarlo a tus vecinos.
                </div>
              </div>

              <div>
                <label style="display:block; font-size:0.78rem; font-weight:800; margin-bottom:4px;">Comentario (opcional)</label>
                <input type="text" id="prop-comentario" class="input-sm" style="width:100%;" placeholder="Ej: Bolsita individual para merienda" />
              </div>

              <div id="prop-confirmacion-reciente">
                ${GSTATE.propConfirmacionReciente ? `
                  <div style="padding:11px 13px; border-radius:11px; background:var(--ok-soft); border:1px solid rgba(31,111,74,0.35); color:var(--ok); font-size:0.82rem; font-weight:700; line-height:1.4;">
                    ${esc(GSTATE.propConfirmacionReciente)}
                  </div>
                ` : ''}
              </div>

              <div id="prop-aviso-existente">
                ${renderAvisoEstadoGramajeHtml(ingSel, GSTATE.propKilosSel)}
              </div>

              <button type="button" id="btn-enviar-propuesta-gestor" class="btn-primary"
                ${btnHabilitado ? '' : 'disabled'}
                style="opacity:${btnHabilitado ? '1' : '0.5'};"
                onclick="enviarNuevaPropuestaGestor()">
                ${esc(btnLabelInicial)}
              </button>
            </div>
          </div>

          <div class="card">
            <h3 style="margin:0 0 12px 0; font-size:1rem;">Mis Solicitudes (${GSTATE.propuestas.length})</h3>
            <div style="display:flex; flex-direction:column; gap:10px;">
              ${GSTATE.propuestas.length === 0 ? `
                <div style="padding:18px; border-radius:12px; border:1px dashed var(--border); color:var(--muted); font-size:0.84rem; text-align:center;">
                  Todavía no enviaste solicitudes de fracciones.
                </div>
              ` : GSTATE.propuestas.map(p => {
                const gramosTxt = formatearPesoCortoGestor(p.kilos_sugeridos || 0.25);
                const esHabilitacion = Boolean(p.articulo_bunker_sugerido_codigo);
                const esAprobada = p.estado === 'APROBADA';
                const esDescartada = p.estado === 'DESCARTADA';
                const badgeBg = esAprobada ? 'var(--ok-soft)' : esDescartada ? '#f3f4f6' : 'var(--warn-soft)';

                return `

                      </span>
                    </div>
                    <div style="font-size:0.78rem; color:var(--muted); margin-top:4px;">
                      ${esc(p.categoria_sugerida || 'Frutos Secos')} · <strong>${esc(gramosTxt)}</strong>
                      · ${esHabilitacion ? 'Presentación existente LAMDA' : 'Nueva fracción'}
                      ${p.precio_objetivo_vecino ? ` · Est: ${fmt(p.precio_objetivo_vecino)}` : ''}
                    </div>
                    ${p.comentario_gestor ? `<div style="margin-top:4px; font-size:0.76rem; color:var(--muted);">${esc(p.comentario_gestor)}</div>` : ''}
                    ${esDescartada && p.respuesta_lamda ? `<div style="margin-top:5px; padding:6px 8px; border-radius:8px; background:#f8f7f5; font-size:0.75rem; color:var(--muted);">${esc(p.respuesta_lamda)}</div>` : ''}
                    <div style="margin-top:8px; display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap;">
                      ${esAprobada ? `
                        <button type="button" class="btn-soft" style="font-size:0.75rem; padding:5px 10px;" onclick="abrirSeccionGestor('ofertas')">
                          Ver en Mi Oferta y Márgenes →
                        </button>
                      ` : esDescartada ? `
                        <button type="button" class="btn-soft" style="font-size:0.74rem; padding:4px 10px;" onclick="anularPropuestaGestor(${Number(p.id)}, true)">
                          Quitar del listado
                        </button>
                      ` : `
                        <button type="button" class="btn-soft"
                          style="font-size:0.75rem; padding:5px 10px; border-color:rgba(185,28,28,0.35); color:#b91c1c; background:#fff5f5;"

                          ✕ Anular solicitud
                        </button>
                      `}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    async function enviarNuevaPropuestaGestor(opciones = {}) {
      const solicitarHabilitacionExistente = Boolean(opciones && opciones.solicitarHabilitacionExistente === true);
      const ingSel = obtenerIngredienteSeleccionadoGestor();
      if (!ingSel) {
        mostrarAvisoPantallaGestor('Seleccioná primero un producto disponible de la lista.', 'error');
        return;
      }
      const inputManualEl = document.getElementById('prop-peso-manual');
      const unidadManual = document.getElementById('prop-peso-unidad')?.value || GSTATE.propUnidadPesoManual || 'g';
      const kilos = inputManualEl && String(inputManualEl.value).trim() !== ''
        ? parsearKilosDesdeTextoManual(inputManualEl.value, unidadManual)
        : Number(GSTATE.propKilosSel || 0);
      if (!kilos || kilos <= 0) {
        mostrarAvisoPantallaGestor('Ingresá un peso válido mayor a 0 (por ejemplo 350 en g o 0.5 en kg).', 'error');
        return;
      }
      GSTATE.propKilosSel = kilos;

      const est = evaluarEstadoGramajeParaGestor(ingSel, kilos);
      if (est.tipo === 'EN_OFERTA_NODO' || est.tipo === 'EN_CATALOGO_NODOS') {
        mostrarAvisoPantallaGestor('Esta presentación ya está cotizada; podés verla o sumarla desde Mi Oferta y Márgenes.', 'error');
        return;
      }
      if (est.tipo === 'YA_EXISTE_LAMDA' && !solicitarHabilitacionExistente) {
        mostrarAvisoPantallaGestor('LAMDA ya produce esta presentación. Elegí otro gramaje nuevo o usá la opción para pedir que la habiliten en tu Nodo.', 'error');
        return;
      }
      if (est.tipo === 'YA_SOLICITADA' || (est.tipo === 'YA_EXISTE_LAMDA' && est.propuestaPendiente)) {
        mostrarAvisoPantallaGestor('Esta presentación ya fue solicitada y se encuentra en cotización.', 'error');
        return;
      }

      const nombreBase = (document.getElementById('prop-nombre')?.value || ingSel.alias_vecino_sugerido || ingSel.nombre_claro).trim();
      const etiquetaPeso = formatearPesoCortoGestor(kilos).replace(/\s+/g, '');
      const nombreConPeso = /\bx\s*\d+/i.test(nombreBase) ? nombreBase : `${nombreBase} x ${etiquetaPeso}`;

      const btn = document.getElementById('btn-enviar-propuesta-gestor');
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Enviando solicitud...';
      }

      const comentarioInput = (document.getElementById('prop-comentario')?.value || '').trim();
      const comentarioFinal = solicitarHabilitacionExistente && !comentarioInput
        ? 'Solicitud para habilitar presentación estándar de LAMDA en mi Nodo.'
        : comentarioInput;

      const payload = {
        nodo_solicitante_id: GSTATE.nodo.id,
        ingrediente_sugerido_id: Number(ingSel.id),
        flujo_sugerido: Number(ingSel.flujo || 2),
        categoria_sugerida: ingSel.categoria_gestor || document.getElementById('prop-categoria')?.value || 'Frutos Secos',
        nombre_sugerido: nombreConPeso,
        kilos_sugeridos: kilos,
        precio_objetivo_vecino: Number(document.getElementById('prop-target')?.value || 0),
        comentario_gestor: comentarioFinal,
        solicitar_habilitacion_existente: solicitarHabilitacionExistente
      };

      try {
        const resp = await fetchGestor('/api/produccion/nodos/propuestas', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo enviar la solicitud: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          sincronizarBotonEnvioPropuestaDom(ingSel, kilos);
          return;
        }

        const codProp = data.propuesta?.codigo_propuesta || '';
        GSTATE.propNombreEditadoManual = false;
        GSTATE.propConfirmacionReciente = solicitarHabilitacionExistente
          ? `✅ Solicitud registrada (${codProp}): pediste habilitar ${nombreConPeso} en tu Nodo.`
          : `✅ ¡Solicitud enviada con éxito! ${nombreConPeso} (${codProp}) ingresó a cotización y ya figura en Mis Solicitudes.`;
        await cargarPanelGestor({ avanzarGramajeTrasEnvio: true });
      } catch (err) {
        mostrarAvisoPantallaGestor('Error de comunicación al enviar la solicitud. Verificá tu conexión e intentá de nuevo.', 'error');
        sincronizarBotonEnvioPropuestaDom(ingSel, kilos);
      }
    }

    async function ejecutarAnulacionPropuestaGestor(propuestaId, esLimpiezaDescartada = false) {
      const prop = (GSTATE.propuestas || []).find(x => Number(x.id) === Number(propuestaId));
      const etiquetaNombre = prop ? prop.nombre_sugerido : 'esta presentación';
      const btnConfirm = document.getElementById('btn-confirmar-anular-propuesta');
      const errModalBox = document.getElementById('modal-anular-error-box');

      if (btnConfirm) {
        btnConfirm.disabled = true;
        btnConfirm.textContent = 'Anulando...';
      }
      if (errModalBox) errModalBox.style.display = 'none';

      try {
        const resp = await fetchGestor(`/api/produccion/nodos/propuestas/${Number(propuestaId)}/anular`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nodo_id: GSTATE.nodo?.id || null,
            nodo_slug: GSTATE.slug || ''
          })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          const msgErr = data.error || `Error HTTP ${resp.status}`;
          if (errModalBox) {
            errModalBox.textContent = '⚠️ No se pudo anular: ' + msgErr;
            errModalBox.style.display = 'block';
          }
          mostrarAvisoPantallaGestor('No se pudo anular la solicitud: ' + msgErr, 'error');
          if (btnConfirm) {
            btnConfirm.disabled = false;
            btnConfirm.textContent = 'Confirmar anulación';
          }
          return;
        }

        cerrarModalReciboGestor();
        if (!esLimpiezaDescartada) {
          const codTxt = prop?.codigo_propuesta ? ` (${prop.codigo_propuesta})` : '';
          const msgExito = `✓ Solicitud${codTxt} de ${etiquetaNombre} anulada. Esa medida volvió a quedar libre.`;
          GSTATE.propConfirmacionReciente = msgExito;
          mostrarAvisoPantallaGestor(msgExito, 'ok');
        } else {
          GSTATE.propConfirmacionReciente = '';
        }
        await cargarPanelGestor();
      } catch (err) {
        const msgRed = 'Falla de comunicación con el servidor al intentar anular. Verificá tu conexión e intentá nuevamente.';
        if (errModalBox) {
          errModalBox.textContent = '⚠️ ' + msgRed;
          errModalBox.style.display = 'block';
        }
        mostrarAvisoPantallaGestor(msgRed, 'error');
        if (btnConfirm) {
          btnConfirm.disabled = false;
          btnConfirm.textContent = 'Confirmar anulación';
        }
      }
    }

    function anularPropuestaGestor(propuestaId, esLimpiezaDescartada = false) {
      if (!GSTATE.nodo || !propuestaId) return;
      if (esLimpiezaDescartada) {
        ejecutarAnulacionPropuestaGestor(propuestaId, true);
        return;
      }

      const prop = (GSTATE.propuestas || []).find(x => Number(x.id) === Number(propuestaId));
      const etiquetaNombre = prop ? prop.nombre_sugerido : 'esta presentación';
      const codProp = prop?.codigo_propuesta || '';

      const modal = document.getElementById('modal-recibo-gestor');
      const body = document.getElementById('modal-recibo-gestor-body');
      if (!modal || !body) {
        ejecutarAnulacionPropuestaGestor(propuestaId, false);
        return;
      }

      body.innerHTML = `
        <div style="padding:16px 20px; background:var(--brand-soft); border-bottom:1px solid var(--brand-border); color:var(--text);">
          <div style="font-size:0.72rem; font-weight:800; text-transform:uppercase; color:var(--brand-dark);">Confirmar baja de solicitud</div>
          <div style="font-size:1.02rem; font-weight:900; margin-top:2px;">Anular ${esc(etiquetaNombre)}</div>
          ${codProp ? `<div style="font-size:0.76rem; color:var(--muted); margin-top:2px;">Código ${esc(codProp)}</div>` : ''}
        </div>
        <div style="padding:18px 20px; background:#fff; color:var(--text); font-size:0.86rem; line-height:1.45;">
          <p style="margin:0 0 12px 0;">
            Se dará de baja esta solicitud pendiente de cotización y <strong>ese gramaje volverá a quedar libre</strong> por si querés volver a pedirlo.
          </p>
          <div id="modal-anular-error-box" style="display:none; margin-bottom:12px; padding:10px 12px; border-radius:10px; background:#fef2f2; border:1px solid #ef4444; color:#991b1b; font-size:0.8rem; font-weight:700;"></div>
          <div style="display:flex; gap:8px;">
            <button type="button" id="btn-confirmar-anular-propuesta"
              onclick="ejecutarAnulacionPropuestaGestor(${Number(propuestaId)}, false)"
              class="btn-primary" style="flex:1; background:#b91c1c;">
              Confirmar anulación
            </button>
            <button type="button" onclick="cerrarModalReciboGestor()" class="btn-soft" style="padding:11px 16px;">
              Cancelar
            </button>
          </div>
        </div>
      `;
      modal.style.display = 'flex';
    }

              </label>

    function leerVentanasDesdeDom() {
      const rows = Array.from(document.querySelectorAll('.ventana-item-row'));
      return rows.map(r => ({
        dia_entrega: r.querySelector('.v-dia-entrega').value,
        cierre_dia: r.querySelector('.v-cierre-dia').value,
        cierre_hora: r.querySelector('.v-cierre-hora').value || '14:00',
        ventana_retiro: r.querySelector('.v-ventana-retiro').value || '17:00 a 20:00 hs'
      }));
    }

    function agregarVentanaRow() {
      const actual = leerVentanasDesdeDom();
      actual.push({ dia_entrega: 'Sábado', cierre_dia: 'Viernes', cierre_hora: '14:00', ventana_retiro: '10:00 a 13:30 hs' });
      GSTATE.nodo.config_ventanas_corte = actual;
      renderVistaGestor();
    }

    function eliminarVentanaRow(idx) {
      const actual = leerVentanasDesdeDom();
      if (actual.length <= 1) {
        mostrarAvisoPantallaGestor('Debe quedar al menos un día de entrega configurado.', 'error');
        return;
      }
      actual.splice(idx, 1);
      GSTATE.nodo.config_ventanas_corte = actual;
      renderVistaGestor();
    }

    function actualizarEstadoCargoEnvioGestor() {
      const chkReparto = document.getElementById('cfg-permitir-reparto');
      const inputCargo = document.getElementById('cfg-cargo-envio');
      const wrapCargo = document.getElementById('cfg-cargo-envio-wrap');
      const activo = Boolean(chkReparto?.checked);
      if (inputCargo) inputCargo.disabled = !activo;
      if (wrapCargo) wrapCargo.style.opacity = activo ? '1' : '0.48';
    }

    async function guardarConfigLogisticaGestor() {
      const permitirRetiro = Boolean(document.getElementById('cfg-permitir-retiro')?.checked);
      const permitirReparto = Boolean(document.getElementById('cfg-permitir-reparto')?.checked);
      const permitirEncomienda = Boolean(document.getElementById('cfg-permitir-encomienda')?.checked);
      if (!permitirRetiro && !permitirReparto) {
        alert('Activá al menos Retiro en el Nodo o Reparto propio a domicilio para que tus vecinos puedan completar pedidos.');
        return;
      }
      const payload = {
        config_ventanas_corte: leerVentanasDesdeDom(),
        direccion_retiro: document.getElementById('cfg-direccion-retiro').value.trim(),
        cargo_envio_barrial: Number(document.getElementById('cfg-cargo-envio').value || 0),
        permitir_retiro_nodo: permitirRetiro,
        permitir_reparto_propio: permitirReparto,
        permitir_encomienda: permitirEncomienda,
        permitir_envio_barrial: permitirReparto,
        mostrar_ingredientes_tienda: Boolean(document.getElementById('cfg-mostrar-ingredientes')?.checked ?? true)
      };

      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/config-logistica`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo guardar la configuración: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          return;
        }
        mostrarAvisoPantallaGestor('✅ Días de entrega, corte y envío barrial actualizados.', 'ok');
        await cargarPanelGestor();
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de comunicación al guardar la configuración logística.', 'error');
      }
    }

    function _obtenerMetaHitoGestor(p) {
      const esAnulado = String(p.estado_operativo || '').toUpperCase() === 'ANULADO';
      if (esAnulado) {
        return { texto: '🚫 Anulado', bg: '#fee2e2', fg: '#991b1b', bd: '#fecaca', pasoTxt: 'Anulado' };
      }
      const esEnvio = String(p.modalidad_entrega || '').toUpperCase() === 'ENVIO_BARRIAL';
      const totalPasos = esEnvio ? 6 : 5;
      const hito = Number(p.hito_tracking_actual || 1);
      const marca = GSTATE.nodo?.nombre_marca || 'el Nodo';

      if (Boolean(p.ausente_pasa_retirar) && hito < 6) {
        return { texto: `🏡 No estaba · Pasa a retirar por ${marca}`, bg: '#fef3c7', fg: '#92400e', bd: '#fcd34d' };
      }

      if (hito <= 1) {
        return { texto: `📝 Confirmado (1/${totalPasos})`, bg: '#f1f5f9', fg: '#334155', bd: '#cbd5e1' };
      }
      if (hito === 2) {
        return { texto: `🥣 En preparación (2/${totalPasos})`, bg: '#fef3c7', fg: '#92400e', bd: '#fde68a' };
      }
      if (hito === 3) {
        return { texto: `📦 Controlado y embolsado (3/${totalPasos})`, bg: '#e0f2fe', fg: '#0369a1', bd: '#bae6fd' };
      }
      if (hito === 4) {
        return esEnvio
          ? { texto: `🏡 Ya en ${marca} · Listo p/ reparto (4/6)`, bg: 'var(--brand-soft)', fg: 'var(--brand-dark)', bd: 'var(--brand-border)' }
          : { texto: `🎉 Listo p/ retirar en ${marca} (4/5)`, bg: '#dcfce7', fg: '#166534', bd: '#86efac' };
      }
      if (hito === 5) {
        return { texto: `🛵 En camino al vecino (5/6)`, bg: '#ede9fe', fg: '#5b21b6', bd: '#c4b5fd' };
      }
      return { texto: `✅ Entregado (${totalPasos}/${totalPasos})`, bg: '#dcfce7', fg: '#14532d', bd: '#86efac' };
    }

    function renderSeccionPedidos() {
      const todos = (GSTATE.pedidos || []).filter(p => String(p.estado_operativo || '').toUpperCase() !== 'ANULADO');
      const anulados = (GSTATE.pedidos || []).filter(p => String(p.estado_operativo || '').toUpperCase() === 'ANULADO');

      // Detectar lotes controlados en Verificación (Hito 3) pendientes de recepción de 1 toque en el Nodo
      const mapaLotes = new Map();
      for (const p of todos) {
        const cid = Number(p.lote_canasto_id || 0);
        if (!cid) continue;
        if (!mapaLotes.has(cid)) {
          mapaLotes.set(cid, {
            canasto_id: cid,
            codigo_canasto: p.lote_codigo_canasto || `Lote #${cid}`,
            debito_registrado: Boolean(p.lote_debito_registrado),
            estado_canasto: p.lote_estado_canasto || '',
            pedidos: []
          });
        }
        mapaLotes.get(cid).pedidos.push(p);
      }

      const lotesListosParaRecibir = [];
      const lotesEnPreparacion = [];
      for (const lote of mapaLotes.values()) {
        if (lote.debito_registrado || lote.estado_canasto === 'ENTREGADO_AL_GESTOR') continue;
        const todosControlados = lote.pedidos.length > 0 && lote.pedidos.every(x => Number(x.hito_tracking_actual || 1) >= 3);
        const algunoSinRecibir = lote.pedidos.some(x => Number(x.hito_tracking_actual || 1) < 4);
        if (todosControlados && algunoSinRecibir) {
          lotesListosParaRecibir.push(lote);
        } else if (algunoSinRecibir) {
          lotesEnPreparacion.push(lote);
        }
      }

      const cantPrep = todos.filter(p => Number(p.hito_tracking_actual || 1) <= 3).length;
      const cantEnNodo = todos.filter(p => Number(p.hito_tracking_actual || 1) === 4).length;
      const cantReparto = todos.filter(p => Number(p.hito_tracking_actual || 1) === 5).length;
      const cantEntregados = todos.filter(p => Number(p.hito_tracking_actual || 1) >= 6).length;

      const pagados = todos.filter(p => Boolean(p.pago_confirmado));
      const pendientes = todos.filter(p => !p.pago_confirmado);

      const basePorCobro = GSTATE.filtroPagoPedidos === 'PAGADOS'
        ? pagados
        : GSTATE.filtroPagoPedidos === 'PENDIENTES'
          ? pendientes
          : (GSTATE.filtroOperativoPedidos === 'ANULADOS' ? anulados : todos);

      const listaFiltrada = basePorCobro.filter(p => {
        const fOp = GSTATE.filtroOperativoPedidos || 'TODOS';
        if (fOp === 'TODOS' || fOp === 'ANULADOS') return true;
        const h = Number(p.hito_tracking_actual || 1);
        if (fOp === 'PREP') return h <= 3;
        if (fOp === 'EN_NODO') return h === 4;
        if (fOp === 'REPARTO') return h === 5;
        if (fOp === 'ENTREGADOS') return h >= 6;
        return true;
      });

      const bannersRecepcionHtml = lotesListosParaRecibir.map(l => `
        <div class="card" style="background:linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 100%); border:1.5px solid #4ade80; margin-bottom:14px;">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;">
            <div style="flex:1; min-width:220px;">
              <div style="font-size:0.86rem; font-weight:900; color:#15803d; text-transform:uppercase; letter-spacing:0.03em;">
                📦 Lote controlado · Listo para recibir en ${esc(GSTATE.nodo?.nombre_marca || 'tu Nodo')}
              </div>
              <div style="font-size:1.15rem; font-weight:900; color:#14532d; margin-top:4px;">
                ${esc(l.codigo_canasto)} (${l.pedidos.length} ${l.pedidos.length === 1 ? 'bolsa de vecino' : 'bolsas de vecinos'})
              </div>
              <div style="font-size:0.94rem; color:#166534; font-weight:600; margin-top:4px; line-height:1.4;">
                Al confirmar la recepción, los vecinos verán en vivo que su pedido ya llegó al barrio y podrás marcar salidas a reparto o entregas en 1 toque.
              </div>
            </div>
            <button type="button" id="btn-recibir-lote-${l.canasto_id}" onclick="confirmarRecepcionLoteGestor(${l.canasto_id})"
              style="min-height:52px; padding:13px 20px; border-radius:12px; border:none; background:#16a34a; color:#ffffff; font-family:inherit; font-weight:900; font-size:0.98rem; cursor:pointer; box-shadow:0 6px 16px rgba(22,163,74,0.24);">
              📥 Confirmar que recibí el lote (${l.pedidos.length})
            </button>
          </div>
        </div>
      `).join('');

      const bannersPrepHtml = lotesEnPreparacion.map(l => {
        const listos = l.pedidos.filter(x => Number(x.hito_tracking_actual || 1) >= 3).length;
        return `
          <div style="background:#fffbeb; border:1.5px solid #fcd34d; border-radius:12px; padding:12px 15px; margin-bottom:12px; font-size:0.94rem; color:#92400e; font-weight:700; line-height:1.4;">
            🥣 <strong>${esc(l.codigo_canasto)} en preparación:</strong> ${listos} de ${l.pedidos.length} bolsas controladas y embolsadas. Cuando el lote esté completo vas a poder confirmar su recepción acá.
          </div>
        `;
      }).join('');

      return `

          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">

              style="min-height:48px; font-size:0.92rem; padding:10px 14px; ${GSTATE.filtroOperativoPedidos === 'EN_NODO' ? 'background:var(--brand); color:#fff; border-color:var(--brand);' : ''}">

            </button>
            <button type="button" class="btn-soft" onclick="filtrarEstadoOperativoPedidosGestor('REPARTO')"
              style="min-height:48px; font-size:0.92rem; padding:10px 14px; ${GSTATE.filtroOperativoPedidos === 'REPARTO' ? 'background:var(--brand); color:#fff; border-color:var(--brand);' : ''}">

            </button>
            <button type="button" class="btn-soft" onclick="filtrarEstadoOperativoPedidosGestor('ENTREGADOS')"

            </button>

            <button type="button" class="btn-soft" onclick="filtrarEstadoPagoPedidosGestor('TODOS')"
              style="min-height:46px; font-size:0.9rem; padding:9px 13px; ${GSTATE.filtroPagoPedidos === 'TODOS' ? 'background:#25130b; color:#fff; border-color:#25130b;' : ''}">
              Cobros: Todos
            </button>
            <button type="button" class="btn-soft" onclick="filtrarEstadoPagoPedidosGestor('PENDIENTES')"
              style="min-height:46px; font-size:0.9rem; padding:9px 13px; ${GSTATE.filtroPagoPedidos === 'PENDIENTES' ? 'background:#25130b; color:#fff; border-color:#25130b;' : ''}">
              💵 Pendientes de cobro (${pendientes.length})
            </button>
            <button type="button" class="btn-soft" onclick="filtrarEstadoPagoPedidosGestor('PAGADOS')"
              style="min-height:46px; font-size:0.9rem; padding:9px 13px; ${GSTATE.filtroPagoPedidos === 'PAGADOS' ? 'background:#25130b; color:#fff; border-color:#25130b;' : ''}">
              ✅ Pagados (${pagados.length})
            </button>
          </div>

          ${listaFiltrada.length === 0 ? `
            <div style="text-align:center; padding:26px; color:var(--muted); font-size:1rem; font-weight:700; background:#fffdfb; border-radius:12px; border:1px dashed var(--border);">
              No hay pedidos registrados en este filtro.
            </div>
          ` : ''}

          <div style="display:flex; flex-direction:column; gap:14px;">
            ${listaFiltrada.map(p => {
              const pagado = Boolean(p.pago_confirmado);
              const esEfvo = String(p.medio_pago || '').toUpperCase() === 'EFECTIVO' || String(p.estado_pago || '').toUpperCase() === 'COBRADO_EFECTIVO_GESTOR';
              const esEnvio = String(p.modalidad_entrega || '').toUpperCase() === 'ENVIO_BARRIAL';
              const hito = Number(p.hito_tracking_actual || 1);
              const metaHito = _obtenerMetaHitoGestor(p);
              const urlSeg = obtenerUrlSeguimientoPedidoGestor(p);
              const puedeSalirReparto = esEnvio && hito === 4;
              const puedeMarcarEntregado = hito === 4 || hito === 5;

              return `
                <div style="border:1.5px solid ${hito >= 6 ? 'rgba(22,163,74,0.45)' : (pagado ? 'rgba(47,111,78,0.4)' : 'var(--border)')}; border-radius:16px; padding:16px; background:#fffdfb;">
                  <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px; margin-bottom:10px;">
                    <div style="flex:1; min-width:210px;">
                      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                        <span style="font-weight:900; font-size:1.1rem; color:var(--text);">#${esc(p.codigo_pedido)} · ${esc(p.vecino_nombre)}</span>
                        <span style="display:inline-block; padding:5px 12px; border-radius:999px; font-size:0.86rem; font-weight:800; background:${metaHito.bg}; color:${metaHito.fg}; border:1px solid ${metaHito.bd};">
                          ${esc(metaHito.texto)}
                        </span>
                      </div>
                      <div style="font-size:0.95rem; font-weight:700; color:var(--text); margin-top:6px; line-height:1.38;">
                        ${esc(p.fecha_entrega_label)} · ${esEnvio ? `🛵 Envío: ${esc(p.direccion_entrega)}${p.entrecalles_referencia ? ` (${esc(p.entrecalles_referencia)})` : ''}` : '🏠 Retira en Nodo'}
                      </div>
                    </div>
                    <div style="text-align:right;">

                  ${(puedeSalirReparto || puedeMarcarEntregado) ? `
                    <div style="display:flex; gap:10px; flex-wrap:wrap; padding:10px; margin-bottom:12px; border-radius:12px; background:var(--surface-warm); border:1.5px solid var(--border);">

                      ${puedeMarcarEntregado ? `
                        <button type="button" onclick="tocarBotonEntregadoGestor(${p.id})"
                          style="flex:1; min-width:180px; min-height:52px; padding:12px 16px; border-radius:11px; border:none; background:#16a34a; color:#ffffff; font-family:inherit; font-weight:900; font-size:0.98rem; cursor:pointer;">
                          ${pagado ? '✅ Marcar Entregado' : `✅ Entregado${esEfvo ? ' / Cobrar' : ''}`}
                        </button>
                      ` : ''}
                    </div>
                  ` : ''}

                  <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; border-top:1px solid var(--border); padding-top:12px;">
                    <span style="font-size:0.94rem; font-weight:900; color:var(--ok);">Tu ganancia: +${fmt(p.ganancia_total_gestor)}</span>
                    <div style="display:flex; gap:8px; flex-wrap:wrap;">
                      ${!pagado ? `
                        <button type="button" class="btn-primary" style="min-height:48px; padding:10px 15px; font-size:0.92rem;" onclick="cobrarEnEfectivoYEmitirReciboGestor(${p.id})">
                          💵 Cobrar Efectivo
                        </button>
                      ` : `
                        <button type="button" class="btn-soft" style="min-height:48px; font-size:0.9rem; padding:10px 14px;" onclick="abrirModalReciboVecinoGestor(${p.id})">
                          🧾 Recibo Digital
                        </button>
                      `}
                      ${urlSeg ? `
                        <a href="${esc(urlSeg)}" target="_blank" rel="noopener" class="btn-soft" style="min-height:48px; font-size:0.9rem; padding:10px 14px; text-decoration:none;">
                          📍 Seguimiento
                        </a>
                      ` : ''}
                      <button type="button" class="btn-soft" style="min-height:48px; font-size:0.9rem; padding:10px 14px;" onclick="enviarWhatsAppVecinoPedidoPrueba(${p.id})">
                        📲 Detalle WA
                      </button>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    async function confirmarRecepcionLoteGestor(canastoId) {
      if (!GSTATE.nodo?.id || !canastoId) return;
      const btn = document.getElementById(`btn-recibir-lote-${canastoId}`);
      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Registrando recepción...';
      }
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/lotes/${canastoId}/confirmar-recepcion`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ actor: GSTATE.nodo.gestor_nombre || 'Gestor del Nodo' })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo confirmar la recepción del lote: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          if (btn) {
            btn.disabled = false;
            btn.textContent = '📥 Confirmar que recibí el lote';
          }
          return;
        }
        mostrarAvisoPantallaGestor(`✅ ¡Lote ${data.codigo_canasto || ''} recibido en ${GSTATE.nodo.nombre_marca}! Tus vecinos ya ven sus bolsas disponibles en vivo.`, 'ok');
        await cargarPanelGestor();
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de comunicación al confirmar la recepción del lote.', 'error');
        if (btn) {
          btn.disabled = false;
          btn.textContent = '📥 Confirmar que recibí el lote';
        }
      }
    }

      if (!p || !GSTATE.nodo) return;
      if (p.pago_confirmado) {
        avanzarEstadoEntregaGestor(p.id, 'ENTREGADO', false);
        return;
      }

      // Modal ágil de 1 toque que unifica Entrega + Cobro en Efectivo + Recibo Digital
      const modal = document.getElementById('modal-recibo-gestor');
      const body = document.getElementById('modal-recibo-gestor-body');
      if (!modal || !body) return;

      body.innerHTML = `
        <div style="background:var(--brand); color:#ffffff; padding:16px 18px; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-size:0.72rem; text-transform:uppercase; font-weight:800; opacity:0.9;">Confirmar Entrega en 1 Toque</div>
            <div style="font-size:1.1rem; font-weight:900; margin-top:2px;">Pedido #${esc(p.codigo_pedido)} · ${esc(p.vecino_nombre)}</div>
          </div>
          <button type="button" onclick="cerrarModalReciboGestor()" style="background:rgba(0,0,0,0.18); border:none; color:#fff; width:32px; height:32px; border-radius:999px; font-weight:900; cursor:pointer;">✕</button>
        </div>
        <div style="padding:18px; color:var(--text);">
          <div style="background:var(--surface-warm); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:14px; font-size:0.86rem;">
            <div><strong>Importe del pedido:</strong> <span style="font-size:1.05rem; font-weight:900; color:var(--brand-dark);">${fmt(p.total_vecino)}</span></div>
            <div style="font-size:0.79rem; color:var(--muted); margin-top:3px;">
              Medio elegido al pedir: <strong>${p.medio_pago === 'EFECTIVO' ? '💵 Efectivo al recibir' : '🏦 Transferencia bancaria'}</strong> (aún pendiente de acreditar)
            </div>
          </div>
          <div style="display:flex; flex-direction:column; gap:10px;">
            <button type="button" onclick="cerrarModalReciboGestor(); avanzarEstadoEntregaGestor(${p.id}, 'ENTREGADO', true);"
              style="width:100%; padding:13px 14px; border-radius:12px; border:none; background:#16a34a; color:#ffffff; font-family:inherit; font-weight:900; font-size:0.9rem; cursor:pointer; text-align:center;">
              💵 Entregado + Cobré ${fmt(p.total_vecino)} en Efectivo
            </button>
            <button type="button" onclick="cerrarModalReciboGestor(); avanzarEstadoEntregaGestor(${p.id}, 'ENTREGADO', false);"
              style="width:100%; padding:11px 14px; border-radius:12px; border:1px solid var(--border); background:#fffdfb; color:var(--text); font-family:inherit; font-weight:800; font-size:0.84rem; cursor:pointer; text-align:center;">
              📦 Solo marcar Entregado (cobro por transferencia / luego)
            </button>
            <button type="button" class="btn-soft" onclick="cerrarModalReciboGestor()">Cancelar</button>
          </div>
        </div>
      `;
      modal.style.display = 'flex';
    }

    async function avanzarEstadoEntregaGestor(pedidoId, accion, registrarCobroEfectivo = false, opciones = {}) {
      const p = (GSTATE.pedidos || []).find(x => Number(x.id) === Number(pedidoId));
      if (!p || !GSTATE.nodo?.id) return false;

      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/pedidos/${pedidoId}/estado-entrega`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            accion,
            registrar_cobro_efectivo: Boolean(registrarCobroEfectivo),
            motivo: opciones.motivo || '',
            salir_a_reparto: Boolean(opciones.salirAReparto),
            actor: GSTATE.nodo.gestor_nombre || 'Gestor del Nodo'
          })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo actualizar el estado del pedido: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          return false;
        }

        const msgExito = accion === 'SALIO_REPARTO'
          ? `🛵 Pedido #${p.codigo_pedido} marcado "En camino a domicilio". El vecino ya lo ve en vivo.`
          : accion === 'AUSENTE_PASA_RETIRAR'
            ? `🏡 Pedido #${p.codigo_pedido} pasado a "Ausente — Pasa a retirar por el Nodo" (se conserva envío).`
            : accion === 'REINTEGRAR_REPARTO'
              ? `🔄 Pedido #${p.codigo_pedido} reintegrado a la Hoja de Ruta.`
              : (data.cobro_efectivo_registrado
                  ? `✅ Pedido #${p.codigo_pedido} entregado y cobrado en efectivo (${fmt(p.total_vecino)}).`
                  : `✅ Pedido #${p.codigo_pedido} marcado como entregado a ${p.vecino_nombre}.`);
        mostrarAvisoPantallaGestor(msgExito, 'ok');

        await cargarPanelGestor();

        if (GSTATE.nocturnoAbierto) {
          const restantes = obtenerParadasRepartoActivasGestor();
          if (restantes.length === 0) {
            await apagarRadarVivoGestor(false);
            cerrarModoNocturno(true);
            mostrarAvisoPantallaGestor('🏁 ¡Completaste todas las entregas de tu Hoja de Ruta!', 'ok');
          } else {
            if (GSTATE.repartoIndice >= restantes.length) {
              GSTATE.repartoIndice = 0;
            }
            renderOverlayConduccionNocturna();
            if (GSTATE.radarActivo) {
              enviarPingRadarVivoGestor(restantes[GSTATE.repartoIndice]?.id);
            }
          }
          return true;
        }

        if (data.cobro_efectivo_registrado && !opciones.omitirRecibo) {
          abrirModalReciboVecinoGestor(pedidoId);
        }
        return true;
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de comunicación al actualizar el estado de entrega.', 'error');
        return false;
      }
    }

    async function cobrarEnEfectivoYEmitirReciboGestor(pedidoId) {
      const ped = (GSTATE.pedidos || []).find(p => Number(p.id) === Number(pedidoId));
      if (!ped) return;

      try {
        const resp = await fetchGestor(`/api/produccion/nodos/liquidacion/pedidos/${pedidoId}/conciliar-pago`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            medio_pago: 'EFECTIVO',
            comprobante_referencia: `REC-EFVO-${ped.codigo_pedido}`
          })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo registrar el cobro en efectivo: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          return;
        }
        mostrarAvisoPantallaGestor(`✅ Cobro en efectivo registrado para el pedido #${ped.codigo_pedido}.`, 'ok');
        await cargarPanelGestor();
        abrirModalReciboVecinoGestor(pedidoId);
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de comunicación al registrar el cobro en efectivo.', 'error');
      }
    }

    function normalizarTextoBusquedaComprador(txt) {
      return String(txt || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .trim();
    }

    function obtenerCompradoresFiltradosGestor() {
      const lista = Array.isArray(GSTATE.compradores) ? GSTATE.compradores : [];
      const filtro = String(GSTATE.filtroCompradores || 'TODOS').toUpperCase();
      const q = normalizarTextoBusquedaComprador(GSTATE.busquedaCompradores);
      const terminos = q ? q.split(/\s+/).filter(Boolean) : [];

      return lista.filter(c => {
        if (filtro === 'ACTIVOS' && !c.tiene_pedido_en_curso) return false;
        if (filtro === 'RECURRENTES' && !c.es_recurrente) return false;
        if (terminos.length > 0) {
          const bolsa = normalizarTextoBusquedaComprador([
            c.nombre_completo,
            c.codigo_vecino,
            c.telefono_whatsapp,
            c.direccion_calle,
            c.entrecalles_referencia,
            c.notas_entrega,
            c.ultimo_pedido?.codigo_pedido,
            c.ultimo_pedido?.fecha_entrega_label
          ].filter(Boolean).join(' '));
          for (const t of terminos) {
            if (!bolsa.includes(t)) return false;
          }
        }
        return true;
      });
    }

    async function refrescarCompradoresGestor() {
      if (!GSTATE.nodo?.id) return;
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${Number(GSTATE.nodo.id)}/compradores`, { cache: 'no-store' });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor(data.error || 'No se pudo actualizar la lista de compradores.', 'error');
          return;
        }
        GSTATE.compradores = Array.isArray(data.compradores) ? data.compradores : [];
        GSTATE.compradoresResumen = data.resumen || {
          total_compradores: GSTATE.compradores.length,
          con_pedido_activo: GSTATE.compradores.filter(c => c.tiene_pedido_en_curso).length,
          recurrentes: GSTATE.compradores.filter(c => c.es_recurrente).length
        };
        GSTATE.compradoresCargados = true;
        renderVistaGestor();
        mostrarAvisoPantallaGestor('✅ Lista de compradores actualizada.', 'ok');
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de comunicación al actualizar compradores.', 'error');
      }
    }

    function formatearFechaCortaComprador(iso) {
      if (!iso) return '';
      try {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return '';
        return d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' });
      } catch (_) {
        return '';
      }
    }

    function abrirWhatsAppCompradorGestor(vecinoId) {
      const comp = (GSTATE.compradores || []).find(c => Number(c.vecino_id) === Number(vecinoId));
      if (!comp) return;
      let telDigits = String(comp.telefono_whatsapp || comp.telefono_normalizado || '').replace(/\D/g, '');
      if (!telDigits) {
        mostrarAvisoPantallaGestor('Este comprador no tiene número de WhatsApp registrado.', 'error');
        return;
      }
      if (!telDigits.startsWith('54')) {
        telDigits = telDigits.replace(/^0+/, '');
        if (telDigits.length > 10 && telDigits.startsWith('15')) {
          telDigits = telDigits.slice(2);
        }
        telDigits = `549${telDigits}`;
      }
      const nombreMarca = GSTATE.nodo?.nombre_marca || 'nuestra tienda';
      const primerNombre = String(comp.nombre_completo || '').trim().split(/\s+/)[0] || '';
      const saludo = primerNombre ? `¡Hola ${primerNombre}!` : '¡Hola!';
      const texto = `${saludo} Te escribo de *${nombreMarca}* 😊`;
      window.open(`https://wa.me/${telDigits}?text=${encodeURIComponent(texto)}`, '_blank', 'noopener');
    }

                  ${c.codigo_vecino ? `<span style="font-size:0.72rem; font-weight:800; padding:2px 7px; border-radius:999px; background:var(--bg); border:1px solid var(--border); color:var(--muted);">${esc(c.codigo_vecino)}</span>` : ''}
                  ${tieneActivo ? `<span style="font-size:0.72rem; font-weight:800; padding:2px 8px; border-radius:999px; background:var(--brand-soft); border:1px solid var(--brand-border); color:var(--brand-dark);">🚚 Pedido activo</span>` : ''}

    function renderSeccionCompradores() {
