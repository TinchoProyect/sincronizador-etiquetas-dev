<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel del Gestor</title>
  <!-- /lamda-cloud-runtime.js omitido en apps externas de Nodos (Marca Blanca) -->
  <script>
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        }).catch(function(){});
      }
      localStorage.removeItem('lamda_prefer_mobile_home');
    } catch (_) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <!-- Leaflet 1.9.4 + OSM (Hoja de Ruta y Pin de Casa del Vecino) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    :root {
      --brand: #a2553b;
      --brand-dark: #6b311d;
      --brand-soft: rgba(162, 85, 59, 0.12);
      --brand-border: rgba(162, 85, 59, 0.34);
      --bg: #faf7f3;
      --surface: #ffffff;
      --surface-warm: #f3ebe2;
      --text: #25130b;
      --muted: #57453b;
      --border: #d9cbbd;
      --ok: #1f5c3d;
      --ok-soft: #e6f4ec;
      --warn: #92400e;
      --warn-soft: #fef3c7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 48px;
      -webkit-font-smoothing: antialiased;
    }

    /* Encabezado claro, cálido y austero */
    .top-bar {
      background: #fffdfb;
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .top-inner {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand-identity {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }
    .brand-emblem {
      width: 52px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .brand-emblem img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .brand-monogram {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--brand-soft);
      border: 1px solid var(--brand-border);
      color: var(--brand-dark);
      font-weight: 900;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-title {
      font-size: 1.32rem;
      font-weight: 900;
      color: var(--text);
      line-height: 1.18;
      letter-spacing: -0.015em;
    }
    .brand-subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 700;
      margin-top: 3px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-top {
      min-height: 48px;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-top:hover {
      background: var(--surface-warm);
    }
    .btn-top.brand {
      background: var(--brand);
      border-color: var(--brand);
      color: #ffffff;
    }
    .btn-top.brand:hover {
      background: var(--brand-dark);
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 22px 16px 36px;
    }

    /* Tablero Principal Austero de 6 Bloques */
    .board-intro {
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 700;
      margin: 0 0 14px 2px;
    }
    .blocks-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }
    .block-btn {
      width: 100%;
      min-height: 76px;
      text-align: left;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 18px 18px;
      cursor: pointer;
      font-family: inherit;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: 0 2px 8px rgba(62, 37, 25, 0.03);
      transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .block-btn:hover, .block-btn:active {
      border-color: var(--brand-border);
      box-shadow: 0 4px 14px rgba(62, 37, 25, 0.07);
      transform: translateY(-1px);
    }
    .block-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .block-num {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--brand-soft);
      color: var(--brand-dark);
      font-weight: 900;
      font-size: 1.08rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .block-title {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--text);
      line-height: 1.25;
    }
    .block-meta {
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 700;
      margin-top: 4px;
      line-height: 1.35;
    }
    .block-arrow {
      font-size: 1.35rem;
      color: var(--brand);
      font-weight: 800;
      flex-shrink: 0;
      line-height: 1;
    }

    /* Cabecera de Navegación Interna al abrir un Bloque */
    .section-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-back:hover {
      background: var(--surface-warm);
    }
    .section-heading {
      margin: 0 0 14px 0;
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--text);
    }

    /* Tarjetas y Controles Internos */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(62, 37, 25, 0.025);
    }
    .input-sm {
      min-height: 48px;
      padding: 11px 14px;
      border-radius: 11px;
      border: 1.5px solid var(--border);
      background: #fffdfb;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      outline: none;
    }
    .input-sm:disabled {
      background: #eee7df;
      color: var(--muted);
      cursor: not-allowed;
    }
    .input-sm:focus {
      border-color: var(--brand);
    }
    .btn-primary {
      background: var(--brand);
      color: #ffffff;
      border: none;
      min-height: 48px;
      padding: 12px 20px;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 900;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary:hover {
      background: var(--brand-dark);
    }
    .btn-soft {
      background: var(--surface-warm);
      color: var(--text);
      border: 1.5px solid var(--border);
      min-height: 48px;
      padding: 10px 14px;
      border-radius: 11px;
      font-family: inherit;
      font-weight: 800;
      font-size: 0.92rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
    }
    .switch-label {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 48px;
      cursor: pointer;
      font-weight: 800;
      font-size: 0.98rem;
      line-height: 1.3;
      color: var(--text);
    }
    .switch-label input[type="checkbox"] {
      width: 24px;
      height: 24px;
      accent-color: var(--brand);
      flex-shrink: 0;
      cursor: pointer;
    }

    /* === Ergonomía Móvil y Alto Contraste (Etapa B3) === */
    html { font-size: 16px; }
    body { font-size: 1rem; line-height: 1.48; }
    body .board-intro {
      font-size: 1.06rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 14px;
    }
    body .btn-back {
      min-height: 48px;
      padding: 10px 16px;
      font-size: 0.96rem;
      font-weight: 800;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    body .section-heading {
      font-size: 1.32rem;
      font-weight: 900;
      color: var(--text);
      line-height: 1.25;
    }
    body .block-arrow {
      font-size: 1.55rem;
      color: var(--muted);
      font-weight: 800;
    }
    .cta-difusion-hero {
      width: 100%;
      min-height: 76px;
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      padding: 16px 18px;
      margin-bottom: 16px;
      border-radius: 18px;
      border: 2px solid #8a432b;
      background: linear-gradient(135deg, #a2553b 0%, #7d3e28 100%);
      color: #ffffff;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(125, 62, 40, 0.24);
      transition: transform 0.12s, box-shadow 0.15s;
    }
    .cta-difusion-hero:active {
      transform: scale(0.99);
    }
    .cta-difusion-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.55rem;
      flex-shrink: 0;
    }
    .cta-difusion-body {
      flex: 1;
      min-width: 0;
    }
    .cta-difusion-title {
      font-size: 1.12rem;
      font-weight: 900;
      line-height: 1.22;
      color: #ffffff;
    }
    .cta-difusion-sub {
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.35;
      color: rgba(255, 255, 255, 0.92);
      margin-top: 3px;
    }
    .cta-difusion-arrow {
      font-size: 1.65rem;
      font-weight: 900;
      color: #ffffff;
      flex-shrink: 0;
    }
    .cfg-switch-card {
      padding: 10px 14px;
      border-radius: 13px;
      border: 1.5px solid var(--border);
      background: #fffdfb;
    }
    @media (max-width: 640px) {
      body .container {
        padding: 16px 12px 34px;
      }
      body .brand-title {
        font-size: 1.24rem;
      }
      body .brand-subtitle {
        font-size: 0.88rem;
      }
      body .top-actions {
        width: 100%;
      }
      body .btn-top {
        flex: 1 1 auto;
        min-height: 48px;
        font-size: 0.9rem;
      }
      body .block-btn {
        padding: 16px 14px;
      }
      body .block-title {
        font-size: 1.1rem;
      }
      body .block-meta {
        font-size: 0.92rem;
      }
    }

    /* Tarjeta de Producto en Mi Oferta (apta celular sin scroll lateral) */
    .oferta-item {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      background: #fffdfb;
      margin-bottom: 10px;
    }
    .oferta-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 10px;
      align-items: end;
    }

    /* Hoja de Ruta y Conducción Nocturna (Etapas B4 + B5) */
    .cta-reparto-hero {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      margin-bottom: 16px;
      border-radius: 18px;
      border: 2px solid rgba(31, 111, 74, 0.35);
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.22);
      transition: transform 0.1s ease;
    }

    .cta-reparto-hero:active {
      transform: scale(0.99);
    }

    .reparto-stop-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 15px;
      margin-bottom: 12px;
      box-shadow: 0 3px 10px rgba(62, 37, 25, 0.05);
    }

    .reparto-stop-card.same-door {
      border-left: 5px solid #2563eb;
      background: #f8fbff;
    }

    .nocturno-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 3600;
      background: #0b1120;
      color: #f8fafc;
      overflow-y: auto;
      padding: 14px 14px 28px;
      -webkit-tap-highlight-color: transparent;
    }

    .nocturno-btn {
      width: 100%;
      min-height: 62px;
      border-radius: 16px;
      font-family: inherit;
      font-size: 1.12rem;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      padding: 12px 16px;
      box-sizing: border-box;
      text-align: center;
    }

    .nocturno-btn:active {
      transform: scale(0.985);
    }

    @media (max-width: 640px) {
      .top-inner {
        flex-direction: column;
        align-items: flex-start;
      }
      .top-actions {
        width: 100%;
      }
      .btn-top {
        flex: 1;
        justify-content: center;
      }
      .oferta-grid {
        grid-template-columns: 1fr 1fr;
      }
      .ventana-item-row {
        grid-template-columns: 1fr 1fr !important;
      }
      .propuestas-grid {
        grid-template-columns: 1fr !important;
      }
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="top-inner">
      <div class="brand-identity" onclick="volverAlTableroGestor()" title="Volver al tablero principal">
        <div class="brand-emblem" id="gestor-logo-box"></div>
        <div>
          <div class="brand-title" id="gestor-nodo-title">Cargando...</div>
          <div class="brand-subtitle" id="gestor-nodo-subtitle">Panel del Gestor</div>
        </div>
      </div>

      <div class="top-actions">
        <a id="btn-abrir-tienda" href="#" target="_blank" class="btn-top">
          🏪 Ver Tienda
        </a>
        <button type="button" class="btn-top brand" onclick="abrirModalDifusionTienda()">
          📣 Difundir Tienda
        </button>
        <button type="button" class="btn-top" onclick="copiarLinkTiendaVecinos()">
          🔗 Copiar Link
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="gestor-main-view"></div>
  </main>

  <!-- AVISO VISIBLE EN PANTALLA ANTE ÉXITO O FALLA DE COMUNICACIÓN -->
  <div id="gestor-aviso-flotante" style="display:none; position:fixed; top:14px; left:14px; right:14px; max-width:520px; margin:0 auto; z-index:2500; padding:12px 14px; border-radius:12px; box-shadow:0 12px 28px rgba(62,37,25,0.18); font-size:0.84rem; font-weight:700; line-height:1.4;"></div>

  <!-- MODAL DE WHATSAPP / DIFUSIÓN / RECIBO DIGITAL MARCA BLANCA -->
  <div id="modal-recibo-gestor" onclick="if(event.target===this) cerrarModalReciboGestor()" style="display:none; position:fixed; inset:0; background:rgba(62,37,25,0.52); z-index:4200; align-items:center; justify-content:center; padding:16px;">
    <div style="background:#ffffff; border-radius:18px; max-width:490px; width:100%; max-height:92vh; overflow-y:auto; box-shadow:0 20px 45px rgba(62,37,25,0.22); border:1px solid var(--border);">
      <div id="modal-recibo-gestor-body"></div>
    </div>
  </div>

  <!-- MODAL PARA FIJAR O CORREGIR PIN DE CASA DEL VECINO (LEAFLET + GEOREF) -->
  <div id="modal-pin-reparto-gestor" onclick="if(event.target===this) cerrarModalPinCasaGestor()" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.68); z-index:4000; align-items:center; justify-content:center; padding:12px;">
    <div style="background:#ffffff; border-radius:18px; max-width:540px; width:100%; max-height:94vh; overflow-y:auto; box-shadow:0 24px 48px rgba(15,23,42,0.34); border:1px solid var(--border);">
      <div id="modal-pin-reparto-gestor-body"></div>
    </div>
  </div>

  <!-- VISTA OVERLAY FULLSCREEN DE CONDUCCIÓN NOCTURNA (ALTO CONTRASTE #0b1120) -->
  <div id="gestor-nocturno-overlay" class="nocturno-overlay"></div>

  <script>
    const GSTATE = {
      slug: '',
      vista: 'inicio', // 'inicio' | 'reparto' | 'ofertas' | 'propuestas' | 'logistica' | 'pedidos' | 'ctacte' | 'liquidacion' | 'compradores'
      filtroPagoPedidos: 'TODOS',
      filtroOperativoPedidos: 'TODOS',
      filtroCompradores: 'TODOS',
      busquedaCompradores: '',
      nodo: null,
      modoLaboratorio: false,
      telefonoPruebas: '5492216615746',
      proximaEntrega: null,
      ofertas: [],
      catalogoBaseDisponible: [],
      propuestas: [],
      pedidos: [],
      compradores: [],
      compradoresResumen: { total_compradores: 0, con_pedido_activo: 0, recurrentes: 0 },
      compradoresCargados: false,
      compartirKit: null,
      difusionModo: 'tienda',
      difusionOfertaId: 0,
      movimientosCtaCte: [],
      ingredientesDisponibles: [],
      propCategoriaSel: '',
      propFiltroTexto: '',
      propIngredienteIdSel: 0,
      propIngredienteInicializadoId: 0,
      propKilosSel: 0.25,
      propUnidadPesoManual: 'g',
      propNombreEditadoManual: false,
      propConfirmacionReciente: '',
      liquidacionTablero: null,
      repartoOrdenManual: [],
      repartoIndice: 0,
      repartoDistanciaMetros: 0,
      repartoPinPedidoId: null,
      nocturnoAbierto: false,
      radarActivo: false
    };

    function fmt(n) {
      return '$' + Math.round(Number(n) || 0).toLocaleString('es-AR');
    }

    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    let _timerAvisoFlotante = null;
    function mostrarAvisoPantallaGestor(mensaje, tipo = 'ok') {
      const box = document.getElementById('gestor-aviso-flotante');
      if (!box) return;
      if (_timerAvisoFlotante) clearTimeout(_timerAvisoFlotante);

      const esError = tipo === 'error';
      box.style.background = esError ? '#fef2f2' : '#ecfdf3';
      box.style.border = esError ? '1px solid #ef4444' : '1px solid rgba(31,111,74,0.45)';
      box.style.color = esError ? '#991b1b' : '#14532d';
      box.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
          <div>${esError ? '⚠️ ' : ''}${esc(mensaje)}</div>
          <button type="button" onclick="document.getElementById('gestor-aviso-flotante').style.display='none'"
            style="border:none; background:transparent; color:inherit; font-weight:900; font-size:0.95rem; cursor:pointer; padding:0 2px; line-height:1;">
            ✕
          </button>
        </div>
      `;
      box.style.display = 'block';
      _timerAvisoFlotante = setTimeout(() => {
        box.style.display = 'none';
      }, esError ? 9000 : 5000);
    }

    async function leerRespuestaJsonSegura(resp) {
      const raw = await resp.text();
      try {
        return raw ? JSON.parse(raw) : {};
      } catch (_) {
        return { ok: false, error: `Respuesta inesperada del servidor (HTTP ${resp.status})` };
      }
    }

    function aplicarPaletaNodo(hexColor) {
      const clean = /^#[0-9a-fA-F]{6}$/.test(String(hexColor || '').trim()) ? String(hexColor).trim() : '#a2553b';
      const r = parseInt(clean.slice(1, 3), 16);
      const g = parseInt(clean.slice(3, 5), 16);
      const b = parseInt(clean.slice(5, 7), 16);
      const darkR = Math.max(0, Math.round(r * 0.78));
      const darkG = Math.max(0, Math.round(g * 0.78));
      const darkB = Math.max(0, Math.round(b * 0.78));
      const darkHex = '#' + [darkR, darkG, darkB].map(v => v.toString(16).padStart(2, '0')).join('');

      const root = document.documentElement;
      root.style.setProperty('--brand', clean);
      root.style.setProperty('--brand-dark', darkHex);
      root.style.setProperty('--brand-soft', `rgba(${r}, ${g}, ${b}, 0.11)`);
      root.style.setProperty('--brand-border', `rgba(${r}, ${g}, ${b}, 0.30)`);
    }

    function detectarSlugInicial() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('nodo')) return params.get('nodo').trim();
      const parts = window.location.pathname.split('/').filter(Boolean);
      const idx = parts.findIndex(p => p === 'gestor' || p === 'gestor-nodo');
      if (idx !== -1 && parts[idx + 1]) return decodeURIComponent(parts[idx + 1]).trim();
      return '';
    }

    function obtenerKeyStorageTokenGestor(slug) {
      return 'lamda_nodo_gestor_token_' + String(slug || '').trim().toLowerCase();
    }

    function resolverYPersistirTokenGestor(slug) {
      const cleanSlug = String(slug || '').trim();
      const params = new URLSearchParams(window.location.search);
      const tokQuery = String(params.get('t') || params.get('gestor_token') || '').trim();
      const key = obtenerKeyStorageTokenGestor(cleanSlug);

      if (tokQuery && tokQuery.length >= 16) {
        try {
          localStorage.setItem(key, tokQuery);
        } catch (_) {}
        params.delete('t');
        params.delete('gestor_token');
        const nuevaQs = params.toString();
        const nuevaUrl = window.location.pathname + (nuevaQs ? '?' + nuevaQs : '') + (window.location.hash || '');
        try {
          window.history.replaceState({}, document.title, nuevaUrl);
        } catch (_) {}
        return tokQuery;
      }

      try {
        return String(localStorage.getItem(key) || '').trim();
      } catch (_) {
        return '';
      }
    }

    function fetchGestor(url, options = {}) {
      const tok = resolverYPersistirTokenGestor(GSTATE.slug || detectarSlugInicial());
      const headers = { ...(options.headers || {}) };
      if (tok) {
        headers['X-Nodo-Gestor-Token'] = tok;
      }
      return fetch(url, { ...options, headers });
    }

    function activarTokenManualDesdeAcceso() {
      const inp = document.getElementById('gestor-token-manual-input');
      const raw = String(inp?.value || '').trim();
      if (!raw) return;
      let tok = raw;
      try {
        if (/^https?:\/\//i.test(raw) || raw.includes('t=')) {
          const u = new URL(raw.startsWith('http') ? raw : (window.location.origin + (raw.startsWith('/') ? raw : '/?' + raw)));
          tok = String(u.searchParams.get('t') || u.searchParams.get('gestor_token') || '').trim();
        }
      } catch (_) {}
      if (!tok || tok.length < 16) {
        alert('Pegá el enlace completo del QR de Gestor o una clave válida.');
        return;
      }
      const slug = GSTATE.slug || detectarSlugInicial();
      try {
        localStorage.setItem(obtenerKeyStorageTokenGestor(slug), tok);
      } catch (_) {}
      cargarPanelGestor();
    }

    function renderizarPantallaReescanearQrGestor(esInvalido = false) {
      const box = document.getElementById('gestor-main-view');
      if (!box) return;
      box.innerHTML = `
        <div class="card" style="text-align:center; padding:30px 22px; max-width:520px; margin:20px auto;">

          <h3 style="margin:0 0 10px 0; font-size:1.18rem; color:var(--text);">

          </h3>
          <p style="color:var(--muted); font-size:0.9rem; line-height:1.55; margin:0 0 14px 0;">
            ${esInvalido
              ? 'El acceso anterior ya no está vigente por rotación de seguridad. Pedí el código QR actualizado y escanealo con la cámara de tu celular.'
              : 'Por seguridad de tu Nodo, este panel requiere abrirse desde tu código QR personal de Gestor.'}
          </p>
          <div style="background:var(--surface-warm); border:1px solid var(--border); border-radius:12px; padding:12px 14px; font-size:0.82rem; color:var(--text); line-height:1.45; text-align:left; margin-bottom:16px;">
            <strong>💡 ¿Usás iPhone o iPad ("Agregar a inicio")?</strong><br>
            Al guardar un ícono en la pantalla de inicio, iOS abre un espacio separado sin la clave previa de Safari. Escaneá tu QR de Gestor desde la cámara y volvé a guardar el ícono si lo necesitás, o pegá tu enlace de acceso acá abajo:
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <input id="gestor-token-manual-input" type="text" placeholder="Pegá acá el link completo del QR de Gestor..."
              style="flex:1; min-width:210px; padding:10px 12px; border:1px solid var(--border); border-radius:10px; font-family:inherit; font-size:0.85rem;">
            <button type="button" onclick="activarTokenManualDesdeAcceso()" class="btn-primary" style="padding:10px 16px;">
              Ingresar
            </button>
          </div>
        </div>
      `;
    }

    async function cargarPanelGestor(opciones = {}) {
      if (!GSTATE.slug) {
        renderizarPantallaReescanearQrGestor(false);
        return;
      }
      resolverYPersistirTokenGestor(GSTATE.slug);
      const [resp, respLiq] = await Promise.all([
        fetchGestor(`/api/produccion/nodos/portal/${encodeURIComponent(GSTATE.slug)}?vista=gestor`, { cache: 'no-store' }),
        fetchGestor(`/api/produccion/nodos/liquidacion/tablero?nodo_slug=${encodeURIComponent(GSTATE.slug)}`, { cache: 'no-store' })
      ]);
      const data = await leerRespuestaJsonSegura(resp);
      if (resp.status === 401 || resp.status === 403 || data.code === 'GESTOR_TOKEN_REQUIRED' || data.code === 'GESTOR_TOKEN_INVALID' || data.code === 'GESTOR_WRONG_NODE') {
        const esInvalido = data.code === 'GESTOR_TOKEN_INVALID' || data.code === 'GESTOR_WRONG_NODE';
        if (esInvalido) {
          try { localStorage.removeItem(obtenerKeyStorageTokenGestor(GSTATE.slug)); } catch (_) {}
        }
        renderizarPantallaReescanearQrGestor(esInvalido);
        return;
      }
      if (!data.ok) {
        const box = document.getElementById('gestor-main-view');
        if (box) {
          box.innerHTML = `
            <div class="card" style="text-align:center; padding:32px;">
              <h3 style="margin:0 0 8px 0;">Panel de Gestión no disponible</h3>
              <p style="color:var(--muted); font-size:0.9rem; max-width:480px; margin:0 auto;">
                Verificá que el enlace de tu Nodo esté actualizado o escaneá nuevamente tu código QR de Gestor.
              </p>
            </div>
          `;
        }
        return;
      }
      try {
        const dataLiq = await respLiq.json();
        if (dataLiq && dataLiq.ok) GSTATE.liquidacionTablero = dataLiq;
      } catch (_) {}

      GSTATE.nodo = data.nodo;
      GSTATE.slug = data.nodo.slug;
      GSTATE.modoLaboratorio = Boolean(data.modo_laboratorio);
      GSTATE.telefonoPruebas = String(data.telefono_whatsapp_pruebas || '5492216615746');
      GSTATE.proximaEntrega = data.proxima_entrega;
      GSTATE.ofertas = data.todas_ofertas_gestor || [];
      GSTATE.catalogoBaseDisponible = Array.isArray(data.catalogo_base_disponible) ? data.catalogo_base_disponible : [];
      GSTATE.propuestas = data.propuestas_nodo || [];
      GSTATE.pedidos = data.pedidos_nodo || [];
      GSTATE.movimientosCtaCte = data.movimientos_cta_cte || [];
      GSTATE.ingredientesDisponibles = Array.isArray(data.ingredientes_sugeribles) ? data.ingredientes_sugeribles : [];
      GSTATE.compartirKit = null;

      try {
        const respComp = await fetchGestor(`/api/produccion/nodos/gestor/${Number(GSTATE.nodo.id)}/compradores`, { cache: 'no-store' });
        const dataComp = await leerRespuestaJsonSegura(respComp);
        if (respComp.ok && dataComp.ok) {
          GSTATE.compradores = Array.isArray(dataComp.compradores) ? dataComp.compradores : [];
          GSTATE.compradoresResumen = dataComp.resumen || {
            total_compradores: GSTATE.compradores.length,
            con_pedido_activo: GSTATE.compradores.filter(c => c.tiene_pedido_en_curso).length,
            recurrentes: GSTATE.compradores.filter(c => c.es_recurrente).length
          };
          GSTATE.compradoresCargados = true;
        }
      } catch (_) {}

      // Precargar kit de difusión público en segundo plano (sin bloquear UI)
      cargarKitCompartirGestor(false).catch(() => {});

      if (GSTATE.ingredientesDisponibles.length > 0) {
        const cats = Array.from(new Set(GSTATE.ingredientesDisponibles.map(i => i.categoria_gestor)));
        if (!GSTATE.propCategoriaSel || !cats.includes(GSTATE.propCategoriaSel)) {
          GSTATE.propCategoriaSel = cats.includes('Granolas') ? 'Granolas' : cats[0];
        }
        const itemsCat = GSTATE.ingredientesDisponibles.filter(i => i.categoria_gestor === GSTATE.propCategoriaSel);
        if (!itemsCat.some(i => Number(i.id) === Number(GSTATE.propIngredienteIdSel)) && itemsCat[0]) {
          GSTATE.propIngredienteIdSel = Number(itemsCat[0].id);
        }
        const ingActual = GSTATE.ingredientesDisponibles.find(i => Number(i.id) === Number(GSTATE.propIngredienteIdSel));
        if (ingActual && (opciones.avanzarGramajeTrasEnvio || GSTATE.propIngredienteInicializadoId !== Number(ingActual.id))) {
          GSTATE.propKilosSel = elegirPrimerGramajeNuevoDisponible(ingActual);
          GSTATE.propUnidadPesoManual = Number(GSTATE.propKilosSel) >= 1 ? 'kg' : 'g';
          GSTATE.propIngredienteInicializadoId = Number(ingActual.id);
        }
      }

      aplicarPaletaNodo(GSTATE.nodo.color_primario || '#a2553b');

      const titleEl = document.getElementById('gestor-nodo-title');
      if (titleEl) titleEl.textContent = GSTATE.nodo.nombre_marca || 'Mi Nodo';

      const subEl = document.getElementById('gestor-nodo-subtitle');
      if (subEl) {
        const partes = ['Panel del Gestor'];
        if (GSTATE.nodo.barrio_zona || GSTATE.nodo.direccion_retiro) {
          partes.push(`📍 ${GSTATE.nodo.barrio_zona || GSTATE.nodo.direccion_retiro}`);
        }
        subEl.textContent = partes.join(' · ');
      }

      const logoBox = document.getElementById('gestor-logo-box');
      if (logoBox) {
        const logoSrc = GSTATE.nodo.logo_original_base64 || GSTATE.nodo.logo_mono_preview_base64 || '';
        if (logoSrc) {
          logoBox.innerHTML = `<img src="${logoSrc}" alt="${esc(GSTATE.nodo.nombre_marca)}">`;
        } else {
          const siglas = String(GSTATE.nodo.nombre_marca || 'ND').split(/\s+/).map(w => w[0] || '').join('').substring(0, 2).toUpperCase();
          logoBox.innerHTML = `<div class="brand-monogram">${esc(siglas)}</div>`;
        }
      }

      document.title = `${GSTATE.nodo.nombre_marca || 'Nodo'} — Panel del Gestor`;

      const btnTienda = document.getElementById('btn-abrir-tienda');
      if (btnTienda) btnTienda.href = `/tienda/${encodeURIComponent(GSTATE.slug)}`;

      renderVistaGestor();
    }

    function abrirSeccionGestor(seccion) {
      GSTATE.vista = seccion;
      try {
        window.history.pushState({ vista: seccion }, '', `#${seccion}`);
      } catch (_) {}
      renderVistaGestor();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function volverAlTableroGestor() {
      GSTATE.vista = 'inicio';
      try {
        window.history.replaceState({ vista: 'inicio' }, '', window.location.pathname + window.location.search);
      } catch (_) {}
      renderVistaGestor();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('popstate', () => {
      const hash = (window.location.hash || '').replace(/^#/, '');
      if (['reparto', 'ofertas', 'propuestas', 'logistica', 'pedidos', 'ctacte', 'liquidacion', 'compradores'].includes(hash)) {
        GSTATE.vista = hash;
      } else {
        GSTATE.vista = 'inicio';
      }
      renderVistaGestor();
    });

    function renderVistaGestor() {
      const box = document.getElementById('gestor-main-view');
      if (!box || !GSTATE.nodo) return;

      if (GSTATE.vista === 'reparto') {
        box.innerHTML = envolverSeccionInterna('🚗 Modo Reparto / Hoja de Ruta', renderSeccionReparto());
      } else if (GSTATE.vista === 'ofertas') {
        box.innerHTML = envolverSeccionInterna('1. Mi Oferta y Márgenes', renderSeccionOfertas());
      } else if (GSTATE.vista === 'propuestas') {
        box.innerHTML = envolverSeccionInterna('2. Pedir Nueva Fracción', renderSeccionPropuestas());
      } else if (GSTATE.vista === 'logistica') {
        box.innerHTML = envolverSeccionInterna('3. Días de Entrega, Corte y Envío Barrial', renderSeccionLogistica());
      } else if (GSTATE.vista === 'pedidos') {
        box.innerHTML = envolverSeccionInterna('4. Pedidos de Vecinos', renderSeccionPedidos());
      } else if (GSTATE.vista === 'ctacte') {
        box.innerHTML = envolverSeccionInterna('5. Cuentas Corrientes', renderSeccionCuentasCorrientes());
      } else if (GSTATE.vista === 'liquidacion') {
        box.innerHTML = envolverSeccionInterna('6. Liquidación', renderSeccionLiquidacion());
      } else if (GSTATE.vista === 'compradores') {
        box.innerHTML = envolverSeccionInterna('7. Compradores registrados', renderSeccionCompradores());
      } else {
        box.innerHTML = renderTableroPrincipal();
      }
      if (GSTATE.nocturnoAbierto) {
        renderOverlayConduccionNocturna();
      }

      const bloques = [
        {
          num: '1',
          id: 'ofertas',
          titulo: 'Mi Oferta y Márgenes',
          meta: totalOfertas === 0
            ? 'Sin productos cargados aún'
            : (totalOfertas > publicadas

          num: '2',
          id: 'propuestas',

            ? `${propPendientes} solicitud${propPendientes === 1 ? '' : 'es'} en cotización`

        },
        {
          num: '3',
          id: 'logistica',
          titulo: 'Días de Entrega, Corte y Modalidades',

        },
        {

          titulo: 'Pedidos de Vecinos',
          meta: totalPedidos === 0
            ? 'Aún no hay pedidos registrados'
            : (listosRecibirLote > 0
                ? `📥 ${listosRecibirLote} pedido${listosRecibirLote === 1 ? '' : 's'} listo${listosRecibirLote === 1 ? '' : 's'} para recibir lote · ${pendCobro} pend. cobro`
                : `${totalPedidos} pedido${totalPedidos === 1 ? '' : 's'} (${entregadosCant} entregado${entregadosCant === 1 ? '' : 's'})${pendCobro > 0 ? ` · ${pendCobro} pend. cobro` : ' · todos cobrados'}`)
        },
        {
          num: '5',
          id: 'ctacte',
          titulo: 'Cuentas Corrientes',
          meta: `Saldo operativo del Nodo: ${saldoNodo < 0 ? '-' + fmt(Math.abs(saldoNodo)) : fmt(saldoNodo)}`
        },
        {
          num: '6',
          id: 'liquidacion',

          meta: canastos.length === 0
            ? 'Sin lotes cerrados para liquidar'
            : (lotesAbiertos > 0 ? `${lotesAbiertos} lote${lotesAbiertos === 1 ? '' : 's'} en curso para conciliar` : `${canastos.length} lote${canastos.length === 1 ? '' : 's'} liquidados`)
        },
        {
          num: '7',
          id: 'compradores',
          titulo: 'Compradores registrados',
          meta: (() => {
            const tot = Number(GSTATE.compradoresResumen?.total_compradores || GSTATE.compradores?.length || 0);

        Number(p.hito_tracking_actual || 1) === 3 &&
        p.lote_canasto_id

          <div class="cta-difusion-icon">📣</div>

            <div class="cta-difusion-title">Difundir mi Tienda y Productos por WhatsApp</div>

                  : (enviosEnHito3.length > 0

    // -------------------------------------------------------------------------
    // WHATSAPP, DIFUSIÓN MARCA BLANCA Y LINK DE TIENDA (Etapa A3)
    // -------------------------------------------------------------------------
    async function cargarKitCompartirGestor(forzar = false) {
      if (!GSTATE.nodo?.id) return null;
      if (GSTATE.compartirKit && !forzar) return GSTATE.compartirKit;
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${Number(GSTATE.nodo.id)}/compartir-kit`, { cache: 'no-store' });
        const data = await leerRespuestaJsonSegura(resp);
        if (resp.ok && data.ok) {
          GSTATE.compartirKit = data;
          return data;
        }
      } catch (_) {}
      return null;
    }

    function obtenerOfertasPublicadasDifusion() {
      const kitOfertas = Array.isArray(GSTATE.compartirKit?.ofertas_publicadas)
        ? GSTATE.compartirKit.ofertas_publicadas
        : [];
      if (kitOfertas.length > 0) return kitOfertas;

      const base = obtenerUrlBaseTiendaFallback();
      return (GSTATE.ofertas || [])
        .filter(o => o.publicado_tienda)
        .map(o => ({
          oferta_id: Number(o.id),
          sku_nodo: o.sku_nodo || '',
          nombre_publico: o.nombre_publico || 'Producto',
          categoria_familiar: o.categoria_familiar || 'Almacén',
          presentacion_etiqueta: o.presentacion_etiqueta || '',
          kilos_unidad: Number(o.kilos_unidad || 0),
          precio_venta_vecino: Number(o.precio_venta_vecino || 0),
          destacado_tienda: Boolean(o.destacado_tienda),
          url_directa: `${base}?oferta=${Number(o.id)}`
        }));
    }

    function obtenerUrlBaseTiendaFallback() {
      if (GSTATE.compartirKit?.url_tienda_publica) {
        return GSTATE.compartirKit.url_tienda_publica;
      }
      return `${window.location.origin}/tienda/${encodeURIComponent(GSTATE.slug || '')}`;
    }

    function obtenerUrlDifusionActual() {
      const base = obtenerUrlBaseTiendaFallback();
      if (GSTATE.difusionModo === 'oferta') {
        const ofertas = obtenerOfertasPublicadasDifusion();
        const of = ofertas.find(o => Number(o.oferta_id) === Number(GSTATE.difusionOfertaId)) || ofertas[0];
        if (of) {
          return of.url_directa || `${base}?oferta=${Number(of.oferta_id)}`;
        }
      }
      return base;
    }

    function generarTextoSugeridoDifusion() {
      const nombreMarca = GSTATE.compartirKit?.nodo?.nombre_marca || GSTATE.nodo?.nombre_marca || 'Nuestra tienda';
      const url = obtenerUrlDifusionActual();
      const prox = GSTATE.compartirKit?.proxima_entrega?.asignada?.label_completo
        || GSTATE.proximaEntrega?.asignada?.label_completo
        || '';
      const corte = GSTATE.compartirKit?.proxima_entrega?.asignada?.label_corte
        || GSTATE.proximaEntrega?.asignada?.label_corte
        || '';

      if (GSTATE.difusionModo === 'oferta') {
        const ofertas = obtenerOfertasPublicadasDifusion();
        const of = ofertas.find(o => Number(o.oferta_id) === Number(GSTATE.difusionOfertaId)) || ofertas[0];
        if (of) {
          const pres = String(of.presentacion_etiqueta || '').trim();
          const descPres = pres && !String(of.nombre_publico || '').toLowerCase().includes(pres.toLowerCase())
            ? ` (${pres})`
            : '';
          return [
            `✨ *${nombreMarca}*`,
            `¡Hola! Te comparto esta opción disponible hoy: *${of.nombre_publico}${descPres}* a *${fmt(of.precio_venta_vecino)}* 🛒`,
            `Podés ver detalles y pedirlo directo acá:`,
            url,
            prox ? `📅 Próxima entrega: ${prox}${corte ? ` · Cierre: ${corte}` : ''}` : ''
          ].filter(Boolean).join('\n');
        }
      }

      return [
        `✨ *${nombreMarca}*`,
        `¡Hola! Te comparto el link de nuestra tienda para ver los productos disponibles y hacer tu pedido online:`,
        url,
        prox ? `📅 *Próxima entrega:* ${prox}` : '',
        corte ? `⏰ *Cierre de pedidos:* ${corte}` : '',
        `💬 Si querés consultar o sumar algo, respondeme por acá.`
      ].filter(Boolean).join('\n');
    }

    function copiarLinkTiendaVecinos() {
      const url = obtenerUrlBaseTiendaFallback();
      navigator.clipboard?.writeText(url)
        .then(() => mostrarAvisoPantallaGestor(`✅ Link de tu tienda copiado: ${url}`, 'ok'))
        .catch(() => abrirModalDifusionTienda(0));
    }

    let _ultimoPayloadWaGestor = null;

    function copiarMensajeWaDirectoGestor() {
      if (!_ultimoPayloadWaGestor?.mensaje) return;
      navigator.clipboard?.writeText(_ultimoPayloadWaGestor.mensaje)
        .then(() => mostrarAvisoPantallaGestor('✅ Mensaje copiado al portapapeles.', 'ok'))
        .catch(() => {});
    }

    async function abrirModalDespachoWhatsAppGestor({ destinatario_nombre, telefono_original, mensaje, titulo, subtitulo }) {
      const modal = document.getElementById('modal-recibo-gestor');
      const body = document.getElementById('modal-recibo-gestor-body');
      if (!modal || !body) return;

      const telClean = String(telefono_original || '').replace(/\D/g, '');
      const telWa = telClean ? (telClean.startsWith('54') ? telClean : `549${telClean}`) : '';
      const esEntornoLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

      const mostrarModalWaDirecto = (msgTexto) => {
        _ultimoPayloadWaGestor = { destinatario_nombre, telefono_original, mensaje: msgTexto, titulo, subtitulo };
        const waHref = `https://wa.me/${telWa}?text=${encodeURIComponent(msgTexto)}`;
        body.innerHTML = `
          <div style="background:var(--surface-warm); color:var(--text); padding:16px 20px; border-bottom:1px solid var(--border);">
            <div style="font-size:0.72rem; font-weight:800; text-transform:uppercase; color:var(--brand-dark);">Compartir por WhatsApp</div>
            <div style="font-size:1.06rem; font-weight:900; margin-top:2px;">📲 ${esc(titulo)}</div>
            <div style="font-size:0.78rem; color:var(--muted); margin-top:2px;">${esc(subtitulo || '')}</div>
          </div>
          <div style="padding:18px 20px; background:#fff; color:var(--text); font-size:0.84rem;">
            <pre style="white-space:pre-wrap; word-break:break-word; padding:10px; border-radius:10px; background:var(--bg); border:1px solid var(--border); color:var(--text); font-size:0.78rem; font-family:inherit; margin:0 0 12px 0; max-height:190px; overflow-y:auto;">${esc(msgTexto)}</pre>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <a href="${esc(waHref)}" target="_blank" rel="noopener" class="btn-primary" style="flex:1; text-align:center; text-decoration:none;">
                💬 Abrir en WhatsApp
              </a>
              <button type="button" onclick="copiarMensajeWaDirectoGestor()"
                class="btn-soft" style="padding:11px 14px;">
                📋 Copiar
              </button>
              <button type="button" onclick="cerrarModalReciboGestor()" class="btn-soft" style="padding:11px 14px;">
                Cerrar
              </button>
            </div>
          </div>
        `;
        modal.style.display = 'flex';
      };

      if (!esEntornoLocal) {
        mostrarModalWaDirecto(mensaje);
        return;
      }

      const respPrev = await fetch('/api/produccion/nodos/whatsapp-prueba', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          destinatario_nombre,
          telefono_original,
          mensaje,
          solo_preview: true
        })
      });
      if (respPrev.status === 403) {
        mostrarModalWaDirecto(mensaje);
        return;
      }
      const data = await respPrev.json();
      if (!respPrev.ok || !data.ok) {
        mostrarModalWaDirecto(mensaje);
        return;
      }

      _ultimoPayloadWaGestor = {
        destinatario_nombre,
        telefono_original,
        mensaje: data.mensaje_enviado || mensaje,
        titulo,
        subtitulo
      };

      const links = Array.isArray(data?.links_detectados) ? data.links_detectados : [];
      body.innerHTML = `
        <div style="background:var(--surface-warm); color:var(--text); padding:16px 20px; border-bottom:1px solid var(--border);">
          <div style="font-size:0.72rem; font-weight:800; text-transform:uppercase; color:var(--brand-dark);">Envío por WhatsApp</div>
          <div style="font-size:1.06rem; font-weight:900; margin-top:2px;">📲 ${esc(titulo)}</div>
          <div style="font-size:0.78rem; color:var(--muted); margin-top:2px;">${esc(subtitulo || '')}</div>
        </div>
        <div style="padding:18px 20px; background:#fff; color:var(--text); font-size:0.84rem;">
          <div id="wa-gestor-status-banner" style="padding:10px 12px; border-radius:10px; background:var(--ok-soft); border:1px solid rgba(47,111,78,0.28); color:var(--ok); margin-bottom:10px;">
            📋 <strong>Revisá el mensaje antes de enviar</strong><br>
            🛡️ Destino de prueba en Laboratorio: <strong>${esc(data?.telefono_destino_display || '221 661 5746')}</strong>
          </div>
          <pre style="white-space:pre-wrap; word-break:break-word; padding:10px; border-radius:10px; background:var(--bg); border:1px solid var(--border); color:var(--text); font-size:0.78rem; font-family:inherit; margin:0 0 12px 0; max-height:170px; overflow-y:auto;">${esc(data?.mensaje_enviado || '')}</pre>
          ${links.length > 0 ? `
            <div style="text-align:center; padding:10px; border-radius:10px; background:var(--bg); border:1px solid var(--border); margin-bottom:12px;">
              <div style="font-size:0.74rem; font-weight:800; color:var(--muted); margin-bottom:6px;">Código QR de acceso rápido</div>
              ${links[0].qr_data_url ? `<img src="${links[0].qr_data_url}" alt="QR Tienda" style="width:124px; height:124px; border-radius:8px;">` : ''}
            </div>
          ` : ''}
          <div id="wa-gestor-actions-box" style="display:flex; gap:8px;">
            <button type="button" id="btn-confirmar-wa-gestor" onclick="confirmarEnvioRealWhatsAppGestor()"
              class="btn-primary" style="flex:1;">
              📲 Enviar
            </button>
            <button type="button" onclick="cerrarModalReciboGestor()"
              class="btn-soft" style="padding:11px 16px;">
              Cancelar
            </button>
          </div>
        </div>
      `;
      modal.style.display = 'flex';
    }

    async function confirmarEnvioRealWhatsAppGestor() {
      if (!_ultimoPayloadWaGestor) return;
      const btn = document.getElementById('btn-confirmar-wa-gestor');
      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Enviando...';
      }
      const resp = await fetch('/api/produccion/nodos/whatsapp-prueba', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          destinatario_nombre: _ultimoPayloadWaGestor.destinatario_nombre,
          telefono_original: _ultimoPayloadWaGestor.telefono_original,
          mensaje: _ultimoPayloadWaGestor.mensaje,
          solo_preview: false
        })
      });
      const data = await resp.json();
      if (!resp.ok || !data.ok) {
        alert('Error al enviar WhatsApp: ' + (data.error || 'Error interno'));
        if (btn) {
          btn.disabled = false;
          btn.textContent = '📲 Enviar';
        }
        return;
      }
      const banner = document.getElementById('wa-gestor-status-banner');
      if (banner) {
        banner.innerHTML = `✅ <strong>¡Mensaje enviado con éxito por WhatsApp!</strong><br>🛡️ Entregado en <strong>${esc(data?.telefono_destino_display || '221 661 5746')}</strong>`;
      }
      const actionsBox = document.getElementById('wa-gestor-actions-box');
      if (actionsBox) {
        actionsBox.innerHTML = `
          <button type="button" onclick="cerrarModalReciboGestor()" class="btn-primary" style="width:100%;">
            Cerrar
          </button>
        `;
      }
    }

    function abrirModalDifusionTienda(ofertaIdInicial = 0) {
      if (!GSTATE.nodo) return;
      const modal = document.getElementById('modal-recibo-gestor');
      const body = document.getElementById('modal-recibo-gestor-body');
      if (!modal || !body) return;

      const ofertasPub = obtenerOfertasPublicadasDifusion();
      if (Number(ofertaIdInicial) > 0) {
        GSTATE.difusionModo = 'oferta';
        GSTATE.difusionOfertaId = Number(ofertaIdInicial);
      } else {
        GSTATE.difusionModo = 'tienda';
        if (!GSTATE.difusionOfertaId && ofertasPub[0]) {
          GSTATE.difusionOfertaId = Number(ofertasPub[0].oferta_id);
        }
      }

      renderizarCuerpoModalDifusion(false);
      modal.style.display = 'flex';

      if (!GSTATE.compartirKit) {
        cargarKitCompartirGestor(false).then(() => {
          const modalActual = document.getElementById('modal-recibo-gestor');
          if (modalActual && modalActual.style.display !== 'none') {
            renderizarCuerpoModalDifusion(false);
          }
        });
      }
    }

        }

            <img src="${qrDataUrl}" alt="QR Público ${esc(nombreMarca)}"

            <div style="margin-top:12px; font-size:0.78rem; color:var(--brand-dark); font-weight:800; word-break:break-all;">

          <button type="button" onclick="cerrarModalReciboGestor()"
            style="background:#fff; border:1px solid var(--border); color:var(--text); width:32px; height:32px; border-radius:999px; font-weight:900; cursor:pointer; flex-shrink:0;">✕</button>

              🏪 Tienda completa
            </button>
            <button type="button"
              onclick="cambiarModoDifusionTienda('oferta')"
              style="flex:1; min-width:130px; padding:9px 12px; border-radius:10px; font-weight:800; font-size:0.84rem; cursor:pointer; border:1px solid ${GSTATE.difusionModo === 'oferta' ? 'var(--brand)' : 'var(--border)'}; background:${GSTATE.difusionModo === 'oferta' ? 'var(--brand-soft)' : '#fff'}; color:${GSTATE.difusionModo === 'oferta' ? 'var(--brand-dark)' : 'var(--text)'};">

            </button>

              <button type="button" class="btn-soft" onclick="compartirKitNativo()" style="padding:10px 14px;">
                📲 Más apps
              </button>

              <button type="button" class="btn-soft" onclick="compartirKitNativo()" style="padding:10px 14px;">
                📋 Copiar texto completo
              </button>

            <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap; background:var(--surface-warm); border:1px solid var(--border); border-radius:14px; padding:12px 14px;">
              <div style="width:92px; height:92px; border-radius:10px; background:#fff; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden;">
                ${qrDataUrl
                  ? `<img id="difusion-qr-img" src="${qrDataUrl}" alt="QR Público ${esc(nombreMarca)}" style="width:88px; height:88px; display:block;">`

    function cambiarModoDifusionTienda(modo) {
      GSTATE.difusionModo = modo === 'oferta' ? 'oferta' : 'tienda';
      if (GSTATE.difusionModo === 'oferta' && !GSTATE.difusionOfertaId) {
        const first = obtenerOfertasPublicadasDifusion()[0];
        if (first) GSTATE.difusionOfertaId = Number(first.oferta_id);
      }
      renderizarCuerpoModalDifusion(false);
    }

    function seleccionarOfertaDifusionTienda(ofertaId) {
      GSTATE.difusionOfertaId = Number(ofertaId || 0);
      renderizarCuerpoModalDifusion(false);
    }

    function restablecerTextoDifusionTienda() {
      const ta = document.getElementById('difusion-texto-textarea');
      if (ta) {
        ta.value = generarTextoSugeridoDifusion();

    function copiarUrlDifusionDirecta() {
      const inp = document.getElementById('difusion-link-input');
      const url = (inp?.value || obtenerUrlDifusionActual()).trim();
      navigator.clipboard?.writeText(url)
        .then(() => mostrarAvisoPantallaGestor(`✅ Link copiado: ${url}`, 'ok'))
        .catch(() => mostrarAvisoPantallaGestor('No se pudo copiar automáticamente; seleccionalo desde la casilla.', 'error'));
    }

    function abrirWhatsAppDifusionLibre() {
      const ta = document.getElementById('difusion-texto-textarea');
      const texto = (ta?.value || generarTextoSugeridoDifusion()).trim();
      const waHref = `https://wa.me/?text=${encodeURIComponent(texto)}`;
      window.open(waHref, '_blank', 'noopener');
    }

    async function compartirKitNativo() {
      const ta = document.getElementById('difusion-texto-textarea');
      const texto = (ta?.value || generarTextoSugeridoDifusion()).trim();
      const url = obtenerUrlDifusionActual();
      const nombreMarca = GSTATE.compartirKit?.nodo?.nombre_marca || GSTATE.nodo?.nombre_marca || 'Tienda';

      if (navigator.share) {
        try {
          await navigator.share({
            title: nombreMarca,
            text: texto,
            url
          });
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }
      }

      try {
        await navigator.clipboard.writeText(texto);
        mostrarAvisoPantallaGestor('✅ Mensaje + enlace copiados al portapapeles.', 'ok');
      } catch (_) {
        mostrarAvisoPantallaGestor('Copiá el mensaje desde el cuadro de texto.', 'error');
      }
    }

    function descargarQrTiendaMarcaBlanca() {
      const dataUrl = GSTATE.compartirKit?.qr_tienda_data_url || '';
      if (!dataUrl) {
        mostrarAvisoPantallaGestor('El QR todavía se está generando, probá en un segundo.', 'error');
        return;
      }
      const slugClean = String(GSTATE.slug || 'tienda').replace(/[^a-zA-Z0-9_-]+/g, '-');
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = `QR_${slugClean}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      mostrarAvisoPantallaGestor('✅ QR PNG descargado.', 'ok');
    }

      return nom.toLowerCase().includes(pres.toLowerCase()) ? nom : `${nom} (${pres})`;

      if (!p || !p.tracking_token || !GSTATE.slug) return '';
