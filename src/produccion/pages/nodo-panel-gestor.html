    function _cargarImagenCanvasGestor(src) {
      return new Promise(resolve => {
        if (!src) return resolve(null);
        const img = new Image();
        img.crossOrigin = 'anonymous';
        const timer = setTimeout(() => resolve(null), 3500);
        img.onload = () => {
          clearTimeout(timer);
          resolve(img.naturalWidth > 0 ? img : null);
        };
        img.onerror = () => {
          clearTimeout(timer);
          resolve(null);
        };
        img.src = src;
      });
    }

    function _trazarRoundRectGestor(ctx, x, y, w, h, r) {
      const rad = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rad, y);
      ctx.arcTo(x + w, y, x + w, y + h, rad);
      ctx.arcTo(x + w, y + h, x, y + h, rad);
      ctx.arcTo(x, y + h, x, y, rad);
      ctx.arcTo(x, y, x + w, y, rad);
      ctx.closePath();
    }

    async function construirAficheQrMarcaBlancaDataUrl() {
      const qrDataUrl = GSTATE.compartirKit?.qr_tienda_data_url || '';
      if (!qrDataUrl) return '';
      if (GSTATE.aficheQrDataUrl) return GSTATE.aficheQrDataUrl;

      const nodoInfo = GSTATE.compartirKit?.nodo || GSTATE.nodo || {};
      const tv = (nodoInfo.tema_visual && typeof nodoInfo.tema_visual === 'object') ? nodoInfo.tema_visual : {};
      const pal = (tv.paleta && typeof tv.paleta === 'object') ? tv.paleta : {};
      const bgOuter = pal.superficie_calida || '#F5EFE6';
      const cardBg = pal.tarjeta || '#FFFFFF';
      const accent = pal.terracota || nodoInfo.color_primario || '#a2553b';
      const ocre = pal.ocre || accent;
      const pistachoBg = pal.pistacho_suave || '#EFF4DF';
      const pistachoTxt = pal.pistacho_texto || '#43521D';
      const txtPrimary = pal.texto || '#25130b';
      const txtMuted = pal.texto_secundario || '#57453b';
      const borderCol = pal.borde || '#E7DCCB';
      const fontStack = "'Nunito', 'Segoe UI', Roboto, Arial, sans-serif";

      const verticalSrc = obtenerLogoVerticalGestor(nodoInfo);
      const [qrImg, logoImg] = await Promise.all([
        _cargarImagenCanvasGestor(qrDataUrl),
        _cargarImagenCanvasGestor(verticalSrc)
      ]);
      if (!qrImg) return qrDataUrl;

      const W = 900;
      const H = 1220;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');
      if (!ctx) return qrDataUrl;

      ctx.fillStyle = bgOuter;
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      _trazarRoundRectGestor(ctx, 44, 44, W - 88, H - 88, 38);
      ctx.fillStyle = cardBg;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = borderCol;
      ctx.stroke();
      ctx.clip();

      const grad = ctx.createLinearGradient(44, 44, W - 44, 44);
      grad.addColorStop(0, accent);
      grad.addColorStop(1, ocre);
      ctx.fillStyle = grad;
      ctx.fillRect(44, 44, W - 88, 18);
      ctx.restore();

      const nombreMarca = String(nodoInfo.nombre_marca || 'Tu Tienda').trim();
      const bajadaMarca = String(nodoInfo.bajada_marca || '').trim();
      const barrio = String(nodoInfo.barrio_zona || '').trim();
      let cursorY = 96;

      if (logoImg) {
        const maxW = 480;
        const maxH = 270;
        const scale = Math.min(maxW / logoImg.naturalWidth, maxH / logoImg.naturalHeight);
        const dw = Math.round(logoImg.naturalWidth * scale);
        const dh = Math.round(logoImg.naturalHeight * scale);
        ctx.drawImage(logoImg, Math.round((W - dw) / 2), cursorY, dw, dh);
        cursorY += dh + 22;
      } else {
        ctx.fillStyle = txtPrimary;
        ctx.textAlign = 'center';
        ctx.font = `900 54px ${fontStack}`;
        ctx.fillText(nombreMarca, W / 2, cursorY + 72, W - 160);
        cursorY += 106;
        if (bajadaMarca) {
          ctx.fillStyle = txtMuted;
          ctx.font = `700 28px ${fontStack}`;
          ctx.fillText(bajadaMarca, W / 2, cursorY + 12, W - 160);
          cursorY += 46;
        }
      }

      const esEcAfiche = esPerfilEcommerceGestor(nodoInfo);
      const subPill = esEcAfiche
        ? (bajadaMarca && logoImg ? `${nombreMarca} · ${bajadaMarca}` : '🚚 Tienda Oficial · Envíos a Todo el País')
        : (bajadaMarca && logoImg
            ? (barrio ? `${nombreMarca} · ${bajadaMarca} · 📍 ${barrio}` : `${nombreMarca} · ${bajadaMarca}`)
            : (barrio ? `📍 ${barrio} · Tienda Barrial Online` : '🛒 Tienda Barrial Online'));
      ctx.font = `800 24px ${fontStack}`;
      const pillW = Math.min(W - 140, Math.round(ctx.measureText(subPill).width) + 56);
      const pillX = Math.round((W - pillW) / 2);
      _trazarRoundRectGestor(ctx, pillX, cursorY, pillW, 48, 24);
      ctx.fillStyle = pistachoBg;
      ctx.fill();
      ctx.fillStyle = pistachoTxt;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(subPill, W / 2, cursorY + 25, pillW - 32);
      cursorY += 76;

      const qrFrameSize = 540;
      const qrFrameX = Math.round((W - qrFrameSize) / 2);
      _trazarRoundRectGestor(ctx, qrFrameX, cursorY, qrFrameSize, qrFrameSize, 28);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = borderCol;
      ctx.stroke();

      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(qrImg, qrFrameX + 24, cursorY + 24, qrFrameSize - 48, qrFrameSize - 48);
      ctx.imageSmoothingEnabled = true;
      cursorY += qrFrameSize + 34;

      const ctaW = 660;
      const ctaX = Math.round((W - ctaW) / 2);
      _trazarRoundRectGestor(ctx, ctaX, cursorY, ctaW, 68, 18);
      ctx.fillStyle = accent;
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = `900 28px ${fontStack}`;
      ctx.textBaseline = 'middle';
      ctx.fillText('Escaneá el QR para hacer tu pedido', W / 2, cursorY + 35, ctaW - 36);
      cursorY += 102;

      const urlPublica = obtenerUrlBaseTiendaFallback();
      ctx.fillStyle = txtMuted;
      ctx.font = `700 22px ${fontStack}`;
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(urlPublica, W / 2, cursorY, W - 130);

      const perfilAfiche = obtenerPerfilPublicoGestor();
      if (perfilAfiche.instagram_usuario && perfilAfiche.incluir_instagram_en_difusion) {
        ctx.fillStyle = accent;
        ctx.font = `800 24px ${fontStack}`;
        ctx.fillText(`Instagram: @${perfilAfiche.instagram_usuario}`, W / 2, cursorY + 34, W - 130);
      }

      try {
        const out = canvas.toDataURL('image/png');
        GSTATE.aficheQrDataUrl = out;
        return out;
      } catch (_) {
        return qrDataUrl;
      }
    }

    function formatearItemVecinoGestor(it) {
      const nom = String(it?.nombre_vidriera_vecino || it?.nombre_publico || '').trim() || 'Producto';
      const pres = String(it?.presentacion_etiqueta || '').trim();
      if (!pres) return nom;
      return nom.toLowerCase().includes(pres.toLowerCase()) ? nom : `${nom} (${pres})`;
    }

    function formatearItemGestor(it) {
      const sku = String(it?.sku_nodo || '').trim();
      const nomOficial = String(it?.nombre_oficial_lamda || it?.nombre_publico || '').trim() || 'Producto';
      const baseTecnica = sku && !nomOficial.startsWith(`[${sku}]`)
        ? `[${sku}] ${nomOficial}`
        : nomOficial;
      const nomVidriera = String(it?.nombre_vidriera_vecino || '').trim();
      if (nomVidriera && nomVidriera.toLowerCase() !== nomOficial.toLowerCase()) {
        return `${baseTecnica} (Vidriera: "${nomVidriera}")`;
      }
      return baseTecnica;
    }

    function obtenerUrlSeguimientoPedidoGestor(p) {
      if (!p || !p.tracking_token || !GSTATE.slug) return '';
      return `${window.location.origin}/tienda/${encodeURIComponent(GSTATE.slug)}?seguimiento=${encodeURIComponent(p.tracking_token)}`;

    async function enviarWhatsAppVecinoPedidoPrueba(pedidoId) {
      const p = (GSTATE.pedidos || []).find(x => Number(x.id) === Number(pedidoId));
      if (!p || !GSTATE.nodo) return;
      const esEcWa = esPerfilEcommerceGestor(GSTATE.nodo);
      const itemsTxt = (p.items || []).map(it => `• ${it.cantidad}x ${formatearItemVecinoGestor(it)} (${fmt(it.subtotal_vecino)})`).join('\n');
      const linkSeg = obtenerUrlSeguimientoPedidoGestor(p);
      const lineaEnvioWa = esEcWa
        ? `🚚 Envío postal: ${Number(p.cargo_envio_barrial) > 0 ? fmt(p.cargo_envio_barrial) : 'Bonificado'} (${p.direccion_entrega || ''})`
        : (Number(p.cargo_envio_barrial) > 0 ? `🛵 Envío barrial: ${fmt(p.cargo_envio_barrial)}` : `🏠 Retiro: ${GSTATE.nodo.direccion_retiro || ''}`);
      const mensaje = [
        `🌿 *${GSTATE.nodo.nombre_marca}* — Pedido #${p.codigo_pedido}`,
        `¡Hola ${p.vecino_nombre}! Te compartimos el detalle y estado de tu compra:`,
        itemsTxt,
        lineaEnvioWa,
        `💰 *Total:* ${fmt(p.total_vecino)} (${p.medio_pago === 'EFECTIVO' ? 'Efectivo en entrega' : `Transferencia al alias ${GSTATE.nodo.alias_bancario_display || ''}`})`,
        `📅 *Despacho / Entrega:* ${p.fecha_entrega_label}`,
        linkSeg ? `📍 *Seguí tu pedido acá:* ${linkSeg}` : ''
      ].filter(Boolean).join('\n');

      await abrirModalDespachoWhatsAppGestor({
        destinatario_nombre: p.vecino_nombre,
        telefono_original: p.vecino_telefono,
        mensaje,
        titulo: `Detalle Pedido #${p.codigo_pedido}`,
        subtitulo: `${esEcWa ? 'Cliente' : 'Vecino/a'}: ${p.vecino_nombre}`
      });
    }

    function renderizarDatalistFamiliasOficialesHtml() {
      const lista = [];
      const vistos = new Set();
      const agregar = (nom) => {
        const limpio = String(nom || '').trim();
        if (!limpio) return;
        const k = normalizarTextoGestor(limpio);
        if (vistos.has(k)) return;
        vistos.add(k);
        lista.push(limpio);
      };
      (GSTATE.familiasBunkerOficiales || []).forEach(f => agregar(f?.nombre || f));
      (GSTATE.ingredientesDisponibles || []).forEach(i => agregar(i?.familia_bunker_nombre || i?.categoria_lamda));
      agregar('Combos y Packs');
      lista.sort((a, b) => a.localeCompare(b, 'es'));
      return `
        <datalist id="datalist-familias-oficiales-lamda">
          ${lista.map(nom => `<option value="${esc(nom)}"></option>`).join('')}
        </datalist>
      `;
    }

    function obtenerCategoriaEfectivaOfertaGestor(of) {
      return String(
        of?.categoria_vidriera_personalizada ||
        of?.categoria_vidriera_efectiva ||
        of?.categoria_oficial_lamda ||
        of?.categoria_familiar ||
        'Almacén'
      ).trim() || 'Almacén';
    }

    function claveCategoriaOfertaGestor(catTxt) {
      return normalizarTextoGestor(String(catTxt || '').trim()).replace(/\s+/g, ' ').trim();
    }

    function obtenerCategoriasDisponiblesOfertasGestor() {
      const mapa = new Map();
      for (const itemOf of (GSTATE.ofertas || [])) {
        const label = obtenerCategoriaEfectivaOfertaGestor(itemOf);
        const key = claveCategoriaOfertaGestor(label);
        if (!key) continue;
        if (!mapa.has(key)) {
          mapa.set(key, { key, label, count: 0 });
        }
        mapa.get(key).count += 1;
      }
      return Array.from(mapa.values()).sort((a, b) => a.label.localeCompare(b.label, 'es-AR'));
    }

    function asegurarEstadoFiltrosOfertasGestor() {
      if (!['ACTIVOS', 'DESACTIVADOS', 'TODOS'].includes(GSTATE.ofertasEstadoTab)) {
        GSTATE.ofertasEstadoTab = 'TODOS';
      }
      if (GSTATE.ofertasCategoriaSel && GSTATE.ofertasCategoriaSel !== 'TODAS') {
        const cats = obtenerCategoriasDisponiblesOfertasGestor();
        if (!cats.some(c => c.key === GSTATE.ofertasCategoriaSel)) {
          GSTATE.ofertasCategoriaSel = 'TODAS';
        }
      } else {
        GSTATE.ofertasCategoriaSel = 'TODAS';
      }
    }

    function obtenerOfertasFiltradasGestor() {
      asegurarEstadoFiltrosOfertasGestor();
      const tab = GSTATE.ofertasEstadoTab || 'TODOS';
      const catKeySel = GSTATE.ofertasCategoriaSel || 'TODAS';
      const terminos = normalizarTextoGestor(GSTATE.ofertasBusquedaTexto || '')
        .split(/\s+/)
        .filter(Boolean);

      return (GSTATE.ofertas || [])
        .filter(of => {
          if (tab === 'ACTIVOS' && !of.publicado_tienda) return false;
          if (tab === 'DESACTIVADOS' && Boolean(of.publicado_tienda)) return false;
          if (catKeySel !== 'TODAS') {
            if (claveCategoriaOfertaGestor(obtenerCategoriaEfectivaOfertaGestor(of)) !== catKeySel) {
              return false;
            }
          }
          if (terminos.length > 0) {
            const bolsa = normalizarTextoGestor([
              of.sku_nodo,
              of.nombre_oficial_lamda,
              of.nombre_base_oficial,
              of.nombre_base_vidriera,
              of.nombre_publico,
              of.nombre_vidriera_personalizado,
              of.nombre_vidriera_efectivo,
              of.categoria_oficial_lamda,
              of.categoria_familiar,
              of.categoria_vidriera_personalizada,
              of.categoria_vidriera_efectiva,
              ...(Array.isArray(of.jerarquia_b2b?.ruta_compacta) ? of.jerarquia_b2b.ruta_compacta : []),
              of.bunker_rubro,
              of.bunker_subrubro,
              of.presentacion_corta,
              of.presentacion_etiqueta,
              of.narrativa_tienda,
              ...(Array.isArray(of.ingredientes_comerciales) ? of.ingredientes_comerciales : [])
            ].filter(Boolean).join(' '));
            for (const t of terminos) {
              if (!bolsa.includes(t)) return false;
            }
          }
          return true;
        })
        .slice()
        .sort((a, b) => {
          if (tab === 'TODOS' && Boolean(a.publicado_tienda) !== Boolean(b.publicado_tienda)) {
            return a.publicado_tienda ? -1 : 1;
          }
          return 0;
        });
    }

        const famNombre = String(jer.familia_nombre || of.categoria_oficial_lamda || of.categoria_familiar || 'Almacén').trim();
        const famKey = `fam_${Number(jer.familia_id || 0)}_${normalizarTextoGestor(famNombre).replace(/[^a-z0-9]+/g, '_')}`;
        const rutaCorta = (Array.isArray(jer.ruta_compacta) && jer.ruta_compacta.length > 1)
          ? jer.ruta_compacta.slice(1).join(' › ')
          : '';
        if (!gruposMap.has(clave)) {
          gruposMap.set(clave, {
            clave_producto_base: clave,
            familia_key: famKey,
            familia_id: Number(jer.familia_id || 0),
            familia_nombre: famNombre,
            ruta_b2b_corta: rutaCorta,
            nombre_base_oficial: String(of.nombre_base_oficial || of.nombre_oficial_lamda || of.nombre_publico || '').trim(),
            nombre_vidriera_grupo: String(of.nombre_vidriera_grupo || '').trim(),
            categoria_vidriera_grupo: String(of.categoria_vidriera_grupo || '').trim(),
            nombre_base_vidriera: String(of.nombre_base_vidriera || of.nombre_base_oficial || of.nombre_oficial_lamda || '').trim(),
            imagen_base_lamda: of.imagen_base_lamda || null,
            foto_propia_grupo: of.foto_propia_grupo || null,
            imagen_origen_modo_grupo: String(of.imagen_origen_modo_grupo || of.imagen_origen_modo_efectivo || 'LAMDA_BASE').toUpperCase(),
            presentaciones: []
          });
        }
        const g = gruposMap.get(clave);
        if (!g.imagen_base_lamda && of.imagen_base_lamda) g.imagen_base_lamda = of.imagen_base_lamda;
        if (!g.foto_propia_grupo && of.foto_propia_grupo) g.foto_propia_grupo = of.foto_propia_grupo;
        g.presentaciones.push(of);
      }

      const familiasMap = new Map();
      for (const g of gruposMap.values()) {
        g.presentaciones.sort((a, b) => Number(a.kilos_unidad || 0) - Number(b.kilos_unidad || 0) || Number(a.id) - Number(b.id));
        g.activas = g.presentaciones.filter(x => Boolean(x.publicado_tienda)).length;
        g.total = g.presentaciones.length;
        g.alguno_activo = g.activas > 0;
        const rep = g.presentaciones.find(x => x.portada_activa?.url) || g.presentaciones[0];
        g.portada_url = rep?.portada_activa?.url || (g.imagen_origen_modo_grupo === 'LAMDA_BASE' ? g.imagen_base_lamda?.url : (g.imagen_origen_modo_grupo === 'PROPIA' ? g.foto_propia_grupo?.url : null)) || null;

        if (!familiasMap.has(g.familia_key)) {
          familiasMap.set(g.familia_key, {
            familia_key: g.familia_key,
            familia_id: g.familia_id,
            familia_nombre: g.familia_nombre,
            grupos: [],
            total_presentaciones: 0,
            activas_presentaciones: 0
          });
        }
        const f = familiasMap.get(g.familia_key);
        f.grupos.push(g);
        f.total_presentaciones += g.total;
        f.activas_presentaciones += g.activas;
      }

      const familias = Array.from(familiasMap.values()).map(f => {
        f.grupos.sort((a, b) => a.nombre_base_oficial.localeCompare(b.nombre_base_oficial, 'es-AR'));
        return f;
      }).sort((a, b) => a.familia_nombre.localeCompare(b.familia_nombre, 'es-AR'));

      const gruposOrdenados = Array.from(gruposMap.values()).sort((a, b) =>
        a.familia_nombre.localeCompare(b.familia_nombre, 'es-AR') ||
        a.nombre_base_oficial.localeCompare(b.nombre_base_oficial, 'es-AR')
      );

      return { familias, grupos: gruposOrdenados };
    }

    async function cambiarPublicacionGrupoGestor(claveBase, publicar, ctrlEl) {
      if (!GSTATE.nodo?.id || !claveBase) return;
      if (ctrlEl) ctrlEl.disabled = true;
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/grupos/publicacion`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ clave_producto_base: claveBase, publicado_tienda: Boolean(publicar) })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          if (ctrlEl) { ctrlEl.disabled = false; ctrlEl.checked = !publicar; }
          mostrarAvisoPantallaGestor('No se pudo actualizar el grupo: ' + (data.error || `HTTP ${resp.status}`), 'error');
          return;
        }
        await cargarPanelGestor();
        mostrarAvisoPantallaGestor(
          publicar
            ? `🟢 Producto activado completo (${data.actualizadas || 1} presentaciones visibles).`
            : `⏸️ Producto pausado completo (${data.actualizadas || 1} presentaciones ocultas).`,
          'ok'
        );
      } catch (_) {
        if (ctrlEl) { ctrlEl.disabled = false; ctrlEl.checked = !publicar; }
        mostrarAvisoPantallaGestor('Falla de red al actualizar la publicación del grupo.', 'error');
      }
    }

    async function guardarConfigGrupoVidrieraGestor(claveBase, patchObj) {
      if (!GSTATE.nodo?.id || !claveBase) return false;
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/grupos/config`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ clave_producto_base: claveBase, ...patchObj })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo guardar configuración del producto: ' + (data.error || `HTTP ${resp.status}`), 'error');
          return false;
        }
        await cargarPanelGestor();
        return true;
      } catch (_) {
        mostrarAvisoPantallaGestor('Falla de red al guardar configuración del grupo.', 'error');
        return false;
      }
    }

    async function seleccionarModoImagenGrupoGestor(claveBase, modo) {
      const ok = await guardarConfigGrupoVidrieraGestor(claveBase, {
        imagen_origen_modo: modo,
        resetear_overrides_imagen_ofertas: true
      });
      if (ok) {
        const msg = modo === 'LAMDA_BASE'
          ? '🏛️ Imagen configurada para mostrar la foto por defecto de LAMDA.'
          : (modo === 'PROPIA'
            ? '📷 Modo de foto propia seleccionado.'
            : '🚫 Imagen oculta para todo el producto y sus presentaciones.');
        mostrarAvisoPantallaGestor(msg, 'ok');
      }
    }

    function dispararSubidaFotoGrupoGestor(claveBase) {
      GSTATE._pendienteFotoGrupoClave = claveBase;
      let inp = document.getElementById('input-foto-grupo-gestor');
      if (!inp) {
        inp = document.createElement('input');
        inp.type = 'file';
        inp.id = 'input-foto-grupo-gestor';
        inp.accept = 'image/*';
        inp.style.display = 'none';
        document.body.appendChild(inp);
      }
      inp.value = '';
      inp.onchange = async () => {
        const file = inp.files && inp.files[0];
        const clave = GSTATE._pendienteFotoGrupoClave;
        GSTATE._pendienteFotoGrupoClave = '';
        if (!file || !clave || !GSTATE.nodo?.id) return;
        const fd = new FormData();
        fd.append('clave_producto_base', clave);
        fd.append('foto', file);
        try {
          const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/grupos/foto`, {
            method: 'POST',
            body: fd
          });
          const data = await leerRespuestaJsonSegura(resp);
          if (!resp.ok || !data.ok) {
            mostrarAvisoPantallaGestor('No se pudo subir la foto del producto: ' + (data.error || `HTTP ${resp.status}`), 'error');
            return;
          }
          await cargarPanelGestor();
          mostrarAvisoPantallaGestor('📷 Foto propia aplicada a todas las presentaciones del producto.', 'ok');
        } catch (_) {
          mostrarAvisoPantallaGestor('Error de red al subir la foto del producto.', 'error');
        }
      };
      inp.click();
    }

    async function sumarCatalogoBaseAMiOferta(catalogoId, abrirOfertasDespues = false) {
      if (!GSTATE.nodo || !catalogoId) return;
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${GSTATE.nodo.id}/sumar-catalogo`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ catalogo_id: Number(catalogoId) })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo sumar el producto: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          return;
        }
        await cargarPanelGestor();
        mostrarAvisoPantallaGestor('✓ Producto sumado a Mi Oferta y Márgenes.', 'ok');
        if (abrirOfertasDespues) {
          abrirSeccionGestor('ofertas');
        }
      } catch (err) {
        mostrarAvisoPantallaGestor('Falla de conexión al intentar sumar el producto. Verificá tu señal e intentá de nuevo.', 'error');
      }
    }

    async function guardarCambioOferta(ofertaId, body) {
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/ofertas-gestor/${ofertaId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo guardar el cambio: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          return false;
        }
        await cargarPanelGestor();
        return true;
      } catch (_) {
        mostrarAvisoPantallaGestor('Falla de comunicación al guardar la oferta.', 'error');
        return false;
      }
    }

    async function cambiarEstadoPublicacionOferta(ofertaId, publicar, ctrlEl) {
      if (ctrlEl && ctrlEl.disabled) return;
      const esCheckbox = Boolean(ctrlEl && ctrlEl.tagName === 'INPUT' && ctrlEl.type === 'checkbox');
      const textoOriginal = (!esCheckbox && ctrlEl) ? ctrlEl.textContent : '';
      if (ctrlEl) {
        ctrlEl.disabled = true;
        if (!esCheckbox) {
          ctrlEl.textContent = publicar ? 'Activando...' : 'Actualizando...';
        }
      }
      const ok = await guardarCambioOferta(ofertaId, { publicado_tienda: Boolean(publicar) });
      if (!ok && ctrlEl) {
        ctrlEl.disabled = false;
        if (esCheckbox) {
          ctrlEl.checked = !publicar;
        } else {
          ctrlEl.textContent = textoOriginal;
        }
        return;
      }
      if (ok) {
        mostrarAvisoPantallaGestor(
          publicar
            ? '🟢 Producto activado y visible para tus clientes.'
            : '⏸️ Producto desactivado (sigue guardado en tu catálogo).',
          'ok'
        );
      }
    }

    function obtenerAlicuotasFiscalesGestor() {
      const ivaRaw = Number(GSTATE.nodo?.alicuota_iva_margen_pct ?? 21);
      const iibbRaw = Number(GSTATE.nodo?.alicuota_iibb_margen_pct ?? 4);
      const iva = Number.isFinite(ivaRaw) && ivaRaw >= 0 ? ivaRaw : 21;
      const iibb = Number.isFinite(iibbRaw) && iibbRaw >= 0 ? iibbRaw : 4;
      const factorNeto = Math.max(0.01, (1 / (1 + iva / 100)) - (iibb / 100));
      return { iva, iibb, factorNeto };
    }

    function formatearPorcentajeCortoGestor(val) {
      const n = Number(val || 0);
      return Number.isInteger(n) ? String(n) : String(Number(n.toFixed(2))).replace('.', ',');
    }

    function obtenerLeyendaFiscalMargenGestor() {
      const { iva, iibb } = obtenerAlicuotasFiscalesGestor();
      return `Tu ganancia limpia ya descuenta IVA (${formatearPorcentajeCortoGestor(iva)}%) e IIBB (${formatearPorcentajeCortoGestor(iibb)}%) sobre el margen.`;
    }

    function calcularDesdeMargenPctGestor(costoBase, margenPct) {
      const base = Math.max(0, Math.round(Number(costoBase || 0)));
      const m = Math.max(0, Number(Number(margenPct || 0).toFixed(2)));
      const { factorNeto } = obtenerAlicuotasFiscalesGestor();
      const precioTienda = Math.max(base, Math.round(base * (1 + m / 100)));
      const gananciaLimpia = Math.round(Math.max(0, precioTienda - base) * factorNeto);
      return { margen_pct: m, precio_tienda: precioTienda, ganancia_limpia: gananciaLimpia };
    }

    function calcularDesdeGananciaLimpiaGestor(costoBase, gananciaDeseada) {
      const base = Math.max(0, Math.round(Number(costoBase || 0)));
      const gan = Math.max(0, Number(gananciaDeseada || 0));
      const { factorNeto } = obtenerAlicuotasFiscalesGestor();
      const excedenteNecesario = gan / factorNeto;
      const precioTienda = Math.max(base, Math.round(base + excedenteNecesario));
      const margenPct = base > 0 ? Number((((precioTienda - base) / base) * 100).toFixed(2)) : 0;
      const gananciaLimpia = Math.round(Math.max(0, precioTienda - base) * factorNeto);
      return { margen_pct: margenPct, precio_tienda: precioTienda, ganancia_limpia: gananciaLimpia };
    }

    function alEditarMargenOfertaEnVivo(ofertaId, costoBase, rawValor) {
      const calc = calcularDesdeMargenPctGestor(costoBase, rawValor);
      const precioEl = document.querySelector(`[data-oferta-precio-tienda="${ofertaId}"]`);
      if (precioEl) precioEl.textContent = fmt(calc.precio_tienda);
      const ganInp = document.querySelector(`[data-oferta-input-ganancia="${ofertaId}"]`);
      if (ganInp && document.activeElement !== ganInp) {
        ganInp.value = String(calc.ganancia_limpia);
      }
    }

    function alEditarGananciaLimpiaOfertaEnVivo(ofertaId, costoBase, rawValor) {
      const calc = calcularDesdeGananciaLimpiaGestor(costoBase, rawValor);
      const precioEl = document.querySelector(`[data-oferta-precio-tienda="${ofertaId}"]`);
      if (precioEl) precioEl.textContent = fmt(calc.precio_tienda);
      const margInp = document.querySelector(`[data-oferta-input-margen="${ofertaId}"]`);
      if (margInp && document.activeElement !== margInp) {
        margInp.value = String(calc.margen_pct);
      }
    }

    function sincronizarOfertaActualizadaEnMemoriaYDom(ofertaId, ofData) {
      if (!ofData) return;
      const idx = (GSTATE.ofertas || []).findIndex(o => Number(o.id) === Number(ofertaId));
      if (idx >= 0) {
        GSTATE.ofertas[idx] = {
          ...GSTATE.ofertas[idx],
          margen_gestor_pct: Number(ofData.margen_gestor_pct),
          precio_venta_vecino: Number(ofData.precio_venta_vecino),
          ganancia_unitaria_gestor: Number(ofData.ganancia_unitaria_gestor)
        };
      }
      const precioEl = document.querySelector(`[data-oferta-precio-tienda="${ofertaId}"]`);
      if (precioEl) precioEl.textContent = fmt(ofData.precio_venta_vecino);
      const margInp = document.querySelector(`[data-oferta-input-margen="${ofertaId}"]`);
      if (margInp && document.activeElement !== margInp) {
        margInp.value = String(Number(Number(ofData.margen_gestor_pct || 0).toFixed(2)));
      }
      const ganInp = document.querySelector(`[data-oferta-input-ganancia="${ofertaId}"]`);
      if (ganInp && document.activeElement !== ganInp) {
        ganInp.value = String(Math.round(Number(ofData.ganancia_unitaria_gestor || 0)));
      }
    }

    async function guardarMargenOfertaGestor(ofertaId, costoBase, rawValor) {
      const margen = Math.max(0, Number(Number(rawValor || 0).toFixed(2)));
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/ofertas-gestor/${ofertaId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ margen_gestor_pct: margen })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo guardar el margen: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          return false;
        }
        sincronizarOfertaActualizadaEnMemoriaYDom(ofertaId, data.oferta);
        const margInp = document.querySelector(`[data-oferta-input-margen="${ofertaId}"]`);
        if (margInp && data.oferta) margInp.value = String(Number(Number(data.oferta.margen_gestor_pct || 0).toFixed(2)));
        return true;
      } catch (_) {
        mostrarAvisoPantallaGestor('Falla de comunicación al guardar el margen.', 'error');
        return false;
      }
    }

    async function guardarGananciaLimpiaOfertaGestor(ofertaId, costoBase, rawValor) {
      const gananciaDeseada = Math.max(0, Math.round(Number(rawValor || 0)));
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/ofertas-gestor/${ofertaId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ganancia_neta_deseada: gananciaDeseada })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo guardar la ganancia: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          return false;
        }
        sincronizarOfertaActualizadaEnMemoriaYDom(ofertaId, data.oferta);
        const ganInp = document.querySelector(`[data-oferta-input-ganancia="${ofertaId}"]`);
        if (ganInp && data.oferta) ganInp.value = String(Math.round(Number(data.oferta.ganancia_unitaria_gestor || 0)));
        return true;
      } catch (_) {
        mostrarAvisoPantallaGestor('Falla de comunicación al guardar la ganancia.', 'error');
        return false;
      }
    }

    // -------------------------------------------------------------------------
    // 2. PEDIR NUEVA FRACCIÓN (CONECTADO DETERMINÍSTICAMENTE A INGREDIENTES LAMDA)
    // -------------------------------------------------------------------------
    function normalizarTextoGestor(str) {
      return String(str ?? '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase();
    }

    function formatearPesoCortoGestor(kilos) {
      const kg = Number(kilos || 0);
      const gramos = Math.round(kg * 1000);
      if (gramos >= 1000 && gramos % 1000 === 0) return `${gramos / 1000} kg`;
      if (gramos >= 1000) return `${Number(kg.toFixed(2))} kg`;
      return `${gramos}g`;
    }

    function obtenerIngredientesFiltradosGestor(categoria, filtroTexto) {
      const listaCat = (GSTATE.ingredientesDisponibles || []).filter(
        i => String(i.familia_bunker_nombre || i.categoria_lamda || i.categoria_gestor || '') === String(categoria || '')
      );
      const terminos = normalizarTextoGestor(filtroTexto).split(/\s+/).filter(Boolean);
      if (terminos.length === 0) return listaCat;
      return listaCat.filter(i => {
        const bolsa = normalizarTextoGestor(
          `${i.id} ${i.codigo || ''} ${i.nombre_oficial || ''} ${i.label_oficial || ''} ${i.nombre_claro || ''} ${i.familia_bunker_nombre || i.categoria_lamda || ''} ${i.articulo_principal_bunker || ''} ${i.articulo_vinculado_numero || ''} ${i.bunker_sku_referencia || ''}`
        );
        return terminos.every(t => bolsa.includes(t));
      });
    }

    function obtenerIngredienteSeleccionadoGestor() {
      if (!GSTATE.propCategoriaSel || !GSTATE.propIngredienteIdSel) return null;
      return (GSTATE.ingredientesDisponibles || []).find(
        i => Number(i.id) === Number(GSTATE.propIngredienteIdSel) &&
             String(i.familia_bunker_nombre || i.categoria_lamda || i.categoria_gestor || '') === String(GSTATE.propCategoriaSel || '')
      ) || null;
    }

    function renderizarOpcionesIngredientesAgrupadasHtml(filtrados = [], selectedId = 0) {
      const gruposMap = new Map();
      for (const item of (filtrados || [])) {
        const rawAncla = String(item.articulo_principal_bunker || '').trim() || 'Otros';
        const claveAncla = normalizarTextoGestor(rawAncla) || 'otros';
        if (!gruposMap.has(claveAncla)) {
          gruposMap.set(claveAncla, { label: rawAncla, items: [] });
        }
        gruposMap.get(claveAncla).items.push(item);
      }
      const gruposOrdenados = Array.from(gruposMap.values()).sort((a, b) =>
        a.label.localeCompare(b.label, 'es')
      );
      return gruposOrdenados.map(g => {
        const itemsOrd = g.items.slice().sort((a, b) =>
          String(a.nombre_oficial || a.label_oficial || '').localeCompare(String(b.nombre_oficial || b.label_oficial || ''), 'es')
        );
        return `
          <optgroup label="${esc(g.label)} (${itemsOrd.length})">
            ${itemsOrd.map(i => `
              <option value="${i.id}" ${Number(i.id) === Number(selectedId) ? 'selected' : ''}>
                ${esc(i.label_oficial || i.nombre_claro)}
              </option>
            `).join('')}
          </optgroup>
        `;
      }).join('');
    }

    function obtenerOpcionesGramajeIngrediente(ingObj) {
      const base = ingObj && ingObj.es_pack_barritas
        ? [
            { label: 'Pack x 3 (150 g)', val: 0.15 },
            { label: 'Pack x 6 (300 g)', val: 0.30 },
            { label: 'Pack x 12 (600 g)', val: 0.60 },
            { label: 'Caja x 20 (1 kg)', val: 1.00 }
          ]
        : [
            { label: '100 g', val: 0.10 },
            { label: '150 g', val: 0.15 },
            { label: '200 g', val: 0.20 },
            { label: '250 g', val: 0.25 },
            { label: '400 g', val: 0.40 },
            { label: '500 g', val: 0.50 },
            { label: '1 kg', val: 1.00 }
          ];

      const presExistentes = Array.isArray(ingObj?.presentaciones_lamda) ? ingObj.presentaciones_lamda : [];
      for (const p of presExistentes) {
        const kv = Number(p.kilos_unidad || 0);
        if (kv > 0 && !base.some(b => Math.abs(b.val - kv) < 0.003)) {
          base.push({
            label: p.etiqueta || formatearPesoCortoGestor(kv),
            val: kv
          });
        }
      }
      base.sort((a, b) => a.val - b.val);
      return base;
    }

    function evaluarEstadoGramajeParaGestor(ingObj, kilos) {
      const idNum = Number(ingObj?.id || 0);
      const kgNum = Number(kilos || 0);
      if (!idNum || !kgNum) {
        return { tipo: 'NUEVA_DISPONIBLE' };
      }

      const enOfertaNodo = (GSTATE.ofertas || []).find(
        o => Number(o.ingrediente_origen_id) === idNum && Math.abs(Number(o.kilos_unidad) - kgNum) < 0.003
      );
      if (enOfertaNodo) {
        return { tipo: 'EN_OFERTA_NODO', oferta: enOfertaNodo };
      }

      const presLamda = (ingObj?.presentaciones_lamda || []).find(
        p => Math.abs(Number(p.kilos_unidad) - kgNum) < 0.003
      );
      if (presLamda && presLamda.en_catalogo_nodos) {
        return { tipo: 'EN_CATALOGO_NODOS', pres: presLamda };
      }

      const yaPendiente = (GSTATE.propuestas || []).find(
        p => p.estado === 'PENDIENTE_COTIZACION' &&
             Number(p.ingrediente_sugerido_id) === idNum &&
             Math.abs(Number(p.kilos_sugeridos) - kgNum) < 0.003
      );

      if (presLamda && presLamda.ya_produce_lamda) {
        return { tipo: 'YA_EXISTE_LAMDA', pres: presLamda, propuestaPendiente: yaPendiente || null };
      }

      if (yaPendiente) {
        return { tipo: 'YA_SOLICITADA', propuesta: yaPendiente };
      }

      return { tipo: 'NUEVA_DISPONIBLE' };
    }

    function elegirPrimerGramajeNuevoDisponible(ingObj) {
      if (!ingObj) return 0.25;
      const opciones = obtenerOpcionesGramajeIngrediente(ingObj);
      const preferidos = ingObj.es_pack_barritas
        ? [0.30, 0.15, 0.60, 1.00]
        : [0.25, 0.15, 0.10, 0.40, 0.20, 0.50, 1.00];

      for (const pref of preferidos) {
        const op = opciones.find(o => Math.abs(o.val - pref) < 0.003);
        if (op && evaluarEstadoGramajeParaGestor(ingObj, op.val).tipo === 'NUEVA_DISPONIBLE') {
          return op.val;
        }
      }
      const cualquieraNueva = opciones.find(o => evaluarEstadoGramajeParaGestor(ingObj, o.val).tipo === 'NUEVA_DISPONIBLE');
      return cualquieraNueva ? cualquieraNueva.val : (opciones[0] ? opciones[0].val : 0.25);
    }

    function renderResumenExistentesLamdaHtml(ingObj) {
      if (!ingObj) return '';
      const pres = Array.isArray(ingObj?.presentaciones_lamda) ? ingObj.presentaciones_lamda : [];
      if (pres.length === 0) return '';
      const badges = pres.map(p => {
        const enMiOferta = (GSTATE.ofertas || []).some(
          o => Number(o.ingrediente_origen_id) === Number(ingObj.id) && Math.abs(Number(o.kilos_unidad) - Number(p.kilos_unidad)) < 0.003
        );
        const sub = enMiOferta ? ' (en tu oferta)' : p.en_catalogo_nodos ? ' (cotizada)' : '';
        const labelOf = p.label_oficial || (p.sku ? `[${p.sku}] ${p.descripcion_generada || p.etiqueta}` : p.etiqueta);
        return `<span style="display:inline-flex; align-items:center; gap:3px; padding:2px 8px; border-radius:999px; background:#edf7f1; border:1px solid rgba(31,111,74,0.28); color:var(--ok); font-weight:800; font-size:0.71rem; max-width:100%; overflow-wrap:anywhere;">✓ ${esc(labelOf)}${esc(sub)}</span>`;
      }).join(' ');

      return `
        <details class="prop-details-compact">
          <summary>📦 Ya existen en Búnker (${pres.length}) <span>▾</span></summary>
          <div style="margin-top:6px; display:flex; flex-wrap:wrap; gap:5px;">${badges}</div>
        </details>
      `;
    }

    function renderOpcionesGramajePropuestaHtml(ingObj, kilosActuales, bloqueado = false) {
      if (bloqueado || !ingObj) return '';

      const kg = Number(kilosActuales || 0);
      const opciones = obtenerOpcionesGramajeIngrediente(ingObj);

      const pills = opciones.map(op => {
        const activo = kg > 0 && Math.abs(kg - op.val) < 0.003 && !GSTATE.propMostrarPesoManual;
        const est = evaluarEstadoGramajeParaGestor(ingObj, op.val);

        let sufijo = '';
        let estiloExtra = 'padding:8px 6px; font-size:0.78rem; text-align:center;';

        if (est.tipo === 'EN_OFERTA_NODO' || est.tipo === 'EN_CATALOGO_NODOS') {
          sufijo = ' ✓';
          estiloExtra += activo
            ? 'background:var(--ok-soft); border-color:var(--ok); color:var(--ok); font-weight:800;'
            : 'background:#f4faf6; border-color:rgba(31,111,74,0.28); color:var(--ok);';
        } else if (est.tipo === 'YA_EXISTE_LAMDA') {
          sufijo = est.propuestaPendiente ? ' ⏳' : ' ✓ Búnker';
          estiloExtra += activo
            ? 'background:#eef5f0; border-color:var(--ok); color:var(--ok); font-weight:800;'
            : 'background:#f5f6f4; border-color:#d6d3ce; color:#57534e;';
        } else if (est.tipo === 'YA_SOLICITADA') {
          sufijo = ' ⏳';
          estiloExtra += activo
            ? 'background:var(--warn-soft); border-color:rgba(180,83,9,0.45); color:var(--warn); font-weight:800;'
            : 'background:#fffbeb; border-color:rgba(180,83,9,0.26); color:var(--warn);';
        } else if (activo) {
          estiloExtra += 'background:var(--brand-soft); border-color:var(--brand); color:var(--brand-dark); font-weight:800;';
        }

        return `
          <button type="button" class="btn-soft"
            onclick="fijarGramajePropuestaGestor(${op.val})"
            style="${estiloExtra}">
            ${esc(op.label)}${esc(sufijo)}
          </button>
        `;
      }).join('');

      const btnOtro = `
        <button type="button" class="btn-soft"
          onclick="activarPesoManualPropuestaGestor()"
          style="padding:8px 6px; font-size:0.78rem; text-align:center; ${GSTATE.propMostrarPesoManual ? 'background:var(--brand-soft); border-color:var(--brand); color:var(--brand-dark); font-weight:800;' : ''}">
          ✏️ Otro
        </button>
      `;

      return pills + btnOtro;
    }

    function renderAvisoEstadoGramajeHtml(ingObj, kilos) {
      if (!ingObj || !kilos) return '';
      const est = evaluarEstadoGramajeParaGestor(ingObj, kilos);
      const etPeso = formatearPesoCortoGestor(kilos);

      if (est.tipo === 'EN_OFERTA_NODO') {
        const of = est.oferta;
        return `
          <div style="padding:11px 12px; border-radius:11px; background:var(--ok-soft); border:1px solid rgba(31,111,74,0.30); color:var(--text); font-size:0.8rem; line-height:1.45;">
            <strong style="color:var(--ok);">✓ Ya tenés ${esc(etPeso)} cotizada en tu tienda</strong> (Costo Base <strong>${fmt(of.precio_base_nodo_final)}</strong>).<br>
            No corresponde volver a pedirla: configurala o publicala desde <strong>Mi Oferta y Márgenes</strong>.
            <div style="margin-top:8px;">
              <button type="button" class="btn-soft" style="font-size:0.76rem; padding:5px 11px;" onclick="abrirSeccionGestor('ofertas')">
                Ir a Mi Oferta y Márgenes →
              </button>
            </div>
          </div>
        `;
      }

      if (est.tipo === 'EN_CATALOGO_NODOS') {
        const pres = est.pres;
        return `
          <div style="padding:11px 12px; border-radius:11px; background:var(--ok-soft); border:1px solid rgba(31,111,74,0.30); color:var(--text); font-size:0.8rem; line-height:1.45;">
            <strong style="color:var(--ok);">✓ Esta medida (${esc(etPeso)}) ya está cotizada por LAMDA</strong> (${esc(pres.label_oficial || pres.sku)} · Costo Base <strong>${fmt(pres.precio_base_nodo_final)}</strong>).<br>
            No necesitás pedir cotización; sumala directo a tu tienda:
            <div style="margin-top:8px;">
              <button type="button" class="btn-primary" style="font-size:0.78rem; padding:6px 12px;"
                onclick="sumarCatalogoBaseAMiOferta(${pres.catalogo_id}, true)">
                + Sumar a Mi Oferta y Márgenes
              </button>
            </div>
          </div>
        `;
      }

      if (est.tipo === 'YA_EXISTE_LAMDA') {
        const refSku = est.pres?.label_oficial || est.pres?.sku || etPeso;
        if (est.propuestaPendiente) {
          return `
            <div style="padding:11px 12px; border-radius:11px; background:var(--warn-soft); border:1px solid rgba(180,83,9,0.28); color:var(--warn); font-size:0.8rem; line-height:1.45;">
              <strong>⏳ Habilitación ya solicitada (${esc(est.propuestaPendiente.codigo_propuesta)})</strong><br>
              Ya pediste habilitar esta presentación oficial existente <strong>${esc(refSku)}</strong> en tu tienda.
              <div style="margin-top:8px; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
                <span style="font-size:0.74rem;">¿La enviaste por error?</span>
                <button type="button" class="btn-soft"
                  style="font-size:0.75rem; padding:5px 10px; border-color:rgba(185,28,28,0.35); color:#b91c1c; background:#fff5f5;"
                  onclick="anularPropuestaGestor(${Number(est.propuestaPendiente.id)})">
                  ✕ Anular solicitud
                </button>
              </div>
            </div>
          `;
        }
        return `
          <div style="padding:11px 12px; border-radius:11px; background:#f4faf6; border:1px solid rgba(31,111,74,0.28); color:var(--text); font-size:0.8rem; line-height:1.45;">
            <strong style="color:var(--ok);">✓ LAMDA ya produce la presentación ${esc(refSku)}</strong><br>
            No debe solicitarse como nueva fracción a crear. Elegí arriba otro gramaje que aún no exista (por ejemplo <strong>100g</strong>, <strong>150g</strong> o <strong>400g</strong>).
            <div style="margin-top:8px; padding-top:7px; border-top:1px dashed rgba(31,111,74,0.22); display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
              <span style="font-size:0.74rem; color:var(--muted);">¿Querés vender esta presentación existente ${esc(etPeso)}?</span>
              <button type="button" class="btn-soft" style="font-size:0.75rem; padding:5px 10px;"
                onclick="enviarNuevaPropuestaGestor({ solicitarHabilitacionExistente: true })">
                Pedir que la habiliten en mi tienda
              </button>
            </div>
          </div>
        `;
      }

      if (est.tipo === 'YA_SOLICITADA') {
        return `
          <div style="padding:10px 12px; border-radius:11px; background:var(--warn-soft); border:1px solid rgba(180,83,9,0.25); color:var(--warn); font-size:0.8rem; line-height:1.45;">
            <strong>⏳ Solicitud en cotización (${esc(est.propuesta.codigo_propuesta)})</strong><br>
            Esta medida de <strong>${esc(etPeso)}</strong> ya fue enviada y está pendiente de cotización.
            <div style="margin-top:8px; padding-top:7px; border-top:1px dashed rgba(180,83,9,0.25); display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
              <span style="font-size:0.74rem;">¿Te equivocaste de gramaje o producto?</span>
              <button type="button" class="btn-soft"
                style="font-size:0.75rem; padding:5px 10px; border-color:rgba(185,28,28,0.35); color:#b91c1c; background:#fff5f5;"
                onclick="anularPropuestaGestor(${Number(est.propuesta.id)})">
                ✕ Anular solicitud
              </button>
            </div>
          </div>
        `;
      }

      return '';
    }

    function formatearValorInputPesoManual(kilos, unidad) {
      const k = Number(kilos || 0);
      if (!Number.isFinite(k) || k <= 0) return '';
      if (unidad === 'kg') {
        return String(Math.round(k * 1000) / 1000);
      }
      return String(Math.round(k * 1000 * 10) / 10);
    }

    function parsearKilosDesdeTextoManual(texto, unidad) {
      const limpio = String(texto ?? '').trim().replace(',', '.').replace(/\s+/g, '');
      if (!limpio || limpio === '.' || !/^\d*(\.\d+)?$/.test(limpio)) return 0;
      const num = Number(limpio);
      if (!Number.isFinite(num) || num <= 0) return 0;
      const kilos = unidad === 'kg' ? num : (num / 1000);
      return Number(kilos.toFixed(4));
    }

    function reiniciarFormularioPropuestaGestor({ conservarConfirmacion = false } = {}) {
      GSTATE.propCategoriaSel = '';
      GSTATE.propFiltroTexto = '';
      GSTATE.propRapidoTexto = '';
      GSTATE.propIngredienteIdSel = 0;
      GSTATE.propIngredienteInicializadoId = 0;
      GSTATE.propKilosSel = 0;
      GSTATE.propPaso3Confirmado = false;
      GSTATE.propMostrarPesoManual = false;
      GSTATE.propPesoManualTexto = '';
      GSTATE.propUnidadPesoManual = 'g';
      GSTATE.propPrecioObjetivoTexto = '';
      GSTATE.propAliasVidrieraTexto = '';
      GSTATE.propComentarioTexto = '';
      GSTATE.propComboItems = [];
      GSTATE.propComboPaso1Confirmado = false;
      GSTATE.propComboFamAbiertas = new Set();
      GSTATE.propComboFiltro = '';
      GSTATE.propComboAlias = '';
      GSTATE.propComboCat = '';
      GSTATE.propComboTarget = '';
      GSTATE.propComboComentario = '';
      if (!conservarConfirmacion) {
        GSTATE.propConfirmacionReciente = '';
      }
    }

    function acompanarScrollPasoGestor(elId) {
      setTimeout(() => {
        const el = document.getElementById(elId);
        if (!el) return;
        const rect = el.getBoundingClientRect();
        const vh = window.innerHeight || document.documentElement.clientHeight || 800;
        const headerOffset = 84;
        if (rect.bottom > vh - 16 || rect.top < headerOffset) {
          const targetY = window.scrollY + rect.top - headerOffset;
          window.scrollTo({ top: Math.max(0, targetY), behavior: 'smooth' });
        }
      }, 65);
    }

    function evaluarPasosPropuestaGestor() {
      const paso1Completo = Boolean(String(GSTATE.propCategoriaSel || '').trim());
      const ingSel = paso1Completo ? obtenerIngredienteSeleccionadoGestor() : null;
      const paso2Habilitado = paso1Completo;
      const paso2Completo = Boolean(paso1Completo && ingSel);
      const paso3Habilitado = paso2Completo;
      const kilos = paso3Habilitado ? Number(GSTATE.propKilosSel || 0) : 0;
      const estGramaje = (paso3Habilitado && kilos > 0) ? evaluarEstadoGramajeParaGestor(ingSel, kilos) : null;
      const paso3MedidaDisponible = Boolean(paso3Habilitado && kilos > 0 && estGramaje && estGramaje.tipo === 'NUEVA_DISPONIBLE');
      const paso3Valido = Boolean(paso3MedidaDisponible && GSTATE.propPaso3Confirmado);
      const paso4Habilitado = paso3Valido;

      const clasePaso1 = !paso1Completo ? 'is-current' : 'is-done';
      const clasePaso2 = !paso2Habilitado ? 'is-locked' : (!paso2Completo ? 'is-current' : 'is-done');
      const clasePaso3 = !paso3Habilitado ? 'is-locked' : (!paso3Valido ? 'is-current' : 'is-done');
      const clasePaso4 = !paso4Habilitado ? 'is-locked' : 'is-current';

      return {
        paso1Completo,
        ingSel,
        paso2Habilitado,
        paso2Completo,
        paso3Habilitado,
        kilos,
        estGramaje,
        paso3MedidaDisponible,
        paso3Valido,
        paso4Habilitado,
        clasePaso1,
        clasePaso2,
        clasePaso3,
        clasePaso4
      };
    }

      if (clasePaso === 'is-locked') {

      }
      if (clasePaso === 'is-done') {
        return `<span class="prop-step-status done">✓ ${esc(textoCompletado)}</span>`;
      }
      return `<span class="prop-step-status current">${esc(textoActivo)}</span>`;

    function construirNombreFinalPropuestaGestor(ingSel, kilos) {
      if (!ingSel) return '';
      const baseTecnica = String(ingSel.label_oficial || ingSel.nombre_claro || ingSel.nombre_oficial || '').trim();
      if (!kilos || Number(kilos) <= 0) return baseTecnica;
      const etiquetaPeso = formatearPesoCortoGestor(kilos).replace(/\s+/g, '');
      return /\bx\s*\d+/i.test(baseTecnica) ? baseTecnica : `${baseTecnica} x ${etiquetaPeso}`;
    }

    function renderResumenPaso4PropuestaHtml(ev) {

      const prodTxt = ev.ingSel ? (ev.ingSel.label_oficial || ev.ingSel.nombre_claro) : 'Sin elegir aún';
      let fracTxt = 'Sin definir aún';
      if (ev.paso3Valido) {

        : '';

    function renderListaBotonesIngredientesGestorHtml(filtrados = [], selectedId = 0) {
      if (!filtrados || filtrados.length === 0) {
        return `<div style="padding:10px; font-size:0.78rem; color:var(--muted); text-align:center;">No hay ingredientes LAMDA que coincidan con ese filtro.</div>`;
      }
      const gruposMap = new Map();
      for (const item of filtrados) {
        const rawAncla = String(item.articulo_principal_bunker || '').trim() || 'Otros';
        const clave = normalizarTextoGestor(rawAncla) || 'otros';
        if (!gruposMap.has(clave)) gruposMap.set(clave, { label: rawAncla, items: [] });
        gruposMap.get(clave).items.push(item);
      }
      return Array.from(gruposMap.values())
        .sort((a, b) => a.label.localeCompare(b.label, 'es'))
        .map(g => {
          const itemsOrd = g.items.slice().sort((a, b) => String(a.nombre_oficial || '').localeCompare(String(b.nombre_oficial || ''), 'es'));
          return `
            <div style="margin-top:4px;">
              <div style="font-size:0.71rem; font-weight:900; text-transform:uppercase; letter-spacing:0.03em; color:var(--muted); margin:2px 0 4px 2px;">${esc(g.label)} (${itemsOrd.length})</div>
              <div class="prop-ing-list">
                ${itemsOrd.map(i => `
                  <button type="button" class="prop-ing-btn ${Number(i.id) === Number(selectedId) ? 'is-selected' : ''}"
                    onclick="alCambiarIngredientePropuestaGestor(${Number(i.id)})">
                    <span style="min-width:0; overflow-wrap:anywhere;">${esc(i.label_oficial || i.nombre_claro)}</span>
                    <span style="color:var(--muted); font-size:0.74rem; flex-shrink:0;">(${Array.isArray(i.presentaciones_lamda) ? i.presentaciones_lamda.length : 0}) →</span>
                  </button>
                `).join('')}
              </div>
            </div>
          `;
        }).join('');
    }

    function construirFirmaComboGestor(items = []) {
      const acum = new Map();
      for (const raw of (items || [])) {
        const sku = String(raw?.sku_nodo || '').trim().toUpperCase();
        const cant = Math.floor(Number(raw?.cantidad || 0));
        if (!sku || cant < 1) continue;
        acum.set(sku, (acum.get(sku) || 0) + cant);
      }
      return Array.from(acum.entries())
        .sort((a, b) => a[0].localeCompare(b[0], 'en'))
        .map(([s, c]) => `${s}:${c}`)
        .join('|');
    }

    function evaluarEstadoComboGestor() {
      const mapaElegibles = new Map((GSTATE.articulosElegiblesCombo || []).map(a => [String(a.sku_nodo).toUpperCase(), a]));
      const itemsDet = [];
      for (const it of (GSTATE.propComboItems || [])) {
        const base = mapaElegibles.get(String(it.sku_nodo || '').toUpperCase());
        if (!base) continue;
        const cant = Math.max(1, Math.floor(Number(it.cantidad || 1)));
        itemsDet.push({
          ...base,
          cantidad: cant,
          kilos_subtotal: Number((Number(base.kilos_unidad || 0.25) * cant).toFixed(4)),
          base_subtotal: Number((Number(base.precio_base_nodo_final || 0) * cant).toFixed(2))
        });
      }
      const paso1Listo = itemsDet.length >= 2;
      const firma = paso1Listo ? construirFirmaComboGestor(itemsDet) : '';
      const kilosTot = Number(itemsDet.reduce((s, x) => s + x.kilos_subtotal, 0).toFixed(3));
      const sumaBasesRef = Number(itemsDet.reduce((s, x) => s + x.base_subtotal, 0).toFixed(0));

      let estadoFirma = { tipo: 'NUEVA_DISPONIBLE' };
      if (paso1Listo && firma) {
        const yaCot = (GSTATE.combosCotizadosCatalogo || []).find(c => String(c.firma_combo || '') === firma);
        if (yaCot) {
          estadoFirma = yaCot.en_mi_oferta
            ? { tipo: 'EN_MI_OFERTA', combo: yaCot }
            : { tipo: 'EN_CATALOGO_DISPONIBLE', combo: yaCot };
        } else {
          const yaPend = (GSTATE.propuestasCombos || []).find(
            p => p.estado === 'PENDIENTE_COTIZACION' && String(p.firma_composicion || '') === firma
          );
          if (yaPend) {
            estadoFirma = { tipo: 'YA_PENDIENTE', propuesta: yaPend };
          }
        }
      }

      const paso1Completo = Boolean(paso1Listo && GSTATE.propComboPaso1Confirmado);
      const paso2Habilitado = paso1Completo;
      const paso2Valido = Boolean(paso2Habilitado && estadoFirma.tipo === 'NUEVA_DISPONIBLE');
      const paso3Habilitado = paso2Valido;
      const aliasLimpio = String(GSTATE.propComboAlias || '').trim();
      const puedeEnviar = Boolean(paso3Habilitado && aliasLimpio.length >= 3);

      const clasePaso1 = !paso1Completo ? 'is-current' : 'is-done';
      const clasePaso2 = !paso2Habilitado ? 'is-locked' : (!paso2Valido ? 'is-current' : 'is-done');
      const clasePaso3 = !paso3Habilitado ? 'is-locked' : 'is-current';

      return {
        itemsDet,
        paso1Completo,
        paso1ListoParaAvanzar: itemsDet.length >= 2,
        firma,
        kilosTot,
        sumaBasesRef,
        estadoFirma,
        paso2Habilitado,
        paso2Valido,
        paso3Habilitado,
        puedeEnviar,
        clasePaso1,
        clasePaso2,
        clasePaso3
      };
    }

      GSTATE.propComboPaso1Confirmado = true;
      renderVistaGestor();
      acompanarScrollPasoGestor('prop-cmb-step-2');

    function retrocederPasoComboPropuestaGestor() {
      GSTATE.propComboPaso1Confirmado = false;
      GSTATE.propComboTarget = '';
      GSTATE.propComboComentario = '';
      GSTATE.propComboAlias = '';
      GSTATE.propComboCat = '';

      acompanarScrollPasoGestor('prop-cmb-step-1');

    function toggleFamiliaComboPropuestaGestor(familiaKey) {
      const k = String(familiaKey || '').trim();
      if (!k) return;
      if (!(GSTATE.propComboFamAbiertas instanceof Set)) GSTATE.propComboFamAbiertas = new Set();
      if (GSTATE.propComboFamAbiertas.has(k)) GSTATE.propComboFamAbiertas.delete(k);
      else GSTATE.propComboFamAbiertas.add(k);
      const listEl = document.getElementById('prop-cmb-elegibles-list');
      if (listEl) listEl.innerHTML = renderListaElegiblesComboGestorHtml();
    }

    function modificarItemComboPropuestaGestor(skuNodo, delta) {
      const skuClean = String(skuNodo || '').trim();
      if (!skuClean) return;
      const idx = GSTATE.propComboItems.findIndex(x => x.sku_nodo.toUpperCase() === skuClean.toUpperCase());
      if (idx >= 0) {
        const nueva = GSTATE.propComboItems[idx].cantidad + Number(delta || 0);
        if (nueva <= 0) GSTATE.propComboItems.splice(idx, 1);
        else GSTATE.propComboItems[idx].cantidad = nueva;
      } else if (delta > 0) {
        GSTATE.propComboItems.push({ sku_nodo: skuClean, cantidad: Number(delta) });
      }
      // Reinicio en cascada si al quitar un artículo deja de cumplirse el Paso 1 (< 2 SKUs)
      if (GSTATE.propComboItems.length < 2) {
        GSTATE.propComboPaso1Confirmado = false;
        GSTATE.propComboTarget = '';
        GSTATE.propComboComentario = '';
        GSTATE.propComboAlias = '';
        GSTATE.propComboCat = '';
      }
      GSTATE.propConfirmacionReciente = '';
      renderVistaGestor();
    }

    function filtrarElegiblesComboGestor(texto) {
      GSTATE.propComboFiltro = String(texto || '');
      const listEl = document.getElementById('prop-cmb-elegibles-list');
      if (listEl) listEl.innerHTML = renderListaElegiblesComboGestorHtml();
    }

    function renderListaElegiblesComboGestorHtml() {
      const selMap = new Map((GSTATE.propComboItems || []).map(x => [x.sku_nodo.toUpperCase(), x.cantidad]));
      const terms = normalizarTextoGestor(GSTATE.propComboFiltro || '').split(/\s+/).filter(Boolean);
      const filtrados = (GSTATE.articulosElegiblesCombo || []).filter(a => {
        if (terms.length === 0) return true;
        const bolsa = normalizarTextoGestor(`${a.sku_nodo} ${a.nombre_oficial_lamda} ${a.categoria_oficial_lamda} ${a.presentacion_etiqueta || ''}`);
        return terms.every(t => bolsa.includes(t));
      });
      if (filtrados.length === 0) {
        return `<div style="padding:10px; font-size:0.78rem; color:var(--muted); text-align:center;">No encontramos artículos con ese término.</div>`;
      }

      const famMap = new Map();
      for (const a of filtrados) {
        const fam = String(a.categoria_oficial_lamda || 'Varios').trim() || 'Varios';
        if (!famMap.has(fam)) famMap.set(fam, []);
        famMap.get(fam).push(a);
      }

      const renderItemRow = a => {
        const cantSel = selMap.get(String(a.sku_nodo).toUpperCase()) || 0;
        return `
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; padding:7px 9px; border-radius:9px; border:1px solid ${cantSel > 0 ? 'var(--brand)' : 'var(--border)'}; background:${cantSel > 0 ? 'var(--brand-soft)' : '#ffffff'}; min-width:0; max-width:100%;">
            <div style="min-width:0; flex:1; overflow-wrap:anywhere;">
              <div style="font-size:0.79rem; font-weight:800; color:var(--text); line-height:1.25;">
                <code style="font-size:0.71rem; color:var(--brand-dark);">[${esc(a.sku_nodo)}]</code> ${esc(a.nombre_oficial_lamda)}
              </div>
              <div style="font-size:0.7rem; color:var(--muted);">
                Costo Base ref.: <strong>${fmt(a.precio_base_nodo_final)}</strong>
              </div>
            </div>
            ${cantSel === 0 ? `
              <button type="button" class="btn-soft" data-testid="btn-gestor-sumar-combo-${esc(a.sku_nodo)}"
                style="font-size:0.74rem; padding:5px 10px; font-weight:800; flex-shrink:0;"
                onclick="modificarItemComboPropuestaGestor('${esc(a.sku_nodo)}', 1)">
                + Sumar
              </button>
            ` : `
              <div style="display:inline-flex; align-items:center; gap:5px; flex-shrink:0;">
                <button type="button" class="btn-soft" style="padding:3px 8px; font-weight:900;" onclick="modificarItemComboPropuestaGestor('${esc(a.sku_nodo)}', -1)">−</button>
                <strong style="min-width:18px; text-align:center; font-size:0.82rem; color:var(--brand-dark);">${cantSel}</strong>
                <button type="button" class="btn-soft" style="padding:3px 8px; font-weight:900;" onclick="modificarItemComboPropuestaGestor('${esc(a.sku_nodo)}', 1)">+</button>
              </div>
            `}
          </div>
        `;
      };

      if (terms.length > 0 && filtrados.length <= 16) {
        return `<div style="display:flex; flex-direction:column; gap:6px;">${filtrados.map(renderItemRow).join('')}</div>`;
      }

      const abiertas = GSTATE.propComboFamAbiertas instanceof Set ? GSTATE.propComboFamAbiertas : new Set();
      return Array.from(famMap.entries())
        .sort((a, b) => a[0].localeCompare(b[0], 'es'))
        .map(([fam, items]) => {
          const isOpen = abiertas.has(fam) || famMap.size === 1;
          const selEnFam = items.reduce((acc, it) => acc + (selMap.get(String(it.sku_nodo).toUpperCase()) ? 1 : 0), 0);
          return `
            <div style="border:1px solid var(--border); border-radius:10px; background:#fffdfb; overflow:hidden;">
              <button type="button"
                onclick="toggleFamiliaComboPropuestaGestor('${escJs(fam)}')"
                style="width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 10px; background:${isOpen ? 'var(--surface-warm)' : '#fffdfb'}; border:none; font-family:inherit; font-size:0.8rem; font-weight:800; color:var(--text); cursor:pointer; text-align:left;">
                <span>${esc(fam)} (${items.length})${selEnFam > 0 ? ` · <span style="color:var(--brand-dark);">${selEnFam} eleg.</span>` : ''}</span>
                <span style="font-size:0.75rem; color:var(--muted);">${isOpen ? '▾' : '▸'}</span>
              </button>
              ${isOpen ? `<div style="padding:7px; display:flex; flex-direction:column; gap:6px;">${items.map(renderItemRow).join('')}</div>` : ''}
            </div>
          `;
        }).join('');
    }

    function alEditarCamposComboGestor() {
      const tEl = document.getElementById('prop-cmb-target');
      if (tEl && !tEl.disabled) GSTATE.propComboTarget = tEl.value;
      const cEl = document.getElementById('prop-cmb-comentario');
      if (cEl && !cEl.disabled) GSTATE.propComboComentario = cEl.value;
      const aEl = document.getElementById('prop-cmb-alias');
      if (aEl && !aEl.disabled) GSTATE.propComboAlias = aEl.value;
      const catEl = document.getElementById('prop-cmb-cat');
      if (catEl && !catEl.disabled) GSTATE.propComboCat = catEl.value;

      const ev = evaluarEstadoComboGestor();
      const btn = document.getElementById('btn-enviar-combo-gestor');
      if (btn) {
        btn.disabled = !ev.puedeEnviar;
        btn.style.opacity = ev.puedeEnviar ? '1' : '0.46';
      }
    }

    async function enviarPropuestaComboGestor() {
      const ev = evaluarEstadoComboGestor();
      if (!ev.puedeEnviar) {
        mostrarAvisoPantallaGestor('Completá al menos 2 artículos y el nombre comercial sugerido para tu tienda antes de enviar.', 'error');
        return;
      }
      const btn = document.getElementById('btn-enviar-combo-gestor');
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Enviando solicitud...';
      }
      try {
        const resp = await fetchGestor('/api/produccion/nodos/propuestas-combos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nodo_solicitante_id: GSTATE.nodo.id,
            items: ev.itemsDet.map((it, idx) => ({
              componente_articulo_id: it.sku_nodo,
              cantidad: it.cantidad,
              orden: idx + 1
            })),
            alias_vidriera_sugerido: String(GSTATE.propComboAlias || '').trim(),
            categoria_vidriera_sugerida: String(GSTATE.propComboCat || '').trim() || null,
            precio_objetivo_vecino: Number(GSTATE.propComboTarget || 0) || null,
            comentario_gestor: String(GSTATE.propComboComentario || '').trim() || null
          })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo enviar el combo: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'Enviar solicitud de Combo';
          }
          return;
        }
        const cod = data.propuesta?.codigo_propuesta || '';
        GSTATE.propConfirmacionReciente = `✅ ¡Solicitud de Combo enviada (${cod})! Cuando se apruebe su Costo Base aparecerá lista en Mi Oferta y Márgenes.`;
        await cargarPanelGestor({ resetPropuesta: true });
        GSTATE.propModo = 'combo';
        renderVistaGestor();
      } catch (_) {
        mostrarAvisoPantallaGestor('Error de conexión al enviar la solicitud de combo.', 'error');
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Enviar solicitud de Combo';
        }
      }
    }

    async function anularPropuestaComboGestor(propId) {
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/propuestas-combos/${Number(propId)}/anular`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nodo_id: GSTATE.nodo?.id || null })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo anular la solicitud: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          return;
        }
        GSTATE.propConfirmacionReciente = `✓ Solicitud de combo (${data.propuesta?.codigo_propuesta || ''}) anulada.`;
        mostrarAvisoPantallaGestor(GSTATE.propConfirmacionReciente, 'ok');
        await cargarPanelGestor();
        renderVistaGestor();
      } catch (_) {
        mostrarAvisoPantallaGestor('Falla de conexión al intentar anular la solicitud de combo.', 'error');
      }
    }

    async function enviarNuevaPropuestaGestor(opciones = {}) {
      const solicitarHabilitacionExistente = Boolean(opciones && opciones.solicitarHabilitacionExistente === true);
      const ingSel = obtenerIngredienteSeleccionadoGestor();
      if (!GSTATE.propCategoriaSel || !ingSel) {
        mostrarAvisoPantallaGestor('Completá primero la familia/rubro y el ingrediente oficial LAMDA antes de enviar.', 'error');
        return;
      }
      const inputManualEl = document.getElementById('prop-peso-manual');
      const unidadManual = document.getElementById('prop-peso-unidad')?.value || GSTATE.propUnidadPesoManual || 'g';
      const kilos = inputManualEl && String(inputManualEl.value).trim() !== ''
        ? parsearKilosDesdeTextoManual(inputManualEl.value, unidadManual)
        : Number(GSTATE.propKilosSel || 0);
      if (!kilos || kilos <= 0) {
        mostrarAvisoPantallaGestor('Definí primero una fracción válida mayor a 0.', 'error');
        return;
      }
      GSTATE.propKilosSel = kilos;

      const est = evaluarEstadoGramajeParaGestor(ingSel, kilos);
      if (est.tipo === 'EN_OFERTA_NODO' || est.tipo === 'EN_CATALOGO_NODOS') {
        mostrarAvisoPantallaGestor('Esta presentación ya está cotizada; podés verla o sumarla desde Mi Oferta y Márgenes.', 'error');
        return;
      }
      if (est.tipo === 'YA_EXISTE_LAMDA' && !solicitarHabilitacionExistente) {
        mostrarAvisoPantallaGestor('LAMDA ya produce esta presentación. Elegí otro gramaje nuevo o usá la opción para pedir que la habiliten en tu tienda.', 'error');
        return;
      }
      if (est.tipo === 'YA_SOLICITADA' || (est.tipo === 'YA_EXISTE_LAMDA' && est.propuestaPendiente)) {
        mostrarAvisoPantallaGestor('Esta presentación ya fue solicitada y se encuentra en cotización.', 'error');
        return;
      }

      const nombreConPeso = construirNombreFinalPropuestaGestor(ingSel, kilos);
      const aliasVidrieraInput = String((document.getElementById('prop-alias-vidriera')?.value ?? GSTATE.propAliasVidrieraTexto) || '').trim();

      const btn = document.getElementById('btn-enviar-propuesta-gestor');
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Enviando solicitud...';
      }

      const comentarioInput = String((document.getElementById('prop-comentario')?.value ?? GSTATE.propComentarioTexto) || '').trim();
      const comentarioFinal = solicitarHabilitacionExistente && !comentarioInput
        ? 'Solicitud para habilitar presentación estándar de LAMDA en mi tienda.'
        : comentarioInput;

      const targetNum = Number((document.getElementById('prop-target')?.value ?? GSTATE.propPrecioObjetivoTexto) || 0);

      const payload = {
        nodo_solicitante_id: GSTATE.nodo.id,
        ingrediente_sugerido_id: Number(ingSel.id),
        flujo_sugerido: Number(ingSel.flujo || 2),
        familia_bunker_id: Number(ingSel.familia_bunker_id || 0) || null,
        articulo_principal_bunker: ingSel.articulo_principal_bunker || null,
        categoria_sugerida: ingSel.familia_bunker_nombre || ingSel.categoria_lamda || ingSel.categoria_gestor || GSTATE.propCategoriaSel || 'Frutos Secos',
        nombre_sugerido: nombreConPeso,
        alias_vidriera_sugerido: aliasVidrieraInput || null,
        kilos_sugeridos: kilos,
        precio_objetivo_vecino: Number.isFinite(targetNum) ? targetNum : 0,
        comentario_gestor: comentarioFinal,
        solicitar_habilitacion_existente: solicitarHabilitacionExistente
      };

      try {
        const resp = await fetchGestor('/api/produccion/nodos/propuestas', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          mostrarAvisoPantallaGestor('No se pudo enviar la solicitud: ' + (data.error || `Error HTTP ${resp.status}`), 'error');
          sincronizarBotonEnvioPropuestaDom();
          return;
        }

        const codProp = data.propuesta?.codigo_propuesta || '';
        GSTATE.propConfirmacionReciente = solicitarHabilitacionExistente
          ? `✅ Solicitud registrada (${codProp}): pediste habilitar ${nombreConPeso} en tu tienda.`
          : `✅ ¡Solicitud enviada con éxito! ${nombreConPeso} (${codProp}) ingresó a cotización y ya figura en Mis Solicitudes.`;
        await cargarPanelGestor({ resetPropuesta: true });
      } catch (err) {
        mostrarAvisoPantallaGestor('Error de comunicación al enviar la solicitud. Verificá tu conexión e intentá de nuevo.', 'error');
        sincronizarBotonEnvioPropuestaDom();
      }
    }

    async function ejecutarAnulacionPropuestaGestor(propuestaId, esLimpiezaDescartada = false) {
      const prop = (GSTATE.propuestas || []).find(x => Number(x.id) === Number(propuestaId));
      const etiquetaNombre = prop ? prop.nombre_sugerido : 'esta presentación';
      const btnConfirm = document.getElementById('btn-confirmar-anular-propuesta');
      const errModalBox = document.getElementById('modal-anular-error-box');

      if (btnConfirm) {
        btnConfirm.disabled = true;
        btnConfirm.textContent = 'Anulando...';
      }
      if (errModalBox) errModalBox.style.display = 'none';

      try {
        const resp = await fetchGestor(`/api/produccion/nodos/propuestas/${Number(propuestaId)}/anular`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nodo_id: GSTATE.nodo?.id || null,
            nodo_slug: GSTATE.slug || ''
          })
        });
        const data = await leerRespuestaJsonSegura(resp);
        if (!resp.ok || !data.ok) {
          const msgErr = data.error || `Error HTTP ${resp.status}`;
          if (errModalBox) {
            errModalBox.textContent = '⚠️ No se pudo anular: ' + msgErr;
            errModalBox.style.display = 'block';
          }
          mostrarAvisoPantallaGestor('No se pudo anular la solicitud: ' + msgErr, 'error');
          if (btnConfirm) {
            btnConfirm.disabled = false;
            btnConfirm.textContent = 'Confirmar anulación';
          }
          return;
        }

        cerrarModalReciboGestor();
        if (!esLimpiezaDescartada) {
          const codTxt = prop?.codigo_propuesta ? ` (${prop.codigo_propuesta})` : '';
          const msgExito = `✓ Solicitud${codTxt} de ${etiquetaNombre} anulada. Esa medida volvió a quedar libre.`;
          GSTATE.propConfirmacionReciente = msgExito;
          mostrarAvisoPantallaGestor(msgExito, 'ok');
        } else {
          GSTATE.propConfirmacionReciente = '';
        }
        await cargarPanelGestor();
      } catch (err) {
        const msgRed = 'Falla de comunicación con el servidor al intentar anular. Verificá tu conexión e intentá nuevamente.';
        if (errModalBox) {
          errModalBox.textContent = '⚠️ ' + msgRed;
          errModalBox.style.display = 'block';
        }
        mostrarAvisoPantallaGestor(msgRed, 'error');
        if (btnConfirm) {
          btnConfirm.disabled = false;
          btnConfirm.textContent = 'Confirmar anulación';
        }
      }
    }

    function anularPropuestaGestor(propuestaId, esLimpiezaDescartada = false) {
      if (!GSTATE.nodo || !propuestaId) return;
      if (esLimpiezaDescartada) {
        ejecutarAnulacionPropuestaGestor(propuestaId, true);
        return;
      }

      const prop = (GSTATE.propuestas || []).find(x => Number(x.id) === Number(propuestaId));
      const etiquetaNombre = prop ? prop.nombre_sugerido : 'esta presentación';
      const codProp = prop?.codigo_propuesta || '';

      const modal = document.getElementById('modal-recibo-gestor');
      const body = document.getElementById('modal-recibo-gestor-body');
      if (!modal || !body) {
        ejecutarAnulacionPropuestaGestor(propuestaId, false);
        return;
      }

      body.innerHTML = `
        <div style="padding:16px 20px; background:var(--brand-soft); border-bottom:1px solid var(--brand-border); color:var(--text);">
          <div style="font-size:0.72rem; font-weight:800; text-transform:uppercase; color:var(--brand-dark);">Confirmar baja de solicitud</div>
          <div style="font-size:1.02rem; font-weight:900; margin-top:2px;">Anular ${esc(etiquetaNombre)}</div>
          ${codProp ? `<div style="font-size:0.76rem; color:var(--muted); margin-top:2px;">Código ${esc(codProp)}</div>` : ''}
        </div>
        <div style="padding:18px 20px; background:#fff; color:var(--text); font-size:0.86rem; line-height:1.45;">
          <p style="margin:0 0 12px 0;">
            Se dará de baja esta solicitud pendiente de cotización y <strong>ese gramaje volverá a quedar libre</strong> por si querés volver a pedirlo.
          </p>
          <div id="modal-anular-error-box" style="display:none; margin-bottom:12px; padding:10px 12px; border-radius:10px; background:#fef2f2; border:1px solid #ef4444; color:#991b1b; font-size:0.8rem; font-weight:700;"></div>
          <div style="display:flex; gap:8px;">
            <button type="button" id="btn-confirmar-anular-propuesta"
              onclick="ejecutarAnulacionPropuestaGestor(${Number(propuestaId)}, false)"
              class="btn-primary" style="flex:1; background:#b91c1c;">
              Confirmar anulación
            </button>
            <button type="button" onclick="cerrarModalReciboGestor()" class="btn-soft" style="padding:11px 16px;">
              Cancelar
            </button>
          </div>
        </div>
      `;
      modal.style.display = 'flex';
    }

    // 3. DÍAS DE ENTREGA, CORTE, MEDIOS DE PAGO Y ENVÍO
    // -------------------------------------------------------------------------

          <div style="font-size:0.82rem; color:var(--muted); margin-bottom:10px; line-height:1.4;">

              <div style="font-size:0.88rem; font-weight:900; color:var(--text);">🏦 Transferencia Bancaria</div>

            </div>
            <span style="padding:4px 10px; border-radius:999px; background:#ecfdf5; color:#047857; border:1px solid #a7f3d0; font-size:0.76rem; font-weight:900;">

      const mod = obtenerModulosActivosGestor();

        <div class="card">

          <div id="ventanas-editor-list" style="display:flex; flex-direction:column; gap:10px; margin-bottom:12px;">
            ${ventanas.map((v, idx) => `
              <div class="ventana-item-row" style="display:grid; grid-template-columns: 1fr 1fr 0.8fr 1.3fr auto; gap:10px; align-items:end; background:#fffdfb; border:1px solid var(--border); padding:12px; border-radius:12px;">
                <div>
                  <label style="display:block; font-size:0.74rem; font-weight:800; color:var(--muted); margin-bottom:3px;">${mod.abastecimiento_modo === 'camioneta_lamda' ? 'Día Llegada Local' : 'Día de Entrega'}</label>
                  <select class="input-sm v-dia-entrega" style="width:100%;">
                    ${diasSemana.map(d => `<option value="${d}" ${v.dia_entrega === d ? 'selected' : ''}>${d}</option>`).join('')}

                  <input type="text" class="input-sm v-ventana-retiro" style="width:100%;" value="${esc(v.ventana_retiro || '17:00 a 20:00 hs')}" />
