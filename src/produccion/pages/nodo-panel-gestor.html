  <script>
    window.__nodoGestorDeferredPrompt = null;
    window.__nodoGestorInstaladoRuntime = false;
    window.__nodoGestorBipWaiters = [];
    window.limpiarBanderasObsoletasPwaGestor = function() {
      try {
        var keys = [];
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && (/^(lamda_nodo_pwa_|lamda_pwa_installed|pwa_installed|pwa_dismissed|dismissed_forever)/i.test(k))) {
            keys.push(k);
          }
        }
        for (var j = 0; j < keys.length; j++) {
          localStorage.removeItem(keys[j]);
        }
      } catch (_) {}
    };
    try {
      window.limpiarBanderasObsoletasPwaGestor();
      window.addEventListener('beforeinstallprompt', function(ev) {
        ev.preventDefault();
        window.__nodoGestorDeferredPrompt = ev;
        window.__nodoGestorInstaladoRuntime = false;
        window.limpiarBanderasObsoletasPwaGestor();
        while (window.__nodoGestorBipWaiters && window.__nodoGestorBipWaiters.length) {
          var fn = window.__nodoGestorBipWaiters.shift();
          try { fn(ev); } catch (_) {}
        }
        if (typeof window.actualizarVisibilidadBotonPwaGestor === 'function') {
          window.actualizarVisibilidadBotonPwaGestor();
        }
      });
      window.addEventListener('appinstalled', function() {
        window.__nodoGestorDeferredPrompt = null;
        window.__nodoGestorInstaladoRuntime = true;
        if (typeof window.cerrarModalPwaGestor === 'function') {
          window.cerrarModalPwaGestor();
        }
        if (typeof window.actualizarVisibilidadBotonPwaGestor === 'function') {
          window.actualizarVisibilidadBotonPwaGestor();
        }
      });
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) {
            var sUrl = (r.active && r.active.scriptURL) || (r.installing && r.installing.scriptURL) || (r.waiting && r.waiting.scriptURL) || '';
            if (sUrl.indexOf('/sw-nodo-pwa.js') === -1) {
              r.unregister();
            }
          });
        }).catch(function(){});
        navigator.serviceWorker.register('/sw-nodo-pwa.js', { scope: '/' }).catch(function(){});
      }
      localStorage.removeItem('lamda_prefer_mobile_home');
    } catch (_) {}
  </script>
  <title>Gestión comercial</title>

  <style>
    :root {
      --brand: #a2553b;
      --brand-dark: #6b311d;
      --brand-soft: rgba(162, 85, 59, 0.12);
      --brand-border: rgba(162, 85, 59, 0.34);
      --accent: #a2553b;
      --sun: #fef3c7;
      --bg: #faf7f3;
      --surface: #ffffff;
      --surface-warm: #f3ebe2;
      --surface-header: #fffdfb;
      --text: #25130b;
      --muted: #57453b;
      --border: #d9cbbd;
      --ok: #1f5c3d;
      --ok-soft: #e6f4ec;
      --ok-border: #b7e4c7;
      --warn: #92400e;
      --warn-soft: #fef3c7;
      --font-brand: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }

    html {
      max-width: 100%;
      -webkit-text-size-adjust: 100%;
    }
    body {
      margin: 0;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      overflow-x: clip;
      font-family: var(--font-brand);
      background: var(--bg);
      color: var(--text);
      padding-bottom: 48px;
      -webkit-font-smoothing: antialiased;
    }
    body.is-home-portada {
      padding-bottom: 14px;
    }

    /* Encabezado minimalista: marca compacta a la izquierda + menú ☰ a la derecha */
    .top-bar {
      background: var(--surface-header, #fffdfb);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .top-inner {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      flex-wrap: nowrap;
      gap: 10px;
    }
    .brand-identity {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      min-width: 0;
      flex: 1;
    }
    .brand-text-col {
      min-width: 0;
      flex: 1;
      overflow: hidden;
    }
    .brand-identity.logo-includes-text {
      gap: 10px;
      flex-wrap: nowrap;
    }
    .brand-identity.logo-includes-text .brand-title {
      font-size: 0.78rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--brand-dark);
    }
    .brand-identity.logo-includes-text .brand-subtitle {
      margin-top: 1px;
      font-size: 0.76rem;
      font-weight: 700;
      line-height: 1.2;
      color: var(--muted);
    }
    .brand-emblem {
      width: 38px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .brand-emblem.has-emblem-logo {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .brand-emblem.has-emblem-logo img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      display: block;
    }
    .brand-emblem.has-horizontal-logo {
      display: block;
      width: auto;
      height: auto;
      max-width: 152px;
      flex-shrink: 0;
    }
    .brand-emblem img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .brand-emblem.has-horizontal-logo img {
      width: auto;
      height: auto;
      max-height: 36px;
      max-width: 152px;
      object-fit: contain;
      display: block;
    }
    @media (max-width: 420px) {
      .brand-emblem.has-horizontal-logo {
        max-width: 140px;
      }
      .brand-emblem.has-horizontal-logo img {
        max-height: 32px;
        max-width: 140px;
      }
    }
    .brand-monogram {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--brand-soft);
      border: 1px solid var(--brand-border);
      color: var(--brand-dark);
      font-weight: 900;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-title {
      font-size: 1rem;
      font-weight: 900;
      color: var(--text);
      line-height: 1.15;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-subtitle {
      font-size: 0.76rem;
      color: var(--muted);
      font-weight: 700;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-gestor-hamburger {
      position: relative;
      width: 42px;
      height: 42px;
      min-width: 42px;
      min-height: 42px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s, transform 0.12s;
      box-shadow: 0 1px 4px rgba(62, 37, 25, 0.04);
    }
    .btn-gestor-hamburger:hover {
      background: var(--surface-warm);
      border-color: var(--brand-border);
    }
    .btn-gestor-hamburger:active {
      transform: scale(0.96);
    }

    /* Drawer lateral derecho del Gestor (Menú ☰) */
    .gestor-drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(37, 19, 11, 0.46);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      z-index: 3890;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .gestor-drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .gestor-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(88vw, 344px);
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      z-index: 3900;
      transform: translateX(104%);
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      box-shadow: -14px 0 36px rgba(37, 19, 11, 0.22);
      border-left: 1px solid var(--border);
      overflow: hidden;
    }
    .gestor-drawer.open {
      transform: translateX(0);
    }
    .gestor-drawer-head {
      padding: 14px 15px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }
    .gestor-drawer-close {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-warm);
      color: var(--text);
      font-size: 0.96rem;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .gestor-drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 14px calc(22px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: 16px;
      -webkit-overflow-scrolling: touch;
    }
    .gdrawer-group-title {
      font-size: 0.72rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 0 0 7px 4px;
    }
    .gdrawer-group-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .gdrawer-item {
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: background 0.15s, border-color 0.15s;
      box-shadow: 0 1px 4px rgba(62, 37, 25, 0.025);
    }
    .gdrawer-item:hover {
      background: var(--surface-warm);
      border-color: var(--brand-border);
    }
    .gdrawer-item-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    .gdrawer-item-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--brand-soft);
      color: var(--brand-dark);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .gdrawer-item-title {
      font-size: 0.88rem;
      font-weight: 900;
      color: var(--text);
      line-height: 1.22;
    }
    .gdrawer-item-sub {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--muted);
      margin-top: 2px;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .gdrawer-item-chevron {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--brand-dark);
      flex-shrink: 0;
      line-height: 1;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 14px 12px 24px;
    }
    body.is-home-portada .container {
      padding: 14px 12px 12px;
    }

    /* Portada Principal: Grilla 2x2 de Cuadrados Limpios */
    .gestor-home-grid-2x2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .gestor-square-card {
      width: 100%;
      aspect-ratio: 1 / 0.96;
      min-height: 150px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 15px 14px;
      cursor: pointer;
      font-family: inherit;
      color: var(--text);
      text-align: left;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 3px 12px rgba(62, 37, 25, 0.04);
      transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    @media (min-width: 600px) {
      .gestor-square-card {
        aspect-ratio: auto;
        min-height: 162px;
        padding: 18px 18px;
      }
    }
    .gestor-square-card:hover,
    .gestor-square-card:active {
      border-color: var(--brand);
      box-shadow: 0 6px 18px rgba(62, 37, 25, 0.08);
      transform: translateY(-1px);
    }
    .gestor-square-card.has-alert {
      border-color: #ef4444;
      background: linear-gradient(180deg, #fffafa 0%, #ffffff 55%);
    }
    .sq-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
    }
    .sq-card-icon {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      background: var(--brand-soft);
      border: 1px solid var(--brand-border);
      color: var(--brand-dark);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.28rem;
      flex-shrink: 0;
    }
    .sq-card-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.69rem;
      font-weight: 900;
      background: var(--surface-warm);
      color: var(--brand-dark);
      border: 1px solid var(--border);
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sq-card-badge.alert {
      background: #fef2f2;
      color: #b91c1c;
      border-color: #fca5a5;
    }
    .sq-card-badge.warn {
      background: #fffbeb;
      color: #92400e;
      border-color: #fcd34d;
    }
    .sq-card-badge.ok {
      background: var(--ok-soft);
      color: var(--ok);
      border-color: var(--ok-border);
    }
    .sq-card-body {
      min-width: 0;
      width: 100%;
    }
    .sq-card-title {
      font-size: 1rem;
      font-weight: 900;
      color: var(--text);
      line-height: 1.2;
      letter-spacing: -0.01em;
    }
    .sq-card-meta {
      font-size: 0.77rem;
      color: var(--muted);
      font-weight: 700;
      margin-top: 4px;
      line-height: 1.28;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Cabecera de Navegación Interna al abrir un Bloque */
    .section-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 38px;
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-back:hover {
      background: var(--surface-warm);
    }
    .section-heading {
      margin: 0 0 10px 0;
      font-size: 1.12rem;
      font-weight: 900;
      color: var(--text);
      line-height: 1.24;
    }

    /* Tarjetas y Controles Internos */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      min-width: 0;
      max-width: 100%;
      box-shadow: 0 2px 6px rgba(62, 37, 25, 0.025);
    }
    .input-sm {
      min-height: 38px;
      min-width: 0;
      max-width: 100%;
      padding: 7px 10px;
      border-radius: 9px;
      border: 1.5px solid var(--border);
      background: #fffdfb;
      color: var(--text);
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      outline: none;
    }
    select.input-sm {
      text-overflow: ellipsis;
      overflow: hidden;
    }
    .input-sm:disabled {
      background: #eee7df;
      color: var(--muted);
      cursor: not-allowed;
    }
    .input-sm:focus {
      border-color: var(--brand);
    }
    .btn-primary {
      background: var(--brand);
      color: #ffffff;
      border: none;
      min-height: 40px;
      padding: 8px 14px;
      border-radius: 10px;
      font-family: inherit;
      font-weight: 900;
      font-size: 0.92rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary:hover {
      background: var(--brand-dark);
    }
    .btn-soft {
      background: var(--surface-warm);
      color: var(--text);
      border: 1px solid var(--border);
      min-height: 38px;
      padding: 6px 11px;
      border-radius: 9px;
      font-family: inherit;
      font-weight: 800;
      font-size: 0.84rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
    }
    .switch-label {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 38px;
      cursor: pointer;
      font-weight: 800;
      font-size: 0.9rem;
      line-height: 1.28;
      color: var(--text);
    }
    .switch-label input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--brand);
      flex-shrink: 0;
      cursor: pointer;
    }

    /* === Pestañas de Estado, Categorías y Claridad Visual en Mi Oferta y Márgenes === */
    .ofertas-tabs-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      background: var(--surface-warm);
      padding: 5px;
      border-radius: 13px;
      border: 1px solid var(--border);
      margin-bottom: 11px;
    }
    .oferta-tab-btn {
      min-height: 40px;
      border-radius: 9px;
      border: 1.5px solid transparent;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 6px 5px;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s;
    }
    .oferta-tab-btn:hover {
      color: var(--text);
    }
    .oferta-tab-btn.is-active[data-tab="ACTIVOS"] {
      background: #ffffff;
      color: #166534;
      border-color: #86efac;
      box-shadow: 0 2px 6px rgba(22, 101, 52, 0.1);
      font-weight: 900;
    }
    .oferta-tab-btn.is-active[data-tab="DESACTIVADOS"] {
      background: #ffffff;
      color: #475569;
      border-color: #cbd5e1;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
      font-weight: 900;
    }
    .oferta-tab-btn.is-active[data-tab="TODOS"] {
      background: #ffffff;
      color: var(--brand-dark);
      border-color: var(--brand-border);
      box-shadow: 0 2px 6px rgba(62, 37, 25, 0.08);
      font-weight: 900;
    }
    .ofertas-search-wrap {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 9px;
    }
    .ofertas-search-input {
      width: 100%;
      min-height: 40px;
      padding: 8px 38px 8px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: #fffdfb;
      color: var(--text);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      outline: none;
    }
    .ofertas-search-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-soft);
    }
    .ofertas-search-clear {
      position: absolute;
      right: 8px;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: none;
      background: var(--surface-warm);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 900;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .ofertas-cats-strip {
      display: flex;
      align-items: center;
      gap: 7px;
      overflow-x: auto;
      padding: 2px 1px 6px 1px;
      margin-bottom: 10px;
      scrollbar-width: none;

      border: 1px solid #bbf7d0;
    }

      background: #f1ede7;
      border: 1px solid #dfd7cc;
    }
    .oferta-toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      user-select: none;
      font-weight: 800;
      font-size: 0.8rem;
      color: var(--text);
    }
    .oferta-toggle-switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 25px;
      flex-shrink: 0;
    }
    .oferta-toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }
    .oferta-toggle-slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background-color: #94a3b8;
      border-radius: 999px;
      transition: background-color 0.18s ease;
    }
    .oferta-toggle-slider::before {
      content: "";
      position: absolute;
      height: 19px;
      width: 19px;
      left: 3px;
      top: 3px;
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.24);
      transition: transform 0.18s ease;
    }
    .oferta-toggle-switch input:checked + .oferta-toggle-slider {
      background-color: #16a34a;
    }
    .oferta-toggle-switch input:checked + .oferta-toggle-slider::before {
      transform: translateX(19px);
    }
    .oferta-toggle-switch input:disabled + .oferta-toggle-slider {
      opacity: 0.55;
      cursor: wait;
    }
    .oferta-pub-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

      background: #ffffff;
      margin-bottom: 10px;
      overflow: hidden;

      text-align: left;
      cursor: pointer;
      font-family: inherit;

    .gestor-fam-head:hover {

    .gestor-fam-body {
      padding: 9px 10px;
      border-top: 1px solid var(--border);
      background: #fcfaf7;
      display: flex;
      flex-direction: column;
      gap: 8px;

    .gestor-grp-acc {

      background: #ffffff;

    }

    }

    .gestor-grp-head {

      gap: 9px;
      padding: 9px 11px;
      cursor: pointer;

    .gestor-grp-thumb {
      width: 44px;

    .gestor-grp-thumb-ph {

      height: 44px;
      border-radius: 9px;

      align-items: center;
      justify-content: center;
      gap: 2px;

      font-size: 0.74rem;
      font-weight: 800;
      cursor: pointer;

    .oferta-status-pill {

    function normalizarPerfilGestor(raw) {
      const p = String(raw || '').trim().toLowerCase();
      if (p === 'redes' || p === 'ecommerce_fulfillment' || p === 'creador_online' || p === 'fulfillment_lamda') return 'REDES';
      if (p === 'locales' || p === 'local' || p === 'comercio_pickup' || p === 'pickup_point' || p === 'local_fisico') return 'LOCALES';
      return 'VECINOS';
    }

    function obtenerModulosActivosGestor(nodoRef = GSTATE.nodo) {
      const perf = normalizarPerfilGestor(nodoRef?.perfil_operativo);
      const preset = perf === 'REDES'
        ? {
            retiro_punto: false, reparto_zonal: false, hoja_de_ruta: false, envio_paqueteria: true,
            venta_continua_24_7: true, despacho_desde_lamda: true, canasto_consolidado: false,
            cobro_efectivo_entrega: false, mostrador_entrega_rapida: false,

            abastecimiento_modo: 'despacho_correo', etiqueta_zpl_formato: 'postal_fulfillment'
          }
        : (perf === 'LOCALES'
            ? {
                retiro_punto: true, reparto_zonal: false, hoja_de_ruta: false, envio_paqueteria: false,
                venta_continua_24_7: false, despacho_desde_lamda: false, canasto_consolidado: true,
                cobro_efectivo_entrega: false, mostrador_entrega_rapida: true,
                checkout_omitir_paso_entrega_si_unico: true, mostrar_horarios_comerciales: true,
                abastecimiento_modo: 'camioneta_lamda', etiqueta_zpl_formato: 'mostrador_local'
              }
            : {
                retiro_punto: true, reparto_zonal: true, hoja_de_ruta: true, envio_paqueteria: false,
                venta_continua_24_7: false, despacho_desde_lamda: false, canasto_consolidado: true,
                cobro_efectivo_entrega: true, mostrador_entrega_rapida: false,
                checkout_omitir_paso_entrega_si_unico: true, mostrar_horarios_comerciales: false,
                abastecimiento_modo: 'retiro_deposito', etiqueta_zpl_formato: 'vecinal'
              });
      const raw = (nodoRef?.modulos_activos && typeof nodoRef.modulos_activos === 'object') ? nodoRef.modulos_activos : {};
      return { ...preset, ...raw };
    }

    function esPerfilEcommerceGestor(nodoRef = GSTATE.nodo) {
      const n = nodoRef || {};
      const mod = obtenerModulosActivosGestor(n);
      return Boolean(mod.envio_paqueteria && !mod.retiro_punto && !mod.reparto_zonal);
    }

    function tMarca(nodoRef, clave) {
      const n = nodoRef || GSTATE.nodo || {};
      const dic = (n.diccionario_textos && typeof n.diccionario_textos === 'object') ? n.diccionario_textos : {};
      if (dic[clave] !== undefined && dic[clave] !== null && String(dic[clave]).trim() !== '') {
        return String(dic[clave]);
      }
      const esEc = esPerfilEcommerceGestor(n);
      const mod = obtenerModulosActivosGestor(n);
      const esMostrador = Boolean(mod.mostrador_entrega_rapida || mod.mostrar_horarios_comerciales);
      const mapa = esEc ? {
        subtitulo_cabecera: 'Envíos a todo el país',
        btn_copiar_link: 'Compartir link',
        bloque_3_titulo: 'Envíos nacionales y despachos',

        bloque_4_titulo: 'Ventas y envíos',

        bloque_5_titulo: 'Estado de cuenta operativo',
        bloque_5_heading: 'Estado de cuenta operativo',
        bloque_6_titulo: 'Liquidaciones y ganancias',

        bloque_4_titulo: 'Mostrador y entregas',
        bloque_4_heading: 'Pedidos y entregas en mostrador',
        bloque_5_titulo: 'Estado de cuenta operativo',
        bloque_5_heading: 'Estado de cuenta operativo',
        bloque_6_titulo: 'Liquidaciones y ganancias',
        bloque_6_heading: 'Liquidaciones y ganancias',
        bloque_7_titulo: 'Clientes del local',
        bloque_7_heading: 'Clientes del local',
        comprador_singular: 'cliente',
        comprador_plural: 'clientes'
      } : {
        subtitulo_cabecera: '',
        btn_copiar_link: 'Compartir link',
        bloque_3_titulo: 'Entregas y medios de pago',
        bloque_3_heading: 'Días de entrega, corte y medios de pago',
        bloque_4_titulo: mod.hoja_de_ruta ? 'Pedidos y entregas' : 'Pedidos de clientes',
        bloque_4_heading: mod.hoja_de_ruta ? 'Pedidos y entregas' : 'Pedidos de clientes',
        bloque_5_titulo: 'Estado de cuenta operativo',
        bloque_5_heading: 'Estado de cuenta operativo',
        bloque_6_titulo: 'Liquidaciones y ganancias',
        bloque_6_heading: 'Liquidaciones y ganancias',
        bloque_7_titulo: 'Clientes de mi tienda',
        bloque_7_heading: 'Clientes de mi tienda',
        comprador_singular: 'vecino',
        comprador_plural: 'vecinos'
      });
      return mapa[clave] ?? clave;
    }

    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function escJs(s) {
      return esc(String(s ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\r?\n/g, ' '));
    }

    let _timerAvisoFlotante = null;
    function mostrarAvisoPantallaGestor(mensaje, tipo = 'ok') {
      const box = document.getElementById('gestor-aviso-flotante');
      if (!box) return;
      if (_timerAvisoFlotante) clearTimeout(_timerAvisoFlotante);

      const esError = tipo === 'error';
      box.style.background = esError ? '#fef2f2' : '#ecfdf3';
      box.style.border = esError ? '1px solid #ef4444' : '1px solid rgba(31,111,74,0.45)';
      box.style.color = esError ? '#991b1b' : '#14532d';
      box.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
          <div>${esError ? '⚠️ ' : ''}${esc(mensaje)}</div>
          <button type="button" onclick="document.getElementById('gestor-aviso-flotante').style.display='none'"
            style="border:none; background:transparent; color:inherit; font-weight:900; font-size:0.95rem; cursor:pointer; padding:0 2px; line-height:1;">
            ✕
          </button>
        </div>
      `;
      box.style.display = 'block';
      _timerAvisoFlotante = setTimeout(() => {
        box.style.display = 'none';
      }, esError ? 9000 : 5000);
    }

    async function leerRespuestaJsonSegura(resp) {
      const raw = await resp.text();
      try {
        return raw ? JSON.parse(raw) : {};
      } catch (_) {
        return { ok: false, error: `Respuesta inesperada del servidor (HTTP ${resp.status})` };
      }
    }

    function sincronizarTituloYMetaPwaGestor(nombreMarcaRaw) {
      const marca = String(nombreMarcaRaw || '').trim();
      const tituloGestion = marca ? `Gestión ${marca}` : 'Gestión comercial';
      document.title = tituloGestion;
      let metaAppleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
      if (!metaAppleTitle) {
        metaAppleTitle = document.createElement('meta');
        metaAppleTitle.setAttribute('name', 'apple-mobile-web-app-title');
        document.head.appendChild(metaAppleTitle);
      }
      metaAppleTitle.setAttribute('content', tituloGestion);
    }

    function obtenerVersionPwaGestor() {
      const vBoot = window.__NODOS_BOOTSTRAP__ && window.__NODOS_BOOTSTRAP__.pwa_v;
      return String(vBoot || '5').trim() || '5';
    }

    function esNavegadorEmbebidoWebViewGestor() {
      const ua = String(navigator.userAgent || '');
      return /(FBAN|FBAV|Instagram|Line\/|TikTok|BytedanceWebview|WhatsApp|; wv\)|\bwv\b)/i.test(ua);
    }

    function esperarDeferredPromptGestor(timeoutMs = 1500) {
      if (window.__nodoGestorDeferredPrompt) {
        return Promise.resolve(window.__nodoGestorDeferredPrompt);
      }
      return new Promise((resolve) => {
        let resuelto = false;
        const fn = (ev) => {
          if (resuelto) return;
          resuelto = true;
          clearTimeout(tm);
          resolve(ev || window.__nodoGestorDeferredPrompt || null);
        };
        window.__nodoGestorBipWaiters = window.__nodoGestorBipWaiters || [];
        window.__nodoGestorBipWaiters.push(fn);
        const tm = setTimeout(() => {
          if (resuelto) return;
          resuelto = true;
          const idx = window.__nodoGestorBipWaiters.indexOf(fn);
          if (idx !== -1) window.__nodoGestorBipWaiters.splice(idx, 1);
          resolve(window.__nodoGestorDeferredPrompt || null);
        }, timeoutMs);
      });
    }

    function aplicarFaviconGestor(urlImg) {
      const slugAct = String(GSTATE.slug || detectarSlugInicial() || '').trim();
      const vPwa = encodeURIComponent(obtenerVersionPwaGestor());
      const iconPwa192 = slugAct ? `/api/produccion/nodos/pwa/${encodeURIComponent(slugAct)}/icon-gestor-192.png?v=${vPwa}` : String(urlImg || '').trim();
      const iconPwa180 = slugAct ? `/api/produccion/nodos/pwa/${encodeURIComponent(slugAct)}/icon-gestor-180.png?v=${vPwa}` : String(urlImg || '').trim();
      if (iconPwa192) {
        let linkIcon = document.getElementById('nodo-favicon-png') || document.querySelector('link[rel="icon"]');
        if (!linkIcon) {
          linkIcon = document.createElement('link');
          linkIcon.id = 'nodo-favicon-png';
          linkIcon.rel = 'icon';
          linkIcon.type = 'image/png';
          document.head.appendChild(linkIcon);
        }
        linkIcon.href = iconPwa192;
      }
      if (iconPwa180) {
        let linkApple = document.getElementById('nodo-apple-touch-icon') || document.querySelector('link[rel="apple-touch-icon"]');
        if (!linkApple) {
          linkApple = document.createElement('link');
          linkApple.id = 'nodo-apple-touch-icon';
          linkApple.rel = 'apple-touch-icon';
          linkApple.sizes = '180x180';
          document.head.appendChild(linkApple);
        }
        linkApple.href = iconPwa180;
      }
    }

    function sincronizarManifestPwaGestor(slug, tok) {
      const cleanSlug = String(slug || '').trim();
      if (!cleanSlug) return;
      const slugEnc = encodeURIComponent(cleanSlug);
      const tokClean = String(tok || '').trim();
      const vPwa = encodeURIComponent(obtenerVersionPwaGestor());
      const href = `/api/produccion/nodos/pwa/${slugEnc}/gestor.webmanifest?${tokClean ? `t=${encodeURIComponent(tokClean)}&` : ''}v=${vPwa}`;
      let link = document.getElementById('nodo-pwa-manifest') || document.querySelector('link[rel="manifest"]');
      if (!link) {
        link = document.createElement('link');
        link.id = 'nodo-pwa-manifest';
        link.rel = 'manifest';
        document.head.appendChild(link);
      }
      if (link.getAttribute('href') !== href) {
        link.setAttribute('href', href);
      }
    }

    function esModoStandaloneActivoGestor() {
      try {
        if (window.navigator.standalone === true) return true;
        if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
        if (window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches) return true;
        if (typeof document !== 'undefined' && String(document.referrer || '').indexOf('android-app://') === 0) return true;
      } catch (_) {}
      return false;
    }

    function esModoPwaInstaladaGestor() {
      if (esModoStandaloneActivoGestor()) return true;
      if (window.__nodoGestorDeferredPrompt) return false;
      return Boolean(window.__nodoGestorInstaladoRuntime);
    }

    function actualizarVisibilidadBotonPwaGestor() {
      const ocultar = esModoPwaInstaladaGestor();
      const btnBoard = document.getElementById('btn-instalar-pwa-gestor');
      if (btnBoard) {
        btnBoard.style.display = ocultar ? 'none' : 'flex';
      }
      const btnMenuPwa = document.getElementById('btn-menu-pwa-gestor');
      if (btnMenuPwa) {
        btnMenuPwa.style.display = (ocultar || !GSTATE.nodo) ? 'none' : 'flex';
      }
    }
    window.actualizarVisibilidadBotonPwaGestor = actualizarVisibilidadBotonPwaGestor;

    async function verificarEstadoRealAccesoDirectoGestor() {
      try {
        if (esModoStandaloneActivoGestor()) {
          actualizarVisibilidadBotonPwaGestor();
          return true;
        }
        if (window.__nodoGestorDeferredPrompt) {
          window.__nodoGestorInstaladoRuntime = false;
          if (typeof window.limpiarBanderasObsoletasPwaGestor === 'function') {
            window.limpiarBanderasObsoletasPwaGestor();
          }
          actualizarVisibilidadBotonPwaGestor();
          return false;
        }
        if (typeof navigator !== 'undefined' && typeof navigator.getInstalledRelatedApps === 'function') {
          const slugAct = String(GSTATE.slug || detectarSlugInicial() || '').trim();
          const slugEnc = encodeURIComponent(slugAct);
          const apps = await navigator.getInstalledRelatedApps();
          const instalada = Array.isArray(apps) && apps.some(a => {
            if (!a) return false;
            const u = String(a.url || '');
            if (!u) return a.platform === 'webapp';
            if (!slugEnc) return u.includes('/gestor.webmanifest');
            return u.includes(`/pwa/${slugEnc}/gestor.webmanifest`) || u.includes(`/gestor/${slugEnc}`);
          });
          window.__nodoGestorInstaladoRuntime = instalada;
          if (!instalada && typeof window.limpiarBanderasObsoletasPwaGestor === 'function') {
            window.limpiarBanderasObsoletasPwaGestor();
          }
          actualizarVisibilidadBotonPwaGestor();
          return instalada;
        }
      } catch (_) {}
      actualizarVisibilidadBotonPwaGestor();
      return esModoPwaInstaladaGestor();
    }
    window.verificarEstadoRealAccesoDirectoGestor = verificarEstadoRealAccesoDirectoGestor;

    try {
      if (window.matchMedia) {
        const mqStandaloneGestor = window.matchMedia('(display-mode: standalone)');
        if (typeof mqStandaloneGestor.addEventListener === 'function') {
          mqStandaloneGestor.addEventListener('change', () => actualizarVisibilidadBotonPwaGestor());
        } else if (typeof mqStandaloneGestor.addListener === 'function') {
          mqStandaloneGestor.addListener(() => actualizarVisibilidadBotonPwaGestor());
        }
      }
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          verificarEstadoRealAccesoDirectoGestor();
        }
      });
      window.addEventListener('focus', () => {
        verificarEstadoRealAccesoDirectoGestor();
      });
    } catch (_) {}

    function cerrarModalPwaGestor() {

    async function instalarAccesoDirectoGestor() {
      const ua = String(navigator.userAgent || '');
      const esIos = /iphone|ipad|ipod/i.test(ua);
      const esWebView = esNavegadorEmbebidoWebViewGestor();

      if (!esWebView) {
        let promptEv = window.__nodoGestorDeferredPrompt;
        if (!promptEv && !esIos) {
          promptEv = await esperarDeferredPromptGestor(900);
        }
        if (promptEv && typeof promptEv.prompt === 'function') {
          window.__nodoGestorDeferredPrompt = null;
          let lanzadoOk = false;
          try {
            const pRes = promptEv.prompt();
            lanzadoOk = true;
            Promise.resolve(pRes).catch(() => {});
            if (promptEv.userChoice && typeof promptEv.userChoice.then === 'function') {
              promptEv.userChoice.then((choice) => {
                if (choice && choice.outcome === 'accepted') {
                  window.__nodoGestorInstaladoRuntime = true;
                  const marcaToast = String(GSTATE.nodo?.nombre_marca || 'tu tienda').trim();
                  mostrarAvisoPantallaGestor(`✓ Acceso directo "Gestión ${marcaToast}" creado en tu pantalla de inicio.`, 'ok');
                }
                actualizarVisibilidadBotonPwaGestor();
              }).catch(() => {});
            }
          } catch (_) {
            lanzadoOk = false;
          }
          if (lanzadoOk) {
            actualizarVisibilidadBotonPwaGestor();
            return;
          }

      }

      const slugAct = String(GSTATE.slug || detectarSlugInicial() || '').trim();

      const cuerpoInstruccionHtml = esWebView
        ? `
          <div style="background:var(--surface-warm); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:14px; font-size:0.88rem; color:var(--text); line-height:1.42; font-weight:700;">

              style="display:flex; align-items:center; justify-content:center; width:100%; min-height:42px; margin-bottom:8px; border-radius:11px; background:var(--brand); color:#fff; text-decoration:none; font-weight:900; font-size:0.9rem;">
              🌐 Abrir en Chrome ahora
            </a>
          ` : ''}
        `
        : (esIos
          ? `
            <div style="background:var(--surface-warm); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:14px; font-size:0.88rem; color:var(--text); line-height:1.42;">
              Tocá <strong>Compartir (ícono ⬆️ abajo en Safari)</strong> y elegí <strong>"Agregar a inicio"</strong>.
            </div>
          `
          : `
            <div style="background:var(--surface-warm); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:14px; font-size:0.87rem; color:var(--text); line-height:1.42;">
              Tocá el menú <strong>⋮</strong> de Chrome y elegí <strong>"Agregar a la pantalla principal"</strong> (si tenías un acceso directo anterior de gestión en el teléfono, quitalo primero para actualizar su ícono).
            </div>
          `);

      bodyEl.innerHTML = `
        <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;">

            <div>
              <div style="font-weight:900; font-size:1rem; color:var(--text);">Gestión ${esc(nombreMarca)}</div>
              <div style="font-size:0.78rem; color:var(--brand-dark); font-weight:800;">📲 Agregar acceso directo</div>
            </div>
          </div>
          <button type="button" onclick="cerrarModalPwaGestor()" aria-label="Cerrar"
            style="border:none; background:var(--surface-warm); color:var(--text); width:32px; height:32px; border-radius:999px; font-weight:900; cursor:pointer;">✕</button>
        </div>
        ${cuerpoInstruccionHtml}
        <button type="button" class="btn-primary" style="width:100%;" onclick="cerrarModalPwaGestor()">Entendido</button>

    function resolverUrlAssetGestor(url, nodo) {
      const raw = String(url || '').trim();
      if (!raw || !raw.startsWith('/img/nodos/')) return raw;
      if (/[?&]v=/.test(raw)) return raw;
      const v = String(nodo?.tema_visual?.assets_version || '2').trim();
      return `${raw}?v=${encodeURIComponent(v)}`;
    }

    function obtenerLogoHeaderGestor(nodo) {
      const logos = (nodo?.tema_visual && typeof nodo.tema_visual === 'object') ? (nodo.tema_visual.logos || {}) : {};
      if (logos.gestor_header) {
        return { src: resolverUrlAssetGestor(logos.gestor_header, nodo), esEmblema: true };
      }
      if (logos.horizontal) {
        return { src: resolverUrlAssetGestor(logos.horizontal, nodo), esEmblema: false };
      }
      return { src: '', esEmblema: false };
    }

    function obtenerLogoHorizontalGestor(nodo) {
      const logos = (nodo?.tema_visual && typeof nodo.tema_visual === 'object') ? (nodo.tema_visual.logos || {}) : {};
      return resolverUrlAssetGestor(logos.horizontal || '', nodo);
    }

    function obtenerLogoVerticalGestor(nodo) {
      const logos = (nodo?.tema_visual && typeof nodo.tema_visual === 'object') ? (nodo.tema_visual.logos || {}) : {};
      return resolverUrlAssetGestor(logos.vertical_png || logos.vertical || logos.principal_png || logos.principal || logos.horizontal_png || logos.horizontal || '', nodo) || nodo?.logo_original_base64 || nodo?.logo_mono_preview_base64 || '';
    }

    function obtenerLogoIconoGestor(nodo) {
      const logos = (nodo?.tema_visual && typeof nodo.tema_visual === 'object') ? (nodo.tema_visual.logos || {}) : {};
      return resolverUrlAssetGestor(logos.isotipo || logos.horizontal || '', nodo) || nodo?.logo_original_base64 || nodo?.logo_mono_preview_base64 || '';
    }

    function aplicarPaletaNodo(hexONodo) {
      const esObj = Boolean(hexONodo && typeof hexONodo === 'object');
      const nodo = esObj ? hexONodo : null;
      const tv = (nodo?.tema_visual && typeof nodo.tema_visual === 'object') ? nodo.tema_visual : {};
      const pal = (tv.paleta && typeof tv.paleta === 'object') ? tv.paleta : {};
      const tip = (tv.tipografia && typeof tv.tipografia === 'object') ? tv.tipografia : {};
      const hexRaw = esObj ? (pal.terracota || nodo.color_primario || '#a2553b') : hexONodo;
      const clean = /^#[0-9a-fA-F]{6}$/.test(String(hexRaw || '').trim()) ? String(hexRaw).trim() : '#a2553b';
      const r = parseInt(clean.slice(1, 3), 16);
      const g = parseInt(clean.slice(3, 5), 16);
      const b = parseInt(clean.slice(5, 7), 16);
      const darkR = Math.max(0, Math.round(r * 0.78));
      const darkG = Math.max(0, Math.round(g * 0.78));
      const darkB = Math.max(0, Math.round(b * 0.78));
      const darkFallback = '#' + [darkR, darkG, darkB].map(v => v.toString(16).padStart(2, '0')).join('');

      const root = document.documentElement;
      root.style.setProperty('--brand', clean);
      root.style.setProperty('--brand-dark', /^#[0-9a-fA-F]{6}$/.test(pal.terracota_oscuro || '') ? pal.terracota_oscuro : darkFallback);
      root.style.setProperty('--brand-soft', `rgba(${r}, ${g}, ${b}, 0.11)`);
      root.style.setProperty('--brand-border', `rgba(${r}, ${g}, ${b}, 0.30)`);

      if (pal.fondo) root.style.setProperty('--bg', pal.fondo);
      if (pal.superficie_calida) root.style.setProperty('--surface-warm', pal.superficie_calida);
      if (pal.tarjeta) {
        root.style.setProperty('--surface', pal.tarjeta);
        root.style.setProperty('--surface-header', pal.tarjeta);
      }
      if (pal.texto) root.style.setProperty('--text', pal.texto);
      if (pal.texto_secundario) root.style.setProperty('--muted', pal.texto_secundario);
      if (pal.borde) root.style.setProperty('--border', pal.borde);
      if (pal.ocre) root.style.setProperty('--accent', pal.ocre);
      if (pal.amarillo_sol) root.style.setProperty('--sun', pal.amarillo_sol);
      if (pal.pistacho_texto) root.style.setProperty('--ok', pal.pistacho_texto);
      if (pal.pistacho_suave) root.style.setProperty('--ok-soft', pal.pistacho_suave);
      if (pal.pistacho) root.style.setProperty('--ok-border', pal.pistacho);
      if (tip.familia) root.style.setProperty('--font-brand', tip.familia);
    }

    function detectarSlugInicial() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('nodo')) return params.get('nodo').trim();
      const parts = window.location.pathname.split('/').filter(Boolean);
      const idx = parts.findIndex(p => p === 'gestor' || p === 'gestor-nodo');
      if (idx !== -1 && parts[idx + 1]) return decodeURIComponent(parts[idx + 1]).trim();
      return '';
    }

    function obtenerKeyStorageTokenGestor(slug) {
      return 'lamda_nodo_gestor_token_' + String(slug || '').trim().toLowerCase();
    }

    function resolverYPersistirTokenGestor(slug) {
      const cleanSlug = String(slug || '').trim();
      const params = new URLSearchParams(window.location.search);
      const tokQuery = String(params.get('t') || params.get('gestor_token') || '').trim();
      const key = obtenerKeyStorageTokenGestor(cleanSlug);

      if (tokQuery && tokQuery.length >= 16) {
        try {
          localStorage.setItem(key, tokQuery);
        } catch (_) {}
        params.delete('t');
        params.delete('gestor_token');
        const nuevaQs = params.toString();
        const nuevaUrl = window.location.pathname + (nuevaQs ? '?' + nuevaQs : '') + (window.location.hash || '');
        try {
          window.history.replaceState({}, document.title, nuevaUrl);
        } catch (_) {}
        sincronizarManifestPwaGestor(cleanSlug, tokQuery);
        return tokQuery;
      }

      try {
        const guardado = String(localStorage.getItem(key) || '').trim();
        sincronizarManifestPwaGestor(cleanSlug, guardado);
        return guardado;
      } catch (_) {
        return '';
      }
    }

    function fetchGestor(url, options = {}) {
      const tok = resolverYPersistirTokenGestor(GSTATE.slug || detectarSlugInicial());
      const headers = { ...(options.headers || {}) };
      if (typeof FormData !== 'undefined' && options.body instanceof FormData) {
        delete headers['Content-Type'];
        delete headers['content-type'];
      }
      if (tok) {
        headers['X-Nodo-Gestor-Token'] = tok;
      }
      return fetch(url, { ...options, headers });
    }

    function activarTokenManualDesdeAcceso() {
      const inp = document.getElementById('gestor-token-manual-input');
      const raw = String(inp?.value || '').trim();
      if (!raw) return;
      let tok = raw;
      try {
        if (/^https?:\/\//i.test(raw) || raw.includes('t=')) {
          const u = new URL(raw.startsWith('http') ? raw : (window.location.origin + (raw.startsWith('/') ? raw : '/?' + raw)));
          tok = String(u.searchParams.get('t') || u.searchParams.get('gestor_token') || '').trim();
        }
      } catch (_) {}
      if (!tok || tok.length < 16) {
        alert('Pegá el enlace completo del QR de Gestor o una clave válida.');
        return;
      }
      const slug = GSTATE.slug || detectarSlugInicial();
      try {
        localStorage.setItem(obtenerKeyStorageTokenGestor(slug), tok);
      } catch (_) {}
      cargarPanelGestor();
    }

    function renderizarPantallaReescanearQrGestor(esInvalido = false) {
      const box = document.getElementById('gestor-main-view');
      if (!box) return;
      box.innerHTML = `
        <div class="card" style="text-align:center; padding:30px 22px; max-width:520px; margin:20px auto;">
          <div style="font-size:2.4rem; margin-bottom:10px;">📲</div>
          <h3 style="margin:0 0 10px 0; font-size:1.18rem; color:var(--text);">
            ${esInvalido ? 'Tu código QR de Gestor fue renovado' : 'Escaneá nuevamente tu QR de Gestor'}
          </h3>
          <p style="color:var(--muted); font-size:0.9rem; line-height:1.55; margin:0 0 14px 0;">
            ${esInvalido
              ? 'El acceso anterior ya no está vigente por rotación de seguridad. Pedí el código QR actualizado y escanealo con la cámara de tu celular.'
              : 'Por seguridad de tu tienda, este espacio de gestión requiere abrirse desde tu código QR personal.'}
          </p>
          <div style="background:var(--surface-warm); border:1px solid var(--border); border-radius:12px; padding:12px 14px; font-size:0.82rem; color:var(--text); line-height:1.45; text-align:left; margin-bottom:16px;">
            <strong>💡 ¿Usás iPhone o iPad ("Agregar a inicio")?</strong><br>
            Al guardar un ícono en la pantalla de inicio, iOS abre un espacio separado sin la clave previa de Safari. Escaneá tu QR de Gestor desde la cámara y volvé a guardar el ícono si lo necesitás, o pegá tu enlace de acceso acá abajo:
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <input id="gestor-token-manual-input" type="text" placeholder="Pegá acá el link completo del QR de Gestor..."
              style="flex:1; min-width:210px; padding:10px 12px; border:1px solid var(--border); border-radius:10px; font-family:inherit; font-size:0.85rem;">
            <button type="button" onclick="activarTokenManualDesdeAcceso()" class="btn-primary" style="padding:10px 16px;">

            </button>
          </div>
        </div>
      `;
    }

    async function cargarPanelGestor(opciones = {}) {
      if (!GSTATE.slug) {
        renderizarPantallaReescanearQrGestor(false);
        return;
      }
      resolverYPersistirTokenGestor(GSTATE.slug);
      const [resp, respLiq] = await Promise.all([
        fetchGestor(`/api/produccion/nodos/portal/${encodeURIComponent(GSTATE.slug)}?vista=gestor`, { cache: 'no-store' }),
        fetchGestor(`/api/produccion/nodos/liquidacion/tablero?nodo_slug=${encodeURIComponent(GSTATE.slug)}`, { cache: 'no-store' })
      ]);
      const data = await leerRespuestaJsonSegura(resp);
      if (resp.status === 401 || resp.status === 403 || data.code === 'GESTOR_TOKEN_REQUIRED' || data.code === 'GESTOR_TOKEN_INVALID' || data.code === 'GESTOR_WRONG_NODE') {
        const esInvalido = data.code === 'GESTOR_TOKEN_INVALID' || data.code === 'GESTOR_WRONG_NODE';
        if (esInvalido) {
          try { localStorage.removeItem(obtenerKeyStorageTokenGestor(GSTATE.slug)); } catch (_) {}
        }
        renderizarPantallaReescanearQrGestor(esInvalido);
        return;
      }
      if (!data.ok) {
        const box = document.getElementById('gestor-main-view');
        if (box) {
          box.innerHTML = `
            <div class="card" style="text-align:center; padding:32px;">
              <h3 style="margin:0 0 8px 0;">Gestión comercial no disponible</h3>
              <p style="color:var(--muted); font-size:0.9rem; max-width:480px; margin:0 auto;">
                Verificá que tu enlace de gestión esté actualizado o escaneá nuevamente tu código QR personal.
              </p>
            </div>
          `;
        }
        return;
      }
      try {
        const dataLiq = await respLiq.json();
        if (dataLiq && dataLiq.ok) GSTATE.liquidacionTablero = dataLiq;
      } catch (_) {}

      GSTATE.nodo = data.nodo;
      GSTATE.slug = data.nodo.slug;
      try {
        const slugNormGestor = String(data.nodo.slug || GSTATE.slug || '').trim().toLowerCase();
        if (slugNormGestor) {
          localStorage.setItem('lamda_nodo_gestor_slug_' + slugNormGestor, '1');
          localStorage.setItem('lamda_nodo_gestor_etiqueta_' + slugNormGestor, `Gestor ${data.nodo.nombre_marca || slugNormGestor}`);
        }
        // Limpiar marca global legacy 'GESTOR' para que abrir /gestor/:slug nunca contamine otros nodos
        if (String(localStorage.getItem('lamda_nodo_dispositivo_rol') || '').trim().toUpperCase() === 'GESTOR') {
          localStorage.removeItem('lamda_nodo_dispositivo_rol');
        }
      } catch (_) {}
      GSTATE.modoLaboratorio = Boolean(data.modo_laboratorio);
      GSTATE.telefonoPruebas = String(data.telefono_whatsapp_pruebas || '5492216615746');
      GSTATE.proximaEntrega = data.proxima_entrega;
      GSTATE.ofertas = data.todas_ofertas_gestor || [];
      GSTATE.catalogoBaseDisponible = Array.isArray(data.catalogo_base_disponible) ? data.catalogo_base_disponible : [];
      GSTATE.propuestas = data.propuestas_nodo || [];
      GSTATE.propuestasCombos = Array.isArray(data.propuestas_combos_nodo) ? data.propuestas_combos_nodo : [];
      GSTATE.articulosElegiblesCombo = Array.isArray(data.articulos_elegibles_combo) ? data.articulos_elegibles_combo : [];
      GSTATE.combosCotizadosCatalogo = Array.isArray(data.combos_cotizados_catalogo) ? data.combos_cotizados_catalogo : [];
      GSTATE.pedidos = data.pedidos_nodo || [];
      GSTATE.movimientosCtaCte = data.movimientos_cta_cte || [];
      GSTATE.liquidacionesNodo = Array.isArray(data.liquidaciones_nodo) ? data.liquidaciones_nodo : [];
      GSTATE.ingredientesDisponibles = Array.isArray(data.ingredientes_sugeribles) ? data.ingredientes_sugeribles : [];
      GSTATE.familiasBunkerOficiales = Array.isArray(data.familias_bunker_oficiales) ? data.familias_bunker_oficiales : [];
      GSTATE.compartirKit = null;

      try {
        const respComp = await fetchGestor(`/api/produccion/nodos/gestor/${Number(GSTATE.nodo.id)}/compradores`, { cache: 'no-store' });
        const dataComp = await leerRespuestaJsonSegura(respComp);
        if (respComp.ok && dataComp.ok) {
          GSTATE.compradores = Array.isArray(dataComp.compradores) ? dataComp.compradores : [];
          GSTATE.compradoresResumen = dataComp.resumen || {
            total_compradores: GSTATE.compradores.length,
            con_pedido_activo: GSTATE.compradores.filter(c => c.tiene_pedido_en_curso).length,
            recurrentes: GSTATE.compradores.filter(c => c.es_recurrente).length
          };
          GSTATE.compradoresCargados = true;
        }
      } catch (_) {}

      // Precargar kit de difusión público en segundo plano (sin bloquear UI)
      cargarKitCompartirGestor(false).catch(() => {});

      if (opciones.resetPropuesta) {
        reiniciarFormularioPropuestaGestor({ conservarConfirmacion: true });
      } else if (GSTATE.ingredientesDisponibles.length > 0 && GSTATE.propCategoriaSel) {
        const cats = Array.from(new Set(GSTATE.ingredientesDisponibles.map(i => i.familia_bunker_nombre || i.categoria_lamda || i.categoria_gestor)));
        if (!cats.includes(GSTATE.propCategoriaSel)) {
          reiniciarFormularioPropuestaGestor();
        }
      }

      aplicarPaletaNodo(GSTATE.nodo);
      aplicarFaviconGestor(obtenerLogoIconoGestor(GSTATE.nodo));

      const nombreMarcaHdr = GSTATE.nodo.nombre_marca || 'Mi Tienda';
      const bajadaMarcaHdr = String(GSTATE.nodo.bajada_marca || '').trim();
      const tituloCompletoHdr = bajadaMarcaHdr ? `${nombreMarcaHdr} · ${bajadaMarcaHdr}` : nombreMarcaHdr;
      const hdrLogo = obtenerLogoHeaderGestor(GSTATE.nodo);
      const logoIncluyeTextoHdr = Boolean(hdrLogo.src && GSTATE.nodo.tema_visual?.logo_incluye_texto);

      const titleEl = document.getElementById('gestor-nodo-title');
      if (titleEl) {
        titleEl.textContent = logoIncluyeTextoHdr ? 'Gestión' : `${nombreMarcaHdr} · Gestión`;
      }

      const subEl = document.getElementById('gestor-nodo-subtitle');
      if (subEl) {
        if (esPerfilEcommerceGestor(GSTATE.nodo)) {
          subEl.textContent = tMarca(GSTATE.nodo, 'subtitulo_cabecera') || 'Envíos a todo el país';
        } else {
          subEl.textContent = (GSTATE.nodo.barrio_zona || GSTATE.nodo.direccion_retiro)
            ? `📍 ${GSTATE.nodo.barrio_zona || GSTATE.nodo.direccion_retiro}`
            : 'Gestión comercial';
        }
      }

      const logoBox = document.getElementById('gestor-logo-box');
      if (logoBox) {
        const logoFallback = GSTATE.nodo.logo_original_base64 || GSTATE.nodo.logo_mono_preview_base64 || obtenerLogoIconoGestor(GSTATE.nodo) || '';
        const logoSrc = hdrLogo.src || logoFallback;
        logoBox.classList.toggle('has-emblem-logo', Boolean(hdrLogo.src && hdrLogo.esEmblema));
        logoBox.classList.toggle('has-horizontal-logo', Boolean(hdrLogo.src && !hdrLogo.esEmblema));
        logoBox.closest('.brand-identity')?.classList.toggle('logo-includes-text', logoIncluyeTextoHdr);
        if (logoSrc) {
          logoBox.innerHTML = `<img src="${esc(logoSrc)}" alt="${esc(tituloCompletoHdr)}">`;
        } else {
          const siglas = String(nombreMarcaHdr || 'GT').split(/\s+/).map(w => w[0] || '').join('').substring(0, 2).toUpperCase();
          logoBox.innerHTML = `<div class="brand-monogram">${esc(siglas)}</div>`;
        }
      }

      sincronizarTituloYMetaPwaGestor(nombreMarcaHdr);

      renderVistaGestor();
      renderizarMenuGestor();
      actualizarVisibilidadBotonPwaGestor();
      verificarEstadoRealAccesoDirectoGestor();
    }

    function abrirMenuGestor() {
      renderizarMenuGestor();
      const backdrop = document.getElementById('gestor-drawer-backdrop');
      const drawer = document.getElementById('gestor-drawer');
      if (backdrop) backdrop.classList.add('open');
      if (drawer) {
        drawer.classList.add('open');
        drawer.setAttribute('aria-hidden', 'false');
      }
      document.body.style.overflow = 'hidden';
    }

    function cerrarMenuGestor() {
      const backdrop = document.getElementById('gestor-drawer-backdrop');
      const drawer = document.getElementById('gestor-drawer');
      if (backdrop) backdrop.classList.remove('open');
      if (drawer) {
        drawer.classList.remove('open');
        drawer.setAttribute('aria-hidden', 'true');
      }
      document.body.style.overflow = '';
    }

    function irAVistaGestor(seccion) {
      abrirSeccionGestor(seccion);
    }

    function abrirSeccionGestor(seccion) {
      const mod = obtenerModulosActivosGestor();
      if (seccion === 'reparto' && (!mod.hoja_de_ruta || esPerfilEcommerceGestor())) {
        seccion = 'inicio';
      }
      if (seccion === 'propuestas' && GSTATE.vista !== 'propuestas') {
        reiniciarFormularioPropuestaGestor();
      }
      GSTATE.vista = seccion;
      try {
        window.history.pushState({ vista: seccion }, '', `#${seccion}`);
      } catch (_) {}
      renderVistaGestor();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function volverAlTableroGestor() {
      GSTATE.vista = 'inicio';
      try {
        window.history.replaceState({ vista: 'inicio' }, '', window.location.pathname + window.location.search);
      } catch (_) {}
      renderVistaGestor();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('popstate', () => {
      const hash = (window.location.hash || '').replace(/^#/, '');
      const mod = obtenerModulosActivosGestor();
      if (hash === 'reparto' && (!mod.hoja_de_ruta || esPerfilEcommerceGestor())) {
        GSTATE.vista = 'inicio';
      } else if (['reparto', 'ofertas', 'propuestas', 'logistica', 'perfil', 'pedidos', 'ctacte', 'liquidacion', 'compradores'].includes(hash)) {
        GSTATE.vista = hash;
      } else {
        GSTATE.vista = 'inicio';
      }
      renderVistaGestor();
    });

    function envolverSeccionInterna(tituloSeccion, contenidoHtml) {
      return `
        <div class="section-nav">
          <button type="button" class="btn-back" data-testid="btn-volver-inicio-gestor" onclick="volverAlTableroGestor()">
            ← Volver al inicio
          </button>
        </div>
        <h2 class="section-heading">${esc(tituloSeccion)}</h2>
        ${contenidoHtml}
      `;
    }

    function renderVistaGestor() {
      const box = document.getElementById('gestor-main-view');
      if (!box || !GSTATE.nodo) return;
      const mod = obtenerModulosActivosGestor();
      const esEc = esPerfilEcommerceGestor();

      const esInicio = !['reparto', 'ofertas', 'propuestas', 'logistica', 'perfil', 'pedidos', 'ctacte', 'liquidacion', 'compradores'].includes(GSTATE.vista) ||
        (GSTATE.vista === 'reparto' && (!mod.hoja_de_ruta || esEc));
      document.body.classList.toggle('is-home-portada', esInicio);

      if (GSTATE.vista === 'reparto' && mod.hoja_de_ruta && !esEc) {
        box.innerHTML = envolverSeccionInterna('🚗 Modo Reparto / Hoja de Ruta', renderSeccionReparto());
      } else if (GSTATE.vista === 'ofertas') {
        box.innerHTML = envolverSeccionInterna('Mi oferta y márgenes', renderSeccionOfertas());
      } else if (GSTATE.vista === 'propuestas') {
        box.innerHTML = envolverSeccionInterna('Pedir fracción o armar combo', renderSeccionPropuestas());
      } else if (GSTATE.vista === 'logistica') {
        box.innerHTML = envolverSeccionInterna(tMarca(GSTATE.nodo, 'bloque_3_heading'), renderSeccionLogistica());
      } else if (GSTATE.vista === 'perfil') {
        box.innerHTML = envolverSeccionInterna('👤 Mi Perfil y Contacto', renderSeccionPerfilGestor());
        setTimeout(() => actualizarEstadoFormularioPerfilGestor(false), 0);
      } else if (GSTATE.vista === 'pedidos') {
        box.innerHTML = envolverSeccionInterna(tMarca(GSTATE.nodo, 'bloque_4_heading'), renderSeccionPedidos());
      } else if (GSTATE.vista === 'ctacte') {
        box.innerHTML = envolverSeccionInterna(tMarca(GSTATE.nodo, 'bloque_5_heading'), renderSeccionCuentasCorrientes());
      } else if (GSTATE.vista === 'liquidacion') {
        box.innerHTML = envolverSeccionInterna(tMarca(GSTATE.nodo, 'bloque_6_heading'), renderSeccionLiquidacion());
      } else if (GSTATE.vista === 'compradores') {
        box.innerHTML = envolverSeccionInterna(tMarca(GSTATE.nodo, 'bloque_7_heading'), renderSeccionCompradores());
      } else {
        GSTATE.vista = 'inicio';
        box.innerHTML = renderTableroPrincipal();
      }
      if (GSTATE.nocturnoAbierto && mod.hoja_de_ruta && !esEc) {
        renderOverlayConduccionNocturna();
      }
    }

    // -------------------------------------------------------------------------
    // PORTADA PRINCIPAL LIMPIA: SOLO 4 CUADRADOS EN GRILLA 2x2
    // -------------------------------------------------------------------------
    function renderTableroPrincipal() {
      const esEc = esPerfilEcommerceGestor();
      const mod = obtenerModulosActivosGestor();
      const publicadas = GSTATE.ofertas.filter(o => o.publicado_tienda).length;
      const totalOfertas = GSTATE.ofertas.length;
      const porPublicar = Math.max(0, totalOfertas - publicadas);
      const propPendientes = GSTATE.propuestas.filter(p => p.estado !== 'APROBADA').length +
        (GSTATE.propuestasCombos || []).filter(p => p.estado !== 'APROBADA').length;

      const pedidosActivos = (GSTATE.pedidos || []).filter(p => String(p.estado_operativo || '').toUpperCase() !== 'ANULADO');
      const totalPedidos = pedidosActivos.length;
      const pendCobro = pedidosActivos.filter(p => !p.pago_confirmado).length;
      const pedidosReclamoPago = pedidosActivos.filter(p => !p.pago_confirmado && Boolean(p.reclamo_pago_no_recibido));
      const pedidosAvisoCliente = pedidosActivos.filter(p => !p.pago_confirmado && !p.reclamo_pago_no_recibido && Number(p.monto_declarado_cliente || 0) > 0);
      const listosRecibirLote = !esEc && mod.canasto_consolidado
        ? pedidosActivos.filter(p => Number(p.hito_tracking_actual || 1) === 3 && p.lote_canasto_id && !p.lote_debito_registrado).length
        : 0;

      const totClientes = Number(GSTATE.compradoresResumen?.total_compradores || GSTATE.compradores?.length || 0);
      const actClientes = Number(GSTATE.compradoresResumen?.con_pedido_activo || 0);
      const recClientes = Number(GSTATE.compradoresResumen?.recurrentes || 0);

      let badgePedidos = totalPedidos > 0 ? `${totalPedidos} activa${totalPedidos === 1 ? '' : 's'}` : 'Al día';
      let badgePedidosCls = totalPedidos > 0 ? '' : 'ok';
      let metaPedidos = totalPedidos === 0
        ? (esEc ? 'Sin ventas activas aún' : 'Sin pedidos activos aún')
        : (pendCobro > 0
            ? `${pendCobro} pendiente${pendCobro === 1 ? '' : 's'} de cobro`
            : `${totalPedidos} con pago verificado`);

      if (pedidosReclamoPago.length > 0) {
        badgePedidos = `🚨 ${pedidosReclamoPago.length} revisar`;
        badgePedidosCls = 'alert';
        metaPedidos = 'Solicitar comprobante de transferencia';
      } else if (pedidosAvisoCliente.length > 0) {
        badgePedidos = `🔔 ${pedidosAvisoCliente.length} aviso${pedidosAvisoCliente.length === 1 ? '' : 's'}`;
        badgePedidosCls = 'warn';
        metaPedidos = 'Transferencia en verificación bancaria';
      } else if (listosRecibirLote > 0) {
        badgePedidos = `📥 ${listosRecibirLote} lote`;
        badgePedidosCls = 'ok';
        metaPedidos = `${listosRecibirLote} pedido${listosRecibirLote === 1 ? '' : 's'} listo${listosRecibirLote === 1 ? '' : 's'} para recibir`;
      }

      const tarjetas2x2 = [
        {
          id: 'ofertas',
          icono: '🏷️',
          titulo: 'Mi oferta y márgenes',
          badge: totalOfertas > 0 ? `${publicadas}/${totalOfertas}` : '0',
          badgeCls: publicadas > 0 ? 'ok' : '',
          meta: totalOfertas === 0
            ? 'Sin productos cargados aún'
            : (porPublicar > 0
                ? `${publicadas} publicados · ${porPublicar} por publicar`
                : `${publicadas} productos publicados`),
          alerta: false
        },
        {
          id: 'propuestas',
          icono: '⚖️',
          titulo: 'Pedir fracción o combo',
          badge: propPendientes > 0 ? `${propPendientes} pend.` : 'Nuevo',
          badgeCls: propPendientes > 0 ? 'warn' : '',
          meta: propPendientes > 0
            ? `${propPendientes} solicitud${propPendientes === 1 ? '' : 'es'} en cotización`
            : 'Nueva presentación o pack compuesto',
          alerta: false
        },
        {
          id: 'pedidos',
          icono: '📦',
          titulo: tMarca(GSTATE.nodo, 'bloque_4_titulo'),
          badge: badgePedidos,
          badgeCls: badgePedidosCls,
          meta: metaPedidos,
          alerta: pedidosReclamoPago.length > 0
        },
        {
          id: 'compradores',
          icono: '👥',
          titulo: 'Clientes de mi tienda',
          badge: `${totClientes}`,
          badgeCls: actClientes > 0 ? 'ok' : '',
          meta: totClientes === 0
            ? 'Se suman con cada compra'
            : (actClientes > 0
                ? `${actClientes} con orden activa${recClientes > 0 ? ` · ${recClientes} recurrente${recClientes === 1 ? '' : 's'}` : ''}`
                : `${totClientes} registrado${totClientes === 1 ? '' : 's'}${recClientes > 0 ? ` · ${recClientes} recurrente${recClientes === 1 ? '' : 's'}` : ''}`),
          alerta: false
        }
      ];

      return `
        <div class="gestor-home-grid-2x2" data-testid="gestor-home-grid-2x2">
          ${tarjetas2x2.map(c => `
            <button type="button" class="gestor-square-card${c.alerta ? ' has-alert' : ''}" data-testid="gestor-card-${esc(c.id)}" onclick="abrirSeccionGestor('${esc(c.id)}')">
              <div class="sq-card-top">
                <span class="sq-card-icon" aria-hidden="true">${c.icono}</span>
                ${c.badge ? `<span class="sq-card-badge ${esc(c.badgeCls)}">${esc(c.badge)}</span>` : ''}
              </div>
              <div class="sq-card-body">
                <div class="sq-card-title">${esc(c.titulo)}</div>
                <div class="sq-card-meta">${esc(c.meta)}</div>
              </div>
            </button>
          `).join('')}
        </div>
      `;
    }

    // WHATSAPP, DIFUSIÓN MARCA BLANCA Y LINK DE TIENDA (Etapa A3)
    // -------------------------------------------------------------------------
    async function cargarKitCompartirGestor(forzar = false) {
      if (!GSTATE.nodo?.id) return null;
      if (GSTATE.compartirKit && !forzar) return GSTATE.compartirKit;
      GSTATE.aficheQrDataUrl = '';
      try {
        const resp = await fetchGestor(`/api/produccion/nodos/gestor/${Number(GSTATE.nodo.id)}/compartir-kit`, { cache: 'no-store' });
        const data = await leerRespuestaJsonSegura(resp);
        if (resp.ok && data.ok) {
          GSTATE.compartirKit = data;
          construirAficheQrMarcaBlancaDataUrl().catch(() => {});
          return data;
        }
      } catch (_) {}
      return null;
    }

    function obtenerOfertasPublicadasDifusion() {
      const kitOfertas = Array.isArray(GSTATE.compartirKit?.ofertas_publicadas)
        ? GSTATE.compartirKit.ofertas_publicadas
        : [];
      if (kitOfertas.length > 0) return kitOfertas;

      const base = obtenerUrlBaseTiendaFallback();
      return (GSTATE.ofertas || [])
        .filter(o => o.publicado_tienda)
        .map(o => ({
          oferta_id: Number(o.id),
          sku_nodo: o.sku_nodo || '',
          nombre_publico: String(o.nombre_vidriera_efectivo || o.nombre_vidriera_personalizado || o.nombre_oficial_lamda || o.nombre_publico || 'Producto').trim(),
          categoria_familiar: String(o.categoria_vidriera_efectiva || o.categoria_vidriera_personalizada || o.categoria_oficial_lamda || o.categoria_familiar || 'Almacén').trim(),
          presentacion_etiqueta: o.presentacion_etiqueta || '',
          kilos_unidad: Number(o.kilos_unidad || 0),
          precio_venta_vecino: Number(o.precio_venta_vecino || 0),
          destacado_tienda: Boolean(o.destacado_tienda),
          url_directa: `${base}?oferta=${Number(o.id)}`
        }));
    }

    function obtenerUrlBaseTiendaFallback() {
      if (GSTATE.compartirKit?.url_tienda_publica) {
        return GSTATE.compartirKit.url_tienda_publica;
      }
      return `${window.location.origin}/tienda/${encodeURIComponent(GSTATE.slug || '')}`;
    }

    function obtenerUrlDifusionActual() {
      const base = obtenerUrlBaseTiendaFallback();
      if (GSTATE.difusionModo === 'oferta') {
        const ofertas = obtenerOfertasPublicadasDifusion();
        const of = ofertas.find(o => Number(o.oferta_id) === Number(GSTATE.difusionOfertaId)) || ofertas[0];
        if (of) {
          return of.url_directa || `${base}?oferta=${Number(of.oferta_id)}`;
        }
      }
      return base;
    }

    function generarTextoSugeridoDifusion() {
      const nodoKit = GSTATE.compartirKit?.nodo || GSTATE.nodo || {};
      const nombreMarca = nodoKit.nombre_marca || 'Nuestra tienda';
      const bajadaMarca = String(nodoKit.bajada_marca || '').trim();
      const encabezadoMarca = bajadaMarca ? `${nombreMarca} · ${bajadaMarca}` : nombreMarca;
      const url = obtenerUrlDifusionActual();
      const prox = GSTATE.compartirKit?.proxima_entrega?.asignada?.label_completo
        || GSTATE.proximaEntrega?.asignada?.label_completo
        || '';
      const corte = GSTATE.compartirKit?.proxima_entrega?.asignada?.label_corte
        || GSTATE.proximaEntrega?.asignada?.label_corte
        || '';
      const perfilDif = obtenerPerfilPublicoGestor();
      const firmaIgTxt = (perfilDif.instagram_usuario && perfilDif.incluir_instagram_en_difusion)

      if (!_ultimoPayloadWaGestor) return;

          mensaje: _ultimoPayloadWaGestor.mensaje,
          solo_preview: false
        })
      });

    async function descargarVideoBienvenidaGestor() {
      const vid = obtenerVideoBienvenidaGestor();
      const url = vid.url_whatsapp || vid.url_web;
      if (!url) {
        mostrarAvisoPantallaGestor('No hay video disponible para descargar.', 'error');
        return;
      }
      const statusEl = document.getElementById('difusion-video-status');
      if (statusEl) {
        statusEl.style.display = 'block';
        statusEl.textContent = '⬇️ Descargando video .mp4 listo para WhatsApp...';
      }
      try {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const blob = await resp.blob();
        const objUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = objUrl;
        a.download = _nombreArchivoVideoDifusionGestor();
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(objUrl), 5000);
        if (statusEl) {
          statusEl.textContent = '✅ Video descargado. Paso 2: abrí WhatsApp con el botón de la derecha y adjuntalo desde tu galería o carpeta Descargas.';
        }
      } catch (err) {
        const a = document.createElement('a');
        a.href = url;
        a.download = _nombreArchivoVideoDifusionGestor();
        a.target = '_blank';
        a.rel = 'noopener';
        a.click();
        if (statusEl) {
          statusEl.textContent = '⬇️ Se abrió el video para guardar. Luego abrí WhatsApp con el mensaje sugerido.';
        }
      }
    }

    async function compartirVideoDifusionGestor() {
      const vid = obtenerVideoBienvenidaGestor();
      const urlVideo = vid.url_whatsapp || vid.url_web;
      if (!urlVideo) {
        mostrarAvisoPantallaGestor('No hay video disponible en este nodo.', 'error');
        return;
      }
      const ta = document.getElementById('difusion-texto-textarea');
      const texto = (ta?.value || generarTextoSugeridoDifusion()).trim();
      const nombreMarca = GSTATE.compartirKit?.nodo?.nombre_marca || GSTATE.nodo?.nombre_marca || 'Tienda';
      const btn = document.getElementById('btn-difusion-compartir-video');
      const statusEl = document.getElementById('difusion-video-status');

      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Preparando video MP4...';
      }
      if (statusEl) {
        statusEl.style.display = 'block';
        statusEl.textContent = '⏳ Preparando archivo de video con sonido para compartir...';
      }

      try {
        const resp = await fetch(urlVideo);
        if (!resp.ok) throw new Error(`No se pudo descargar el video (HTTP ${resp.status})`);
        const blob = await resp.blob();
        const file = new File([blob], _nombreArchivoVideoDifusionGestor(), { type: 'video/mp4' });

        const soportaShareFiles = typeof navigator !== 'undefined'
          && typeof navigator.share === 'function'
          && typeof navigator.canShare === 'function'
          && navigator.canShare({ files: [file] });

        if (soportaShareFiles) {
          try {
            await navigator.clipboard?.writeText(texto);
          } catch (_) {}
          if (statusEl) {
            statusEl.textContent = '📲 Abriendo menú para elegir WhatsApp o redes (el texto también quedó copiado por si necesitás pegarlo como epígrafe).';
          }
          await navigator.share({
            files: [file],
            title: nombreMarca,
            text: texto
          });
          if (statusEl) {
            statusEl.textContent = '✅ Video compartido.';
          }
          return;
        }

        // Fallback claro en escritorio o navegadores sin Web Share de archivos
        const objUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = objUrl;
        a.download = _nombreArchivoVideoDifusionGestor();
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(objUrl), 5000);
        try {
          await navigator.clipboard?.writeText(texto);
        } catch (_) {}
        if (statusEl) {
          statusEl.innerHTML = '💻 <strong>Modo escritorio (2 pasos):</strong> ya descargamos el <code>.mp4</code> y copiamos tu mensaje. Tocá <strong>💬 2. Abrir WhatsApp con texto</strong> y arrastrá el video descargado en el chat o grupo.';
        }
      } catch (err) {
        if (err && err.name === 'AbortError') {
          if (statusEl) statusEl.style.display = 'none';
        } else {
          if (statusEl) {
            statusEl.textContent = 'Usá los 2 pasos de abajo: 1) Descargar video .mp4 y 2) Abrir WhatsApp con texto.';
          }
        }
      } finally {
        const btnPost = document.getElementById('btn-difusion-compartir-video');
        if (btnPost) {
          btnPost.disabled = false;
          btnPost.textContent = '🎬 Compartir video + mensaje (WhatsApp / Redes)';
        }
      }
    }
