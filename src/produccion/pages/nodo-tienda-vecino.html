<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Tienda Barrial</title>
  <!-- /lamda-cloud-runtime.js omitido en apps externas de Nodos (Marca Blanca) -->
  <script>
    window.__nodoTiendaDeferredPrompt = null;
    try {
      window.addEventListener('beforeinstallprompt', function(ev) {
        ev.preventDefault();
        window.__nodoTiendaDeferredPrompt = ev;
        if (typeof window.renderizarBarraPwaTienda === 'function') {
          window.renderizarBarraPwaTienda();
        }
      });
      window.addEventListener('appinstalled', function() {
        window.__nodoTiendaDeferredPrompt = null;
        if (typeof window.cerrarModalPwaTienda === 'function') {
          window.cerrarModalPwaTienda();
        }
        if (typeof window.renderizarBarraPwaTienda === 'function') {
          window.renderizarBarraPwaTienda();
        }
      });
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) {
            var sUrl = (r.active && r.active.scriptURL) || (r.installing && r.installing.scriptURL) || (r.waiting && r.waiting.scriptURL) || '';
            if (sUrl.indexOf('/sw-nodo-pwa.js') === -1) {
              r.unregister();
            }
          });
        }).catch(function(){});
        navigator.serviceWorker.register('/sw-nodo-pwa.js', { scope: '/' }).catch(function(){});
      }
      localStorage.removeItem('lamda_prefer_mobile_home');
    } catch (_) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <!-- Leaflet 1.9.4 + OSM (Pin opcional liviano de entrega para el Vecino) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    :root {
      --brand: #a2553b;
      --brand-dark: #7d3e28;
      --brand-light: rgba(162, 85, 59, 0.11);
      --brand-border: rgba(162, 85, 59, 0.28);
      --accent: #a2553b;
      --sun: #fef3c7;
      --bg: #faf7f3;
      --card: #ffffff;
      --surface-warm: #f5efe8;
      --text: #3e2519;
      --muted: #7d6a5f;
      --border: #eae1d7;
      --ok: #2f6f4e;
      --ok-soft: #eaf4ee;
      --ok-border: #86efac;
      --hero-bg: #fffdfb;
      --font-brand: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-brand);
      background: var(--bg);
      color: var(--text);
      padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
      -webkit-font-smoothing: antialiased;
    }
    @media (min-width: 768px) {
      body {
        padding-bottom: 110px;
      }
    }
    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }
    /* Barra superior discreta sólo en Modo Espejo local */
    .lab-bar {
      background: #3e2519;
      color: #f5efe8;
      padding: 7px 16px;
      font-size: 0.76rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .lab-bar select, .lab-bar button, .lab-bar a {
      background: rgba(255,255,255,0.12);
      color: #fffdfb;
      border: 1px solid rgba(255,255,255,0.22);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: none;
      font-weight: 700;
      font-family: inherit;
    }
    .lab-bar button.active {
      background: #f59e0b;
      color: #3e2519;
      border-color: #f59e0b;
      font-weight: 800;
    }

    /* Top App Bar Minimalista con Protagonismo de Marca */
    .hero {
      position: sticky;
      top: 0;
      z-index: 120;
      background: var(--bg);
      background: color-mix(in srgb, var(--bg) 94%, #ffffff 6%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--text);
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 12px rgba(62, 37, 25, 0.04);
    }
    .hero-inner {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 44px;
      align-items: center;
      gap: 8px;
      min-height: 48px;
    }
    .hero-left-slot {
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }
    .hero-right-slot {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }
    .icon-appbar-btn {
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.12s;
      box-shadow: 0 1px 4px rgba(62, 37, 25, 0.04);
    }
    .icon-appbar-btn:active {
      transform: scale(0.96);
    }
    .icon-appbar-btn:hover,
    .icon-appbar-btn.is-active {
      border-color: var(--brand);
      background: var(--brand-light);
      color: var(--brand-dark);
    }
    .brand-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 0;
      text-align: center;
      justify-self: center;
    }
    .brand-box.logo-includes-text .brand-text-stack {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }
    .brand-logo {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .brand-logo.has-horizontal-logo {
      width: auto;
      max-width: 214px;
      height: 44px;
      justify-content: center;
    }
    .brand-logo img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }
    .brand-monogram {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: var(--brand-light);
      border: 1px solid var(--brand-border);
      color: var(--brand-dark);
      font-weight: 900;
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-text-stack {
      min-width: 0;
      text-align: left;
    }
    .brand-title {
      margin: 0;
      font-size: 1.22rem;
      font-weight: 900;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1.12;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-sub {
      margin: 2px 0 0 0;
      font-size: 0.74rem;
      color: var(--muted);
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }
    .desktop-nav-actions {
      display: none;
      align-items: center;
      gap: 8px;
    }
    .desk-nav-pill {
      min-height: 40px;
      padding: 7px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .desk-nav-pill:hover {
      border-color: var(--brand-border);
      background: var(--surface-warm);
    }
    .desk-nav-pill.cart-pill {
      border-color: var(--brand-border);
      background: var(--brand-light);
      color: var(--brand-dark);
      font-weight: 900;
    }
    .desk-nav-pill.cart-pill.has-items {
      background: var(--brand);
      border-color: var(--brand);
      color: #ffffff;
    }
    .desk-cart-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 900;
      background: rgba(255, 255, 255, 0.24);
      color: inherit;
    }
    .desk-nav-pill.cart-pill:not(.has-items) .desk-cart-badge {
      background: var(--card);
      color: var(--brand-dark);
    }

    @media (min-width: 768px) {
      .hero {
        padding: 11px 20px;
      }
      .hero-inner {
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      .hero-left-slot {
        gap: 12px;
      }
      .brand-box {
        justify-content: flex-start;
      }
      .brand-logo.has-horizontal-logo {
        max-width: 248px;
        height: 48px;
      }
      .brand-sub {
        max-width: 320px;
      }
      .desktop-nav-actions {
        display: inline-flex;
      }
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 10px 12px 20px;
    }
    @media (min-width: 768px) {
      .container {
        padding: 18px 20px 28px;
      }
    }

    /* Pastilla Compacta de Próxima Entrega (Portada Limpia) */
    .delivery-strip-compact {
      width: 100%;
      background: var(--surface-warm);
      border: 1px solid var(--brand-border);
      border-radius: 13px;
      padding: 8px 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      color: var(--text);
      transition: border-color 0.15s, background 0.15s;
    }
    .delivery-strip-compact:hover {
      border-color: var(--brand);
    }
    .delivery-strip-compact.after-cutoff {
      background: #fffbeb;
      border-color: #f59e0b;
    }
    .delivery-strip-icon {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: var(--card);
      border: 1px solid var(--brand-border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.84rem;
      flex-shrink: 0;
    }
    .delivery-strip-main {
      flex: 1;
      min-width: 0;
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.3;
    }
    .delivery-strip-main strong {
      color: var(--brand-dark);
      font-weight: 900;
    }
    .delivery-strip-compact.after-cutoff .delivery-strip-main strong {
      color: #92400e;
    }
    .delivery-strip-chevron {
      font-size: 1.08rem;
      font-weight: 900;
      color: var(--brand-dark);
      flex-shrink: 0;
      line-height: 1;
      opacity: 0.8;
    }

    /* Buscador Desplegable y Categorías */
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-bottom: 12px;
    }
    .search-collapsible-wrap {
      display: none;
      position: relative;
      align-items: center;
    }
    .search-collapsible-wrap.open {
      display: flex;
    }
    .search-input {
      width: 100%;
      padding: 11px 40px 11px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--brand-border);
      font-size: 0.94rem;
      font-family: inherit;
      font-weight: 700;
      color: var(--text);
      background: var(--card);
      outline: none;
      box-shadow: 0 3px 10px rgba(62, 37, 25, 0.05);
    }
    .search-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-light);
    }
    .search-clear-btn {
      position: absolute;
      right: 8px;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: none;
      background: var(--surface-warm);
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .search-clear-btn:hover {
      color: var(--text);
    }

    /* Menú Lateral Desplegable (Drawer ☰) */
    .nodo-drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(42, 27, 18, 0.48);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      z-index: 290;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }
    .nodo-drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .nodo-drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: min(88vw, 356px);
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      z-index: 295;
      transform: translateX(-104%);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      box-shadow: 14px 0 36px rgba(42, 27, 18, 0.22);
      border-right: 1px solid var(--border);
      overflow: hidden;
    }
    .nodo-drawer.open {
      transform: translateX(0);
    }
    .nodo-drawer-head {
      padding: 16px 16px 14px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }
    .nodo-drawer-close {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--surface-warm);
      color: var(--text);
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .nodo-drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 15px calc(22px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: 13px;
      -webkit-overflow-scrolling: touch;
    }
    .drawer-section-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 13px 14px;
      box-shadow: 0 2px 8px rgba(62, 37, 25, 0.04);
    }
    .drawer-action-btn {
      width: 100%;
      min-height: 46px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--brand-border);
      background: var(--card);
      color: var(--text);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }
    .drawer-action-btn:hover {
      background: var(--surface-warm);
      border-color: var(--brand);
    }
    .drawer-pwa-card {
      background: linear-gradient(135deg, var(--card) 0%, var(--surface-warm) 100%);
      border: 1.5px solid var(--brand);
      border-radius: 15px;
      padding: 12px 13px;
      box-shadow: 0 4px 14px var(--brand-light);
    }
    .drawer-pwa-trigger {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      border: none;
      padding: 0;
      text-align: left;
      font-family: inherit;
      color: var(--text);
      cursor: pointer;
    }

    /* Barra de Navegación Inferior Estilo App (Móvil < 768px) */
    .mobile-bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 150;
      background: rgba(255, 253, 251, 0.97);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      box-shadow: 0 -4px 18px rgba(62, 37, 25, 0.08);
      padding: 5px 6px calc(6px + env(safe-area-inset-bottom, 0px));
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 4px;
    }
    @media (min-width: 768px) {
      .mobile-bottom-nav {
        display: none !important;
      }
    }
    .bnav-item {
      position: relative;
      min-height: 52px;
      padding: 5px 4px 4px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.71rem;
      font-weight: 800;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      transition: color 0.15s, background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .bnav-item:active {
      transform: scale(0.96);
    }
    .bnav-item.active {
      color: var(--brand);
    }
    .bnav-item.active::before {
      content: '';
      position: absolute;
      top: 0;
      left: 26%;
      right: 26%;
      height: 3px;
      border-radius: 999px;
      background: var(--brand);
    }
    .bnav-item.bnav-cart-has-items {
      background: var(--brand-light);
      color: var(--brand-dark);
    }
    .bnav-icon-wrap {
      position: relative;
      width: 26px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .bnav-badge {
      position: absolute;
      top: -5px;
      right: -10px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--brand);
      color: #ffffff;
      font-size: 0.67rem;
      font-weight: 900;
      display: none;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #ffffff;
      line-height: 1;
    }
    .bnav-live-dot {
      position: absolute;
      top: -1px;
      right: -2px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #16a34a;
      border: 1.5px solid #ffffff;
      display: none;
    }
    .bnav-label {
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.1;
    }
    .bnav-item.bnav-cart-has-items .bnav-label {
      font-weight: 900;
      color: var(--brand-dark);
    }
    .cart-empty-toast {
      position: fixed;
      left: 50%;
      bottom: calc(74px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%) translateY(10px);
      background: var(--text);
      color: #fffdfb;
      padding: 9px 15px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      box-shadow: 0 8px 22px rgba(42, 27, 18, 0.25);
      z-index: 180;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      white-space: nowrap;
      max-width: calc(100vw - 28px);
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cart-empty-toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .cats-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch;
    }
    .cats-row::-webkit-scrollbar {
      display: none;
    }
    .cat-btn {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 0.83rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .cat-btn.active {
      background: var(--brand);
      color: #ffffff;
      border-color: var(--brand);
    }

    /* Grilla de Productos */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }
    .prod-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    }
    .prod-card:hover {
      transform: translateY(-2px);
      border-color: var(--brand-border);
      box-shadow: 0 8px 20px rgba(62, 37, 25, 0.06);
    }
    .prod-cat {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .prod-title {
      font-size: 1.02rem;
      font-weight: 900;
      color: var(--text);
      margin: 4px 0 2px 0;
      line-height: 1.28;
      overflow-wrap: anywhere;
    }
    .prod-card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .prod-head-info {
      min-width: 0;
      flex: 1;
    }
    .prod-card.prod-card-destacado {
      border: 2px solid var(--brand);
      box-shadow: 0 10px 26px var(--brand-light);
      background: linear-gradient(180deg, #fffaf6 0%, #ffffff 42%);
    }
    .prod-pres-row.prod-pres-destacado {
      border-color: var(--brand);
      background: var(--brand-light);
    }
    .badge-oferta-enfocada {
      display: inline-block;
      margin-bottom: 6px;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--brand);
      color: #fff;
      letter-spacing: 0.02em;
    }
    .prod-pres {
      display: inline-block;
      background: var(--surface-warm);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 8px;
    }
    .prod-meta-row {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 2px;
    }
    .prod-pres-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .prod-pres-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 9px;
      border-radius: 10px;
      background: var(--surface-warm);
      border: 1px solid var(--border);
    }
    .prod-pres-label {
      min-width: 0;
      flex: 1;
      font-size: 0.81rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.25;
      overflow-wrap: anywhere;
    }
    .prod-pres-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .prod-pres-price {
      font-size: 1rem;
      font-weight: 900;
      color: var(--text);
      white-space: nowrap;
    }
    .btn-ver-ing {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--brand-light);
      color: var(--brand-dark);
      border: 1px solid var(--brand-border);
      font-family: inherit;
      font-size: 0.76rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.12s;
    }
    @media (max-width: 420px) {
      .btn-ver-ing {
        font-size: 0.72rem;
        padding: 3px 8px;
      }
      .prod-pres-row {
        padding: 6px 7px;
        gap: 6px;
      }
      .prod-pres-price {
        font-size: 0.94rem;
      }
    }
    .btn-ver-ing:hover {
      background: var(--surface-warm);
      transform: translateY(-1px);
    }
    .ing-chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 4px 0;
    }
    .ing-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border-radius: 11px;
      background: var(--surface-warm);
      border: 1px solid var(--brand-border);
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 800;
    }
    .ing-chip-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--brand);
      flex-shrink: 0;
    }
    .prod-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .prod-price {
      font-size: 1.24rem;
      font-weight: 900;
      color: var(--text);
    }
    .btn-add {
      background: var(--brand);
      color: #ffffff;
      border: none;
      padding: 9px 16px;
      border-radius: 10px;
      font-weight: 800;
      font-family: inherit;
      font-size: 0.86rem;
      cursor: pointer;
    }
    .btn-add-compact {
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 0.79rem;
      white-space: nowrap;
    }
    .btn-add:hover {
      background: var(--brand-dark);
    }
    .stepper {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--brand-light);
      padding: 4px 8px;
      border-radius: 10px;
      border: 1px solid var(--brand-border);
    }
    .stepper-compact {
      gap: 7px;
      padding: 2px 6px;
      border-radius: 8px;
    }
    .stepper-compact button {
      width: 24px !important;
      height: 24px !important;
      border-radius: 6px !important;
      font-size: 0.92rem !important;
    }
    .stepper button {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      border: none;
      background: var(--brand);
      color: #ffffff;
      font-weight: 900;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
    }
    .stepper span {
      font-weight: 900;
      min-width: 18px;
      text-align: center;
      color: var(--brand-dark);
    }

    /* Barra flotante inferior de Carrito (solo escritorio >= 768px; en móvil se integra en la Bottom Nav) */
    .cart-bar {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 680px;
      background: var(--text);
      color: #fffdfb;
      padding: 14px 20px;
      border-radius: 16px;
      display: none;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 12px 28px rgba(62, 37, 25, 0.28);
      z-index: 90;
    }
    @media (max-width: 767px) {
      .cart-bar {
        display: none !important;
      }
    }
    .cart-bar-btn {
      background: var(--brand);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 800;
      font-family: inherit;
      font-size: 0.92rem;
      cursor: pointer;
    }

    /* Modal Checkout */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(62, 37, 25, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 200;
      overflow-y: auto;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-card {
      background: var(--card);
      width: 100%;
      max-width: 580px;
      border-radius: 18px;
      padding: 22px;
      max-height: 92vh;
      overflow-y: auto;
      box-shadow: 0 20px 45px rgba(62, 37, 25, 0.25);
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 0.92rem;
      font-family: inherit;
      color: var(--text);
    }
    .option-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    @media (max-width: 520px) {
      .option-grid {
        grid-template-columns: 1fr;
      }
    }
    .opt-card {
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 11px;
      cursor: pointer;
      text-align: left;
      background: var(--card);
      transition: all 0.15s;
    }
    .opt-card.active {
      border-color: var(--brand);
      background: var(--brand-light);
    }
    .opt-title {
      font-weight: 900;
      font-size: 0.88rem;
      color: var(--text);
    }
    .opt-sub {
      font-size: 0.76rem;
      color: var(--muted);
      font-weight: 600;
      margin-top: 2px;
    }

    /* Wizard Fullscreen de 1 Sola Acción por Pantalla (Checkout Cliente Final) */
    .chk-fullscreen-wizard {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      display: none;
      flex-direction: column;
      z-index: 320;
      overflow: hidden;
    }
    .chk-wiz-shell {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chk-wiz-header {
      flex-shrink: 0;
      background: var(--hero-bg);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 10px rgba(62, 37, 25, 0.05);
    }
    .chk-wiz-header-inner {
      max-width: 600px;
      margin: 0 auto;
      padding: 11px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chk-wiz-nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .chk-btn-volver {
      min-height: 44px;
      padding: 8px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-family: inherit;
      font-size: 0.96rem;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 1px 4px rgba(62, 37, 25, 0.05);
    }
    .chk-btn-volver:active {
      transform: scale(0.98);
    }
    .chk-step-pill {
      font-size: 0.86rem;
      font-weight: 900;
      color: var(--brand-dark);
      background: var(--brand-light);
      border: 1px solid var(--brand-border);
      padding: 6px 13px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .chk-wiz-brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .chk-wiz-logo-horizontal {
      height: 44px;
      max-width: 215px;
      object-fit: contain;
      display: block;
    }
    .chk-wiz-brand-std {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }
    .chk-wiz-brand-std img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      border-radius: 10px;
      flex-shrink: 0;
    }
    .chk-wiz-brand-name {
      font-size: 1.18rem;
      font-weight: 900;
      color: var(--text);
      line-height: 1.15;
    }
    .chk-wiz-brand-sub {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      margin-top: 1px;
    }
    .chk-wiz-delivery-chip {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--brand-dark);
      background: var(--surface-warm);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 999px;
      max-width: 100%;
    }
    .chk-wiz-progress-track {
      width: 100%;
      height: 4px;
      background: var(--border);
      overflow: hidden;
    }
    .chk-wiz-progress-fill {
      height: 100%;
      background: var(--brand);
      transition: width 0.22s ease;
    }
    .chk-wiz-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 22px 16px 26px;
      -webkit-overflow-scrolling: touch;
    }
    .chk-wiz-stage {
      max-width: 540px;
      margin: 0 auto;
      width: 100%;
    }
    .chk-wiz-question {
      margin: 0 0 6px 0;
      font-size: 1.36rem;
      font-weight: 900;
      color: var(--text);
      line-height: 1.2;
      letter-spacing: -0.015em;
    }
    .chk-wiz-lead {
      margin: 0 0 18px 0;
      font-size: 0.93rem;
      color: var(--muted);
      font-weight: 700;
      line-height: 1.42;
    }
    .chk-big-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .chk-big-card {
      width: 100%;
      min-height: 84px;
      padding: 16px;
      border-radius: 16px;
      border: 2px solid var(--border);
      background: var(--card);
      text-align: left;
      font-family: inherit;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: border-color 0.16s ease, background-color 0.16s ease, box-shadow 0.16s ease;
      box-shadow: 0 3px 10px rgba(62, 37, 25, 0.04);
    }
    .chk-big-card.active {
      border-color: var(--brand);
      background: var(--brand-light);
      box-shadow: 0 6px 18px rgba(62, 37, 25, 0.09);
    }
    .chk-big-card-title {
      font-size: 1.03rem;
      font-weight: 900;
      color: var(--text);
      line-height: 1.25;
    }
    .chk-big-card-sub {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
      margin-top: 4px;
      line-height: 1.35;
    }
    .chk-big-price-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 900;
      background: var(--surface-warm);
      color: var(--brand-dark);
      border: 1px solid var(--brand-border);
    }
    .chk-big-radio {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #cfc4b8;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.92rem;
      font-weight: 900;
      color: transparent;
      flex-shrink: 0;
    }
    .chk-big-card.active .chk-big-radio {
      border-color: var(--brand);
      background: var(--brand);
      color: #ffffff;
    }
    .chk-field-lg {
      margin-bottom: 15px;
    }
    .chk-field-lg label {
      display: block;
      font-size: 0.9rem;
      font-weight: 900;
      color: var(--text);
      margin-bottom: 6px;
    }
    .chk-field-lg input {
      width: 100%;
      min-height: 52px;
      padding: 13px 14px;
      border-radius: 13px;
      border: 1.5px solid var(--border);
      background: var(--card);
      font-size: 1rem;
      font-family: inherit;
      font-weight: 700;
      color: var(--text);
    }
    .chk-field-lg input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-light);
    }
    .chk-wiz-footer {
      flex-shrink: 0;
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      box-shadow: 0 -4px 16px rgba(62, 37, 25, 0.06);
    }
    .chk-wiz-footer-inner {
      max-width: 540px;
      margin: 0 auto;
      width: 100%;
    }
    .chk-btn-primary {
      width: 100%;
      min-height: 54px;
      padding: 14px 18px;
      border-radius: 14px;
      border: none;
      background: var(--brand);
      color: #ffffff;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      transition: opacity 0.16s ease, background-color 0.16s ease;
    }
    .chk-btn-primary:disabled {
      opacity: 0.40 !important;
      cursor: not-allowed !important;
      pointer-events: none;
    }

    /* Seguimiento en Vivo Marca Blanca (Estilo Mercado Libre) */
    .btn-track-header {
      background: var(--brand-light);
      color: var(--brand-dark);
      border: 1.5px solid var(--brand-border);
      padding: 9px 15px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-track-header:hover {
      background: var(--brand);
      color: #ffffff;
      border-color: var(--brand);
    }
    .active-order-banner {
      background: linear-gradient(135deg, #fffdfb 0%, #f5efe8 100%);
      border: 1.5px solid var(--brand-border);
      border-radius: 16px;
      padding: 13px 16px;
      margin-bottom: 14px;
      display: none;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: 0 4px 14px rgba(62, 37, 25, 0.06);
    }
    .trk-hero-box {
      background: linear-gradient(135deg, var(--surface-warm) 0%, #fffdfb 100%);
      border: 1.5px solid var(--brand-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .trk-hero-box.completed {
      background: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 100%);
      border-color: #86efac;
    }
    .trk-progress-track {
      width: 100%;
      height: 8px;
      background: #e7ddd3;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 12px;
    }
    .trk-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--brand) 0%, #16a34a 100%);
      border-radius: 999px;
      transition: width 0.35s ease;
    }
    .trk-timeline {
      position: relative;
      padding: 4px 0 4px 6px;
      margin: 0 0 16px 0;
    }
    .trk-step {
      display: flex;
      gap: 14px;
      position: relative;
      padding-bottom: 18px;
    }
    .trk-step:last-child {
      padding-bottom: 2px;
    }
    .trk-step:not(:last-child)::before {
      content: '';
      position: absolute;
      left: 15px;
      top: 32px;
      bottom: 0;
      width: 2.5px;
      background: #e5dcd2;
    }
    .trk-step.done:not(:last-child)::before {
      background: #16a34a;
    }
    .trk-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.92rem;
      font-weight: 900;
      background: #f3ede6;
      border: 2px solid #d8cbc0;
      color: var(--muted);
      z-index: 1;
    }
    .trk-step.done .trk-dot {
      background: #dcfce7;
      border-color: #16a34a;
      color: #15803d;
    }
    .trk-step.current .trk-dot {
      background: var(--brand);
      border-color: var(--brand-dark);
      color: #ffffff;
      box-shadow: 0 0 0 5px var(--brand-light);
      animation: trkPulse 2s infinite;
    }
    .trk-step.done.current.final-step .trk-dot {
      background: #16a34a;
      border-color: #15803d;
      box-shadow: 0 0 0 5px rgba(22, 163, 74, 0.18);
    }
    @keyframes trkPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    .trk-step-body {
      flex: 1;
      min-width: 0;
      padding-top: 3px;
    }
    .trk-step-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }
    .trk-step-title {
      font-size: 0.93rem;
      font-weight: 800;
      color: var(--muted);
    }
    .trk-step.done .trk-step-title {
      color: var(--text);
    }
    .trk-step.current .trk-step-title {
      font-size: 1rem;
      font-weight: 900;
      color: var(--brand-dark);
    }
    .trk-step.done.current.final-step .trk-step-title {
      color: #15803d;
    }
    .trk-step-time {
      font-size: 0.74rem;
      font-weight: 800;
      color: #15803d;
      background: #ecfdf5;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .trk-step-desc {
      font-size: 0.81rem;
      color: var(--muted);
      margin-top: 3px;
      line-height: 1.38;
      font-weight: 600;
    }
    .trk-live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #16a34a;
      margin-right: 5px;
    }

    /* Vista Personal Marca Blanca: "Mi Cuenta / Mis Pedidos" */
    .mc-shell {
      display: none;
      flex-direction: column;
      gap: 16px;
    }
    .mc-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 4px 16px rgba(62, 37, 25, 0.05);
    }
    .mc-balance-ok {
      background: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 100%);
      border: 1.5px solid #86efac;
    }
    .mc-balance-due {
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      border: 1.5px solid #fcd34d;
    }
    .mc-kpis-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 14px;
    }
    @media (max-width: 560px) {
      .mc-kpis-row {
        grid-template-columns: 1fr;
      }
    }
    .mc-kpi-pill {
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(62, 37, 25, 0.1);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .mc-history-item {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      background: #fffdfb;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.15s;
    }
    .mc-history-item:hover {
      border-color: var(--brand-border);
    }
    .btn-header-primary {
      background: var(--brand);
      color: #ffffff;
      border: 1.5px solid var(--brand);
      padding: 9px 15px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.15s;

    }
    .btn-header-primary:hover {
      background: var(--brand-dark);
      border-color: var(--brand-dark);
    }
  </style>
</head>
<body>

  <!-- Wizard Fullscreen de Confirmación de Pedido Vecinal -->
  <div class="chk-fullscreen-wizard" id="checkout-modal" role="dialog" aria-modal="true">

  <!-- Modal Marca Blanca de Contenido / Ingredientes -->
  <div class="modal-backdrop" id="ingredientes-modal" style="z-index:260;" onclick="if(event.target===this) cerrarModalIngredientesProducto()">
    <div class="modal-card" id="ingredientes-card-content" style="max-width:480px;"></div>
  </div>

  <!-- Modal Breve de 2 Pasos para Guardar Acceso Directo en Celular (iOS / Navegador) -->
  <div class="modal-backdrop" id="pwa-tienda-modal" style="z-index:275;" onclick="if(event.target===this) cerrarModalPwaTienda()">
    <div class="modal-card" id="pwa-tienda-modal-content" style="max-width:380px;"></div>
  </div>

  <script>
    const STATE = {
      slug: '',
      nodo: null,
      nodosDisponibles: [],
      proximaEntrega: null,
      productos: [],
      categoriaActiva: 'TODAS',
      carrito: {}, // { oferta_id: cantidad }
      modalidadEntrega: 'RETIRO_NODO',
      medioPago: 'TRANSFERENCIA',
      simularDespuesDeCorte: false,
      portalToken: '',
      vistaMiCuentaActiva: false,
      miCuentaData: null,
      ofertaIngredientesModalId: null,
      ultimoPedidoConfirmado: null,
      ofertaEnfocadaId: 0,
      skuEnfocado: '',
      _scrollOfertaHecho: false,
      checkoutWiz: {
        pasoActualKey: 'entrega',
        modalidadElegida: '',
        medioPagoElegido: '',
        nombre: '',
        telefono: '',
        direccion: '',
        entrecalles: '',
        teniaDatosGuardados: false,
        enviandoPedido: false
      }
    };

    function fmt(n) {
      return '$' + Math.round(Number(n) || 0).toLocaleString('es-AR');
    }

    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // =========================================================================
    // TELEMETRÍA LIVIANA Y PROGRESIVA POR NODO (NO BLOQUEANTE)
    // =========================================================================
    const _TEL_DEDUPE_MAP = new Map();
    let _telBusquedaDebounceTimer = null;
    let _telUltimoSlugVistaEnviada = '';
    const _URL_LAUNCH_PARAMS = (() => {
      try {
        const sp = new URLSearchParams(window.location.search);
        return {
          utm_source: (sp.get('utm_source') || '').trim(),
          utm_medium: (sp.get('utm_medium') || '').trim(),
          utm_campaign: (sp.get('utm_campaign') || '').trim(),
          ref: (sp.get('ref') || sp.get('origen') || '').trim(),
          modo_admin_param: sp.has('modo_admin') ? String(sp.get('modo_admin') || '').trim() : null
        };
      } catch (_) {
        return { utm_source: '', utm_medium: '', utm_campaign: '', ref: '', modo_admin_param: null };
      }
    })();

    function obtenerVisitorIdTienda() {
      const key = 'nodo_visitor_id_v1';
      try {
        let vid = (localStorage.getItem(key) || '').trim();
        if (!vid || vid.length < 10) {
          const rnd = (window.crypto && typeof window.crypto.randomUUID === 'function')
            ? window.crypto.randomUUID().replace(/-/g, '')
            : (Math.random().toString(36).slice(2) + Date.now().toString(36) + Math.random().toString(36).slice(2));
          vid = 'nv_' + rnd.slice(0, 28);
          localStorage.setItem(key, vid);
        }
        return vid;
      } catch (_) {
        if (!window.__fallbackVisitorId) {
          window.__fallbackVisitorId = 'nv_mem_' + Math.random().toString(36).slice(2, 14);
        }
        return window.__fallbackVisitorId;
      }
    }

    function obtenerSessionIdTienda() {
      const key = 'nodo_session_id_v1';
      try {
        let sid = (sessionStorage.getItem(key) || '').trim();
        if (!sid) {
          sid = 'ns_' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36).slice(-6);
          sessionStorage.setItem(key, sid);
        }
        return sid;
      } catch (_) {
        return '';
      }
    }

    function esDispositivoAdminGestorTienda(slugRef = STATE.slug) {
      try {
        if (typeof esModoEspejoLocal === 'function' && esModoEspejoLocal()) return true;
        const rol = String(localStorage.getItem('lamda_nodo_dispositivo_rol') || '').trim().toUpperCase();
        if (rol === 'CLIENTE_FORZADO') return false;
        if (rol === 'ADMIN' || rol === 'GESTOR') return true;
        const sClean = String(slugRef || '').trim().toLowerCase();
        if (sClean && localStorage.getItem('lamda_nodo_gestor_token_' + sClean)) return true;
      } catch (_) {}
      return false;
    }

    function aplicarParametroModoAdminInicial() {
      const p = _URL_LAUNCH_PARAMS.modo_admin_param;
      if (p === null) return;
      try {
        if (p === '1' || p.toLowerCase() === 'true') {
          localStorage.setItem('lamda_nodo_dispositivo_rol', 'ADMIN');
          if (!localStorage.getItem('lamda_nodo_dispositivo_etiqueta')) {
            localStorage.setItem('lamda_nodo_dispositivo_etiqueta', 'Admin / Prueba Móvil');
          }
        } else if (p === '0' || p.toLowerCase() === 'false') {
          localStorage.setItem('lamda_nodo_dispositivo_rol', 'CLIENTE_FORZADO');
        }
        const u = new URL(window.location.href);
        u.searchParams.delete('modo_admin');
        window.history.replaceState({}, document.title, u.pathname + (u.search ? u.search : '') + (u.hash || ''));
      } catch (_) {}
    }

    function desactivarModoAdminGestorEnEsteNavegador() {
      try {
        localStorage.setItem('lamda_nodo_dispositivo_rol', 'CLIENTE_FORZADO');
      } catch (_) {}
      enviarTelemetriaTienda('marcar_admin_gestor', {
        accion_admin_gestor: 'DESACTIVAR',
        es_admin_gestor: false,
        detalle: 'Cambio manual a modo Cliente Real'
      }, 0);
      renderizarBannerDispositivoAdminTienda();
    }

    function renderizarBannerDispositivoAdminTienda() {
      let bar = document.getElementById('admin-device-telemetry-pill');
      const activo = esDispositivoAdminGestorTienda(STATE.slug);
      if (!activo) {
        if (bar) bar.style.display = 'none';
        return;
      }
      if (!bar) {
        bar = document.createElement('div');
        bar.id = 'admin-device-telemetry-pill';
        bar.style.cssText = 'background:#0f172a;color:#e2e8f0;font-size:0.74rem;font-weight:700;padding:5px 12px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid #334155;';
        document.body.insertBefore(bar, document.body.firstChild);
      }
      bar.style.display = 'flex';
      bar.innerHTML = `
        <span>🛠️ <strong>Dispositivo Admin / Gestor</strong> · Tus visitas están separadas y no alteran la conversión de vecinos</span>
        <button type="button" onclick="desactivarModoAdminGestorEnEsteNavegador()"
          style="background:#1e293b;color:#93c5fd;border:1px solid #475569;border-radius:999px;padding:2px 9px;font-family:inherit;font-size:0.7rem;font-weight:800;cursor:pointer;">
          Cambiar a Cliente Real
        </button>
      `;
    }

    function construirSnapshotCarritoTelemetria() {
      const snap = [];
      let unidades = 0;
      let subtotal = 0;
      for (const p of (STATE.productos || [])) {
        const cant = Number(STATE.carrito[p.oferta_id] || 0);
        if (cant > 0) {
          const precio = Number(p.precio_venta_vecino || 0);
          const sub = Number((precio * cant).toFixed(2));
          unidades += cant;
          subtotal += sub;
          snap.push({
            oferta_id: Number(p.oferta_id),
            sku: p.sku_nodo || '',
            nombre: p.nombre_publico || '',
            presentacion: (typeof obtenerPresentacionItem === 'function' ? obtenerPresentacionItem(p) : '') || '',
            cantidad: cant,
            precio,
            subtotal: sub
          });
        }
      }
      return {
        carrito_snapshot: snap,
        carrito_unidades: unidades,
        carrito_subtotal: Number(subtotal.toFixed(2))
      };
    }

    function enviarTelemetriaTienda(tipoEvento, extra = {}, dedupeMs = 1500) {
      try {
        const slugTarget = String(extra.nodo_slug || STATE.slug || detectarSlugInicial() || '').trim();
        if (!slugTarget) return;

        const keyDedupe = `${slugTarget}:${tipoEvento}:${extra.categoria_nombre || ''}:${extra.termino_busqueda || ''}:${extra.oferta_id || ''}:${extra.cantidad || ''}`;
        const ahora = Date.now();
        if (dedupeMs > 0) {
          const prevTs = _TEL_DEDUPE_MAP.get(keyDedupe) || 0;
          if (ahora - prevTs < dedupeMs) return;
          _TEL_DEDUPE_MAP.set(keyDedupe, ahora);
        }

        let idLocal = {};
        try {
          if (typeof obtenerIdentidadVecinoLocal === 'function') {
            idLocal = obtenerIdentidadVecinoLocal(slugTarget) || {};
          }
        } catch (_) {}

        let etiquetaDisp = '';
        try {
          etiquetaDisp = localStorage.getItem('lamda_nodo_dispositivo_etiqueta') || '';
        } catch (_) {}

        const body = {
          tipo_evento: tipoEvento,
          visitor_id: obtenerVisitorIdTienda(),
          session_id: obtenerSessionIdTienda(),
          es_admin_gestor: extra.es_admin_gestor !== undefined
            ? Boolean(extra.es_admin_gestor)
            : esDispositivoAdminGestorTienda(slugTarget),
          etiqueta_dispositivo: etiquetaDisp || undefined,
          utm_source: _URL_LAUNCH_PARAMS.utm_source || undefined,
          utm_medium: _URL_LAUNCH_PARAMS.utm_medium || undefined,
          utm_campaign: _URL_LAUNCH_PARAMS.utm_campaign || undefined,
          ref: _URL_LAUNCH_PARAMS.ref || undefined,
          referrer: document.referrer || undefined,
          portal_token: STATE.portalToken || idLocal.portal_token || undefined,
          vecino_nombre: extra.vecino_nombre || idLocal.nombre_completo || window._savedVecinoNombre || undefined,
          vecino_telefono: extra.vecino_telefono || idLocal.telefono_display || idLocal.telefono_normalizado || window._savedVecinoTel || undefined,
          ...extra
        };

        fetch(`/api/produccion/nodos/tienda/${encodeURIComponent(slugTarget)}/telemetria`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          keepalive: true
        }).catch(() => {});
      } catch (_) {}
    }

    function programarTelemetriaBusquedaLupa(valorRaw) {
      if (_telBusquedaDebounceTimer) clearTimeout(_telBusquedaDebounceTimer);
      const limpio = String(valorRaw || '').trim();
      if (limpio.length < 2) return;
      _telBusquedaDebounceTimer = setTimeout(() => {
        enviarTelemetriaTienda('busqueda_lupa', { termino_busqueda: limpio.slice(0, 120) }, 2500);
      }, 900);
    }

    function seleccionarCategoriaTienda(catNombre) {
      STATE.categoriaActiva = catNombre;
      renderCategorias();
      renderCatalogo();
      if (catNombre && catNombre !== 'TODAS') {
        enviarTelemetriaTienda('categoria_seleccionada', { categoria_nombre: catNombre }, 1200);
      }
    }

    function normalizarTextoBusqueda(txt) {
      return String(txt || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/\s+/g, ' ')
        .trim();
    }

    function obtenerPresentacionItem(it) {
      const etq = String(it?.presentacion_etiqueta || '').trim();
      if (etq) return etq;
      const kg = Number(it?.kilos_unidad || 0);
      if (kg > 0) {
        return kg < 1 ? `${Math.round(kg * 1000)}g` : `${Number(kg.toFixed(3))}kg`;
      }
      return '';
    }

    function formatearNombreItemConPresentacion(it) {
      const nombre = String(it?.nombre_publico || '').trim() || 'Producto';
      const pres = obtenerPresentacionItem(it);
      if (!pres) return nombre;
      if (normalizarTextoBusqueda(nombre).includes(normalizarTextoBusqueda(pres))) return nombre;
      return `${nombre} (${pres})`;
    }

    function claveGrupoProductoTienda(p) {
      const nom = normalizarTextoBusqueda(p?.nombre_publico || '');
      if (!nom) return `oferta_${Number(p?.oferta_id || 0)}`;
      const cat = normalizarTextoBusqueda(p?.categoria_familiar || 'almacen natural');
      return `${cat}||${nom}`;
    }

    function aplicarFaviconTienda(urlImg) {
      const slugAct = String(STATE.slug || detectarSlugInicial() || '').trim();
      const iconPwa192 = slugAct ? `/api/produccion/nodos/pwa/${encodeURIComponent(slugAct)}/icon-tienda-192.png?v=1` : String(urlImg || '').trim();
      const iconPwa180 = slugAct ? `/api/produccion/nodos/pwa/${encodeURIComponent(slugAct)}/icon-tienda-180.png?v=1` : String(urlImg || '').trim();
      if (iconPwa192) {
        let linkIcon = document.querySelector('link[rel="icon"]');
        if (!linkIcon) {
          linkIcon = document.createElement('link');
          linkIcon.rel = 'icon';
          linkIcon.type = 'image/png';
          document.head.appendChild(linkIcon);
        }
        linkIcon.href = iconPwa192;
      }
      if (iconPwa180) {
        let linkApple = document.getElementById('nodo-apple-touch-icon') || document.querySelector('link[rel="apple-touch-icon"]');
        if (!linkApple) {
          linkApple = document.createElement('link');
          linkApple.id = 'nodo-apple-touch-icon';
          linkApple.rel = 'apple-touch-icon';
          linkApple.sizes = '180x180';
          document.head.appendChild(linkApple);
        }
        linkApple.href = iconPwa180;
      }
    }

    function sincronizarManifestPwaTienda(slug) {
      const cleanSlug = String(slug || '').trim();
      if (!cleanSlug) return;
      const href = `/api/produccion/nodos/pwa/${encodeURIComponent(cleanSlug)}/tienda.webmanifest`;
      let link = document.getElementById('nodo-pwa-manifest') || document.querySelector('link[rel="manifest"]');
      if (!link) {
        link = document.createElement('link');
        link.id = 'nodo-pwa-manifest';
        link.rel = 'manifest';
        document.head.appendChild(link);
      }
      if (link.getAttribute('href') !== href) {
        link.setAttribute('href', href);
      }
    }

    function esModoPwaInstaladaTienda() {
      try {
        if (window.navigator.standalone === true) return true;
        if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
      } catch (_) {}
      return false;
    }

    function obtenerKeyOcultarPwaTienda(slug) {
      return 'lamda_nodo_pwa_tienda_cerrado_' + String(slug || '').trim().toLowerCase();
    }

    function cerrarBannerPwaTienda() {
      const slugAct = String(STATE.slug || detectarSlugInicial() || '').trim();
      if (slugAct) {
        try { localStorage.setItem(obtenerKeyOcultarPwaTienda(slugAct), '1'); } catch (_) {}

    function obtenerLogoIconoNodo(nodo) {
      const logos = (nodo?.tema_visual && typeof nodo.tema_visual === 'object') ? (nodo.tema_visual.logos || {}) : {};
      return logos.isotipo || logos.horizontal || nodo?.logo_original_base64 || nodo?.logo_mono_preview_base64 || '';
    }

    function aplicarPaletaTienda(hexONodo) {
      const esObj = Boolean(hexONodo && typeof hexONodo === 'object');
      const nodo = esObj ? hexONodo : null;
      const tv = (nodo?.tema_visual && typeof nodo.tema_visual === 'object') ? nodo.tema_visual : {};
      const pal = (tv.paleta && typeof tv.paleta === 'object') ? tv.paleta : {};
      const tip = (tv.tipografia && typeof tv.tipografia === 'object') ? tv.tipografia : {};
      const hexRaw = esObj ? (pal.terracota || nodo.color_primario || '#a2553b') : hexONodo;
      const clean = /^#[0-9a-fA-F]{6}$/.test(String(hexRaw || '').trim()) ? String(hexRaw).trim() : '#a2553b';
      const r = parseInt(clean.slice(1, 3), 16);
      const g = parseInt(clean.slice(3, 5), 16);
      const b = parseInt(clean.slice(5, 7), 16);
      const darkR = Math.max(0, Math.round(r * 0.78));
      const darkG = Math.max(0, Math.round(g * 0.78));
      const darkB = Math.max(0, Math.round(b * 0.78));
      const darkFallback = '#' + [darkR, darkG, darkB].map(v => v.toString(16).padStart(2, '0')).join('');

      const root = document.documentElement;
      root.style.setProperty('--brand', clean);
      root.style.setProperty('--brand-dark', /^#[0-9a-fA-F]{6}$/.test(pal.terracota_oscuro || '') ? pal.terracota_oscuro : darkFallback);
      root.style.setProperty('--brand-light', `rgba(${r}, ${g}, ${b}, 0.12)`);
      root.style.setProperty('--brand-border', `rgba(${r}, ${g}, ${b}, 0.28)`);

      if (pal.fondo) {
        root.style.setProperty('--bg', pal.fondo);
        root.style.setProperty('--hero-bg', pal.fondo);
      }
      if (pal.superficie_calida) root.style.setProperty('--surface-warm', pal.superficie_calida);
      if (pal.tarjeta) {
        root.style.setProperty('--card', pal.tarjeta);
        if (!pal.fondo) root.style.setProperty('--hero-bg', pal.tarjeta);
      }
      if (pal.texto) root.style.setProperty('--text', pal.texto);
      if (pal.texto_secundario) root.style.setProperty('--muted', pal.texto_secundario);
      if (pal.borde) root.style.setProperty('--border', pal.borde);
      if (pal.ocre) root.style.setProperty('--accent', pal.ocre);
      if (pal.amarillo_sol) root.style.setProperty('--sun', pal.amarillo_sol);
      if (pal.pistacho_texto) root.style.setProperty('--ok', pal.pistacho_texto);
      if (pal.pistacho_suave) root.style.setProperty('--ok-soft', pal.pistacho_suave);
      if (pal.pistacho) root.style.setProperty('--ok-border', pal.pistacho);
      if (tip.familia) {
        root.style.setProperty('--font-brand', tip.familia);
      }

      if (tv.logos?.isotipo) {
        aplicarFaviconTienda(tv.logos.isotipo);
      }
    }

    function detectarSlugInicial() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('nodo')) return params.get('nodo').trim();
      const parts = window.location.pathname.split('/').filter(Boolean);
      const idx = parts.indexOf('tienda');
      if (idx !== -1 && parts[idx + 1]) return decodeURIComponent(parts[idx + 1]).trim();
      if (window.__NODOS_BOOTSTRAP__?.slug) return String(window.__NODOS_BOOTSTRAP__.slug).trim();
      return '';
    }

    function detectarTokenSeguimientoEnUrl() {
      const params = new URLSearchParams(window.location.search);
      const qTok = (params.get('seguimiento') || '').trim();
      if (qTok) return qTok;
      const parts = window.location.pathname.split('/').filter(Boolean);
      const idx = parts.indexOf('seguimiento');
      if (idx !== -1 && parts[idx + 1]) return decodeURIComponent(parts[idx + 1]).trim();
      if (window.__NODOS_BOOTSTRAP__?.tracking_token) return String(window.__NODOS_BOOTSTRAP__.tracking_token).trim();
      return '';
    }

    function calcularFechaSimuladaCorte() {
      if (!STATE.simularDespuesDeCorte || !STATE.proximaEntrega?.asignada) return '';
      const tsCorte = Number(STATE.proximaEntrega.asignada.timestamp_corte || Date.now());
      return new Date(tsCorte + 2 * 3600 * 1000).toISOString();
    }

    function esModoEspejoLocal() {
      const params = new URLSearchParams(window.location.search);
      const esLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      return esLocal && params.get('modo_espejo') === '1';
    }

    async function cargarTienda(fechaSimuladaIso = '') {
      const espejoBar = document.getElementById('tienda-espejo-bar');
      if (espejoBar) {
        espejoBar.style.display = esModoEspejoLocal() ? 'flex' : 'none';
      }
      if (!STATE.slug) {
        const grid = document.getElementById('products-grid');
        if (grid) {
          grid.innerHTML = `
            <div style="grid-column: 1/-1; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:32px; text-align:center;">
              <h3 style="margin:0 0 8px 0;">Tienda Vecinal no disponible</h3>
              <p style="color:var(--muted); font-size:0.9rem; max-width:500px; margin:0 auto;">
                Verificá el enlace o escaneá el código QR provisto por tu nodo barrial.
              </p>
            </div>
          `;
        }
        return;
      }
      const q = fechaSimuladaIso ? `?fecha_simulada=${encodeURIComponent(fechaSimuladaIso)}` : '';
      const resp = await fetch(`/api/produccion/nodos/portal/${encodeURIComponent(STATE.slug)}${q}`);
      const data = await resp.json();
      if (!data.ok) {
        const grid = document.getElementById('products-grid');
        if (grid) {
          grid.innerHTML = `
            <div style="grid-column: 1/-1; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:32px; text-align:center;">
              <h3 style="margin:0 0 8px 0;">Tienda Vecinal no disponible</h3>
              <p style="color:var(--muted); font-size:0.9rem; max-width:500px; margin:0 auto;">
                ${esc(data.error || 'Verificá el enlace compartido por el coordinador de tu barrio.')}
              </p>
            </div>
          `;
        }
        return;
      }

      STATE.nodo = data.nodo;
      STATE.slug = data.nodo.slug;
      STATE.nodosDisponibles = data.nodos_disponibles || [];
      STATE.proximaEntrega = data.proxima_entrega;
      STATE.productos = data.ofertas_publicadas || [];
      asegurarModalidadEntregaValida();

      if (STATE.ofertaEnfocadaId || STATE.skuEnfocado) {
        const matchDirecto = STATE.productos.find(o =>
          (STATE.ofertaEnfocadaId && Number(o.oferta_id) === Number(STATE.ofertaEnfocadaId)) ||
          (STATE.skuEnfocado && String(o.sku_nodo || '').trim().toLowerCase() === String(STATE.skuEnfocado || '').trim().toLowerCase())
        );
        if (matchDirecto) {
          STATE.ofertaEnfocadaId = Number(matchDirecto.oferta_id);
          STATE.categoriaActiva = 'TODAS';
        }
      }

      // Aplicar paleta cálida personalizada del Nodo (tema_visual + fallback color_primario)
      aplicarPaletaTienda(STATE.nodo);
      sincronizarManifestPwaTienda(STATE.slug);
      aplicarFaviconTienda('');
      renderizarBarraPwaTienda();
      const bajadaEfectiva = STATE.nodo.bajada_marca || STATE.nodo.subtitulo_marca || 'Pedidos comunitarios del barrio';
      document.title = STATE.nodo.bajada_marca
        ? `${STATE.nodo.nombre_marca} · ${STATE.nodo.bajada_marca}`
        : `${STATE.nodo.nombre_marca} — Tienda Vecinal`;

      // Renderizar cabecera minimalista con protagonismo central de marca
      document.getElementById('brand-name').textContent = STATE.nodo.nombre_marca;
      document.getElementById('brand-subtitle').textContent = bajadaEfectiva;

      const logoBox = document.getElementById('brand-logo-box');
      const logoHorizontal = STATE.nodo.tema_visual?.logos?.horizontal || '';
      const logoIncluyeTexto = Boolean(logoHorizontal && STATE.nodo.tema_visual?.logo_incluye_texto);
      const logoIsotipo = STATE.nodo.tema_visual?.logos?.isotipo || '';
      const logoSrc = logoIncluyeTexto
        ? logoHorizontal
        : (logoIsotipo || logoHorizontal || STATE.nodo.logo_original_base64 || STATE.nodo.logo_mono_preview_base64 || '');
      logoBox.classList.toggle('has-horizontal-logo', logoIncluyeTexto);
      const brandBoxEl = logoBox.closest('.brand-box');
      if (brandBoxEl) {
        brandBoxEl.classList.toggle('logo-includes-text', logoIncluyeTexto);
      }
      if (logoSrc) {
        const altLogo = bajadaEfectiva ? `${STATE.nodo.nombre_marca} · ${bajadaEfectiva}` : STATE.nodo.nombre_marca;
        logoBox.innerHTML = `<img src="${logoSrc}" alt="${esc(altLogo)}">`;
      } else {
        const siglas = String(STATE.nodo.nombre_marca || 'ND').split(/\s+/).map(w => w[0] || '').join('').substring(0, 2).toUpperCase();
        logoBox.innerHTML = `<div class="brand-monogram">${esc(siglas)}</div>`;
      }

      sincronizarEnlacesCoordinarGestor();
      renderBannerEntrega();
      renderizarDrawerNodoTienda();
      renderCategorias();
      renderCatalogo();
      actualizarBarraCarrito();
      refrescarBannerPedidosRecientes();
      renderizarBannerDispositivoAdminTienda();

      if (!fechaSimuladaIso && _telUltimoSlugVistaEnviada !== STATE.slug) {
        _telUltimoSlugVistaEnviada = STATE.slug;
        const extraVista = {};
        if (_URL_LAUNCH_PARAMS.modo_admin_param === '1') {
          extraVista.accion_admin_gestor = 'ACTIVAR';
          extraVista.es_admin_gestor = true;
        } else if (_URL_LAUNCH_PARAMS.modo_admin_param === '0') {
          extraVista.accion_admin_gestor = 'DESACTIVAR';
          extraVista.es_admin_gestor = false;
        }
        if (STATE.ofertaEnfocadaId || STATE.skuEnfocado) {
          const pFocus = STATE.productos.find(o => Number(o.oferta_id) === Number(STATE.ofertaEnfocadaId));
          if (pFocus) {
            extraVista.oferta_id = Number(pFocus.oferta_id);
            extraVista.sku_nodo = pFocus.sku_nodo || '';
            extraVista.producto_nombre = pFocus.nombre_publico || '';
          }
        }
        enviarTelemetriaTienda('vista_tienda', extraVista, 3000);
      }
    }

    function simularHorarioCorte(despues) {
      STATE.simularDespuesDeCorte = Boolean(despues);
      document.getElementById('btn-sim-antes').classList.toggle('active', !despues);
      document.getElementById('btn-sim-despues').classList.toggle('active', despues);

      if (despues && STATE.proximaEntrega?.asignada) {
        const tsAfter = Number(STATE.proximaEntrega.asignada.timestamp_corte) + 2 * 3600 * 1000;
        cargarTienda(new Date(tsAfter).toISOString());
      } else {
        cargarTienda('');
      }
    }

    function cambiarNodoTienda(nuevoSlug) {
      STATE.slug = nuevoSlug;
      STATE.carrito = {};
      STATE.simularDespuesDeCorte = false;
      window.history.replaceState({}, '', `/tienda/${encodeURIComponent(nuevoSlug)}`);
      cargarTienda('');
    }

    function obtenerUrlWhatsappCoordinarGestor() {
      const nodo = STATE.nodo || {};
      const telDigits = String(nodo.gestor_telefono || '').replace(/\D+/g, '');
      if (!telDigits) return '';
      const telWa = telDigits.startsWith('54') ? telDigits : `549${telDigits}`;
      const saludo = `Hola ${nodo.gestor_nombre || ''}! Te escribo desde la tienda vecinal de ${nodo.nombre_marca || 'nuestro barrio'}.`;
      return `https://wa.me/${telWa}?text=${encodeURIComponent(saludo)}`;
    }

    function sincronizarEnlacesCoordinarGestor() {
      const href = obtenerUrlWhatsappCoordinarGestor();
      const gestorNombre = String(STATE.nodo?.gestor_nombre || 'el referente').trim();
      for (const idEl of ['bnav-coordinar', 'desk-nav-coordinar', 'drawer-wa-gestor-link']) {
        const el = document.getElementById(idEl);
        if (!el) continue;
        el.setAttribute('href', href || '#');
        el.setAttribute('title', `Coordinar por WhatsApp con ${gestorNombre}`);
      }
    }

    function onClickCoordinarGestor(ev) {
      const href = obtenerUrlWhatsappCoordinarGestor();
      if (!href) {
        if (ev) ev.preventDefault();
        abrirDrawerNodoTienda();
        return false;
      }
      enviarTelemetriaTienda('clic_coordinar_gestor', { gestor_nombre: STATE.nodo?.gestor_nombre || '' }, 2000);
      return true;
    }

    function alternarBuscadorTienda() {
      if (STATE.vistaMiCuentaActiva) {
        irACatalogoDesdeMiCuenta();
      }
      const wrap = document.getElementById('search-collapsible-wrap');
      const inp = document.getElementById('search-box');
      const btn = document.getElementById('btn-toggle-search');
      if (!wrap || !inp) return;

      const estaAbierto = wrap.classList.contains('open');
      if (estaAbierto && !String(inp.value || '').trim()) {
        wrap.classList.remove('open');
        if (btn) btn.classList.remove('is-active');
        return;
      }

      wrap.classList.add('open');
      if (btn) btn.classList.add('is-active');
      setTimeout(() => {
        inp.focus();
        inp.select?.();
      }, 30);
    }

    function onInputBuscadorTienda(val) {
      const btn = document.getElementById('btn-toggle-search');
      if (btn) {
        btn.classList.toggle('is-active', true);
      }
      renderCatalogo();
      programarTelemetriaBusquedaLupa(val);
    }

    function limpiarYCerrarBuscadorTienda() {
      const wrap = document.getElementById('search-collapsible-wrap');
      const inp = document.getElementById('search-box');
      const btn = document.getElementById('btn-toggle-search');
      if (inp) inp.value = '';
      if (wrap) wrap.classList.remove('open');
      if (btn) btn.classList.remove('is-active');
      renderCatalogo();
    }

    function abrirDrawerNodoTienda() {
      renderizarDrawerNodoTienda();
      const backdrop = document.getElementById('nodo-drawer-backdrop');
      const drawer = document.getElementById('nodo-drawer');
      if (backdrop) backdrop.classList.add('open');
      if (drawer) {
        drawer.classList.add('open');
        drawer.setAttribute('aria-hidden', 'false');
      }
      document.body.style.overflow = 'hidden';
    }

    function cerrarDrawerNodoTienda() {
      const backdrop = document.getElementById('nodo-drawer-backdrop');
      const drawer = document.getElementById('nodo-drawer');
      if (backdrop) backdrop.classList.remove('open');
      if (drawer) {
        drawer.classList.remove('open');
        drawer.setAttribute('aria-hidden', 'true');
      }
      const chkOpen = document.getElementById('checkout-modal')?.style.display === 'flex';
      if (!chkOpen) {
        document.body.style.overflow = '';
      }
    }

    function renderizarDrawerNodoTienda() {
      const headSummary = document.getElementById('drawer-brand-summary');

        <div class="drawer-section-card" style="${pasoCorte ? 'background:#fffbeb; border-color:#fcd34d;' : ''}">

            ${pasoCorte ? '⏭️ Horario de corte superado' : '📅 Próxima entrega programada'}
          </div>
          <div style="font-size:0.96rem; font-weight:900; color:var(--text); line-height:1.28;">
            ${asig ? esc(asig.label_completo) : 'Por confirmar'}
          </div>
          ${prox?.mensaje_vecino ? `
            <div style="font-size:0.79rem; font-weight:700; color:var(--muted); margin-top:5px; line-height:1.38;">
              ${esc(prox.mensaje_vecino)}
            </div>
          ` : ''}
          <div style="margin-top:9px; padding-top:9px; border-top:1px dashed var(--border); font-size:0.8rem; line-height:1.42;">
            <div><strong>🏠 Punto de retiro:</strong> ${esc(nodo.direccion_retiro || barrio)}</div>
            <div style="margin-top:3px; color:var(--brand-dark); font-weight:800;">${esc(envioTxt)}</div>
          </div>
        </div>

        <!-- 2. Tarjeta del Referente Barrial -->
        <div class="drawer-section-card">
          <div style="font-size:0.72rem; font-weight:900; text-transform:uppercase; letter-spacing:0.03em; color:var(--muted);">
            Referente de ${esc(barrio)}
          </div>
          <div style="font-size:0.98rem; font-weight:900; color:var(--text); margin-top:3px;">

          </div>

          ${waHref ? `
            <a id="drawer-wa-gestor-link" href="${esc(waHref)}" target="_blank" rel="noopener"
              onclick="return onClickCoordinarGestor(event)"
              style="display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:42px; padding:9px 14px; border-radius:11px; background:#15803d; color:#ffffff; font-size:0.86rem; font-weight:900; text-decoration:none;">
              <span>💬 Escribir por WhatsApp</span>
            </a>
          ` : ''}

        <!-- 3. Seguimiento de Pedido y Mi Cuenta -->
        <div style="display:flex; flex-direction:column; gap:8px;">
          <button type="button" class="drawer-action-btn" id="drawer-btn-seguir-pedido" onclick="cerrarDrawerNodoTienda(); accionBotonSeguirMiPedido();">
            <span>📦 Seguir estado de mi pedido</span>
            <span style="color:var(--brand); font-weight:900;">›</span>
          </button>
          ${STATE.portalToken ? `
            <button type="button" class="drawer-action-btn" id="drawer-btn-mi-cuenta" onclick="cerrarDrawerNodoTienda(); activarVistaMiCuenta();">
              <span>👤 Mi Cuenta y comprobantes</span>

        <!-- 4. Resumen en 3 Pasos de Compra Comunitaria -->
        <div class="drawer-section-card" style="background:var(--surface-warm);">

            🤝 Cómo funciona ${esc(nombreMarca)}
          </div>
          <div style="display:flex; flex-direction:column; gap:8px; font-size:0.8rem; line-height:1.34;">
            <div style="display:flex; align-items:flex-start; gap:9px;">
              <span style="width:20px; height:20px; border-radius:999px; background:var(--brand); color:#fff; font-size:0.72rem; font-weight:900; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;">1</span>
              <div><strong>Elegí tus productos</strong> del catálogo antes del horario de cierre semanal.</div>
            </div>
            <div style="display:flex; align-items:flex-start; gap:9px;">
              <span style="width:20px; height:20px; border-radius:999px; background:var(--brand); color:#fff; font-size:0.72rem; font-weight:900; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;">2</span>
              <div><strong>Consolidamos en el nodo</strong> todos los pedidos de ${esc(barrio)} directo de elaboración.</div>
            </div>
            <div style="display:flex; align-items:flex-start; gap:9px;">
              <span style="width:20px; height:20px; border-radius:999px; background:var(--brand); color:#fff; font-size:0.72rem; font-weight:900; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;">3</span>
              <div><strong>Retirás o recibís</strong> en la fecha programada y abonás por transferencia o efectivo.</div>

        <div class="drawer-pwa-card" id="drawer-pwa-box" style="display:none;"></div>

      renderizarBarraPwaTienda();
