    function construirSnapshotCarritoTelemetria() {
      const snap = [];
      let unidades = 0;
      let subtotal = 0;
      for (const p of (STATE.productos || [])) {
        const cant = Number(STATE.carrito[p.oferta_id] || 0);
        if (cant > 0) {
          const precio = Number(p.precio_venta_vecino || 0);
          const sub = Number((precio * cant).toFixed(2));
          unidades += cant;
          subtotal += sub;
          snap.push({
            oferta_id: Number(p.oferta_id),
            sku: p.sku_nodo || '',
            nombre: p.nombre_publico || '',
            presentacion: (typeof obtenerPresentacionItem === 'function' ? obtenerPresentacionItem(p) : '') || '',
            cantidad: cant,
            precio,
            subtotal: sub
          });
        }
      }
      return {
        carrito_snapshot: snap,
        carrito_unidades: unidades,
        carrito_subtotal: Number(subtotal.toFixed(2))
      };
    }

    function enviarTelemetriaTienda(tipoEvento, extra = {}, dedupeMs = 1500, opts = {}) {
      try {
        const slugTarget = String(extra.nodo_slug || STATE.slug || detectarSlugInicial() || '').trim();
        if (!slugTarget) return;

        const keyDedupe = `${slugTarget}:${tipoEvento}:${extra.categoria_nombre || ''}:${extra.termino_busqueda || ''}:${extra.oferta_id || ''}:${extra.cantidad || ''}:${extra.detalle || ''}`;
        const ahora = Date.now();
        if (dedupeMs > 0) {
          const prevTs = _TEL_DEDUPE_MAP.get(keyDedupe) || 0;
          if (ahora - prevTs < dedupeMs) return;
          _TEL_DEDUPE_MAP.set(keyDedupe, ahora);
        }

        } catch (_) {}

        const etiquetaDisp = esAdminEfectivo
          ? (extra.etiqueta_dispositivo || obtenerEtiquetaDispositivoTienda(slugTarget) || undefined)
          : undefined;

        const body = {
          tipo_evento: tipoEvento,
          visitor_id: obtenerVisitorIdTienda(),
          session_id: obtenerSessionIdTienda(),
          es_admin_gestor: esAdminEfectivo,
          etiqueta_dispositivo: etiquetaDisp,

          ...extra,
          es_admin_gestor: esAdminEfectivo
        };

        const url = `/api/produccion/nodos/tienda/${encodeURIComponent(slugTarget)}/telemetria`;
        const jsonPayload = JSON.stringify(body);

        if (opts && opts.beacon && typeof navigator !== 'undefined' && typeof navigator.sendBeacon === 'function') {
          try {
            const blob = new Blob([jsonPayload], { type: 'application/json' });
            if (navigator.sendBeacon(url, blob)) {
              return;
            }
          } catch (_) {}
        }

        fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: jsonPayload,
          keepalive: true
        }).catch(() => {});
      } catch (_) {}

    function programarTelemetriaBusquedaLupa(valorRaw) {
      if (_telBusquedaDebounceTimer) clearTimeout(_telBusquedaDebounceTimer);

      _telBusquedaDebounceTimer = setTimeout(() => {

    function normalizarTextoBusqueda(txt) {
      return String(txt || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/\s+/g, ' ')
        .trim();
    }

    function obtenerPresentacionItem(it) {
      const etq = String(it?.presentacion_etiqueta || '').trim();
      if (etq) return etq;
      const kg = Number(it?.kilos_unidad || 0);
      if (kg > 0) {
        return kg < 1 ? `${Math.round(kg * 1000)}g` : `${Number(kg.toFixed(3))}kg`;
      }
      return '';
    }

    function formatearNombreItemConPresentacion(it) {
      const nombre = String(it?.nombre_publico || '').trim() || 'Producto';
      const pres = obtenerPresentacionItem(it);
      if (!pres) return nombre;
      if (normalizarTextoBusqueda(nombre).includes(normalizarTextoBusqueda(pres))) return nombre;
      return `${nombre} (${pres})`;
    }

    function claveGrupoProductoTienda(p) {
      const nom = normalizarTextoBusqueda(p?.nombre_publico || '');
      if (!nom) return `oferta_${Number(p?.oferta_id || 0)}`;
      const cat = normalizarTextoBusqueda(p?.categoria_familiar || 'almacen natural');
      return `${cat}||${nom}`;

      const cbuRaw = String(n.cbu || n.cbu_display || STATE.nodo?.cbu_display || '0070373230004007844141').trim();

      const cuil = String(n.cuil || n.cuil_display || STATE.nodo?.cuil_display || '23-24892174-9').trim() || '23-24892174-9';
      const cuenta = String(n.numero_cuenta || n.numero_cuenta_display || STATE.nodo?.numero_cuenta_display || '400784413734').trim();
      return { banco, alias, titular, cbu, cuil, cuenta };

    function copiarDatoBancarioTienda(btnEl, valor, textoConfirmacion = '✅ Copiado') {
      const limpio = String(valor ?? '').trim();
      if (!limpio) return;
      const original = btnEl ? btnEl.innerHTML : '';
      const feedback = () => {
        if (!btnEl) return;
        btnEl.textContent = textoConfirmacion;
        setTimeout(() => {
          if (btnEl && btnEl.isConnected) btnEl.innerHTML = original;
        }, 2200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(limpio).then(feedback).catch(() => {
          try {
            const ta = document.createElement('textarea');
            ta.value = limpio;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            feedback();
          } catch (_) {}
        });
      }

      const fileObj = inpFile?.files && inpFile.files[0] ? inpFile.files[0] : null;

      if (fileObj && fileObj.size > 5 * 1024 * 1024) {
        if (errBox) {
          errBox.textContent = 'El archivo supera los 5 MB permitidos.';
          errBox.style.display = 'block';
        }
        return;
      }

      const idLocal = obtenerIdentidadVecinoLocal(STATE.slug) || {};
      const portalTok = STATE.portalToken || idLocal.portal_token || '';
      const telAuth = telefonoRespaldo || idLocal.telefono_normalizado || idLocal.telefono_display || '';

      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Registrando aviso...';
      }

      try {
        const url = `/api/produccion/nodos/tienda/${encodeURIComponent(STATE.slug)}/pedidos/${encodeURIComponent(codigoOToken)}/aviso-pago`;
        let resp;
        if (fileObj) {
          const fd = new FormData();
          fd.append('monto_informado', montoVal);
          if (titularVal) fd.append('titular_emisor', titularVal);
          if (trackingToken) fd.append('tracking_token', trackingToken);
          if (portalTok) fd.append('portal_token', portalTok);
          if (telAuth) fd.append('telefono', telAuth);
          fd.append('comprobante', fileObj);
          resp = await fetch(url, { method: 'POST', body: fd });
        } else {
          resp = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              monto_informado: montoVal,
              titular_emisor: titularVal || undefined,
              tracking_token: trackingToken || undefined,
              portal_token: portalTok || undefined,
              telefono: telAuth || undefined
            })
          });
        }
        const data = await resp.json();
        if (!resp.ok || !data.ok) {
          throw new Error(data.error || 'No se pudo registrar el aviso de transferencia.');
        }

        const cached = window._cachePedidosPagoTienda[ctxKey] || {};
        const pedMerged = { ...(cached.ped || {}), ...(data.pedido || {}) };
        if (STATE.ultimoPedidoConfirmado && STATE.ultimoPedidoConfirmado.codigo_pedido === pedMerged.codigo_pedido) {
          STATE.ultimoPedidoConfirmado = { ...STATE.ultimoPedidoConfirmado, ...pedMerged };
        }
        if (STATE.pedidoActivoBannerData?.pedido && STATE.pedidoActivoBannerData.pedido.codigo_pedido === pedMerged.codigo_pedido) {
          STATE.pedidoActivoBannerData = {
            ...STATE.pedidoActivoBannerData,
            pedido: { ...STATE.pedidoActivoBannerData.pedido, ...pedMerged }
          };
          renderizarSlotCompactoPagoPedido();
        }
        const wrapEl = document.getElementById(`bloque-pago-transf-${ctxKey}`);
        if (wrapEl) {
          wrapEl.outerHTML = renderizarTarjetaTransferenciaYAvisoHtml(
            pedMerged,
            data.cuenta_bancaria || cached.fuenteBanco || STATE.nodo,
            ctxKey,
            { ...(cached.opciones || {}), abrirFormInicial: false }
          );
        }
        refrescarBannerPedidosRecientes();
        if (STATE.vistaActiva === 'mi_cuenta' && typeof cargarPortalMiCuenta === 'function') {
          cargarPortalMiCuenta(false);
        }
      } catch (err) {
        if (errBox) {
          errBox.textContent = err.message || 'Error registrando el aviso.';
          errBox.style.display = 'block';
        }
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Confirmar aviso de transferencia';
        }
      }
    }

    function sincronizarTituloYMetaPwaTienda(nombreMarcaRaw) {
      const nombreLimpio = String(nombreMarcaRaw || '').trim() || 'Tienda';
      document.title = nombreLimpio;
      let metaAppleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
      if (!metaAppleTitle) {
        metaAppleTitle = document.createElement('meta');
        metaAppleTitle.setAttribute('name', 'apple-mobile-web-app-title');
        document.head.appendChild(metaAppleTitle);
      }
      metaAppleTitle.setAttribute('content', nombreLimpio);

    function obtenerVersionPwaTienda() {
      const vBoot = window.__NODOS_BOOTSTRAP__ && window.__NODOS_BOOTSTRAP__.pwa_v;
      return String(vBoot || '5').trim() || '5';
    }

    function esNavegadorEmbebidoWebViewTienda() {
      const ua = String(navigator.userAgent || '');
      return /(FBAN|FBAV|Instagram|Line\/|TikTok|BytedanceWebview|WhatsApp|; wv\)|\bwv\b)/i.test(ua);
    }

    function esperarDeferredPromptTienda(timeoutMs = 1500) {
      if (window.__nodoTiendaDeferredPrompt) {
        return Promise.resolve(window.__nodoTiendaDeferredPrompt);
      }
      return new Promise((resolve) => {
        let resuelto = false;
        const fn = (ev) => {
          if (resuelto) return;
          resuelto = true;
          clearTimeout(tm);
          resolve(ev || window.__nodoTiendaDeferredPrompt || null);
        };
        window.__nodoTiendaBipWaiters = window.__nodoTiendaBipWaiters || [];
        window.__nodoTiendaBipWaiters.push(fn);
        const tm = setTimeout(() => {
          if (resuelto) return;
          resuelto = true;
          const idx = window.__nodoTiendaBipWaiters.indexOf(fn);
          if (idx !== -1) window.__nodoTiendaBipWaiters.splice(idx, 1);
          resolve(window.__nodoTiendaDeferredPrompt || null);
        }, timeoutMs);
      });
    }

    function resolverUrlAssetTienda(url, nodo = STATE.nodo) {
      const raw = String(url || '').trim();
      if (!raw || !raw.startsWith('/img/nodos/')) return raw;
      if (/[?&]v=/.test(raw)) return raw;
      const v = String(nodo?.tema_visual?.assets_version || obtenerVersionPwaTienda() || '2').trim();
      return `${raw}?v=${encodeURIComponent(v)}`;
    }

    function esModoStandaloneActivoTienda() {
      try {
        if (window.navigator.standalone === true) return true;
        if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
        if (window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches) return true;
        if (typeof document !== 'undefined' && String(document.referrer || '').indexOf('android-app://') === 0) return true;
      } catch (_) {}
      return false;
    }

    function esModoPwaInstaladaTienda() {
      if (esModoStandaloneActivoTienda()) return true;
      if (window.__nodoTiendaDeferredPrompt) return false;
      return Boolean(window.__nodoTiendaInstaladoRuntime);
    }

    async function verificarEstadoRealAccesoDirectoTienda() {
      try {
        if (esModoStandaloneActivoTienda()) {
          renderizarBarraPwaTienda();
          return true;
        }
        if (window.__nodoTiendaDeferredPrompt) {
          window.__nodoTiendaInstaladoRuntime = false;
          if (typeof window.limpiarBanderasObsoletasPwaTienda === 'function') {
            window.limpiarBanderasObsoletasPwaTienda();
          }
          renderizarBarraPwaTienda();
          return false;
        }
        if (typeof navigator !== 'undefined' && typeof navigator.getInstalledRelatedApps === 'function') {
          const slugAct = String(STATE.slug || detectarSlugInicial() || '').trim();
          const slugEnc = encodeURIComponent(slugAct);
          const apps = await navigator.getInstalledRelatedApps();
          const instalada = Array.isArray(apps) && apps.some(a => {
            if (!a) return false;
            const u = String(a.url || '');
            if (!u) return a.platform === 'webapp';
            if (!slugEnc) return u.includes('/tienda.webmanifest');
            return u.includes(`/pwa/${slugEnc}/tienda.webmanifest`) || u.includes(`/tienda/${slugEnc}`);
          });
          window.__nodoTiendaInstaladoRuntime = instalada;
          if (!instalada && typeof window.limpiarBanderasObsoletasPwaTienda === 'function') {
            window.limpiarBanderasObsoletasPwaTienda();
          }
          renderizarBarraPwaTienda();
          return instalada;
        }
      } catch (_) {}
      renderizarBarraPwaTienda();
      return esModoPwaInstaladaTienda();
    }
    window.verificarEstadoRealAccesoDirectoTienda = verificarEstadoRealAccesoDirectoTienda;

    try {
      if (window.matchMedia) {
        const mqStandaloneTienda = window.matchMedia('(display-mode: standalone)');
        if (typeof mqStandaloneTienda.addEventListener === 'function') {
          mqStandaloneTienda.addEventListener('change', () => renderizarBarraPwaTienda());
        } else if (typeof mqStandaloneTienda.addListener === 'function') {
          mqStandaloneTienda.addListener(() => renderizarBarraPwaTienda());
        }
      }
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          verificarEstadoRealAccesoDirectoTienda();
        }
      });
      window.addEventListener('focus', () => {
        verificarEstadoRealAccesoDirectoTienda();
      });
    } catch (_) {}

    async function instalarAccesoDirectoTienda() {
      const ua = String(navigator.userAgent || '');
      const esIos = /iphone|ipad|ipod/i.test(ua);
      const esWebView = esNavegadorEmbebidoWebViewTienda();

      if (!esWebView) {
        let promptEv = window.__nodoTiendaDeferredPrompt;
        if (!promptEv && !esIos) {
          promptEv = await esperarDeferredPromptTienda(900);
        }
        if (promptEv && typeof promptEv.prompt === 'function') {
          window.__nodoTiendaDeferredPrompt = null;
          let lanzadoOk = false;
          try {
            const pRes = promptEv.prompt();
            lanzadoOk = true;
            Promise.resolve(pRes).catch(() => {});
            if (promptEv.userChoice && typeof promptEv.userChoice.then === 'function') {
              promptEv.userChoice.then((choice) => {
                if (choice && choice.outcome === 'accepted') {
                  window.__nodoTiendaInstaladoRuntime = true;
                }
                renderizarBarraPwaTienda();
              }).catch(() => {});
            }
          } catch (_) {
            lanzadoOk = false;
          }
          if (lanzadoOk) {
            renderizarBarraPwaTienda();
            return;
          }
        }
      }

      const slugAct = String(STATE.slug || detectarSlugInicial() || '').trim();
      const nombreMarca = String(STATE.nodo?.nombre_marca || 'la tienda').trim();

      const card = document.getElementById('pwa-tienda-modal-content');
      const modal = document.getElementById('pwa-tienda-modal');
      if (!card || !modal) return;

      const esAndroid = /android/i.test(ua);
      const chromeIntentHref = esAndroid
        ? `intent://${window.location.host}${window.location.pathname}${window.location.search}#Intent;scheme=https;package=com.android.chrome;end`
        : '';

      const cuerpoInstruccionHtml = esWebView
        ? `
          <div style="background:var(--surface-warm); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:14px; font-size:0.88rem; color:var(--text); line-height:1.42; font-weight:700;">
            Abrí este enlace en <strong>Chrome</strong> (menú <strong>⋮ → Abrir en Chrome</strong>) para agregar el acceso directo en 1 toque.
          </div>
          ${chromeIntentHref ? `
            <a href="${esc(chromeIntentHref)}" onclick="cerrarModalPwaTienda()"
              style="display:flex; align-items:center; justify-content:center; width:100%; min-height:42px; margin-bottom:8px; border-radius:11px; background:var(--brand); color:#fff; text-decoration:none; font-weight:900; font-size:0.9rem;">
              🌐 Abrir en Chrome ahora
            </a>
          ` : ''}
        `
        : (esIos
          ? `
            <div style="background:var(--surface-warm); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:14px; font-size:0.88rem; color:var(--text); line-height:1.42;">
              Tocá <strong>Compartir (ícono ⬆️ abajo en Safari)</strong> y elegí <strong>"Agregar a inicio"</strong>.
            </div>
          `
          : `
            <div style="background:var(--surface-warm); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:14px; font-size:0.87rem; color:var(--text); line-height:1.42;">
              Tocá el menú <strong>⋮</strong> de Chrome y elegí <strong>"Agregar a la pantalla principal"</strong> (si tenías un acceso directo anterior de esta tienda en el teléfono, quitalo primero para actualizar su ícono).
            </div>
          `);

      card.innerHTML = `
        <div style="padding:18px;">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;">
            <div style="display:flex; align-items:center; gap:10px;">
              ${iconUrl ? `<img src="${esc(iconUrl)}" alt="${esc(nombreMarca)}" style="width:44px; height:44px; border-radius:11px; border:1px solid var(--border);" />` : ''}
              <div>
                <div style="font-weight:900; font-size:1.02rem; color:var(--text);">${esc(nombreMarca)}</div>
                <div style="font-size:0.78rem; color:var(--brand-dark); font-weight:800;">📲 Agregar acceso directo</div>
              </div>
            </div>
            <button type="button" onclick="cerrarModalPwaTienda()" aria-label="Cerrar"
              style="border:none; background:var(--surface-warm); color:var(--text); width:32px; height:32px; border-radius:999px; font-weight:900; cursor:pointer;">✕</button>
          </div>
          ${cuerpoInstruccionHtml}
          <button type="button" onclick="cerrarModalPwaTienda()"
            style="width:100%; min-height:42px; border:${esWebView && chromeIntentHref ? '1px solid var(--border)' : 'none'}; border-radius:11px; background:${esWebView && chromeIntentHref ? 'var(--card)' : 'var(--brand)'}; color:${esWebView && chromeIntentHref ? 'var(--text)' : '#fff'}; font-family:inherit; font-weight:900; font-size:0.9rem; cursor:pointer;">

    function obtenerLogoIconoNodo(nodo) {
      const logos = (nodo?.tema_visual && typeof nodo.tema_visual === 'object') ? (nodo.tema_visual.logos || {}) : {};
      return resolverUrlAssetTienda(logos.isotipo || logos.horizontal || '', nodo) || nodo?.logo_original_base64 || nodo?.logo_mono_preview_base64 || '';
    }

    function aplicarPaletaTienda(hexONodo) {
      const esObj = Boolean(hexONodo && typeof hexONodo === 'object');
      const nodo = esObj ? hexONodo : null;
      const tv = (nodo?.tema_visual && typeof nodo.tema_visual === 'object') ? nodo.tema_visual : {};
      const pal = (tv.paleta && typeof tv.paleta === 'object') ? tv.paleta : {};
      const tip = (tv.tipografia && typeof tv.tipografia === 'object') ? tv.tipografia : {};
      const hexRaw = esObj ? (pal.terracota || nodo.color_primario || '#a2553b') : hexONodo;
      const clean = /^#[0-9a-fA-F]{6}$/.test(String(hexRaw || '').trim()) ? String(hexRaw).trim() : '#a2553b';
      const r = parseInt(clean.slice(1, 3), 16);
      const g = parseInt(clean.slice(3, 5), 16);
      const b = parseInt(clean.slice(5, 7), 16);
      const darkR = Math.max(0, Math.round(r * 0.78));
      const darkG = Math.max(0, Math.round(g * 0.78));
      const darkB = Math.max(0, Math.round(b * 0.78));
      const darkFallback = '#' + [darkR, darkG, darkB].map(v => v.toString(16).padStart(2, '0')).join('');

      const root = document.documentElement;
      root.style.setProperty('--brand', clean);
      root.style.setProperty('--brand-dark', /^#[0-9a-fA-F]{6}$/.test(pal.terracota_oscuro || '') ? pal.terracota_oscuro : darkFallback);
      root.style.setProperty('--brand-light', `rgba(${r}, ${g}, ${b}, 0.12)`);
      root.style.setProperty('--brand-border', `rgba(${r}, ${g}, ${b}, 0.28)`);

      if (pal.fondo) {
        root.style.setProperty('--bg', pal.fondo);
        root.style.setProperty('--hero-bg', pal.fondo);
      }
      if (pal.superficie_calida) root.style.setProperty('--surface-warm', pal.superficie_calida);
      if (pal.tarjeta) {
        root.style.setProperty('--card', pal.tarjeta);
        if (!pal.fondo) root.style.setProperty('--hero-bg', pal.tarjeta);
      }
      if (pal.texto) root.style.setProperty('--text', pal.texto);
      if (pal.texto_secundario) root.style.setProperty('--muted', pal.texto_secundario);
      if (pal.borde) root.style.setProperty('--border', pal.borde);
      if (pal.ocre) root.style.setProperty('--accent', pal.ocre);
      if (pal.amarillo_sol) root.style.setProperty('--sun', pal.amarillo_sol);
      if (pal.pistacho_texto) root.style.setProperty('--ok', pal.pistacho_texto);
      if (pal.pistacho_suave) root.style.setProperty('--ok-soft', pal.pistacho_suave);
      if (pal.pistacho) root.style.setProperty('--ok-border', pal.pistacho);
      if (tip.familia) {
        root.style.setProperty('--font-brand', tip.familia);
      }

      if (tv.logos?.isotipo) {
        aplicarFaviconTienda(tv.logos.isotipo);
      }
    }

    function detectarSlugInicial() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('nodo')) return params.get('nodo').trim();
      const parts = window.location.pathname.split('/').filter(Boolean);
      const idx = parts.indexOf('tienda');
      if (idx !== -1 && parts[idx + 1]) return decodeURIComponent(parts[idx + 1]).trim();
      if (window.__NODOS_BOOTSTRAP__?.slug) return String(window.__NODOS_BOOTSTRAP__.slug).trim();
      return '';
    }

    function detectarTokenSeguimientoEnUrl() {
      const params = new URLSearchParams(window.location.search);
      const qTok = (params.get('seguimiento') || '').trim();
      if (qTok) return qTok;
      const parts = window.location.pathname.split('/').filter(Boolean);
      const idx = parts.indexOf('seguimiento');
      if (idx !== -1 && parts[idx + 1]) return decodeURIComponent(parts[idx + 1]).trim();
      if (window.__NODOS_BOOTSTRAP__?.tracking_token) return String(window.__NODOS_BOOTSTRAP__.tracking_token).trim();
      return '';
    }

    function calcularFechaSimuladaCorte() {
      if (!STATE.simularDespuesDeCorte || !STATE.proximaEntrega?.asignada) return '';
      const tsCorte = Number(STATE.proximaEntrega.asignada.timestamp_corte || Date.now());
      return new Date(tsCorte + 2 * 3600 * 1000).toISOString();
    }

    function esModoEspejoLocal() {
      const params = new URLSearchParams(window.location.search);
      const esLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      return esLocal && params.get('modo_espejo') === '1';
    }

    async function cargarTienda(fechaSimuladaIso = '') {
      const espejoBar = document.getElementById('tienda-espejo-bar');
      if (espejoBar) {
        espejoBar.style.display = esModoEspejoLocal() ? 'flex' : 'none';
      }
      if (!STATE.slug) {
        const grid = document.getElementById('products-grid');
        if (grid) {
          grid.innerHTML = `
            <div style="grid-column: 1/-1; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:32px; text-align:center;">
              <h3 style="margin:0 0 8px 0;">Tienda no disponible</h3>
              <p style="color:var(--muted); font-size:0.9rem; max-width:500px; margin:0 auto;">
                Verificá el enlace o escaneá el código QR compartido por la tienda.
              </p>
            </div>
          `;
        }
        return;
      }
      const q = fechaSimuladaIso ? `?fecha_simulada=${encodeURIComponent(fechaSimuladaIso)}` : '';
      const resp = await fetch(`/api/produccion/nodos/portal/${encodeURIComponent(STATE.slug)}${q}`);
      const data = await resp.json();
      if (!data.ok) {
        const grid = document.getElementById('products-grid');
        if (grid) {
          grid.innerHTML = `
            <div style="grid-column: 1/-1; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:32px; text-align:center;">
              <h3 style="margin:0 0 8px 0;">Tienda no disponible</h3>
              <p style="color:var(--muted); font-size:0.9rem; max-width:500px; margin:0 auto;">
                ${esc(data.error || 'Verificá el enlace compartido por la tienda.')}
              </p>
            </div>
          `;
        }
        return;
      }

      STATE.nodo = data.nodo;
      STATE.slug = data.nodo.slug;
      STATE.nodosDisponibles = data.nodos_disponibles || [];
      STATE.proximaEntrega = data.proxima_entrega;
      STATE.productos = data.ofertas_publicadas || [];
      asegurarModalidadEntregaValida();

      if (STATE.ofertaEnfocadaId || STATE.skuEnfocado) {
        const matchDirecto = STATE.productos.find(o =>
          (STATE.ofertaEnfocadaId && Number(o.oferta_id) === Number(STATE.ofertaEnfocadaId)) ||
          (STATE.skuEnfocado && String(o.sku_nodo || '').trim().toLowerCase() === String(STATE.skuEnfocado || '').trim().toLowerCase())
        );
        if (matchDirecto) {
          STATE.ofertaEnfocadaId = Number(matchDirecto.oferta_id);
          STATE.categoriaActiva = 'TODAS';
        }
      }

      // Aplicar paleta cálida personalizada (tema_visual + fallback color_primario)
      aplicarPaletaTienda(STATE.nodo);
      sincronizarManifestPwaTienda(STATE.slug);
      aplicarFaviconTienda('');
      renderizarBarraPwaTienda();
      verificarEstadoRealAccesoDirectoTienda();
      const bajadaEfectiva = STATE.nodo.bajada_marca || STATE.nodo.subtitulo_marca || (
        esPerfilEcommerceTienda(STATE.nodo)
          ? 'Tienda Online Oficial · Envíos a todo el país'
          : 'Pedidos comunitarios del barrio'
      );
      sincronizarTituloYMetaPwaTienda(STATE.nodo.nombre_marca);

      // Renderizar cabecera minimalista con protagonismo central de marca
      document.getElementById('brand-name').textContent = STATE.nodo.nombre_marca;
      document.getElementById('brand-subtitle').textContent = bajadaEfectiva;

      const logoBox = document.getElementById('brand-logo-box');
      const logoPrincipal = resolverUrlAssetTienda(STATE.nodo.tema_visual?.logos?.principal || '', STATE.nodo);
      const logoHorizontal = resolverUrlAssetTienda(STATE.nodo.tema_visual?.logos?.horizontal || '', STATE.nodo);
      const logoCabecera = logoPrincipal || logoHorizontal;
      const logoIncluyeTexto = Boolean(logoCabecera && STATE.nodo.tema_visual?.logo_incluye_texto);
      const logoIsotipo = resolverUrlAssetTienda(STATE.nodo.tema_visual?.logos?.isotipo || '', STATE.nodo);
      const logoSrc = logoIncluyeTexto
        ? logoCabecera
        : (logoIsotipo || logoCabecera || STATE.nodo.logo_original_base64 || STATE.nodo.logo_mono_preview_base64 || '');
      logoBox.classList.toggle('has-principal-logo', Boolean(logoIncluyeTexto && logoPrincipal));
      logoBox.classList.toggle('has-horizontal-logo', Boolean(logoIncluyeTexto && !logoPrincipal));
      const brandBoxEl = logoBox.closest('.brand-box');
      if (brandBoxEl) {
        brandBoxEl.classList.toggle('logo-includes-text', logoIncluyeTexto);
      }
      if (logoSrc) {
        const altLogo = bajadaEfectiva ? `${STATE.nodo.nombre_marca} · ${bajadaEfectiva}` : STATE.nodo.nombre_marca;
        logoBox.innerHTML = `<img src="${logoSrc}" alt="${esc(altLogo)}">`;
      } else {
        const siglas = String(STATE.nodo.nombre_marca || 'ND').split(/\s+/).map(w => w[0] || '').join('').substring(0, 2).toUpperCase();
        logoBox.innerHTML = `<div class="brand-monogram">${esc(siglas)}</div>`;
      }

      sincronizarEnlacesCoordinarGestor();
      renderSubtituloCatalogoTienda();
      renderBannerEntrega();
      renderAccesoVideoBienvenidaTienda();
      renderizarDrawerNodoTienda();
      renderCategorias();
      renderCatalogo();
      renderizarPiePerfilPublicoTienda();
      actualizarBarraCarrito();
      if (VISOR_FOTOS_STATE.abierto) {
        renderizarFichaInferiorVisorProducto();
      }
      refrescarBannerPedidosRecientes();
      renderizarBannerDispositivoAdminTienda();

      if (!fechaSimuladaIso && _telUltimoSlugVistaEnviada !== STATE.slug) {
        _telUltimoSlugVistaEnviada = STATE.slug;
        const extraVista = {};
        if (_URL_LAUNCH_PARAMS.modo_admin_param === '1') {
          extraVista.accion_admin_gestor = 'ACTIVAR';
          extraVista.es_admin_gestor = true;
        } else if (_URL_LAUNCH_PARAMS.modo_admin_param === '0') {
          extraVista.accion_admin_gestor = 'DESACTIVAR';
          extraVista.es_admin_gestor = false;
        }
        if (STATE.ofertaEnfocadaId || STATE.skuEnfocado) {
          const pFocus = STATE.productos.find(o => Number(o.oferta_id) === Number(STATE.ofertaEnfocadaId));
          if (pFocus) {
            extraVista.oferta_id = Number(pFocus.oferta_id);
            extraVista.sku_nodo = pFocus.sku_nodo || '';
            extraVista.producto_nombre = pFocus.nombre_publico || '';
          }
        }
        enviarTelemetriaTienda('vista_tienda', extraVista, 3000);
      }
    }

      window.history.replaceState({}, '', `/tienda/${encodeURIComponent(nuevoSlug)}`);

    function obtenerPerfilContactoPublicoTienda(nodoObj = STATE.nodo) {
      const n = nodoObj || {};
      const p = (n.config_perfil_publico && typeof n.config_perfil_publico === 'object') ? n.config_perfil_publico : {};
      const mostrarWa = p.mostrar_whatsapp_tienda !== undefined ? Boolean(p.mostrar_whatsapp_tienda) : true;
      const rawWa = mostrarWa
        ? String(p.whatsapp_tienda_efectivo || n.whatsapp_tienda_efectivo || n.gestor_telefono || '').replace(/\D+/g, '')
        : '';
      const waFinal = rawWa ? (rawWa.startsWith('54') ? rawWa : `549${rawWa}`) : '';
      const emailTienda = (p.mostrar_email_tienda && p.email_tienda) ? String(p.email_tienda).trim().toLowerCase() : '';
      const igUsuario = (p.mostrar_instagram_tienda && p.instagram_usuario) ? String(p.instagram_usuario).replace(/^@+/, '').trim().toLowerCase() : '';
      const igUrl = igUsuario ? (String(p.instagram_url || '').trim() || `https://www.instagram.com/${igUsuario}/`) : '';
      return {
        whatsapp_efectivo: waFinal,
        mostrar_whatsapp_tienda: Boolean(mostrarWa && waFinal),
        email_tienda: emailTienda,
        mostrar_email_tienda: Boolean(emailTienda),
        instagram_usuario: igUsuario,
        instagram_url: igUrl,
        mostrar_instagram_tienda: Boolean(igUsuario && igUrl)
      };
    }

    function obtenerWhatsappPublicoEfectivoTienda(nodoObj = STATE.nodo) {
      return obtenerPerfilContactoPublicoTienda(nodoObj).whatsapp_efectivo;
    }

    function copiarEmailTiendaPublica(emailStr) {
      const clean = String(emailStr || '').trim();
      if (!clean) return;
      navigator.clipboard?.writeText(clean)
        .then(() => {
          if (typeof mostrarToastTienda === 'function') {
            mostrarToastTienda(`✉️ Correo copiado: ${clean}`);
          }
        })
        .catch(() => {});
    }

    function obtenerUrlWhatsappCoordinarGestor() {
      const nodo = STATE.nodo || {};

        ? `Hola ${nodo.gestor_nombre || ''}! Te escribo desde la tienda online de ${nodo.nombre_marca || 'la marca'}.`
        : `Hola ${nodo.gestor_nombre || ''}! Te escribo desde la tienda vecinal de ${nodo.nombre_marca || 'nuestro barrio'}.`;
      return `https://wa.me/${telWa}?text=${encodeURIComponent(saludo)}`;
    }

      const href = obtenerUrlWhatsappCoordinarGestor();
      const esEc = esPerfilEcommerceTienda(STATE.nodo);

      for (const idEl of ['bnav-coordinar', 'desk-nav-coordinar', 'drawer-wa-gestor-link']) {

        bnavCoordLbl.textContent = 'Contacto';

      if (STATE.vistaMiCuentaActiva) {

      const inp = document.getElementById('search-box');

      let sub = 0;

        const c = Number(STATE.carrito[p.oferta_id] || 0);

      if (chip) {
        if (esPerfilEcommerceTienda(STATE.nodo)) {
          const cfg = obtenerConfigPaqueteriaTienda(STATE.nodo);
          const meta = Number(cfg.envio_gratis_desde_monto || 0);
          const subtotal = calcularSubtotalProductosSoloCarrito();
          const desbloqueado = Boolean(cfg.envio_gratis_activo && meta > 0 && subtotal >= meta);

          if (iconEl) iconEl.textContent = desbloqueado ? '🎁' : '🚚';
          if (lblEl) lblEl.textContent = tMarca(STATE.nodo, 'chip_entrega_label') || 'Envíos';

          chip.classList.remove('unlocked');

          if (lblEl) lblEl.textContent = tMarca(STATE.nodo, 'chip_entrega_label') || 'Retiro en local';

        : {};
      const urlWeb = String(raw.url_web || raw.url_whatsapp || '').trim();

        raw.tiene_video

        && raw.mostrar_en_tienda !== false

      return {
        disponible,
        url_web: urlWeb,

      const m = String(STATE.nodo?.modo_vidriera_tienda || 'PORTADAS').trim().toUpperCase();

    function obtenerGaleriaMultimediaProducto(p) {
      if (Array.isArray(p?.galeria_multimedia) && p.galeria_multimedia.length > 0) {
        return p.galeria_multimedia;
      }
      const fotos = Array.isArray(p?.fotos_vidriera) ? p.fotos_vidriera : [];
      const videos = Array.isArray(p?.videos_vidriera) ? p.videos_vidriera : [];
      return [
        ...fotos.map((f, i) => ({ id: f.id, tipo: 'foto', url: f.url, poster_url: f.url, orden: i + 1 })),
        ...videos.map((v, i) => ({
          id: v.id,
          tipo: 'video',
          url: v.url,
          poster_url: v.poster_url || '',
          duration_sec: v.duration_sec || 0,
          orden: fotos.length + i + 1
        }))
      ];
    }

    let _coverVideoObserver = null;
    let _coverVideoActivoEl = null;

    function inicializarObservadorVideosPortadaTienda() {
      if (_coverVideoObserver) {
        try { _coverVideoObserver.disconnect(); } catch (_) {}
      }
      if (_coverVideoActivoEl) {
        try { _coverVideoActivoEl.pause(); } catch (_) {}
        _coverVideoActivoEl = null;
      }

      const videos = Array.from(document.querySelectorAll('#products-grid video[data-cover-video="1"]'));
      if (videos.length === 0 || typeof IntersectionObserver !== 'function') return;

      const ratios = new Map();
      const sincronizarReproduccion = () => {
        let mejorVideo = null;
        let mejorRatio = 0;
        for (const [el, r] of ratios.entries()) {
          if (r >= 0.55 && r > mejorRatio && document.body.contains(el)) {
            mejorRatio = r;
            mejorVideo = el;
          }
        }
        if (_coverVideoActivoEl && _coverVideoActivoEl !== mejorVideo) {
          try { _coverVideoActivoEl.pause(); } catch (_) {}
          _coverVideoActivoEl = null;
        }
        if (mejorVideo && _coverVideoActivoEl !== mejorVideo && !VISOR_FOTOS_STATE.abierto) {
          _coverVideoActivoEl = mejorVideo;
          mejorVideo.muted = true;
          mejorVideo.playsInline = true;
          const p = mejorVideo.play();
          if (p && typeof p.catch === 'function') p.catch(() => {});
        }
      };

      _coverVideoObserver = new IntersectionObserver((entries) => {
        for (const entry of entries) {
          ratios.set(entry.target, entry.isIntersecting ? entry.intersectionRatio : 0);
        }
        sincronizarReproduccion();
      }, { threshold: [0, 0.55, 0.85] });

      videos.forEach(v => _coverVideoObserver.observe(v));
    }

    function renderCatalogo() {
      const grid = document.getElementById('products-grid');
      const modoVidriera = obtenerModoVidrieraTienda();
      grid.dataset.modoVidriera = modoVidriera;
      grid.classList.toggle('modo-portadas', modoVidriera === 'PORTADAS');
      grid.classList.toggle('modo-cuadricula', modoVidriera === 'CUADRICULA');
      grid.classList.toggle('modo-lista-compacta', modoVidriera === 'LISTA_COMPACTA');

      if (STATE.productos.length === 0) {
        const esEc = esPerfilEcommerceTienda(STATE.nodo);
        grid.innerHTML = `
          <div style="grid-column: 1/-1; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:34px 20px; text-align:center;">
            <div style="font-size:1.02rem; font-weight:900; color:var(--text); margin-bottom:6px;">Próximamente disponibles</div>
            <div style="font-size:0.88rem; color:var(--muted); max-width:440px; margin:0 auto;">
              ${esEc
                ? `Estamos preparando la selección de productos disponibles para envío nacional en ${esc(STATE.nodo?.nombre_marca || 'la tienda')}.`
                : 'Estamos preparando la selección de productos para la próxima entrega del barrio.'}
            </div>
          </div>
        `;
        return;
      }

      const qNorm = normalizarTextoBusqueda(document.getElementById('search-box')?.value || '');
      const terms = qNorm.split(/\s+/).filter(Boolean);

      const filtrados = STATE.productos.filter(p => {
        if (STATE.categoriaActiva !== 'TODAS' && p.categoria_familiar !== STATE.categoriaActiva) return false;
        if (terms.length === 0) return true;
        const ingTxt = Array.isArray(p.ingredientes_comerciales) ? p.ingredientes_comerciales.join(' ') : '';
        const compTxt = Array.isArray(p.componentes_vidriera) ? p.componentes_vidriera.map(c => c.nombre || '').join(' ') : '';
        const presTxt = obtenerPresentacionItem(p);
        const bolsa = normalizarTextoBusqueda(
          `${p.nombre_publico || ''} ${p.categoria_familiar || ''} ${presTxt} ${p.sku_nodo || ''} ${p.narrativa_tienda || ''} ${ingTxt} ${compTxt}`
        );
        return terms.every(t => bolsa.includes(t));
      });

      if (filtrados.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:36px; color:var(--muted); font-weight:700;">No encontramos productos con ese filtro.</div>`;
        return;
      }

      const permitirBotonNodo = STATE.nodo?.mostrar_ingredientes_tienda !== false;
      const mapaGrupos = new Map();
      for (const p of filtrados) {
        const clave = claveGrupoProductoTienda(p);
        if (!mapaGrupos.has(clave)) {
          mapaGrupos.set(clave, {
            clave,
            categoria_familiar: p.categoria_familiar || 'Almacén Natural',
            nombre_publico: p.nombre_publico,
            destacado_tienda: Boolean(p.destacado_tienda),
            presentaciones: []
          });
        }
        const g = mapaGrupos.get(clave);
        g.destacado_tienda = g.destacado_tienda || Boolean(p.destacado_tienda);
        g.presentaciones.push(p);
      }

      const grupos = Array.from(mapaGrupos.values());
      const renderBotonFotosCompacto = (ofertaObj) => {
        const galeria = obtenerGaleriaMultimediaProducto(ofertaObj);
        const tieneNarrativa = Boolean(String(ofertaObj?.narrativa_tienda || '').trim());
        if (galeria.length === 0 && !tieneNarrativa) return '';
        const tieneVideo = galeria.some(it => it.tipo === 'video');
        const icono = tieneVideo ? '🎬' : (galeria.length > 0 ? '📷' : '📖');
        const n = galeria.length;
        return `<button type="button" class="btn-ver-fotos-item" data-btn-fotos-oferta="${Number(ofertaObj.oferta_id)}" aria-label="Ver detalle multimedia" title="Ver fotos, videos o descripción" onclick="event.stopPropagation(); abrirVisorFotosProducto(${Number(ofertaObj.oferta_id)})"><span>${icono}</span>${n > 1 ? `<span class="btn-ver-fotos-count">${n}</span>` : ''}</button>`;
      };

      const renderPortadaInteractivaHtml = (portada, ofertaTarget, claseTamano) => {
        if (!portada || !ofertaTarget) return '';
        const galeria = obtenerGaleriaMultimediaProducto(ofertaTarget);
        const total = galeria.length;
        const oid = Number(ofertaTarget.oferta_id);
        if (portada.tipo === 'video') {
          const durTxt = Math.max(1, Math.round(Number(portada.duration_sec || 1))) + 's';
          return `
            <button type="button" class="prod-cover-btn ${claseTamano}" data-testid="portada-card-${oid}"
              aria-label="Abrir galería de ${esc(ofertaTarget.nombre_publico)}"
              onclick="abrirVisorFotosProducto(${oid})">
              <video class="prod-cover-video" data-cover-video="1"
                src="${esc(portada.url)}"
                ${portada.poster_url ? `poster="${esc(portada.poster_url)}"` : ''}
                muted loop playsinline preload="none"></video>
              <span class="prod-cover-video-pill">▶ ${durTxt}</span>
              ${total > 1 ? `<span class="prod-cover-badge">+${total - 1}</span>` : ''}
            </button>
          `;
        }
        return `
          <button type="button" class="prod-cover-btn ${claseTamano}" data-testid="portada-card-${oid}"
            aria-label="Abrir galería de ${esc(ofertaTarget.nombre_publico)}"
            onclick="abrirVisorFotosProducto(${oid})">
            <img class="prod-cover-img" src="${esc(portada.url)}" alt="${esc(ofertaTarget.nombre_publico)}" loading="lazy" />
            ${total > 1 ? `<span class="prod-cover-badge">1/${total}</span>` : ''}
          </button>
        `;
      };

      const renderFilaPresentacion = (p, mostrarBotonFotoEnFila = false, esModoCuadricula = false) => {
        const cant = Number(STATE.carrito[p.oferta_id] || 0);
        const pres = obtenerPresentacionItem(p) || 'Unidad';
        const esPresEnfocada = Boolean(
          (STATE.ofertaEnfocadaId && Number(p.oferta_id) === Number(STATE.ofertaEnfocadaId)) ||
          (STATE.skuEnfocado && String(p.sku_nodo || '').trim().toLowerCase() === String(STATE.skuEnfocado || '').trim().toLowerCase())
        );
        const btnFotoFila = mostrarBotonFotoEnFila ? renderBotonFotosCompacto(p) : '';
        if (esModoCuadricula) {
          return `
            <div class="prod-pres-row${esPresEnfocada ? ' prod-pres-destacado' : ''}">
              <div class="prod-pres-top-grid">
                <span class="prod-pres-label">${esc(pres)}</span>
                <span class="prod-pres-price">${fmt(p.precio_venta_vecino)}</span>
              </div>
              <div class="prod-pres-actions">
                ${cant === 0
                  ? `<button type="button" class="btn-add btn-add-compact" onclick="modificarCarrito(${Number(p.oferta_id)}, 1)">+ Agregar</button>`
                  : `<div class="stepper stepper-compact">
                       <button type="button" onclick="modificarCarrito(${Number(p.oferta_id)}, -1)">−</button>
                       <span>${cant}</span>
                       <button type="button" onclick="modificarCarrito(${Number(p.oferta_id)}, 1)">+</button>
                     </div>`
                }
              </div>
            </div>
          `;
        }
        return `
          <div class="prod-pres-row${esPresEnfocada ? ' prod-pres-destacado' : ''}">
            <div class="prod-pres-label-wrap">
              <div class="prod-pres-label">${esc(pres)}</div>
              ${btnFotoFila}
            </div>
            <div class="prod-pres-actions">
              <span class="prod-pres-price">${fmt(p.precio_venta_vecino)}</span>
              ${cant === 0
                ? `<button type="button" class="btn-add btn-add-compact" onclick="modificarCarrito(${Number(p.oferta_id)}, 1)">+ Agregar</button>`
                : `<div class="stepper stepper-compact">
                     <button type="button" onclick="modificarCarrito(${Number(p.oferta_id)}, -1)">−</button>
                     <span>${cant}</span>
                     <button type="button" onclick="modificarCarrito(${Number(p.oferta_id)}, 1)">+</button>
                   </div>`
              }
            </div>
          </div>
        `;
      };

      grid.innerHTML = grupos.map(g => {
        g.presentaciones.sort((a, b) => {
          const ka = Number(a.kilos_unidad || 0);
          const kb = Number(b.kilos_unidad || 0);
          if (ka !== kb) return ka - kb;
          const pa = Number(a.precio_venta_vecino || 0);
          const pb = Number(b.precio_venta_vecino || 0);
          if (pa !== pb) return pa - pb;
          return Number(a.oferta_id || 0) - Number(b.oferta_id || 0);
        });
        const esCardEnfocada = g.presentaciones.some(p =>
          (STATE.ofertaEnfocadaId && Number(p.oferta_id) === Number(STATE.ofertaEnfocadaId)) ||
          (STATE.skuEnfocado && String(p.sku_nodo || '').trim().toLowerCase() === String(STATE.skuEnfocado || '').trim().toLowerCase())
        );
        const ofertaIng = permitirBotonNodo
          ? g.presentaciones.find(x =>
              x.mostrar_ingredientes !== false && (
                (Array.isArray(x.ingredientes_comerciales) && x.ingredientes_comerciales.length >= 2) ||
                (x.es_combo && Array.isArray(x.componentes_vidriera) && x.componentes_vidriera.length >= 2)
              )
            ) || null
          : null;
        const ofertaCombo = g.presentaciones.find(x => x.es_combo && Array.isArray(x.componentes_vidriera) && x.componentes_vidriera.length > 0) || null;
        const resumenComboHtml = ofertaCombo
          ? `<div style="font-size:0.73rem; color:var(--text); background:var(--surface-warm); border:1px solid var(--border); border-radius:8px; padding:4px 8px; margin-top:4px; line-height:1.35;"><strong>🎁 Incluye:</strong> ${ofertaCombo.componentes_vidriera.map(c => `${Number(c.cantidad || 1)}x ${esc(c.nombre)}`).join(' · ')}</div>`
          : '';
        const ofertaPortada = g.presentaciones.find(x => x.portada_activa && x.portada_modo !== 'OCULTA') || null;
        const portadaActiva = ofertaPortada ? ofertaPortada.portada_activa : null;
        const ofertaDetalle = ofertaPortada ||
          g.presentaciones.find(x => obtenerGaleriaMultimediaProducto(x).length > 0 || String(x.narrativa_tienda || '').trim()) ||
          g.presentaciones[0];
        const narrativaGrupo = g.presentaciones.map(x => String(x.narrativa_tienda || '').trim()).find(Boolean) || '';
        const esPresentacionUnica = g.presentaciones.length === 1;

        if (modoVidriera === 'CUADRICULA') {
          const mostrarChipDetalleSinPortada = !portadaActiva && (obtenerGaleriaMultimediaProducto(ofertaDetalle).length > 0 || Boolean(narrativaGrupo));
          return `
            <div class="prod-card${esCardEnfocada ? ' prod-card-destacado' : ''}"${esCardEnfocada ? ' id="prod-card-enfocada"' : ''}>
              <div style="display:flex; flex-direction:column; gap:7px; min-width:0;">
                ${esCardEnfocada ? '<div class="badge-oferta-enfocada">✨ Destacado</div>' : ''}
                ${portadaActiva
                  ? renderPortadaInteractivaHtml(portadaActiva, ofertaPortada, 'is-grid')
                  : `
                    <div class="prod-grid-typo-cover" ${mostrarChipDetalleSinPortada ? `style="cursor:pointer;" onclick="abrirVisorFotosProducto(${Number(ofertaDetalle.oferta_id)})"` : ''}>
                      <div class="prod-cat">${esc(g.categoria_familiar)}</div>
                      <div class="prod-title" style="margin:2px 0 0 0;">${esc(g.nombre_publico)}</div>
                    </div>
                  `
                }
                ${portadaActiva ? `
                  <div style="min-width:0;">
                    <div class="prod-cat">${esc(g.categoria_familiar)}</div>
                    <div class="prod-title">${esc(g.nombre_publico)}</div>
                  </div>
                ` : ''}
                ${resumenComboHtml}
                ${narrativaGrupo ? `
                  <button type="button" class="prod-narrativa-snippet"
                    onclick="abrirVisorFotosProducto(${Number(ofertaDetalle.oferta_id)})">
                    ${esc(narrativaGrupo)}
                  </button>
                ` : ''}
                ${(ofertaIng || mostrarChipDetalleSinPortada) ? `
                  <div style="display:flex; align-items:center; gap:5px; flex-wrap:wrap;">
                    ${mostrarChipDetalleSinPortada ? renderBotonFotosCompacto(ofertaDetalle) : ''}
                    ${ofertaIng ? `<button type="button" class="btn-ver-ing" style="font-size:0.69rem; padding:3px 8px;" onclick="event.stopPropagation(); abrirModalIngredientesProducto(${Number(ofertaIng.oferta_id)})">🥣 ¿Qué contiene?</button>` : ''}
                  </div>
                ` : ''}
              </div>
              <div class="prod-pres-list">
                ${g.presentaciones.map(p => renderFilaPresentacion(p, false, true)).join('')}
              </div>
            </div>
          `;
        }

        const mostrarPortadaLateral = modoVidriera === 'PORTADAS' && Boolean(portadaActiva);
        const btnFotoCabecera = (!mostrarPortadaLateral && esPresentacionUnica) ? renderBotonFotosCompacto(g.presentaciones[0]) : '';

        return `
          <div class="prod-card${esCardEnfocada ? ' prod-card-destacado' : ''}"${esCardEnfocada ? ' id="prod-card-enfocada"' : ''}>
            ${esCardEnfocada ? '<div class="badge-oferta-enfocada">✨ Producto compartido</div>' : ''}
            <div class="${mostrarPortadaLateral ? 'prod-portada-side-row' : ''}">
              ${mostrarPortadaLateral ? renderPortadaInteractivaHtml(portadaActiva, ofertaPortada, 'is-side') : ''}
              <div style="flex:1; min-width:0;">
                <div class="prod-card-head">
                  <div class="prod-head-info">
                    <div class="prod-cat">${esc(g.categoria_familiar)}</div>
                    <div class="prod-title">${esc(g.nombre_publico)}</div>
                  </div>
                  ${(btnFotoCabecera || ofertaIng) ? `
                    <div class="prod-head-actions">
                      ${btnFotoCabecera}
                      ${ofertaIng
                        ? `<button type="button" class="btn-ver-ing" onclick="event.stopPropagation(); abrirModalIngredientesProducto(${Number(ofertaIng.oferta_id)})">🥣 ¿Qué contiene?</button>`
                        : ''
                      }
                    </div>
                  ` : ''}
                </div>
                ${resumenComboHtml}
                ${narrativaGrupo ? `
                  <button type="button" class="prod-narrativa-snippet"
                    onclick="abrirVisorFotosProducto(${Number(ofertaDetalle.oferta_id)})">
                    ${esc(narrativaGrupo)}
                  </button>
                ` : ''}
              </div>
            </div>
            <div class="prod-pres-list">
              ${g.presentaciones.map(p => renderFilaPresentacion(p, !esPresentacionUnica && !mostrarPortadaLateral, false)).join('')}
            </div>
          </div>
        `;
      }).join('');

      inicializarObservadorVideosPortadaTienda();

      if ((STATE.ofertaEnfocadaId || STATE.skuEnfocado) && !STATE._scrollOfertaHecho) {
        const elDestacado = document.getElementById('prod-card-enfocada');
        if (elDestacado) {
          STATE._scrollOfertaHecho = true;
          requestAnimationFrame(() => {
            setTimeout(() => {
              elDestacado.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 120);
          });
        }
      }
    }

    function abrirModalIngredientesProducto(ofertaId) {
      const prod = STATE.productos.find(x =>
        Number(x.oferta_id) === Number(ofertaId) ||
        String(x.sku_nodo || '') === String(ofertaId || '')
      );
      const tieneIng = prod && Array.isArray(prod.ingredientes_comerciales) && prod.ingredientes_comerciales.length >= 2;
      const tieneComp = prod && prod.es_combo && Array.isArray(prod.componentes_vidriera) && prod.componentes_vidriera.length >= 2;
      if (!prod || (!tieneIng && !tieneComp)) return;
      STATE.ofertaIngredientesModalId = Number(prod.oferta_id);
      renderContenidoModalIngredientes();
      const modal = document.getElementById('ingredientes-modal');
      if (modal) {
        modal.style.display = 'flex';
        modal.classList.add('open');
      }
      enviarTelemetriaTienda('clic_que_contiene', {
        oferta_id: Number(prod.oferta_id),
        sku_nodo: prod.sku_nodo || '',
        producto_nombre: prod.nombre_publico || '',
        categoria_nombre: prod.categoria_familiar || ''
      }, 1500);
    }

    function cerrarModalIngredientesProducto() {
      STATE.ofertaIngredientesModalId = null;
      const modal = document.getElementById('ingredientes-modal');
      if (modal) {
        modal.style.display = 'none';
        modal.classList.remove('open');
      }
    }

    document.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Escape') return;
      if (document.getElementById('contacto-wa-confirm-modal')?.classList.contains('open')) {
        cerrarModalConfirmarWhatsAppTienda();
        return;
      }
      if (document.getElementById('pago-rapido-tienda-modal')?.classList.contains('open')) {
        cerrarModalPagoTransferenciaRapido();
        return;
      }
      if (document.getElementById('envios-tienda-modal')?.classList.contains('open')) {
        cerrarModalEnviosTienda();
        return;
      }
      if (document.getElementById('nodo-drawer')?.classList.contains('open')) {
        cerrarDrawerNodoTienda();
        return;
      }
      if (document.getElementById('pwa-tienda-modal')?.classList.contains('open')) {
        cerrarModalPwaTienda();
        return;
      }
      if (STATE.ofertaIngredientesModalId) {
        cerrarModalIngredientesProducto();
      }
    });

    function renderContenidoModalIngredientes() {
      const card = document.getElementById('ingredientes-card-content');
      if (!card || !STATE.ofertaIngredientesModalId) return;
      const p = STATE.productos.find(x => Number(x.oferta_id) === Number(STATE.ofertaIngredientesModalId));
      if (!p) {
        cerrarModalIngredientesProducto();
        return;
      }
      const lista = Array.isArray(p.ingredientes_comerciales) ? p.ingredientes_comerciales : [];
      const claveGrupo = claveGrupoProductoTienda(p);
      const hermanos = STATE.productos
        .filter(x => claveGrupoProductoTienda(x) === claveGrupo)
        .sort((a, b) => {
          const ka = Number(a.kilos_unidad || 0);
          const kb = Number(b.kilos_unidad || 0);
          if (ka !== kb) return ka - kb;
          const pa = Number(a.precio_venta_vecino || 0);
          const pb = Number(b.precio_venta_vecino || 0);
          if (pa !== pb) return pa - pb;
          return Number(a.oferta_id || 0) - Number(b.oferta_id || 0);
        });
      const presentaciones = hermanos.length > 0 ? hermanos : [p];
      const unica = presentaciones.length === 1;
      const cantUnica = Number(STATE.carrito[p.oferta_id] || 0);
      const presentacionUnica = obtenerPresentacionItem(p);

      card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding-bottom:12px; border-bottom:1px solid var(--border);">
          <div>
            <div style="font-size:0.72rem; font-weight:800; text-transform:uppercase; letter-spacing:0.04em; color:var(--brand-dark);">
              🥣 ¿Qué contiene este producto?
            </div>
            <h3 style="margin:4px 0 6px 0; font-size:1.12rem; font-weight:900; color:var(--text); line-height:1.25;">
              ${esc(p.nombre_publico)}
            </h3>
            ${unica && presentacionUnica ? `<span class="prod-pres">${esc(presentacionUnica)}</span>` : ''}
          </div>
          <button type="button" onclick="cerrarModalIngredientesProducto()" aria-label="Cerrar"
            style="width:32px; height:32px; border-radius:999px; border:1px solid var(--border); background:var(--surface-warm); color:var(--muted); font-weight:900; font-size:1rem; cursor:pointer; flex-shrink:0;">
            ✕
          </button>
        </div>

        <div style="padding-top:12px; display:flex; flex-direction:column; gap:12px;">
          ${p.es_combo && Array.isArray(p.componentes_vidriera) && p.componentes_vidriera.length > 0 ? `
            <div>
              <div style="font-size:0.78rem; font-weight:800; color:var(--brand-dark); margin-bottom:6px;">
                🎁 Este combo incluye (${p.componentes_vidriera.length}):
              </div>
              <div style="display:flex; flex-direction:column; gap:5px;">
                ${p.componentes_vidriera.map(c => `
                  <div style="font-size:0.84rem; font-weight:700; color:var(--text); background:var(--surface-warm); border:1px solid var(--border); border-radius:8px; padding:6px 10px;">
                    <strong>${Number(c.cantidad || 1)}x</strong> ${esc(c.nombre)}
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
          ${lista.length > 0 ? `
            <div>
              <div style="font-size:0.78rem; font-weight:800; color:var(--muted);">
                Ingredientes seleccionados (${lista.length}):
              </div>
              <div class="ing-chips-wrap">
                ${lista.map(ing => `
                  <span class="ing-chip">
                    <span class="ing-chip-dot"></span>
                    <span>${esc(ing)}</span>
                  </span>
                `).join('')}
              </div>
            </div>
          ` : ''}
        </div>

        ${unica ? `
          <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-top:18px; padding-top:14px; border-top:1px solid var(--border);">
            <div>
              <div style="font-size:0.72rem; font-weight:700; color:var(--muted);">Precio vecinal</div>
              <div style="font-size:1.18rem; font-weight:900; color:var(--text);">${fmt(p.precio_venta_vecino)}</div>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              ${cantUnica === 0
                ? `<button type="button" class="btn-add" onclick="modificarCarrito(${Number(p.oferta_id)}, 1)">+ Agregar</button>`
                : `<div class="stepper">
                     <button type="button" onclick="modificarCarrito(${Number(p.oferta_id)}, -1)">−</button>
                     <span>${cantUnica}</span>
                     <button type="button" onclick="modificarCarrito(${Number(p.oferta_id)}, 1)">+</button>
                   </div>`
              }
              <button type="button" onclick="cerrarModalIngredientesProducto()"
                style="padding:9px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface-warm); color:var(--text); font-family:inherit; font-weight:800; font-size:0.84rem; cursor:pointer;">
                Cerrar
              </button>
            </div>
          </div>
        ` : `
          <div style="margin-top:16px; padding-top:12px; border-top:1px solid var(--border);">
            <div style="font-size:0.76rem; font-weight:800; color:var(--muted); margin-bottom:8px;">
              Presentaciones disponibles (${presentaciones.length}):
            </div>
            <div style="display:flex; flex-direction:column; gap:7px;">
              ${presentaciones.map(h => {
                const ch = Number(STATE.carrito[h.oferta_id] || 0);
                const presH = obtenerPresentacionItem(h) || 'Unidad';
                return `
                  <div class="prod-pres-row">
                    <div class="prod-pres-label">${esc(presH)}</div>
                    <div class="prod-pres-actions">
                      <span class="prod-pres-price">${fmt(h.precio_venta_vecino)}</span>
                      ${ch === 0
                        ? `<button type="button" class="btn-add btn-add-compact" onclick="modificarCarrito(${Number(h.oferta_id)}, 1)">+ Agregar</button>`
                        : `<div class="stepper stepper-compact">
                             <button type="button" onclick="modificarCarrito(${Number(h.oferta_id)}, -1)">−</button>
                             <span>${ch}</span>
                             <button type="button" onclick="modificarCarrito(${Number(h.oferta_id)}, 1)">+</button>
                           </div>`
                      }
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
            <div style="display:flex; justify-content:flex-end; margin-top:12px;">
              <button type="button" onclick="cerrarModalIngredientesProducto()"
                style="padding:9px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface-warm); color:var(--text); font-family:inherit; font-weight:800; font-size:0.84rem; cursor:pointer;">
                Cerrar
              </button>
            </div>
          </div>
        `}
      `;
    }

    function modificarCarrito(ofertaId, delta) {
      const actual = Number(STATE.carrito[ofertaId] || 0);
      const nuevo = Math.max(0, actual + delta);
      if (nuevo === 0) delete STATE.carrito[ofertaId];
      else STATE.carrito[ofertaId] = nuevo;
      renderCatalogo();
      actualizarBarraCarrito();
      if (VISOR_FOTOS_STATE.abierto) {
        renderizarFichaInferiorVisorProducto();
      }
      if (STATE.ofertaIngredientesModalId) {
        const modalProd = STATE.productos.find(x => Number(x.oferta_id) === Number(STATE.ofertaIngredientesModalId));
        const editedProd = STATE.productos.find(x => Number(x.oferta_id) === Number(ofertaId));
        if (STATE.ofertaIngredientesModalId === Number(ofertaId) ||
          (modalProd && editedProd && claveGrupoProductoTienda(modalProd) === claveGrupoProductoTienda(editedProd))) {
          renderContenidoModalIngredientes();
        }
      }
      if (nuevo !== actual) {
        const prodRef = STATE.productos.find(x => Number(x.oferta_id) === Number(ofertaId));
        const snap = construirSnapshotCarritoTelemetria();
        enviarTelemetriaTienda(delta > 0 ? 'carrito_agregar' : 'carrito_quitar', {
          oferta_id: Number(ofertaId),
          sku_nodo: prodRef?.sku_nodo || '',
          producto_nombre: prodRef?.nombre_publico || '',
          categoria_nombre: prodRef?.categoria_familiar || '',
          cantidad: nuevo,
          ...snap
        }, 250);
        if (delta < 0 && snap.carrito_unidades === 0) {
          enviarTelemetriaTienda('carrito_vaciar', {
            oferta_id: Number(ofertaId),
            sku_nodo: prodRef?.sku_nodo || '',
            producto_nombre: prodRef?.nombre_publico || '',
            carrito_snapshot: [],
            carrito_unidades: 0,
            carrito_subtotal: 0,
            detalle: 'Carrito vaciado al quitar último producto'
          }, 400);
        }
      }
    }

    function obtenerCapacidadesEntregaTienda(nodoObj = STATE.nodo) {
      const n = nodoObj || {};
      const mod = obtenerModulosActivosTienda(n);
      const puedeRetiro = Boolean(mod.retiro_punto && n.permitir_retiro_nodo !== false);
      const puedeReparto = Boolean(mod.reparto_zonal && (n.permitir_reparto_propio ?? n.permitir_envio_barrial));
      const puedeEncomienda = Boolean(mod.envio_paqueteria || n.permitir_encomienda);
      return {
        puedeRetiro,
        puedeReparto,
        puedeEncomienda,
        totalModalidades: [puedeRetiro, puedeReparto, puedeEncomienda].filter(Boolean).length,
        esSoloRetiro: Boolean(puedeRetiro && !puedeReparto && !puedeEncomienda),
        esSoloReparto: Boolean(puedeReparto && !puedeRetiro && !puedeEncomienda),
        esPostalExclusivo: Boolean(puedeEncomienda && !puedeRetiro && !puedeReparto)
      };
    }

    function esCheckoutPostalNacional(nodoObj = STATE.nodo) {
      const cap = obtenerCapacidadesEntregaTienda(nodoObj);
      return Boolean(cap.esPostalExclusivo);
    }

    function esModalidadPostalActivaWizard(nodoObj = STATE.nodo) {
      if (esCheckoutPostalNacional(nodoObj)) return true;
      const m = String(STATE.checkoutWiz?.modalidadElegida || '').toUpperCase();
      return m === 'PAQUETERIA_NACIONAL' || m === 'PAQUETERIA_DOMICILIO' || m === 'PAQUETERIA_SUCURSAL';
    }

    function asegurarModalidadEntregaValida() {
      const cap = obtenerCapacidadesEntregaTienda();
      if (STATE.modalidadEntrega === 'RETIRO_NODO' && cap.puedeRetiro) return 'RETIRO_NODO';
      if (STATE.modalidadEntrega === 'ENVIO_BARRIAL' && cap.puedeReparto) return 'ENVIO_BARRIAL';
      if ((STATE.modalidadEntrega === 'PAQUETERIA_DOMICILIO' || STATE.modalidadEntrega === 'PAQUETERIA_SUCURSAL') && cap.puedeEncomienda) {
        return STATE.modalidadEntrega;
      }
      if (cap.puedeRetiro) {
        STATE.modalidadEntrega = 'RETIRO_NODO';
      } else if (cap.puedeReparto) {
        STATE.modalidadEntrega = 'ENVIO_BARRIAL';
      } else if (cap.puedeEncomienda) {
        const cfg = obtenerConfigPaqueteriaTienda();
        STATE.modalidadEntrega = cfg.permitir_domicilio ? 'PAQUETERIA_DOMICILIO' : 'PAQUETERIA_SUCURSAL';
      }
      return STATE.modalidadEntrega;
    }

    function calcularResumenCarrito() {
      asegurarModalidadEntregaValida();
      let unidades = 0;
      let subtotal = 0;
      const detalle = [];
      for (const p of STATE.productos) {
        const c = Number(STATE.carrito[p.oferta_id] || 0);
        if (c > 0) {
          unidades += c;
          subtotal += c * Number(p.precio_venta_vecino);
          detalle.push({ ...p, cantidad: c, subtotal: c * Number(p.precio_venta_vecino) });
        }
      }
      const cap = obtenerCapacidadesEntregaTienda();
      let costoEnvio = 0;
      let cotizacionPostal = null;
      if ((STATE.modalidadEntrega === 'PAQUETERIA_DOMICILIO' || STATE.modalidadEntrega === 'PAQUETERIA_SUCURSAL') && cap.puedeEncomienda) {
        const cpWiz = String(STATE.checkoutWiz?.cpPostal || '').replace(/\D+/g, '');
        cotizacionPostal = cotizarEnvioPostalLocalTienda(cpWiz, subtotal);
        if (cotizacionPostal) {
          costoEnvio = STATE.modalidadEntrega === 'PAQUETERIA_SUCURSAL'
            ? Number(cotizacionPostal.costo_sucursal_efectivo || 0)
            : Number(cotizacionPostal.costo_domicilio_efectivo || 0);
        }
      } else if (STATE.modalidadEntrega === 'ENVIO_BARRIAL' && cap.puedeReparto) {
        costoEnvio = Number(STATE.nodo?.cargo_envio_barrial || 0);
      }
      return {
        unidades,
        subtotal,
        costoEnvio,
        cotizacionPostal,
        total: subtotal + costoEnvio,
        detalle
      };
    }

      const toast = document.getElementById('cart-empty-toast');
      if (!toast) return;

      toast.classList.add('visible');
      if (_cartEmptyToastTimer) clearTimeout(_cartEmptyToastTimer);
      _cartEmptyToastTimer = setTimeout(() => {
        toast.classList.remove('visible');
      }, 2200);

    function actualizarBarraCarrito() {
      const res = calcularResumenCarrito();
      renderBarraProgresoEnvioGratis();
      const bar = document.getElementById('cart-bar');
      if (bar) {
        if (res.unidades === 0 || STATE.vistaMiCuentaActiva) {
          bar.style.display = 'none';
        } else {
          bar.style.display = 'flex';
          const contTxt = tMarca(STATE.nodo, 'carrito_contenedor');
          document.getElementById('cart-count-label').textContent = `${res.unidades} ${res.unidades === 1 ? 'producto' : 'productos'} en tu ${contTxt}`;
          document.getElementById('cart-total-label').textContent = fmt(res.subtotal);
        }
      }

      // Actualizar ítem Carrito en Barra Inferior Móvil (< 768px)
      const bnavCart = document.getElementById('bnav-carrito');

        deskCart.classList.toggle('has-items', res.unidades > 0);
        deskBadge.textContent = String(res.unidades);
        deskLabel.textContent = res.unidades > 0 ? fmt(res.subtotal) : 'Carrito';

    function obtenerMediosPagoHabilitadosTienda(nodoObj = STATE.nodo) {
      const n = nodoObj || {};
      const mod = obtenerModulosActivosTienda(n);
      const permiteTransf = n.permitir_transferencia !== false;
      const cobroEfvoTienda = Boolean(n.cobro_efectivo_entrega ?? mod.cobro_efectivo_entrega);
      const permiteEfec = Boolean(!n.solo_transferencia_bancaria && cobroEfvoTienda && n.permitir_efectivo !== false);
      const infoBco = resolverDatosBancariosOficialesTienda(n);
      const lista = [];
      if (permiteTransf) {
        lista.push({
          codigo: 'TRANSFERENCIA',
          titulo: '🏦 Transferencia Bancaria',
          subtitulo: `Alias: ${infoBco.alias} · ${infoBco.banco}`
        });
      }
      if (permiteEfec) {
        lista.push({
          codigo: 'EFECTIVO',
          titulo: '💵 Efectivo al recibir',
          subtitulo: 'Abonás en mano al momento de la entrega'
        });
      }
      if (lista.length === 0) {
        lista.push({
          codigo: 'TRANSFERENCIA',
          titulo: '🏦 Transferencia Bancaria',
          subtitulo: `Alias: ${infoBco.alias} · ${infoBco.banco}`
        });
      }
      return lista;
    }

    function obtenerPasosCheckoutWizard() {
      const cap = obtenerCapacidadesEntregaTienda();
      const mod = obtenerModulosActivosTienda();
      const omitirUnico = mod.checkout_omitir_paso_entrega_si_unico !== false;
      if (cap.esPostalExclusivo) {
        return ['cp_modalidad', 'destino_postal', 'destinatario_postal', 'pago', 'revision'];
      }
      if (cap.esSoloRetiro && omitirUnico) {
        return ['datos', 'pago', 'revision'];
      }
      if (cap.esSoloReparto && omitirUnico) {
        return ['datos', 'direccion', 'pago', 'revision'];
      }
      if (esModalidadPostalActivaWizard()) {
        return ['entrega', 'cp_modalidad', 'destino_postal', 'destinatario_postal', 'pago', 'revision'];
      }
      if (STATE.checkoutWiz.modalidadElegida === 'ENVIO_BARRIAL') {
        return ['entrega', 'datos', 'direccion', 'pago', 'revision'];
      }
      return ['entrega', 'datos', 'pago', 'revision'];
    }

    function validarPasoCheckoutWizard(pasoKey) {
      const w = STATE.checkoutWiz;
      if (pasoKey === 'cp_modalidad') {
        const cpDigits = String(w.cpPostal || '').replace(/\D+/g, '');
        const cpNum = Number(cpDigits);
        const cpOk = cpDigits.length === 4 && cpNum >= 1000 && cpNum <= 9499;
        const modOk = w.modalidadElegida === 'PAQUETERIA_DOMICILIO' || w.modalidadElegida === 'PAQUETERIA_SUCURSAL';
        const opOk = Boolean(String(w.operadorPostal || '').trim());
        return cpOk && modOk && opOk;
      }
      if (pasoKey === 'destino_postal') {
        const provOk = Boolean(String(w.provinciaCodigo || '').trim() || String(w.provinciaNombre || '').trim());
        const locOk = String(w.localidadPostal || '').trim().length >= 2;
        if (!provOk || !locOk) return false;
        if (w.modalidadElegida === 'PAQUETERIA_SUCURSAL') {
          return String(w.sucursalPostal || '').trim().length >= 3;
        }
        const calleOk = String(w.callePostal || '').trim().length >= 2;
        const alturaOk = Boolean(w.sinNumeroPostal) || String(w.alturaPostal || '').trim().length >= 1;
        return calleOk && alturaOk;
      }
      if (pasoKey === 'destinatario_postal') {
        const nom = String(w.nombre || '').trim();
        const dniDigits = String(w.dniPostal || '').replace(/\D/g, '');
        const telDigits = String(w.telefono || '').replace(/\D/g, '');
        const em = String(w.emailPostal || '').trim();
        const emOk = !em || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em);
        return nom.length >= 3 && dniDigits.length >= 7 && dniDigits.length <= 11 && telDigits.length >= 8 && emOk;
      }
      if (pasoKey === 'entrega') {
        return ['RETIRO_NODO', 'ENVIO_BARRIAL', 'PAQUETERIA_NACIONAL', 'PAQUETERIA_DOMICILIO', 'PAQUETERIA_SUCURSAL'].includes(w.modalidadElegida);
      }
      if (pasoKey === 'datos') {
        const nom = String(w.nombre || '').trim();
        const digitosTel = String(w.telefono || '').replace(/\D/g, '');
        return nom.length >= 2 && digitosTel.length >= 8;
      }
      if (pasoKey === 'direccion') {
        const dir = String(w.direccion || '').trim();
        return dir.length >= 3;
      }
      if (pasoKey === 'pago') {
        const codsHab = obtenerMediosPagoHabilitadosTienda(STATE.nodo).map(m => m.codigo);
        return Boolean(w.medioPagoElegido) && codsHab.includes(w.medioPagoElegido);
      }
      if (pasoKey === 'revision') {
        if (esModalidadPostalActivaWizard()) {
          return validarPasoCheckoutWizard('cp_modalidad') &&
                 validarPasoCheckoutWizard('destino_postal') &&
                 validarPasoCheckoutWizard('destinatario_postal') &&
                 validarPasoCheckoutWizard('pago');
        }
        return validarPasoCheckoutWizard('entrega') &&
               validarPasoCheckoutWizard('datos') &&
               (w.modalidadElegida !== 'ENVIO_BARRIAL' || validarPasoCheckoutWizard('direccion')) &&
               validarPasoCheckoutWizard('pago');
      }
      return false;
    }

    function abrirModalCheckout() {
      const res = calcularResumenCarrito();
      if (res.unidades === 0) return;
      enviarTelemetriaTienda('inicio_checkout', construirSnapshotCarritoTelemetria(), 2000);

      const idGuardada = obtenerIdentidadVecinoLocal(STATE.slug) || {};
      const nombrePre = String(idGuardada.nombre_completo || window._savedVecinoNombre || '').trim();
      const telPre = String(idGuardada.telefono_display || idGuardada.telefono_normalizado || window._savedVecinoTel || '').trim();
      const dirPre = String(idGuardada.direccion_calle || window._savedVecinoDir || '').trim();
      const refPre = String(idGuardada.entrecalles_referencia || window._savedVecinoRef || '').trim();
      const cfgPaq = obtenerConfigPaqueteriaTienda(STATE.nodo);
      const cpPre = String(idGuardada.cp_postal || '').replace(/\D+/g, '').slice(0, 4);
      const opGuardado = String(idGuardada.operador_postal || '').toUpperCase();
      const opPre = cfgPaq.operadores_habilitados.includes(opGuardado) ? opGuardado : cfgPaq.operador_default;
      const cap = obtenerCapacidadesEntregaTienda(STATE.nodo);
      const mod = obtenerModulosActivosTienda(STATE.nodo);
      const omitirUnico = mod.checkout_omitir_paso_entrega_si_unico !== false;
      const esPostal = cap.esPostalExclusivo;

      let pasoInicial = 'entrega';
      let modalidadInicial = '';
      if (esPostal) {
        pasoInicial = 'cp_modalidad';
      } else if (cap.esSoloRetiro && omitirUnico) {
        pasoInicial = 'datos';
        modalidadInicial = 'RETIRO_NODO';
        STATE.modalidadEntrega = 'RETIRO_NODO';
      } else if (cap.esSoloReparto && omitirUnico) {
        pasoInicial = 'datos';
        modalidadInicial = 'ENVIO_BARRIAL';
        STATE.modalidadEntrega = 'ENVIO_BARRIAL';
      }

      STATE.mostrarMapaCheckoutVecino = false;
      STATE.checkoutWiz = {
        pasoActualKey: pasoInicial,
        modalidadElegida: modalidadInicial,
        medioPagoElegido: '',
        nombre: nombrePre,
        telefono: telPre,
        direccion: dirPre,
        entrecalles: refPre,
        cpPostal: cpPre,
        cpAutoHidratado: '',
        operadorPostal: opPre,
        provinciaCodigo: String(idGuardada.provincia_codigo || '').trim(),
        provinciaNombre: String(idGuardada.provincia_nombre || '').trim(),
        localidadPostal: String(idGuardada.localidad_postal || '').trim(),
        callePostal: String(idGuardada.calle_postal || '').trim(),
        alturaPostal: String(idGuardada.altura_postal || '').trim(),
        sinNumeroPostal: Boolean(idGuardada.sin_numero_postal),
        pisoDeptoPostal: String(idGuardada.piso_depto_postal || '').trim(),
        referenciasPostal: String(idGuardada.referencias_postal || refPre || '').trim(),
        sucursalPostal: String(idGuardada.sucursal_postal || '').trim(),
        dniPostal: String(idGuardada.dni_cuil || '').replace(/\D/g, ''),
        emailPostal: String(idGuardada.email_contacto || '').trim(),
        cotizacionPostal: cpPre.length === 4 ? cotizarEnvioPostalLocalTienda(cpPre, res.subtotal) : null,
        teniaDatosGuardados: Boolean(nombrePre.length >= 2 && telPre.replace(/\D/g, '').length >= 8),
        enviandoPedido: false,
        pedidoConfirmado: false
      };

      document.body.style.overflow = 'hidden';
      const modal = document.getElementById('checkout-modal');
      modal.style.display = 'flex';
      renderContenidoModalCheckout();
    }

    function hidratarSugerenciasCpEnDestinoPostal() {
      const w = STATE.checkoutWiz;
      const cp = String(w.cpPostal || '').replace(/\D+/g, '');
      if (cp.length !== 4) return;
      const inf = w.cotizacionPostal || cotizarEnvioPostalLocalTienda(cp, calcularSubtotalProductosSoloCarrito());
      if (inf && w.cpAutoHidratado !== cp) {
        if (inf.provincia_codigo_sugerido) {
          w.provinciaCodigo = inf.provincia_codigo_sugerido;
          w.provinciaNombre = inf.provincia_sugerida || '';
        }

    function onInputCpPostalCheckout(val) {
      const digits = String(val || '').replace(/\D+/g, '').slice(0, 4);
      const inp = document.getElementById('chk-postal-cp');
      if (inp && inp.value !== digits) inp.value = digits;
      STATE.checkoutWiz.cpPostal = digits;
      const slot = document.getElementById('chk-postal-cp-quote-slot');
      if (slot) slot.innerHTML = renderBloqueCotizacionPaso1Postal();
      const btn = document.getElementById('chk-btn-continuar');
      if (btn) btn.disabled = !validarPasoCheckoutWizard('cp_modalidad');

      if (_cotizarCpFetchTimer) clearTimeout(_cotizarCpFetchTimer);
      if (digits.length === 4) {
        _cotizarCpFetchTimer = setTimeout(async () => {
          try {
            const sub = calcularSubtotalProductosSoloCarrito();
            const r = await fetch(`/api/produccion/nodos/tienda/${encodeURIComponent(STATE.slug)}/cotizar-cp?cp=${encodeURIComponent(digits)}&subtotal=${encodeURIComponent(sub)}`);
            const d = await r.json();
            if (r.ok && d.ok && d.cotizacion && STATE.checkoutWiz.cpPostal === digits) {
              STATE.checkoutWiz.cotizacionPostal = {
                ...STATE.checkoutWiz.cotizacionPostal,
                ...d.cotizacion
              };
            }
          } catch (_) {}
        }, 180);
      }
    }
