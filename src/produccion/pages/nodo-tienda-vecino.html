<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Tienda Barrial</title>
  <style>
    :root {
      --brand: #16a34a;
      --brand-dark: #15803d;
      --brand-light: #dcfce7;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 110px;
    }
    /* Barra superior discreta sólo para cambiar de Nodo o simular hora de corte en pruebas */
    .lab-bar {
      background: #0f172a;
      color: #cbd5e1;
      padding: 7px 16px;
      font-size: 0.76rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .lab-bar select, .lab-bar button, .lab-bar a {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
    }
    .lab-bar button.active {
      background: #f59e0b;
      color: #0f172a;
      border-color: #f59e0b;
      font-weight: 800;
    }

    /* Cabecera Marca Blanca del Nodo */
    .hero {
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      color: #ffffff;
      padding: 22px 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }
    .hero-inner {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand-box {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-logo {
      width: 78px;
      height: 46px;
      background: #ffffff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      overflow: hidden;
      flex-shrink: 0;
    }
    .brand-logo img {
      max-width: 100%;
      max-height: 100%;
      image-rendering: pixelated;
    }
    .brand-title {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .brand-sub {
      margin: 3px 0 0 0;
      font-size: 0.9rem;
      opacity: 0.92;
    }
    .brand-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 6px;
      font-size: 0.8rem;
    }
    .brand-pill {
      background: rgba(255,255,255,0.18);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Banner de Próxima Entrega y Punto de Corte */
    .delivery-banner {
      background: #ffffff;
      border: 2px solid var(--brand);
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
    }
    .delivery-banner.after-cutoff {
      border-color: #f59e0b;
      background: #fffbeb;
    }
    .delivery-badge {
      display: inline-block;
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--brand-light);
      color: var(--brand-dark);
      margin-bottom: 4px;
    }
    .delivery-banner.after-cutoff .delivery-badge {
      background: #fef3c7;
      color: #b45309;
    }
    .delivery-date-main {
      font-size: 1.08rem;
      font-weight: 800;
      color: #0f172a;
    }
    .delivery-note {
      font-size: 0.84rem;
      color: #475569;
      margin-top: 3px;
    }

    /* Buscador y Categorías */
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      font-size: 0.95rem;
      background: #ffffff;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.12);
    }
    .cats-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .cat-btn {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      font-size: 0.83rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .cat-btn.active {
      background: var(--brand);
      color: #ffffff;
      border-color: var(--brand);
    }

    /* Grilla de Productos */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
      gap: 14px;
    }
    .prod-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .prod-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
    }
    .prod-cat {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .prod-title {
      font-size: 1.02rem;
      font-weight: 800;
      color: #0f172a;
      margin: 4px 0 6px 0;
      line-height: 1.3;
    }
    .prod-pres {
      display: inline-block;
      background: #f1f5f9;
      color: #334155;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 6px;
    }
    .prod-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid #f1f5f9;
    }
    .prod-price {
      font-size: 1.25rem;
      font-weight: 900;
      color: #0f172a;
    }
    .btn-add {
      background: var(--brand);
      color: #ffffff;
      border: none;
      padding: 9px 16px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.86rem;
      cursor: pointer;
    }
    .stepper {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--brand-light);
      padding: 4px 8px;
      border-radius: 10px;
      border: 1px solid var(--brand);
    }
    .stepper button {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      border: none;
      background: var(--brand);
      color: #ffffff;
      font-weight: 900;
      font-size: 1rem;
      cursor: pointer;
    }
    .stepper span {
      font-weight: 900;
      min-width: 18px;
      text-align: center;
      color: var(--brand-dark);
    }

    /* Barra flotante inferior de Carrito */
    .cart-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 680px;
      background: #0f172a;
      color: #ffffff;
      padding: 14px 20px;
      border-radius: 16px;
      display: none;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.35);
      z-index: 90;
    }
    .cart-bar-btn {
      background: var(--brand);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.92rem;
      cursor: pointer;
    }

    /* Modal Checkout */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 200;
      overflow-y: auto;
    }
    .modal-card {
      background: #ffffff;
      width: 100%;
      max-width: 580px;
      border-radius: 18px;
      padding: 22px;
      max-height: 92vh;
      overflow-y: auto;
      box-shadow: 0 20px 45px rgba(0,0,0,0.25);
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 4px;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 9px;
      border: 1px solid #cbd5e1;
      font-size: 0.92rem;
    }
    .option-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .opt-card {
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      padding: 11px;
      cursor: pointer;
      text-align: left;
      background: #ffffff;
    }
    .opt-card.active {
      border-color: var(--brand);
      background: var(--brand-light);
    }
    .opt-title {
      font-weight: 800;
      font-size: 0.88rem;
      color: #0f172a;
    }
    .opt-sub {
      font-size: 0.76rem;
      color: #475569;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- Barra de Pruebas (Permite alternar entre Nodos o probar qué pasa después de la hora de corte) -->
  <div class="lab-bar">
    <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
      <span>🧪 <strong>Vista Previa Tienda del Vecino:</strong></span>
      <select id="lab-nodo-selector" onchange="cambiarNodoTienda(this.value)"></select>
      <button type="button" id="btn-sim-antes" class="active" onclick="simularHorarioCorte(false)">🕒 Antes del horario de corte</button>
      <button type="button" id="btn-sim-despues" onclick="simularHorarioCorte(true)">⏭️ Después del horario de corte</button>
    </div>
    <div style="display:flex; gap:8px;">
      <a id="link-ir-gestor" href="#">🎛️ Ir al Panel del Gestor</a>
      <a href="/pages/pizarra-simulacion.html?tab=nodos">📊 Volver a la Pizarra</a>
    </div>
  </div>

  <!-- Encabezado Marca Blanca del Nodo -->
  <header class="hero">
    <div class="hero-inner">
      <div class="brand-box">
        <div class="brand-logo" id="brand-logo-box"></div>
        <div>
          <h1 class="brand-title" id="brand-name">Cargando tienda...</h1>
          <p class="brand-sub" id="brand-subtitle"></p>
          <div class="brand-meta">
            <span class="brand-pill" id="brand-zone">📍 Barrio</span>
            <span class="brand-pill" id="brand-manager">👤 Gestor</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Aviso de Próxima Fecha de Entrega según Punto de Corte -->
    <div class="delivery-banner" id="delivery-banner">
      <div>
        <span class="delivery-badge" id="delivery-badge-status">📅 Próxima Entrega</span>
        <div class="delivery-date-main" id="delivery-date-text">Calculando próxima entrega...</div>
        <div class="delivery-note" id="delivery-cutoff-note"></div>
      </div>
      <div style="text-align:right; font-size:0.82rem; color:#334155;" id="delivery-pickup-address"></div>
    </div>

    <!-- Buscador y Filtro de Categorías -->
    <div class="toolbar">
      <input type="text" id="search-box" class="search-input" placeholder="🔍 Buscar almendras, nueces, mixes, granolas, barritas..." oninput="renderCatalogo()" />
      <div class="cats-row" id="cats-row"></div>
    </div>

    <!-- Grilla de Productos Publicados por el Gestor -->
    <div class="products-grid" id="products-grid"></div>
  </main>

  <!-- Barra Flotante del Carrito -->
  <div class="cart-bar" id="cart-bar">
    <div>
      <div style="font-size:0.78rem; color:#94a3b8;" id="cart-count-label">0 productos en tu pedido</div>
      <div style="font-size:1.22rem; font-weight:900;" id="cart-total-label">$0</div>
    </div>
    <button type="button" class="cart-bar-btn" onclick="abrirModalCheckout()">
      Continuar con mi pedido →
    </button>
  </div>

  <!-- Modal de Confirmación de Pedido Vecinal -->
  <div class="modal-backdrop" id="checkout-modal">
    <div class="modal-card" id="checkout-card-content"></div>
  </div>

  <script>
    const STATE = {
      slug: '',
      nodo: null,
      nodosDisponibles: [],
      proximaEntrega: null,
      productos: [],
      categoriaActiva: 'TODAS',
      carrito: {}, // { oferta_id: cantidad }
      modalidadEntrega: 'RETIRO_NODO',
      medioPago: 'TRANSFERENCIA',
      simularDespuesDeCorte: false
    };

    function fmt(n) {
      return '$' + Math.round(Number(n) || 0).toLocaleString('es-AR');
    }

    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function detectarSlugInicial() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('nodo')) return params.get('nodo');
      const parts = window.location.pathname.split('/').filter(Boolean);
      const idx = parts.indexOf('tienda');
      if (idx !== -1 && parts[idx + 1]) return parts[idx + 1];
      return 'almacen-verde-city-bell';
    }

    function calcularFechaSimuladaCorte() {
      if (!STATE.simularDespuesDeCorte || !STATE.proximaEntrega?.asignada) return '';
      // Simular 1 hora después del cierre de la entrega actual para demostrar cómo salta a la siguiente fecha
      const tsCorte = Number(STATE.proximaEntrega.asignada.timestamp_corte || Date.now());
      return new Date(tsCorte + 2 * 3600 * 1000).toISOString();
    }

    async function cargarTienda(fechaSimuladaIso = '') {
      const q = fechaSimuladaIso ? `?fecha_simulada=${encodeURIComponent(fechaSimuladaIso)}` : '';
      const resp = await fetch(`/api/produccion/nodos/portal/${encodeURIComponent(STATE.slug)}${q}`);
      const data = await resp.json();
      if (!data.ok) return;

      STATE.nodo = data.nodo;
      STATE.slug = data.nodo.slug;
      STATE.nodosDisponibles = data.nodos_disponibles || [];
      STATE.proximaEntrega = data.proxima_entrega;
      STATE.productos = data.ofertas_publicadas || [];

      // Aplicar color de marca del Nodo
      const color = STATE.nodo.color_primario || '#16a34a';
      document.documentElement.style.setProperty('--brand', color);
      document.documentElement.style.setProperty('--brand-dark', color);
      document.title = `${STATE.nodo.nombre_marca} — Tienda Vecinal`;

      // Selector superior de pruebas
      const sel = document.getElementById('lab-nodo-selector');
      if (sel) {
        sel.innerHTML = STATE.nodosDisponibles.map(n =>
          `<option value="${esc(n.slug)}" ${n.slug === STATE.slug ? 'selected' : ''}>${esc(n.nombre_marca)}</option>`
        ).join('');
      }
      const linkGestor = document.getElementById('link-ir-gestor');
      if (linkGestor) linkGestor.href = `/gestor/${encodeURIComponent(STATE.slug)}`;

      // Renderizar cabecera
      document.getElementById('brand-name').textContent = STATE.nodo.nombre_marca;
      document.getElementById('brand-subtitle').textContent = STATE.nodo.subtitulo_marca || 'Pedidos comunitarios del barrio';
      document.getElementById('brand-zone').textContent = `📍 ${STATE.nodo.barrio_zona || 'Zona Barrial'}`;
      document.getElementById('brand-manager').textContent = `👤 Coordina: ${STATE.nodo.gestor_nombre}`;

      const logoBox = document.getElementById('brand-logo-box');
      if (STATE.nodo.logo_mono_preview_base64) {
        logoBox.innerHTML = `<img src="${STATE.nodo.logo_mono_preview_base64}" alt="Logo">`;
      } else {
        logoBox.innerHTML = `<strong style="color:#0f172a; font-size:0.85rem;">${esc(STATE.nodo.nombre_marca.substring(0, 3).toUpperCase())}</strong>`;
      }

      renderBannerEntrega();
      renderCategorias();
      renderCatalogo();
      actualizarBarraCarrito();
    }

    function simularHorarioCorte(despues) {
      STATE.simularDespuesDeCorte = Boolean(despues);
      document.getElementById('btn-sim-antes').classList.toggle('active', !despues);
      document.getElementById('btn-sim-despues').classList.toggle('active', despues);

      if (despues && STATE.proximaEntrega?.asignada) {
        const tsAfter = Number(STATE.proximaEntrega.asignada.timestamp_corte) + 2 * 3600 * 1000;
        cargarTienda(new Date(tsAfter).toISOString());
      } else {
        cargarTienda('');
      }
    }

    function cambiarNodoTienda(nuevoSlug) {
      STATE.slug = nuevoSlug;
      STATE.carrito = {};
      STATE.simularDespuesDeCorte = false;
      window.history.replaceState({}, '', `/tienda/${encodeURIComponent(nuevoSlug)}`);
      cargarTienda('');
    }

    function renderBannerEntrega() {
      const banner = document.getElementById('delivery-banner');
      const badge = document.getElementById('delivery-badge-status');
      const mainTxt = document.getElementById('delivery-date-text');
      const noteTxt = document.getElementById('delivery-cutoff-note');
      const addrTxt = document.getElementById('delivery-pickup-address');

      const prox = STATE.proximaEntrega;
      if (!prox || !prox.asignada) return;

      const pasoCorte = Boolean(prox.paso_horario_corte);
      banner.classList.toggle('after-cutoff', pasoCorte);

      badge.textContent = pasoCorte
        ? '⏭️ Horario de corte superado · Asignado a próxima fecha'
        : '🟢 Pedidos Abiertos para esta semana';

      mainTxt.textContent = `Entrega: ${prox.asignada.label_completo}`;
      noteTxt.textContent = prox.mensaje_vecino;

      const envioTxt = STATE.nodo.permitir_envio_barrial
        ? `🛵 Envío a domicilio en el barrio: ${Number(STATE.nodo.cargo_envio_barrial) > 0 ? fmt(STATE.nodo.cargo_envio_barrial) : 'Sin cargo'}`
        : '🏠 Modalidad: Retiro por el Nodo';

      addrTxt.innerHTML = `
        <div><strong>🏠 Punto de retiro:</strong> ${esc(STATE.nodo.direccion_retiro || STATE.nodo.barrio_zona)}</div>
        <div style="margin-top:3px; color:#059669; font-weight:700;">${envioTxt}</div>
      `;
    }

    function renderCategorias() {
      const catsSet = new Set(['TODAS']);
      STATE.productos.forEach(p => {
        if (p.categoria_familiar) catsSet.add(p.categoria_familiar);
      });
      const row = document.getElementById('cats-row');
      row.innerHTML = Array.from(catsSet).map(cat => `
        <button type="button" class="cat-btn ${STATE.categoriaActiva === cat ? 'active' : ''}"
          onclick="STATE.categoriaActiva='${esc(cat)}'; renderCategorias(); renderCatalogo();">
          ${cat === 'TODAS' ? '✨ Todos los productos' : esc(cat)}
        </button>
      `).join('');
    }

    function renderCatalogo() {
      const q = (document.getElementById('search-box')?.value || '').trim().toLowerCase();
      const terms = q.split(/\s+/).filter(Boolean);

      const filtrados = STATE.productos.filter(p => {
        if (STATE.categoriaActiva !== 'TODAS' && p.categoria_familiar !== STATE.categoriaActiva) return false;
        if (terms.length === 0) return true;
        const bolsa = `${p.nombre_publico} ${p.categoria_familiar} ${p.presentacion_etiqueta || ''}`.toLowerCase();
        return terms.every(t => bolsa.includes(t));
      });

      const grid = document.getElementById('products-grid');
      if (filtrados.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:36px; color:#64748b;">No encontramos productos con ese filtro.</div>`;
        return;
      }

      grid.innerHTML = filtrados.map(p => {
        const cant = Number(STATE.carrito[p.oferta_id] || 0);
        return `
          <div class="prod-card">
            <div>
              <div class="prod-cat">${esc(p.categoria_familiar || 'Almacén Natural')}</div>
              <div class="prod-title">${esc(p.nombre_publico)}</div>
              <span class="prod-pres">📦 ${esc(p.presentacion_etiqueta || `${Math.round(p.kilos_unidad * 1000)}g`)}</span>
            </div>
            <div class="prod-footer">
              <div class="prod-price">${fmt(p.precio_venta_vecino)}</div>
              ${cant === 0
                ? `<button type="button" class="btn-add" onclick="modificarCarrito(${p.oferta_id}, 1)">+ Agregar</button>`
                : `<div class="stepper">
                     <button type="button" onclick="modificarCarrito(${p.oferta_id}, -1)">−</button>
                     <span>${cant}</span>
                     <button type="button" onclick="modificarCarrito(${p.oferta_id}, 1)">+</button>
                   </div>`
              }
            </div>
          </div>
        `;
      }).join('');
    }

    function modificarCarrito(ofertaId, delta) {
      const actual = Number(STATE.carrito[ofertaId] || 0);
      const nuevo = Math.max(0, actual + delta);
      if (nuevo === 0) delete STATE.carrito[ofertaId];
      else STATE.carrito[ofertaId] = nuevo;
      renderCatalogo();
      actualizarBarraCarrito();
    }

    function calcularResumenCarrito() {
      let unidades = 0;
      let subtotal = 0;
      const detalle = [];
      for (const p of STATE.productos) {
        const c = Number(STATE.carrito[p.oferta_id] || 0);
        if (c > 0) {
          unidades += c;
          subtotal += c * Number(p.precio_venta_vecino);
          detalle.push({ ...p, cantidad: c, subtotal: c * Number(p.precio_venta_vecino) });
        }
      }
      const costoEnvio = (STATE.modalidadEntrega === 'ENVIO_BARRIAL' && STATE.nodo?.permitir_envio_barrial)
        ? Number(STATE.nodo.cargo_envio_barrial || 0)
        : 0;
      return {
        unidades,
        subtotal,
        costoEnvio,
        total: subtotal + costoEnvio,
        detalle
      };
    }

    function actualizarBarraCarrito() {
      const res = calcularResumenCarrito();
      const bar = document.getElementById('cart-bar');
      if (res.unidades === 0) {
        bar.style.display = 'none';
        return;
      }
      bar.style.display = 'flex';
      document.getElementById('cart-count-label').textContent = `${res.unidades} ${res.unidades === 1 ? 'producto' : 'productos'} en tu canasto`;
      document.getElementById('cart-total-label').textContent = fmt(res.subtotal);
    }

    function abrirModalCheckout() {
      const res = calcularResumenCarrito();
      if (res.unidades === 0) return;

      const modal = document.getElementById('checkout-modal');
      modal.style.display = 'flex';
      renderContenidoModalCheckout();
    }

    function cerrarModalCheckout() {
      document.getElementById('checkout-modal').style.display = 'none';
    }

    function renderContenidoModalCheckout() {
      const res = calcularResumenCarrito();
      const prox = STATE.proximaEntrega?.asignada;
      const box = document.getElementById('checkout-card-content');

      box.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e2e8f0; padding-bottom:10px; margin-bottom:14px;">
          <div>
            <h2 style="margin:0; font-size:1.2rem;">🧺 Confirmar Pedido Vecinal</h2>
            <div style="font-size:0.8rem; color:#15803d; font-weight:700; margin-top:2px;">
              📅 Entrega asignada: ${esc(prox ? prox.label_completo : 'Próxima ventana')}
            </div>
          </div>
          <button type="button" onclick="cerrarModalCheckout()" style="background:none; border:none; font-size:1.5rem; cursor:pointer; color:#64748b;">&times;</button>
        </div>

        <!-- Resumen de ítems -->
        <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:10px 12px; margin-bottom:14px; max-height:160px; overflow-y:auto;">
          ${res.detalle.map(it => `
            <div style="display:flex; justify-content:space-between; font-size:0.86rem; padding:4px 0; border-bottom:1px dashed #e2e8f0;">
              <span><strong>${it.cantidad}x</strong> ${esc(it.nombre_publico)}</span>
              <strong>${fmt(it.subtotal)}</strong>
            </div>
          `).join('')}
        </div>

        <!-- Elección de Retiro o Envío Barrial -->
        <label style="display:block; font-size:0.8rem; font-weight:800; color:#334155; margin-bottom:6px;">1. ¿Cómo preferís recibir tu pedido?</label>
        <div class="option-grid">
          <div class="opt-card ${STATE.modalidadEntrega === 'RETIRO_NODO' ? 'active' : ''}"
               onclick="STATE.modalidadEntrega='RETIRO_NODO'; renderContenidoModalCheckout();">
            <div class="opt-title">🏠 Retiro por el Nodo (Gratis)</div>
            <div class="opt-sub">${esc(STATE.nodo.direccion_retiro || STATE.nodo.barrio_zona)}</div>
          </div>
          ${STATE.nodo.permitir_envio_barrial ? `
            <div class="opt-card ${STATE.modalidadEntrega === 'ENVIO_BARRIAL' ? 'active' : ''}"
                 onclick="STATE.modalidadEntrega='ENVIO_BARRIAL'; renderContenidoModalCheckout();">
              <div class="opt-title">🛵 Envío a Domicilio (+${fmt(STATE.nodo.cargo_envio_barrial)})</div>
              <div class="opt-sub">Reparto barrial en ${esc(STATE.nodo.barrio_zona || 'la zona')}</div>
            </div>
          ` : ''}
        </div>

        <!-- Datos del vecino -->
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
          <div class="form-group">
            <label>Tu Nombre y Apellido *</label>
            <input type="text" id="chk-nombre" placeholder="Ej: María Laura Gómez" value="${esc(window._savedVecinoNombre || '')}" oninput="window._savedVecinoNombre=this.value">
          </div>
          <div class="form-group">
            <label>Tu WhatsApp *</label>
            <input type="text" id="chk-telefono" placeholder="Ej: 221 554 8910" value="${esc(window._savedVecinoTel || '')}" oninput="window._savedVecinoTel=this.value">
          </div>
        </div>

        ${STATE.modalidadEntrega === 'ENVIO_BARRIAL' ? `
          <div style="display:grid; grid-template-columns: 1.2fr 0.8fr; gap:10px;">
            <div class="form-group">
              <label>Dirección de entrega en el barrio *</label>
              <input type="text" id="chk-direccion" placeholder="Calle y número (ej: Calle 473 bis N° 1120)" value="${esc(window._savedVecinoDir || '')}" oninput="window._savedVecinoDir=this.value">
            </div>
            <div class="form-group">
              <label>Entrecalles / Referencia</label>
              <input type="text" id="chk-entrecalles" placeholder="Ej: entre 14b y 15, portón verde" value="${esc(window._savedVecinoRef || '')}" oninput="window._savedVecinoRef=this.value">
            </div>
          </div>
        ` : ''}

        <!-- Elección de Medio de Pago -->
        <label style="display:block; font-size:0.8rem; font-weight:800; color:#334155; margin-bottom:6px;">2. ¿Cómo preferís abonar?</label>
        <div class="option-grid">
          <div class="opt-card ${STATE.medioPago === 'TRANSFERENCIA' ? 'active' : ''}"
               onclick="STATE.medioPago='TRANSFERENCIA'; renderContenidoModalCheckout();">
            <div class="opt-title">🏦 Transferencia Bancaria</div>
            <div class="opt-sub">Alias: <strong>${esc(STATE.nodo.alias_bancario_display || 'ALMACEN.NODO')}</strong></div>
          </div>
          <div class="opt-card ${STATE.medioPago === 'EFECTIVO' ? 'active' : ''}"
               onclick="STATE.medioPago='EFECTIVO'; renderContenidoModalCheckout();">
            <div class="opt-title">💵 Efectivo al recibir / retirar</div>
            <div class="opt-sub">Abonás en mano al momento de la entrega</div>
          </div>
        </div>

        <!-- Totalizador -->
        <div style="background:#0f172a; color:#ffffff; border-radius:12px; padding:12px 16px; margin-bottom:14px;">
          <div style="display:flex; justify-content:space-between; font-size:0.84rem; color:#cbd5e1;">
            <span>Subtotal productos (${res.unidades} u.)</span>
            <span>${fmt(res.subtotal)}</span>
          </div>
          ${res.costoEnvio > 0 ? `
            <div style="display:flex; justify-content:space-between; font-size:0.84rem; color:#6ee7b7; margin-top:4px;">
              <span>Envío a domicilio barrial</span>
              <span>+${fmt(res.costoEnvio)}</span>
            </div>
          ` : ''}
          <div style="display:flex; justify-content:space-between; font-size:1.2rem; font-weight:900; margin-top:8px; padding-top:8px; border-top:1px solid #334155;">
            <span>Total a abonar</span>
            <span style="color:#4ade80;">${fmt(res.total)}</span>
          </div>
        </div>

        <button type="button" onclick="enviarPedidoVecinal()"
          style="width:100%; padding:13px; border-radius:12px; border:none; background:var(--brand); color:#ffffff; font-weight:900; font-size:1rem; cursor:pointer;">
          ✅ Confirmar mi Pedido
        </button>
      `;
    }

    async function enviarPedidoVecinal() {
      const res = calcularResumenCarrito();
      const nombre = (document.getElementById('chk-nombre')?.value || '').trim();
      const telefono = (document.getElementById('chk-telefono')?.value || '').trim();
      const direccion = (document.getElementById('chk-direccion')?.value || '').trim();
      const entrecalles = (document.getElementById('chk-entrecalles')?.value || '').trim();

      if (!nombre || !telefono) {
        alert('Por favor completá tu nombre y tu número de WhatsApp.');
        return;
      }
      if (STATE.modalidadEntrega === 'ENVIO_BARRIAL' && !direccion) {
        alert('Por favor ingresá tu dirección para el envío barrial.');
        return;
      }

      const payload = {
        vecino_nombre: nombre,
        vecino_telefono: telefono,
        modalidad_entrega: STATE.modalidadEntrega,
        direccion_entrega: direccion,
        entrecalles_referencia: entrecalles,
        medio_pago: STATE.medioPago,
        fecha_hora_simulada: calcularFechaSimuladaCorte(),
        items: res.detalle.map(d => ({
          oferta_id: d.oferta_id,
          cantidad: d.cantidad
        }))
      };

      const resp = await fetch(`/api/produccion/nodos/tienda/${encodeURIComponent(STATE.slug)}/pedido`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await resp.json();
      if (!resp.ok || !data.ok) {
        alert(data.error || 'No se pudo registrar el pedido.');
        return;
      }

      STATE.carrito = {};
      renderCatalogo();
      actualizarBarraCarrito();

      const ped = data.pedido;
      const pagoInfo = data.nodo_pago_info;
      const box = document.getElementById('checkout-card-content');

      box.innerHTML = `
        <div style="text-align:center; padding:10px 4px;">
          <div style="font-size:2.6rem;">🎉</div>
          <h2 style="margin:6px 0; color:#15803d;">¡Pedido Confirmado! (${esc(ped.codigo_pedido)})</h2>
          <p style="margin:4px 0 14px 0; color:#475569; font-size:0.9rem;">
            Gracias <strong>${esc(ped.vecino_nombre)}</strong>. Tu pedido en <strong>${esc(pagoInfo.nombre_marca)}</strong> ya quedó agendado.
          </p>

          <div style="background:#f0fdf4; border:1px solid #86efac; border-radius:12px; padding:12px; text-align:left; font-size:0.86rem; margin-bottom:14px;">
            <div>📅 <strong>Fecha y ventana de entrega:</strong> ${esc(ped.fecha_entrega_label)}</div>
            <div style="margin-top:4px;">📍 <strong>Modalidad:</strong> ${ped.modalidad_entrega === 'ENVIO_BARRIAL' ? `Envío a domicilio (${esc(ped.direccion_entrega)})` : `Retiro en Nodo (${esc(pagoInfo.direccion_retiro)})`}</div>
            <div style="margin-top:4px;">💰 <strong>Total del pedido:</strong> ${fmt(ped.total_vecino)}</div>
          </div>

          ${ped.medio_pago === 'TRANSFERENCIA' ? `
            <div style="background:#eff6ff; border:2px solid #60a5fa; border-radius:12px; padding:14px; text-align:left; margin-bottom:14px;">
              <div style="font-size:0.78rem; font-weight:800; color:#1d4ed8; text-transform:uppercase;">🏦 Datos para Transferencia Bancaria</div>
              <div style="font-size:1.15rem; font-weight:900; color:#0f172a; margin:6px 0;">
                Alias: <span id="alias-copy-text">${esc(pagoInfo.alias || 'ALMACEN.NODO')}</span>
              </div>
              <div style="font-size:0.8rem; color:#334155;">Titular: ${esc(pagoInfo.titular || '')} · CBU: ${esc(pagoInfo.cbu || '')}</div>
              <button type="button" onclick="navigator.clipboard.writeText('${esc(pagoInfo.alias || '')}'); this.textContent='✅ ¡Alias Copiado!';"
                style="margin-top:8px; padding:7px 14px; border-radius:8px; border:1px solid #2563eb; background:#2563eb; color:#fff; font-weight:700; font-size:0.8rem; cursor:pointer;">
                📋 Copiar Alias Bancario
              </button>
            </div>
          ` : `
            <div style="background:#fef3c7; border:1px solid #fcd34d; border-radius:12px; padding:12px; text-align:left; font-size:0.85rem; color:#92400e; margin-bottom:14px;">
              💵 <strong>Pago en Efectivo:</strong> Abonás <strong>${fmt(ped.total_vecino)}</strong> directamente al momento de recibir o retirar tu pedido.
            </div>
          `}

          <div id="etiqueta-confirmacion-preview" style="margin-bottom:12px;"></div>

          <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
            <button type="button" onclick="verEtiquetaDeMiPedido(${ped.id})"
              style="padding:9px 14px; border-radius:9px; border:1px solid #334155; background:#0f172a; color:#f8fafc; font-weight:700; font-size:0.8rem; cursor:pointer;">
              🖨️ Ver Etiqueta Térmica Generada (Modo Prueba)
            </button>
            <button type="button" onclick="cerrarModalCheckout()"
              style="padding:9px 18px; border-radius:9px; border:none; background:var(--brand); color:#ffffff; font-weight:800; font-size:0.85rem; cursor:pointer;">
              Listo, volver a la tienda
            </button>
          </div>
        </div>
      `;
    }

    async function verEtiquetaDeMiPedido(pedidoId) {
      const box = document.getElementById('etiqueta-confirmacion-preview');
      if (!box) return;
      box.innerHTML = `<div style="font-size:0.8rem; color:#64748b;">Generando etiqueta térmica del pedido...</div>`;
      const resp = await fetch(`/api/produccion/nodos/pedidos/${pedidoId}/etiqueta`);
      const data = await resp.json();
      if (data.ok && data.preview_rollo_base64) {
        box.innerHTML = `
          <div style="background:#0f172a; padding:10px; border-radius:10px; margin-top:8px;">
            <div style="color:#cbd5e1; font-size:0.75rem; margin-bottom:6px;">Etiqueta Térmica Marca Blanca emitida para preparación:</div>
            <img src="${data.preview_rollo_base64}" style="max-width:100%; border-radius:6px;" alt="Etiqueta Zebra">
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      STATE.slug = detectarSlugInicial();
      cargarTienda('');
    });
  </script>
</body>
</html>
