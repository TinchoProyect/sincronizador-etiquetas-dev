    function abrirReciboDigitalPedido(codigoPedido) {
      const data = STATE.miCuentaData;
      if (!data) return;
      const ped = (data.historial_pedidos || []).find(p => p.codigo_pedido === codigoPedido);
      if (!ped || !ped.comprobante_digital) return;

      detenerPollingSeguimiento();
      _trackingTokenActivo = '';
      const modal = document.getElementById('tracking-modal');
      const box = document.getElementById('tracking-card-content');
      if (!modal || !box) return;
      modal.style.display = 'flex';

      const nodo = data.nodo || {};
      const vec = data.vecino || {};
      const rec = ped.comprobante_digital;
      const fechaPagoTxt = rec.fecha_pago
        ? new Date(rec.fecha_pago).toLocaleString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false })
        : '';

      box.innerHTML = `
        <div style="border:2px solid #86efac; border-radius:16px; padding:18px; background:linear-gradient(180deg, #f0fdf4 0%, #ffffff 38%);">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; border-bottom:1px dashed #cbd5e1; padding-bottom:12px; margin-bottom:12px;">
            <div style="display:flex; align-items:center; gap:10px;">
              ${obtenerLogoIconoNodo(nodo)
                ? `<img src="${obtenerLogoIconoNodo(nodo)}" alt="${esc(nodo.nombre_marca)}" style="width:44px; height:44px; object-fit:contain; border-radius:10px;">`
                : `<div class="brand-monogram" style="width:42px; height:42px;">${esc(String(nodo.nombre_marca || 'ND').slice(0, 2).toUpperCase())}</div>`
              }
              <div>
                <div style="font-size:0.72rem; font-weight:900; color:#15803d; text-transform:uppercase; letter-spacing:0.04em;">
                  ✅ Comprobante Digital de Pago
                </div>
                <div style="font-size:1.12rem; font-weight:900; color:#0f172a;">${esc(nodo.nombre_marca)}</div>
                <div style="font-size:0.76rem; color:#64748b; font-weight:700;">Recibo N° ${esc(rec.numero_recibo)}</div>
              </div>
            </div>
            <button type="button" onclick="cerrarModalSeguimiento()" style="background:none; border:none; font-size:1.5rem; cursor:pointer; color:#64748b;">&times;</button>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:0.82rem; margin-bottom:12px;">
            <div>
              <div style="color:#64748b; font-weight:700; font-size:0.74rem;">Cliente</div>
              <div style="font-weight:900; color:#0f172a;">${esc(vec.nombre_completo)}</div>
            </div>
            <div>
              <div style="color:#64748b; font-weight:700; font-size:0.74rem;">Fecha de acreditación</div>
              <div style="font-weight:800; color:#0f172a;">${esc(fechaPagoTxt || 'Confirmado')}</div>
            </div>
            <div>
              <div style="color:#64748b; font-weight:700; font-size:0.74rem;">Pedido abonado</div>
              <div style="font-weight:900; color:#0f172a;">#${esc(ped.codigo_pedido)}</div>
            </div>
            <div>
              <div style="color:#64748b; font-weight:700; font-size:0.74rem;">Medio de pago</div>
              <div style="font-weight:800; color:#0f172a;">${esc(rec.medio_pago_label)}</div>
            </div>
          </div>

          <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:11px 13px; margin-bottom:12px;">
            <div style="font-size:0.73rem; font-weight:800; color:#64748b; text-transform:uppercase; margin-bottom:6px;">Detalle de compra</div>
            ${(ped.items || []).map(it => `
              <div style="display:flex; justify-content:space-between; gap:8px; font-size:0.83rem; padding:3px 0;">
                <span><strong>${Number(it.cantidad)}x</strong> ${esc(formatearNombreItemConPresentacion(it))}</span>
                <strong style="white-space:nowrap;">${fmt(it.subtotal_vecino)}</strong>
              </div>
            `).join('')}
            ${Number(ped.cargo_envio_barrial) > 0 ? `
              <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:#64748b; padding:3px 0;">
                <span>Envío barrial</span>
                <span>+${fmt(ped.cargo_envio_barrial)}</span>
              </div>
            ` : ''}
            <div style="display:flex; justify-content:space-between; margin-top:8px; padding-top:8px; border-top:1px solid #cbd5e1; font-size:1.05rem; font-weight:900; color:#15803d;">
              <span>Total Abonado</span>
              <span>${fmt(rec.monto_abonado)}</span>
            </div>
          </div>

          <div style="display:flex; gap:8px;">
            <button type="button" onclick="window.print()"
              style="flex:1; padding:10px; border-radius:10px; border:1px solid #cbd5e1; background:#ffffff; color:#0f172a; font-family:inherit; font-weight:800; font-size:0.84rem; cursor:pointer;">
              🖨️ Imprimir / Guardar PDF
            </button>
            <button type="button" onclick="cerrarModalSeguimiento()"
              style="flex:1; padding:10px; border-radius:10px; border:none; background:#16a34a; color:#ffffff; font-family:inherit; font-weight:900; font-size:0.86rem; cursor:pointer;">
              Listo
            </button>
          </div>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      STATE.slug = detectarSlugInicial();
      aplicarParametroModoAdminInicial();
      const params = new URLSearchParams(window.location.search);
      const tokInicial = detectarTokenSeguimientoEnUrl();
      const ofertaInicial = Number(params.get('oferta') || 0);
      const skuInicial = (params.get('sku') || '').trim();
      if (Number.isInteger(ofertaInicial) && ofertaInicial > 0) {
        STATE.ofertaEnfocadaId = ofertaInicial;
      }
      if (skuInicial) {
        STATE.skuEnfocado = skuInicial;
      }
      const idGuardada = obtenerIdentidadVecinoLocal(STATE.slug);
      if (idGuardada.nombre_completo) window._savedVecinoNombre = idGuardada.nombre_completo;
      if (idGuardada.telefono_display || idGuardada.telefono_normalizado) {
        window._savedVecinoTel = idGuardada.telefono_display || idGuardada.telefono_normalizado;
      }
      if (idGuardada.direccion_calle) window._savedVecinoDir = idGuardada.direccion_calle;
      if (idGuardada.entrecalles_referencia) window._savedVecinoRef = idGuardada.entrecalles_referencia;

      const detCuenta = detectarPortalTokenEnUrl();
      if (detCuenta.token) {
        STATE.portalToken = detCuenta.token;
        guardarIdentidadVecinoLocal({ portal_token: detCuenta.token }, STATE.slug);
      } else if (idGuardada.portal_token) {
        STATE.portalToken = idGuardada.portal_token;
      }

      await cargarTienda('');

      if (STATE.portalToken && detCuenta.abrirDirecto) {
        await activarVistaMiCuenta();
      } else if (STATE.portalToken) {
        cargarPortalMiCuenta(true);
      }

      if (tokInicial) {
        abrirSeguimientoPorToken(tokInicial);
      }
    });
  </script>
</body>
</html>
