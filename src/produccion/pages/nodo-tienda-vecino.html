    function retrocederPasoCheckoutWizard() {
      if (STATE.checkoutWiz.enviandoPedido) return;
      sincronizarInputsPasoVisibleCheckout();
      const pasos = obtenerPasosCheckoutWizard();
      const idx = pasos.indexOf(STATE.checkoutWiz.pasoActualKey);
      if (idx <= 0) {
        cerrarModalCheckout();
        return;
      }
      STATE.checkoutWiz.pasoActualKey = pasos[idx - 1];
      renderContenidoModalCheckout();
    }

    function avanzarPasoCheckoutWizard() {
      if (STATE.checkoutWiz.enviandoPedido) return;
      sincronizarInputsPasoVisibleCheckout();
      const actual = STATE.checkoutWiz.pasoActualKey;
      if (!validarPasoCheckoutWizard(actual)) return;
      const pasos = obtenerPasosCheckoutWizard();
      const idx = pasos.indexOf(actual);
      if (idx >= 0 && idx < pasos.length - 1) {
        const siguiente = pasos[idx + 1];
        STATE.checkoutWiz.pasoActualKey = siguiente;
        enviarTelemetriaTienda('checkout_paso', {
          detalle: `${actual} → ${siguiente}`,
          ...construirSnapshotCarritoTelemetria()
        }, 300);
        renderContenidoModalCheckout();
      }

      STATE.checkoutWiz.direccion = val;

      if (window._savedVecinoLat != null && _normalizarDirCheckPin(val) !== _normalizarDirCheckPin(window._savedVecinoDirPinBase || '')) {

        window._savedVecinoLng = null;

    function actualizarEstadoGpsCheckoutUI() {
      const statusEl = document.getElementById('chk-gps-status-txt');
      const quitBtn = document.getElementById('chk-btn-quitar-pin');
      const tiene = Number.isFinite(Number(window._savedVecinoLat)) && Number.isFinite(Number(window._savedVecinoLng)) && Number(window._savedVecinoLat) !== 0;
      if (statusEl) {
        if (tiene) {
          statusEl.style.color = '#15803d';
          statusEl.textContent = `✅ Ubicación lista (${Number(window._savedVecinoLat).toFixed(5)}, ${Number(window._savedVecinoLng).toFixed(5)}) — podés mover el pin si hace falta.`;
        } else {
          statusEl.style.color = 'var(--muted)';
          statusEl.textContent = 'Si no compartís GPS no hay problema: repartimos con tu calle y entrecalles.';
        }
      }
      if (quitBtn) {
        quitBtn.style.display = tiene ? 'inline-flex' : 'none';
      }
    }

    function limpiarUbicacionCheckoutVecino() {
      window._savedVecinoLat = null;
      window._savedVecinoLng = null;
      window._savedVecinoGpsOrigen = null;
      window._savedVecinoDirPinBase = '';
      actualizarEstadoGpsCheckoutUI();
      if (window._chkLeafletMarker && window._chkLeafletMap) {
        const cLat = Number(STATE.nodo?.zona_centro_lat) || -34.92145;
        const cLng = Number(STATE.nodo?.zona_centro_lng) || -57.95453;
        window._chkLeafletMarker.setLatLng([cLat, cLng]);
        window._chkLeafletMap.setView([cLat, cLng], 14);
      }
    }

    async function inicializarMapaCheckoutVecino() {
      const canvas = document.getElementById('chk-leaflet-map');
      if (!canvas) return;
      if (!window.L) {
        canvas.innerHTML = '<div style="padding:14px; font-size:0.8rem; color:#92400e; text-align:center;">No se pudo cargar el mapa ahora. Podés confirmar tu pedido normalmente con tu dirección escrita.</div>';
        return;
      }

      destruirMapaCheckoutVecino();
      const tieneSaved = Number.isFinite(Number(window._savedVecinoLat)) && Number.isFinite(Number(window._savedVecinoLng)) && Number(window._savedVecinoLat) !== 0;
      const centerLat = tieneSaved ? Number(window._savedVecinoLat) : (Number(STATE.nodo?.zona_centro_lat) || -34.92145);
      const centerLng = tieneSaved ? Number(window._savedVecinoLng) : (Number(STATE.nodo?.zona_centro_lng) || -57.95453);

      const mapa = window.L.map(canvas, { zoomControl: true }).setView([centerLat, centerLng], tieneSaved ? 16 : 14);
      window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 19
      }).addTo(mapa);

      const marker = window.L.marker([centerLat, centerLng], { draggable: true }).addTo(mapa);
      const fijarDesdeMapa = (lat, lng) => {
        window._savedVecinoLat = Number(Number(lat).toFixed(7));
        window._savedVecinoLng = Number(Number(lng).toFixed(7));
        window._savedVecinoGpsOrigen = 'VECINO_PIN_MAPA';
        window._savedVecinoDirPinBase = document.getElementById('chk-direccion')?.value || STATE.checkoutWiz.direccion || window._savedVecinoDir || '';
        marker.setLatLng([window._savedVecinoLat, window._savedVecinoLng]);
        actualizarEstadoGpsCheckoutUI();
      };

      marker.on('dragend', () => {
        const pos = marker.getLatLng();
        if (pos) fijarDesdeMapa(pos.lat, pos.lng);
      });
      mapa.on('click', (ev) => {
        if (ev?.latlng) fijarDesdeMapa(ev.latlng.lat, ev.latlng.lng);
      });

      window._chkLeafletMap = mapa;
      window._chkLeafletMarker = marker;
      setTimeout(() => { try { mapa.invalidateSize(); } catch (_) {} }, 160);
    }

    function toggleMapaPinCheckoutVecino() {
      STATE.mostrarMapaCheckoutVecino = !STATE.mostrarMapaCheckoutVecino;
      const wrap = document.getElementById('chk-mapa-wrapper');
      const btn = document.getElementById('chk-btn-toggle-mapa');
      if (wrap) wrap.style.display = STATE.mostrarMapaCheckoutVecino ? 'block' : 'none';
      if (btn) btn.textContent = STATE.mostrarMapaCheckoutVecino ? '🗺️ Ocultar mapa' : '🗺️ Marcar pin en mapa';
      if (STATE.mostrarMapaCheckoutVecino) {
        inicializarMapaCheckoutVecino();
      }
    }

    function capturarUbicacionActualCheckoutVecino() {
      const btn = document.getElementById('chk-btn-gps-actual');
      const statusEl = document.getElementById('chk-gps-status-txt');
      if (!navigator.geolocation) {
        if (statusEl) {
          statusEl.style.color = '#b45309';
          statusEl.textContent = 'Tu dispositivo no permite GPS automático desde el navegador. Podés confirmar igual con tu dirección.';
        }
        return;
      }
      if (btn) {
        btn.disabled = true;
        btn.textContent = '📡 Buscando GPS...';
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          if (btn) {
            btn.disabled = false;
            btn.textContent = '📍 Usar mi ubicación actual';
          }
          window._savedVecinoLat = Number(pos.coords.latitude.toFixed(7));
          window._savedVecinoLng = Number(pos.coords.longitude.toFixed(7));
          window._savedVecinoGpsOrigen = 'VECINO_GPS';
          window._savedVecinoDirPinBase = document.getElementById('chk-direccion')?.value || STATE.checkoutWiz.direccion || window._savedVecinoDir || '';
          STATE.mostrarMapaCheckoutVecino = true;
          const wrap = document.getElementById('chk-mapa-wrapper');
          const toggleBtn = document.getElementById('chk-btn-toggle-mapa');
          if (wrap) wrap.style.display = 'block';
          if (toggleBtn) toggleBtn.textContent = '🗺️ Ocultar mapa';
          actualizarEstadoGpsCheckoutUI();
          inicializarMapaCheckoutVecino();
        },
        () => {
          if (btn) {
            btn.disabled = false;
            btn.textContent = '📍 Usar mi ubicación actual';
          }
          if (statusEl) {
            statusEl.style.color = '#b45309';
            statusEl.textContent = 'No pudimos obtener tu ubicación automática (es 100% opcional: podés confirmar igual con tu calle escrita).';
          }
        },
        { enableHighAccuracy: true, timeout: 9000, maximumAge: 60000 }
      );
    }

    async function enviarPedidoVecinal() {
      if (STATE.checkoutWiz.enviandoPedido) return;
      sincronizarInputsPasoVisibleCheckout();

      const w = STATE.checkoutWiz;
      const esPostal = esModalidadPostalActivaWizard();
      STATE.modalidadEntrega = w.modalidadElegida || STATE.modalidadEntrega;
      STATE.medioPago = w.medioPagoElegido || STATE.medioPago;
      const res = calcularResumenCarrito();
      const nombre = String(w.nombre || '').trim();
      const telefono = String(w.telefono || '').trim();
      const direccion = String(w.direccion || '').trim();
      const entrecalles = String(w.entrecalles || '').trim();

      if (esPostal) {
        if (!validarPasoCheckoutWizard('cp_modalidad')) {

        if (!validarPasoCheckoutWizard('destino_postal')) {
          w.pasoActualKey = 'destino_postal';
          renderContenidoModalCheckout();
          return;
        }
        if (!validarPasoCheckoutWizard('destinatario_postal')) {
          w.pasoActualKey = 'destinatario_postal';
          renderContenidoModalCheckout();
          return;

      w.enviandoPedido = true;
      const btnConf = document.getElementById('chk-btn-confirmar-pedido');
      if (btnConf) {

      const dirCoincidePin = Number.isFinite(Number(window._savedVecinoLat)) &&

      const payload = {

        gps_origen: (!esPostal && STATE.modalidadEntrega === 'ENVIO_BARRIAL' && dirCoincidePin) ? (window._savedVecinoGpsOrigen || 'VECINO_GPS') : null,
        medio_pago: STATE.medioPago,
        fecha_hora_simulada: calcularFechaSimuladaCorte(),
        postal: esPostal ? {
          operador_postal: w.operadorPostal,
          modalidad_postal: STATE.modalidadEntrega === 'PAQUETERIA_SUCURSAL' ? 'SUCURSAL' : 'DOMICILIO',
          cp_destino: String(w.cpPostal || '').replace(/\D+/g, ''),

        items: res.detalle.map(d => ({
          oferta_id: d.oferta_id,

      try {
        const resp = await fetch(`/api/produccion/nodos/tienda/${encodeURIComponent(STATE.slug)}/pedido`, {
          method: 'POST',

          guardarIdentidadVecinoLocal({

            direccion_calle: esPostal ? (ped.direccion_entrega || '') : (direccion || ''),

            cp_postal: esPostal ? w.cpPostal : undefined,
            operador_postal: esPostal ? w.operadorPostal : undefined,
            provincia_codigo: esPostal ? w.provinciaCodigo : undefined,

            calle_postal: esPostal ? w.callePostal : undefined,
            altura_postal: esPostal ? w.alturaPostal : undefined,
            sin_numero_postal: esPostal ? Boolean(w.sinNumeroPostal) : undefined,
            piso_depto_postal: esPostal ? w.pisoDeptoPostal : undefined,
            referencias_postal: esPostal ? w.referenciasPostal : undefined,
            sucursal_postal: esPostal ? w.sucursalPostal : undefined,
            dni_cuil: esPostal ? w.dniPostal : undefined,
            email_contacto: esPostal ? w.emailPostal : undefined
          });
          if (ped.tracking_token) {
            guardarPedidoRecienteLocal({
              codigo_pedido: ped.codigo_pedido,
              tracking_token: ped.tracking_token,
              vecino_nombre: ped.vecino_nombre,
              created_at: ped.created_at || new Date().toISOString()

            refrescarBannerPedidosRecientes();

          enviarTelemetriaTienda('pedido_confirmado', {

        const box = document.getElementById('checkout-card-content');
        box.innerHTML = `

            <div class="chk-wiz-stage" style="text-align:center;">
              <div style="font-size:2.6rem;">🎉</div>
              <h2 style="margin:6px 0; color:#15803d; font-size:1.35rem; font-weight:900;">¡Pedido Confirmado! (${esc(ped.codigo_pedido)})</h2>
              <p style="margin:4px 0 16px 0; color:#475569; font-size:0.93rem; font-weight:700;">
                Gracias <strong>${esc(ped.vecino_nombre)}</strong>. Tu compra en <strong>${esc(pagoInfo.nombre_marca)}</strong> ya quedó registrada.

              <div style="background:#f0fdf4; border:1px solid #86efac; border-radius:14px; padding:14px; text-align:left; font-size:0.88rem; margin-bottom:14px;">
                <div>${esPedPostal ? '🚚 <strong>Despacho estimado:</strong>' : '📅 <strong>Fecha y ventana de entrega:</strong>'} ${esc(ped.fecha_entrega_label)}</div>
                <div style="margin-top:4px;">📍 <strong>Destino:</strong> ${esc(modalidadConfirmadaTxt)}</div>
                ${itemsConfirmados.length > 0 ? `
                  <div style="margin-top:8px; padding-top:8px; border-top:1px dashed #86efac;">
                    <div style="font-size:0.75rem; font-weight:800; color:#166534; text-transform:uppercase; margin-bottom:4px;">🛒 Detalle de productos</div>
                    ${itemsConfirmados.map(it => `
                      <div style="display:flex; justify-content:space-between; gap:8px; font-size:0.84rem; padding:2px 0;">
                        <span><strong>${Number(it.cantidad || 1)}x</strong> ${esc(formatearNombreItemConPresentacion(it))}</span>
                        <strong style="white-space:nowrap;">${fmt(it.subtotal_vecino ?? it.subtotal ?? 0)}</strong>
                      </div>
                    `).join('')}
                  </div>
                ` : ''}
                ${Number(ped.cargo_envio_barrial || 0) > 0 ? `
                  <div style="margin-top:5px; font-size:0.83rem; color:#166534;">🚚 <strong>Envío:</strong> +${fmt(ped.cargo_envio_barrial)}</div>
                ` : (esPedPostal ? `<div style="margin-top:5px; font-size:0.83rem; color:#15803d; font-weight:800;">🎁 <strong>Envío nacional bonificado ($0)</strong></div>` : '')}
                <div style="margin-top:6px; padding-top:6px; border-top:1px solid #86efac;">💰 <strong>Total a abonar:</strong> ${fmt(ped.total_vecino)}</div>

              ${ped.medio_pago === 'TRANSFERENCIA' ? `

              ` : `

    let _ultimoPayloadWaTienda = null;

    function copiarMensajeComprobanteTienda() {
      if (!_ultimoPayloadWaTienda?.mensaje) return;
      navigator.clipboard?.writeText(_ultimoPayloadWaTienda.mensaje).catch(() => {});
    }

    async function enviarComprobanteWhatsAppPrueba(codigoPedido, vecinoNombre, nombreMarca, fechaEntrega, totalVecino, medioPago, aliasBancario, trackingToken = '') {
      const linkSeguimiento = trackingToken
        ? `${window.location.origin}/tienda/${encodeURIComponent(STATE.slug)}?seguimiento=${encodeURIComponent(trackingToken)}`
        : '';
      const itemsPedido = (STATE.ultimoPedidoConfirmado && STATE.ultimoPedidoConfirmado.codigo_pedido === codigoPedido)
        ? (STATE.ultimoPedidoConfirmado.items || [])
        : [];
      const lineasItems = itemsPedido.map(it =>
        `  • ${Number(it.cantidad || 1)}x ${formatearNombreItemConPresentacion(it)} (${fmt(it.subtotal_vecino ?? it.subtotal ?? 0)})`
      );
      const esEcWa = esPerfilEcommerceTienda(STATE.nodo);
      const lineasMsg = [
        `🌿 *${nombreMarca}* — Nuevo Pedido #${codigoPedido}`,
        `👤 ${esEcWa ? 'Cliente' : 'Vecino/a'}: *${vecinoNombre}*`,
        `${esEcWa ? '🚚 Despacho' : '📅 Entrega'}: ${fechaEntrega}`
      ];
      if (lineasItems.length > 0) {
        lineasMsg.push('🛒 *Detalle:*');
        lineasMsg.push(...lineasItems);
      }
      lineasMsg.push(
        `💰 Total: *${fmt(totalVecino)}* (${medioPago === 'EFECTIVO' ? 'Efectivo al recibir' : `Transferencia al alias ${aliasBancario}`})`
      );
      if (linkSeguimiento) {
        lineasMsg.push(`📍 Seguí tu pedido en vivo acá: ${linkSeguimiento}`);
      }
      const mensaje = lineasMsg.join('\n');
      const box = document.getElementById('etiqueta-confirmacion-preview');

      const mostrarOpcionesWaDirecto = () => {
        _ultimoPayloadWaTienda = { destinatario_nombre: nombreMarca, telefono_original: '', mensaje };
        const telGestorWa = obtenerWhatsappPublicoEfectivoTienda(STATE.nodo);
        const waShareUrl = `https://wa.me/${telGestorWa}?text=${encodeURIComponent(mensaje)}`;
        if (box) {
          box.innerHTML = `
            <div style="background:#f8fafc; border:1px solid #cbd5e1; border-radius:10px; padding:12px; text-align:left; font-size:0.8rem; color:#0f172a; margin-top:8px;">
              <div style="padding:8px 10px; background:#f0fdf4; border:1px solid #86efac; border-radius:8px; color:#166534; margin-bottom:8px;">
                📋 <strong>Comprobante listo para guardar o compartir por WhatsApp</strong>
              </div>
              <pre style="white-space:pre-wrap; margin:0 0 10px 0; padding:8px; background:#ffffff; border:1px solid #e2e8f0; border-radius:6px; font-family:inherit; font-size:0.75rem; color:#0f172a;">${esc(mensaje)}</pre>
              <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <a href="${esc(waShareUrl)}" target="_blank" rel="noopener"
                  style="flex:1; text-align:center; padding:10px; border-radius:8px; background:#16a34a; color:#ffffff; font-weight:900; font-size:0.84rem; text-decoration:none;">
                  💬 Enviar / Guardar por WhatsApp
                </a>
                <button type="button" onclick="copiarMensajeComprobanteTienda(); this.textContent='✓ Copiado';"
                  style="padding:10px 14px; border-radius:8px; border:1px solid #cbd5e1; background:#ffffff; color:#0f172a; font-weight:800; font-size:0.82rem; cursor:pointer;">
                  📋 Copiar
                </button>
              </div>
            </div>
          `;
        }
      };

      const esEntornoLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      if (!esEntornoLocal) {
        mostrarOpcionesWaDirecto();
        return;
      }

      const resp = await fetch('/api/produccion/nodos/whatsapp-prueba', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          destinatario_nombre: nombreMarca,
          telefono_original: '5492216615746',
          mensaje,
          solo_preview: true
        })
      });
      if (resp.status === 403) {
        mostrarOpcionesWaDirecto();
        return;
      }
      const data = await resp.json();
      if (!resp.ok || !data.ok) {
        mostrarOpcionesWaDirecto();
        return;
      }
      _ultimoPayloadWaTienda = {
        destinatario_nombre: nombreMarca,
        telefono_original: '5492216615746',
        mensaje: data.mensaje_enviado || mensaje
      };
      if (box) {
        box.innerHTML = `
          <div style="background:#f8fafc; border:1px solid #cbd5e1; border-radius:10px; padding:12px; text-align:left; font-size:0.8rem; color:#0f172a; margin-top:8px;">
            <div id="wa-tienda-banner" style="padding:8px 10px; background:#f0fdf4; border:1px solid #86efac; border-radius:8px; color:#166534; margin-bottom:8px;">
              📋 <strong>Listo para enviar el comprobante por WhatsApp</strong><br>
              🛡️ Destino protegido en Modo Laboratorio: <strong>${esc(data.telefono_destino_display || '221 661 5746')}</strong>
            </div>
            <pre style="white-space:pre-wrap; margin:0 0 10px 0; padding:8px; background:#ffffff; border:1px solid #e2e8f0; border-radius:6px; font-family:inherit; font-size:0.75rem; color:#0f172a;">${esc(data.mensaje_enviado || mensaje)}</pre>
            <div id="wa-tienda-actions" style="display:flex; gap:8px;">
              <button type="button" id="btn-confirmar-wa-tienda" onclick="confirmarEnvioRealWhatsAppTienda()"
                style="flex:1; padding:10px; border-radius:8px; border:none; background:#16a34a; color:#ffffff; font-weight:900; font-size:0.84rem; cursor:pointer;">
                📲 Enviar
              </button>
              <button type="button" onclick="document.getElementById('etiqueta-confirmacion-preview').innerHTML=''"
                style="padding:10px 14px; border-radius:8px; border:1px solid #cbd5e1; background:#ffffff; color:#475569; font-weight:800; font-size:0.82rem; cursor:pointer;">
                Cancelar
              </button>
            </div>
          </div>
        `;
      }
    }

    async function confirmarEnvioRealWhatsAppTienda() {
      if (!_ultimoPayloadWaTienda) return;
      const btn = document.getElementById('btn-confirmar-wa-tienda');
      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Enviando...';
      }

    function guardarPedidoRecienteLocal(info) {
      if (!info || !info.tracking_token) return;
      try {
        const lista = obtenerPedidosRecientesLocal().filter(x => x.tracking_token !== info.tracking_token);
        lista.unshift({
          codigo_pedido: info.codigo_pedido || '',
          tracking_token: info.tracking_token,
          vecino_nombre: info.vecino_nombre || '',
          created_at: info.created_at || new Date().toISOString()

        localStorage.setItem(_storageKeyPedidosVecino(), JSON.stringify(lista.slice(0, 8)));

    async function refrescarBannerPedidosRecientes() {
      const liveDot = document.getElementById('bnav-pedido-dot');
      const guardados = obtenerPedidosRecientesLocal();
      if (guardados.length === 0) {
        STATE.pedidoActivoBannerData = null;
        if (liveDot) liveDot.style.display = 'none';
        renderizarSlotCompactoPagoPedido();
        return;
      }
      let data = null;
      const tokensObsoletos = new Set();
      for (const itemGuardado of guardados) {
        if (!itemGuardado?.tracking_token) continue;
        try {
          const resp = await fetch(`/api/produccion/nodos/tienda/${encodeURIComponent(STATE.slug)}/seguimiento/${encodeURIComponent(itemGuardado.tracking_token)}`, { cache: 'no-store' });
          const cand = await resp.json();
          if (!resp.ok || !cand.ok || !cand.pedido?.codigo_pedido) {
            if (resp.status === 404 || resp.status === 400) tokensObsoletos.add(itemGuardado.tracking_token);
            continue;
          }
          if (cand.seguimiento?.anulado || Number(cand.seguimiento?.hito_actual || 1) >= 6) {
            continue;
          }
          data = cand;
          break;
        } catch (_) {}
      }
      if (tokensObsoletos.size > 0) {
        try {
          const filtrados = obtenerPedidosRecientesLocal().filter(x => x?.tracking_token && !tokensObsoletos.has(x.tracking_token));
          localStorage.setItem(_storageKeyPedidosVecino(), JSON.stringify(filtrados));
        } catch (_) {}
      }
      if (!data || data.seguimiento?.anulado || Number(data.seguimiento?.hito_actual || 1) >= 6) {
        STATE.pedidoActivoBannerData = null;
        if (liveDot) liveDot.style.display = 'none';
        renderizarSlotCompactoPagoPedido();
        return;
      }
      try {
        if (data.identidad_vecino) {
          guardarIdentidadVecinoLocal({
            portal_token: data.identidad_vecino.portal_token || '',
            telefono_normalizado: data.identidad_vecino.telefono_normalizado || '',
            telefono_display: data.identidad_vecino.telefono_whatsapp || '',
            nombre_completo: data.identidad_vecino.nombre_completo || ''
          });
        }
        STATE.pedidoActivoBannerData = data;
        if (liveDot) liveDot.style.display = 'block';
        renderizarSlotCompactoPagoPedido();
      } catch (_) {
        STATE.pedidoActivoBannerData = null;
        renderizarSlotCompactoPagoPedido();
      }
    }

    function formatearFechaHoraHito(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      if (Number.isNaN(d.getTime())) return '';
      const hoy = new Date();
      const esHoy = d.getFullYear() === hoy.getFullYear() &&
        d.getMonth() === hoy.getMonth() &&
        d.getDate() === hoy.getDate();
      const hhmm = d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
      if (esHoy) return `Hoy ${hhmm} hs`;
      const ddmm = d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' });
      return `${ddmm} · ${hhmm} hs`;
    }

    function detenerPollingSeguimiento() {

        _trackingTimer = null;

    function cerrarModalSeguimiento() {

      _trackingWhatsappActivo = null;

      try {
        const url = new URL(window.location.href);
        if (url.searchParams.has('seguimiento')) {
          url.searchParams.delete('seguimiento');
          window.history.replaceState({}, '', url.pathname + (url.search || ''));

      refrescarBannerPedidosRecientes();
    }

    function _convertirPedidoPortalATrackingPayload(pedHist, portalData) {
      return {
        modo_privacidad_enmascarada: false,
        nodo: portalData.nodo,
        pedido: {
          ...pedHist,
          vecino_nombre: portalData.vecino?.nombre_completo || 'Vecino/a'
        },
        items: pedHist.items || [],
        seguimiento: pedHist.seguimiento,
        total_pedidos_vecino: (portalData.historial_pedidos || []).filter(x => !x.anulado).length
      };
    }

    /**
     * Acción inteligente en 1 toque al tocar "📦 Seguir mi pedido" en el catálogo:
     * 1) Si el celular ya conoce al vecino (`portal_token`, `tracking_token` o WhatsApp previo):
     *    - 1 pedido en tránsito -> abre directo su seguimiento en vivo sin pasos intermedios.
     *    - 2+ pedidos en tránsito -> muestra tarjetas directas listas para tocar.
     *    - 0 en tránsito pero con historial -> salta directo a su resumen/último pedido en Mi Cuenta (o último pedido).
     * 2) Si es un navegador limpio -> pide únicamente el número de WhatsApp (sin código #NB-...).
     */
    async function accionBotonSeguirMiPedido() {
      detenerPollingSeguimiento();
      _trackingTokenActivo = '';
      _trackingWhatsappActivo = null;

      const identidad = obtenerIdentidadVecinoLocal();
      const portalTok = STATE.portalToken || identidad.portal_token || '';
      const guardadosLocal = obtenerPedidosRecientesLocal();
      const telGuardado = identidad.telefono_display || identidad.telefono_normalizado || '';

      // Caso 1A: Vecino identificado con portal_token (vino de QR Mi Cuenta, link de comprobante o compra previa)
      if (portalTok && portalTok.length >= 16) {
        STATE.portalToken = portalTok;
        const modal = document.getElementById('tracking-modal');
        const box = document.getElementById('tracking-card-content');
        if (modal && box) {
          modal.style.display = 'flex';
          box.innerHTML = `<div style="padding:32px; text-align:center; color:var(--muted); font-weight:800;">⏳ Abriendo el estado en vivo de tu pedido...</div>`;
        }

        try {
          const resp = await fetch(
            `/api/produccion/nodos/tienda/${encodeURIComponent(STATE.slug)}/mi-cuenta/${encodeURIComponent(portalTok)}`,
            { cache: 'no-store' }
          );
          const data = await resp.json();
          if (resp.ok && data.ok) {
            STATE.miCuentaData = data;
            if (data.vecino) {
              guardarIdentidadVecinoLocal({
                portal_token: portalTok,
                telefono_normalizado: data.vecino.telefono_normalizado || '',
                telefono_display: data.vecino.telefono_whatsapp || '',
                nombre_completo: data.vecino.nombre_completo || '',
                direccion_calle: data.vecino.direccion_calle || '',
                entrecalles_referencia: data.vecino.entrecalles_referencia || ''
              });
            }
            const activos = (data.historial_pedidos || []).filter(p => !p.anulado);
            for (const p of activos.slice(0, 5).reverse()) {
              if (p.tracking_token) {
                guardarPedidoRecienteLocal({
                  codigo_pedido: p.codigo_pedido,
                  tracking_token: p.tracking_token,
                  vecino_nombre: data.vecino?.nombre_completo || '',
                  created_at: p.created_at
                });
              }
            }

            const enTransito = activos.filter(p => Number(p.seguimiento?.hito_actual || 1) < 6);
            if (enTransito.length === 1) {
              _activarVistaSeguimientoConDatos(_convertirPedidoPortalATrackingPayload(enTransito[0], data));
              return;
            }
            if (enTransito.length >= 2) {
              renderizarSelectorPedidosVecino(enTransito, activos, data.nodo, { modoTokenCompleto: true });
              return;
            }
            if (activos.length > 0) {
              // Sin pedidos en tránsito pero con historial -> salto directo a Mi Cuenta
              if (modal) modal.style.display = 'none';
              await activarVistaMiCuenta();
              return;
            }
            // Vecino identificado sin pedidos aún -> llevar a su resumen en Mi Cuenta
            if (modal) modal.style.display = 'none';
            await activarVistaMiCuenta();
            return;
          }
        } catch (_) {}
      }

      // Caso 1B: Sin portal_token previo pero con tracking_token guardado en este celular
      if (guardadosLocal.length === 1) {
        await abrirSeguimientoPorToken(guardadosLocal[0].tracking_token);
        return;
      }
      if (guardadosLocal.length >= 2) {
        // Consultar el primero para hidratar portal_token y mostrar selector completo si corresponde
        await abrirSeguimientoPorToken(guardadosLocal[0].tracking_token);
        return;
      }

      // Caso 1C: Celular donde ya consultó antes con su WhatsApp (sin token) -> salto directo sin volver a tipear
      if (telGuardado && String(telGuardado).replace(/\D+/g, '').length >= 8) {
        await ejecutarConsultaPorWhatsapp(telGuardado, { desdeMemoriaAutomatica: true });
        return;
      }

      // Caso 2: Navegador limpio -> pedir únicamente el número de WhatsApp
      abrirFormularioSoloWhatsapp(false);
    }

    async function ejecutarConsultaPorWhatsapp(telefonoRaw, opciones = {}) {
      const tel = String(telefonoRaw || '').trim();
      const modal = document.getElementById('tracking-modal');
      const box = document.getElementById('tracking-card-content');
      const errBox = document.getElementById('trk-buscar-error');
      const btn = document.getElementById('btn-ejecutar-busqueda-trk');

      if (!tel || tel.replace(/\D+/g, '').length < 8) {
        if (errBox) {
          errBox.textContent = 'Ingresá tu número de WhatsApp con código de área (ej: 221 501 1102).';
          errBox.style.display = 'block';
        } else {
          abrirFormularioSoloWhatsapp(false);
        }
        return;
      }

      if (errBox) errBox.style.display = 'none';
      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Buscando tu pedido...';
      } else if (modal && box && !opciones.silenciosoPolling) {
        modal.style.display = 'flex';
        box.innerHTML = `<div style="padding:32px; text-align:center; color:var(--muted); font-weight:800;">⏳ Consultando el estado en vivo de tu pedido...</div>`;
      }

      try {
        const resp = await fetch(`/api/produccion/nodos/tienda/${encodeURIComponent(STATE.slug)}/seguimiento-whatsapp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            telefono: tel,
            codigo_pedido: opciones.codigoPedidoEspecifico || ''
          })
        });
        const data = await resp.json();
        if (!resp.ok || !data.ok) {
          if (opciones.desdeMemoriaAutomatica) {
            abrirFormularioSoloWhatsapp(false);
            return;
          }
          if (errBox) {
            errBox.textContent = data.error || 'No encontramos pedidos asociados a ese WhatsApp.';
            errBox.style.display = 'block';
          }
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'Ver estado de mi pedido →';
          }
          return;
        }

        _ultimoResultadoWhatsapp = data;

        // Si cambió de WhatsApp en un navegador que tenía otro vecino, actualizar solo el teléfono recordado
        if (opciones.desdeFormularioManual) {
          const idActual = obtenerIdentidadVecinoLocal();
          const cambioTelefono = idActual.telefono_normalizado && idActual.telefono_normalizado !== data.telefono_normalizado;
          if (cambioTelefono) {
            try {
              localStorage.removeItem(_storageKeyMiCuentaToken(STATE.slug));
              localStorage.removeItem(_storageKeyPedidosVecino());
              STATE.portalToken = '';
              STATE.miCuentaData = null;
            } catch (_) {}
          }
        }

        guardarIdentidadVecinoLocal({
          telefono_normalizado: data.telefono_normalizado,
          telefono_display: tel
        });

        const enTransito = Array.isArray(data.pedidos_en_transito) ? data.pedidos_en_transito : [];
        const todos = Array.isArray(data.pedidos_todos) ? data.pedidos_todos : [];

        if (opciones.codigoPedidoEspecifico && data.pedido_especifico) {
          _activarVistaSeguimientoPorWhatsapp(data.pedido_especifico, tel, todos.length);
          return;
        }

        // 1 único pedido en tránsito -> abrir directo en 1 paso
        if (enTransito.length === 1) {
          _activarVistaSeguimientoPorWhatsapp(enTransito[0], tel, todos.length);
          return;
        }

        // 2 o más pedidos en tránsito -> mostrar selector directo para elegir con 1 toque
        if (enTransito.length >= 2) {
          renderizarSelectorPedidosVecino(
            enTransito.map(x => ({ ...x.pedido, items: x.items, seguimiento: x.seguimiento })),
            todos.map(x => ({ ...x.pedido, items: x.items, seguimiento: x.seguimiento })),
            data.nodo,
            { modoTokenCompleto: false, telefonoWhatsapp: tel }
          );
          return;
        }

        // Sin pedidos en tránsito pero con pedido reciente -> abrir directo el más reciente (o selector si > 1)
        if (todos.length === 1) {
          _activarVistaSeguimientoPorWhatsapp(todos[0], tel, 1);
          return;
        }
        if (todos.length > 1) {
          renderizarSelectorPedidosVecino(
            [],
            todos.map(x => ({ ...x.pedido, items: x.items, seguimiento: x.seguimiento })),
            data.nodo,
            { modoTokenCompleto: false, telefonoWhatsapp: tel }
          );
        }
      } catch (_) {
        if (errBox) {
          errBox.textContent = 'Error de conexión al consultar tu pedido.';
          errBox.style.display = 'block';
        }
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Ver estado de mi pedido →';
        }
      }
    }

          _ultimoResultadoWhatsapp.nodo,
          { modoTokenCompleto: false }
        );
        return;

      abrirFormularioSoloWhatsapp(true);

    async function abrirSeguimientoPorToken(token, silencioso = false) {
      const cleanTok = String(token || '').trim();
      if (!cleanTok) return;
      const modal = document.getElementById('tracking-modal');
      const box = document.getElementById('tracking-card-content');
      if (!modal || !box) return;

      if (!silencioso) {
        modal.style.display = 'flex';
        box.innerHTML = `<div style="padding:32px; text-align:center; color:var(--muted); font-weight:800;">⏳ Cargando estado en vivo de tu pedido...</div>`;
      }

      try {
        const vidParam = encodeURIComponent(obtenerVisitorIdTienda());
        const endpointSeg = STATE.slug
          ? `/api/produccion/nodos/tienda/${encodeURIComponent(STATE.slug)}/seguimiento/${encodeURIComponent(cleanTok)}?vid=${vidParam}`
          : `/api/produccion/nodos/seguimiento/${encodeURIComponent(cleanTok)}?vid=${vidParam}`;
        const resp = await fetch(endpointSeg, {
          cache: 'no-store'
        });
        const data = await resp.json();
        if (!resp.ok || !data.ok) {
          if (!silencioso) {
            abrirFormularioSoloWhatsapp(false);
          }
          return;
        }

        if (data.identidad_vecino) {
          guardarIdentidadVecinoLocal({
            portal_token: data.identidad_vecino.portal_token || '',
            telefono_normalizado: data.identidad_vecino.telefono_normalizado || '',
            telefono_display: data.identidad_vecino.telefono_whatsapp || '',
            nombre_completo: data.identidad_vecino.nombre_completo || data.pedido?.vecino_nombre || ''
          });
        }
        if (!silencioso && data.pedido) {
          enviarTelemetriaTienda('vista_seguimiento', {
            nodo_slug: data.nodo?.slug || STATE.slug,
            pedido_id: data.pedido.id,
            codigo_pedido: data.pedido.codigo_pedido,
            tracking_token: cleanTok,
            vecino_nombre: data.identidad_vecino?.nombre_completo || data.pedido.vecino_nombre,
            vecino_telefono: data.identidad_vecino?.telefono_whatsapp || data.pedido.vecino_telefono
          }, 4000);
        }

        guardarPedidoRecienteLocal({
          codigo_pedido: data.pedido.codigo_pedido,
          tracking_token: data.pedido.tracking_token,
          vecino_nombre: data.pedido.vecino_nombre,
          created_at: data.pedido.created_at
        });
        _activarVistaSeguimientoConDatos(data);
      } catch (_) {
        if (!silencioso) {
          box.innerHTML = `<div style="padding:24px; text-align:center; color:#b91c1c; font-weight:800;">No se pudo actualizar el seguimiento. Verificá tu conexión.</div>`;
        }
      }
    }

    function _activarVistaSeguimientoConDatos(data) {
      const tok = data.pedido?.tracking_token || '';
      _trackingTokenActivo = tok;
      _trackingWhatsappActivo = null;

      const modal = document.getElementById('tracking-modal');
      if (modal) modal.style.display = 'flex';

      if (data.nodo) {
        aplicarPaletaTienda(data.nodo);
      }

      if (tok) {
        try {
          const url = new URL(window.location.href);
          if (!/^\/seguimiento\//i.test(url.pathname)) {
            url.searchParams.set('seguimiento', tok);
            window.history.replaceState({}, '', url.pathname + url.search);
          }
        } catch (_) {}
      }

      renderizarVistaSeguimientoEnVivo(data);

      detenerPollingSeguimiento();
      if (!data.seguimiento.anulado && Number(data.seguimiento.hito_actual) < 6 && tok) {
        _trackingTimer = setInterval(() => {
          if (_trackingTokenActivo) {
            abrirSeguimientoPorToken(_trackingTokenActivo, true);
          }
        }, 15000);
      }
    }

    function renderizarVistaSeguimientoEnVivo(data) {

      const nodo = data.nodo || {};

      const items = Array.isArray(data.items) ? data.items : [];
      const esEnmascarado = Boolean(data.modo_privacidad_enmascarada);
      const esEntregado = !seg.anulado && Number(seg.hito_actual) >= 6;
      const pct = seg.anulado
        ? 0
        : Math.min(100, Math.max(12, Math.round((Number(seg.paso_actual_orden || 1) / Math.max(1, Number(seg.total_pasos || 5))) * 100)));

      const pasoActualObj = pasos.find(p => p.es_actual) || pasos[0] || {};
      const tieneTok = Boolean(ped.tracking_token);
      const linkCompartir = tieneTok
        ? `${window.location.origin}/tienda/${encodeURIComponent(nodo.slug || STATE.slug)}?seguimiento=${encodeURIComponent(ped.tracking_token)}`
        : '';
      const esModoLabTracking = Boolean(data.modo_laboratorio);
      const telPruebasTracking = String(data.telefono_whatsapp_pruebas || '5492216615746').replace(/\D+/g, '') || '5492216615746';
      const armarHrefWaGestor = (textoBase) => {
        const telWa = obtenerWhatsappPublicoEfectivoTienda(nodo);

    function detectarPortalTokenEnUrl() {
      const params = new URLSearchParams(window.location.search);
      const qTok = (params.get('mi_cuenta') || '').trim();
      if (qTok.length >= 16) {
        return { token: qTok, abrirDirecto: true };
      }
      const parts = window.location.pathname.split('/').filter(Boolean);
      const idx = parts.indexOf('tienda');
      if (idx !== -1 && parts[idx + 2] && parts[idx + 2].toLowerCase() === 'mi-cuenta' && parts[idx + 3]) {
        const pTok = decodeURIComponent(parts[idx + 3]).trim();
        if (pTok.length >= 16) {
          return { token: pTok, abrirDirecto: true };
        }
      }
      try {
        const saved = (localStorage.getItem(_storageKeyMiCuentaToken(STATE.slug)) || '').trim();
        if (saved.length >= 16) {
          return { token: saved, abrirDirecto: false };
        }
      } catch (_) {}
      return { token: '', abrirDirecto: false };
    }

    function actualizarBotonesCabeceraMiCuenta() {

      const bnavPedido = document.getElementById('bnav-pedido');

      const btnToggle = document.getElementById('btn-toggle-mi-cuenta');
      const btnSeguir = document.getElementById('btn-seguir-pedido-header');
      if (!btnToggle) return;

      if (!STATE.portalToken) {
        btnToggle.style.display = 'none';
        if (btnSeguir) btnSeguir.style.display = 'inline-flex';
        return;
      }

      btnToggle.style.display = 'inline-flex';
      if (STATE.vistaMiCuentaActiva) {

        if (btnSeguir) btnSeguir.style.display = 'none';
      } else {

          ? STATE.miCuentaData.vecino.nombre_completo.split(/\s+/)[0]
          : 'Mi Cuenta';
        btnToggle.innerHTML = `👤 ${esc(nombreCorto)} · Mi Cuenta`;
        if (btnSeguir) btnSeguir.style.display = 'inline-flex';
      }
    }

    function detenerPollingMiCuenta() {
      if (_miCuentaTimer) {
        clearInterval(_miCuentaTimer);
        _miCuentaTimer = null;
      }
    }

    async function activarVistaMiCuenta() {
      if (!STATE.portalToken) return;
      STATE.vistaMiCuentaActiva = true;
      const mcView = document.getElementById('mi-cuenta-view');
      const catWrap = document.getElementById('catalogo-tienda-wrapper');
      const cartBar = document.getElementById('cart-bar');
      if (mcView) mcView.style.display = 'flex';
      if (catWrap) catWrap.style.display = 'none';
      if (cartBar) cartBar.style.display = 'none';

      try {
        window.history.replaceState({}, '', `/tienda/${encodeURIComponent(STATE.slug)}/mi-cuenta/${encodeURIComponent(STATE.portalToken)}`);
      } catch (_) {}

      actualizarBotonesCabeceraMiCuenta();
      enviarTelemetriaTienda('vista_mi_cuenta', {
        portal_token: STATE.portalToken || undefined
      }, 3000);
      await cargarPortalMiCuenta(false);

      detenerPollingMiCuenta();
      _miCuentaTimer = setInterval(() => {
        if (STATE.vistaMiCuentaActiva && STATE.portalToken) {
          cargarPortalMiCuenta(true);
        }
      }, 15000);
    }

    function irACatalogoDesdeMiCuenta() {
      detenerPollingMiCuenta();
      STATE.vistaMiCuentaActiva = false;
      const mcView = document.getElementById('mi-cuenta-view');
      const catWrap = document.getElementById('catalogo-tienda-wrapper');
      if (mcView) mcView.style.display = 'none';
      if (catWrap) catWrap.style.display = 'block';

      try {
        window.history.replaceState({}, '', `/tienda/${encodeURIComponent(STATE.slug)}`);
      } catch (_) {}

      actualizarBotonesCabeceraMiCuenta();
      actualizarBarraCarrito();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function alternarVistaMiCuenta() {
      if (STATE.vistaMiCuentaActiva) {
        irACatalogoDesdeMiCuenta();
      } else {
        activarVistaMiCuenta();
      }
    }

    async function cargarPortalMiCuenta(silencioso = false) {
      if (!STATE.portalToken) return;
      const mcView = document.getElementById('mi-cuenta-view');
      if (mcView && !silencioso && !STATE.miCuentaData) {
        mcView.innerHTML = `
          <div class="mc-card" style="text-align:center; padding:34px 18px; color:var(--muted); font-weight:800;">
            ⏳ Cargando tu cuenta y el estado en vivo de tus pedidos...
          </div>
        `;
      }

      try {
        const vidParam = encodeURIComponent(obtenerVisitorIdTienda());
        const resp = await fetch(
          `/api/produccion/nodos/tienda/${encodeURIComponent(STATE.slug)}/mi-cuenta/${encodeURIComponent(STATE.portalToken)}?vid=${vidParam}`,
          { cache: 'no-store' }
        );
        const data = await resp.json();
        if (!resp.ok || !data.ok) {
          if (!silencioso && mcView) {
            mcView.innerHTML = `
              <div class="mc-card" style="text-align:center; padding:28px 18px;">
                <div style="font-size:2rem; margin-bottom:6px;">🔎</div>
                <h3 style="margin:0 0 6px 0;">Enlace personal no disponible</h3>
                <p style="font-size:0.88rem; color:var(--muted); margin:0 0 14px 0;">${esc(data.error || 'Verificá el código QR con el coordinador de tu barrio.')}</p>
                <button type="button" onclick="STATE.portalToken=''; irACatalogoDesdeMiCuenta();"
                  style="padding:10px 18px; border-radius:10px; border:none; background:var(--brand); color:#ffffff; font-family:inherit; font-weight:900; cursor:pointer;">
                  🛒 Ir al catálogo de la tienda
                </button>
              </div>
            `;
          }
          return;
        }

        STATE.miCuentaData = data;
        try {
          localStorage.setItem(_storageKeyMiCuentaToken(data.nodo?.slug || STATE.slug), STATE.portalToken);
        } catch (_) {}

        // Persistir identidad y pedidos activos del vecino en este celular (habilita salto en 1 toque en el catálogo)
        if (data.vecino) {
          guardarIdentidadVecinoLocal({
            portal_token: STATE.portalToken,
            telefono_normalizado: data.vecino.telefono_normalizado || '',
            telefono_display: data.vecino.telefono_whatsapp || '',
            nombre_completo: data.vecino.nombre_completo || '',
            direccion_calle: data.vecino.direccion_calle || '',
            entrecalles_referencia: data.vecino.entrecalles_referencia || ''
          }, data.nodo?.slug || STATE.slug);
        }
        if (Array.isArray(data.historial_pedidos)) {
          const activosSync = data.historial_pedidos.filter(p => !p.anulado && p.tracking_token);
          for (const p of activosSync.slice(0, 5).reverse()) {
            guardarPedidoRecienteLocal({
              codigo_pedido: p.codigo_pedido,
              tracking_token: p.tracking_token,
              vecino_nombre: data.vecino?.nombre_completo || '',
              created_at: p.created_at
            });
          }
          if (!STATE.vistaMiCuentaActiva) {
            refrescarBannerPedidosRecientes();
          }
        }

        if (data.nodo) {
          aplicarPaletaTienda(data.nodo);
        }
        if (data.nodo?.nombre_marca && STATE.vistaMiCuentaActiva) {
          document.title = `Mi Cuenta · ${data.nodo.nombre_marca}`;
        }

        actualizarBotonesCabeceraMiCuenta();
        if (STATE.vistaMiCuentaActiva) {
          renderizarPortalMiCuenta(data);
        }
      } catch (_) {
        if (!silencioso && mcView && !STATE.miCuentaData) {
          mcView.innerHTML = `<div class="mc-card" style="text-align:center; color:#b91c1c; font-weight:800;">Error de conexión al consultar tu cuenta.</div>`;
        }
      }
    }

    // =========================================================================
    // VISOR INMERSIVO 100% PANTALLA COMPLETA DE SOLO FOTOS (SWIPE + ZOOM + BACK)
    // =========================================================================
    const VISOR_FOTOS_STATE = {
      abierto: false,
      ofertaId: null,
      fotos: [],
      index: 0,
      scale: 1,
      tx: 0,
      ty: 0,
      historyPushed: false,
      cerrandoPorPopstate: false,
      lastTapMs: 0,
      pinchDist0: 0,
      pinchScale0: 1,
      panActivo: false,
      panStartX: 0,
      panStartY: 0,
      panTx0: 0,
      panTy0: 0,
      swipeDownActivo: false,
      swipeStartX: 0,
      swipeStartY: 0
    };

    function asegurarDomVisorFotosTienda() {
      if (document.getElementById('visor-fotos-fullscreen')) return;

      const el = document.createElement('div');
      el.id = 'visor-fotos-fullscreen';
      el.setAttribute('role', 'dialog');
      el.setAttribute('aria-modal', 'true');
      el.setAttribute('aria-label', 'Detalle multimedia del producto');
      el.innerHTML = `
        <div class="visor-stage-area" id="visor-stage-area">
          <div class="visor-fotos-topbar">
            <button type="button" id="btn-visor-fotos-volver" class="visor-btn-top" onclick="cerrarVisorFotosProducto()">
              ← Volver
            </button>
            <div id="visor-fotos-counter" class="visor-fotos-counter">1 / 1</div>
            <button type="button" id="btn-visor-fotos-cerrar" class="visor-btn-top visor-btn-close-icon" aria-label="Cerrar" onclick="cerrarVisorFotosProducto()">
              ✕
            </button>
          </div>
          <button type="button" id="btn-visor-prev" class="visor-nav-arrow prev" aria-label="Anterior" onclick="irASlideVisorFotos(VISOR_FOTOS_STATE.index - 1)">‹</button>
          <button type="button" id="btn-visor-next" class="visor-nav-arrow next" aria-label="Siguiente" onclick="irASlideVisorFotos(VISOR_FOTOS_STATE.index + 1)">›</button>
          <div id="visor-fotos-track" class="visor-fotos-track"></div>
          <div id="visor-fotos-dots" class="visor-fotos-dots"></div>
        </div>
        <div id="visor-ficha-panel" class="visor-ficha-panel"></div>
      `;
      document.body.appendChild(el);

      const track = document.getElementById('visor-fotos-track');
      track.addEventListener('scroll', () => {
        if (!VISOR_FOTOS_STATE.abierto || VISOR_FOTOS_STATE.scale > 1.02) return;
        const w = Math.max(1, track.clientWidth);
        const nuevoIdx = Math.max(0, Math.min(Math.max(0, VISOR_FOTOS_STATE.fotos.length - 1), Math.round(track.scrollLeft / w)));
        if (nuevoIdx !== VISOR_FOTOS_STATE.index) {
          pausarVideosEnVisor();
          resetearZoomVisorFotos(false);
          VISOR_FOTOS_STATE.index = nuevoIdx;
          actualizarIndicadoresVisorFotos();
        }
      }, { passive: true });

      // Doble clic en escritorio para zoom 2.2x (solo sobre diapositivas de foto)
      track.addEventListener('dblclick', (e) => {
        if (e.target && e.target.tagName === 'VIDEO') return;
        e.preventDefault();
        alternarDobleToqueZoomVisor();
      });

      // Gestos táctiles móviles: doble toque, pinch-to-zoom, pan con zoom activo y swipe vertical abajo para cerrar
      const distDosDedos = (touches) => {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.hypot(dx, dy);
      };

      track.addEventListener('touchstart', (e) => {
        if (!VISOR_FOTOS_STATE.abierto) return;
        if (e.target && e.target.tagName === 'VIDEO') return;
        const img = obtenerImgSlideActivoVisor();
        if (e.touches.length === 2 && img) {
          VISOR_FOTOS_STATE.pinchDist0 = distDosDedos(e.touches);
          VISOR_FOTOS_STATE.pinchScale0 = VISOR_FOTOS_STATE.scale;
          VISOR_FOTOS_STATE.panActivo = false;
          VISOR_FOTOS_STATE.swipeDownActivo = false;
          img.classList.add('is-gesture-active');
          return;
        }
        if (e.touches.length === 1 && img) {
          const now = Date.now();
          if (now - VISOR_FOTOS_STATE.lastTapMs < 280) {
            e.preventDefault();
            VISOR_FOTOS_STATE.lastTapMs = 0;
            alternarDobleToqueZoomVisor();
            return;
          }
          VISOR_FOTOS_STATE.lastTapMs = now;

          const t = e.touches[0];
          if (VISOR_FOTOS_STATE.scale > 1.02) {
            VISOR_FOTOS_STATE.panActivo = true;
            VISOR_FOTOS_STATE.panStartX = t.clientX;
            VISOR_FOTOS_STATE.panStartY = t.clientY;
            VISOR_FOTOS_STATE.panTx0 = VISOR_FOTOS_STATE.tx;
            VISOR_FOTOS_STATE.panTy0 = VISOR_FOTOS_STATE.ty;
            img.classList.add('is-gesture-active');
          } else {
            VISOR_FOTOS_STATE.swipeDownActivo = true;
            VISOR_FOTOS_STATE.swipeStartX = t.clientX;
            VISOR_FOTOS_STATE.swipeStartY = t.clientY;
          }
        }
      }, { passive: false });

      track.addEventListener('touchmove', (e) => {
        if (!VISOR_FOTOS_STATE.abierto) return;
        const img = obtenerImgSlideActivoVisor();
        if (e.touches.length === 2 && VISOR_FOTOS_STATE.pinchDist0 > 10) {
          e.preventDefault();
          const d = distDosDedos(e.touches);
          const nextScale = Math.max(1, Math.min(3.5, VISOR_FOTOS_STATE.pinchScale0 * (d / VISOR_FOTOS_STATE.pinchDist0)));
          aplicarTransformZoomVisor(nextScale, VISOR_FOTOS_STATE.tx, VISOR_FOTOS_STATE.ty);
          return;
        }
        if (e.touches.length === 1 && VISOR_FOTOS_STATE.panActivo && VISOR_FOTOS_STATE.scale > 1.02) {
          e.preventDefault();
          const t = e.touches[0];
          const maxPanX = (window.innerWidth * (VISOR_FOTOS_STATE.scale - 1)) / 2;
          const maxPanY = (window.innerHeight * (VISOR_FOTOS_STATE.scale - 1)) / 2;
          const nx = Math.max(-maxPanX, Math.min(maxPanX, VISOR_FOTOS_STATE.panTx0 + (t.clientX - VISOR_FOTOS_STATE.panStartX)));
          const ny = Math.max(-maxPanY, Math.min(maxPanY, VISOR_FOTOS_STATE.panTy0 + (t.clientY - VISOR_FOTOS_STATE.panStartY)));
          aplicarTransformZoomVisor(VISOR_FOTOS_STATE.scale, nx, ny);
          return;
        }
        if (e.touches.length === 1 && VISOR_FOTOS_STATE.swipeDownActivo && VISOR_FOTOS_STATE.scale <= 1.02) {
          const t = e.touches[0];
          const dx = t.clientX - VISOR_FOTOS_STATE.swipeStartX;
          const dy = t.clientY - VISOR_FOTOS_STATE.swipeStartY;
          if (dy > 18 && Math.abs(dy) > Math.abs(dx) * 1.35) {
            e.preventDefault();
            if (img) {
              img.classList.add('is-gesture-active');
              img.style.transform = `translate3d(0, ${Math.min(220, dy)}px, 0) scale(${Math.max(0.86, 1 - dy / 900)})`;
            }
          }
        }
      }, { passive: false });

      track.addEventListener('touchend', (e) => {
        if (!VISOR_FOTOS_STATE.abierto) return;
        const img = obtenerImgSlideActivoVisor();
        if (img) img.classList.remove('is-gesture-active');

        if (VISOR_FOTOS_STATE.swipeDownActivo && VISOR_FOTOS_STATE.scale <= 1.02 && e.changedTouches?.length > 0) {
          const ct = e.changedTouches[0];
          const dx = ct.clientX - VISOR_FOTOS_STATE.swipeStartX;
          const dy = ct.clientY - VISOR_FOTOS_STATE.swipeStartY;
          VISOR_FOTOS_STATE.swipeDownActivo = false;
          if (dy > 90 && Math.abs(dy) > Math.abs(dx) * 1.3) {
            cerrarVisorFotosProducto();
            return;
          }
          if (img) img.style.transform = 'translate3d(0, 0, 0) scale(1)';
        }

        if (e.touches.length === 0) {
          VISOR_FOTOS_STATE.panActivo = false;
          VISOR_FOTOS_STATE.pinchDist0 = 0;
          if (VISOR_FOTOS_STATE.scale < 1.05) {
            resetearZoomVisorFotos(true);
          }
        }
      });

      window.addEventListener('keydown', (e) => {
        if (!VISOR_FOTOS_STATE.abierto) return;
        if (e.key === 'Escape') {
          e.preventDefault();
          cerrarVisorFotosProducto();
        } else if (e.key === 'ArrowRight') {
          irASlideVisorFotos(VISOR_FOTOS_STATE.index + 1);
        } else if (e.key === 'ArrowLeft') {
          irASlideVisorFotos(VISOR_FOTOS_STATE.index - 1);
        }
      });

      window.addEventListener('popstate', () => {
        if (VISOR_FOTOS_STATE.abierto) {
          VISOR_FOTOS_STATE.cerrandoPorPopstate = true;
          VISOR_FOTOS_STATE.historyPushed = false;
          cerrarVisorFotosProducto();
        }
      });
    }

    function obtenerSlideActivoVisor() {
      const track = document.getElementById('visor-fotos-track');
      if (!track) return null;
      return track.children[VISOR_FOTOS_STATE.index] || null;
    }

    function obtenerImgSlideActivoVisor() {
      const slide = obtenerSlideActivoVisor();
      return slide ? slide.querySelector('.visor-foto-img') : null;
    }

    function aplicarTransformZoomVisor(scale, tx, ty) {
      VISOR_FOTOS_STATE.scale = scale;
      VISOR_FOTOS_STATE.tx = scale <= 1.02 ? 0 : tx;
      VISOR_FOTOS_STATE.ty = scale <= 1.02 ? 0 : ty;

      const track = document.getElementById('visor-fotos-track');
      const slide = obtenerSlideActivoVisor();
      const img = obtenerImgSlideActivoVisor();
      const zoomed = VISOR_FOTOS_STATE.scale > 1.02;

      if (track) track.style.overflowX = zoomed ? 'hidden' : 'auto';
      if (slide) slide.classList.toggle('is-zoomed', zoomed);
      if (img) {
        img.style.transform = `translate3d(${VISOR_FOTOS_STATE.tx.toFixed(1)}px, ${VISOR_FOTOS_STATE.ty.toFixed(1)}px, 0) scale(${VISOR_FOTOS_STATE.scale.toFixed(3)})`;
      }
    }

    function resetearZoomVisorFotos(animado = true) {
      VISOR_FOTOS_STATE.scale = 1;
      VISOR_FOTOS_STATE.tx = 0;
      VISOR_FOTOS_STATE.ty = 0;
      const track = document.getElementById('visor-fotos-track');
      if (track) {
        track.style.overflowX = 'auto';
        Array.from(track.children).forEach(sl => {
          sl.classList.remove('is-zoomed');
          const im = sl.querySelector('.visor-foto-img');
          if (im) {
            if (!animado) im.classList.add('is-gesture-active');
            im.style.transform = 'translate3d(0, 0, 0) scale(1)';
            if (!animado) requestAnimationFrame(() => im.classList.remove('is-gesture-active'));
          }
        });
      }
    }

    function alternarDobleToqueZoomVisor() {
      if (VISOR_FOTOS_STATE.scale > 1.1) {
        resetearZoomVisorFotos(true);
      } else {
        aplicarTransformZoomVisor(2.2, 0, 0);
      }
    }

    function actualizarIndicadoresVisorFotos() {
      const total = VISOR_FOTOS_STATE.fotos.length;
      const idx = VISOR_FOTOS_STATE.index;
      const counter = document.getElementById('visor-fotos-counter');
      if (counter) {
        counter.textContent = `${idx + 1} / ${total}`;
        counter.style.display = total > 0 ? 'block' : 'none';
      }

      const prevBtn = document.getElementById('btn-visor-prev');
      const nextBtn = document.getElementById('btn-visor-next');
      if (prevBtn) {
        prevBtn.classList.toggle('has-multiple', total > 1);
        prevBtn.style.opacity = idx <= 0 ? '0.32' : '1';
      }
      if (nextBtn) {
        nextBtn.classList.toggle('has-multiple', total > 1);
        nextBtn.style.opacity = idx >= total - 1 ? '0.32' : '1';
      }

      const dotsBox = document.getElementById('visor-fotos-dots');
      if (dotsBox) {
        if (total <= 1) {
          dotsBox.innerHTML = '';
        } else {
          dotsBox.innerHTML = VISOR_FOTOS_STATE.fotos
            .map((_, i) => `<span class="visor-dot${i === idx ? ' is-active' : ''}"></span>`)
            .join('');
        }
      }
    }

    function pausarVideosEnVisor() {
      const track = document.getElementById('visor-fotos-track');
      if (!track) return;
      track.querySelectorAll('video').forEach(v => {
        try { v.pause(); } catch (_) {}
      });
    }

    function renderizarFichaInferiorVisorProducto() {
      const panel = document.getElementById('visor-ficha-panel');
      if (!panel || !VISOR_FOTOS_STATE.abierto) return;
      const prod = (STATE.productos || []).find(p => Number(p.oferta_id) === Number(VISOR_FOTOS_STATE.ofertaId));
      if (!prod) {
        panel.style.display = 'none';
        return;
      }

      const claveGrupo = claveGrupoProductoTienda(prod);
      const hermanos = (STATE.productos || [])
        .filter(x => claveGrupoProductoTienda(x) === claveGrupo)
        .sort((a, b) => {
          const ka = Number(a.kilos_unidad || 0);
          const kb = Number(b.kilos_unidad || 0);
          if (ka !== kb) return ka - kb;
          return Number(a.precio_venta_vecino || 0) - Number(b.precio_venta_vecino || 0);
        });
      const presentaciones = hermanos.length > 0 ? hermanos : [prod];
      const narrativa = String(prod.narrativa_tienda || '').trim() ||
        presentaciones.map(x => String(x.narrativa_tienda || '').trim()).find(Boolean) || '';
      const permitirIng = STATE.nodo?.mostrar_ingredientes_tienda !== false;
      const ofertaIng = permitirIng
        ? presentaciones.find(x =>
            x.mostrar_ingredientes !== false && (
              (Array.isArray(x.ingredientes_comerciales) && x.ingredientes_comerciales.length >= 2) ||
              (x.es_combo && Array.isArray(x.componentes_vidriera) && x.componentes_vidriera.length >= 2)
            )
          ) || null
        : null;

      panel.style.display = 'block';
      panel.innerHTML = `
        <div class="visor-ficha-inner">
          <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:10px;">
            <div style="min-width:0; flex:1;">
              <div class="prod-cat">${esc(prod.categoria_familiar || '')}</div>
              <div style="font-size:1.03rem; font-weight:900; color:var(--text); line-height:1.25; margin-top:2px;">
                ${esc(prod.nombre_publico)}
              </div>
            </div>
            ${ofertaIng ? `
              <button type="button" class="btn-ver-ing"
                onclick="cerrarVisorFotosProducto(); abrirModalIngredientesProducto(${Number(ofertaIng.oferta_id)});">
                🥣 ¿Qué contiene?
              </button>
            ` : ''}
          </div>
          ${narrativa ? `
            <div class="visor-narrativa-full" data-testid="visor-narrativa-texto">${esc(narrativa)}</div>
          ` : ''}
          <div style="display:flex; flex-direction:column; gap:6px; margin-top:8px;">
            ${presentaciones.map(h => {
              const ch = Number(STATE.carrito[h.oferta_id] || 0);
              const presLbl = obtenerPresentacionItem(h) || 'Unidad';
              return `
                <div class="prod-pres-row">
                  <div class="prod-pres-label">${esc(presLbl)}</div>
                  <div class="prod-pres-actions">
                    <span class="prod-pres-price">${fmt(h.precio_venta_vecino)}</span>
                    ${ch === 0
                      ? `<button type="button" class="btn-add btn-add-compact" data-testid="visor-btn-agregar-${Number(h.oferta_id)}" onclick="modificarCarrito(${Number(h.oferta_id)}, 1)">+ Agregar</button>`
                      : `<div class="stepper stepper-compact">
                           <button type="button" onclick="modificarCarrito(${Number(h.oferta_id)}, -1)">−</button>
                           <span>${ch}</span>
                           <button type="button" onclick="modificarCarrito(${Number(h.oferta_id)}, 1)">+</button>
                         </div>`
                    }
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function irASlideVisorFotos(nuevoIdx) {
      const total = VISOR_FOTOS_STATE.fotos.length;
      if (total <= 1) return;
      const clamped = Math.max(0, Math.min(total - 1, Number(nuevoIdx)));
      pausarVideosEnVisor();
      resetearZoomVisorFotos(false);
      VISOR_FOTOS_STATE.index = clamped;
      const track = document.getElementById('visor-fotos-track');
      if (track) {
        track.scrollTo({ left: clamped * track.clientWidth, behavior: 'smooth' });
      }
      actualizarIndicadoresVisorFotos();
    }

    function abrirVisorFotosProducto(ofertaId) {
      const prod = (STATE.productos || []).find(p => Number(p.oferta_id) === Number(ofertaId));
      if (!prod) return;
      const mediaItems = obtenerGaleriaMultimediaProducto(prod);
      const tieneNarrativa = Boolean(String(prod.narrativa_tienda || '').trim());
      if (mediaItems.length === 0 && !tieneNarrativa) return;

      if (_coverVideoActivoEl) {
        try { _coverVideoActivoEl.pause(); } catch (_) {}
        _coverVideoActivoEl = null;
      }

      asegurarDomVisorFotosTienda();
      VISOR_FOTOS_STATE.abierto = true;
      VISOR_FOTOS_STATE.ofertaId = Number(ofertaId);
      VISOR_FOTOS_STATE.fotos = mediaItems;
      VISOR_FOTOS_STATE.index = 0;
      VISOR_FOTOS_STATE.scale = 1;
      VISOR_FOTOS_STATE.tx = 0;
      VISOR_FOTOS_STATE.ty = 0;
      VISOR_FOTOS_STATE.cerrandoPorPopstate = false;

      const track = document.getElementById('visor-fotos-track');
      const stage = document.getElementById('visor-stage-area');
      const overlay = document.getElementById('visor-fotos-fullscreen');
      if (!track || !overlay) return;

      if (mediaItems.length > 0) {
        if (stage) stage.style.minHeight = '';
        track.innerHTML = mediaItems.map((it, idx) => {
          if (it.tipo === 'video') {
            return `
              <div class="visor-foto-slide" data-slide-idx="${idx}" data-slide-tipo="video">
                <video class="visor-video-player" data-testid="visor-video-player"
                  src="${esc(it.url)}"
                  ${it.poster_url ? `poster="${esc(it.poster_url)}"` : ''}
                  controls playsinline preload="metadata"></video>
              </div>
            `;
          }
          return `
            <div class="visor-foto-slide" data-slide-idx="${idx}" data-slide-tipo="foto">
              <img class="visor-foto-img" src="${esc(it.url)}" alt="${esc(prod.nombre_publico)}" draggable="false" />
            </div>
          `;
        }).join('');
      } else {
        track.innerHTML = `
          <div class="visor-foto-slide" data-slide-idx="0" style="padding:24px; text-align:center;">
            <div style="color:#cbd5e1; font-size:0.9rem; font-weight:800;">📖 Historia y detalle del producto</div>
          </div>
        `;
      }

      overlay.classList.add('is-open');
      document.body.style.overflow = 'hidden';
      track.scrollLeft = 0;
      actualizarIndicadoresVisorFotos();
      renderizarFichaInferiorVisorProducto();
      enviarTelemetriaTienda('vista_producto', {
        oferta_id: Number(prod.oferta_id),
        sku_nodo: prod.sku_nodo || '',
        producto_nombre: prod.nombre_publico || '',
        categoria_nombre: prod.categoria_familiar || ''
      }, 1500);

      if (!VISOR_FOTOS_STATE.historyPushed) {
        try {
          window.history.pushState({ lamdaVisorFotos: true, ofertaId: Number(ofertaId) }, '');
          VISOR_FOTOS_STATE.historyPushed = true;
        } catch (_) {
          VISOR_FOTOS_STATE.historyPushed = false;
        }
      }
    }

    function cerrarVisorFotosProducto() {
      if (!VISOR_FOTOS_STATE.abierto) return;
      pausarVideosEnVisor();
      VISOR_FOTOS_STATE.abierto = false;
      resetearZoomVisorFotos(false);

      const overlay = document.getElementById('visor-fotos-fullscreen');
      if (overlay) overlay.classList.remove('is-open');
      document.body.style.overflow = '';

      if (VISOR_FOTOS_STATE.historyPushed && !VISOR_FOTOS_STATE.cerrandoPorPopstate) {
        VISOR_FOTOS_STATE.historyPushed = false;
        try {
          window.history.back();
        } catch (_) {}
      }
      VISOR_FOTOS_STATE.cerrandoPorPopstate = false;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      STATE.slug = detectarSlugInicial();
      aplicarParametroModoAdminInicial();
      const params = new URLSearchParams(window.location.search);
      const tokInicial = detectarTokenSeguimientoEnUrl();
      const ofertaInicial = Number(params.get('oferta') || 0);
      const skuInicial = (params.get('sku') || '').trim();
      if (Number.isInteger(ofertaInicial) && ofertaInicial > 0) {
        STATE.ofertaEnfocadaId = ofertaInicial;
      }
      if (skuInicial) {
        STATE.skuEnfocado = skuInicial;
      }
      const idGuardada = obtenerIdentidadVecinoLocal(STATE.slug);
      if (idGuardada.nombre_completo) window._savedVecinoNombre = idGuardada.nombre_completo;
      if (idGuardada.telefono_display || idGuardada.telefono_normalizado) {
        window._savedVecinoTel = idGuardada.telefono_display || idGuardada.telefono_normalizado;
      }
      if (idGuardada.direccion_calle) window._savedVecinoDir = idGuardada.direccion_calle;
      if (idGuardada.entrecalles_referencia) window._savedVecinoRef = idGuardada.entrecalles_referencia;

      const detCuenta = detectarPortalTokenEnUrl();
      if (detCuenta.token) {
        STATE.portalToken = detCuenta.token;
        guardarIdentidadVecinoLocal({ portal_token: detCuenta.token }, STATE.slug);
      } else if (idGuardada.portal_token) {
        STATE.portalToken = idGuardada.portal_token;
      }

      await cargarTienda('');

      if (STATE.portalToken && detCuenta.abrirDirecto) {
        await activarVistaMiCuenta();
      } else if (STATE.portalToken) {
        cargarPortalMiCuenta(true);
      }

      if (tokInicial) {
        abrirSeguimientoPorToken(tokInicial);
      } else if (params.get('video') === '1' && obtenerVideoBienvenidaTienda(STATE.nodo).disponible) {
        abrirModalVideoBienvenidaTienda('link_directo_video');
      }
    });
  </script>
</body>
</html>
