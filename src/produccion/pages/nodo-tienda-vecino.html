    function renderBannerEntrega() {
      const banner = document.getElementById('delivery-banner');
      const badge = document.getElementById('delivery-badge-status');
      const mainTxt = document.getElementById('delivery-date-text');
      if (!banner || !mainTxt) return;

      const prox = STATE.proximaEntrega;
      const barrio = String(STATE.nodo?.barrio_zona || STATE.nodo?.nombre_marca || 'tu barrio').trim();
      if (!prox || !prox.asignada) {
        mainTxt.textContent = `Próxima entrega en ${barrio}`;
        return;
      }

      const asig = prox.asignada;
      const pasoCorte = Boolean(prox.paso_horario_corte);
      banner.classList.toggle('after-cutoff', pasoCorte);
      if (badge) {
        badge.textContent = pasoCorte ? '⏭️' : '📅';
      }

      const dia = String(asig.dia_entrega_nombre || '').trim();
      const fechaCorta = String(asig.fecha_entrega_corta || '').trim();
      const ventana = String(asig.ventana_retiro || '').trim();
      const detalleFechaHora = (dia && fechaCorta)
        ? `${dia} ${fechaCorta}${ventana ? `, ${ventana}` : ''}`
        : String(asig.label_completo || '');

      const prefijo = pasoCorte
        ? `Próxima fecha en ${esc(barrio)}`
        : `Próxima entrega en ${esc(barrio)}`;

      mainTxt.innerHTML = `${prefijo} · <strong>${esc(detalleFechaHora)}</strong>`;
    }

    function renderCategorias() {
      const catsSet = new Set(['TODAS']);
      STATE.productos.forEach(p => {
        if (p.categoria_familiar) catsSet.add(p.categoria_familiar);
      });
      const row = document.getElementById('cats-row');
      if (STATE.productos.length === 0) {
        row.innerHTML = '';
        return;
      }
      row.innerHTML = Array.from(catsSet).map(cat => `
        <button type="button" class="cat-btn ${STATE.categoriaActiva === cat ? 'active' : ''}"
          onclick="seleccionarCategoriaTienda('${esc(cat)}')">
          ${cat === 'TODAS' ? 'Todos los productos' : esc(cat)}
        </button>
      `).join('');
    }

    function renderCatalogo() {
      const grid = document.getElementById('products-grid');
      if (STATE.productos.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:34px 20px; text-align:center;">
            <div style="font-size:1.02rem; font-weight:900; color:var(--text); margin-bottom:6px;">Próximamente disponibles</div>
            <div style="font-size:0.88rem; color:var(--muted); max-width:440px; margin:0 auto;">
              Estamos preparando la selección de productos para la próxima entrega del barrio.
            </div>
          </div>
        `;
        return;
      }

      const qNorm = normalizarTextoBusqueda(document.getElementById('search-box')?.value || '');
      const terms = qNorm.split(/\s+/).filter(Boolean);

      const filtrados = STATE.productos.filter(p => {
        if (STATE.categoriaActiva !== 'TODAS' && p.categoria_familiar !== STATE.categoriaActiva) return false;
        if (terms.length === 0) return true;
        const ingTxt = Array.isArray(p.ingredientes_comerciales) ? p.ingredientes_comerciales.join(' ') : '';
        const presTxt = obtenerPresentacionItem(p);
        const bolsa = normalizarTextoBusqueda(
          `${p.nombre_publico || ''} ${p.categoria_familiar || ''} ${presTxt} ${p.sku_nodo || ''} ${ingTxt}`
        );
        return terms.every(t => bolsa.includes(t));
      });

      if (filtrados.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:36px; color:var(--muted); font-weight:700;">No encontramos productos con ese filtro.</div>`;
        return;
      }

      const permitirBotonNodo = STATE.nodo?.mostrar_ingredientes_tienda !== false;
      const mapaGrupos = new Map();
      for (const p of filtrados) {
        const clave = claveGrupoProductoTienda(p);
        if (!mapaGrupos.has(clave)) {
          mapaGrupos.set(clave, {
            clave,
            categoria_familiar: p.categoria_familiar || 'Almacén Natural',
            nombre_publico: p.nombre_publico,
            destacado_tienda: Boolean(p.destacado_tienda),
            presentaciones: []
          });
        }
        const g = mapaGrupos.get(clave);
        g.destacado_tienda = g.destacado_tienda || Boolean(p.destacado_tienda);
        g.presentaciones.push(p);
      }

      const grupos = Array.from(mapaGrupos.values());
      const renderFilaPresentacion = (p) => {
        const cant = Number(STATE.carrito[p.oferta_id] || 0);
        const pres = obtenerPresentacionItem(p) || 'Unidad';
        const esPresEnfocada = Boolean(
          (STATE.ofertaEnfocadaId && Number(p.oferta_id) === Number(STATE.ofertaEnfocadaId)) ||
          (STATE.skuEnfocado && String(p.sku_nodo || '').trim().toLowerCase() === String(STATE.skuEnfocado || '').trim().toLowerCase())
        );
        return `
          <div class="prod-pres-row${esPresEnfocada ? ' prod-pres-destacado' : ''}">
            <div class="prod-pres-label">${esc(pres)}</div>
            <div class="prod-pres-actions">
              <span class="prod-pres-price">${fmt(p.precio_venta_vecino)}</span>
              ${cant === 0
                ? `<button type="button" class="btn-add btn-add-compact" onclick="modificarCarrito(${Number(p.oferta_id)}, 1)">+ Agregar</button>`
                : `<div class="stepper stepper-compact">
                     <button type="button" onclick="modificarCarrito(${Number(p.oferta_id)}, -1)">−</button>
                     <span>${cant}</span>
                     <button type="button" onclick="modificarCarrito(${Number(p.oferta_id)}, 1)">+</button>
                   </div>`
              }
            </div>
          </div>
        `;
      };

      grid.innerHTML = grupos.map(g => {
        g.presentaciones.sort((a, b) => {
          const ka = Number(a.kilos_unidad || 0);
          const kb = Number(b.kilos_unidad || 0);
          if (ka !== kb) return ka - kb;
          const pa = Number(a.precio_venta_vecino || 0);
          const pb = Number(b.precio_venta_vecino || 0);
          if (pa !== pb) return pa - pb;
          return Number(a.oferta_id || 0) - Number(b.oferta_id || 0);
        });
        const esCardEnfocada = g.presentaciones.some(p =>
          (STATE.ofertaEnfocadaId && Number(p.oferta_id) === Number(STATE.ofertaEnfocadaId)) ||
          (STATE.skuEnfocado && String(p.sku_nodo || '').trim().toLowerCase() === String(STATE.skuEnfocado || '').trim().toLowerCase())
        );
        const ofertaIng = permitirBotonNodo
          ? g.presentaciones.find(x =>
              x.mostrar_ingredientes !== false &&
              Array.isArray(x.ingredientes_comerciales) &&
              x.ingredientes_comerciales.length >= 2
            ) || null
          : null;
        return `
          <div class="prod-card${esCardEnfocada ? ' prod-card-destacado' : ''}"${esCardEnfocada ? ' id="prod-card-enfocada"' : ''}>
            ${esCardEnfocada ? '<div class="badge-oferta-enfocada">✨ Producto compartido</div>' : ''}
            <div class="prod-card-head">
              <div class="prod-head-info">
                <div class="prod-cat">${esc(g.categoria_familiar)}</div>
                <div class="prod-title">${esc(g.nombre_publico)}</div>
              </div>
              ${ofertaIng
                ? `<button type="button" class="btn-ver-ing" onclick="event.stopPropagation(); abrirModalIngredientesProducto(${Number(ofertaIng.oferta_id)})">🥣 ¿Qué contiene?</button>`
                : ''
              }
            </div>
            <div class="prod-pres-list">
              ${g.presentaciones.map(renderFilaPresentacion).join('')}
            </div>
          </div>
        `;
      }).join('');

      if ((STATE.ofertaEnfocadaId || STATE.skuEnfocado) && !STATE._scrollOfertaHecho) {
        const elDestacado = document.getElementById('prod-card-enfocada');
        if (elDestacado) {
          STATE._scrollOfertaHecho = true;
          requestAnimationFrame(() => {
            setTimeout(() => {
              elDestacado.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 120);
          });
        }
      }
    }

    function abrirModalIngredientesProducto(ofertaId) {
      const prod = STATE.productos.find(x =>
        Number(x.oferta_id) === Number(ofertaId) ||
        String(x.sku_nodo || '') === String(ofertaId || '')
      );
      if (!prod || !Array.isArray(prod.ingredientes_comerciales) || prod.ingredientes_comerciales.length < 2) return;
      STATE.ofertaIngredientesModalId = Number(prod.oferta_id);
      renderContenidoModalIngredientes();
      const modal = document.getElementById('ingredientes-modal');
      if (modal) {
        modal.style.display = 'flex';
        modal.classList.add('open');
      }
      enviarTelemetriaTienda('clic_que_contiene', {
        oferta_id: Number(prod.oferta_id),
        sku_nodo: prod.sku_nodo || '',
        producto_nombre: prod.nombre_publico || '',
        categoria_nombre: prod.categoria_familiar || ''
      }, 1500);
    }

    function cerrarModalIngredientesProducto() {
      STATE.ofertaIngredientesModalId = null;
      const modal = document.getElementById('ingredientes-modal');
      if (modal) {
        modal.style.display = 'none';
        modal.classList.remove('open');
      }
    }

    document.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Escape') return;
      if (document.getElementById('nodo-drawer')?.classList.contains('open')) {
        cerrarDrawerNodoTienda();
        return;
      }
      if (document.getElementById('pwa-tienda-modal')?.classList.contains('open')) {
        cerrarModalPwaTienda();
        return;
      }
      if (STATE.ofertaIngredientesModalId) {
        cerrarModalIngredientesProducto();
      }
    });

    function renderContenidoModalIngredientes() {
      const card = document.getElementById('ingredientes-card-content');
      if (!card || !STATE.ofertaIngredientesModalId) return;
      const p = STATE.productos.find(x => Number(x.oferta_id) === Number(STATE.ofertaIngredientesModalId));
      if (!p) {
        cerrarModalIngredientesProducto();
        return;
      }
      const lista = Array.isArray(p.ingredientes_comerciales) ? p.ingredientes_comerciales : [];
      const claveGrupo = claveGrupoProductoTienda(p);
      const hermanos = STATE.productos
        .filter(x => claveGrupoProductoTienda(x) === claveGrupo)
        .sort((a, b) => {
          const ka = Number(a.kilos_unidad || 0);
          const kb = Number(b.kilos_unidad || 0);
          if (ka !== kb) return ka - kb;
          const pa = Number(a.precio_venta_vecino || 0);
          const pb = Number(b.precio_venta_vecino || 0);
          if (pa !== pb) return pa - pb;
          return Number(a.oferta_id || 0) - Number(b.oferta_id || 0);
        });
      const presentaciones = hermanos.length > 0 ? hermanos : [p];
      const unica = presentaciones.length === 1;
      const cantUnica = Number(STATE.carrito[p.oferta_id] || 0);
      const presentacionUnica = obtenerPresentacionItem(p);

      card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding-bottom:12px; border-bottom:1px solid var(--border);">
          <div>
            <div style="font-size:0.72rem; font-weight:800; text-transform:uppercase; letter-spacing:0.04em; color:var(--brand-dark);">
              🥣 ¿Qué contiene este producto?
            </div>
            <h3 style="margin:4px 0 6px 0; font-size:1.12rem; font-weight:900; color:var(--text); line-height:1.25;">
              ${esc(p.nombre_publico)}
            </h3>
            ${unica && presentacionUnica ? `<span class="prod-pres">${esc(presentacionUnica)}</span>` : ''}
          </div>
          <button type="button" onclick="cerrarModalIngredientesProducto()" aria-label="Cerrar"
            style="width:32px; height:32px; border-radius:999px; border:1px solid var(--border); background:var(--surface-warm); color:var(--muted); font-weight:900; font-size:1rem; cursor:pointer; flex-shrink:0;">
            ✕
          </button>
        </div>

        <div style="padding-top:12px;">
          <div style="font-size:0.78rem; font-weight:800; color:var(--muted);">
            Ingredientes seleccionados (${lista.length}):
          </div>
          <div class="ing-chips-wrap">
            ${lista.map(ing => `
              <span class="ing-chip">
                <span class="ing-chip-dot"></span>
                <span>${esc(ing)}</span>
              </span>
            `).join('')}
          </div>
        </div>

        ${unica ? `
          <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-top:18px; padding-top:14px; border-top:1px solid var(--border);">
            <div>
              <div style="font-size:0.72rem; font-weight:700; color:var(--muted);">Precio vecinal</div>
              <div style="font-size:1.18rem; font-weight:900; color:var(--text);">${fmt(p.precio_venta_vecino)}</div>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              ${cantUnica === 0
                ? `<button type="button" class="btn-add" onclick="modificarCarrito(${Number(p.oferta_id)}, 1)">+ Agregar</button>`
                : `<div class="stepper">
                     <button type="button" onclick="modificarCarrito(${Number(p.oferta_id)}, -1)">−</button>
                     <span>${cantUnica}</span>
                     <button type="button" onclick="modificarCarrito(${Number(p.oferta_id)}, 1)">+</button>
                   </div>`
              }
              <button type="button" onclick="cerrarModalIngredientesProducto()"
                style="padding:9px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface-warm); color:var(--text); font-family:inherit; font-weight:800; font-size:0.84rem; cursor:pointer;">
                Cerrar
              </button>
            </div>
          </div>
        ` : `
          <div style="margin-top:16px; padding-top:12px; border-top:1px solid var(--border);">
            <div style="font-size:0.76rem; font-weight:800; color:var(--muted); margin-bottom:8px;">
              Presentaciones disponibles (${presentaciones.length}):
            </div>
            <div style="display:flex; flex-direction:column; gap:7px;">
              ${presentaciones.map(h => {
                const ch = Number(STATE.carrito[h.oferta_id] || 0);
                const presH = obtenerPresentacionItem(h) || 'Unidad';
                return `
                  <div class="prod-pres-row">
                    <div class="prod-pres-label">${esc(presH)}</div>
                    <div class="prod-pres-actions">
                      <span class="prod-pres-price">${fmt(h.precio_venta_vecino)}</span>
                      ${ch === 0
                        ? `<button type="button" class="btn-add btn-add-compact" onclick="modificarCarrito(${Number(h.oferta_id)}, 1)">+ Agregar</button>`
                        : `<div class="stepper stepper-compact">
                             <button type="button" onclick="modificarCarrito(${Number(h.oferta_id)}, -1)">−</button>
                             <span>${ch}</span>
                             <button type="button" onclick="modificarCarrito(${Number(h.oferta_id)}, 1)">+</button>
                           </div>`
                      }
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
            <div style="display:flex; justify-content:flex-end; margin-top:12px;">
              <button type="button" onclick="cerrarModalIngredientesProducto()"
                style="padding:9px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface-warm); color:var(--text); font-family:inherit; font-weight:800; font-size:0.84rem; cursor:pointer;">
                Cerrar
              </button>
            </div>
          </div>
        `}
      `;
    }

    function modificarCarrito(ofertaId, delta) {
      const actual = Number(STATE.carrito[ofertaId] || 0);
      const nuevo = Math.max(0, actual + delta);
      if (nuevo === 0) delete STATE.carrito[ofertaId];
      else STATE.carrito[ofertaId] = nuevo;
      renderCatalogo();
      actualizarBarraCarrito();
      if (STATE.ofertaIngredientesModalId) {
        const modalProd = STATE.productos.find(x => Number(x.oferta_id) === Number(STATE.ofertaIngredientesModalId));
        const editedProd = STATE.productos.find(x => Number(x.oferta_id) === Number(ofertaId));
        if (STATE.ofertaIngredientesModalId === Number(ofertaId) ||
          (modalProd && editedProd && claveGrupoProductoTienda(modalProd) === claveGrupoProductoTienda(editedProd))) {
          renderContenidoModalIngredientes();
        }
      }
      if (nuevo !== actual) {
        const prodRef = STATE.productos.find(x => Number(x.oferta_id) === Number(ofertaId));
        const snap = construirSnapshotCarritoTelemetria();
        enviarTelemetriaTienda(delta > 0 ? 'carrito_agregar' : 'carrito_quitar', {
          oferta_id: Number(ofertaId),
          sku_nodo: prodRef?.sku_nodo || '',
          producto_nombre: prodRef?.nombre_publico || '',
          categoria_nombre: prodRef?.categoria_familiar || '',
          cantidad: nuevo,
          ...snap
        }, 250);
      }
    }

    function obtenerCapacidadesEntregaTienda(nodoObj = STATE.nodo) {
      const n = nodoObj || {};
      const puedeRetiro = n.permitir_retiro_nodo !== false;
      const puedeReparto = Boolean(n.permitir_reparto_propio ?? n.permitir_envio_barrial);
      const puedeEncomienda = Boolean(n.permitir_encomienda);
      return { puedeRetiro, puedeReparto, puedeEncomienda };
    }

    function asegurarModalidadEntregaValida() {
      const cap = obtenerCapacidadesEntregaTienda();
      if (STATE.modalidadEntrega === 'RETIRO_NODO' && cap.puedeRetiro) return 'RETIRO_NODO';
      if (STATE.modalidadEntrega === 'ENVIO_BARRIAL' && cap.puedeReparto) return 'ENVIO_BARRIAL';
      if (cap.puedeRetiro) {
        STATE.modalidadEntrega = 'RETIRO_NODO';
      } else if (cap.puedeReparto) {
        STATE.modalidadEntrega = 'ENVIO_BARRIAL';
      }
      return STATE.modalidadEntrega;
    }

    function calcularResumenCarrito() {
      asegurarModalidadEntregaValida();
      let unidades = 0;
      let subtotal = 0;
      const detalle = [];
      for (const p of STATE.productos) {
        const c = Number(STATE.carrito[p.oferta_id] || 0);
        if (c > 0) {
          unidades += c;
          subtotal += c * Number(p.precio_venta_vecino);
          detalle.push({ ...p, cantidad: c, subtotal: c * Number(p.precio_venta_vecino) });
        }
      }
      const cap = obtenerCapacidadesEntregaTienda();
      const costoEnvio = (STATE.modalidadEntrega === 'ENVIO_BARRIAL' && cap.puedeReparto)
        ? Number(STATE.nodo.cargo_envio_barrial || 0)
        : 0;
      return {
        unidades,
        subtotal,
        costoEnvio,
        total: subtotal + costoEnvio,
        detalle
      };
    }

    let _cartEmptyToastTimer = null;

    function mostrarToastCarritoVacio() {
      const toast = document.getElementById('cart-empty-toast');
      if (!toast) return;
      toast.textContent = '🛒 Sumá productos del catálogo para iniciar tu pedido';
      toast.classList.add('visible');
      if (_cartEmptyToastTimer) clearTimeout(_cartEmptyToastTimer);
      _cartEmptyToastTimer = setTimeout(() => {
        toast.classList.remove('visible');
      }, 2200);
    }

    function abrirAccionCarritoTienda() {
      cerrarDrawerNodoTienda();
      const res = calcularResumenCarrito();
      if (res.unidades > 0) {
        abrirModalCheckout();
        return;
      }
      if (STATE.vistaMiCuentaActiva) {
        irACatalogoDesdeMiCuenta();
      }
      mostrarToastCarritoVacio();
      const grid = document.getElementById('products-grid');
      if (grid) {
        grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function irACatalogoTiendaBoton() {
      cerrarDrawerNodoTienda();
      cerrarModalSeguimiento();
      if (STATE.vistaMiCuentaActiva) {
        irACatalogoDesdeMiCuenta();
      } else {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      actualizarBotonesCabeceraMiCuenta();
    }

    function actualizarBarraCarrito() {
      const res = calcularResumenCarrito();
      const bar = document.getElementById('cart-bar');
      if (bar) {
        if (res.unidades === 0 || STATE.vistaMiCuentaActiva) {
          bar.style.display = 'none';
        } else {
          bar.style.display = 'flex';
          document.getElementById('cart-count-label').textContent = `${res.unidades} ${res.unidades === 1 ? 'producto' : 'productos'} en tu canasto`;
          document.getElementById('cart-total-label').textContent = fmt(res.subtotal);
        }
      }

      // Actualizar ítem Carrito en Barra Inferior Móvil (< 768px)
      const bnavCart = document.getElementById('bnav-carrito');
      const bnavBadge = document.getElementById('bnav-cart-badge');
      const bnavLabel = document.getElementById('bnav-cart-label');
      if (bnavCart && bnavBadge && bnavLabel) {
        if (res.unidades > 0) {
          bnavCart.classList.add('bnav-cart-has-items');
          bnavBadge.textContent = String(res.unidades);
          bnavBadge.style.display = 'inline-flex';
          bnavLabel.textContent = fmt(res.subtotal);
        } else {
          bnavCart.classList.remove('bnav-cart-has-items');
          bnavBadge.textContent = '0';
          bnavBadge.style.display = 'none';
          bnavLabel.textContent = 'Carrito';
        }
      }

      // Actualizar píldora Carrito en Cabecera Escritorio (>= 768px)
      const deskCart = document.getElementById('desk-nav-carrito');
      const deskBadge = document.getElementById('desk-cart-badge');
      const deskLabel = document.getElementById('desk-cart-label');
      if (deskCart && deskBadge && deskLabel) {
        deskCart.classList.toggle('has-items', res.unidades > 0);
        deskBadge.textContent = String(res.unidades);
        deskLabel.textContent = res.unidades > 0 ? fmt(res.subtotal) : 'Carrito';
      }
    }

    function obtenerMediosPagoHabilitadosTienda(nodoObj = STATE.nodo) {
      const n = nodoObj || {};
      const permiteTransf = n.permitir_transferencia !== false;
      const permiteEfec = n.permitir_efectivo !== false;
      const lista = [];
      if (permiteTransf) {
        lista.push({
          codigo: 'TRANSFERENCIA',
          titulo: '🏦 Transferencia Bancaria',
          subtitulo: `Alias: ${n.alias_bancario_display || 'pago.canasto'}`
        });
      }
      if (permiteEfec) {
        lista.push({
          codigo: 'EFECTIVO',
          titulo: '💵 Efectivo al recibir / retirar',
          subtitulo: 'Abonás en mano al momento de la entrega'
        });
      }
      if (lista.length === 0) {
        lista.push({
          codigo: 'TRANSFERENCIA',
          titulo: '🏦 Transferencia Bancaria',
          subtitulo: `Alias: ${n.alias_bancario_display || 'pago.canasto'}`
        });
      }
      return lista;
    }

    function obtenerPasosCheckoutWizard() {
      if (STATE.checkoutWiz.modalidadElegida === 'ENVIO_BARRIAL') {
        return ['entrega', 'datos', 'direccion', 'pago', 'revision'];
      }
      return ['entrega', 'datos', 'pago', 'revision'];
    }

    function validarPasoCheckoutWizard(pasoKey) {
      const w = STATE.checkoutWiz;
      if (pasoKey === 'entrega') {
        return w.modalidadElegida === 'RETIRO_NODO' || w.modalidadElegida === 'ENVIO_BARRIAL';
      }
      if (pasoKey === 'datos') {
        const nom = String(w.nombre || '').trim();
        const digitosTel = String(w.telefono || '').replace(/\D/g, '');
        return nom.length >= 2 && digitosTel.length >= 8;
      }
      if (pasoKey === 'direccion') {
        const dir = String(w.direccion || '').trim();
        return dir.length >= 3;
      }
      if (pasoKey === 'pago') {
        return w.medioPagoElegido === 'TRANSFERENCIA' || w.medioPagoElegido === 'EFECTIVO';
      }
      if (pasoKey === 'revision') {
        return validarPasoCheckoutWizard('entrega') &&
               validarPasoCheckoutWizard('datos') &&
               (w.modalidadElegida !== 'ENVIO_BARRIAL' || validarPasoCheckoutWizard('direccion')) &&
               validarPasoCheckoutWizard('pago');
      }
      return false;
    }

    function abrirModalCheckout() {
      const res = calcularResumenCarrito();
      if (res.unidades === 0) return;
      enviarTelemetriaTienda('inicio_checkout', construirSnapshotCarritoTelemetria(), 2000);

      const idGuardada = obtenerIdentidadVecinoLocal(STATE.slug) || {};
      const nombrePre = String(idGuardada.nombre_completo || window._savedVecinoNombre || '').trim();
      const telPre = String(idGuardada.telefono_display || idGuardada.telefono_normalizado || window._savedVecinoTel || '').trim();
      const dirPre = String(idGuardada.direccion_calle || window._savedVecinoDir || '').trim();
      const refPre = String(idGuardada.entrecalles_referencia || window._savedVecinoRef || '').trim();

      STATE.mostrarMapaCheckoutVecino = false;
      STATE.checkoutWiz = {
        pasoActualKey: 'entrega',
        modalidadElegida: '',
        medioPagoElegido: '',
        nombre: nombrePre,
        telefono: telPre,
        direccion: dirPre,
        entrecalles: refPre,
        teniaDatosGuardados: Boolean(nombrePre.length >= 2 && telPre.replace(/\D/g, '').length >= 8),
        enviandoPedido: false
      };

      document.body.style.overflow = 'hidden';
      const modal = document.getElementById('checkout-modal');
      modal.style.display = 'flex';
      renderContenidoModalCheckout();
    }

    function destruirMapaCheckoutVecino() {
      if (window._chkLeafletMap) {
        try { window._chkLeafletMap.remove(); } catch (_) {}
      }
      window._chkLeafletMap = null;
      window._chkLeafletMarker = null;
    }

    function cerrarModalCheckout() {
      destruirMapaCheckoutVecino();
      document.body.style.overflow = '';
      const modal = document.getElementById('checkout-modal');
      if (modal) modal.style.display = 'none';
    }

    function sincronizarInputsPasoVisibleCheckout() {
      const inpNom = document.getElementById('chk-nombre');
      if (inpNom) {
        STATE.checkoutWiz.nombre = inpNom.value;
        window._savedVecinoNombre = inpNom.value;
      }
      const inpTel = document.getElementById('chk-telefono');
      if (inpTel) {
        STATE.checkoutWiz.telefono = inpTel.value;
        window._savedVecinoTel = inpTel.value;
      }
      const inpDir = document.getElementById('chk-direccion');
      if (inpDir) {
        STATE.checkoutWiz.direccion = inpDir.value;
        window._savedVecinoDir = inpDir.value;
      }
      const inpRef = document.getElementById('chk-entrecalles');
      if (inpRef) {
        STATE.checkoutWiz.entrecalles = inpRef.value;
        window._savedVecinoRef = inpRef.value;
      }
    }

    function retrocederPasoCheckoutWizard() {
      if (STATE.checkoutWiz.enviandoPedido) return;
      sincronizarInputsPasoVisibleCheckout();
      const pasos = obtenerPasosCheckoutWizard();
      const idx = pasos.indexOf(STATE.checkoutWiz.pasoActualKey);
      if (idx <= 0) {
        cerrarModalCheckout();
        return;
      }
      STATE.checkoutWiz.pasoActualKey = pasos[idx - 1];
      renderContenidoModalCheckout();
    }

    function avanzarPasoCheckoutWizard() {
      if (STATE.checkoutWiz.enviandoPedido) return;
      sincronizarInputsPasoVisibleCheckout();
      const actual = STATE.checkoutWiz.pasoActualKey;
      if (!validarPasoCheckoutWizard(actual)) return;
      const pasos = obtenerPasosCheckoutWizard();
      const idx = pasos.indexOf(actual);
      if (idx >= 0 && idx < pasos.length - 1) {
        STATE.checkoutWiz.pasoActualKey = pasos[idx + 1];
        renderContenidoModalCheckout();
      }
    }

    function seleccionarModalidadCheckoutWizard(mod) {
      STATE.checkoutWiz.modalidadElegida = mod;
      STATE.modalidadEntrega = mod;
      renderContenidoModalCheckout();
    }

    function seleccionarPagoCheckoutWizard(medio) {
      STATE.checkoutWiz.medioPagoElegido = medio;
      STATE.medioPago = medio;
      renderContenidoModalCheckout();
    }

    function onInputDatosCheckoutWizard() {
      sincronizarInputsPasoVisibleCheckout();
      const btn = document.getElementById('chk-btn-continuar');
      if (btn) {
        btn.disabled = !validarPasoCheckoutWizard('datos');
      }
    }

    function _normalizarDirCheckPin(txt = '') {
      return String(txt || '').trim().toLowerCase().replace(/\s+/g, ' ');
    }

    function onEditarDireccionCheckoutVecino(val) {
      STATE.checkoutWiz.direccion = val;
      window._savedVecinoDir = val;
      if (window._savedVecinoLat != null && _normalizarDirCheckPin(val) !== _normalizarDirCheckPin(window._savedVecinoDirPinBase || '')) {
        window._savedVecinoLat = null;
        window._savedVecinoLng = null;
        window._savedVecinoGpsOrigen = null;
        window._savedVecinoDirPinBase = '';
        actualizarEstadoGpsCheckoutUI();
      }
      const btn = document.getElementById('chk-btn-continuar');
      if (btn) {
        btn.disabled = !validarPasoCheckoutWizard('direccion');
      }
    }

    function actualizarEstadoGpsCheckoutUI() {
      const statusEl = document.getElementById('chk-gps-status-txt');
      const quitBtn = document.getElementById('chk-btn-quitar-pin');
      const tiene = Number.isFinite(Number(window._savedVecinoLat)) && Number.isFinite(Number(window._savedVecinoLng)) && Number(window._savedVecinoLat) !== 0;
      if (statusEl) {
        if (tiene) {
          statusEl.style.color = '#15803d';
          statusEl.textContent = `✅ Ubicación lista (${Number(window._savedVecinoLat).toFixed(5)}, ${Number(window._savedVecinoLng).toFixed(5)}) — podés mover el pin si hace falta.`;
        } else {
          statusEl.style.color = 'var(--muted)';
          statusEl.textContent = 'Si no compartís GPS no hay problema: repartimos con tu calle y entrecalles.';
        }
      }
      if (quitBtn) {
        quitBtn.style.display = tiene ? 'inline-flex' : 'none';
      }
    }

    function limpiarUbicacionCheckoutVecino() {
      window._savedVecinoLat = null;
      window._savedVecinoLng = null;
      window._savedVecinoGpsOrigen = null;
      window._savedVecinoDirPinBase = '';
      actualizarEstadoGpsCheckoutUI();
      if (window._chkLeafletMarker && window._chkLeafletMap) {
        const cLat = Number(STATE.nodo?.zona_centro_lat) || -34.92145;
        const cLng = Number(STATE.nodo?.zona_centro_lng) || -57.95453;
        window._chkLeafletMarker.setLatLng([cLat, cLng]);
        window._chkLeafletMap.setView([cLat, cLng], 14);
      }
    }

    async function inicializarMapaCheckoutVecino() {
      const canvas = document.getElementById('chk-leaflet-map');
      if (!canvas) return;
      if (!window.L) {
        canvas.innerHTML = '<div style="padding:14px; font-size:0.8rem; color:#92400e; text-align:center;">No se pudo cargar el mapa ahora. Podés confirmar tu pedido normalmente con tu dirección escrita.</div>';
        return;
      }

      destruirMapaCheckoutVecino();
      const tieneSaved = Number.isFinite(Number(window._savedVecinoLat)) && Number.isFinite(Number(window._savedVecinoLng)) && Number(window._savedVecinoLat) !== 0;
      const centerLat = tieneSaved ? Number(window._savedVecinoLat) : (Number(STATE.nodo?.zona_centro_lat) || -34.92145);
      const centerLng = tieneSaved ? Number(window._savedVecinoLng) : (Number(STATE.nodo?.zona_centro_lng) || -57.95453);

      const mapa = window.L.map(canvas, { zoomControl: true }).setView([centerLat, centerLng], tieneSaved ? 16 : 14);
      window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 19
      }).addTo(mapa);

      const marker = window.L.marker([centerLat, centerLng], { draggable: true }).addTo(mapa);
      const fijarDesdeMapa = (lat, lng) => {
        window._savedVecinoLat = Number(Number(lat).toFixed(7));
        window._savedVecinoLng = Number(Number(lng).toFixed(7));
        window._savedVecinoGpsOrigen = 'VECINO_PIN_MAPA';
        window._savedVecinoDirPinBase = document.getElementById('chk-direccion')?.value || STATE.checkoutWiz.direccion || window._savedVecinoDir || '';
        marker.setLatLng([window._savedVecinoLat, window._savedVecinoLng]);
        actualizarEstadoGpsCheckoutUI();
      };

      marker.on('dragend', () => {
        const pos = marker.getLatLng();
        if (pos) fijarDesdeMapa(pos.lat, pos.lng);
      });
      mapa.on('click', (ev) => {
        if (ev?.latlng) fijarDesdeMapa(ev.latlng.lat, ev.latlng.lng);
      });

      window._chkLeafletMap = mapa;
      window._chkLeafletMarker = marker;
      setTimeout(() => { try { mapa.invalidateSize(); } catch (_) {} }, 160);
    }

    function toggleMapaPinCheckoutVecino() {
      STATE.mostrarMapaCheckoutVecino = !STATE.mostrarMapaCheckoutVecino;
      const wrap = document.getElementById('chk-mapa-wrapper');
      const btn = document.getElementById('chk-btn-toggle-mapa');
      if (wrap) wrap.style.display = STATE.mostrarMapaCheckoutVecino ? 'block' : 'none';
      if (btn) btn.textContent = STATE.mostrarMapaCheckoutVecino ? '🗺️ Ocultar mapa' : '🗺️ Marcar pin en mapa';
      if (STATE.mostrarMapaCheckoutVecino) {
        inicializarMapaCheckoutVecino();
      }
    }

    function capturarUbicacionActualCheckoutVecino() {
      const btn = document.getElementById('chk-btn-gps-actual');
      const statusEl = document.getElementById('chk-gps-status-txt');
      if (!navigator.geolocation) {
        if (statusEl) {
          statusEl.style.color = '#b45309';
          statusEl.textContent = 'Tu dispositivo no permite GPS automático desde el navegador. Podés confirmar igual con tu dirección.';
        }
        return;
      }
      if (btn) {
        btn.disabled = true;
        btn.textContent = '📡 Buscando GPS...';
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          if (btn) {
            btn.disabled = false;
            btn.textContent = '📍 Usar mi ubicación actual';
          }
          window._savedVecinoLat = Number(pos.coords.latitude.toFixed(7));
          window._savedVecinoLng = Number(pos.coords.longitude.toFixed(7));
          window._savedVecinoGpsOrigen = 'VECINO_GPS';
          window._savedVecinoDirPinBase = document.getElementById('chk-direccion')?.value || STATE.checkoutWiz.direccion || window._savedVecinoDir || '';
          STATE.mostrarMapaCheckoutVecino = true;
          const wrap = document.getElementById('chk-mapa-wrapper');
          const toggleBtn = document.getElementById('chk-btn-toggle-mapa');
          if (wrap) wrap.style.display = 'block';
          if (toggleBtn) toggleBtn.textContent = '🗺️ Ocultar mapa';
          actualizarEstadoGpsCheckoutUI();
          inicializarMapaCheckoutVecino();
        },
        () => {
          if (btn) {
            btn.disabled = false;
            btn.textContent = '📍 Usar mi ubicación actual';
          }
          if (statusEl) {
            statusEl.style.color = '#b45309';
            statusEl.textContent = 'No pudimos obtener tu ubicación automática (es 100% opcional: podés confirmar igual con tu calle escrita).';
          }
        },
        { enableHighAccuracy: true, timeout: 9000, maximumAge: 60000 }
      );
    }

    function renderCabeceraMarcaCheckoutWizard(pasoNumero, totalPasos, modoConfirmado = false) {
      const nodo = STATE.nodo || {};
      const prox = STATE.proximaEntrega?.asignada;
      const proxLabel = prox ? prox.label_completo : 'Próxima ventana';
      const logoHorizontal = nodo.tema_visual?.logos?.horizontal || '';
      const logoIncluyeTexto = Boolean(logoHorizontal && nodo.tema_visual?.logo_incluye_texto);
      const logoFallback = logoHorizontal || nodo.logo_original_base64 || nodo.logo_mono_preview_base64 || obtenerLogoIconoNodo(nodo) || '';
      const bajadaEfectiva = nodo.bajada_marca || nodo.subtitulo_marca || (nodo.barrio_zona ? `📍 ${nodo.barrio_zona}` : 'Tienda barrial');
      const altLogo = nodo.bajada_marca ? `${nodo.nombre_marca} · ${nodo.bajada_marca}` : (nodo.nombre_marca || 'Tienda');
      const siglas = String(nodo.nombre_marca || 'ND').split(/\s+/).map(w => w[0] || '').join('').substring(0, 2).toUpperCase();

      const identidadHtml = logoIncluyeTexto
        ? `<img src="${esc(logoHorizontal)}" class="chk-wiz-logo-horizontal" alt="${esc(altLogo)}">`
        : `
          <div class="chk-wiz-brand-std">
            ${logoFallback
              ? `<img src="${esc(logoFallback)}" alt="${esc(altLogo)}">`
              : `<div class="brand-monogram" style="width:44px;height:44px;border-radius:12px;">${esc(siglas)}</div>`}
            <div>
              <div class="chk-wiz-brand-name">${esc(nodo.nombre_marca || 'Mi Nodo')}</div>
              <div class="chk-wiz-brand-sub">${esc(bajadaEfectiva)}</div>
            </div>
          </div>
        `;

      const porcentajeAvance = modoConfirmado
        ? 100
        : Math.max(10, Math.min(100, Math.round((pasoNumero / Math.max(1, totalPasos)) * 100)));

      return `
        <header class="chk-wiz-header">
          <div class="chk-wiz-header-inner">
            <div class="chk-wiz-nav-row">
              <button type="button" id="chk-btn-volver" class="chk-btn-volver"
                onclick="${modoConfirmado ? 'cerrarModalCheckout()' : 'retrocederPasoCheckoutWizard()'}">
                ← Volver
              </button>
              ${modoConfirmado
                ? `<span class="chk-step-pill" style="background:var(--ok-soft);color:var(--ok);border-color:var(--ok-border);">✓ Pedido confirmado</span>`
                : `<span class="chk-step-pill" id="chk-step-indicator">Paso ${pasoNumero} de ${totalPasos}</span>`}
            </div>
            <div class="chk-wiz-brand-row">
              ${identidadHtml}
              <span class="chk-wiz-delivery-chip">📅 ${esc(proxLabel)}</span>
            </div>
          </div>
          <div class="chk-wiz-progress-track">
            <div class="chk-wiz-progress-fill" style="width:${porcentajeAvance}%; ${modoConfirmado ? 'background:var(--ok);' : ''}"></div>
          </div>
        </header>
      `;
    }

    function renderContenidoModalCheckout() {
      destruirMapaCheckoutVecino();
      const capEntrega = obtenerCapacidadesEntregaTienda();
      const w = STATE.checkoutWiz;
      const pasos = obtenerPasosCheckoutWizard();
      if (!pasos.includes(w.pasoActualKey)) {
        w.pasoActualKey = pasos[0];
      }
      const pasoIdx = pasos.indexOf(w.pasoActualKey);
      const pasoNumero = pasoIdx + 1;
      const totalPasos = pasos.length;

      if (w.modalidadElegida) {
        STATE.modalidadEntrega = w.modalidadElegida;
      }
      const res = calcularResumenCarrito();
      const prox = STATE.proximaEntrega?.asignada;
      const box = document.getElementById('checkout-card-content');

    async function enviarPedidoVecinal() {
      if (STATE.checkoutWiz.enviandoPedido) return;
      sincronizarInputsPasoVisibleCheckout();

      const w = STATE.checkoutWiz;
      STATE.modalidadEntrega = w.modalidadElegida || STATE.modalidadEntrega;

      const res = calcularResumenCarrito();
      const nombre = String(w.nombre || '').trim();
      const telefono = String(w.telefono || '').trim();
      const direccion = String(w.direccion || '').trim();
      const entrecalles = String(w.entrecalles || '').trim();

      if (!nombre || !telefono) {
        w.pasoActualKey = 'datos';
        renderContenidoModalCheckout();
        return;
      }
      if (STATE.modalidadEntrega === 'ENVIO_BARRIAL' && !direccion) {

        return;

      const btnConf = document.getElementById('chk-btn-confirmar-pedido');

        btnConf.disabled = true;
        btnConf.textContent = 'Confirmando tu pedido...';

      const dirCoincidePin = Number.isFinite(Number(window._savedVecinoLat)) &&
        Number.isFinite(Number(window._savedVecinoLng)) &&
        Number(window._savedVecinoLat) !== 0 &&
        (!window._savedVecinoDirPinBase || _normalizarDirCheckPin(direccion) === _normalizarDirCheckPin(window._savedVecinoDirPinBase));

      const payload = {
        visitor_id: obtenerVisitorIdTienda(),
        vecino_nombre: nombre,
        vecino_telefono: telefono,
        modalidad_entrega: STATE.modalidadEntrega,
        direccion_entrega: direccion,
        entrecalles_referencia: entrecalles,
        latitud: (STATE.modalidadEntrega === 'ENVIO_BARRIAL' && dirCoincidePin) ? Number(window._savedVecinoLat) : null,
        longitud: (STATE.modalidadEntrega === 'ENVIO_BARRIAL' && dirCoincidePin) ? Number(window._savedVecinoLng) : null,
        gps_origen: (STATE.modalidadEntrega === 'ENVIO_BARRIAL' && dirCoincidePin) ? (window._savedVecinoGpsOrigen || 'VECINO_GPS') : null,
        medio_pago: STATE.medioPago,
        fecha_hora_simulada: calcularFechaSimuladaCorte(),
        items: res.detalle.map(d => ({
          oferta_id: d.oferta_id,
          cantidad: d.cantidad
        }))
      };

      try {
        const resp = await fetch(`/api/produccion/nodos/tienda/${encodeURIComponent(STATE.slug)}/pedido`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await resp.json();
        if (!resp.ok || !data.ok) {
          w.enviandoPedido = false;
          alert(data.error || 'No se pudo registrar el pedido.');
          renderContenidoModalCheckout();
          return;

        const ped = data.pedido;
        const pagoInfo = data.nodo_pago_info;

          ? ped.items
          : res.detalle;

        STATE.carrito = {};
        renderCatalogo();
        actualizarBarraCarrito();

        if (ped) {
          STATE.ultimoPedidoConfirmado = {
            codigo_pedido: ped.codigo_pedido,
            items: itemsConfirmados
          };
          guardarIdentidadVecinoLocal({
            portal_token: ped.portal_token || STATE.portalToken || '',
            telefono_normalizado: ped.telefono_normalizado || '',
            telefono_display: telefono || ped.vecino_telefono || '',
            nombre_completo: ped.vecino_nombre || nombre || '',
            direccion_calle: direccion || '',
            entrecalles_referencia: entrecalles || ''
          });
          if (ped.tracking_token) {
            guardarPedidoRecienteLocal({
              codigo_pedido: ped.codigo_pedido,
              tracking_token: ped.tracking_token,
              vecino_nombre: ped.vecino_nombre,
              created_at: ped.created_at || new Date().toISOString()
            });
            refrescarBannerPedidosRecientes();
          }
          enviarTelemetriaTienda('pedido_confirmado', {
            pedido_id: ped.id,
            codigo_pedido: ped.codigo_pedido,
            tracking_token: ped.tracking_token || undefined,
            vecino_nombre: ped.vecino_nombre || nombre,
            vecino_telefono: telefono || ped.vecino_telefono,
            carrito_unidades: itemsConfirmados.reduce((acc, it) => acc + Number(it.cantidad || 1), 0),
            carrito_subtotal: Number(ped.total_vecino || 0),
            carrito_snapshot: []

              <div style="font-size:2.6rem;">🎉</div>
              <h2 style="margin:6px 0; color:#15803d; font-size:1.35rem; font-weight:900;">¡Pedido Confirmado! (${esc(ped.codigo_pedido)})</h2>
              <p style="margin:4px 0 16px 0; color:#475569; font-size:0.93rem; font-weight:700;">
                Gracias <strong>${esc(ped.vecino_nombre)}</strong>. Tu pedido en <strong>${esc(pagoInfo.nombre_marca)}</strong> ya quedó agendado.
              </p>

              <div style="background:#f0fdf4; border:1px solid #86efac; border-radius:14px; padding:14px; text-align:left; font-size:0.88rem; margin-bottom:14px;">
                <div>📅 <strong>Fecha y ventana de entrega:</strong> ${esc(ped.fecha_entrega_label)}</div>
                <div style="margin-top:4px;">📍 <strong>Modalidad:</strong> ${ped.modalidad_entrega === 'ENVIO_BARRIAL' ? `Envío a domicilio (${esc(ped.direccion_entrega)})` : `Retiro en punto de entrega (${esc(pagoInfo.direccion_retiro)})`}</div>
                ${itemsConfirmados.length > 0 ? `
                  <div style="margin-top:8px; padding-top:8px; border-top:1px dashed #86efac;">
                    <div style="font-size:0.75rem; font-weight:800; color:#166534; text-transform:uppercase; margin-bottom:4px;">🛒 Detalle del pedido</div>
                    ${itemsConfirmados.map(it => `
                      <div style="display:flex; justify-content:space-between; gap:8px; font-size:0.84rem; padding:2px 0;">
                        <span><strong>${Number(it.cantidad || 1)}x</strong> ${esc(formatearNombreItemConPresentacion(it))}</span>
                        <strong style="white-space:nowrap;">${fmt(it.subtotal_vecino ?? it.subtotal ?? 0)}</strong>
                      </div>
                    `).join('')}
                  </div>
                ` : ''}
                <div style="margin-top:6px; padding-top:6px; border-top:1px solid #86efac;">💰 <strong>Total del pedido:</strong> ${fmt(ped.total_vecino)}</div>
              </div>

              ${ped.medio_pago === 'TRANSFERENCIA' ? `
                <div style="background:#eff6ff; border:2px solid #60a5fa; border-radius:14px; padding:14px; text-align:left; margin-bottom:14px;">
                  <div style="font-size:0.78rem; font-weight:800; color:#1d4ed8; text-transform:uppercase;">🏦 Datos para Transferencia Bancaria</div>
                  <div style="font-size:1.15rem; font-weight:900; color:#0f172a; margin:6px 0;">
                    Alias: <span id="alias-copy-text">${esc(pagoInfo.alias || 'pago.canasto')}</span>
                  </div>
                  <div style="font-size:0.8rem; color:#334155;">Titular: ${esc(pagoInfo.titular || '')}${pagoInfo.cbu && pagoInfo.cbu !== '0000000000000000000000' ? ` · CBU: ${esc(pagoInfo.cbu)}` : ''}</div>
                  <button type="button" onclick="navigator.clipboard.writeText('${esc(pagoInfo.alias || 'pago.canasto')}'); this.textContent='✅ ¡Alias Copiado!';"
                    style="margin-top:8px; padding:8px 14px; border-radius:9px; border:1px solid #2563eb; background:#2563eb; color:#fff; font-weight:800; font-size:0.82rem; cursor:pointer;">
                    📋 Copiar Alias Bancario
                  </button>
                </div>
              ` : `
                <div style="background:#fef3c7; border:1px solid #fcd34d; border-radius:14px; padding:13px; text-align:left; font-size:0.88rem; color:#92400e; margin-bottom:14px;">
                  💵 <strong>Pago en Efectivo:</strong> Abonás <strong>${fmt(ped.total_vecino)}</strong> directamente al momento de recibir o retirar tu pedido.
                </div>
              `}

              ${ped.tracking_token ? `
                <div style="margin-bottom:12px;">
                  <button type="button" onclick="cerrarModalCheckout(); abrirSeguimientoPorToken('${esc(ped.tracking_token)}');"
                    style="width:100%; padding:13px 16px; border-radius:12px; border:1.5px solid var(--brand); background:var(--brand-light); color:var(--brand-dark); font-family:inherit; font-weight:900; font-size:0.94rem; cursor:pointer;">
                    📍 Seguir el estado de mi pedido en vivo →
                  </button>
                </div>
              ` : ''}

    let _trackingTimer = null;

    function _storageKeyIdentidadVecino(slug) {
      return `nodo_identidad_vecino_${slug || STATE.slug || 'default'}`;
    }

    function obtenerIdentidadVecinoLocal(slug = STATE.slug) {
      let base = {};
      try {
        const raw = localStorage.getItem(_storageKeyIdentidadVecino(slug));
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') base = parsed;
        }
      } catch (_) {}
      try {
        const legacyPortal = (localStorage.getItem(_storageKeyMiCuentaToken(slug)) || '').trim();
        if (legacyPortal.length >= 16 && !base.portal_token) {
          base.portal_token = legacyPortal;
        }
      } catch (_) {}
      return base;
    }

    function guardarIdentidadVecinoLocal(parcial = {}, slug = STATE.slug) {
      try {
        const actual = obtenerIdentidadVecinoLocal(slug);
        const fusion = {
          portal_token: (parcial.portal_token && String(parcial.portal_token).trim().length >= 16)
            ? String(parcial.portal_token).trim()
            : (actual.portal_token || ''),
          telefono_normalizado: parcial.telefono_normalizado || actual.telefono_normalizado || '',
          telefono_display: parcial.telefono_display || actual.telefono_display || '',
          nombre_completo: parcial.nombre_completo || actual.nombre_completo || '',
          direccion_calle: parcial.direccion_calle !== undefined ? (parcial.direccion_calle || actual.direccion_calle || '') : (actual.direccion_calle || ''),
          entrecalles_referencia: parcial.entrecalles_referencia !== undefined ? (parcial.entrecalles_referencia || actual.entrecalles_referencia || '') : (actual.entrecalles_referencia || ''),
          updated_at: new Date().toISOString()
        };
        localStorage.setItem(_storageKeyIdentidadVecino(slug), JSON.stringify(fusion));

        if (fusion.portal_token) {
          STATE.portalToken = fusion.portal_token;
          localStorage.setItem(_storageKeyMiCuentaToken(slug), fusion.portal_token);
        }
        if (fusion.nombre_completo) window._savedVecinoNombre = fusion.nombre_completo;
        if (fusion.telefono_display || fusion.telefono_normalizado) {
          window._savedVecinoTel = fusion.telefono_display || fusion.telefono_normalizado;
        }
        if (fusion.direccion_calle) window._savedVecinoDir = fusion.direccion_calle;
        if (fusion.entrecalles_referencia) window._savedVecinoRef = fusion.entrecalles_referencia;
        actualizarBotonesCabeceraMiCuenta();
      } catch (_) {}
    }

    function _storageKeyPedidosVecino() {
      return `nodo_ultimos_pedidos_${STATE.slug || 'default'}`;
    }

    function obtenerPedidosRecientesLocal() {
      try {
        const raw = localStorage.getItem(_storageKeyPedidosVecino());
        if (!raw) return [];
        const arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr.filter(x => x && x.tracking_token) : [];
      } catch (_) {
        return [];
      }
    }

    function guardarPedidoRecienteLocal(info) {
      if (!info || !info.tracking_token) return;
      try {
        const lista = obtenerPedidosRecientesLocal().filter(x => x.tracking_token !== info.tracking_token);
        lista.unshift({
          codigo_pedido: info.codigo_pedido || '',
          tracking_token: info.tracking_token,
          vecino_nombre: info.vecino_nombre || '',
          created_at: info.created_at || new Date().toISOString()
        });
        localStorage.setItem(_storageKeyPedidosVecino(), JSON.stringify(lista.slice(0, 8)));
      } catch (_) {}
    }

    function descartarBannerPedidoLocal(token) {
      try {
        const lista = obtenerPedidosRecientesLocal().filter(x => x.tracking_token !== token);
        localStorage.setItem(_storageKeyPedidosVecino(), JSON.stringify(lista));
      } catch (_) {}
      refrescarBannerPedidosRecientes();
    }

    function formatearFechaHoraHito(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      if (Number.isNaN(d.getTime())) return '';
      const hoy = new Date();
      const esHoy = d.getFullYear() === hoy.getFullYear() &&
        d.getMonth() === hoy.getMonth() &&
        d.getDate() === hoy.getDate();
      const hhmm = d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
      if (esHoy) return `Hoy ${hhmm} hs`;
      const ddmm = d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' });
      return `${ddmm} · ${hhmm} hs`;
    }

    function detenerPollingSeguimiento() {
      if (_trackingTimer) {
        clearInterval(_trackingTimer);
        _trackingTimer = null;
      }
    }

    function cerrarModalSeguimiento() {
      detenerPollingSeguimiento();
      _trackingTokenActivo = '';
      _trackingWhatsappActivo = null;
      const modal = document.getElementById('tracking-modal');
      if (modal) modal.style.display = 'none';
      try {
        const url = new URL(window.location.href);
        if (url.searchParams.has('seguimiento')) {
          url.searchParams.delete('seguimiento');
          window.history.replaceState({}, '', url.pathname + (url.search || ''));
        }
      } catch (_) {}
      refrescarBannerPedidosRecientes();
    }

    function _convertirPedidoPortalATrackingPayload(pedHist, portalData) {
      return {
        modo_privacidad_enmascarada: false,
        nodo: portalData.nodo,
        pedido: {
          ...pedHist,
          vecino_nombre: portalData.vecino?.nombre_completo || 'Vecino/a'
        },
        items: pedHist.items || [],
        seguimiento: pedHist.seguimiento,
        total_pedidos_vecino: (portalData.historial_pedidos || []).filter(x => !x.anulado).length
      };
    }

    /**
     * Acción inteligente en 1 toque al tocar "📦 Seguir mi pedido" en el catálogo:
     * 1) Si el celular ya conoce al vecino (`portal_token`, `tracking_token` o WhatsApp previo):
     *    - 1 pedido en tránsito -> abre directo su seguimiento en vivo sin pasos intermedios.
     *    - 2+ pedidos en tránsito -> muestra tarjetas directas listas para tocar.
     *    - 0 en tránsito pero con historial -> salta directo a su resumen/último pedido en Mi Cuenta (o último pedido).
     * 2) Si es un navegador limpio -> pide únicamente el número de WhatsApp (sin código #NB-...).
     */
    async function accionBotonSeguirMiPedido() {
      detenerPollingSeguimiento();
      _trackingTokenActivo = '';
      _trackingWhatsappActivo = null;

      const identidad = obtenerIdentidadVecinoLocal();
      const portalTok = STATE.portalToken || identidad.portal_token || '';
      const guardadosLocal = obtenerPedidosRecientesLocal();
      const telGuardado = identidad.telefono_display || identidad.telefono_normalizado || '';

      // Caso 1A: Vecino identificado con portal_token (vino de QR Mi Cuenta, link de comprobante o compra previa)
      if (portalTok && portalTok.length >= 16) {
        STATE.portalToken = portalTok;
        const modal = document.getElementById('tracking-modal');
        const box = document.getElementById('tracking-card-content');
        if (modal && box) {
          modal.style.display = 'flex';
          box.innerHTML = `<div style="padding:32px; text-align:center; color:var(--muted); font-weight:800;">⏳ Abriendo el estado en vivo de tu pedido...</div>`;
        }

        try {
          const resp = await fetch(
            `/api/produccion/nodos/tienda/${encodeURIComponent(STATE.slug)}/mi-cuenta/${encodeURIComponent(portalTok)}`,
            { cache: 'no-store' }
          );
          const data = await resp.json();
          if (resp.ok && data.ok) {
            STATE.miCuentaData = data;
            if (data.vecino) {
              guardarIdentidadVecinoLocal({
                portal_token: portalTok,
                telefono_normalizado: data.vecino.telefono_normalizado || '',
                telefono_display: data.vecino.telefono_whatsapp || '',
                nombre_completo: data.vecino.nombre_completo || '',
                direccion_calle: data.vecino.direccion_calle || '',
                entrecalles_referencia: data.vecino.entrecalles_referencia || ''
              });
            }
            const activos = (data.historial_pedidos || []).filter(p => !p.anulado);
            for (const p of activos.slice(0, 5).reverse()) {
              if (p.tracking_token) {
                guardarPedidoRecienteLocal({
                  codigo_pedido: p.codigo_pedido,
                  tracking_token: p.tracking_token,
                  vecino_nombre: data.vecino?.nombre_completo || '',
                  created_at: p.created_at
                });
              }
            }

            const enTransito = activos.filter(p => Number(p.seguimiento?.hito_actual || 1) < 6);
            if (enTransito.length === 1) {
              _activarVistaSeguimientoConDatos(_convertirPedidoPortalATrackingPayload(enTransito[0], data));
              return;
            }
            if (enTransito.length >= 2) {
              renderizarSelectorPedidosVecino(enTransito, activos, data.nodo, { modoTokenCompleto: true });
              return;
            }
            if (activos.length > 0) {
              // Sin pedidos en tránsito pero con historial -> salto directo a Mi Cuenta
              if (modal) modal.style.display = 'none';
              await activarVistaMiCuenta();
              return;
            }
            // Vecino identificado sin pedidos aún -> llevar a su resumen en Mi Cuenta
            if (modal) modal.style.display = 'none';
            await activarVistaMiCuenta();
            return;
          }
        } catch (_) {}
      }

      // Caso 1B: Sin portal_token previo pero con tracking_token guardado en este celular
      if (guardadosLocal.length === 1) {
        await abrirSeguimientoPorToken(guardadosLocal[0].tracking_token);
        return;
      }
      if (guardadosLocal.length >= 2) {
        // Consultar el primero para hidratar portal_token y mostrar selector completo si corresponde
        await abrirSeguimientoPorToken(guardadosLocal[0].tracking_token);
        return;
      }

      // Caso 1C: Celular donde ya consultó antes con su WhatsApp (sin token) -> salto directo sin volver a tipear
      if (telGuardado && String(telGuardado).replace(/\D+/g, '').length >= 8) {
        await ejecutarConsultaPorWhatsapp(telGuardado, { desdeMemoriaAutomatica: true });
        return;
      }

      // Caso 2: Navegador limpio -> pedir únicamente el número de WhatsApp
      abrirFormularioSoloWhatsapp(false);
    }

    async function ejecutarConsultaPorWhatsapp(telefonoRaw, opciones = {}) {
      const tel = String(telefonoRaw || '').trim();
      const modal = document.getElementById('tracking-modal');
      const box = document.getElementById('tracking-card-content');
      const errBox = document.getElementById('trk-buscar-error');
      const btn = document.getElementById('btn-ejecutar-busqueda-trk');

      if (!tel || tel.replace(/\D+/g, '').length < 8) {
        if (errBox) {
          errBox.textContent = 'Ingresá tu número de WhatsApp con código de área (ej: 221 501 1102).';
          errBox.style.display = 'block';
        } else {
          abrirFormularioSoloWhatsapp(false);
        }
        return;
      }

      if (errBox) errBox.style.display = 'none';
      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Buscando tu pedido...';
      } else if (modal && box && !opciones.silenciosoPolling) {
        modal.style.display = 'flex';
        box.innerHTML = `<div style="padding:32px; text-align:center; color:var(--muted); font-weight:800;">⏳ Consultando el estado en vivo de tu pedido...</div>`;
      }

      try {
        const resp = await fetch(`/api/produccion/nodos/tienda/${encodeURIComponent(STATE.slug)}/seguimiento-whatsapp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            telefono: tel,
            codigo_pedido: opciones.codigoPedidoEspecifico || ''
          })
        });
        const data = await resp.json();
        if (!resp.ok || !data.ok) {
          if (opciones.desdeMemoriaAutomatica) {
            abrirFormularioSoloWhatsapp(false);
            return;
          }
          if (errBox) {
            errBox.textContent = data.error || 'No encontramos pedidos asociados a ese WhatsApp.';
            errBox.style.display = 'block';
          }
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'Ver estado de mi pedido →';
          }
          return;
        }

        _ultimoResultadoWhatsapp = data;

        // Si cambió de WhatsApp en un navegador que tenía otro vecino, actualizar solo el teléfono recordado
        if (opciones.desdeFormularioManual) {
          const idActual = obtenerIdentidadVecinoLocal();
          const cambioTelefono = idActual.telefono_normalizado && idActual.telefono_normalizado !== data.telefono_normalizado;
          if (cambioTelefono) {
            try {
              localStorage.removeItem(_storageKeyMiCuentaToken(STATE.slug));
              localStorage.removeItem(_storageKeyPedidosVecino());
              STATE.portalToken = '';
              STATE.miCuentaData = null;
            } catch (_) {}
          }
        }

        guardarIdentidadVecinoLocal({
          telefono_normalizado: data.telefono_normalizado,
          telefono_display: tel
        });

        const enTransito = Array.isArray(data.pedidos_en_transito) ? data.pedidos_en_transito : [];
        const todos = Array.isArray(data.pedidos_todos) ? data.pedidos_todos : [];

        if (opciones.codigoPedidoEspecifico && data.pedido_especifico) {
          _activarVistaSeguimientoPorWhatsapp(data.pedido_especifico, tel, todos.length);
          return;
        }

        // 1 único pedido en tránsito -> abrir directo en 1 paso
        if (enTransito.length === 1) {
          _activarVistaSeguimientoPorWhatsapp(enTransito[0], tel, todos.length);
          return;
        }

        // 2 o más pedidos en tránsito -> mostrar selector directo para elegir con 1 toque
        if (enTransito.length >= 2) {
          renderizarSelectorPedidosVecino(
            enTransito.map(x => ({ ...x.pedido, items: x.items, seguimiento: x.seguimiento })),
            todos.map(x => ({ ...x.pedido, items: x.items, seguimiento: x.seguimiento })),
            data.nodo,
            { modoTokenCompleto: false, telefonoWhatsapp: tel }
          );
          return;
        }

        // Sin pedidos en tránsito pero con pedido reciente -> abrir directo el más reciente (o selector si > 1)
        if (todos.length === 1) {
          _activarVistaSeguimientoPorWhatsapp(todos[0], tel, 1);
          return;
        }
        if (todos.length > 1) {
          renderizarSelectorPedidosVecino(
            [],
            todos.map(x => ({ ...x.pedido, items: x.items, seguimiento: x.seguimiento })),
            data.nodo,
            { modoTokenCompleto: false, telefonoWhatsapp: tel }
          );
        }
      } catch (_) {
        if (errBox) {
          errBox.textContent = 'Error de conexión al consultar tu pedido.';
          errBox.style.display = 'block';
        }
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Ver estado de mi pedido →';
        }
      }
    }

    function _activarVistaSeguimientoPorWhatsapp(itemWa, telefonoUsado, totalPedidos = 1) {
      _trackingTokenActivo = '';
      _trackingWhatsappActivo = {
        telefono: telefonoUsado,
        codigo_pedido: itemWa.pedido.codigo_pedido

      renderizarVistaSeguimientoEnVivo({

        modo_privacidad_enmascarada: true,
        total_pedidos_vecino: totalPedidos

      detenerPollingSeguimiento();
      if (!itemWa.seguimiento?.anulado && Number(itemWa.seguimiento?.hito_actual || 1) < 6) {
        _trackingTimer = setInterval(() => {
          refrescarSeguimientoWhatsappActivo(true);

        renderizarSelectorPedidosVecino(
          enTransito.map(x => ({ ...x.pedido, items: x.items, seguimiento: x.seguimiento })),
          todos.map(x => ({ ...x.pedido, items: x.items, seguimiento: x.seguimiento })),
          _ultimoResultadoWhatsapp.nodo,
          { modoTokenCompleto: false }
        );
        return;
      }
      abrirFormularioSoloWhatsapp(true);
    }

    async function abrirSeguimientoPorToken(token, silencioso = false) {
      const cleanTok = String(token || '').trim();
      if (!cleanTok) return;
      const modal = document.getElementById('tracking-modal');
      const box = document.getElementById('tracking-card-content');
      if (!modal || !box) return;

      if (!silencioso) {
        modal.style.display = 'flex';
        box.innerHTML = `<div style="padding:32px; text-align:center; color:var(--muted); font-weight:800;">⏳ Cargando estado en vivo de tu pedido...</div>`;
      }

      try {
        const vidParam = encodeURIComponent(obtenerVisitorIdTienda());
        const endpointSeg = STATE.slug
          ? `/api/produccion/nodos/tienda/${encodeURIComponent(STATE.slug)}/seguimiento/${encodeURIComponent(cleanTok)}?vid=${vidParam}`
          : `/api/produccion/nodos/seguimiento/${encodeURIComponent(cleanTok)}?vid=${vidParam}`;
        const resp = await fetch(endpointSeg, {
          cache: 'no-store'
        });
        const data = await resp.json();
        if (!resp.ok || !data.ok) {
          if (!silencioso) {
            abrirFormularioSoloWhatsapp(false);
          }
          return;
        }

        if (data.identidad_vecino) {
          guardarIdentidadVecinoLocal({
            portal_token: data.identidad_vecino.portal_token || '',
            telefono_normalizado: data.identidad_vecino.telefono_normalizado || '',
            telefono_display: data.identidad_vecino.telefono_whatsapp || '',
            nombre_completo: data.identidad_vecino.nombre_completo || data.pedido?.vecino_nombre || ''
          });
        }
        if (!silencioso && data.pedido) {
          enviarTelemetriaTienda('vista_seguimiento', {
            nodo_slug: data.nodo?.slug || STATE.slug,
            pedido_id: data.pedido.id,
            codigo_pedido: data.pedido.codigo_pedido,
            tracking_token: cleanTok,
            vecino_nombre: data.identidad_vecino?.nombre_completo || data.pedido.vecino_nombre,
            vecino_telefono: data.identidad_vecino?.telefono_whatsapp || data.pedido.vecino_telefono
          }, 4000);
        }

        guardarPedidoRecienteLocal({
          codigo_pedido: data.pedido.codigo_pedido,
          tracking_token: data.pedido.tracking_token,
          vecino_nombre: data.pedido.vecino_nombre,
          created_at: data.pedido.created_at
        });
        _activarVistaSeguimientoConDatos(data);
      } catch (_) {
        if (!silencioso) {
          box.innerHTML = `<div style="padding:24px; text-align:center; color:#b91c1c; font-weight:800;">No se pudo actualizar el seguimiento. Verificá tu conexión.</div>`;
        }
      }
    }

    function _activarVistaSeguimientoConDatos(data) {
      const tok = data.pedido?.tracking_token || '';
      _trackingTokenActivo = tok;
      _trackingWhatsappActivo = null;

      const modal = document.getElementById('tracking-modal');
      if (modal) modal.style.display = 'flex';

      if (data.nodo) {
        aplicarPaletaTienda(data.nodo);
      }

      if (tok) {
        try {
          const url = new URL(window.location.href);
          if (!/^\/seguimiento\//i.test(url.pathname)) {
            url.searchParams.set('seguimiento', tok);
            window.history.replaceState({}, '', url.pathname + url.search);
          }
        } catch (_) {}
      }

      renderizarVistaSeguimientoEnVivo(data);

      detenerPollingSeguimiento();
      if (!data.seguimiento.anulado && Number(data.seguimiento.hito_actual) < 6 && tok) {
        _trackingTimer = setInterval(() => {
          if (_trackingTokenActivo) {
            abrirSeguimientoPorToken(_trackingTokenActivo, true);
          }
        }, 15000);
      }
    }

    function renderizarVistaSeguimientoEnVivo(data) {

      const nodo = data.nodo || {};

      const esEnmascarado = Boolean(data.modo_privacidad_enmascarada);
      const esEntregado = !seg.anulado && Number(seg.hito_actual) >= 6;
      const pct = seg.anulado
        ? 0
        : Math.min(100, Math.max(12, Math.round((Number(seg.paso_actual_orden || 1) / Math.max(1, Number(seg.total_pasos || 5))) * 100)));

      const pasoActualObj = pasos.find(p => p.es_actual) || pasos[0] || {};
      const tieneTok = Boolean(ped.tracking_token);
      const linkCompartir = tieneTok
        ? `${window.location.origin}/tienda/${encodeURIComponent(nodo.slug || STATE.slug)}?seguimiento=${encodeURIComponent(ped.tracking_token)}`
        : '';
      const esModoLabTracking = Boolean(data.modo_laboratorio);
      const telPruebasTracking = String(data.telefono_whatsapp_pruebas || '5492216615746').replace(/\D+/g, '') || '5492216615746';
      const armarHrefWaGestor = (textoBase) => {
        const telGestorDigits = String(nodo.gestor_telefono || '').replace(/\D+/g, '');
        if (!telGestorDigits && !esModoLabTracking) return '';
        if (esModoLabTracking) {
          const msgLab = `[PRUEBA LAB · Aviso a Gestor: ${nodo.gestor_nombre || 'Gestor'} (${nodo.gestor_telefono || '-'})]\n\n${textoBase}`;
          return `https://wa.me/${telPruebasTracking}?text=${encodeURIComponent(msgLab)}`;
        }
        const telWa = telGestorDigits.startsWith('54') ? telGestorDigits : `549${telGestorDigits}`;
        return `https://wa.me/${telWa}?text=${encodeURIComponent(textoBase)}`;

    // =========================================================================
    // PORTAL PERSONAL MARCA BLANCA: "MI CUENTA / MIS PEDIDOS" (QR CLIENTE)
    // =========================================================================
    let _miCuentaTimer = null;

    function _storageKeyMiCuentaToken(slug) {
      return `nodo_mi_cuenta_token_${slug || STATE.slug || 'default'}`;
    }

    function detectarPortalTokenEnUrl() {
      const params = new URLSearchParams(window.location.search);
      const qTok = (params.get('mi_cuenta') || '').trim();
      if (qTok.length >= 16) {
        return { token: qTok, abrirDirecto: true };
      }
      const parts = window.location.pathname.split('/').filter(Boolean);
      const idx = parts.indexOf('tienda');
      if (idx !== -1 && parts[idx + 2] && parts[idx + 2].toLowerCase() === 'mi-cuenta' && parts[idx + 3]) {
        const pTok = decodeURIComponent(parts[idx + 3]).trim();
        if (pTok.length >= 16) {
          return { token: pTok, abrirDirecto: true };
        }
      }
      try {
        const saved = (localStorage.getItem(_storageKeyMiCuentaToken(STATE.slug)) || '').trim();
        if (saved.length >= 16) {
          return { token: saved, abrirDirecto: false };
        }
      } catch (_) {}
      return { token: '', abrirDirecto: false };
    }

    function actualizarBotonesCabeceraMiCuenta() {
      const bnavTienda = document.getElementById('bnav-tienda');
      const bnavPedido = document.getElementById('bnav-pedido');
      if (bnavTienda) bnavTienda.classList.toggle('active', !STATE.vistaMiCuentaActiva);
      if (bnavPedido) bnavPedido.classList.toggle('active', Boolean(STATE.vistaMiCuentaActiva));

      const btnToggle = document.getElementById('btn-toggle-mi-cuenta');
      const btnSeguir = document.getElementById('btn-seguir-pedido-header');
      if (!btnToggle) return;

      if (!STATE.portalToken) {
        btnToggle.style.display = 'none';
        if (btnSeguir) btnSeguir.style.display = 'inline-flex';
        return;
      }

      btnToggle.style.display = 'inline-flex';
      if (STATE.vistaMiCuentaActiva) {
        btnToggle.innerHTML = '🛒 Ir al Catálogo';
        if (btnSeguir) btnSeguir.style.display = 'none';
      } else {
        const nombreCorto = STATE.miCuentaData?.vecino?.nombre_completo
          ? STATE.miCuentaData.vecino.nombre_completo.split(/\s+/)[0]
          : 'Mi Cuenta';
        btnToggle.innerHTML = `👤 ${esc(nombreCorto)} · Mi Cuenta`;
        if (btnSeguir) btnSeguir.style.display = 'inline-flex';
      }
    }

    function detenerPollingMiCuenta() {
      if (_miCuentaTimer) {
        clearInterval(_miCuentaTimer);
        _miCuentaTimer = null;
      }
    }

    async function activarVistaMiCuenta() {
      if (!STATE.portalToken) return;
      STATE.vistaMiCuentaActiva = true;
      const mcView = document.getElementById('mi-cuenta-view');
      const catWrap = document.getElementById('catalogo-tienda-wrapper');
      const cartBar = document.getElementById('cart-bar');
      if (mcView) mcView.style.display = 'flex';
      if (catWrap) catWrap.style.display = 'none';
      if (cartBar) cartBar.style.display = 'none';

      try {
        window.history.replaceState({}, '', `/tienda/${encodeURIComponent(STATE.slug)}/mi-cuenta/${encodeURIComponent(STATE.portalToken)}`);
      } catch (_) {}

      actualizarBotonesCabeceraMiCuenta();
      await cargarPortalMiCuenta(false);

      detenerPollingMiCuenta();
      _miCuentaTimer = setInterval(() => {
        if (STATE.vistaMiCuentaActiva && STATE.portalToken) {
          cargarPortalMiCuenta(true);
        }
      }, 15000);
    }

    function irACatalogoDesdeMiCuenta() {
      detenerPollingMiCuenta();
      STATE.vistaMiCuentaActiva = false;
      const mcView = document.getElementById('mi-cuenta-view');
      const catWrap = document.getElementById('catalogo-tienda-wrapper');
      if (mcView) mcView.style.display = 'none';
      if (catWrap) catWrap.style.display = 'block';

      try {
        window.history.replaceState({}, '', `/tienda/${encodeURIComponent(STATE.slug)}`);
      } catch (_) {}

      actualizarBotonesCabeceraMiCuenta();
      actualizarBarraCarrito();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function alternarVistaMiCuenta() {
      if (STATE.vistaMiCuentaActiva) {
        irACatalogoDesdeMiCuenta();
      } else {
        activarVistaMiCuenta();
      }
    }

    async function cargarPortalMiCuenta(silencioso = false) {
      if (!STATE.portalToken) return;
      const mcView = document.getElementById('mi-cuenta-view');
      if (mcView && !silencioso && !STATE.miCuentaData) {
        mcView.innerHTML = `
          <div class="mc-card" style="text-align:center; padding:34px 18px; color:var(--muted); font-weight:800;">
            ⏳ Cargando tu cuenta y el estado en vivo de tus pedidos...
          </div>
        `;
      }

      try {
        const vidParam = encodeURIComponent(obtenerVisitorIdTienda());
        const resp = await fetch(
          `/api/produccion/nodos/tienda/${encodeURIComponent(STATE.slug)}/mi-cuenta/${encodeURIComponent(STATE.portalToken)}?vid=${vidParam}`,
          { cache: 'no-store' }
        );
        const data = await resp.json();
        if (!resp.ok || !data.ok) {
          if (!silencioso && mcView) {
            mcView.innerHTML = `
              <div class="mc-card" style="text-align:center; padding:28px 18px;">
                <div style="font-size:2rem; margin-bottom:6px;">🔎</div>
                <h3 style="margin:0 0 6px 0;">Enlace personal no disponible</h3>
                <p style="font-size:0.88rem; color:var(--muted); margin:0 0 14px 0;">${esc(data.error || 'Verificá el código QR con el coordinador de tu barrio.')}</p>
                <button type="button" onclick="STATE.portalToken=''; irACatalogoDesdeMiCuenta();"
                  style="padding:10px 18px; border-radius:10px; border:none; background:var(--brand); color:#ffffff; font-family:inherit; font-weight:900; cursor:pointer;">
                  🛒 Ir al catálogo de la tienda
                </button>
              </div>
            `;
          }
          return;
        }

        STATE.miCuentaData = data;
        try {
          localStorage.setItem(_storageKeyMiCuentaToken(data.nodo?.slug || STATE.slug), STATE.portalToken);
        } catch (_) {}

        // Persistir identidad y pedidos activos del vecino en este celular (habilita salto en 1 toque en el catálogo)
        if (data.vecino) {
          guardarIdentidadVecinoLocal({
            portal_token: STATE.portalToken,
            telefono_normalizado: data.vecino.telefono_normalizado || '',
            telefono_display: data.vecino.telefono_whatsapp || '',
            nombre_completo: data.vecino.nombre_completo || '',
            direccion_calle: data.vecino.direccion_calle || '',
            entrecalles_referencia: data.vecino.entrecalles_referencia || ''
          }, data.nodo?.slug || STATE.slug);
        }
        if (Array.isArray(data.historial_pedidos)) {
          const activosSync = data.historial_pedidos.filter(p => !p.anulado && p.tracking_token);
          for (const p of activosSync.slice(0, 5).reverse()) {
            guardarPedidoRecienteLocal({
              codigo_pedido: p.codigo_pedido,
              tracking_token: p.tracking_token,
              vecino_nombre: data.vecino?.nombre_completo || '',
              created_at: p.created_at
            });
          }
          if (!STATE.vistaMiCuentaActiva) {
            refrescarBannerPedidosRecientes();
          }
        }

        if (data.nodo) {
          aplicarPaletaTienda(data.nodo);
        }
        if (data.nodo?.nombre_marca && STATE.vistaMiCuentaActiva) {
          document.title = `Mi Cuenta · ${data.nodo.nombre_marca}`;
        }

        actualizarBotonesCabeceraMiCuenta();
        if (STATE.vistaMiCuentaActiva) {
          renderizarPortalMiCuenta(data);
        }
      } catch (_) {
        if (!silencioso && mcView && !STATE.miCuentaData) {
          mcView.innerHTML = `<div class="mc-card" style="text-align:center; color:#b91c1c; font-weight:800;">Error de conexión al consultar tu cuenta.</div>`;
        }
