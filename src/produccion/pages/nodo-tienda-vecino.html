<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Tienda Barrial</title>
  <!-- /lamda-cloud-runtime.js omitido en apps externas de Nodos (Marca Blanca) -->
  <script>
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        }).catch(function(){});
      }
      localStorage.removeItem('lamda_prefer_mobile_home');
    } catch (_) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #a2553b;
      --brand-dark: #7d3e28;
      --brand-light: rgba(162, 85, 59, 0.11);
      --brand-border: rgba(162, 85, 59, 0.28);
      --bg: #faf7f3;
      --card: #ffffff;
      --surface-warm: #f5efe8;
      --text: #3e2519;
      --muted: #7d6a5f;
      --border: #eae1d7;
      --ok: #2f6f4e;
      --ok-soft: #eaf4ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 110px;
      -webkit-font-smoothing: antialiased;
    }
    /* Barra superior discreta sólo en Modo Espejo local */
    .lab-bar {
      background: #3e2519;
      color: #f5efe8;
      padding: 7px 16px;
      font-size: 0.76rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .lab-bar select, .lab-bar button, .lab-bar a {
      background: rgba(255,255,255,0.12);
      color: #fffdfb;
      border: 1px solid rgba(255,255,255,0.22);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: none;
      font-weight: 700;
      font-family: inherit;
    }
    .lab-bar button.active {
      background: #f59e0b;
      color: #3e2519;
      border-color: #f59e0b;
      font-weight: 800;
    }

    /* Cabecera Marca Blanca Cálida y Austera */
    .hero {
      background: #fffdfb;
      color: var(--text);
      padding: 20px 18px;
      border-bottom: 1px solid var(--border);
    }
    .hero-inner {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand-box {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-logo {
      width: 64px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .brand-logo img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .brand-monogram {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: var(--brand-light);
      border: 1px solid var(--brand-border);
      color: var(--brand-dark);
      font-weight: 900;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-title {
      margin: 0;
      font-size: 1.48rem;
      font-weight: 900;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .brand-sub {
      margin: 3px 0 0 0;
      font-size: 0.88rem;
      color: var(--muted);
      font-weight: 700;
    }
    .brand-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
      font-size: 0.78rem;
    }
    .brand-pill {
      background: var(--brand-light);
      border: 1px solid var(--brand-border);
      color: var(--brand-dark);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 800;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
      padding: 18px 16px;
    }

    /* Banner de Próxima Entrega y Punto de Corte */
    .delivery-banner {
      background: var(--card);
      border: 1px solid var(--brand-border);
      border-left: 4px solid var(--brand);
      border-radius: 16px;
      padding: 14px 18px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      box-shadow: 0 2px 10px rgba(62, 37, 25, 0.04);
    }
    .delivery-banner.after-cutoff {
      border-color: #f59e0b;
      border-left-color: #d97706;
      background: #fffbeb;
    }
    .delivery-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--brand-light);
      color: var(--brand-dark);
      margin-bottom: 5px;
      letter-spacing: 0.02em;
    }
    .delivery-banner.after-cutoff .delivery-badge {
      background: #fef3c7;
      color: #b45309;
    }
    .delivery-date-main {
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--text);
    }
    .delivery-note {
      font-size: 0.83rem;
      color: var(--muted);
      font-weight: 600;
      margin-top: 3px;
    }

    /* Buscador y Categorías */
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 18px;
    }
    .search-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text);
      background: var(--card);
      outline: none;
    }
    .search-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-light);
    }
    .cats-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .cat-btn {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 0.83rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .cat-btn.active {
      background: var(--brand);
      color: #ffffff;
      border-color: var(--brand);
    }

    /* Grilla de Productos */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }
    .prod-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    }
    .prod-card:hover {
      transform: translateY(-2px);
      border-color: var(--brand-border);
      box-shadow: 0 8px 20px rgba(62, 37, 25, 0.06);
    }
    .prod-cat {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .prod-title {
      font-size: 1.02rem;
      font-weight: 900;
      color: var(--text);
      margin: 4px 0 6px 0;
      line-height: 1.3;
    }
    .prod-pres {
      display: inline-block;
      background: var(--surface-warm);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 8px;
    }
    .prod-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .prod-price {
      font-size: 1.24rem;
      font-weight: 900;
      color: var(--text);
    }
    .btn-add {
      background: var(--brand);
      color: #ffffff;
      border: none;
      padding: 9px 16px;
      border-radius: 10px;
      font-weight: 800;
      font-family: inherit;
      font-size: 0.86rem;
      cursor: pointer;
    }
    .btn-add:hover {
      background: var(--brand-dark);
    }
    .stepper {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--brand-light);
      padding: 4px 8px;
      border-radius: 10px;
      border: 1px solid var(--brand-border);
    }
    .stepper button {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      border: none;
      background: var(--brand);
      color: #ffffff;
      font-weight: 900;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
    }
    .stepper span {
      font-weight: 900;
      min-width: 18px;
      text-align: center;
      color: var(--brand-dark);
    }

    /* Barra flotante inferior de Carrito */
    .cart-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 680px;
      background: #3e2519;
      color: #fffdfb;
      padding: 14px 20px;
      border-radius: 16px;
      display: none;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 12px 28px rgba(62, 37, 25, 0.28);
      z-index: 90;
    }
    .cart-bar-btn {
      background: var(--brand);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 800;
      font-family: inherit;
      font-size: 0.92rem;
      cursor: pointer;
    }

    /* Modal Checkout */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(62, 37, 25, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 200;
      overflow-y: auto;
    }
    .modal-card {
      background: var(--card);
      width: 100%;
      max-width: 580px;
      border-radius: 18px;
      padding: 22px;
      max-height: 92vh;
      overflow-y: auto;
      box-shadow: 0 20px 45px rgba(62, 37, 25, 0.25);
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 0.92rem;
      font-family: inherit;
      color: var(--text);
    }
    .option-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    @media (max-width: 520px) {
      .option-grid {
        grid-template-columns: 1fr;
      }
    }
    .opt-card {
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 11px;
      cursor: pointer;
      text-align: left;
      background: var(--card);
      transition: all 0.15s;
    }
    .opt-card.active {
      border-color: var(--brand);
      background: var(--brand-light);
    }
    .opt-title {
      font-weight: 900;
      font-size: 0.88rem;
      color: var(--text);
    }
    .opt-sub {
      font-size: 0.76rem;
      color: var(--muted);
      font-weight: 600;
      margin-top: 2px;
    }

    /* Seguimiento en Vivo Marca Blanca (Estilo Mercado Libre) */
    .btn-track-header {
      background: var(--brand-light);
      color: var(--brand-dark);
      border: 1.5px solid var(--brand-border);
      padding: 9px 15px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-track-header:hover {
      background: var(--brand);
      color: #ffffff;
      border-color: var(--brand);
    }
    .active-order-banner {
      background: linear-gradient(135deg, #fffdfb 0%, #f5efe8 100%);
      border: 1.5px solid var(--brand-border);
      border-radius: 16px;
      padding: 13px 16px;
      margin-bottom: 14px;
      display: none;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: 0 4px 14px rgba(62, 37, 25, 0.06);
    }
    .trk-hero-box {
      background: linear-gradient(135deg, var(--surface-warm) 0%, #fffdfb 100%);
      border: 1.5px solid var(--brand-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .trk-hero-box.completed {
      background: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 100%);
      border-color: #86efac;
    }
    .trk-progress-track {
      width: 100%;
      height: 8px;
      background: #e7ddd3;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 12px;
    }
    .trk-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--brand) 0%, #16a34a 100%);
      border-radius: 999px;
      transition: width 0.35s ease;
    }
    .trk-timeline {
      position: relative;
      padding: 4px 0 4px 6px;
      margin: 0 0 16px 0;
    }
    .trk-step {
      display: flex;
      gap: 14px;
      position: relative;
      padding-bottom: 18px;
    }
    .trk-step:last-child {
      padding-bottom: 2px;
    }
    .trk-step:not(:last-child)::before {
      content: '';
      position: absolute;
      left: 15px;
      top: 32px;
      bottom: 0;
      width: 2.5px;
      background: #e5dcd2;
    }
    .trk-step.done:not(:last-child)::before {
      background: #16a34a;
    }
    .trk-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.92rem;
      font-weight: 900;
      background: #f3ede6;
      border: 2px solid #d8cbc0;
      color: var(--muted);
      z-index: 1;
    }
    .trk-step.done .trk-dot {
      background: #dcfce7;
      border-color: #16a34a;
      color: #15803d;
    }
    .trk-step.current .trk-dot {
      background: var(--brand);
      border-color: var(--brand-dark);
      color: #ffffff;
      box-shadow: 0 0 0 5px var(--brand-light);
      animation: trkPulse 2s infinite;
    }
    .trk-step.done.current.final-step .trk-dot {
      background: #16a34a;
      border-color: #15803d;
      box-shadow: 0 0 0 5px rgba(22, 163, 74, 0.18);
    }
    @keyframes trkPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    .trk-step-body {
      flex: 1;
      min-width: 0;
      padding-top: 3px;
    }
    .trk-step-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }
    .trk-step-title {
      font-size: 0.93rem;
      font-weight: 800;
      color: var(--muted);
    }
    .trk-step.done .trk-step-title {
      color: var(--text);
    }
    .trk-step.current .trk-step-title {
      font-size: 1rem;
      font-weight: 900;
      color: var(--brand-dark);
    }
    .trk-step.done.current.final-step .trk-step-title {
      color: #15803d;
    }
    .trk-step-time {
      font-size: 0.74rem;
      font-weight: 800;
      color: #15803d;
      background: #ecfdf5;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .trk-step-desc {
      font-size: 0.81rem;
      color: var(--muted);
      margin-top: 3px;
      line-height: 1.38;
      font-weight: 600;
    }
    .trk-live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #16a34a;
      margin-right: 5px;
    }

    /* Vista Personal Marca Blanca: "Mi Cuenta / Mis Pedidos" */
    .mc-shell {
      display: none;
      flex-direction: column;
      gap: 16px;
    }
    .mc-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 4px 16px rgba(62, 37, 25, 0.05);
    }
    .mc-balance-ok {
      background: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 100%);
      border: 1.5px solid #86efac;
    }
    .mc-balance-due {
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      border: 1.5px solid #fcd34d;
    }
    .mc-kpis-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 14px;
    }
    @media (max-width: 560px) {
      .mc-kpis-row {
        grid-template-columns: 1fr;
      }
    }
    .mc-kpi-pill {
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(62, 37, 25, 0.1);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .mc-history-item {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      background: #fffdfb;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.15s;
    }
    .mc-history-item:hover {
      border-color: var(--brand-border);
    }
    .btn-header-primary {
      background: var(--brand);
      color: #ffffff;
      border: 1.5px solid var(--brand);
      padding: 9px 15px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-header-primary:hover {
      background: var(--brand-dark);
      border-color: var(--brand-dark);
    }
  </style>
</head>
<body>

  <!-- Barra exclusiva para Modo Espejo en PC Local (oculta siempre en la tienda real del vecino) -->
  <div id="tienda-espejo-bar" class="lab-bar" style="display:none;">
    <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
      <span>📱 <strong>Modo Espejo LAMDA (Vista del Vecino):</strong></span>
      <button type="button" id="btn-sim-antes" class="active" onclick="simularHorarioCorte(false)">🕒 Antes del horario de corte</button>
      <button type="button" id="btn-sim-despues" onclick="simularHorarioCorte(true)">⏭️ Después del horario de corte</button>
    </div>
  </div>

  <!-- Encabezado Marca Blanca del Nodo -->
  <header class="hero">
    <div class="hero-inner">
      <div class="brand-box">
        <div class="brand-logo" id="brand-logo-box"></div>
        <div>
          <h1 class="brand-title" id="brand-name">Cargando tienda...</h1>
          <p class="brand-sub" id="brand-subtitle"></p>
          <div class="brand-meta">
            <span class="brand-pill" id="brand-zone">📍 Barrio</span>
            <span class="brand-pill" id="brand-manager">👤 Gestor</span>
          </div>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;" id="hero-actions-box">
        <button type="button" id="btn-toggle-mi-cuenta" class="btn-header-primary" style="display:none;" onclick="alternarVistaMiCuenta()">
          👤 Mi Cuenta
        </button>
        <button type="button" id="btn-seguir-pedido-header" class="btn-track-header" onclick="accionBotonSeguirMiPedido()">
          📦 Seguir mi pedido
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Vista Personal Marca Blanca del Comprador ("Mi Cuenta / Mis Pedidos") -->
    <section id="mi-cuenta-view" class="mc-shell"></section>

    <!-- Bloque Catálogo de la Tienda Pública -->
    <div id="catalogo-tienda-wrapper">
      <!-- Banner recordatorio de pedido activo del vecino en este dispositivo -->
      <div class="active-order-banner" id="mis-pedidos-recientes-banner"></div>

      <!-- Aviso de Próxima Fecha de Entrega según Punto de Corte -->
      <div class="delivery-banner" id="delivery-banner">
        <div>
          <span class="delivery-badge" id="delivery-badge-status">📅 Próxima Entrega</span>
          <div class="delivery-date-main" id="delivery-date-text">Calculando próxima entrega...</div>
          <div class="delivery-note" id="delivery-cutoff-note"></div>
        </div>
        <div style="text-align:right; font-size:0.82rem; color:var(--text);" id="delivery-pickup-address"></div>
      </div>

      <!-- Buscador y Filtro de Categorías -->
      <div class="toolbar">
        <input type="text" id="search-box" class="search-input" placeholder="🔍 Buscar almendras, nueces, mixes, granolas, barritas..." oninput="renderCatalogo()" />
        <div class="cats-row" id="cats-row"></div>
      </div>

      <!-- Grilla de Productos Publicados por el Gestor -->
      <div class="products-grid" id="products-grid"></div>
    </div>
  </main>

  <!-- Barra Flotante del Carrito -->
  <div class="cart-bar" id="cart-bar">
    <div>
      <div style="font-size:0.78rem; color:#d9c8bb; font-weight:700;" id="cart-count-label">0 productos en tu pedido</div>
      <div style="font-size:1.22rem; font-weight:900;" id="cart-total-label">$0</div>
    </div>
    <button type="button" class="cart-bar-btn" onclick="abrirModalCheckout()">
      Continuar con mi pedido →
    </button>
  </div>

  <!-- Modal de Confirmación de Pedido Vecinal -->
  <div class="modal-backdrop" id="checkout-modal">
    <div class="modal-card" id="checkout-card-content"></div>
  </div>

  <!-- Modal Marca Blanca de Seguimiento en Vivo / Buscador de Pedido -->
  <div class="modal-backdrop" id="tracking-modal" onclick="if(event.target===this) cerrarModalSeguimiento()">
    <div class="modal-card" id="tracking-card-content"></div>
  </div>

  <script>
    const STATE = {
      slug: '',
      nodo: null,
      nodosDisponibles: [],
      proximaEntrega: null,
      productos: [],
      categoriaActiva: 'TODAS',
      carrito: {}, // { oferta_id: cantidad }
      modalidadEntrega: 'RETIRO_NODO',
      medioPago: 'TRANSFERENCIA',
      simularDespuesDeCorte: false,
      portalToken: '',
      vistaMiCuentaActiva: false,
      miCuentaData: null
    };

    function fmt(n) {
      return '$' + Math.round(Number(n) || 0).toLocaleString('es-AR');
    }

    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function aplicarPaletaTienda(hex) {
      const clean = /^#[0-9a-fA-F]{6}$/.test(String(hex || '').trim()) ? String(hex).trim() : '#a2553b';
      const r = parseInt(clean.slice(1, 3), 16);
      const g = parseInt(clean.slice(3, 5), 16);
      const b = parseInt(clean.slice(5, 7), 16);
      const darkR = Math.max(0, Math.round(r * 0.78));
      const darkG = Math.max(0, Math.round(g * 0.78));
      const darkB = Math.max(0, Math.round(b * 0.78));
      const darkHex = '#' + [darkR, darkG, darkB].map(v => v.toString(16).padStart(2, '0')).join('');

      const root = document.documentElement;
      root.style.setProperty('--brand', clean);
      root.style.setProperty('--brand-dark', darkHex);
      root.style.setProperty('--brand-light', `rgba(${r}, ${g}, ${b}, 0.11)`);
      root.style.setProperty('--brand-border', `rgba(${r}, ${g}, ${b}, 0.28)`);
    }

    function detectarSlugInicial() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('nodo')) return params.get('nodo');
      const parts = window.location.pathname.split('/').filter(Boolean);
      const idx = parts.indexOf('tienda');
      if (idx !== -1 && parts[idx + 1]) return decodeURIComponent(parts[idx + 1]);
      return 'lo-de-mati';
    }

    function calcularFechaSimuladaCorte() {
      if (!STATE.simularDespuesDeCorte || !STATE.proximaEntrega?.asignada) return '';
      const tsCorte = Number(STATE.proximaEntrega.asignada.timestamp_corte || Date.now());
      return new Date(tsCorte + 2 * 3600 * 1000).toISOString();
    }

    function esModoEspejoLocal() {
      const params = new URLSearchParams(window.location.search);
      const esLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      return esLocal && params.get('modo_espejo') === '1';
    }

    async function cargarTienda(fechaSimuladaIso = '') {
      const espejoBar = document.getElementById('tienda-espejo-bar');
      if (espejoBar) {
        espejoBar.style.display = esModoEspejoLocal() ? 'flex' : 'none';
      }
      const q = fechaSimuladaIso ? `?fecha_simulada=${encodeURIComponent(fechaSimuladaIso)}` : '';
      const resp = await fetch(`/api/produccion/nodos/portal/${encodeURIComponent(STATE.slug)}${q}`);
      const data = await resp.json();
      if (!data.ok) {
        const grid = document.getElementById('products-grid');
        if (grid) {
          grid.innerHTML = `
            <div style="grid-column: 1/-1; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:32px; text-align:center;">
              <h3 style="margin:0 0 8px 0;">Tienda Vecinal no disponible</h3>
              <p style="color:var(--muted); font-size:0.9rem; max-width:500px; margin:0 auto;">
                Verificá el enlace compartido por el coordinador de tu barrio.
              </p>
            </div>
          `;
        }
        return;
      }

      STATE.nodo = data.nodo;
      STATE.slug = data.nodo.slug;
      STATE.nodosDisponibles = data.nodos_disponibles || [];
      STATE.proximaEntrega = data.proxima_entrega;
      STATE.productos = data.ofertas_publicadas || [];

      // Aplicar paleta cálida personalizada del Nodo
      aplicarPaletaTienda(STATE.nodo.color_primario || '#a2553b');
      document.title = `${STATE.nodo.nombre_marca} — Tienda Vecinal`;

      // Renderizar cabecera
      document.getElementById('brand-name').textContent = STATE.nodo.nombre_marca;
      document.getElementById('brand-subtitle').textContent = STATE.nodo.subtitulo_marca || 'Pedidos comunitarios del barrio';
      document.getElementById('brand-zone').textContent = `📍 ${STATE.nodo.barrio_zona || 'Zona Barrial'}`;
      document.getElementById('brand-manager').textContent = `👤 Coordina: ${STATE.nodo.gestor_nombre}`;

      const logoBox = document.getElementById('brand-logo-box');
      const logoSrc = STATE.nodo.logo_original_base64 || STATE.nodo.logo_mono_preview_base64 || '';
      if (logoSrc) {
        logoBox.innerHTML = `<img src="${logoSrc}" alt="${esc(STATE.nodo.nombre_marca)}">`;
      } else {
        const siglas = String(STATE.nodo.nombre_marca || 'ND').split(/\s+/).map(w => w[0] || '').join('').substring(0, 2).toUpperCase();
        logoBox.innerHTML = `<div class="brand-monogram">${esc(siglas)}</div>`;
      }

      renderBannerEntrega();
      renderCategorias();
      renderCatalogo();
      actualizarBarraCarrito();
      refrescarBannerPedidosRecientes();
    }

    function simularHorarioCorte(despues) {
      STATE.simularDespuesDeCorte = Boolean(despues);
      document.getElementById('btn-sim-antes').classList.toggle('active', !despues);
      document.getElementById('btn-sim-despues').classList.toggle('active', despues);

      if (despues && STATE.proximaEntrega?.asignada) {
        const tsAfter = Number(STATE.proximaEntrega.asignada.timestamp_corte) + 2 * 3600 * 1000;
        cargarTienda(new Date(tsAfter).toISOString());
      } else {
        cargarTienda('');
      }
    }

    function cambiarNodoTienda(nuevoSlug) {
      STATE.slug = nuevoSlug;
      STATE.carrito = {};
      STATE.simularDespuesDeCorte = false;
      window.history.replaceState({}, '', `/tienda/${encodeURIComponent(nuevoSlug)}`);
      cargarTienda('');
    }

    function renderBannerEntrega() {
      const banner = document.getElementById('delivery-banner');
      const badge = document.getElementById('delivery-badge-status');
      const mainTxt = document.getElementById('delivery-date-text');
      const noteTxt = document.getElementById('delivery-cutoff-note');
      const addrTxt = document.getElementById('delivery-pickup-address');

      const prox = STATE.proximaEntrega;
      if (!prox || !prox.asignada) return;

      const pasoCorte = Boolean(prox.paso_horario_corte);
      banner.classList.toggle('after-cutoff', pasoCorte);

      badge.textContent = pasoCorte
        ? '⏭️ Horario de corte superado · Asignado a próxima fecha'
        : '📅 Pedidos abiertos para esta semana';

      mainTxt.textContent = `Entrega: ${prox.asignada.label_completo}`;
      noteTxt.textContent = prox.mensaje_vecino;

      const envioTxt = STATE.nodo.permitir_envio_barrial
        ? `🛵 Envío a domicilio en el barrio: ${Number(STATE.nodo.cargo_envio_barrial) > 0 ? fmt(STATE.nodo.cargo_envio_barrial) : 'Sin cargo'}`
        : '🏠 Modalidad: Retiro por el Nodo';

      addrTxt.innerHTML = `
        <div><strong>🏠 Punto de retiro:</strong> ${esc(STATE.nodo.direccion_retiro || STATE.nodo.barrio_zona)}</div>
        <div style="margin-top:3px; color:var(--brand-dark); font-weight:800;">${envioTxt}</div>
      `;
    }

    function renderCategorias() {
      const catsSet = new Set(['TODAS']);
      STATE.productos.forEach(p => {
        if (p.categoria_familiar) catsSet.add(p.categoria_familiar);
      });
      const row = document.getElementById('cats-row');
      if (STATE.productos.length === 0) {
        row.innerHTML = '';
        return;
      }
      row.innerHTML = Array.from(catsSet).map(cat => `
        <button type="button" class="cat-btn ${STATE.categoriaActiva === cat ? 'active' : ''}"
          onclick="STATE.categoriaActiva='${esc(cat)}'; renderCategorias(); renderCatalogo();">
          ${cat === 'TODAS' ? 'Todos los productos' : esc(cat)}
        </button>
      `).join('');
    }

    function renderCatalogo() {
      const grid = document.getElementById('products-grid');
      if (STATE.productos.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:34px 20px; text-align:center;">
            <div style="font-size:1.02rem; font-weight:900; color:var(--text); margin-bottom:6px;">Próximamente disponibles</div>
            <div style="font-size:0.88rem; color:var(--muted); max-width:440px; margin:0 auto;">
              Estamos preparando la selección de productos para la próxima entrega del barrio.
            </div>
          </div>
        `;
        return;
      }

      const q = (document.getElementById('search-box')?.value || '').trim().toLowerCase();
      const terms = q.split(/\s+/).filter(Boolean);

      const filtrados = STATE.productos.filter(p => {
        if (STATE.categoriaActiva !== 'TODAS' && p.categoria_familiar !== STATE.categoriaActiva) return false;
        if (terms.length === 0) return true;
        const bolsa = `${p.nombre_publico} ${p.categoria_familiar} ${p.presentacion_etiqueta || ''}`.toLowerCase();
        return terms.every(t => bolsa.includes(t));
      });

      if (filtrados.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:36px; color:var(--muted); font-weight:700;">No encontramos productos con ese filtro.</div>`;
        return;
      }

      grid.innerHTML = filtrados.map(p => {
        const cant = Number(STATE.carrito[p.oferta_id] || 0);
        return `
          <div class="prod-card">
            <div>
              <div class="prod-cat">${esc(p.categoria_familiar || 'Almacén Natural')}</div>
              <div class="prod-title">${esc(p.nombre_publico)}</div>
              <span class="prod-pres">${esc(p.presentacion_etiqueta || `${Math.round(p.kilos_unidad * 1000)}g`)}</span>
            </div>
            <div class="prod-footer">
              <div class="prod-price">${fmt(p.precio_venta_vecino)}</div>
              ${cant === 0
                ? `<button type="button" class="btn-add" onclick="modificarCarrito(${p.oferta_id}, 1)">+ Agregar</button>`
                : `<div class="stepper">
                     <button type="button" onclick="modificarCarrito(${p.oferta_id}, -1)">−</button>
                     <span>${cant}</span>
                     <button type="button" onclick="modificarCarrito(${p.oferta_id}, 1)">+</button>
                   </div>`
              }
            </div>
          </div>
        `;
      }).join('');
    }

    function modificarCarrito(ofertaId, delta) {
      const actual = Number(STATE.carrito[ofertaId] || 0);
      const nuevo = Math.max(0, actual + delta);
      if (nuevo === 0) delete STATE.carrito[ofertaId];
      else STATE.carrito[ofertaId] = nuevo;
      renderCatalogo();
      actualizarBarraCarrito();
    }

    function calcularResumenCarrito() {
      let unidades = 0;
      let subtotal = 0;
      const detalle = [];
      for (const p of STATE.productos) {
        const c = Number(STATE.carrito[p.oferta_id] || 0);
        if (c > 0) {
          unidades += c;
          subtotal += c * Number(p.precio_venta_vecino);
          detalle.push({ ...p, cantidad: c, subtotal: c * Number(p.precio_venta_vecino) });
        }
      }
      const costoEnvio = (STATE.modalidadEntrega === 'ENVIO_BARRIAL' && STATE.nodo?.permitir_envio_barrial)
        ? Number(STATE.nodo.cargo_envio_barrial || 0)
        : 0;
      return {
        unidades,
        subtotal,
        costoEnvio,
        total: subtotal + costoEnvio,
        detalle
      };
    }

    function actualizarBarraCarrito() {
      const res = calcularResumenCarrito();
      const bar = document.getElementById('cart-bar');
      if (res.unidades === 0) {
        bar.style.display = 'none';
        return;
      }
      bar.style.display = 'flex';
      document.getElementById('cart-count-label').textContent = `${res.unidades} ${res.unidades === 1 ? 'producto' : 'productos'} en tu canasto`;
      document.getElementById('cart-total-label').textContent = fmt(res.subtotal);
    }

    function abrirModalCheckout() {
      const res = calcularResumenCarrito();
      if (res.unidades === 0) return;

      const modal = document.getElementById('checkout-modal');
      modal.style.display = 'flex';
      renderContenidoModalCheckout();
    }

    function cerrarModalCheckout() {
      document.getElementById('checkout-modal').style.display = 'none';
    }

    function renderContenidoModalCheckout() {
      const res = calcularResumenCarrito();
      const prox = STATE.proximaEntrega?.asignada;
      const box = document.getElementById('checkout-card-content');

      box.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:14px;">
          <div>
            <h2 style="margin:0; font-size:1.2rem; font-weight:900;">🧺 Confirmar Pedido Vecinal</h2>
            <div style="font-size:0.8rem; color:var(--brand-dark); font-weight:800; margin-top:2px;">
              📅 Entrega asignada: ${esc(prox ? prox.label_completo : 'Próxima ventana')}
            </div>
          </div>
          <button type="button" onclick="cerrarModalCheckout()" style="background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--muted);">&times;</button>
        </div>

        <!-- Resumen de ítems -->
        <div style="background:var(--surface-warm); border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin-bottom:14px; max-height:160px; overflow-y:auto;">
          ${res.detalle.map(it => `
            <div style="display:flex; justify-content:space-between; font-size:0.86rem; padding:4px 0; border-bottom:1px dashed var(--border);">
              <span><strong>${it.cantidad}x</strong> ${esc(it.nombre_publico)}</span>
              <strong>${fmt(it.subtotal)}</strong>
            </div>
          `).join('')}
        </div>

        <!-- Elección de Retiro o Envío Barrial -->
        <label style="display:block; font-size:0.8rem; font-weight:800; color:var(--text); margin-bottom:6px;">1. ¿Cómo preferís recibir tu pedido?</label>
        <div class="option-grid">
          <div class="opt-card ${STATE.modalidadEntrega === 'RETIRO_NODO' ? 'active' : ''}"
               onclick="STATE.modalidadEntrega='RETIRO_NODO'; renderContenidoModalCheckout();">
            <div class="opt-title">🏠 Retiro por el Nodo (Gratis)</div>
            <div class="opt-sub">${esc(STATE.nodo.direccion_retiro || STATE.nodo.barrio_zona)}</div>
          </div>
          ${STATE.nodo.permitir_envio_barrial ? `
            <div class="opt-card ${STATE.modalidadEntrega === 'ENVIO_BARRIAL' ? 'active' : ''}"
                 onclick="STATE.modalidadEntrega='ENVIO_BARRIAL'; renderContenidoModalCheckout();">
              <div class="opt-title">🛵 Envío a Domicilio (+${fmt(STATE.nodo.cargo_envio_barrial)})</div>
              <div class="opt-sub">Reparto barrial en ${esc(STATE.nodo.barrio_zona || 'la zona')}</div>
            </div>
          ` : ''}
        </div>

        <!-- Datos del vecino -->
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
          <div class="form-group">
            <label>Tu Nombre y Apellido *</label>
            <input type="text" id="chk-nombre" placeholder="Ej: María Laura Gómez" value="${esc(window._savedVecinoNombre || '')}" oninput="window._savedVecinoNombre=this.value">
          </div>
          <div class="form-group">
            <label>Tu WhatsApp *</label>
            <input type="text" id="chk-telefono" placeholder="Ej: 221 661 5746" value="${esc(window._savedVecinoTel || '221 661 5746')}" oninput="window._savedVecinoTel=this.value">
          </div>
        </div>

        ${STATE.modalidadEntrega === 'ENVIO_BARRIAL' ? `
          <div style="display:grid; grid-template-columns: 1.2fr 0.8fr; gap:10px;">
            <div class="form-group">
              <label>Dirección de entrega en el barrio *</label>
              <input type="text" id="chk-direccion" placeholder="Calle y número (ej: Calle 473 bis N° 1120)" value="${esc(window._savedVecinoDir || '')}" oninput="window._savedVecinoDir=this.value">
            </div>
            <div class="form-group">
              <label>Entrecalles / Referencia</label>
              <input type="text" id="chk-entrecalles" placeholder="Ej: entre 14b y 15, portón verde" value="${esc(window._savedVecinoRef || '')}" oninput="window._savedVecinoRef=this.value">
            </div>
          </div>
        ` : ''}

        <!-- Elección de Medio de Pago -->
        <label style="display:block; font-size:0.8rem; font-weight:800; color:var(--text); margin-bottom:6px;">2. ¿Cómo preferís abonar?</label>
        <div class="option-grid">
          <div class="opt-card ${STATE.medioPago === 'TRANSFERENCIA' ? 'active' : ''}"
               onclick="STATE.medioPago='TRANSFERENCIA'; renderContenidoModalCheckout();">
            <div class="opt-title">🏦 Transferencia Bancaria</div>
            <div class="opt-sub">Alias: <strong>${esc(STATE.nodo.alias_bancario_display || 'pago.canasto')}</strong></div>
          </div>
          <div class="opt-card ${STATE.medioPago === 'EFECTIVO' ? 'active' : ''}"
               onclick="STATE.medioPago='EFECTIVO'; renderContenidoModalCheckout();">
            <div class="opt-title">💵 Efectivo al recibir / retirar</div>
            <div class="opt-sub">Abonás en mano al momento de la entrega</div>
          </div>
        </div>

        <!-- Totalizador -->
        <div style="background:#3e2519; color:#fffdfb; border-radius:14px; padding:13px 16px; margin-bottom:14px;">
          <div style="display:flex; justify-content:space-between; font-size:0.84rem; color:#d9c8bb; font-weight:700;">
            <span>Subtotal productos (${res.unidades} u.)</span>
            <span>${fmt(res.subtotal)}</span>
          </div>
          ${res.costoEnvio > 0 ? `
            <div style="display:flex; justify-content:space-between; font-size:0.84rem; color:#f5d0b5; margin-top:4px; font-weight:700;">
              <span>Envío a domicilio barrial</span>
              <span>+${fmt(res.costoEnvio)}</span>
            </div>
          ` : ''}
          <div style="display:flex; justify-content:space-between; font-size:1.2rem; font-weight:900; margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.16);">
            <span>Total a abonar</span>
            <span style="color:#fcd9bd;">${fmt(res.total)}</span>
          </div>
        </div>

        <button type="button" onclick="enviarPedidoVecinal()"
          style="width:100%; padding:13px; border-radius:12px; border:none; background:var(--brand); color:#ffffff; font-family:inherit; font-weight:900; font-size:1rem; cursor:pointer;">
          Confirmar mi Pedido
        </button>
      `;
    }

    async function enviarPedidoVecinal() {
      const res = calcularResumenCarrito();
      const nombre = (document.getElementById('chk-nombre')?.value || '').trim();
      const telefono = (document.getElementById('chk-telefono')?.value || '').trim();
      const direccion = (document.getElementById('chk-direccion')?.value || '').trim();
      const entrecalles = (document.getElementById('chk-entrecalles')?.value || '').trim();

      if (!nombre || !telefono) {
        alert('Por favor completá tu nombre y tu número de WhatsApp.');
        return;
      }
      if (STATE.modalidadEntrega === 'ENVIO_BARRIAL' && !direccion) {
        alert('Por favor ingresá tu dirección para el envío barrial.');
        return;
      }

      const payload = {
        vecino_nombre: nombre,
        vecino_telefono: telefono,
        modalidad_entrega: STATE.modalidadEntrega,
        direccion_entrega: direccion,
        entrecalles_referencia: entrecalles,
        medio_pago: STATE.medioPago,
        fecha_hora_simulada: calcularFechaSimuladaCorte(),
        items: res.detalle.map(d => ({
          oferta_id: d.oferta_id,
          cantidad: d.cantidad
        }))
      };

      const resp = await fetch(`/api/produccion/nodos/tienda/${encodeURIComponent(STATE.slug)}/pedido`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await resp.json();
      if (!resp.ok || !data.ok) {
        alert(data.error || 'No se pudo registrar el pedido.');
        return;
      }

      STATE.carrito = {};
      renderCatalogo();
      actualizarBarraCarrito();

      const ped = data.pedido;
      const pagoInfo = data.nodo_pago_info;
      if (ped) {
        guardarIdentidadVecinoLocal({
          portal_token: ped.portal_token || STATE.portalToken || '',
          telefono_normalizado: ped.telefono_normalizado || '',
          telefono_display: telefono || ped.vecino_telefono || '',
          nombre_completo: ped.vecino_nombre || nombre || '',
          direccion_calle: direccion || '',
          entrecalles_referencia: entrecalles || ''
        });
        if (ped.tracking_token) {
          guardarPedidoRecienteLocal({
            codigo_pedido: ped.codigo_pedido,
            tracking_token: ped.tracking_token,
            vecino_nombre: ped.vecino_nombre,
            created_at: ped.created_at || new Date().toISOString()
          });
          refrescarBannerPedidosRecientes();
        }
      }
      const box = document.getElementById('checkout-card-content');

      box.innerHTML = `
        <div style="text-align:center; padding:10px 4px;">
          <div style="font-size:2.6rem;">🎉</div>
          <h2 style="margin:6px 0; color:#15803d;">¡Pedido Confirmado! (${esc(ped.codigo_pedido)})</h2>
          <p style="margin:4px 0 14px 0; color:#475569; font-size:0.9rem;">
            Gracias <strong>${esc(ped.vecino_nombre)}</strong>. Tu pedido en <strong>${esc(pagoInfo.nombre_marca)}</strong> ya quedó agendado.
          </p>

          <div style="background:#f0fdf4; border:1px solid #86efac; border-radius:12px; padding:12px; text-align:left; font-size:0.86rem; margin-bottom:14px;">
            <div>📅 <strong>Fecha y ventana de entrega:</strong> ${esc(ped.fecha_entrega_label)}</div>

    let _ultimoPayloadWaTienda = null;

    async function enviarComprobanteWhatsAppPrueba(codigoPedido, vecinoNombre, nombreMarca, fechaEntrega, totalVecino, medioPago, aliasBancario, trackingToken = '') {

        destinatario_nombre: nombreMarca,
        telefono_original: '5492216615746',

        box.innerHTML = `

                📲 Enviar

              <button type="button" onclick="document.getElementById('etiqueta-confirmacion-preview').innerHTML=''"
                style="padding:10px 14px; border-radius:8px; border:1px solid #cbd5e1; background:#ffffff; color:#475569; font-weight:800; font-size:0.82rem; cursor:pointer;">

    // =========================================================================
    // SEGUIMIENTO EN VIVO MARCA BLANCA (CERO FRICCIÓN · SALTO EN 1 TOQUE)
    // =========================================================================
    let _trackingTimer = null;
    let _trackingTokenActivo = '';
    let _trackingWhatsappActivo = null; // { telefono, codigo_pedido }
    let _ultimoResultadoWhatsapp = null;

    function _storageKeyIdentidadVecino(slug) {
      return `nodo_identidad_vecino_${slug || STATE.slug || 'default'}`;
    }

    function obtenerIdentidadVecinoLocal(slug = STATE.slug) {
      let base = {};
      try {
        const raw = localStorage.getItem(_storageKeyIdentidadVecino(slug));
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') base = parsed;
        }
      } catch (_) {}
      try {
        const legacyPortal = (localStorage.getItem(_storageKeyMiCuentaToken(slug)) || '').trim();
        if (legacyPortal.length >= 16 && !base.portal_token) {
          base.portal_token = legacyPortal;
        }
      } catch (_) {}
      return base;
    }

    function guardarIdentidadVecinoLocal(parcial = {}, slug = STATE.slug) {
      try {
        const actual = obtenerIdentidadVecinoLocal(slug);
        const fusion = {
          portal_token: (parcial.portal_token && String(parcial.portal_token).trim().length >= 16)
            ? String(parcial.portal_token).trim()
            : (actual.portal_token || ''),
          telefono_normalizado: parcial.telefono_normalizado || actual.telefono_normalizado || '',
          telefono_display: parcial.telefono_display || actual.telefono_display || '',
          nombre_completo: parcial.nombre_completo || actual.nombre_completo || '',
          direccion_calle: parcial.direccion_calle !== undefined ? (parcial.direccion_calle || actual.direccion_calle || '') : (actual.direccion_calle || ''),
          entrecalles_referencia: parcial.entrecalles_referencia !== undefined ? (parcial.entrecalles_referencia || actual.entrecalles_referencia || '') : (actual.entrecalles_referencia || ''),
          updated_at: new Date().toISOString()
        };
        localStorage.setItem(_storageKeyIdentidadVecino(slug), JSON.stringify(fusion));

        if (fusion.portal_token) {
          STATE.portalToken = fusion.portal_token;
          localStorage.setItem(_storageKeyMiCuentaToken(slug), fusion.portal_token);
        }
        if (fusion.nombre_completo) window._savedVecinoNombre = fusion.nombre_completo;
        if (fusion.telefono_display || fusion.telefono_normalizado) {
          window._savedVecinoTel = fusion.telefono_display || fusion.telefono_normalizado;
        }
        if (fusion.direccion_calle) window._savedVecinoDir = fusion.direccion_calle;
        if (fusion.entrecalles_referencia) window._savedVecinoRef = fusion.entrecalles_referencia;
        actualizarBotonesCabeceraMiCuenta();
      } catch (_) {}
    }

    function _storageKeyPedidosVecino() {
      return `nodo_ultimos_pedidos_${STATE.slug || 'default'}`;
    }

    function obtenerPedidosRecientesLocal() {
      try {
        const raw = localStorage.getItem(_storageKeyPedidosVecino());
        if (!raw) return [];
        const arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr.filter(x => x && x.tracking_token) : [];
      } catch (_) {
        return [];
      }
    }

    function guardarPedidoRecienteLocal(info) {
      if (!info || !info.tracking_token) return;
      try {
        const lista = obtenerPedidosRecientesLocal().filter(x => x.tracking_token !== info.tracking_token);
        lista.unshift({
          codigo_pedido: info.codigo_pedido || '',
          tracking_token: info.tracking_token,
          vecino_nombre: info.vecino_nombre || '',
          created_at: info.created_at || new Date().toISOString()
        });
        localStorage.setItem(_storageKeyPedidosVecino(), JSON.stringify(lista.slice(0, 8)));
      } catch (_) {}
    }

    function descartarBannerPedidoLocal(token) {
      try {
        const lista = obtenerPedidosRecientesLocal().filter(x => x.tracking_token !== token);
        localStorage.setItem(_storageKeyPedidosVecino(), JSON.stringify(lista));
      } catch (_) {}
      refrescarBannerPedidosRecientes();
    }

    async function refrescarBannerPedidosRecientes() {
      const banner = document.getElementById('mis-pedidos-recientes-banner');
      if (!banner) return;
      const guardados = obtenerPedidosRecientesLocal();
      if (guardados.length === 0) {
        banner.style.display = 'none';
        return;
      }
      const ultimo = guardados[0];
      try {
        const resp = await fetch(`/api/produccion/nodos/tienda/${encodeURIComponent(STATE.slug)}/seguimiento/${encodeURIComponent(ultimo.tracking_token)}`, { cache: 'no-store' });
        const data = await resp.json();
        if (!resp.ok || !data.ok) {
          banner.style.display = 'none';
          return;
        }
        if (data.identidad_vecino) {
          guardarIdentidadVecinoLocal({
            portal_token: data.identidad_vecino.portal_token || '',
            telefono_normalizado: data.identidad_vecino.telefono_normalizado || '',
            telefono_display: data.identidad_vecino.telefono_whatsapp || '',
            nombre_completo: data.identidad_vecino.nombre_completo || ''
          });
        }
        const seg = data.seguimiento;
        const ped = data.pedido;
        if (seg.anulado || Number(seg.hito_actual || 1) >= 6) {
          banner.style.display = 'none';
          return;
        }
        const pasoActual = (seg.pasos || []).find(p => p.es_actual) || (seg.pasos || [])[0] || {};
        banner.style.display = 'flex';
        banner.innerHTML = `
          <div style="display:flex; align-items:center; gap:11px; min-width:0;">
            <div style="width:40px; height:40px; border-radius:12px; background:var(--brand-light); border:1px solid var(--brand-border); display:flex; align-items:center; justify-content:center; font-size:1.25rem; flex-shrink:0;">
              ${esc(pasoActual.icono || '📦')}
            </div>
            <div style="min-width:0;">
              <div style="font-size:0.74rem; font-weight:800; color:var(--brand-dark); text-transform:uppercase; letter-spacing:0.02em;">
                Tu pedido #${esc(ped.codigo_pedido)} · Paso ${Number(seg.paso_actual_orden || 1)} de ${Number(seg.total_pasos || 5)}
              </div>
              <div style="font-size:0.95rem; font-weight:900; color:var(--text);">
                ${esc(seg.titulo_estado_actual)}
              </div>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <button type="button" onclick="abrirSeguimientoPorToken('${esc(ped.tracking_token)}')"
              style="padding:8px 14px; border-radius:10px; border:none; background:var(--brand); color:#ffffff; font-family:inherit; font-weight:800; font-size:0.82rem; cursor:pointer;">
              📍 Ver en vivo →
            </button>
            <button type="button" title="Ocultar aviso" onclick="descartarBannerPedidoLocal('${esc(ped.tracking_token)}')"
              style="width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:#ffffff; color:var(--muted); font-weight:800; cursor:pointer;">
              &times;
            </button>
          </div>
        `;
      } catch (_) {
        banner.style.display = 'none';
      }
    }

    function formatearFechaHoraHito(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      if (Number.isNaN(d.getTime())) return '';
      const hoy = new Date();
      const esHoy = d.getFullYear() === hoy.getFullYear() &&
        d.getMonth() === hoy.getMonth() &&
        d.getDate() === hoy.getDate();
      const hhmm = d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
      if (esHoy) return `Hoy ${hhmm} hs`;
      const ddmm = d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' });
      return `${ddmm} · ${hhmm} hs`;
    }

    function detenerPollingSeguimiento() {
      if (_trackingTimer) {
        clearInterval(_trackingTimer);
        _trackingTimer = null;
      }
    }

    function cerrarModalSeguimiento() {
      detenerPollingSeguimiento();
      _trackingTokenActivo = '';
      _trackingWhatsappActivo = null;
      const modal = document.getElementById('tracking-modal');
      if (modal) modal.style.display = 'none';
      try {
        const url = new URL(window.location.href);
        if (url.searchParams.has('seguimiento')) {
          url.searchParams.delete('seguimiento');
          window.history.replaceState({}, '', url.pathname + (url.search || ''));
        }
      } catch (_) {}
      refrescarBannerPedidosRecientes();
    }

    function _convertirPedidoPortalATrackingPayload(pedHist, portalData) {
      return {
        modo_privacidad_enmascarada: false,
        nodo: portalData.nodo,
        pedido: {
          ...pedHist,
          vecino_nombre: portalData.vecino?.nombre_completo || 'Vecino/a'
        },
        items: pedHist.items || [],
        seguimiento: pedHist.seguimiento,
        total_pedidos_vecino: (portalData.historial_pedidos || []).filter(x => !x.anulado).length
      };
    }

    /**
     * Acción inteligente en 1 toque al tocar "📦 Seguir mi pedido" en el catálogo:
     * 1) Si el celular ya conoce al vecino (`portal_token`, `tracking_token` o WhatsApp previo):
     *    - 1 pedido en tránsito -> abre directo su seguimiento en vivo sin pasos intermedios.
     *    - 2+ pedidos en tránsito -> muestra tarjetas directas listas para tocar.
     *    - 0 en tránsito pero con historial -> salta directo a su resumen/último pedido en Mi Cuenta (o último pedido).
     * 2) Si es un navegador limpio -> pide únicamente el número de WhatsApp (sin código #NB-...).
     */
    async function accionBotonSeguirMiPedido() {
      detenerPollingSeguimiento();
      _trackingTokenActivo = '';
      _trackingWhatsappActivo = null;

      const identidad = obtenerIdentidadVecinoLocal();
      const portalTok = STATE.portalToken || identidad.portal_token || '';
      const guardadosLocal = obtenerPedidosRecientesLocal();
      const telGuardado = identidad.telefono_display || identidad.telefono_normalizado || '';

      // Caso 1A: Vecino identificado con portal_token (vino de QR Mi Cuenta, link de comprobante o compra previa)
      if (portalTok && portalTok.length >= 16) {
        STATE.portalToken = portalTok;
        const modal = document.getElementById('tracking-modal');
        const box = document.getElementById('tracking-card-content');
        if (modal && box) {
          modal.style.display = 'flex';
          box.innerHTML = `<div style="padding:32px; text-align:center; color:var(--muted); font-weight:800;">⏳ Abriendo el estado en vivo de tu pedido...</div>`;
        }

        try {
          const resp = await fetch(
            `/api/produccion/nodos/tienda/${encodeURIComponent(STATE.slug)}/mi-cuenta/${encodeURIComponent(portalTok)}`,
            { cache: 'no-store' }
          );
          const data = await resp.json();
          if (resp.ok && data.ok) {
            STATE.miCuentaData = data;
            if (data.vecino) {
              guardarIdentidadVecinoLocal({
                portal_token: portalTok,
                telefono_normalizado: data.vecino.telefono_normalizado || '',
                telefono_display: data.vecino.telefono_whatsapp || '',
                nombre_completo: data.vecino.nombre_completo || '',
                direccion_calle: data.vecino.direccion_calle || '',
                entrecalles_referencia: data.vecino.entrecalles_referencia || ''
              });
            }
            const activos = (data.historial_pedidos || []).filter(p => !p.anulado);
            for (const p of activos.slice(0, 5).reverse()) {
              if (p.tracking_token) {
                guardarPedidoRecienteLocal({
                  codigo_pedido: p.codigo_pedido,
                  tracking_token: p.tracking_token,
                  vecino_nombre: data.vecino?.nombre_completo || '',
                  created_at: p.created_at
                });
              }
            }

            const enTransito = activos.filter(p => Number(p.seguimiento?.hito_actual || 1) < 6);
            if (enTransito.length === 1) {
              _activarVistaSeguimientoConDatos(_convertirPedidoPortalATrackingPayload(enTransito[0], data));
              return;
            }
            if (enTransito.length >= 2) {
              renderizarSelectorPedidosVecino(enTransito, activos, data.nodo, { modoTokenCompleto: true });
              return;
            }
            if (activos.length > 0) {
              // Sin pedidos en tránsito pero con historial -> salto directo a Mi Cuenta
              if (modal) modal.style.display = 'none';
              await activarVistaMiCuenta();
              return;
            }
            // Vecino identificado sin pedidos aún -> llevar a su resumen en Mi Cuenta
            if (modal) modal.style.display = 'none';
            await activarVistaMiCuenta();
            return;
          }
        } catch (_) {}
      }

      // Caso 1B: Sin portal_token previo pero con tracking_token guardado en este celular
      if (guardadosLocal.length === 1) {
        await abrirSeguimientoPorToken(guardadosLocal[0].tracking_token);
        return;
      }
      if (guardadosLocal.length >= 2) {
        // Consultar el primero para hidratar portal_token y mostrar selector completo si corresponde
        await abrirSeguimientoPorToken(guardadosLocal[0].tracking_token);
        return;
      }

      // Caso 1C: Celular donde ya consultó antes con su WhatsApp (sin token) -> salto directo sin volver a tipear
      if (telGuardado && String(telGuardado).replace(/\D+/g, '').length >= 8) {
        await ejecutarConsultaPorWhatsapp(telGuardado, { desdeMemoriaAutomatica: true });
        return;
      }

      // Caso 2: Navegador limpio -> pedir únicamente el número de WhatsApp
      abrirFormularioSoloWhatsapp(false);
    }

    async function consultarDesdeInputSoloWhatsapp() {

    async function ejecutarConsultaPorWhatsapp(telefonoRaw, opciones = {}) {
      const tel = String(telefonoRaw || '').trim();
      const modal = document.getElementById('tracking-modal');
      const box = document.getElementById('tracking-card-content');
      const errBox = document.getElementById('trk-buscar-error');
      const btn = document.getElementById('btn-ejecutar-busqueda-trk');

      if (!tel || tel.replace(/\D+/g, '').length < 8) {
        if (errBox) {
          errBox.textContent = 'Ingresá tu número de WhatsApp con código de área (ej: 221 501 1102).';
          errBox.style.display = 'block';
        } else {
          abrirFormularioSoloWhatsapp(false);
        }
        return;
      }

      if (errBox) errBox.style.display = 'none';
      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Buscando tu pedido...';
      } else if (modal && box && !opciones.silenciosoPolling) {
        modal.style.display = 'flex';
        box.innerHTML = `<div style="padding:32px; text-align:center; color:var(--muted); font-weight:800;">⏳ Consultando el estado en vivo de tu pedido...</div>`;
      }

      try {
        const resp = await fetch(`/api/produccion/nodos/tienda/${encodeURIComponent(STATE.slug)}/seguimiento-whatsapp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            telefono: tel,
            codigo_pedido: opciones.codigoPedidoEspecifico || ''
          })
        });
        const data = await resp.json();
        if (!resp.ok || !data.ok) {
          if (opciones.desdeMemoriaAutomatica) {
            abrirFormularioSoloWhatsapp(false);
            return;
          }
          if (errBox) {
            errBox.textContent = data.error || 'No encontramos pedidos asociados a ese WhatsApp.';
            errBox.style.display = 'block';
          }
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'Ver estado de mi pedido →';
          }
          return;
        }

        _ultimoResultadoWhatsapp = data;

        // Si cambió de WhatsApp en un navegador que tenía otro vecino, actualizar solo el teléfono recordado
        if (opciones.desdeFormularioManual) {
          const idActual = obtenerIdentidadVecinoLocal();
          const cambioTelefono = idActual.telefono_normalizado && idActual.telefono_normalizado !== data.telefono_normalizado;
          if (cambioTelefono) {
            try {
              localStorage.removeItem(_storageKeyMiCuentaToken(STATE.slug));
              localStorage.removeItem(_storageKeyPedidosVecino());
              STATE.portalToken = '';
              STATE.miCuentaData = null;
            } catch (_) {}
          }
        }

        guardarIdentidadVecinoLocal({
          telefono_normalizado: data.telefono_normalizado,
          telefono_display: tel
        });

        const enTransito = Array.isArray(data.pedidos_en_transito) ? data.pedidos_en_transito : [];
        const todos = Array.isArray(data.pedidos_todos) ? data.pedidos_todos : [];

        if (opciones.codigoPedidoEspecifico && data.pedido_especifico) {
          _activarVistaSeguimientoPorWhatsapp(data.pedido_especifico, tel, todos.length);
          return;
        }

        // 1 único pedido en tránsito -> abrir directo en 1 paso
        if (enTransito.length === 1) {
          _activarVistaSeguimientoPorWhatsapp(enTransito[0], tel, todos.length);
          return;
        }

        // 2 o más pedidos en tránsito -> mostrar selector directo para elegir con 1 toque
        if (enTransito.length >= 2) {
          renderizarSelectorPedidosVecino(
            enTransito.map(x => ({ ...x.pedido, items: x.items, seguimiento: x.seguimiento })),
            todos.map(x => ({ ...x.pedido, items: x.items, seguimiento: x.seguimiento })),
            data.nodo,
            { modoTokenCompleto: false, telefonoWhatsapp: tel }
          );
          return;
        }

        // Sin pedidos en tránsito pero con pedido reciente -> abrir directo el más reciente (o selector si > 1)
        if (todos.length === 1) {
          _activarVistaSeguimientoPorWhatsapp(todos[0], tel, 1);
          return;
        }
        if (todos.length > 1) {
          renderizarSelectorPedidosVecino(
            [],
            todos.map(x => ({ ...x.pedido, items: x.items, seguimiento: x.seguimiento })),
            data.nodo,
            { modoTokenCompleto: false, telefonoWhatsapp: tel }
          );
        }
      } catch (_) {
        if (errBox) {
          errBox.textContent = 'Error de conexión al consultar tu pedido.';
          errBox.style.display = 'block';
        }
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Ver estado de mi pedido →';
        }
      }
    }

    function _activarVistaSeguimientoPorWhatsapp(itemWa, telefonoUsado, totalPedidos = 1) {
      _trackingTokenActivo = '';
      _trackingWhatsappActivo = {
        telefono: telefonoUsado,
        codigo_pedido: itemWa.pedido.codigo_pedido
      };

      if (itemWa.nodo?.color_primario) {
        aplicarPaletaTienda(itemWa.nodo.color_primario);
      }

      renderizarVistaSeguimientoEnVivo({
        ...itemWa,
        modo_privacidad_enmascarada: true,
        total_pedidos_vecino: totalPedidos
      });

      detenerPollingSeguimiento();
      if (!itemWa.seguimiento?.anulado && Number(itemWa.seguimiento?.hito_actual || 1) < 6) {
        _trackingTimer = setInterval(() => {
          refrescarSeguimientoWhatsappActivo(true);
        }, 15000);
      }
    }

    async function refrescarSeguimientoWhatsappActivo(silencioso = true) {
      if (!_trackingWhatsappActivo) return;
      await ejecutarConsultaPorWhatsapp(_trackingWhatsappActivo.telefono, {
        codigoPedidoEspecifico: _trackingWhatsappActivo.codigo_pedido,
        silenciosoPolling: silencioso
      });
    }

    function abrirPedidoDesdeSelectorWhatsapp(codigoPedido) {
      if (!_ultimoResultadoWhatsapp) return;
      const todos = _ultimoResultadoWhatsapp.pedidos_todos || [];
      const elegido = todos.find(x => x.pedido.codigo_pedido === codigoPedido);
      if (!elegido) return;
      const idLocal = obtenerIdentidadVecinoLocal();
      _activarVistaSeguimientoPorWhatsapp(
        elegido,
        idLocal.telefono_display || _ultimoResultadoWhatsapp.telefono_normalizado,
        todos.length
      );
    }

    async function verMisOtrosPedidosDesdeSeguimiento() {
      detenerPollingSeguimiento();
      if (STATE.portalToken) {
        if (!STATE.miCuentaData) {
          try {
            const resp = await fetch(
              `/api/produccion/nodos/tienda/${encodeURIComponent(STATE.slug)}/mi-cuenta/${encodeURIComponent(STATE.portalToken)}`,
              { cache: 'no-store' }
            );
            const data = await resp.json();
            if (resp.ok && data.ok) {
              STATE.miCuentaData = data;
            }
          } catch (_) {}
        }
        if (STATE.miCuentaData) {
          const activos = (STATE.miCuentaData.historial_pedidos || []).filter(p => !p.anulado);
          const enTransito = activos.filter(p => Number(p.seguimiento?.hito_actual || 1) < 6);
          if (activos.length > 1) {
            renderizarSelectorPedidosVecino(enTransito, activos, STATE.miCuentaData.nodo, { modoTokenCompleto: true });
            return;
          }
          cerrarModalSeguimiento();
          await activarVistaMiCuenta();
          return;
        }
      }
      if (_ultimoResultadoWhatsapp && Array.isArray(_ultimoResultadoWhatsapp.pedidos_todos) && _ultimoResultadoWhatsapp.pedidos_todos.length > 0) {
        const todos = _ultimoResultadoWhatsapp.pedidos_todos;
        const enTransito = _ultimoResultadoWhatsapp.pedidos_en_transito || [];
        renderizarSelectorPedidosVecino(
          enTransito.map(x => ({ ...x.pedido, items: x.items, seguimiento: x.seguimiento })),
          todos.map(x => ({ ...x.pedido, items: x.items, seguimiento: x.seguimiento })),
          _ultimoResultadoWhatsapp.nodo,
          { modoTokenCompleto: false }
        );
        return;
      }
      abrirFormularioSoloWhatsapp(true);
    }

    async function abrirSeguimientoPorToken(token, silencioso = false) {
      const cleanTok = String(token || '').trim();
      if (!cleanTok) return;
      const modal = document.getElementById('tracking-modal');
      const box = document.getElementById('tracking-card-content');
      if (!modal || !box) return;

      if (!silencioso) {
        modal.style.display = 'flex';
        box.innerHTML = `<div style="padding:32px; text-align:center; color:var(--muted); font-weight:800;">⏳ Cargando estado en vivo de tu pedido...</div>`;
      }

      try {
        const resp = await fetch(`/api/produccion/nodos/tienda/${encodeURIComponent(STATE.slug)}/seguimiento/${encodeURIComponent(cleanTok)}`, {
          cache: 'no-store'
        });
        const data = await resp.json();
        if (!resp.ok || !data.ok) {
          if (!silencioso) {
            abrirFormularioSoloWhatsapp(false);
          }
          return;
        }

        if (data.identidad_vecino) {
          guardarIdentidadVecinoLocal({
            portal_token: data.identidad_vecino.portal_token || '',
            telefono_normalizado: data.identidad_vecino.telefono_normalizado || '',
            telefono_display: data.identidad_vecino.telefono_whatsapp || '',
            nombre_completo: data.identidad_vecino.nombre_completo || data.pedido?.vecino_nombre || ''
          });
        }

        guardarPedidoRecienteLocal({
          codigo_pedido: data.pedido.codigo_pedido,
          tracking_token: data.pedido.tracking_token,
          vecino_nombre: data.pedido.vecino_nombre,
          created_at: data.pedido.created_at
        });
        _activarVistaSeguimientoConDatos(data);
      } catch (_) {
        if (!silencioso) {
          box.innerHTML = `<div style="padding:24px; text-align:center; color:#b91c1c; font-weight:800;">No se pudo actualizar el seguimiento. Verificá tu conexión.</div>`;
        }
      }
    }

    function _activarVistaSeguimientoConDatos(data) {
      const tok = data.pedido?.tracking_token || '';
      _trackingTokenActivo = tok;
      _trackingWhatsappActivo = null;

      const modal = document.getElementById('tracking-modal');
      if (modal) modal.style.display = 'flex';

      if (data.nodo?.color_primario) {
        aplicarPaletaTienda(data.nodo.color_primario);
      }

      if (tok) {
        try {
          const url = new URL(window.location.href);
          url.searchParams.set('seguimiento', tok);
          window.history.replaceState({}, '', url.pathname + url.search);
        } catch (_) {}
      }

      renderizarVistaSeguimientoEnVivo(data);

      detenerPollingSeguimiento();
      if (!data.seguimiento.anulado && Number(data.seguimiento.hito_actual) < 6 && tok) {
        _trackingTimer = setInterval(() => {
          if (_trackingTokenActivo) {
            abrirSeguimientoPorToken(_trackingTokenActivo, true);
          }
        }, 15000);
      }
    }

      const tieneTok = Boolean(ped.tracking_token);

        ? `${window.location.origin}/tienda/${encodeURIComponent(nodo.slug || STATE.slug)}?seguimiento=${encodeURIComponent(ped.tracking_token)}`

      const accionRefrescar = tieneTok

      const mostrarVerOtrosPedidos = Boolean(

    // =========================================================================
    // PORTAL PERSONAL MARCA BLANCA: "MI CUENTA / MIS PEDIDOS" (QR CLIENTE)
    // =========================================================================
    let _miCuentaTimer = null;

    function _storageKeyMiCuentaToken(slug) {
      return `nodo_mi_cuenta_token_${slug || STATE.slug || 'default'}`;
    }

    function detectarPortalTokenEnUrl() {
      const params = new URLSearchParams(window.location.search);
      const qTok = (params.get('mi_cuenta') || '').trim();
      if (qTok.length >= 16) {
        return { token: qTok, abrirDirecto: true };
      }
      const parts = window.location.pathname.split('/').filter(Boolean);
      const idx = parts.indexOf('tienda');
      if (idx !== -1 && parts[idx + 2] && parts[idx + 2].toLowerCase() === 'mi-cuenta' && parts[idx + 3]) {
        const pTok = decodeURIComponent(parts[idx + 3]).trim();
        if (pTok.length >= 16) {
          return { token: pTok, abrirDirecto: true };
        }
      }
      try {
        const saved = (localStorage.getItem(_storageKeyMiCuentaToken(STATE.slug)) || '').trim();
        if (saved.length >= 16) {
          return { token: saved, abrirDirecto: false };
        }
      } catch (_) {}
      return { token: '', abrirDirecto: false };
    }

    function actualizarBotonesCabeceraMiCuenta() {
      const btnToggle = document.getElementById('btn-toggle-mi-cuenta');
      const btnSeguir = document.getElementById('btn-seguir-pedido-header');
      if (!btnToggle) return;

      if (!STATE.portalToken) {
        btnToggle.style.display = 'none';
        if (btnSeguir) btnSeguir.style.display = 'inline-flex';
        return;
      }

      btnToggle.style.display = 'inline-flex';
      if (STATE.vistaMiCuentaActiva) {
        btnToggle.innerHTML = '🛒 Ir al Catálogo';
        if (btnSeguir) btnSeguir.style.display = 'none';
      } else {
        const nombreCorto = STATE.miCuentaData?.vecino?.nombre_completo
          ? STATE.miCuentaData.vecino.nombre_completo.split(/\s+/)[0]
          : 'Mi Cuenta';
        btnToggle.innerHTML = `👤 ${esc(nombreCorto)} · Mi Cuenta`;
        if (btnSeguir) btnSeguir.style.display = 'inline-flex';
      }
    }

    function detenerPollingMiCuenta() {
      if (_miCuentaTimer) {
        clearInterval(_miCuentaTimer);
        _miCuentaTimer = null;
      }
    }

    async function activarVistaMiCuenta() {
      if (!STATE.portalToken) return;
      STATE.vistaMiCuentaActiva = true;
      const mcView = document.getElementById('mi-cuenta-view');
      const catWrap = document.getElementById('catalogo-tienda-wrapper');
      const cartBar = document.getElementById('cart-bar');
      if (mcView) mcView.style.display = 'flex';
      if (catWrap) catWrap.style.display = 'none';
      if (cartBar) cartBar.style.display = 'none';

      try {
        window.history.replaceState({}, '', `/tienda/${encodeURIComponent(STATE.slug)}/mi-cuenta/${encodeURIComponent(STATE.portalToken)}`);
      } catch (_) {}

      actualizarBotonesCabeceraMiCuenta();
      await cargarPortalMiCuenta(false);

      detenerPollingMiCuenta();
      _miCuentaTimer = setInterval(() => {
        if (STATE.vistaMiCuentaActiva && STATE.portalToken) {
          cargarPortalMiCuenta(true);
        }
      }, 15000);
    }

    function irACatalogoDesdeMiCuenta() {
      detenerPollingMiCuenta();
      STATE.vistaMiCuentaActiva = false;
      const mcView = document.getElementById('mi-cuenta-view');
      const catWrap = document.getElementById('catalogo-tienda-wrapper');
      if (mcView) mcView.style.display = 'none';
      if (catWrap) catWrap.style.display = 'block';

      try {
        window.history.replaceState({}, '', `/tienda/${encodeURIComponent(STATE.slug)}`);
      } catch (_) {}

      actualizarBotonesCabeceraMiCuenta();
      actualizarBarraCarrito();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function alternarVistaMiCuenta() {
      if (STATE.vistaMiCuentaActiva) {
        irACatalogoDesdeMiCuenta();
      } else {
        activarVistaMiCuenta();
      }
    }

    async function cargarPortalMiCuenta(silencioso = false) {
      if (!STATE.portalToken) return;
      const mcView = document.getElementById('mi-cuenta-view');
      if (mcView && !silencioso && !STATE.miCuentaData) {
        mcView.innerHTML = `
          <div class="mc-card" style="text-align:center; padding:34px 18px; color:var(--muted); font-weight:800;">
            ⏳ Cargando tu cuenta y el estado en vivo de tus pedidos...
          </div>
        `;
      }

      try {
        const resp = await fetch(
          `/api/produccion/nodos/tienda/${encodeURIComponent(STATE.slug)}/mi-cuenta/${encodeURIComponent(STATE.portalToken)}`,
          { cache: 'no-store' }
        );
        const data = await resp.json();
        if (!resp.ok || !data.ok) {
          if (!silencioso && mcView) {
            mcView.innerHTML = `
              <div class="mc-card" style="text-align:center; padding:28px 18px;">
                <div style="font-size:2rem; margin-bottom:6px;">🔎</div>
                <h3 style="margin:0 0 6px 0;">Enlace personal no disponible</h3>
                <p style="font-size:0.88rem; color:var(--muted); margin:0 0 14px 0;">${esc(data.error || 'Verificá el código QR con el coordinador de tu barrio.')}</p>
                <button type="button" onclick="STATE.portalToken=''; irACatalogoDesdeMiCuenta();"
                  style="padding:10px 18px; border-radius:10px; border:none; background:var(--brand); color:#ffffff; font-family:inherit; font-weight:900; cursor:pointer;">
                  🛒 Ir al catálogo de la tienda
                </button>
              </div>
            `;
          }
          return;
        }

        STATE.miCuentaData = data;
        try {
          localStorage.setItem(_storageKeyMiCuentaToken(data.nodo?.slug || STATE.slug), STATE.portalToken);
        } catch (_) {}

        // Persistir identidad y pedidos activos del vecino en este celular (habilita salto en 1 toque en el catálogo)
        if (data.vecino) {
          guardarIdentidadVecinoLocal({
            portal_token: STATE.portalToken,
            telefono_normalizado: data.vecino.telefono_normalizado || '',
            telefono_display: data.vecino.telefono_whatsapp || '',
            nombre_completo: data.vecino.nombre_completo || '',
            direccion_calle: data.vecino.direccion_calle || '',
            entrecalles_referencia: data.vecino.entrecalles_referencia || ''
          }, data.nodo?.slug || STATE.slug);
        }
        if (Array.isArray(data.historial_pedidos)) {
          const activosSync = data.historial_pedidos.filter(p => !p.anulado && p.tracking_token);
          for (const p of activosSync.slice(0, 5).reverse()) {
            guardarPedidoRecienteLocal({
              codigo_pedido: p.codigo_pedido,
              tracking_token: p.tracking_token,
              vecino_nombre: data.vecino?.nombre_completo || '',
              created_at: p.created_at
            });
          }
          if (!STATE.vistaMiCuentaActiva) {
            refrescarBannerPedidosRecientes();
          }
        }

        if (data.nodo?.color_primario) {
          aplicarPaletaTienda(data.nodo.color_primario);
        }
        if (data.nodo?.nombre_marca && STATE.vistaMiCuentaActiva) {
          document.title = `Mi Cuenta · ${data.nodo.nombre_marca}`;
        }

        actualizarBotonesCabeceraMiCuenta();
        if (STATE.vistaMiCuentaActiva) {
          renderizarPortalMiCuenta(data);
        }
      } catch (_) {
        if (!silencioso && mcView && !STATE.miCuentaData) {
          mcView.innerHTML = `<div class="mc-card" style="text-align:center; color:#b91c1c; font-weight:800;">Error de conexión al consultar tu cuenta.</div>`;
        }
      }
    }

    function renderizarPortalMiCuenta(data) {
      const mcView = document.getElementById('mi-cuenta-view');
      if (!mcView) return;

      const nodo = data.nodo || {};
      const vec = data.vecino || {};
      const res = data.resumen_cuenta || {};

      const alDia = Boolean(res.al_dia);

                  </div>

                <button type="button" onclick="navigator.clipboard.writeText('${esc(nodo.alias_bancario_display || 'pago.canasto')}'); this.textContent='✅ ¡Alias copiado!';"
                  style="padding:9px 15px; border-radius:10px; border:none; background:#2563eb; color:#ffffff; font-family:inherit; font-weight:900; font-size:0.82rem; cursor:pointer; white-space:nowrap;">

        bloqueInstruccionPagoHtml = `

      if (pedDest) {

        const esEntregado = !seg.anulado && Number(seg.hito_actual) >= 6;
        const pct = seg.anulado
          ? 0
          : Math.min(100, Math.max(12, Math.round((Number(seg.paso_actual_orden || 1) / Math.max(1, Number(seg.total_pasos || 5))) * 100)));

                </div>
                <h2 style="margin:2px 0 0 0; font-size:1.15rem; font-weight:900; color:var(--text);">
                  Pedido #${esc(pedDest.codigo_pedido)} · ${fmt(pedDest.total_vecino)}
                </h2>

      if (tokInicial) {
        abrirSeguimientoPorToken(tokInicial);
